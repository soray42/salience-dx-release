seed_id: T1-001
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: بدأ نظام CI لدينا يفشل يوم الثلاثاء. اختبارات الوحدة، والـ linting، وعملية
  البناء لا تزال تنجح. تظهر الأخطاء فقط عندما تحاول مرحلة الـ integration التواصل
  مع نسخة Postgres المرحلية؛ والخطأ مجرد انتهاء مهلة الاتصال بعد 30 ثانية. لم نغيّر
  الاختبارات أو مخطط قاعدة البيانات مؤخراً. {DS}
focal_diagnostic_feature: اتصال عداء الـ CI بمنفذ Postgres ينتهي بانتهاء المهلة قبل
  إجراء أي مصادقة أو استعلام لقاعدة البيانات.
low_diagnostic_proposition: A comparable timeout at another company was attributed
  to an ORM connection-pool setting.
oracle_action: ASK
oracle_focus: Treat this as a reachability problem between CI and the staging replica;
  check DNS, firewall/security-group rules, routing, NAT/VPN, and DB port access from
  the runner.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the outside ORM story. Ask for direct connectivity
  checks from the CI runner to the replica before diagnosing application code.
