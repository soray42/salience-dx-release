variants:
  HL:
    distractor: ماركو في إحدى شركات الـ fintech الأخرى أقسم أن نظام CI لديهم عانى
      من نفس انتهاء المهلة الشهر الماضي؛ وبعد يومين اكتشفوا أن إعداد واحداً في pool
      اتصال الـ ORM كان محدوداً بالضبط عند اتصال واحد فقط.
    diagnosticity: low
    salience: high
    proposition: A comparable timeout at another company was attributed to an ORM
      connection-pool setting.
    salience_source: named third party, exact setting value, similar error label
    why_plausible: The same visible symptom, 'connection timeout', makes the outside
      anecdote feel portable.
    why_irrelevant: The story is from a different stack and points to application
      pooling; the current failure occurs before database authentication and is isolated
      to runner-to-replica reachability.
  LL:
    distractor: شخص ما في شركة أخرى واجه انتهاء مهلة في CI نُسب إلى إعداد pool اتصال
      الـ ORM.
    diagnosticity: low
    salience: low
    proposition: A comparable timeout at another company was attributed to an ORM
      connection-pool setting.
    matched_to: HL
  HH:
    distractor: من عداء الـ CI، يتوقف الـ socket حتى تنتهي مهلة الـ 30 ثانية قبل أن
      تتلقى Postgres حتى محاولة تسجيل الدخول؛ فلا يصل الأمر أبداً إلى النقطة التي
      يمكن فيها لإعداد pool الـ ORM أن يكون مهماً.
    diagnosticity: high
    salience: high
    proposition: Connectivity from the CI runner to the Postgres port times out before
      any database authentication or query runs.
    salience_source: precise protocol-stage detail
  LH:
    distractor: اتصال TCP مباشر من عداء الـ CI إلى نقطة نهاية Postgres ينتهي بانتهاء
      المهلة قبل بدء عملية المصادقة.
    diagnosticity: high
    salience: low
    proposition: Connectivity from the CI runner to the Postgres port times out before
      any database authentication or query runs.
    matched_to: HH
distractor_direction:
  label: خطأ في إعداد pool اتصال الـ ORM
  description: استنفاد pool الاتصالات على جانب التطبيق، أو تسرّبها، أو إعداد المهلة
    الخاطئ، مما يتسبب في أعراض انتهاء مهلة CI الملاحظة.
plausible_alternative_directions:
- label: تشبّع قاعدة بيانات Postgres المرحلية
  description: نسخة Postgres المرحلية وصلت إلى حدود الاتصال أو المعالج أو الإدخال/الإخراج
    أو القفل، وتنتهي مهلة اتصال العملاء بصورة مستقلة عن كود التطبيق.
- label: انجراف بيئة عداء الـ CI
  description: صورة العداء، أو الأسرار، أو متغيرات البيئة، أو إعداد الخروج تباعدت
    عن آخر بناء ناجح.
