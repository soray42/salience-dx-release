distractor_direction:
  label: ضرر من التعرض للسوائل
  description: التحقيق فيما إذا كان التلامس مع السائل قد أتلف مسار الشحن أو البطارية
    أو دوائر المنفذ في الهاتف.
plausible_alternative_directions:
- label: عطل في الكابل أو المحول
  description: كابل الشاحن أو محول الحائط معطوب أو غير متوافق أو لا يوصل تياراً كافياً.
- label: خلل في معايرة البطارية
  description: مؤشر نسبة البطارية في البرنامج قديم أو غير مُعاير بشكل صحيح على الرغم
    من اكتشاف الشحن.
