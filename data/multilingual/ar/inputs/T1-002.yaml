    distractor: بريا كان لديها هاتف يُظهر أيقونة الشحن لكنه ظل متجمداً عند 12%؛ واكتشفت
      لاحقاً أنه انزلق في حوض غسيل مليء بالماء والصابون الأسبوع الماضي يوم الأحد.
    diagnosticity: low
