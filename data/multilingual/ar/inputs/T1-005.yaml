xbase: لديّ عرض لدور جديد. الراتب الأساسي أعلى بشكل ملحوظ من راتبي الحالي، والشركة
  لديها بيانات مالية عامة، وخطها الرئيسي من المنتجات يبدو مستقراً. أنا أحب فريقي الحالي
  لكنني غير متأكد مما إذا كان البقاء يخدم مساري على المدى البعيد. {DS}
focal_diagnostic_feature: الدور الحالي ليس له مسار ترقي محدد رغم التقييمات القوية،
  في حين يمتلك الدور الجديد سُلّم ترقي مكتوباً.
low_diagnostic_proposition: A comparable job move by an acquaintance ended badly because
