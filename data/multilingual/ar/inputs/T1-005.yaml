- label: قيمة البقاء في الفريق الحالي
  description: ما إذا كان البقاء مع الفريق الحالي يوفر مزايا الإرشاد أو الدعم أو التنقل
    الداخلي.
- label: عدم تطابق نطاق الدور
  description: ما إذا كانت المسمى الوظيفي للدور الجديد والمسؤوليات الفعلية تختلف عن
    التوجه المهني للمستخدم.
