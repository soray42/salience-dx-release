variants:
  HL:
    distractor: حاسوب توم المحمول كان يصدر صوتًا كمجفف الشعر الصيف الماضي؛ كانت غرفته
      عند 35 درجة مئوية لأن مكيف الهواء في الشقة المستأجرة كان معطلًا.
    diagnosticity: low
    salience: high
    proposition: A comparable fan-noise issue elsewhere was caused by high room temperature.
    salience_source: named friend, concrete room temperature, vivid sound comparison
    why_plausible: Heat plus fan noise makes the external-temperature story feel relevant.
    why_irrelevant: The user's CPU is not busy; direct vent obstruction is a better
      diagnostic cue than another person's hot room.
  LL:
    distractor: أحد المعارف واجه مشكلة ضجيج مراوح في حاسوبه المحمول وعُزيت إلى ارتفاع
      درجة حرارة المحيط.
    diagnosticity: low
    salience: low
    proposition: A comparable fan-noise issue elsewhere was caused by high room temperature.
    matched_to: HL
  HH:
    distractor: شبكة المراوح مغطاة بطبقة من الغبار الرمادي السميك لدرجة أنني بالكاد
      أستطيع الرؤية من خلال الفتحات إلى المروحة في الداخل.
    diagnosticity: high
    salience: high
    proposition: The fan grille and intake area are visibly packed with dust.
    salience_source: visible obstruction of cooling path
  LH:
    distractor: شبكة المراوح تُظهر تراكمًا ملحوظًا من الغبار قد يُقيّد تدفق الهواء.
    diagnosticity: high
    salience: low
    proposition: The fan grille and intake area are visibly packed with dust.
    matched_to: HH
distractor_direction:
