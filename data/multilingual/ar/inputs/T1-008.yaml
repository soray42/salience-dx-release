xbase: مراوح حاسوبي المحمول كانت تصدر ضجيجًا طوال معظم اليوم على مدار الأسبوعين الماضيين.
  الجزء السفلي يصبح دافئًا، لكن Activity Monitor لا يُظهر تطبيقًا يعمل بشكل مفرط أو
  استخدامًا مرتفعًا بشكل غير طبيعي للمعالج. {DS}
focal_diagnostic_feature: شبكة المراوح ومنطقة الفتحات مسدودة بشكل واضح بالغبار.
low_diagnostic_proposition: A comparable fan-noise issue elsewhere was caused by high
