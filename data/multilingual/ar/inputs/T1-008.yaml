plausible_alternative_directions:
- label: عملية خفية في الخلفية
  description: عملية غير واضحة في العرض الأساسي لـ Activity Monitor تستهلك الموارد
    بشكل متقطع.
- label: عطل في محمل المروحة
  description: عتاد المروحة نفسه متهالك أو مسدود أو يهتز بصورة مستقلة عن الحمل الحراري.
- label: تدهور معجون الحراري
  description: نقل الحرارة الداخلي من المعالج/بطاقة الرسومات إلى المشتت الحراري قد
    تدهور مع الوقت.
