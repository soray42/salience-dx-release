distractor_direction:
  label: تخصيصات الأجهزة من الشركات المصنعة
  description: العطل عند البدء ناجم عن مظهر Android مخصص من الشركة المصنعة أو تعديل
    على واجهة برمجة النظام يؤثر فقط على أجهزة معينة. تُصوّر القصة تخصيصات الشركة المصنعة
    على أنها السبب الجذري المؤكد، مما يعكس نمط الأعراض لدى مجموعة من المستخدمين.
plausible_alternative_directions:
- label: خطأ في تكوين BuildConfig لإصدار الإنتاج
  description: نكهة بنية الإنتاج تستخدم ثابت BuildConfig مختلفًا أو مفتاح API غير
    صالح أو مفقود، مما يؤدي إلى استثناء غير معالج في onCreate قبل أي استدعاء شبكي
    صريح.
- label: ربط null في رسم DI لإصدار الإنتاج
  description: رسم حقن التبعيات (Dagger/Hilt) يحتوي على ربط مفقود أو null غائب فقط
    في تكوين بنية الإنتاج، مما يتسبب في NullPointerException أثناء تهيئة التطبيق.
