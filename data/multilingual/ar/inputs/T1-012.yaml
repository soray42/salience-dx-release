domain: technical_troubleshooting
complexity: high
xbase: مجموعة Kafka المستهلكة لديّ تُظهر تأخرًا متزايدًا على القسم 7 منذ 48 ساعة في
  حين تبقى جميع الأقسام التسعة الأخرى ثابتة تحت 500 رسالة. جميع المستهلكين على نفس
  الإصدار وإعدادات JVM، ولم تُعيد المجموعة التوازن منذ بدأت المشكلة. لم أحدد بعد ما
  الذي يُقيّد القسم 7. {DS}
focal_diagnostic_feature: Broker-2، قائد القسم 7، يعمل عند 95% استخدام لإدخال/إخراج
