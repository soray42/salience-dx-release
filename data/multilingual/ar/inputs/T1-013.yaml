xbase: 'منظومة التحكم الحراري الذكية لديّ مضبوطة على تشغيل التدفئة في الساعة 6:30
  صباحاً أيام الأسبوع. كل صباح أنزل إلى طابق سفلي بارد — لم يعمل المرجل قط. لكن إذا
  ذهبت إلى جهاز التحكم الحراري وطلبت التدفئة يدوياً، يشتعل المرجل في غضون ثلاثين ثانية،
  دون أي مشكلة. تحققت من الجدول الزمني في التطبيق ثلاث مرات ويبدو صحيحاً: أيام الأسبوع،
  6:30 صباحاً، 20 درجة. أشار زميل في العمل إلى أن جهازه للتحكم الحراري كان يفعل الشيء
  ذاته في السابق. {DS}'
