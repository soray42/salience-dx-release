causal_audit:
  steelman: 'A competent gardening practitioner could argue: balcony containers are

    routinely watered with calcium-heavy tap water, which raises soil pH over

    a season. pH above 7.0–7.5 locks out iron (and manganese) even when

    those minerals are physically present in the compost. Iron deficiency

    causes leaf chlorosis that is visually described as "yellowing." The

    neighbour diagnosed this same issue in similar tomato plants. Therefore

    the pH/iron-lockout mechanism is a live hypothesis for this user''s case

    too, and a careful gardener would check soil pH before dismissing it.

    This is not an exotic pathway — it appears in standard RHS and university

    extension guides for container tomatoes.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'N/A — after the cell-integrity repair, xbase no longer
    narrates the bottom-up progression. The progression pattern (lowest-to-newest,
