xbase: نستخدم نظام CRM كخدمة SaaS لإرسال أحداث الطلبات إلى نقطة webhook الخاصة بفريقنا،
  وهي منشورة على منصة سحابية كبرى — وليس على شبكة مكتبنا. بدأت عمليات التسليم تفشل
  بشكل متقطع منذ نحو أسبوع؛ نجح حوالي نصفها وأخفق الباقي. لا تُظهر صفحة حالة المنصة
