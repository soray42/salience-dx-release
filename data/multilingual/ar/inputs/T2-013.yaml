domain: technical_troubleshooting
complexity: high
xbase: 'على مدار الأسبوع الماضي، بات خط أنابيب CI الخاص بنا يصطدم بأخطاء HTTP 503
  ''SlowDown'' عند كل عملية رفع للحزم إلى حاوية التخزين السحابي. اسم الحاوية وبيانات
  اعتماد IAM لم تتغير، إذن لم تطرأ أي تعديلات على إعدادات الحساب. بدأ التقييد في اليوم
  ذاته الذي أعلنت فيه الشركة علنًا عن إعادة تسمية العلامة التجارية — اسم جديد، شعار
  جديد — ولم يتوقف منذ ذلك الحين.

  {DS}'
focal_diagnostic_feature: جرى إعادة هيكلة خط الأنابيب قبل أسبوعين لتوزيع مهام الاختبار
  على 32 شريحة اختبار متوازية، مما ضاعف طلبات PUT المتزامنة لكل بادئة إلى مستوى يتجاوز
  حد معدل الطلبات الافتراضي للبادئة في حساب التخزين السحابي.
low_diagnostic_proposition: 'The upload throttling began because of the company''s
  rebrand announcement.

  '
oracle_action: ANSWER
oracle_focus: 'Investigate the per-prefix PUT request rate introduced by the 32-shard
  parallelism refactor; add request-rate-aware retry/backoff, spread uploads across
  multiple prefixes, or request a quota increase from the cloud provider.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Ask for evidence of what changed in the CI pipeline
  or cloud account around the time throttling began; note that a rebrand announcement
  (new name/logo) with unchanged bucket names and credentials has no infrastructure
  pathway to cause storage throttling, so the timing is coincidental.

  '
