xbase: أنا مستقل مهني وكانت فواتيري لعميلي الرئيسي تُدفع في غضون 15 يومًا تقريبًا.
  خلال الشهرين الماضيين باتت تصل حول اليوم 45. التوقيت يتزامن مع تحديثي لقالب الفاتورة
  — غيّرت الخطوط ونظام الألوان والشعار، لكن سطر شروط الدفع لا يزال يقول net-15 وجميع
  الحقول في نفس المواضع. {DS}
focal_diagnostic_feature: التصميم الجديد للقالب مؤكّد أنه مجرد تغيير شكلي بحت (لا
