  لديه حول وقت بدء التأخيرات، مما يجعل إعادة هيكلة سلسلة المستحقات هي العامل السببي
  الحاسم؛ أما التحديث البصري للتصميم فلا صلة هيكلية له بالمسألة.
low_diagnostic_proposition: 'Clients can slow down payments when an invoice design
