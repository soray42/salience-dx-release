domain: technical_troubleshooting
complexity: medium
xbase: تظهر المخططات البيانية على لوحة التحليلات الداخلية لدينا فارغةً لبعض أعضاء
  الفريق، بينما يراها آخرون بشكل صحيح تماماً. الصفحة نفسها تُحمَّل، وتُعيد واجهة برمجة
  بيانات API استجابة 200 مع JSON صالح، ولا توجد أخطاء على الخادم. الأشخاص الذين يرون
  الفراغات يُقسمون أنهم لم يفعلوا شيئاً مختلفاً، ولا تُفيد إعادة التحميل الكاملة عندهم.
  لم نغيّر مكتبة الرسوم البيانية هذا الربع. {DS}
focal_diagnostic_feature: تُظهر وحدة تحكم المتصفح للمستخدمين المتأثرين أن طلب حزمة
  الرسوم البيانية محجوب بفلتر على جانب العميل، وأن الحزمة تُقدَّم من مسار يحتوي على
  كلمة "analytics" تتطابق معها قوائم حجب الإعلانات.
low_diagnostic_proposition: The blank charts started appearing right after the team
  was moved to a new floor with new monitors.
oracle_action: ANSWER
oracle_focus: Rename or reverse-proxy the charting bundle off the "analytics"-matching
  path (or whitelist it); ad-block/content filters are blocking that script for the
  affected browsers, which is why the API succeeds but charts stay blank.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a floor move or new monitors to blank
  charts. Ask what the affected users' browser console shows and whether any script
  request is blocked.
