domain: technical_troubleshooting
complexity: low
xbase: بدأت بعض مفاتيح لوحة المفاتيح في كمبيوتري المحمول تكتب أحرفاً خاطئة. عندما
  أضغط على مفتاح علامة الاقتباس المزدوجة أحصل على رمز الـ at (@)، ومفتاح الـ at يعطيني
  علامة الاقتباس المزدوجة، كما تبادلت رموز الجنيه الإسترليني والمربع أيضاً. الأحرف
  والأرقام تعمل بشكل صحيح. الأمر نفسه في كل التطبيقات، ولوحة المفاتيح المادية تبدو
  سليمة. {DS}
focal_diagnostic_feature: الرموز المتبادلة هي بالضبط الفروق بين تخطيط لوحة المفاتيح
  البريطاني UK والأمريكي US، ومؤشر لغة الإدخال في نظام التشغيل يُظهر الآن الإنجليزية
  الأمريكية US بدلاً من التخطيط البريطاني UK الذي كان مضبوطاً من قبل.
low_diagnostic_proposition: The wrong characters started appearing right after the
  keyboard was cleaned with a disinfectant wipe.
oracle_action: ANSWER
oracle_focus: Switch the OS keyboard layout back to UK English; the specific quote/at
  and hash/pound swaps are the signature of a US-vs-UK layout mismatch, not a hardware
  fault.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect wiping the keyboard to character mapping.
