xbase: بدأت واجهة برمجة التطبيقات REST API لدينا في إعادة أخطاء 504 Gateway Timeout
  على نقطة نهاية endpoint واحدة محددة منذ يومين. تتولى نقطة النهاية هذه البحث عن ملفات
  تعريف المستخدمين وجميع المسارات الأخرى تستجيب بشكل طبيعي في غضون ميلي ثوانٍ. لم
  نُنشر أي تغييرات في كود التطبيق هذا الأسبوع، وأنماط حركة البيانات تبدو مطابقة لتلك
  الخاصة بالأسبوع الماضي. {DS}
focal_diagnostic_feature: طلب مباشر إلى الخدمة الأمامية متجاوزاً load balancer يستغرق
  97 ثانية؛ المعامل upstream_read_timeout في load balancer مضبوط على 60 ثانية، لذلك
  يتخلى البروكسي ويُعيد 504 قبل وصول الاستجابة.
low_diagnostic_proposition: The 504 errors began around the time a new appliance was
  installed in the office break room.
oracle_action: ASK
oracle_focus: Investigate why the user-profile-lookup upstream takes over 90 seconds;
