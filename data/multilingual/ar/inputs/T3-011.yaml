plausible_alternative_directions:
- label: عدم تطابق البيانات الوصفية أو لقطات الشاشة
  description: ينشأ الرفض من مخالفات App Store Connect في البيانات الوصفية، كلقطات
    الشاشة التي تعرض ميزات غير موجودة في الإصدار المُقدَّم (Guideline 2.3)، وهو سبب
    رفض مستقل وشائع.
- label: إعلان الصلاحية المفقود
  description: إمكانية مطلوبة أو صلاحية (مثل الإشعارات الفورية أو iCloud) موجودة في
    الملف الثنائي لكنها غير معلنة في App Store Connect، مما يُفضي إلى مخالفة سياسة
    مستقلة عن العطل.
- label: مخالفة سياسة SDK طرف ثالث
  description: SDK مجمَّع من طرف ثالث ينتهك سياسة App Store الحالية (مثل واجهات برمجة
    البصمة الرقمية، أو الأطر الخاصة المهملة)، مما يُسبب الرفض بمعزل عن كود التطبيق
    أو سلوك العطل.
