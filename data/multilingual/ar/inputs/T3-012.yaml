domain: technical_troubleshooting
complexity: high
xbase: يُجري خادم Postgres 15 الأساسي لدينا بثاً مستمراً إلى نسخة احتياطية نشطة واحدة
  منذ ستة أشهر دون أي مشكلة. خلال الأسابيع الثلاثة الماضية، يُظهر pg_stat_replication
  قفز replay_lag إلى 8–12 دقيقة كل ليلة عند الساعة 02:15 تحديداً وعودته إلى الطبيعي
  بحلول الساعة 02:30. فحصت pg_stat_progress_vacuum — لم تكن أي عمليات autovacuum نشطة
  خلال أي فترة ارتفاع. سحبت جدول العمليات الكامل لتلك الفترة. {DS}
focal_diagnostic_feature: يُظهر pg_stat_activity عند الساعة 02:15 عملية ETL متكررة
  تقوم بإدراج مجمَّع، ويتطابق الجدول الزمني لـ write_lag في pg_stat_replication مع
  معدل توليد WAL لتلك الدفعة تماماً.
low_diagnostic_proposition: 'PgBouncer connection pool configuration is causing the
  scheduled replication lag.

  '
oracle_action: ANSWER
oracle_focus: 'Investigate the nightly bulk-INSERT ETL job starting at 02:15; its
  WAL generation volume is directly correlated with the replication lag window and
  is the root cause. PgBouncer operates entirely outside the streaming replication
  path and cannot be causal.

  '
