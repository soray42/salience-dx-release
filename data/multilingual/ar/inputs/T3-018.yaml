xbase: إحدى نقاط نهاية GraphQL في واجهة برمجية التطبيقات لدينا بطيئة بشكل متقطع —
  سريعة في الغالب، لكن أحياناً تستغرق الاستجابة ثلاثاً إلى أربع ثوانٍ. تُحلّل بيانات
  ملف تعريف المستخدم إلى جانب مستوى الولاء الحالي الخاص به. الاستجابات البطيئة تحدث
  على نفس شكل الاستعلام الذي يكون سريعاً عادةً، وقاعدة البيانات التي تمتلكها الفريق
  تعمل بحمل خفيف. لدينا تتبّع موزّع مُفعَّل، وتُظهر الآثار أن كل محلل قاعدة بيانات
  يكتمل في ميلي ثوانٍ أحادية الرقم، دون أي تشعب في الاستعلامات. {DS}
