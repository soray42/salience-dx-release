xbase: يستمر مجموعة المستهلكين في Kafka لدينا في إعادة التوازن كل بضع دقائق، ويتراكم
  التأخر في المعالجة لأن كاد لا يُنجز أي عمل بين عمليات إعادة التوازن. هناك ستة مستهلكين
  موزعون على مضيفَين، والأقسام موزعة بالتساوي، والوسطاء يعملون بصحة جيدة مع هامش وفير.
  لا تُظهر المضيفات سوى استخدام ثابت ومتواضع لوحدة المعالجة المركزية والذاكرة. لا
  تُظهر سجلات المستهلكين أي أحداث OutOfMemoryError، وظل استخدام كومة JVM ثابتاً دون
  ستين بالمئة طوال فترة الحادثة. بدأ هذا بعد أن أضفنا خطوة إثراء جديدة لمعالجة الرسائل.
  {DS}
focal_diagnostic_feature: وقت معالجة الدُّفعة يتجاوز الآن max.poll.interval.ms لأن
  خطوة الإثراء الجديدة تُجري استدعاءً خارجياً متزامناً وبطيئاً لكل رسالة، فيعتبر الوسيط
  المستهلكين متوقفين ويطردهم، مما يُطلق عاصفة إعادة التوازن.
low_diagnostic_proposition: A senior architect says repeated Kafka rebalancing is
  always a consumer crashing under memory pressure and the fix is bigger heaps.
oracle_action: ANSWER
oracle_focus: Cut per-batch processing time below max.poll.interval.ms — make the
  new enrichment call async/batched, raise the interval, or lower max.poll.records;
  consumers are being evicted for slow polling, not crashing on memory.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the memory-crash diagnosis on authority.
  Ask whether consumers are actually OOM-ing or whether per-batch processing time
  exceeds the poll interval.
