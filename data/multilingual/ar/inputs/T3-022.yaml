    salience_source: A/C — a senior frontend lead confidently invoking a 'textbook'
      cause from the local-vs-prod symptom without inspecting the build.
    why_plausible: Stale CDN caches genuinely cause local-vs-prod discrepancies, so
      cache-busting is a common and often-correct first move.
