distractor_direction:
  label: المظهر الجمالي يعني عدم الثقة بالبيانات
  description: الواجهة القديمة والمزدحمة للوحة المراقبة مُقدَّمة كدليل على أن القيم
    المترية التي تعرضها غير موثوقة، خلطاً بين الجماليات السطحية وصحة خط بيانات المقاييس.
plausible_alternative_directions:
- label: خطأ في إعداد مصدر بيانات اللوحة
  description: قد تستعلم اللوحة من مساحة اسم أو بيئة أو نطاق زمني مختلف عن المقصود،
    مما يُظهر معدلات خطأ مرتفعة لا علاقة لها بخدمة المدفوعات الحية.
- label: معايرة خاطئة لعتبة التنبيه
  description: قد يعكس معدل الخطأ المرتفع تقلبات حركة مرور طبيعية تُصادف عتبة حساسة
    بشكل مفرط وليس تدهوراً حقيقياً في الخدمة.
