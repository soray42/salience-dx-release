variants:
  HL:
    distractor: أخبرني مهندس جوّال أوّل في شركة ناشئة مجاورة أنّه راجع توثيق SDK نفسه
      للجهة المورّدة ووجد أخطاءً إملائيةً في كل مكان وتنسيقاً مكسوراً على امتداد الوثائق.
