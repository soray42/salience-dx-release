distractor_direction:
  label: جودة توثيق SDK كإشارة إلى موثوقيّته
  description: توثيق SDK الخاص بالجهة المورّدة مليء بالأخطاء الإملائية والتنسيق المكسور،
    وهذا المظهر السطحي يُقدَّم كدليل على أنّ كود المكتبة SDK غير موثوق وبالتالي يُرجَّح
    أن يكون مصدر الأعطال المتقطّعة.
plausible_alternative_directions:
- label: انتهاك عقد التوصيل في SDK
  description: قد تستدعي SDK ردّ الاتصال عند اكتمال العملية على خيط غير متوقّع (مثل
    خيط خلفية بدلاً من الخيط الرئيسي)، ممّا يُثير سلوكاً غير محدّد عندما يفترض كود
    التطبيق تنفيذاً على الخيط الرئيسي.
- label: SDK تُعيد بيانات مشوّهة أو فارغة
  description: قد تُعيد SDK أحياناً بيانات غير متوقّعة أو فارغة null أو مشوّهة إلى
    ردّ الاتصال، ممّا يُسبّب عطلاً بسبب إلغاء مرجع فارغ null dereference أو عدم تطابق
    في النوع داخل معالج ردّ الاتصال في التطبيق.
- label: استدعاء SDK لردّ الاتصال مرّات متعدّدة
  description: قد يكون هناك خلل في SDK يجعلها تستدعي ردّ الاتصال عند اكتمال العملية
    أكثر من مرّة لكل استدعاء، ممّا يُسبّب إعادة دخول ردّ الاتصال في التطبيق وإفساد
    الحالة المشتركة عبر طفرة مزدوجة.
