causal_audit:
  steelman: "Best-faith argument that polished presentation COULD causally signal\n\
    financial advisor competence:\n\n1. Selection effect via AUM threshold: Firms\
    \ that can afford premium\n   offices and materials typically manage substantial\
    \ AUM. High AUM is\n   itself a signal of client retention, which (loosely) reflects\
    \ client\n   satisfaction, which (loosely) reflects perceived performance. A\n\
    \   compliance professional might shorthand this chain as \"polish = scale\n \
    \  = staying power = credibility.\"\n\n2. Organisational discipline hypothesis:\
    \ Firms that invest in professional\n   presentation may exhibit the same systematic,\
    \ detail-oriented culture\n   in their investment processes. \"How you do anything\
    \ is how you do\n   everything\" — the argument that operational rigour manifests\
    \ across\n   client-facing and back-office work alike.\n\n3. Regulatory-adjacent\
    \ signalling: Premium materials and offices may\n   partly reflect compliance\
    \ investment (disclosures, ADV filings, audit\n   trails), which correlates weakly\
    \ with institutional seriousness. A\n   compliance officer might plausibly conflate\
    \ visible spending with\n   compliance spending.\n\nVerdict: Each pathway is correlational,\
    \ indirect, and overridden by\ndirect evidence. No senior financial planner, CFP\
    \ Board examiner, or CFA\nInstitute guidance would list \"presentation quality\"\
    \ as a checklist item\nwhen evaluating an advisor — they would list fee structure,\
    \ audited\nperformance vs benchmark, fiduciary status, and credentials. The causal\n\
    chain from aesthetics to returns requires multiple weak correlations and\nignores\
    \ that high-fee/underperforming firms have identical incentives to\ninvest in\
    \ premium branding as their better-value competitors (possibly\nstronger incentives,\
    \ to compensate for weak performance numbers with\npersuasive materials). The\
    \ distractor is clean.\n"
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase establishes that the firm charges materially more
    in annual fees than the user''s current index-fund broker and that long-run net
    returns have lagged a standard equity benchmark by a wide margin. These qualitative
    signals partially foreclose the distractor: a reader already knows the cost is
    high and the performance is poor before encountering the aesthetic claim. The
    precise decisve figures (1.8% AUM, 35× multiplier, 5.2% vs 13.1% S&P 500) are
    reserved for the HH/LH variants where they carry full diagnostic weight.

    '
