xbase: أداة مجّانية لفحص صحّة القرص قمت بتنزيلها تُحذّرني من أنّ SSD في حاسوبي المحمول
  قد يكون في طور العطل وأنّه ينبغي لي الاحتياط بنسخة احتياطية قريباً. الأداة ذاتها
  تبدو قديمة جداً — واجهة رمادية خشنة تبدو وكأنّها لم تُحدَّث منذ عشرين عاماً. أشعر
  بالإغراء لتجاهل التحذير لأنّ البرنامج يبدو غير احترافي. أداة القرص المدمجة في نظام
  التشغيل تُبلّغ بصورة مستقلّة عن نفس قراءة SMART الفاشلة. يعمل الحاسوب المحمول بشكل
  طبيعي في الظاهر. {DS}
focal_diagnostic_feature: تُظهر سمات SMART للقرص ارتفاعاً في عدد القطاعات المعاد توزيعها
  reallocated-sector count وعدداً غير صفري من القطاعات المعلّقة pending sectors، وتُبلّغ
  أداة القرص المدمجة في نظام التشغيل عن نفس القيم الفاشلة.
low_diagnostic_proposition: The disk-health tool's dated, unprofessional interface
  suggests its failure warning should not be trusted.
oracle_action: ANSWER
oracle_focus: Take the warning seriously and back up now (then plan to replace the
  drive); the SMART reallocated/pending-sector evidence is corroborated by the OS's
  own disk utility, regardless of how the tool looks.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not dismiss the warning because the tool looks dated.
  Ask what underlying SMART values it reports and whether another tool confirms them.
