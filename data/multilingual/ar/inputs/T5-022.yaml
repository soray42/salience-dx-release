xbase: أوظف مصورًا لحدث ووصلت إلى مرحلة الاختيار بين اثنين. أسعارهما متقاربة جدًا
  وكلاهما متاح في تاريخي. أحدهما يمتلك موقع معرض أعمال مبهر — طباعة أنيقة، معارض ملء
