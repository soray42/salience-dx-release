    أو ازدحام الشبكة المنزلية.
plausible_alternative_directions:
- label: تقليص سرعة المعالج بسبب الحرارة
  description: يتراكم الحرارة في معالج الحاسوب المحمول خلال النهار وبحلول المساء يُخفّض
    سرعة المعالج، مما يُدهور معالجة الكوديك الصوتي في الوقت الحقيقي ويُنتج تشويهًا
    روبوتيًا في التقاط الصوت محليًا.
- label: عطل في مشغّل الصوت أو البرنامج
  description: خلل في المشغّل، أو تغيير حديث في إعدادات الصوت، أو تعارض مع عملية صوتية
    في الخلفية يتسبب في خلل في خط معالجة إدخال الميكروفون، وتظهر الأعراض فقط بعد وقت
    تشغيل ممتد للنظام.
- label: تغيير ملف تعريف إدارة الطاقة
  description: التبديل التلقائي إلى ملف توفير البطارية أو انخفاض الطاقة في المساء
    يُقلل من أولوية المعالج والنظام الفرعي للصوت، مما يتسبب في إسقاط عينات من خط التقاط
    الصوت وإنتاج تشويه روبوتي.
