    underperformance investigation, a senior CFP or investment adviser would

    check the fund''s total expense ratio as a first-order diagnostic. The

    investor''s three prior successful diagnoses of fees further support the

    hypothesis. If the fund had a higher expense ratio than the index, fees

    would be a fully defensible primary explanation.

    '
