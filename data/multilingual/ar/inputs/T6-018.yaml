domain: technical_troubleshooting
complexity: medium
xbase: إحدى نقاط النهاية في خدمتنا تُعيد 504 Gateway Timeout، لكن فقط في عملية تصدير
  CSV الجماعية — كل نقطة نهاية أخرى تعمل بشكل طبيعي. الأمر ليس ثابتاً؛ يفشل في التصديرات
  الكبيرة وينجح في الصغيرة. لم نغيّر كود التصدير مؤخراً، وسجلات التطبيق تُظهر أن المعالج
  لا يزال يعمل ولا يُصدر أخطاء عندما تعود رسالة 504 إلى العميل. يُظهر تتبع مستوى الاستعلامات
  أن كل استعلام قاعدة بيانات منفرد ينتهي تشغيله في أقل من ثانية بكثير، حتى على أكبر
  مجموعات البيانات. {DS}
focal_diagnostic_feature: رسالة الـ 504 تُطلق عند 60 ثانية بالضبط، مطابقةً لمهلة التوقف
  الخاملة لموازن الحمل، بينما التصدير الكبير يحتاج فعلاً حوالي 75 ثانية من البداية
  إلى النهاية.
low_diagnostic_proposition: Every past 504 the user has dealt with came from a slow
  database query, so this one is probably a slow query too.
oracle_action: ANSWER
oracle_focus: Raise the load balancer's idle/response timeout for this endpoint (or
  paginate the export); the 504 fires at the LB's 60-second cutoff while a valid ~75-second
  export is still running.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a slow query from past 504s. Ask at what
  elapsed time the 504 fires and whether it matches a proxy or load-balancer timeout.
