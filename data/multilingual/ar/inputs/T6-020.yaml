xbase: تعاني زمن الاستجابة p99 لواجهة برمجة التطبيقات لدينا من ارتفاعات حادة عدة مرات
  يومياً خلال الأسبوع الماضي، وتصرفي الأول هو التراجع عن آخر نسخة نشرناها. هذه الارتفاعات
  وجيزة لكنها حادة، ثم تعود زمن الاستجابة إلى طبيعتها تلقائياً. حجم الطلبات يبقى ثابتاً
  خلال الارتفاعات ومعدلات الأخطاء تبقى منخفضة. نشر فريقنا نسخاً متعددة يومياً، لكن
  بمقارنة أوقات الارتفاعات بسجل النشر، تبيّن أن عدة ارتفاعات حدثت في ساعات لم نشر
  فيها شيئاً على الإطلاق، لذا فهي غير مرتبطة بأي عملية نشر. {DS}
focal_diagnostic_feature: تقع الارتفاعات في أعلى كل ساعة تحديداً بصرف النظر عن توقيت
  النشر — بما فيها الساعات التي لم يحدث فيها أي نشر — وتتوافق بدقة مع عملية تحديث
  materialized-view كل ساعة تستولي على قفل ثقيل وتُشبع IOPS قاعدة البيانات.
low_diagnostic_proposition: Every latency regression the user has handled before was
  caused by a bad deploy, so this one is probably a bad deploy too.
oracle_action: ANSWER
oracle_focus: Do not roll back; the spikes hit exactly on the hour independent of
  deploys and match an hourly materialized-view refresh that locks and saturates DB
  IOPS, so reschedule, incrementalise, or throttle that job.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a bad deploy from past regressions. Ask
  whether the spikes line up with deploy times or instead recur on a fixed schedule
  independent of deploys.
