xbase: منذ إصدارنا الأخير لتطبيق Android، يُفيد بعض المستخدمين بأن التطبيق يتوقف فوراً
  عند تشغيله، وأول ما خطر لي هو أن أطلب منهم مسح ذاكرة التخزين المؤقت وإعادة التثبيت.
  معظم المستخدمين لا يواجهون أي مشكلة. يحدث التوقف مباشرةً عند بدء التشغيل قبل ظهور
  أي شاشة. طلبت بالفعل من بعض المستخدمين المتأثرين مسح جميع بيانات التطبيق وإعادة
  التثبيت، ولا يزال التطبيق يتوقف عندهم عند أول تشغيل. {DS}
focal_diagnostic_feature: جميع تقارير التوقف صادرة عن أجهزة تعمل بإصدارات Android
  أقدم، وتتبّع المكدس هو NoSuchMethodError لواجهة برمجة نظام التشغيل الموجودة فقط
  في الإصدارات الأحدث، يُستدعى دون قيد خلال بدء التشغيل.
low_diagnostic_proposition: Every launch crash the user has fixed before came from
  a corrupted local cache, so this one is probably a cache problem too.
oracle_action: ANSWER
oracle_focus: Guard the newer-OS platform API behind a version check or raise minSdk;
  the crashes are a NoSuchMethodError on older Android versions for an API that does
  not exist there, not a corrupted cache.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a cache problem from past crashes. Ask
  what the stack trace says and whether the affected devices share an OS version.
