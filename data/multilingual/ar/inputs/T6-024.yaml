xbase: تواجه خدمتنا تجاوزاً متقطعاً لحدود معدل الطلبات على واجهة برمجة تطبيقات الدفع
  الخارجية خلال الخمسة أيام الماضية. يؤثر هذا التجاوز على مجموعة فرعية من المستخدمين
  في كل مرة ونحن ضمن حصة الطلبات المتعاقد عليها إجمالاً. التتبع الموزع لا يظهر أي
  مكالمات متكررة ناجمة عن أخطاء. أضفنا برنامج وسيط جديداً للتخزين المؤقت إلى تدفق
  الدفع قبل أسبوعين. {DS}
focal_diagnostic_feature: التتبع الموزع يُظهر 4 إلى 5 مكالمات لواجهة برمجة تطبيقات
  الدفع الخارجية لكل جلسة مستخدم حيث يُتوقع مكالمة واحدة تحديداً؛ برنامج التخزين المؤقت
  الوسيط يستخدم معرّف المستخدم مفتاحاً لا رمز التوافق، لذا لا تُكشف الطلبات المتزامنة
  في الجلسة ذاتها وتصل جميعها إلى الخادم الخارجي.
low_diagnostic_proposition: Past rate-limit incidents for this service were caused
  by retry logic firing without adequate backoff, and the same may be happening now.
oracle_action: ANSWER
oracle_focus: Fix the caching middleware key to include the idempotency token so concurrent
  requests within a session are deduplicated before reaching the upstream payment
  API.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to retry-backoff as the cause without
