variants:
  HL:
    distractor: Un colega en otro banco me contó que su puntuación de fraude se desplomó
      después de que un analista intercambiara accidentalmente dos etiquetas de tipo
      de tarjeta en una carga del viernes.
    diagnosticity: low
    salience: high
    proposition: A fraud-model regression at another bank was caused by swapped labels
      in their pipeline.
    salience_source: vivid human-error anecdote from adjacent industry
    why_plausible: Label swaps are plausible ML failures and the banking context sounds
      close.
    why_irrelevant: The current evidence points to a new distribution segment, not
      changed labels; the external pipeline story adds no evidence about this model.
  LL:
    distractor: Un par en otro banco reportó una regresión del modelo de fraude causada
      por un intercambio de etiquetas en su pipeline de datos.
    diagnosticity: low
    salience: low
    proposition: A fraud-model regression at another bank was caused by swapped labels
      in their pipeline.
    matched_to: HL
  HH:
    distractor: Casi toda la pérdida de precisión proviene de un MCC completamente
      nuevo que no existía cuando entrenamos el modelo; las categorías más antiguas
      parecen básicamente normales.
    diagnosticity: high
    salience: high
    proposition: The precision loss is concentrated in a newly added merchant category
      that did not exist in the training data.
    salience_source: segment-localised error concentration
  LH:
    distractor: La degradación de precisión está concentrada en una categoría de comercio
      que es posterior a los datos de entrenamiento; las demás categorías se mantienen
      relativamente estables.
    diagnosticity: high
    salience: low
    proposition: The precision loss is concentrated in a newly added merchant category
      that did not exist in the training data.
    matched_to: HH
distractor_direction:
  label: Intercambio de etiquetas en el pipeline
  description: Investigar si las etiquetas de entrenamiento o evaluación fueron intercambiadas,
    invertidas o mal unidas en el pipeline del modelo.
plausible_alternative_directions:
- label: Descalibración del umbral de decisión
  description: El umbral de puntuación del modelo o la capa de calibración cambió,
    reduciendo la precisión sin afectar mucho al recall.
- label: Regresión en el registro de características
  description: Un cambio en la generación o el registro de características corrompió
    una o más entradas del modelo tras el despliegue.
- label: Retraso en las etiquetas de fraude
  description: Las etiquetas de resultado llegan tarde o de forma irregular, distorsionando
    las mediciones de precisión recientes.
