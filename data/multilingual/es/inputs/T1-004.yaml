seed_id: T1-004
template: T1
domain: technical_troubleshooting
complexity: high
xbase: La precisión de nuestro modelo de fraude en producción ha caído durante las
  últimas semanas, mientras que el recall se mantiene básicamente sin cambios. El
  modelo se desplegó hace nueve meses y no se ha vuelto a entrenar desde entonces.
  No he encontrado evidencia de un cambio reciente en el pipeline de etiquetas. {DS}
focal_diagnostic_feature: La pérdida de precisión está concentrada en una categoría
  de comercio recién añadida que no existía en los datos de entrenamiento.
low_diagnostic_proposition: A fraud-model regression at another bank was caused by
  swapped labels in their pipeline.
oracle_action: ASK
oracle_focus: Investigate per-MCC precision and distribution shift; the pattern suggests
  covariate shift in the new merchant category and may require calibration or retraining
  on that segment.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not import the other bank's label-swap explanation.
  Ask for segment-level error rates and whether the drop is concentrated in new transaction
  types.
cell_oracles:
  HL:
    action: ASK
    focus: Do not import the other bank's label-swap explanation. Ask for segment-level
      error rates and whether the drop is concentrated in new transaction types.
  LL:
    action: ASK
    focus: Do not import the other bank's label-swap explanation. Ask for segment-level
      error rates and whether the drop is concentrated in new transaction types.
  HH:
    action: ASK
    focus: Investigate per-MCC precision and distribution shift; the pattern suggests
      covariate shift in the new merchant category and may require calibration or
