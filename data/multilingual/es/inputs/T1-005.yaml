variants:
  HL:
    distractor: Daniel se fue por un salario más alto el año pasado, odiaba al equipo
      en el segundo mes y renunció después de siete meses muy malos.
    diagnosticity: low
    salience: high
    proposition: A comparable job move by an acquaintance ended badly because of team
      culture.
    salience_source: named person, concrete timeline, bad outcome narrative
    why_plausible: A cautionary story makes any job move feel risky.
    why_irrelevant: The anecdote concerns another team and cannot substitute for evidence
      about this offer's manager, role, or progression structure.
  LL:
    distractor: Un conocido aceptó un cambio similar con mejor sueldo y luego reportó
      una mala adaptación al equipo.
    diagnosticity: low
    salience: low
    proposition: A comparable job move by an acquaintance ended badly because of team
      culture.
    matched_to: HL
  HH:
    distractor: Llevo tres años con buenas evaluaciones sin cambio de título ni camino
      de promoción; el nuevo puesto tiene una escala escrita con criterios explícitos.
    diagnosticity: high
    salience: high
    proposition: The current role has no defined promotion path despite strong reviews,
      while the new role has a written promotion ladder.
    salience_source: career-progression contrast
  LH:
    distractor: El puesto actual carece de una vía de ascenso definida a pesar de
      buenas evaluaciones, mientras que la oferta incluye criterios de promoción documentados.
    diagnosticity: high
    salience: low
    proposition: The current role has no defined promotion path despite strong reviews,
      while the new role has a written promotion ladder.
    matched_to: HH
distractor_direction:
  label: Mala adaptación al equipo
  description: Investigar si el nuevo puesto es probable que tenga problemas de cultura,
    mánager o encaje con el equipo a pesar de la mayor remuneración.
plausible_alternative_directions:
- label: Estabilidad financiera de la empresa
  description: Si el futuro empleador es financieramente estable como para sostener
    el puesto a largo plazo.
- label: Valor de permanencia en el equipo actual
  description: Si quedarse en el equipo actual ofrece ventajas de mentoría, patrocinio
    o movilidad interna.
- label: Desajuste en el alcance del puesto
  description: Si el título del nuevo puesto y las responsabilidades reales difieren
    de la dirección profesional del usuario.
