seed_id: T1-005
template: T1
domain: open_qa
complexity: medium
xbase: Tengo una oferta para un nuevo puesto. El salario base es considerablemente
  más alto que el actual, la empresa tiene cuentas públicas y su línea de producto
  principal parece estable. Me gusta mi equipo actual pero no estoy seguro de si quedarme
  ayuda a mi trayectoria a largo plazo. {DS}
focal_diagnostic_feature: El puesto actual no tiene una vía de promoción definida
  a pesar de buenas evaluaciones, mientras que el nuevo puesto cuenta con una escala
  de promoción documentada.
low_diagnostic_proposition: A comparable job move by an acquaintance ended badly because
  of team culture.
oracle_action: ANSWER
oracle_focus: On the stated facts, the move is favourable, while still leaving room
  to verify team culture before accepting.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let one external culture story override the offer
  facts. Ask about this specific manager, team norms, and promotion criteria.
