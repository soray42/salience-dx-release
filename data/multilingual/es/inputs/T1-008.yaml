- label: Rodamiento del ventilador defectuoso
  description: El propio hardware del ventilador está desgastado, obstruido o vibra
    de forma independiente a la carga térmica.
- label: Degradación de la pasta térmica
  description: La transferencia interna de calor desde la CPU/GPU al disipador se
    ha degradado con el tiempo.
