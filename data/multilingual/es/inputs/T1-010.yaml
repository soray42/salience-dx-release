domain: technical_troubleshooting
complexity: medium
xbase: 'Mi VPN al gateway de la empresa es extremadamente lenta: aproximadamente 3
  Mbps de descarga. Sin la VPN, mi conexión doméstica supera los 400 Mbps. El gateway
  está en otro país y no he cambiado la configuración de mi cliente VPN esta semana.
  {DS}'
focal_diagnostic_feature: Otros compañeros en la misma ciudad usando el mismo gateway
  hoy obtienen más de 100 Mbps.
low_diagnostic_proposition: A peer's VPN problem was attributed to ISP-level throttling
  of encrypted traffic.
oracle_action: ASK
oracle_focus: The problem is local to this user's path or device; check Wi-Fi/NIC,
  MTU, local routing/peering, and compare from another network.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer national ISP throttling from someone else's
  case. First compare against peers on the same gateway and city.
