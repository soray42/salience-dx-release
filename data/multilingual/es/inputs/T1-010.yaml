variants:
  HL:
    distractor: Un amigo del colegio tuvo velocidades de VPN desplomadas durante una
      crisis política; al parecer, su ISP nacional estaba limitando el tráfico cifrado
      por las noches.
    diagnosticity: low
    salience: high
    proposition: A peer's VPN problem was attributed to ISP-level throttling of encrypted
      traffic.
    salience_source: dramatic geopolitical anecdote, similar VPN symptom
    why_plausible: VPN slowness plus a throttling story sounds like a plausible hidden-network
      cause.
    why_irrelevant: Peers in the same city and gateway being normal rules out a broad
      citywide or gateway-wide explanation.
  LL:
    distractor: Un compañero tuvo un problema de rendimiento de VPN atribuido a la
      limitación de tráfico cifrado por parte del ISP.
    diagnosticity: low
    salience: low
    proposition: A peer's VPN problem was attributed to ISP-level throttling of encrypted
      traffic.
    matched_to: HL
  HH:
    distractor: Las personas de mi ciudad en el mismo gateway están obteniendo más
      de 100 Mbps hoy mientras yo estoy bloqueado a 3 Mbps en esta máquina.
    diagnosticity: high
    salience: high
    proposition: Other colleagues in the same city using the same gateway today get
      over 100 Mbps.
    salience_source: peer baseline on same route/gateway
  LH:
    distractor: Usuarios comparables en la misma ciudad y en el mismo gateway VPN
      reportan un rendimiento normal.
    diagnosticity: high
    salience: low
    proposition: Other colleagues in the same city using the same gateway today get
