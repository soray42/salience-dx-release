distractor_direction:
  label: Limitación de tráfico del ISP
  description: Investigar si el proveedor de internet está limitando o moldeando el
    tráfico VPN cifrado.
plausible_alternative_directions:
- label: Problema de capacidad del gateway
  description: El gateway VPN remoto de la empresa está congestionado o subdimensionado
    para la carga actual.
- label: Incompatibilidad del protocolo VPN
  description: El protocolo VPN, el cifrado o el transporte seleccionado es ineficiente
    para esta ruta.
- label: Degradación de la ruta de peering
  description: La ruta entre el ISP doméstico y el gateway extranjero tiene un peering
    deficiente o pérdida de paquetes.
