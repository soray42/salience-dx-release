distractor_direction:
  label: Personalizaciones de dispositivo del fabricante
  description: El crash en el inicio está causado por una skin Android personalizada
    del fabricante del dispositivo o por una modificación de la API del sistema que
    afecta solo a ciertos dispositivos. El anécdota enmarca las personalizaciones
    específicas del fabricante como la causa raíz confirmada, reflejando el patrón
    de síntoma de subconjunto de usuarios.
plausible_alternative_directions:
- label: Configuración incorrecta de BuildConfig en release
  description: La variante de la build de release usa una constante BuildConfig o
    una clave API diferente que es inválida o está ausente, lo que provoca una excepción
    no manejada en onCreate antes de cualquier llamada de red explícita.
- label: Binding nulo en el grafo de DI en release
  description: El grafo de inyección de dependencias (Dagger/Hilt) tiene un binding
    faltante o nulo que solo está ausente en la configuración de la build de release,
    lo que provoca un NullPointerException durante la inicialización de la aplicación.
