xbase: 'Mi aplicación Android se cierra al iniciarse en un subconjunto de usuarios.
  El crash solo aparece en el APK de release: todo nuestro equipo puede ejecutar la
  build de debug sin ningún problema, incluso en los mismos dispositivos donde la
  build de release falla. El crash ocurre dentro de onCreate antes de que se realice
  ninguna llamada de red. {DS}'
focal_diagnostic_feature: La traza de pila del crash muestra una java.lang.ClassNotFoundException
  para una clase accedida mediante reflection, y el build.gradle de la build de release
  activa la minificación R8 sin una regla keep para esa clase.
low_diagnostic_proposition: 'Another company''s release-only startup crash was caused
  by OEM-specific device customizations.

  '
oracle_action: ANSWER
oracle_focus: 'Focus on R8/ProGuard minification stripping the reflection-accessed
  class; add an appropriate -keep rule in proguard-rules.pro to preserve the class
  name at runtime.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Request the crash stack trace and the project''s build
