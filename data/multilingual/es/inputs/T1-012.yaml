seed_id: T1-012
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Mi grupo de consumidores de Kafka ha mostrado un lag creciente en la partición
  7 durante las últimas 48 horas, mientras que las otras nueve particiones permanecen
  estables por debajo de 500 mensajes. Todos los consumidores tienen la misma versión
  y los mismos flags de JVM, y el grupo no ha rebalanceado desde que comenzó el problema.
  Aún no he identificado qué está limitando la partición 7. {DS}
focal_diagnostic_feature: Broker-2, el líder de la partición 7, está funcionando al
  95% de utilización de I/O de disco mientras que todos los demás brokers están por
  debajo del 20%, y el tiempo de procesamiento del lado del consumidor para la partición
  7 es idéntico al de las particiones sanas, descartando el rendimiento del consumidor
  como causa.
low_diagnostic_proposition: 'Another team''s single-partition consumer group lag was
  caused by one consumer performing synchronous database lookups per message.

  '
oracle_action: ANSWER
oracle_focus: 'Investigate broker-2 for disk I/O saturation: identify whether the
  disk is failing, nearly full, or being throttled, and consider migrating partition
  7''s leader replica to a healthy broker while the root cause is resolved.

  '
low_diagnostic_oracle_action: ANSWER
low_diagnostic_oracle_focus: 'Do not adopt the synchronous-lookup explanation; instead,
  gather broker-side and consumer-side metrics for partition 7 to identify the actual
  constraint before committing to any direction.

  '
