      separate layer.

      '
  LL:
    distractor: Alguien en otra empresa tuvo lag en un grupo de consumidores de una
      sola partición rastreado hasta búsquedas síncronas en base de datos por mensaje.
    diagnosticity: low
    salience: low
    proposition: 'Another team''s single-partition consumer group lag was caused by
      one consumer performing synchronous database lookups per message.

      '
    matched_to: HL
  HH:
    distractor: Broker-2, que es el dueño de la réplica líder de la partición 7, está
      al tope al 95% de I/O de disco mientras que todos los demás brokers del clúster
      están por debajo del 20%, y la latencia de poll y procesamiento del consumidor
      para la partición 7 es indistinguible de la de las particiones sanas, apuntando
      claramente a una limitación de disco en el lado del broker.
    diagnosticity: high
    salience: high
    proposition: 'Broker-2, the partition leader for partition 7, is running at 95%
      disk I/O utilisation while all other brokers are below 20%, and consumer-side
      processing time for partition 7 is identical to the healthy partitions, ruling
      out consumer-side throughput as the cause.

      '
    salience_source: 'C (confident assertion): "pegged at … pointing squarely to";
      D (concrete metric detail): specific percentages and explicit contrast with
      healthy brokers make the causal direction vivid and precise.

      '
  LH:
    distractor: Broker-2, el líder de la partición 7, está al 95% de utilización de
      I/O de disco; los demás brokers por debajo del 20%; la latencia de poll y procesamiento
      del consumidor coincide con la de las particiones sanas.
    diagnosticity: high
    salience: low
    proposition: 'Broker-2, the partition leader for partition 7, is running at 95%
      disk I/O utilisation while all other brokers are below 20%, and consumer-side
      processing time for partition 7 is identical to the healthy partitions, ruling
      out consumer-side throughput as the cause.

      '
    matched_to: HH
distractor_direction:
  label: Latencia por búsquedas síncronas en el consumidor
  description: La hipótesis de que el consumidor asignado a la partición 7 está realizando
    llamadas externas síncronas (por ejemplo, búsquedas en base de datos) dentro del
    bucle de consumo, reduciendo su rendimiento y causando la acumulación de lag en
    esa partición.
plausible_alternative_directions:
- label: Sesgo de partición caliente por el productor
  description: El rango de claves de la partición 7 atrae un volumen de mensajes desproporcionadamente
    alto de los productores, de modo que el consumidor no puede mantenerse al día
    independientemente de la velocidad de procesamiento.
- label: Fallo de deserialización por mensaje envenenado
  description: Uno o más mensajes malformados en la partición 7 están causando errores
    de deserialización o reintentos repetidos que detienen el progreso del consumidor
    en esa partición.
- label: Agotamiento de recursos de la instancia del consumidor
  description: La instancia JVM del consumidor específica asignada a la partición
    7 está quedándose sin heap o CPU, lo que provoca pausas de GC o inanición de hilos
    que ralentizan el consumo independientemente del estado del broker.
