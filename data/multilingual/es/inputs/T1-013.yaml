distractor_direction:
  label: fallo del relé de calefacción
  description: El síntoma similar del compañero (la programación no se dispara, el
    modo manual sí funciona) se resolvió reemplazando un relé o contactor de calefacción
    defectuoso, lo que sugiere que el usuario podría tener el mismo fallo de hardware.
plausible_alternative_directions:
- label: programación mal configurada
  description: Los días, la hora o la temperatura programados pueden estar configurados
    incorrectamente en la aplicación — por ejemplo, la programación podría estar activada
    solo para ciertos días que no incluyen el día actual, o la temperatura objetivo
    podría estar por debajo de la temperatura ambiente actual.
- label: fallo de firmware del termostato o error de sincronización con la app
  description: Una actualización de firmware fallida o una sincronización rota entre
    la aplicación móvil y el almacenamiento local del termostato podría dejar al termostato
    ejecutando datos de programación obsoletos o vacíos, aunque la app muestre la
    programación como correcta.
- label: modo retención o vacaciones activo
  description: Una retención manual activa, un modo vacaciones o una anulación temporal
    de temperatura establecida en el termostato (o a través de la app) podría estar
    suprimiendo todos los eventos programados hasta que la retención expire o se cancele.
