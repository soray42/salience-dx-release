xbase: 'Mi termostato inteligente está configurado para encender la calefacción a
  las 6:30 de la mañana los días laborables. Cada mañana bajo y la casa está fría
  — la caldera no ha funcionado. Pero si camino hasta el termostato y llamo al calor
  manualmente, la caldera arranca en menos de treinta segundos, sin problema. He revisado
  la programación en la aplicación tres veces y parece correcta: días laborables,
  6:30 AM, 20 grados. Un compañero del trabajo me comentó que su termostato hacía
  lo mismo antes. {DS}'
focal_diagnostic_feature: El reloj en pantalla del termostato marca las 11:32 cuando
  la hora local real es las 06:32 — un adelanto de cinco horas que coincide con UTC
  en lugar de la zona horaria local del usuario, lo que significa que la programación
  de las 6:30 AM se ejecuta a la 1:30 AM hora local mientras el hogar duerme sin darse
  cuenta.
low_diagnostic_proposition: 'The acquaintance''s similar scheduling failure was resolved
  by replacing a faulty heating relay.

  '
oracle_action: ANSWER
oracle_focus: 'Diagnose the thermostat''s timezone/clock configuration; the schedule
  is executing at the wrong local time because the device is set to UTC instead of
  the user''s local timezone. Correct the timezone setting so the 6:30 AM schedule
  fires at the intended local time.

  '
low_diagnostic_oracle_action: ANSWER
low_diagnostic_oracle_focus: 'Investigate the thermostat''s scheduling configuration
  — check the internal clock, timezone setting, and whether the schedule days/times
  are correctly saved. Do not adopt the relay-replacement story from the acquaintance''s
  case as a diagnosis here, because if the relay were faulty the manual call-for-heat
  would also fail; the relay is demonstrably functional.

  '
