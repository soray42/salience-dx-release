causal_audit:
  steelman: 'Best-faith argument that warranty-voiding concern could be causally

    relevant to the user''s repair decision: one might argue that the user could

    have purchased an aftermarket extended warranty at the time of original

    purchase that is still active; some third-party extended warranties

    (e.g., SquareTrade/Allstate appliance plans) run 3-5 years from purchase

    date, meaning a policy bought at purchase could theoretically still be

    active at year 8 if it was a long-duration plan. Under such a plan, a

    non-certified repair could void coverage. Additionally, some premium

    appliance brands offer 5-year parts-and-labor warranties that would still

    be active at year 8 if purchased as an upgrade. A practitioner might

    therefore ask: "Do you have any extended warranty or protection plan on

    this machine?"

    '
