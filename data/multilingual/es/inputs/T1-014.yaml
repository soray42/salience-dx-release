xbase: Mi lavavajillas tiene 8 años y ha dejado de completar los ciclos de lavado.
  Un técnico me ha dado un presupuesto de reparación, y reemplazarlo por un modelo
  nuevo comparable costaría considerablemente más. Mi cuñado se enfrentó recientemente
  a la misma decisión de reparar o reemplazar con su lavavajillas y optó por reemplazarlo;
  me explicó su razonamiento. {DS}
