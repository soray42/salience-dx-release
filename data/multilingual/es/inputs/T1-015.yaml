distractor_direction:
  label: bloqueo de hierro por suelo alcalino
  description: El amarillamiento de los tomates del vecino fue causado por un pH del
    suelo demasiado alto, que impidió que las plantas absorbieran hierro — una hipótesis
    que el usuario podría aplicar a su propio caso por analogía.
plausible_alternative_directions:
- label: deficiencia de magnesio
  description: El magnesio es también un nutriente móvil que produce amarillamiento
    de las hojas bajas (a menudo intervenal) en tomates de maceta cuando se agota;
    es un diagnóstico diferencial real junto a la deficiencia de nitrógeno.
- label: senescencia natural
  description: Las hojas bajas de las plantas de tomate en fructificación amarillean
    y caen de forma natural a medida que la planta madura y redirige la energía al
    fruto; la velocidad y la extensión del proceso permiten distinguirlo de una deficiencia.
- label: restricción radicular o compactación
  description: Los contenedores de balcón pueden quedar con las raíces apretadas o
    desarrollar tierra compactada a lo largo de la temporada, limitando la absorción
    de nutrientes y agua y causando amarillamiento de las hojas bajas incluso con
    una rutina de riego regular.
