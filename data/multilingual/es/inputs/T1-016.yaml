seed_id: T1-016
template: T1
domain: open_qa
complexity: high
xbase: Mi hipoteca vence dentro de seis semanas y estoy dudando entre fijar el tipo
  a 10 años o mantenerme variable. Tanto mi pareja como yo tenemos contratos laborales
  a largo plazo, y nuestros ingresos combinados cubren cómodamente cualquiera de los
  dos escenarios de pago. El diferencial de tipos es de 0,7 puntos porcentuales —
  el fijo es más alto. Un compañero de trabajo sacó el tema de su propia experiencia
  de renovación recientemente. {DS}
focal_diagnostic_feature: El usuario no tiene ninguna línea de crédito con garantía
  hipotecaria ni deuda a tipo variable garantizada sobre la propiedad, lo que elimina
  cualquier argumento de consolidación de la decisión y deja la elección entre tipo
  fijo y variable para resolverse a partir del diferencial de tipos presentado, la
  estabilidad de ingresos y el horizonte de permanencia.
low_diagnostic_proposition: 'A colleague fixed their mortgage at renewal by rolling
  a home equity line of credit into a single consolidated fixed-rate product.

  '
oracle_action: ANSWER
oracle_focus: 'Evaluate fixed-versus-variable on the basis of the 0.7-percentage-point
  rate differential, the couple''s income stability, their indefinite holding horizon,
  and the absence of any variable-rate debt to consolidate; note that the colleague''s
  HELOC consolidation experience is structurally inapplicable and should not influence
  the rate-type decision.

  '
low_diagnostic_oracle_action: ANSWER
low_diagnostic_oracle_focus: 'Acknowledge the colleague''s experience but identify
  that it involved a HELOC consolidation absent from the user''s situation; address
  the fixed-versus-variable decision on the presented cash-flow facts alone without
  treating the anecdote as informative for this case.

  '
