distractor_direction:
  label: consolidación de línea de crédito hipotecaria como estrategia
  description: La sugerencia de que la acción correcta es consolidar una línea de
    crédito con garantía hipotecaria en una hipoteca a tipo fijo en la renovación,
    tal como hizo el compañero. Esta dirección trata la experiencia de consolidación
    del compañero como un modelo transferible para la decisión de tipo del usuario.
plausible_alternative_directions:
- label: análisis de punto de equilibrio del diferencial de tipos
  description: Con una prima de 0,7 puntos porcentuales, el tipo fijo resulta económicamente
    preferible solo si los tipos variables suben más que ese margen antes del final
    del período de permanencia efectivo; un asesor calcularía cuántas subidas de tipos
    hacen el equilibrio.
- label: estabilidad de ingresos por contratos laborales
  description: Ambos miembros de la pareja tienen contratos laborales a largo plazo,
    lo que reduce la probabilidad de interrupción de ingresos que haría inmanejables
    los pagos a tipo variable; un asesor valoraría si esta estabilidad favorece asumir
    el riesgo de tipo variable.
- label: adecuación del horizonte de vinculación a 10 años
  description: Un plazo fijo de 10 años es inusualmente largo; un asesor evaluaría
    si las circunstancias vitales del usuario (planes familiares, movilidad profesional,
    posible cambio de vivienda) hacen que una vinculación de 10 años sea estructuralmente
    adecuada o si sería preferible un plazo fijo más corto.
