xbase: Estoy decidiendo si mantener mi membresía del gimnasio o cancelarla. Cuesta
  45 € al mes y me apunté en enero con la intención de ir a entrenar tres veces por
  semana. Me gusta la idea de ir y me sigo diciendo que este mes será el que cambie
  las cosas. Ya salgo a correr al aire libre la mayoría de las mañanas, así que no
  dependo del gimnasio para mantenerme activo. El contrato se renueva automáticamente
  la semana que viene, así que tengo que decidir ya. {DS}
