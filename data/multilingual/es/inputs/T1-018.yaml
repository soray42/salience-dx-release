seed_id: T1-018
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Una prueba de extremo a extremo en nuestra suite ha empezado a fallar de forma
  intermitente, quizás una de cada cinco ejecuciones. Comprueba que una factura recién
  creada aparece bajo "vence esta semana". El código de la aplicación relacionado
  con facturas no ha cambiado en un mes, y la prueba pasa de forma fiable cuando la
  ejecuto sola en mi máquina. En CI falla aparentemente al azar, incluso cuando fijo
  el job para que ejecute únicamente ese spec por sí solo sin que ninguna otra prueba
  comparta el proceso. {DS}
focal_diagnostic_feature: La prueba tiene codificada una cadena de fecha de vencimiento
  fija y falla únicamente en ejecuciones de CI que comienzan después de las 23:00
  UTC, cuando "esta semana" ha pasado a la siguiente semana ISO.
low_diagnostic_proposition: A comparable flaky test elsewhere was caused by tests
  sharing state when run in parallel.
oracle_action: ANSWER
oracle_focus: 'Fix the test''s time handling: the hardcoded due date crosses the week
  boundary late in the day, so make the fixture relative to a frozen clock rather
  than a literal date, rather than chasing parallelism.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the parallel-state explanation from another
  project. Ask when the failing runs occur and whether any date or time value in the
  test is fixed.
