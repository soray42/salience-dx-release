distractor_direction:
  label: estado compartido en ejecución paralela
  description: Investigar si las pruebas que se ejecutan en paralelo están pisando
    el estado compartido de base de datos o fixture, produciendo fallos intermitentes.
plausible_alternative_directions:
- label: deriva del entorno de CI
  description: Si la imagen de CI o los datos inicializados difieren del entorno local
    de una forma que solo se manifiesta en el runner.
- label: carrera de temporización asíncrona
  description: Si la aserción se adelanta a una escritura asíncrona que aún no se
    ha confirmado cuando la prueba lee.
