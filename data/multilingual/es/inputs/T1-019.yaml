xbase: Presenté mi renuncia después de recibir una oferta externa, y mi empleador
  actual respondió con una contraoferta. Igualarán el nuevo salario y, lo que es más
  importante para mí, dicen que resolverán los problemas estructurales que me hicieron
  querer irme. Genuinamente me gusta el trabajo aquí cuando las condiciones son las
  adecuadas. Tengo tres días para responder. {DS}
focal_diagnostic_feature: La contraoferta está por escrito y resuelve concretamente
  ambas razones por las que el usuario quería irse —la asignación de equipo y la línea
  de reporte—, no solo el salario.
low_diagnostic_proposition: An acquaintance who accepted a counteroffer was managed
  out of the company within a year.
