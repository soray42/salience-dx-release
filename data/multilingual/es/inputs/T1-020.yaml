variants:
  HL:
    distractor: Rasmus, un ingeniero senior de búsqueda en un marketplace en el que
      confío, me dijo con seguridad que su equipo trazó su propia regresión de relevancia
      hasta un cambio en el tokenizador que alteró cómo se dividían las consultas.
    diagnosticity: low
    salience: high
    proposition: A peer's search relevance regression was traced to a tokenizer change
      that altered how queries were split.
    salience_source: A — a trusted staff search engineer at a peer company confidently
      recounting a near-identical sudden relevance collapse.
    why_plausible: Query/document analyzer mismatches are a real and common cause
      of sudden relevance collapse, so it is a defensible first hypothesis.
    why_irrelevant: Keyword/exact matches still work and the query parser is unchanged,
      so the analysis chain is intact; the failure is confined to vector similarity,
      which a tokenizer change would not isolate.
  LL:
    distractor: La regresión de relevancia de otro equipo fue causada por un cambio
      en el tokenizador que alteró cómo se dividían las consultas.
    diagnosticity: low
    salience: low
    proposition: A peer's search relevance regression was traced to a tokenizer change
      that altered how queries were split.
    matched_to: HL
  HH:
    distractor: Al revisar el índice, solo los documentos ingestados en las últimas
      dos semanas tienen los vectores del nuevo modelo, mientras que todo lo anterior
      conserva embeddings del modelo antiguo; por tanto, la similitud coseno se calcula
      entre dos espacios de embeddings incompatibles.
    diagnosticity: high
    salience: high
    proposition: Only documents re-embedded after the upgrade carry the new model's
      vectors; the bulk of the index still holds old-model vectors, and similarity
      is being computed across two incompatible embedding spaces.
    salience_source: Direct inspection revealing the mixed-vintage vectors and the
      skipped backfill makes the two-space problem concrete.
  LH:
    distractor: Solo los documentos recién ingestados contienen vectores del nuevo
      modelo; la mayoría de los documentos más antiguos conservan vectores del modelo
      anterior, por lo que la similitud se calcula entre dos espacios de embeddings
      incompatibles.
    diagnosticity: high
    salience: low
    proposition: Only documents re-embedded after the upgrade carry the new model's
      vectors; the bulk of the index still holds old-model vectors, and similarity
      is being computed across two incompatible embedding spaces.
    matched_to: HH
distractor_direction:
  label: Desajuste en el tokenizador/analizador
  description: Investigar si un cambio en la tokenización de consultas o documentos
    rompió la alineación entre los términos indexados y los términos de la consulta.
plausible_alternative_directions:
- label: Corrupción del índice ANN
  description: Si el índice de vecinos más cercanos aproximados fue construido con
    parámetros incorrectos o se corrompió durante la actualización.
- label: Regresión en la ruta de embedding de consultas
  description: Si las consultas están siendo embebidas por un modelo o pipeline distinto
    al de los documentos.
leak_audit:
  ll_atomic_claims:
  - Another team had a search relevance regression.
  - Its cause was a tokenizer change that altered how queries were split.
  hh_atomic_claims:
  - Only documents ingested in the last two weeks carry new-model vectors.
  - The older majority of documents still carry old-model vectors (the backfill was
    never rerun).
  - Cosine similarity is therefore computed across two incompatible embedding spaces.
  hl_salience_dimensions:
    source_credibility: Named staff search engineer (Rasmus) at a trusted peer company.
    narrative_coherence: Clear source-recounted-symptom framing.
    confident_assertion: Told me confidently his team traced it to a tokenizer swap.
    concrete_detail: N/A — only the source's identity and role; no detail about the
      recounted case.
  forbidden_categories_checked_against:
  - tunable_value
  - effort_descriptor
  - severity_claim
  - sensory_distractor_about_setting
  - rambling_marker
  - hedging_language
  xbase_word_count: 70
  hl_word_count: 31
  ll_word_count: 16
  hh_word_count: 44
  lh_word_count: 23
  notes: 'xbase notes keyword matches still work and offline eval on a FRESH holdout
    looks great — both consistent with

    many causes and even superficially with a tokenizer story, since a fresh holdout
    would be freshly embedded. The

    decisive mixed-space evidence is in HH/LH only. "Offline eval on fresh holdout
    looks excellent" is a context

    symptom, not the root cause — it does not by itself let a reader conclude the
    index is mixed-vintage.

    QC repair round 1: trimmed HL.distractor to drop two case-claim leaks absent from
    LL — the mechanism ("the

    analyzer split query terms differently from how the documents were indexed") and
    the resolution ("they rebuilt

    the analysis chain"). HL now adds only source framing (name, role, peer org, confident
    verb) plus the same

    high-level tokenizer-swap cause label LL carries, restoring HL/LL propositional
    equivalence. HL recounted to 29.

    '
causal_audit:
  steelman: 'A search infrastructure lead could argue analyzer drift is the classic
    cause of a sudden relevance collapse:

    if the new model shipped with a different default tokenizer, queries and documents
    would be split inconsistently,

    producing near-random ranking while exact matches occasionally still hit — a coherent,
    common, worth-ruling-out path.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the query parser and index type are unchanged
    and exact keyword matches still work, narrowing the failure to vector similarity
    — but the affirmative mixed-space cause is supplied only in HH/LH.
unconstructable: false
