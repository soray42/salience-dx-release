seed_id: T1-020
template: T1
domain: technical_troubleshooting
complexity: high
xbase: La calidad de nuestra búsqueda semántica se desplomó en este sprint. Los usuarios
  reportan que los resultados para consultas ordinarias son ahora casi aleatorios,
  mientras que las coincidencias exactas por palabras clave siguen funcionando bien.
  Hace dos semanas actualizamos el modelo de embeddings como parte de una mejora de
  relevancia. El servicio de recuperación, el tipo de índice ANN y el parser de consultas
  no han cambiado, y la evaluación offline sobre un holdout nuevo da resultados excelentes.
  {DS}
focal_diagnostic_feature: Solo los documentos re-embebidos tras la actualización tienen
  los vectores del nuevo modelo; la mayor parte del índice conserva vectores del modelo
  anterior, y la similitud se calcula entre dos espacios de embeddings incompatibles.
low_diagnostic_proposition: A peer's search relevance regression was traced to a tokenizer
  change that altered how queries were split.
oracle_action: ANSWER
oracle_focus: Re-embed and reindex the entire corpus with the new model so the whole
  index lives in one embedding space; mixed old/new vectors make cross-space similarity
  meaningless, which is why fresh-holdout offline scores look fine.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not import the tokenizer-change explanation. Ask whether
  the full corpus was re-embedded after the model upgrade or only newly ingested documents.
