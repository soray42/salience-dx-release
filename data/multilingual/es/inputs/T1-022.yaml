seed_id: T1-022
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Un trabajo cron nocturno que envía a nuestro equipo un resumen de ventas por
  correo dejó de ejecutarse silenciosamente hace aproximadamente una semana. No llega
  ningún resumen, pero no hay ningún error en mis logs de aplicación y el script funciona
  perfectamente cuando lo ejecuto manualmente. La entrada en el crontab sigue ahí
  y tiene exactamente el mismo aspecto de siempre. Nadie tocó el horario ni el script,
  y df muestra todas las particiones muy por debajo del 80% de uso. {DS}
focal_diagnostic_feature: El log de autenticación del sistema muestra que cron rechaza
  iniciar la sesión del trabajo con 'account locked', y la cuenta de servicio dedicada
  fue bloqueada durante un proceso de hardening de seguridad hace ocho días.
low_diagnostic_proposition: A colleague's cron job stopped running because a full
  disk prevented the daemon from writing its logs.
oracle_action: ANSWER
oracle_focus: Re-enable (or replace) the locked service account the cron job runs
  as, or move the job to a permitted account; PAM is refusing the cron session because
  the account was locked, which is why no script error appears.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a full-disk cause from another case. Ask
  what the system auth/cron logs show about the job's user account and recent account
  or permission changes.
