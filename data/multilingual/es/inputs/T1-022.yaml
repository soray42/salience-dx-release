  xbase_word_count: 70
  hl_word_count: 39
  ll_word_count: 17
  hh_word_count: 45
  lh_word_count: 23
  notes: 'xbase establishes "runs by hand, no app error, crontab unchanged" — symptoms
    shared by many cron failures.

    xbase now also closes the disk pathway with a neutral df check (every partition
    well under 80% full),

    naming no affirmative cause, so the full-disk distractor retains no defensible
    mechanism for this case.

    The decisive account-locked auth-log evidence is HH/LH-only. HL no longer adds
    the resolution consequence

    ("until they cleared space") or the tunable "partition at 100%" that LL lacked;
    LH now carries HH''s

    "when the digests stopped" temporal correlation, restoring HH/LH flat equivalence.

    '
causal_audit:
  steelman: 'A platform engineer could argue a full disk is a frequent silent killer
    of scheduled jobs — cron and the mailer

    both need to write, and a wedged partition can make jobs fail without an application-level
    error, matching the

    "no error, just stopped" symptom, so checking disk usage is a legitimate early
    step.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'Yes: xbase states ''df shows every partition well under
    80% full'', a neutral check that affirmatively rules out disk pressure without
    naming the locked-account cause (given only in HH/LH); ''runs perfectly by hand''
    further shows script and environment are fine.'
