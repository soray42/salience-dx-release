  variables) differs from the interactive shell and breaks the job.: null
- label: Daemon de cron no ejecutándose
  description: Si el propio servicio cron fue detenido o crasheó en el host.
leak_audit:
  ll_atomic_claims:
  - A colleague's cron job stopped running.
  - The cause was a full disk preventing the daemon from writing its logs.
  hh_atomic_claims:
  - The auth log shows cron failing the job's session with "account locked" every
    scheduled night.
  - The failure is for the dedicated service account the job runs as.
  - That account was locked during a security-hardening pass eight days ago, matching
    when digests stopped.
  hl_salience_dimensions:
