xbase: Estoy intentando reducir mis suscripciones mensuales. Revisé el extracto de
  la tarjeta del año pasado y listé todo lo que es recurrente. Pago dos servicios
  de streaming distintos, un plan de almacenamiento en la nube, un plan de música,
  una web de noticias y una app de meditación. Quiero cancelar lo que realmente no
  uso en vez de simplemente adivinar, y tengo disponible mi historial de uso real
  para consultarlo. {DS}
focal_diagnostic_feature: El propio historial de visualización del usuario muestra
  que uno de los dos servicios de streaming fue abierto cero veces en los últimos
  seis meses, mientras que el otro fue utilizado la mayoría de las semanas.
low_diagnostic_proposition: A friend regretted cancelling a streaming service because
  a show they later wanted moved exclusively to it.
oracle_action: ANSWER
oracle_focus: Cancel the streaming service the user's own history shows unopened for
  six months; keep the one used most weeks, and review the rest against actual usage
  the same way rather than against someone else's regret story.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let a friend's content-exclusivity regret decide
  it. Ask for the user's own usage history on each service before cancelling anything.
