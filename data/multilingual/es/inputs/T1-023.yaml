distractor_direction:
  label: Arrepentimiento por contenido exclusivo futuro
  description: Tratar el riesgo de que una serie futura deseada se mueva en exclusiva
    a un servicio cancelado como la razón dominante para mantener ambas suscripciones
    de streaming.
plausible_alternative_directions:
- label: Descuento por pack o pago anual
  description: Si cambiar alguno de los servicios a un plan anual o en bundle modifica
    el cálculo de costes antes de cancelar.
- label: Uso compartido en el hogar
  description: Si alguien más en el hogar usa el servicio aparentemente inactivo aunque
    el usuario no lo haga.
