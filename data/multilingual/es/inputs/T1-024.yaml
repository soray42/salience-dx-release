variants:
  HL:
    distractor: Renata, una ingeniera de plataforma en la que confío de un trabajo
      anterior, me dijo que su equipo persiguió errores 502 similares y al final resultó
      ser un certificado TLS caducado en el servicio upstream.
    diagnosticity: low
    salience: high
    proposition: A similar 502 problem at another company was traced to an expired
      TLS certificate on the upstream service.
    salience_source: A — a trusted platform engineer recounting a closely symptom-matched
      502 investigation.
    why_plausible: Certificate problems do cause gateway errors and the symptom-match
      (random 502s, nothing in app logs) makes the anecdote feel directly applicable.
    why_irrelevant: An expired upstream certificate fails handshakes consistently
      for the affected period, not one request in fifty with no pattern; the focal
      evidence ties the 502s to reused stale keep-alive connections, a different mechanism.
  LL:
    distractor: Un problema de 502 similar en otra empresa se rastreó hasta un certificado
      TLS caducado en el servicio upstream.
    diagnosticity: low
    salience: low
    proposition: A similar 502 problem at another company was traced to an expired
      TLS certificate on the upstream service.
    matched_to: HL
  HH:
    distractor: 'Las capturas de paquetes muestran que los errores 502 caen exactamente
      en las peticiones donde el balanceador reutilizó una conexión inactiva del pool
      que el backend ya había cerrado: el timeout de keep-alive inactivo del backend
      es menor que el del balanceador, así que el balanceador escribe en un socket
      medio muerto y recibe un reset.'
    diagnosticity: high
    salience: high
    proposition: The 502s occur only on requests where the load balancer reused an
      idle keep-alive connection whose upstream had already closed it, because the
      backend keep-alive timeout is shorter than the load balancer's.
    salience_source: The packet-level correlation to reused-closed connections plus
      the timeout ordering names the mechanism precisely.
  LH:
    distractor: Los errores 502 se producen solo en conexiones del balanceador de
      carga reutilizadas después de que el backend las cerró, porque el timeout de
      keep-alive del backend es menor que el del balanceador.
    diagnosticity: high
    salience: low
    proposition: The 502s occur only on requests where the load balancer reused an
      idle keep-alive connection whose upstream had already closed it, because the
      backend keep-alive timeout is shorter than the load balancer's.
