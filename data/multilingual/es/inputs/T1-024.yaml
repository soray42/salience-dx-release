seed_id: T1-024
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Nuestra API REST devuelve de forma intermitente 502 Bad Gateway a una fracción
  de los clientes, quizás una de cada cincuenta peticiones, sin un patrón claro por
  endpoint. Los servidores de aplicación detrás del balanceador de carga no registran
  nada inusual para las peticiones afectadas, y el tráfico total está muy por debajo
  de la capacidad. No hemos desplegado código nuevo ni cambiado la configuración del
  balanceador en las últimas dos semanas. Una comprobación rápida confirmó que todos
  los certificados TLS del backend están vigentes y son coherentes en todas las instancias.
  {DS}
focal_diagnostic_feature: Los errores 502 ocurren únicamente en las peticiones donde
  el balanceador de carga reutilizó una conexión keep-alive inactiva que el upstream
  ya había cerrado, porque el timeout de keep-alive del backend es menor que el del
  balanceador.
low_diagnostic_proposition: A similar 502 problem at another company was traced to
  an expired TLS certificate on the upstream service.
oracle_action: ANSWER
oracle_focus: Align the keep-alive timeouts so the backend's idle timeout is longer
  than the load balancer's, or disable upstream keep-alive reuse; the load balancer
  is reusing connections the backend has already closed, producing the intermittent
  502s.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not import the other company's certificate-expiry
  explanation. Ask whether the 502s correlate with reused idle connections and how
  the backend and load balancer keep-alive timeouts compare.
