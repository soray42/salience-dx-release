- label: Crash del backend en peticiones específicas
  description: Si determinadas peticiones hacen crashear un worker de modo que el
    balanceador detecta una conexión caída.
- label: Fluctuación del health check del balanceador
  description: Si un backend falla los health checks de forma intermitente y es retirado
    brevemente, descartando peticiones en curso.
  dropping in-flight requests.: null
