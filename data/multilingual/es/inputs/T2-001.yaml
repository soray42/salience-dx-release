xbase: Mi iPhone lleva cuatro días calentándose y perdiendo batería rápidamente. La
  actualización de apps en segundo plano está desactivada y el teléfono funciona con
  normalidad en todo lo demás. Esta semana no he instalado ninguna actualización de
  iOS. {DS}
focal_diagnostic_feature: Los ajustes de batería muestran que una sola app de edición
  de fotos de terceros acapara la mayor parte de la actividad en segundo plano.
low_diagnostic_proposition: The battery drain began shortly after an Apple ID password
  change.
