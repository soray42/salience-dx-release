  description: Investigar si la mudanza física de la oficina del equipo o el entorno
    de red de la nueva oficina es responsable de la latencia en el pago.
plausible_alternative_directions:
- label: Lentitud en un servicio dependiente
  description: Un servicio de pago, inventario o detección de fraude es lento y solo
    se manifiesta en la latencia p99 del checkout.
- label: Agotamiento del pool de conexiones
  description: Las instancias de la aplicación están agotando los pools de conexiones
    a la base de datos o a otros servicios bajo carga.
- label: Patrón de fallo de caché
  description: Una invalidación de caché o un cambio en la distribución de claves
    está provocando trabajo costoso repetido en el backend.
