complexity: medium
xbase: El monitor externo 4K de mi MacBook se desconecta y se vuelve a conectar cada
  pocos minutos. El monitor enciende bien y el problema es intermitente, no un fallo
  total. El cable HDMI tiene un par de años. {DS}
focal_diagnostic_feature: Doblar el cable HDMI cerca del extremo del monitor reproduce
  el parpadeo, y el mismo monitor funciona con otro cable.
low_diagnostic_proposition: The issue began after a thunderstorm passed through the
  area.
oracle_action: ANSWER
oracle_focus: Replace the HDMI cable; the physical bend test and known-good cable
  comparison isolate the fault.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume storm damage from timing alone. Ask whether
  moving the cable reproduces the fault and whether a known-good cable works.
