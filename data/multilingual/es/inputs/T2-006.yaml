distractor_direction:
  label: Cambio de periférico en la estación de trabajo
  description: Investigar si un cambio en el hardware local o en los periféricos del
    escritorio afectó de alguna manera al script de scraping.
plausible_alternative_directions:
- label: Bloqueo por reputación de IP
  description: El sitio está bloqueando peticiones del rango de IP del usuario por
    reputación o volumen de solicitudes.
- label: Cambio en el requisito de autenticación
  description: El sitio ahora exige inicio de sesión, cookies o tokens para páginas
    que antes eran públicas.
- label: Aplicación de límites de velocidad
  description: El sitio público ha empezado a aplicar límites de peticiones por cliente
    más estrictos.
