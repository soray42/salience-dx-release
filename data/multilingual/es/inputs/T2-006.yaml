variants:
  HL:
    distractor: Los fallos comenzaron la mañana después de que cambié mi monitor antiguo
      por uno de 27 pulgadas y reubiqué todos los cables bajo el escritorio.
    diagnosticity: low
    salience: high
    proposition: The 403s began shortly after a peripheral hardware change on the
      user's desk.
    salience_source: exact temporal order, concrete hardware change
    why_plausible: Users often associate any recent setup change with a new failure.
    why_irrelevant: A monitor change cannot cause a remote server to send policy-based
      403 responses to an automated user-agent.
  LL:
    distractor: El problema comenzó alrededor del momento en que hubo un cambio de
      periférico en la estación de trabajo local.
    diagnosticity: low
    salience: low
