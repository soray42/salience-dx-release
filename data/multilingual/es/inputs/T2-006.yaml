      user's desk.
    matched_to: HL
  HH:
    distractor: 'Las cabeceras de la petición dicen literalmente `User-Agent: Python-urllib`
      y los términos del sitio indican que la recopilación automatizada no está permitida.'
    diagnosticity: high
    salience: high
    proposition: The script identifies itself with a Python user-agent and the site's
      terms prohibit automated access.
    salience_source: request-header and policy evidence
  LH:
    distractor: El script declara un User-Agent de Python y los términos del sitio
      de destino prohíben el acceso automatizado.
    diagnosticity: high
    salience: low
    proposition: The script identifies itself with a Python user-agent and the site's
