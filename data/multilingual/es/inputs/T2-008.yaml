xbase: Mi lavadora ha dejado la ropa empapada al final de cada ciclo durante la última
  semana. La máquina llega al final del programa sin mostrar ningún código de error.
  {DS}
focal_diagnostic_feature: El paso de centrifugado ahora suena más lento, con un tono
