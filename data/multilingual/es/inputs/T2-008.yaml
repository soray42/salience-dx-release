    están parcialmente obstruidos.
- label: Desequilibrio de la carga
  description: La máquina interrumpe el centrifugado porque la carga está desequilibrada.
- label: Error en la configuración del programa
  description: El ciclo seleccionado o la configuración de centrifugado impide una
    etapa de centrifugado normal.
