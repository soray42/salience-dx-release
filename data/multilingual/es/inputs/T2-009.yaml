- label: Presión baja en los neumáticos
  description: Los neumáticos desinflados están aumentando la resistencia de rodadura
    en la misma ruta.
- label: Problema de alineación de la rueda
  description: Una rueda está desalineada o roza en algún otro lugar además de la
    pastilla de freno identificada.
