xbase: Nuestro controlador de ingress de Kubernetes descarta una pequeña pero notable
  proporción de peticiones con 502 Bad Gateway durante los picos de tráfico. Los errores
  no están presentes con tráfico estable y bajo. {DS}
focal_diagnostic_feature: Los 502 ocurren cuando un upstream supera aproximadamente
  2.000 conexiones concurrentes, y el p99 de ese servicio está cerca de su timeout
  de readiness de un segundo.
low_diagnostic_proposition: The pattern appeared in metrics during a period of dashboard
  cleanup by a new SRE.
oracle_action: ANSWER
oracle_focus: The upstream is likely flapping readiness or failing under spike load;
  tune readiness timeout/failureThreshold and add capacity or connection limits.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not blame dashboard housekeeping. Ask for upstream-level
  correlation, readiness events, and latency near probe thresholds.
