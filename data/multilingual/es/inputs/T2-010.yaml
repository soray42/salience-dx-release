  description: Investigar si la limpieza del dashboard, los paneles faltantes o los
    cambios en la presentación de métricas modificaron cómo aparecen los errores 502.
plausible_alternative_directions:
- label: Configuración de timeout del ingress
  description: Los ajustes de timeout o de reintento del controlador de ingress son
    demasiado agresivos durante los picos.
- label: Health checks del balanceador de carga
  description: El comportamiento de los health checks está eliminando upstreams temporalmente
    durante el tráfico en ráfaga.
- label: Retraso del autoescalado
  description: La capacidad escala demasiado lentamente para los picos de tráfico,
    provocando fallos transitorios en el upstream.
