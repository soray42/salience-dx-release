seed_id: T2-011
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Usamos un CRM SaaS para enviar eventos de pedidos al endpoint webhook de nuestro
  equipo, desplegado en una plataforma cloud importante — no en nuestra red de oficina.
  Las entregas empezaron a fallar de forma intermitente hace aproximadamente una semana;
  aproximadamente la mitad se completan y el resto dan error. La página de estado
  de la plataforma cloud no muestra incidentes y el endpoint no ha sido redespliegado
  recientemente. {DS}
focal_diagnostic_feature: El dashboard de entregas de webhooks del proveedor SaaS
  muestra HTTP 401 en cada entrega fallida, y el registro de eventos del dashboard
  muestra que el secreto de firma del webhook fue rotado hace tres días sin que se
  realizara la actualización correspondiente en el código de verificación de firma
  del endpoint.
low_diagnostic_proposition: 'The webhook delivery failures began right after the office
  desks were rearranged.

  '
oracle_action: ANSWER
oracle_focus: 'The HTTP 401 responses confirm a webhook authentication failure. The
  signing secret was rotated in the SaaS provider''s dashboard but the receiving application
  was not updated to use the new secret for signature verification; correcting the
  secret in the application config will resolve the failures.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Request the webhook delivery logs and HTTP response
  codes from the SaaS provider dashboard to identify the failure mode; do not attribute
  the failures to the office desk rearrangement, as a cloud-hosted endpoint is entirely
  outside the office physical environment and the rearrangement has no pathway to
  affect it.

  '
