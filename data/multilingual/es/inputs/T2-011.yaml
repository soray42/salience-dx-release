distractor_direction:
  label: reorganización del espacio de oficina
  description: Se propone la reorganización física de los escritorios de la oficina
    como causa de los fallos en las entregas del webhook, basándose en coincidencia
    temporal. El endpoint alojado en la nube está arquitectónicamente aislado de la
    infraestructura local de la oficina, por lo que esta dirección no tiene vía causal.
plausible_alternative_directions:
- label: interrupción parcial de la plataforma cloud
  description: Un incidente sutil o regional en la plataforma cloud que no se refleje
    en la página de estado podría estar causando respuestas 5xx intermitentes, que
    el proveedor SaaS registraría como fallos de entrega.
- label: limitación de tasa por el proveedor SaaS
  description: El proveedor SaaS puede haber comenzado a limitar las entregas a este
    endpoint debido a un mayor volumen de eventos o a un cambio de política, provocando
    fallos intermitentes desde el lado del proveedor.
- label: expiración del certificado TLS
  description: El certificado TLS del endpoint en la nube puede haber expirado o entrado
    en un período de renovación, causando que algunos intentos de entrega fallen con
    errores de handshake.
