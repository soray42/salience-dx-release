xbase: Mi e-reader pasó de durar tres semanas con una carga a agotarse en dos días,
  y no he cambiado mi forma de usarlo — los mismos hábitos de lectura, el mismo brillo
  de pantalla. Compré una nueva lámpara de mesita de noche más o menos al mismo tiempo,
  pero el e-reader nunca se conecta a ella ni se enchufta a ella de ninguna manera.
  No he instalado ninguna aplicación nueva ni he cambiado ninguna configuración que
  recuerde. {DS}
focal_diagnostic_feature: El Wi-Fi está activado y configurado para sincronizarse
  automáticamente en segundo plano, y se confirmó que estaba desactivado antes de
  que comenzara la descarga de batería.
low_diagnostic_proposition: 'The new bedside lamp is causing the e-reader battery
  to drain faster.

  '
oracle_action: ANSWER
oracle_focus: 'Disable Wi-Fi or turn off background auto-sync; the enabled Wi-Fi with
  constant background syncing is the confirmed change that explains the battery life
  dropping from weeks to days.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Ask the user to check e-reader settings — specifically
