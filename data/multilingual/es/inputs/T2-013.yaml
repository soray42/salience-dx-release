variants:
  HL:
    distractor: Camille, nuestra responsable de comunicación que dirigió el lanzamiento
      del cambio de marca, me dijo que ya ha visto este patrón exacto antes y está
      convencida de que el anuncio del cambio de marca desencadenó la limitación de
      velocidad.
    diagnosticity: low
    salience: high
    proposition: The upload throttling began because of the company's rebrand announcement.
    salience_source: 'A (source credibility): Camille is named, role-anchored as communications
      lead, and positioned as someone with pattern-recognition authority ("seen this
      exact pattern before"). B (narrative coherence): clean professional register.
      C (confident assertion): "is confident … triggered."

      '
    why_plausible: 'A named colleague with direct rebrand involvement asserting a
      causal link with confident framing and apparent prior-pattern knowledge can
      cause a busy responder to treat the temporal coincidence as an explained fact
      rather than an uninvestigated correlation.

      '
    why_irrelevant: 'A communications-role rebrand (new name, new logo) touches no
      cloud infrastructure; the xbase explicitly confirms bucket name and IAM credentials
      are unchanged, closing every credential/endpoint pathway. Throttling is a server-side
      rate-enforcement response to request volume or size, which a marketing announcement
      cannot alter.

      '
  LL:
    distractor: Un compañero sugirió que la limitación de subidas comenzó a causa
      del anuncio del cambio de marca de la empresa.
    diagnosticity: low
    salience: low
    proposition: The upload throttling began because of the company's rebrand announcement.
    matched_to: HL
  HH:
    distractor: La refactorización del CI hace dos semanas distribuyó los trabajos
      de prueba en 32 shards paralelos, cada uno subiendo artefactos simultáneamente;
      el almacenamiento en la nube aplica límites de velocidad de solicitudes por
      prefijo, y este fan-out casi con toda seguridad empujó el pipeline por encima
      de ese umbral.
    diagnosticity: high
    salience: high
    proposition: 'The pipeline was refactored two weeks ago to fan out across 32 parallel
      test shards, multiplying concurrent PUT requests per prefix to a level that
      exceeds the cloud storage account''s default per-prefix request rate limit.

      '
    salience_source: 'C (confident assertion): "almost certainly pushed past that
      threshold." D (concrete believable detail): specific shard count (32) and technical
      mechanism (per-prefix request rate limit) stated precisely.

      '
  LH:
    distractor: El pipeline ahora ejecuta 32 shards paralelos que suben artefactos
      de forma concurrente, lo que puede superar el límite de velocidad de solicitudes
      por prefijo del almacenamiento en la nube.
    diagnosticity: high
    salience: low
    proposition: 'The pipeline was refactored two weeks ago to fan out across 32 parallel
