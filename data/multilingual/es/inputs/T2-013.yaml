seed_id: T2-013
template: T2
domain: technical_troubleshooting
complexity: high
xbase: 'Durante la última semana, nuestro pipeline de CI ha estado recibiendo errores
  HTTP 503 ''SlowDown'' en cada subida de artefactos a nuestro bucket de almacenamiento
  en la nube. El nombre del bucket y las credenciales IAM no han cambiado, por lo
  que no hubo modificación en la configuración a nivel de cuenta. La limitación de
  velocidad apareció el mismo día en que la empresa anunció públicamente nuestro cambio
  de marca —nuevo nombre, nuevo logotipo— y no ha cesado desde entonces.

  {DS}'
focal_diagnostic_feature: El pipeline fue refactorizado hace dos semanas para distribuirse
  en 32 shards de prueba paralelos, multiplicando las solicitudes PUT concurrentes
  por prefijo hasta un nivel que supera el límite de velocidad de solicitudes por
  prefijo predeterminado de la cuenta de almacenamiento en la nube.
low_diagnostic_proposition: 'The upload throttling began because of the company''s
  rebrand announcement.

  '
oracle_action: ANSWER
oracle_focus: 'Investigate the per-prefix PUT request rate introduced by the 32-shard
  parallelism refactor; add request-rate-aware retry/backoff, spread uploads across
  multiple prefixes, or request a quota increase from the cloud provider.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Ask for evidence of what changed in the CI pipeline
  or cloud account around the time throttling began; note that a rebrand announcement
  (new name/logo) with unchanged bucket names and credentials has no infrastructure
  pathway to cause storage throttling, so the timing is coincidental.

  '
