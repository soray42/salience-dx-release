- label: cambio en el tratamiento del agua
  description: Los niveles de cloro o cloramina municipales pueden fluctuar estacionalmente
    o tras cambios en la infraestructura, y los desinfectantes elevados suprimen la
    microbiota de la masa madre incluso con la misma fuente de grifo.
- label: contaminación o dilución del cultivo
  description: La introducción de organismos competidores a través de un utensilio
    sin lavar, o la sobredilución del cultivo mediante alimentaciones con proporciones
    incorrectas, podría desequilibrar la microbiota lo suficiente como para reducir
    la fiabilidad del levado.
