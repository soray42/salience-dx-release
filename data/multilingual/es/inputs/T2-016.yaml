template: T2
domain: open_qa
complexity: high
xbase: 'Soy autónomo y mis facturas a mi cliente principal solían pagarse en unos
  15 días. En los últimos dos meses están llegando alrededor del día 45. El momento
  coincide con cuando actualicé mi plantilla de factura: cambié las fuentes, el esquema
  de colores y el logotipo, pero la línea de condiciones de pago sigue poniendo net-15
  y todos los mismos campos están en las mismas posiciones. {DS}'
focal_diagnostic_feature: Se confirma que el rediseño de la plantilla es puramente
  cosmético (sin cambios en campos ni contenido) y el cliente reestructuró su cadena
  de aprobación de cuentas por pagar alrededor del momento en que comenzaron los retrasos,
  lo que convierte la reestructuración de la cadena de AP en el factor causal decisivo;
  el rediseño visual es estructuralmente irrelevante.
low_diagnostic_proposition: 'Clients can slow down payments when an invoice design
  looks unfamiliar.

  '
oracle_action: ASK
oracle_focus: 'Ask the client what changed on their side around two months ago — new
  payment approver, changed approval cycle, cash flow constraints, or invoice routing
  change — since the template change was purely cosmetic and the AP approval chain
  restructuring is the decisive client-side factor.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Do not adopt the visual-redesign story; the template
  change was cosmetic with no field or content changes, so the design cannot be the
  cause. Ask the client what changed on their end around the time delays began.

  '
