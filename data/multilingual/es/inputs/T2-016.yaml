distractor_direction:
  label: diseño visual desconocido de la factura
  description: La plantilla de factura rediseñada tiene un aspecto diferente para
    el cliente, y esta falta de familiaridad visual les lleva a procesarla o aprobarla
    más lentamente.
plausible_alternative_directions:
- label: problemas de liquidez del cliente
  description: El cliente está experimentando dificultades financieras y está alargando
    los ciclos de pago con todos sus proveedores, sin relación con el formato de la
    factura.
- label: fallo en la entrega o el enrutamiento de facturas
  description: Las facturas no están llegando al destinatario correcto —van al spam,
    a una dirección de correo electrónico cambiada o al departamento equivocado— lo
    que provoca retrasos en la cola antes de que comience el procesamiento.
- label: retención por verificación en la plataforma de pago
  description: Los pagos del autónomo han sido sometidos a una verificación adicional
    o revisión antifraude por parte del banco o la plataforma, añadiendo días de procesamiento
    con independencia del flujo de aprobación interno del cliente.
