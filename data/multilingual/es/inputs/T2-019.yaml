causal_audit:
  steelman: 'One could imagine new monitors at an odd resolution or scaling making
    zero-size chart canvases, or the new floor

    sitting behind a different network segment with stricter egress — but the data
    API loads fine on the same network,

    and the blanks follow individuals across refreshes regardless of display, so neither
    monitors nor floor can be the

    discriminating factor.

    '
  steelman_verdict: no_defensible_mechanism
