    proposition: The blank charts started appearing right after the team was moved
      to a new floor with new monitors.
    salience_source: B/C — a confident first-person timeline pinning the symptom to
      a concrete, recent workplace change.
    why_plausible: A move plus new hardware is a big visible change, so it is tempting
      to treat as the trigger when complaints surface afterward.
    why_irrelevant: A different floor and new monitors cannot alter which JavaScript
      a browser blocks; the split tracks browser extensions, not desks or displays.
  LL:
