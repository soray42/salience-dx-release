  HH:
    distractor: En un portátil afectado, la consola muestra que la solicitud del paquete
      de gráficos es bloqueada por un filtro de contenido y nunca llega a la red.
      Se sirve desde una ruta que contiene "analytics", que los listados comunes de
      bloqueadores de anuncios coinciden, por lo que los usuarios con bloqueador pierden
      exactamente ese script mientras la API de datos sigue cargando.
    diagnosticity: high
    salience: high
    proposition: For affected users the browser console shows the charting bundle
      request blocked by a client-side filter, and the bundle is served from a path
