template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Los gráficos del panel de análisis interno aparecen en blanco para algunos
  miembros del equipo, mientras que otros los ven perfectamente. La página en sí carga,
  la API de datos devuelve 200 con JSON válido y no hay errores en el servidor. Las
  personas que ven los gráficos en blanco juran que no hicieron nada diferente, y
  un refresco forzado no les ayuda. No cambiamos la biblioteca de gráficos este trimestre.
  {DS}
focal_diagnostic_feature: Para los usuarios afectados, la consola del navegador muestra
  la solicitud del paquete de gráficos bloqueada por un filtro del lado del cliente,
  y el paquete se sirve desde una ruta que contiene la palabra "analytics" que los
  listados de bloqueadores de anuncios coinciden.
low_diagnostic_proposition: The blank charts started appearing right after the team
  was moved to a new floor with new monitors.
oracle_action: ANSWER
oracle_focus: Rename or reverse-proxy the charting bundle off the "analytics"-matching
  path (or whitelist it); ad-block/content filters are blocking that script for the
  affected browsers, which is why the API succeeds but charts stay blank.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a floor move or new monitors to blank
  charts. Ask what the affected users' browser console shows and whether any script
  request is blocked.
