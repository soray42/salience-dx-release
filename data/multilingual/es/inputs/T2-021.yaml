template: T2
domain: technical_troubleshooting
complexity: low
xbase: Algunas teclas de mi portátil han empezado a escribir caracteres incorrectos.
  Cuando pulso la tecla de comillas dobles obtengo una arroba, la tecla de arroba
  me da comillas dobles, y el símbolo de la libra esterlina y el de almohadilla también
  están intercambiados. Las letras y los números funcionan bien. Ocurre lo mismo en
  todas las aplicaciones y el teclado físico parece estar en buen estado. {DS}
focal_diagnostic_feature: Los caracteres intercambiados son exactamente las diferencias
  entre las distribuciones de teclado del Reino Unido y de EE. UU., y el indicador
  de idioma de entrada del sistema operativo ahora muestra inglés de EE. UU. en lugar
  de la distribución del Reino Unido que tenía antes.
low_diagnostic_proposition: The wrong characters started appearing right after the
  keyboard was cleaned with a disinfectant wipe.
oracle_action: ANSWER
oracle_focus: Switch the OS keyboard layout back to UK English; the specific quote/at
  and hash/pound swaps are the signature of a US-vs-UK layout mismatch, not a hardware
  fault.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect wiping the keyboard to character mapping.
  Ask which exact characters are swapped and what the OS keyboard-layout setting is
  now set to.
