  translation_notes: 'UK/US keyboard layout names are kept as ''Reino Unido'' and
    ''EE. UU.'' for clarity; the layout indicator strings ''US'' and ''UK'' are kept
    literally as they appear on-screen. ''Almohadilla'' is the standard Spanish term
    for the hash/pound sign (#); ''libra esterlina'' (£) is used to distinguish the
    pound symbol. The pound/hash swap: in Spanish the UK ''£'' vs ''#'' distinction
    carries through. ''Toallita desinfectante'' is the natural Spanish for disinfectant
    wipe. Technical terms (firmware, controlador) kept in conventional Spanish loan
    form.'
