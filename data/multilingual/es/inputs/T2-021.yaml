distractor_direction:
  label: Daño por limpieza/líquido
  description: Tratar la reciente limpieza con desinfectante como si hubiera dañado
    el hardware del teclado y alterado la asignación de teclas.
plausible_alternative_directions:
- label: Tecla modificadora atascada
  description: Si una tecla modificadora mantenida pulsada (como la tecla de función
    o el bloqueo de mayúsculas) está alterando los caracteres producidos.
- label: Fallo de firmware/controlador del teclado
  description: Si un problema con el controlador o el firmware del teclado está reasignando
    las entradas a bajo nivel.
