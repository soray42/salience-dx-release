variants:
  HL:
    distractor: Mi PI sénior echó un vistazo al tiempo de ejecución y dijo, con mucha
      seguridad, que siempre es un problema de versión incorrecta del driver de CUDA.
    diagnosticity: low
    salience: high
    proposition: A senior lab member states that the CUDA driver version is the main
      cause of this kind of slowdown.
    salience_source: authority title, confident universal claim, technical-sounding
      cause
    why_plausible: CUDA mismatches are real and the PI's status makes the explanation
      feel reliable.
    why_irrelevant: The profiler points to data loading and under-utilised GPU, which
      is not the signature of a driver-version bottleneck.
  LL:
    distractor: Un miembro sénior del laboratorio afirmó que la versión del driver
      de CUDA es la principal causa de este tipo de ralentización.
    diagnosticity: low
    salience: low
    proposition: A senior lab member states that the CUDA driver version is the main
      cause of this kind of slowdown.
    matched_to: HL
  HH:
    distractor: La utilización de la GPU oscila entre el 5% y el 30%, y el profiler
      muestra que el trabajo está esperando en el dataloader mientras los datos residen
      en un SSD montado en red.
    diagnosticity: high
    salience: high
    proposition: Profiling shows low GPU utilisation with most time spent in the dataloader,
      and the dataset is on a network-mounted drive.
    salience_source: profiler attribution and resource-utilisation pattern
  LH:
    distractor: El profiling muestra una utilización baja de la GPU y ejecución limitada
      por el dataloader; el conjunto de datos está almacenado en un volumen montado
      en red.
    diagnosticity: high
    salience: low
    proposition: Profiling shows low GPU utilisation with most time spent in the dataloader,
      and the dataset is on a network-mounted drive.
    matched_to: HH
distractor_direction:
  label: Incompatibilidad del driver de CUDA
  description: Investigar si la versión del driver de CUDA instalada es incorrecta
    o incompatible, causando la ralentización del entrenamiento.
plausible_alternative_directions:
- label: Precisión mixta desactivada
  description: El trabajo entrena en precisión completa mientras que la ejecución
    de comparación usa precisión mixta.
- label: Discrepancia en el tamaño de lote
  description: La ejecución local usa un tamaño de lote efectivo diferente o una configuración
    de acumulación de gradientes distinta.
- label: Cuello de botella en preprocesamiento por CPU
  description: La decodificación o el preprocesamiento de datos está saturado antes
    de que los tensores lleguen a la GPU.
