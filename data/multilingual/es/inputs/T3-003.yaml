xbase: Nuestro clúster Redis fragmentado tiene un nodo llenándose lentamente. El nodo
  2 está al 92% de maxmemory después de 11 días, mientras que los nodos 1 y 3 están
  en torno al 45%. El Slowlog del nodo 2 no muestra nada destacable. {DS}
focal_diagnostic_feature: El análisis de hot-key muestra que un prefijo de clave en
  el nodo 2 representa una gran proporción de la memoria y no tiene TTL ni rotación.
low_diagnostic_proposition: A senior engineer says Redis memory fragmentation should
  be treated as the main cause.
oracle_action: ANSWER
oracle_focus: Add TTL/rotation or trimming for the unbounded prefix, then rebalance
  if needed; this is not primarily generic fragmentation.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept generic Redis folklore from authority.
  Ask for keyspace analysis, TTLs, and memory distribution by prefix.
