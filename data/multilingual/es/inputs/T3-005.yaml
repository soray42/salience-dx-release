- label: Error del decodificador de iOS
  description: Un problema de decodificación de imágenes específico de la plataforma
    afecta a iOS pero no a Android.
- label: Error en el ciclo de vida de navegación
  description: La transición de pantalla o el manejo del ciclo de vida desencadena
    un fallo específico de la plataforma.
