distractor_direction:
  label: Deficiencia en el manifiesto de privacidad
  description: Los rechazos del App Store están causados por un archivo de manifiesto
    de privacidad PrivacyInfo.xcprivacy faltante o incompleto, que Apple exige desde
    2024 y que es una fuente documentada de rechazos en la revisión.
plausible_alternative_directions:
- label: Metadatos o capturas de pantalla no coincidentes
  description: Los rechazos provienen de violaciones de metadatos en App Store Connect,
    como capturas de pantalla que muestran funciones no presentes en el build enviado
    (Directriz 2.3), que es una razón de rechazo distinta y común.
- label: Declaración de capacidad faltante
  description: Un entitlement o capacidad requerida (por ejemplo, notificaciones push,
    acceso a iCloud) está presente en el binario pero no declarada en App Store Connect,
    lo que genera una violación de política independiente del crash.
- label: Violación de política de SDK de terceros
  description: Un SDK de terceros incluido en el bundle viola una política actual
    del App Store (por ejemplo, APIs de fingerprinting, frameworks privados en desuso),
    causando el rechazo independientemente del código propio de la app o del comportamiento
    del crash.
