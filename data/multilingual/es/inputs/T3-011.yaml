xbase: Mi app de iOS ha fallado la revisión de App Store dos veces, y he recibido
  una carta de rechazo formal de Apple tras cada envío. Las cartas son detalladas
  y específicas; las compartí en nuestro canal de Slack del equipo para que el equipo
  pudiera leerlas antes de decidir los próximos pasos. Kwame, nuestro arquitecto sénior,
  respondió en minutos sin pedir ver las cartas. {DS}
