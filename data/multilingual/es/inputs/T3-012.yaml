seed_id: T3-012
template: T3
domain: technical_troubleshooting
complexity: high
xbase: Nuestro primario de Postgres 15 ha estado enviando streaming a un standby en
  caliente durante seis meses sin incidentes. Durante las últimas tres semanas, pg_stat_replication
  muestra que replay_lag salta a entre 8 y 12 minutos cada noche exactamente a las
  02:15 y se despeja a las 02:30. Revisé pg_stat_progress_vacuum — no había workers
  de autovacuum activos durante ninguna ventana de pico. Extraje el programa completo
  de procesos para esa ventana. {DS}
focal_diagnostic_feature: pg_stat_activity a las 02:15 muestra un proceso ETL de bulk-INSERT
  recurrente, y la línea temporal de write_lag en pg_stat_replication coincide exactamente
  con la tasa de generación de WAL de esa carga por lotes.
low_diagnostic_proposition: 'PgBouncer connection pool configuration is causing the
  scheduled replication lag.

  '
oracle_action: ANSWER
oracle_focus: 'Investigate the nightly bulk-INSERT ETL job starting at 02:15; its
  WAL generation volume is directly correlated with the replication lag window and
  is the root cause. PgBouncer operates entirely outside the streaming replication
  path and cannot be causal.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Ask for evidence from pg_stat_activity, pg_stat_replication,
  and the process schedule at 02:15 to identify what is generating WAL during the
  spike window; note that PgBouncer manages client connections and has no pathway
  to influence WAL sender throughput or standby apply rate.

  '
