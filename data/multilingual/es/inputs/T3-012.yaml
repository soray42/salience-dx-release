distractor_direction:
  label: Pool de conexiones de PgBouncer
  description: La hipótesis de que la configuración del pool de conexiones de PgBouncer
    es responsable del pico nocturno de retraso de replicación. PgBouncer opera en
    la capa de conexión cliente-primario y no tiene ningún mecanismo para afectar
    al rendimiento de la replicación en streaming.
plausible_alternative_directions:
- label: Presión de escritura del checkpoint
  description: Un checkpoint intensivo a las 02:15 — desencadenado por páginas sucias
    acumuladas de actividad de escritura anterior — causa saturación de I/O en el
    primario, ralentizando el flush de WAL a disco y retrasando así la entrega al
    standby.
- label: Conflicto de consultas en el hot standby
  description: Las consultas de lectura de larga duración en el hot standby entran
    en conflicto con la aplicación de WAL a las 02:15, haciendo que el standby pause
    la aplicación (max_standby_streaming_delay), lo que se registra como replay_lag
    aunque el primario esté bien.
- label: Cuello de botella en el archivado de WAL
  description: El archive_command es lento o está bloqueado a las 02:15 — por ejemplo,
    un montaje NFS lento o un trabajo de backup en competencia — haciendo que los
    segmentos de WAL se encolen en el primario antes de que el standby pueda recibirlos.
