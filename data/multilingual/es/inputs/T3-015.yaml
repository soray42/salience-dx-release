xbase: En el jardín trasero de mi casa tengo un pequeño césped de unos 12 metros cuadrados,
  situado bajo dos abedules adultos. El paso de personas es muy escaso —lo cruzo de
  vez en cuando para llegar al compostador—. El césped presenta zonas irregulares
  en algunos puntos, y llevan años sin hacerle ningún trabajo de suelo. Lo mencioné
  a la presidenta del club de jardinería en nuestra reunión de otoño. {DS}
focal_diagnostic_feature: La prueba de penetración con destornillador no detecta compactación,
  y las zonas ralas se correlacionan directamente con la copa más densa del árbol
  en lugar de con los caminos de tránsito, lo que apunta a la sombra y a la competencia
  radicular como causa en lugar de al suelo compactado.
low_diagnostic_proposition: 'The lawn needs autumn core aeration.

  '
oracle_action: ANSWER
oracle_focus: 'Soil compaction is ruled out by the easy screwdriver penetration; the
  sparse patches tracking the densest shade under the birches points to shade and
  root competition as the cause. Autumn aeration is not indicated; the user should
  focus on shade management — overseeding with shade-tolerant fine fescue and optionally
  thinning the canopy — rather than aerating.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'The president''s recommendation is generic and not specific
  to this lawn''s condition; before confirming the advice, ask about signs of compaction
