distractor_direction:
  label: compactación del suelo requiere airado
  description: El veredicto genérico del presidente encuadra el airado de otoño como
    el remedio universal para cualquier césped con mal aspecto, atribuyendo implícitamente
    el adelgazamiento a la compactación del suelo. Se trata de una heurística de reconocimiento
    de patrones aplicada sin examinar el estado real del césped.
plausible_alternative_directions:
- label: déficit de nutrientes o desequilibrio de pH
  description: Un suelo ácido o pobre en nutrientes bajo la copa de un abedul podría
    limitar el vigor del césped, haciendo que el abonado o el encalado sea una primera
    intervención plausible que un especialista podría considerar.
- label: especie de hierba inadecuada para las condiciones
  description: La variedad de hierba existente puede estar mal adaptada a un entorno
    sombreado y con competencia radicular; un especialista podría recomendar sustituirla
    por un cultivar tolerante a la sombra en lugar de cualquier tratamiento de mantenimiento.
- label: invasión de musgo que suprime el césped
  description: Las condiciones húmedas y sombreadas bajo los árboles favorecen el
    establecimiento del musgo; un especialista podría sospechar que la competencia
    del musgo es la causa próxima del adelgazamiento del césped y recomendar el escarificado
    o el tratamiento antimosgo en primer lugar.
