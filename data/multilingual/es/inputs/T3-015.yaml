causal_audit:
  steelman: 'Argument for compaction being a live diagnosis: Tree roots can create

    an uneven, shallow surface-soil structure; even light foot traffic over

    several years on a small enclosed lawn may produce localised surface

    capping, particularly on clay-rich soils common in temperate gardens.

    Some extension-service guidance recommends annual autumn aeration as

    low-cost preventive maintenance regardless of visible compaction, on the

    basis that aeration improves winter water infiltration and root-zone

    gas exchange even in non-compacted soils. A garden adviser who had not

    seen the lawn might reasonably list aeration as worth considering.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'N/A — the screwdriver penetration test and the canopy-correlated
    thinning pattern are not in xbase; they live exclusively in the HH/LH variants.
    xbase presents only the bare symptom (patchy grass on a lightly trafficked shaded
    lawn), leaving compaction as a live hypothesis at the xbase stage.

    '
