plausible_alternative_directions:
- label: planificación del crecimiento de ingresos
  description: 'El usuario debería basar su decisión en la proyección de ingresos
    futuros: si se espera que las ganancias superen el umbral de equilibrio en un
    horizonte definido, constituir la sociedad ahora podría reducir los costes de
    cambio.'
- label: requisito impuesto por el cliente
  description: Algunos clientes o plataformas exigen que los proveedores operen como
    sociedad limitada por razones contractuales o de contratación, lo que podría anular
    el cálculo coste-beneficio independientemente del nivel de ingresos.
- label: eficiencia en las aportaciones a pensiones
