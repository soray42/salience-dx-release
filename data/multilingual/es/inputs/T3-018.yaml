distractor_direction:
  label: batching por problema N+1 de consultas
  description: Investigar si los resolvers generan muchas consultas de base de datos
    por elemento y resolverlo con batching.
plausible_alternative_directions:
- label: pico de serialización de respuesta
  description: Si el ensamblado o la serialización ocasional de respuestas grandes
    en la capa GraphQL explica la latencia intermitente de varios segundos.
- label: pausa de GC en tiempo de ejecución
  description: Si las pausas intermitentes de recolección de basura o del tiempo de
    ejecución en el proceso de la API producen las respuestas con ráfagas de varios
    segundos.
