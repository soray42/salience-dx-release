template: T3
domain: technical_troubleshooting
complexity: medium
xbase: Un endpoint GraphQL de nuestra API va lento de forma intermitente —habitualmente
  rápido, pero de vez en cuando una petición tarda entre tres y cuatro segundos en
  responder—. Resuelve el perfil de un usuario junto con su nivel de fidelización
  actual. Las respuestas lentas se producen con la misma forma de consulta que normalmente
  es rápida, y la base de datos que gestiona el equipo tiene poca carga. Tenemos el
  trazado distribuido activado, y las trazas muestran que todos los resolvers de base
  de datos completan en milisegundos de un solo dígito, sin query fan-out. {DS}
focal_diagnostic_feature: Las trazas muestran que el tiempo lento se invierte en una
  única llamada saliente a la REST API de un proveedor externo de fidelización que
  tarda de forma intermitente ~3 segundos; los resolvers de base de datos completan
  en milisegundos de un solo dígito.
low_diagnostic_proposition: A senior engineer says intermittent GraphQL slowness is
  classically an N+1 query problem and should be addressed with batching.
oracle_action: ANSWER
oracle_focus: Address the slow third-party loyalty REST call shown in traces — add
  a timeout, cache, or circuit breaker around it; the database resolvers are fast,
  so this is not an N+1 query problem.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Reject the N+1 diagnosis: the traces already show the
  database resolvers finishing in single-digit milliseconds with no fan-out, so batching
  is misdirected. Ask what the traces attribute the remaining slow time to.'
