  LH:
    distractor: Las trazas atribuyen la latencia de ~3 segundos a una única llamada
      saliente a la REST API de un proveedor externo de fidelización; los resolvers
      de base de datos terminan en milisegundos de un solo dígito.
    diagnosticity: high
    salience: low
