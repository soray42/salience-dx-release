variants:
  HL:
    distractor: Nuestro arquitecto de staff escuchó "rebalanceo constante" y dijo
      de inmediato que siempre es un consumidor que muere por OutOfMemoryError y se
      vuelve a unir — que este es el ciclo clásico de rebalanceo por presión de memoria
      — y le dijo al equipo que simplemente duplicara el heap de todos los consumidores
      y redespliegara.
    diagnosticity: low
    salience: high
    proposition: A senior architect says repeated Kafka rebalancing is always a consumer
      crashing under memory pressure and the fix is bigger heaps.
    salience_source: A/C — a staff architect confidently invoking a 'classic' rebalance
      cause from the symptom name alone, without checking metrics.
    why_plausible: Crash-loop-driven rebalances are a real and well-known Kafka failure
      mode, so memory pressure is a believable first call.
    why_irrelevant: Memory and CPU are stable with headroom, no OOM events are logged,
      and heap stays flat; the rebalances come from exceeding the poll interval, which
      more heap does not address.
  LL:
    distractor: Un arquitecto senior afirmó que el rebalanceo continuo en Kafka siempre
      es un consumidor que cae por presión de memoria, y que la solución es aumentar
      el heap.
    diagnosticity: low
    salience: low
    proposition: A senior architect says repeated Kafka rebalancing is always a consumer
      crashing under memory pressure and the fix is bigger heaps.
    matched_to: HL
  HH:
    distractor: Al cronometrar el bucle, cada lote de un poll tarda ahora más en procesarse
      de lo que permite max.poll.interval.ms, porque el nuevo enriquecimiento hace
      una llamada HTTP sincrónica lenta por mensaje. El broker deja de recibir polls
      a tiempo, declara muertos a esos consumidores y reasigna particiones, que es
      el rebalanceo que seguimos viendo.
    diagnosticity: high
    salience: high
    proposition: Per-batch processing time now exceeds max.poll.interval.ms because
      the new enrichment makes a slow synchronous external call per message, so the
      broker treats consumers as dead and evicts them, triggering the rebalance storm.
    salience_source: Timing the batch against the poll interval and naming the per-message
      synchronous call makes the eviction mechanism concrete.
  LH:
    distractor: El tiempo de procesamiento por lote ahora supera max.poll.interval.ms
      por culpa de la nueva llamada sincrónica por mensaje, por lo que el broker expulsa
      a los consumidores y provoca rebalanceos continuos.
    diagnosticity: high
    salience: low
    proposition: Per-batch processing time now exceeds max.poll.interval.ms because
      the new enrichment makes a slow synchronous external call per message, so the
      broker treats consumers as dead and evicts them, triggering the rebalance storm.
    matched_to: HH
