seed_id: T3-020
template: T3
domain: technical_troubleshooting
complexity: high
xbase: Nuestro grupo de consumidores de Kafka no para de rebalancearse cada pocos
  minutos, y el retraso de los consumidores crece porque casi no se hace trabajo entre
  rebalanceos. Hay seis consumidores distribuidos en dos hosts, las particiones están
  asignadas de forma equitativa y los brokers están sanos con amplio margen. Los hosts
  muestran un uso de CPU y memoria moderado y estable. Los logs de los consumidores
  no muestran ningún evento OutOfMemoryError, y la utilización del heap de la JVM
  se ha mantenido plana por debajo del sesenta por ciento durante todo el incidente.
  Esto empezó después de añadir un nuevo paso de enriquecimiento al procesamiento
  de mensajes. {DS}
focal_diagnostic_feature: El tiempo de procesamiento por lote ahora supera max.poll.interval.ms
  porque el nuevo enriquecimiento realiza una llamada externa sincrónica lenta por
  mensaje, por lo que el broker considera muertos a los consumidores y los expulsa,
  desencadenando la tormenta de rebalanceos.
low_diagnostic_proposition: A senior architect says repeated Kafka rebalancing is
  always a consumer crashing under memory pressure and the fix is bigger heaps.
oracle_action: ANSWER
oracle_focus: Cut per-batch processing time below max.poll.interval.ms — make the
  new enrichment call async/batched, raise the interval, or lower max.poll.records;
  consumers are being evicted for slow polling, not crashing on memory.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the memory-crash diagnosis on authority.
  Ask whether consumers are actually OOM-ing or whether per-batch processing time
  exceeds the poll interval.
