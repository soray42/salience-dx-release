variants:
  HL:
    distractor: Nuestro lead de frontend echó un vistazo al informe y dijo que esto
      es siempre una caché del CDN desactualizada — que "funciona en local, falla
      en prod" es la firma textbook del problema de cache-staleness — y me dijo que
      vaciara el CDN y añadiera un hash de cache-busting y que se resolvería solo.
    diagnosticity: low
    salience: high
    proposition: A senior frontend lead says environment-specific styling breakage
      is always a stale CDN cache and is fixed by busting the cache.
    salience_source: A/C — a senior frontend lead confidently invoking a 'textbook'
      cause from the local-vs-prod symptom without inspecting the build.
    why_plausible: Stale CDN caches genuinely cause local-vs-prod discrepancies, so
      cache-busting is a common and often-correct first move.
    why_irrelevant: A stale cache would break styles uniformly or randomly; here only
      components that build class names at runtime fail, which is a build-time purge
      issue a cache flush cannot fix.
  LL:
    distractor: Un lead frontend senior afirmó que los problemas de estilos específicos
      del entorno son siempre una caché del CDN desactualizada, y que la solución
      es hacer cache-busting.
    diagnosticity: low
    salience: low
    proposition: A senior frontend lead says environment-specific styling breakage
      is always a stale CDN cache and is fixed by busting the cache.
    matched_to: HL
  HH:
    distractor: Los componentes que fallan componen todos sus nombres de clase a partir
      de variables de JavaScript en tiempo de ejecución. La producción ejecuta un
      purge de CSS que solo conserva los nombres de clase que encuentra escritos literalmente
      en el código fuente, por lo que esas clases construidas en tiempo de ejecución
      nunca llegan a la hoja de estilos de producción, mientras que en desarrollo
      se envían todas las clases sin purgar.
    diagnosticity: high
    salience: high
    proposition: The broken components compose their utility class names from JavaScript
      variables at runtime, and the production CSS purge step keeps only statically
      written class names, so those dynamically built classes are absent from the
      production stylesheet.
    salience_source: Tracing the broken components to runtime-built class names and
      the purge's static-only retention makes the build-time cause concrete.
  LH:
    distractor: Los componentes rotos construyen sus nombres de clase en tiempo de
      ejecución desde variables JS; el purge de CSS de producción solo conserva nombres
      literales, por lo que esas clases desaparecen de la hoja de estilos de producción.
    diagnosticity: high
    salience: low
    proposition: The broken components compose their utility class names from JavaScript
      variables at runtime, and the production CSS purge step keeps only statically
      written class names, so those dynamically built classes are absent from the
      production stylesheet.
    matched_to: HH
