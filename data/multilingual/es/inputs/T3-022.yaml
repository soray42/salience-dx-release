plausible_alternative_directions:
- label: Diferencia de minificación en la build
  description: Si un minificador o postprocesador exclusivo de producción elimina
    o reescribe los estilos de forma diferente a como lo hace en desarrollo.
- label: Desajuste en la ruta u orden de los assets
  description: Si las hojas de estilos se cargan en un orden o ruta diferente en producción,
    modificando la cascada.
  changing the cascade.: null
