domain: technical_troubleshooting
complexity: high
xbase: Nuestra API REST pública ha empezado a devolver 429 Too Many Requests a clientes
  legítimos en ráfagas cortas, aunque el tráfico global está muy por debajo de los
  límites que publicamos. Las ráfagas se concentran al inicio de cada minuto y se
  disipan en pocos segundos. El servicio de limitación de tasa respaldado por un almacén
  Redis compartido no ha cambiado su configuración, y los propios clientes juran que
  están espaciando sus peticiones de forma uniforme por debajo del límite por minuto
  documentado. {DS}
focal_diagnostic_feature: El limitador usa un contador de ventana fija que se reinicia
  en el límite del minuto, de modo que los clientes con peticiones uniformes que cruzan
  el límite superan brevemente el conteo por ventana y reciben 429s; un esquema de
  ventana deslizante o token bucket no lo haría.
low_diagnostic_proposition: A principal engineer says the 429s are a classic sign
  that Redis is overloaded and the team should add more Redis nodes.
oracle_action: ANSWER
oracle_focus: Replace the fixed-window rate limiter with a sliding-window or token-bucket
  algorithm; clients pacing evenly across the minute boundary briefly exceed the fixed
  window's count and get 429s, which a smoother scheme avoids.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the Redis-overload diagnosis on authority
