distractor_direction:
  label: Legibilidad de la interfaz de administración
  description: Investigar si la interfaz de usuario de la base de datos o la legibilidad
    de los planes mostrados está confundiendo el diagnóstico.
plausible_alternative_directions:
- label: Índice compuesto faltante
  description: La consulta puede carecer de un índice que cubra el patrón real de
    unión o filtrado.
- label: Problema en el orden de unión
  description: El planificador puede estar eligiendo un orden de unión deficiente
    debido a la distribución de los datos.
- label: Contención de bloqueos
  description: La consulta puede estar esperando detrás de bloqueos en lugar de invertir
    tiempo en el escaneo de datos.
