domain: technical_troubleshooting
complexity: medium
xbase: Una consulta Postgres que une tres tablas tarda unos 4 segundos en devolver
  apenas unos cientos de filas. La tabla más grande tiene alrededor de 12 millones
  de filas y existe un índice en la columna de unión. {DS}
focal_diagnostic_feature: EXPLAIN ANALYZE muestra un escaneo secuencial en la tabla
  de 12 millones de filas y sus estadísticas fueron analizadas por última vez hace
  seis meses.
low_diagnostic_proposition: The database administration interface has an old visual
  theme that makes some output hard to read.
oracle_action: ANSWER
oracle_focus: Run ANALYZE/update statistics and recheck the plan; stale stats are
  likely causing the planner to skip the index.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer query-planner behaviour from UI appearance.
  Ask for EXPLAIN ANALYZE and table statistics age.
