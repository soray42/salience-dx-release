plausible_alternative_directions:
- label: Bug de serialización en el backend
  description: El servidor de la API puede serializar o enviar JSON no válido en algunos
    casos antes de que el proxy lo procese.
- label: Bug del parser del cliente móvil
  description: El cliente móvil puede manejar incorrectamente payloads JSON válidos
    pero de gran tamaño.
- label: Pérdida de paquetes en la red
  description: Pérdidas intermitentes en la red pueden truncar las respuestas antes
    de que lleguen a la app móvil.
