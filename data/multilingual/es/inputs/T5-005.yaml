xbase: El cliente API de nuestra app móvil a veces recibe JSON truncado y luego lanza
  un error de parseo. Ocurre raramente, aproximadamente una vez cada par de cientos
  de peticiones. La API está detrás de un proxy inverso nginx. {DS}
focal_diagnostic_feature: La truncación ocurre cerca de los 16.300 bytes, lo que coincide
