distractor_direction:
  label: Legibilidad de los logs
  description: Investigar si los logs de CI difíciles de leer o la presentación de
    la interfaz explican el largo tiempo de ejecución del flujo de trabajo.
plausible_alternative_directions:
- label: Lentitud del conjunto de pruebas
  description: El flujo de trabajo podría pasar la mayor parte del tiempo en las pruebas
    en lugar de en la instalación de dependencias.
- label: Latencia del registro
  description: El registro de npm o el acceso a la red pueden ser lentos durante las
    instalaciones.
- label: Límites de recursos del runner
  description: El runner de GitHub Actions puede tener restricciones de CPU o de E/S.
