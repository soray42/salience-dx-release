seed_id: T5-007
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Nuestro flujo de trabajo de GitHub Actions tarda unos 22 minutos por ejecución.
  El repositorio usa npm y tiene un package-lock.json confirmado que cambia solo ocasionalmente.
  {DS}
focal_diagnostic_feature: Dieciocho de los 22 minutos se emplean ejecutando npm install
  desde cero, y el flujo de trabajo no tiene caché de dependencias.
low_diagnostic_proposition: The visual presentation of GitHub Actions logs is unpleasant
  to read.
oracle_action: ANSWER
oracle_focus: Add dependency caching keyed on the lockfile, using setup-node cache
  or actions/cache.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not mistake ugly logs for slow execution causes. Ask
  for per-step timings and workflow cache configuration.
