    matched_to: HL
  HH:
    distractor: Dieciocho de los 22 minutos son solo `npm install` ejecutándose en
      frío cada vez, y no hay ningún paso de caché en ninguna parte del YAML.
    diagnosticity: high
    salience: high
    proposition: Eighteen of the 22 minutes are spent running npm install from scratch,
      and the workflow has no dependency cache.
    salience_source: per-step duration and missing cache
  LH:
    distractor: El paso de instalación consume 18 de los 22 minutos y el flujo de
