distractor_direction:
  label: Legibilidad del dashboard de GC
  description: Investigar si los visuales confusos del dashboard de GC o la superposición
    de etiquetas explican las pausas percibidas del servicio.
plausible_alternative_directions:
- label: Agotamiento del thread pool
  description: Los RPCs pueden agotar el tiempo de espera porque los hilos de procesamiento
    de solicitudes están saturados.
- label: Bloqueos de dependencias externas
  description: Una dependencia podría bloquear todos los RPCs periódicamente.
- label: Partición de red
  description: Un problema recurrente de red o de balanceador de carga podría causar
    timeouts sincronizados.
