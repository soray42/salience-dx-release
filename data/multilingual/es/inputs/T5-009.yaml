template: T5
domain: technical_troubleshooting
complexity: high
xbase: Nuestro servicio gRPC tiene pausas periódicas en las que todos los RPCs se
  agotan a la vez. Cada pausa dura aproximadamente medio minuto, y esto ocurre cada
  varios minutos en lugar de de forma continua. {DS}
focal_diagnostic_feature: Los logs de la JVM muestran eventos de Full GC de aproximadamente
  28 segundos alineados con las ventanas de timeout, con old-gen por encima del 90%
  antes de cada evento.
low_diagnostic_proposition: The monitoring dashboard for GC metrics uses a confusing
  colour scheme.
oracle_action: ANSWER
oracle_focus: Treat this as Full-GC pause behaviour under old-gen pressure; tune GC/heap
  and investigate retained objects.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not blame dashboard colours. Ask for raw GC logs and
  alignment with timeout windows.
