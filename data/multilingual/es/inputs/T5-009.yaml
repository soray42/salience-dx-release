variants:
  HL:
    distractor: 'El dashboard de GC es casi ilegible: trazas naranjas sobre fondo
      amarillo, con etiquetas que desaparecen cuando las líneas se superponen.'
    diagnosticity: low
    salience: high
    proposition: The monitoring dashboard for GC metrics uses a confusing colour scheme.
    salience_source: ugly chart colours and visual confusion
    why_plausible: A bad chart can make the measurement itself feel unreliable.
    why_irrelevant: Raw GC logs matching the timeout windows remain diagnostic regardless
      of dashboard colour.
  LL:
    distractor: El dashboard de monitorización de GC tiene una combinación de colores
      difícil de leer.
    diagnosticity: low
    salience: low
    proposition: The monitoring dashboard for GC metrics uses a confusing colour scheme.
    matched_to: HL
  HH:
    distractor: El log crudo de la JVM muestra un Full GC de 28 segundos cada 7 a
      9 minutos, exactamente cuando todas las llamadas se agotan, y old-gen está por
      encima del 90% justo antes de que ocurra.
    diagnosticity: high
    salience: high
    proposition: JVM logs show ~28-second Full GC events aligned with the timeout
      windows, with old-gen above 90% before each event.
    salience_source: raw log/event timing alignment
  LH:
    distractor: Eventos de Full GC de unos 28 segundos coinciden con las ventanas
      de timeout de los RPC, y la utilización de old-gen supera el 90% antes de cada
      uno.
    diagnosticity: high
    salience: low
    proposition: JVM logs show ~28-second Full GC events aligned with the timeout
      windows, with old-gen above 90% before each event.
