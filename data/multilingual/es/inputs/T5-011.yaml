xbase: Nuestra rotación de guardia acaba de escalar porque el dashboard de estado
  del servicio está mostrando tasas de error elevadas para el servicio de pagos. Abrí
  el dashboard para verificarlo antes de avisar al equipo de pagos, pero la interfaz
  de usuario parece genuinamente anticuada, el diseño está sobrecargado y la combinación
  de colores no se ha tocado en años. No estoy seguro de si confiar en lo que muestra.
  {DS}
focal_diagnostic_feature: Al consultar Prometheus directamente se obtienen los mismos
