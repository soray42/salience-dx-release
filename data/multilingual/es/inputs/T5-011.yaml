distractor_direction:
  label: La apariencia estética implica desconfianza en los datos
  description: La interfaz visualmente anticuada y sobrecargada del dashboard se ofrece
    como evidencia de que los valores de las métricas que muestra son poco fiables,
    confundiendo la estética superficial con la corrección del pipeline de datos.
plausible_alternative_directions:
- label: Mala configuración de la fuente de datos del dashboard
  description: El dashboard podría estar consultando un namespace, entorno o rango
    temporal diferente al previsto, haciendo que muestre tasas de error infladas no
    relacionadas con el servicio de pagos en producción.
- label: Mal calibrado del umbral de alertas
  description: La tasa de error elevada puede reflejar variación normal del tráfico
    que supera un umbral excesivamente sensible en lugar de una degradación real del
    servicio.
