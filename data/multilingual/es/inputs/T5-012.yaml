distractor_direction:
  label: El sitio web anticuado indica corrupción
  description: La estética del sitio web de la herramienta, con apariencia de los
    años 90, se ofrece como evidencia de que el proyecto no es fiable y que los datos
    de copia de seguridad podrían estar corrompidos.
plausible_alternative_directions:
- label: Configuración de copia de seguridad incompleta
  description: BackPulse podría estar mal configurado para excluir ciertas rutas de
    archivos, omitiendo datos de las copias de seguridad sin generar un error.
- label: Corrupción en la capa de almacenamiento
  description: El disco o volumen de almacenamiento en red subyacente podría estar
    introduciendo corrupción de forma independiente a la herramienta de copia de seguridad.
- label: Fallo en la lógica de snapshots incrementales
  description: El algoritmo de copia de seguridad incremental de BackPulse podría
    incluir versiones de archivos obsoletas o incorrectas sin marcar errores durante
    la fase de copia de seguridad.
