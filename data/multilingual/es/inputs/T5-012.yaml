xbase: He estado usando BackPulse, una CLI de copia de seguridad de código abierto,
  para proteger las instantáneas de nuestra base de datos de producción. Empecé a
  preocuparme de que la herramienta pudiera estar corrompiendo silenciosamente los
  datos de copia de seguridad. Realicé una restauración completa en un volumen de
  prueba separado y luego usé el comando de verificación integrado de la herramienta
  para comprobar la integridad. {DS}
focal_diagnostic_feature: El comando de verificación confirmó que todos los checksums
  de los archivos restaurados coinciden exactamente con los originales, descartando
  la corrupción de datos por parte de la herramienta.
