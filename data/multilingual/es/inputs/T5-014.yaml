causal_audit:
  steelman: 'Best-faith argument that UI aesthetics could causally inform calculation

    correctness: Poor interface design is often a symptom of constrained

    engineering resources and limited QA investment. A development team that

    cannot allocate effort to a polished UI is likely also cutting corners

    elsewhere, including in testing financial calculation logic against

    edge cases — unusual deductions, partial-year filing situations,

    alternative minimum tax interactions. Tax software bugs are notoriously

    hard to detect because they manifest in uncommon input combinations that

    users rarely hit. An audit professional familiar with small fintech shops

    might legitimately treat "visually abandoned product" as a weak prior for

    "undertested calculation core." This reasoning is how the aesthetic-

    usability heuristic gets inverted into a negative signal: if polish

    correlates with investment, its absence correlates with neglect.

    '
