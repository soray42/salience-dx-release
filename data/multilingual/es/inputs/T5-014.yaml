distractor_direction:
  label: La estética de la interfaz como señal de errores de cálculo
  description: La interfaz saturada y de aspecto anticuado de la herramienta de presupuesto
    se toma como evidencia de que su lógica de cálculo es poco fiable o incorrecta.
plausible_alternative_directions:
- label: Tablas fiscales desactualizadas
  description: La aplicación podría usar tramos impositivos, importes de deducción
    estándar o tablas de tipos de un año anterior, produciendo un resultado que difiere
    de las normas del año en curso independientemente del aspecto de la interfaz.
- label: Error de transcripción en la entrada de datos
  description: El usuario podría haber introducido una cifra de ingresos o deducción
    incorrectamente en la aplicación, haciendo que la devolución calculada difiera
    de lo que mostraría una declaración correcta.
