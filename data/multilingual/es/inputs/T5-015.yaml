causal_audit:
  steelman: 'A competent consumer advisor might argue: companies that invest in

    maintaining a modern, functional website tend to be operationally active

    and financially stable — a neglected website can be a leading indicator

    of a company in decline, underinvesting across the board, including in

    staff training and equipment maintenance. In the moving industry, where

    small operators frequently close and reopen under new names, an

    up-to-date web presence could weakly correlate with current licensing

    and insurance compliance. One could also argue that a well-designed site

    suggests the company communicates clearly, which matters for logistics

    coordination on move day.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'The user has already reviewed each company''s insurance
    certificate in full and spoken directly with recent customers of each. This direct
    evidence supersedes any proxy inference from website aesthetics: coverage terms
    are confirmed documentary facts and reference quality is first-hand testimony.
    The steelman''s "leading indicator of decline" pathway is closed because the user
    holds current proof of both companies'' insurance terms and direct customer testimonials
