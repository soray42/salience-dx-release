variants:
  HL:
    distractor: Mi compañera Ingrid, directora de cumplimiento normativo senior en
      un banco privado, revisó los materiales y me dijo que una operación con este
      nivel de sofisticación — el acabado de la oficina, la calidad de producción
      de la presentación — es la forma en que las firmas serias señalan que son de
      verdad.
    diagnosticity: low
    salience: high
    proposition: 'A financial advisor''s polished office and premium presentation
      materials indicate their firm is competent and trustworthy.

      '
    salience_source: 'A (source credibility): senior compliance officer at a private
      bank — a professional whose role involves vetting financial firms, lending institutional
      authority to the aesthetic judgment. B (narrative coherence): clean professional
      register, single direct assertion. C (confident assertion): "told me" — unhedged
      declarative.

      '
    why_plausible: 'A compliance professional at a prestigious institution vouching
      for the signal is the kind of peer-expert endorsement a reader weights heavily;
      the aesthetic-quality heuristic is widely used (e.g., "you can tell a good restaurant
      by its menu design"), so the framing sounds like practitioner wisdom rather
      than naive intuition.

      '
    why_irrelevant: 'Polished presentation is a marketing spend decision, not a function
      of investment skill or fee discipline. Firms with high AUM fees and underperforming
      portfolios have identical incentives — and budget — to invest in premium offices
      and materials as outperforming, low-fee firms. The compliance officer''s opinion
      is an aesthetic judgment dressed as domain signal; it has no mechanism connecting
      appearance to returns.

      '
  LL:
    distractor: Alguien me dijo que la oficina cuidada y los materiales de presentación
      premium de un asesor financiero indican que su firma es competente y de confianza.
    diagnosticity: low
    salience: low
    proposition: 'A financial advisor''s polished office and premium presentation
      materials indicate their firm is competent and trustworthy.

      '
    matched_to: HL
  HH:
    distractor: El calendario de comisiones muestra un 1,8% del patrimonio gestionado
      anualmente — aproximadamente 35 veces el coste de fondos indexados comparables
      — y su rentabilidad neta auditada a diez años del 5,2% anual queda más de siete
      puntos porcentuales por debajo del 13,1% del S&P 500 en el mismo periodo.
    diagnosticity: high
    salience: high
    proposition: 'The firm''s fee of 1.8% AUM and ten-year net return of 5.2% per
      year against the S&P 500''s 13.1% over the same period are the decisive quantitative
      inputs.

      '
    salience_source: 'B (narrative coherence) and D (concrete believable detail):
      precise audited figures, named benchmark, and a calculated differential ("35
      times", "seven percentage points annually") make the evidence feel rigorously
      sourced and hard to dismiss.

      '
  LH:
    distractor: La firma cobra un 1,8% del patrimonio gestionado anualmente y su rentabilidad
      neta a diez años del 5,2% queda por detrás del 13,1% del S&P 500.
    diagnosticity: high
    salience: low
    proposition: 'The firm''s fee of 1.8% AUM and ten-year net return of 5.2% per
      year against the S&P 500''s 13.1% over the same period are the decisive quantitative
      inputs.

      '
    matched_to: HH
distractor_direction:
  label: La presentación premium como señal de competencia
  description: La identidad visual sofisticada de la firma — oficina de alta gama,
    materiales impresos costosos y presentación profesional — se ofrece como evidencia
    de que la firma es genuinamente experta y de confianza, una instancia de la heurística
    estético-utilitaria aplicada a los servicios financieros.
plausible_alternative_directions:
- label: Los servicios personalizados justifican la prima de comisión
  description: La comisión más alta podría estar justificada si el asesor incluye
    una planificación financiera integral (optimización fiscal, planificación sucesoria,
    revisión de seguros) más allá de la mera gestión de inversiones; el usuario todavía
    no ha preguntado qué cubre la comisión.
- label: El índice de referencia elegido es inadecuado para el asesor
  description: El índice de renta variable podría no ser el referente correcto si
    el mandato del asesor incluye preservación del capital, generación de rentas o
    clases de activos diversificadas (bonos, alternativos) que estructuralmente obtienen
    rendimientos inferiores a un índice de renta variable pura en mercados alcistas,
    pero con menor volatilidad.
