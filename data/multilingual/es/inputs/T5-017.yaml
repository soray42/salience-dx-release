variants:
  HL:
    distractor: Sinceramente, la interfaz es tan tosca — paneles grises desteñidos,
      iconos pixelados con bordes dentados, una tipografía sacada de un asistente
      de instalación antiguo — que todo el programa grita abandonware, y una herramienta
      con ese aspecto de abandono daría una falsa alarma con la misma desidia.
    diagnosticity: low
    salience: high
    proposition: The disk-health tool's dated, unprofessional interface suggests its
      failure warning should not be trusted.
    salience_source: B/D — vivid description of the tool's crude appearance, with
      the bridge that a neglected-looking tool gives unreliable warnings.
    why_plausible: Polished software does feel more trustworthy, so a shabby interface
      invites doubt about the substance behind it.
    why_irrelevant: A SMART warning is just a readout of the drive's own counters;
      the tool's visual styling has no bearing on whether those hardware counters
      are degrading.
  LL:
    distractor: La interfaz anticuada y poco profesional de la herramienta sugiere
      que no debería fiarse de su advertencia de fallo de disco.
    diagnosticity: low
    salience: low
    proposition: The disk-health tool's dated, unprofessional interface suggests its
      failure warning should not be trusted.
    matched_to: HL
  HH:
    distractor: Al ir más allá del aspecto y mirar los números reales, los datos SMART
      de la unidad muestran que el recuento de sectores reasignados va en aumento
      y el recuento de sectores pendientes es distinto de cero — ambas señales clásicas
      de un SSD que se está muriendo. Lo verifiqué en la propia utilidad de disco
      del sistema operativo y reporta exactamente los mismos valores de fallo.
    diagnosticity: high
    salience: high
    proposition: The drive's own SMART attributes show a rising reallocated-sector
      count and non-zero pending sectors, and the operating system's built-in disk
      utility reports the identical failing values.
    salience_source: Naming the specific SMART attributes and the OS-utility cross-check
      makes the hardware evidence concrete and independent of the tool.
  LH:
    distractor: SMART muestra un recuento de sectores reasignados en aumento y sectores
      pendientes distintos de cero, ambas señales de unidad en fallo, y la utilidad
      de disco del SO informa de valores idénticos.
    diagnosticity: high
    salience: low
    proposition: The drive's own SMART attributes show a rising reallocated-sector
      count and non-zero pending sectors, and the operating system's built-in disk
      utility reports the identical failing values.
    matched_to: HH
