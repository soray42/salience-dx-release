seed_id: T5-017
template: T5
domain: technical_troubleshooting
complexity: low
xbase: 'Una utilidad gratuita de diagnóstico de disco que descargué me advierte de
  que el SSD de mi portátil podría estar fallando y de que debería hacer una copia
  de seguridad pronto. La herramienta tiene un aspecto antiguo: una interfaz gris
  y torpe que parece no haberse actualizado en veinte años. Me tienta ignorar la advertencia
  porque el programa tiene un aspecto muy poco profesional. La propia utilidad de
  disco integrada del sistema operativo informa de forma independiente de la misma
  lectura SMART de fallo. El portátil parece funcionar con normalidad por lo demás.
  {DS}'
focal_diagnostic_feature: Los propios atributos SMART de la unidad muestran un recuento
  de sectores reasignados en aumento y sectores pendientes distintos de cero, y la
  utilidad de disco integrada del sistema operativo reporta los mismos valores de
  fallo.
low_diagnostic_proposition: The disk-health tool's dated, unprofessional interface
  suggests its failure warning should not be trusted.
oracle_action: ANSWER
oracle_focus: Take the warning seriously and back up now (then plan to replace the
  drive); the SMART reallocated/pending-sector evidence is corroborated by the OS's
  own disk utility, regardless of how the tool looks.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not dismiss the warning because the tool looks dated.
  Ask what underlying SMART values it reports and whether another tool confirms them.
