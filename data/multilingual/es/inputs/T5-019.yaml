  notes: 'LH is 25 words, preserving equivalence with HH (commits, issue turnaround,
    CI, downstream adoption) as a single

    flat clause-set. T5: the bridge "an unpresentable project has quietly gone unmaintained"
    is in

    HL and flat in LL (self-check 13). xbase establishes the page looks abandoned
    and that the library currently works,

    but withholds the repo-activity evidence — decisive — which is HH/LH-only. QC
    repair round 1: added a narrow

    mechanism-blocker to xbase ("the dated look is just the maintainer''s minimalist
    style and is never synced with the

    project, so the page tells us nothing about whether the code is maintained").
    This forecloses the only mechanism the

    causal_a lens found (page aesthetics as a proxy for abandonment) without supplying
    the decisive maintenance signals —

    those (commits this week, days-fast issue turnaround, green CI, downstream framework
    adoption) remain HH/LH-only, so

    xbase alone still cannot resolve keep-vs-replace (C4 holds; the low-diagnostic
    oracle remains ASK).

    '
causal_audit:
  steelman: 'A pragmatic engineer could note that neglected documentation often does
    track neglected code, that a stale-looking

    site can signal a maintainer who has moved on, and that depending on an abandoned
    library is a real supply-chain

    risk — so in the abstract a dated page is a weak prompt to check maintenance status.
    That single mechanism (page

    aesthetics standing in as a proxy for abandonment) is the only one available to
    the distractor, and xbase now

    explicitly forecloses it: the dated look is the maintainer''s deliberate minimalist
    style and is never synced with

    the project, so for THIS case the page carries no information about whether the
    code is maintained. With the proxy

    cut, no constructible mechanism remains by which the page''s appearance bears
    on the keep-vs-replace decision.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the dated look is the maintainer's deliberate
    minimalist style and is never synced with the project, so the page tells us nothing
    about whether the code is maintained — foreclosing the page-aesthetics-as-abandonment-proxy
    mechanism while withholding the decisive maintenance evidence (commits, issue
