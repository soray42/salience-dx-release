seed_id: T5-019
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: 'Dependemos de una pequeña biblioteca de código abierto para el análisis de
  fechas, y un compañero de equipo quiere eliminarla porque su página de proyecto
  parece abandonada: un README escueto, un logo antiguo, un sitio que parece sacado
  del 2009. Hemos averiguado que ese aspecto desactualizado es simplemente el estilo
  minimalista del mantenedor y nunca se sincroniza con el proyecto, por lo que la
  página no nos dice nada sobre si el código está siendo mantenido. Cambiarla implicaría
  modificar mucho código, y estoy tratando de decidir si la sustitución vale el riesgo.
  {DS}'
focal_diagnostic_feature: El repositorio muestra commits en la última semana, mantenedores
  cerrando incidencias en pocos días, un badge de CI en verde en la última versión,
  y es una dependencia declarada de varios frameworks muy utilizados.
low_diagnostic_proposition: The library's dated, bare-looking project page indicates
  it is abandoned and should be replaced.
oracle_action: ANSWER
oracle_focus: Keep the library; recent commits, fast issue turnaround, passing CI,
  and its use by major frameworks show it is actively maintained, so a risky, large
  swap is not justified by its dated page.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer abandonment from the page's look. Ask about
  commit recency, issue response times, CI status, and downstream adoption.
