variants:
  HL:
    distractor: 'La página del proyecto realmente parece muerta: un README de una
      sola línea, un logo pixelado y viejo, un sitio anclado en el 2009. El argumento
      de mi compañero es que una biblioteca cuya página nadie se molesta en presentar
      correctamente es exactamente el tipo de proyecto que ha dejado de mantenerse
      en silencio por debajo.'
    diagnosticity: low
    salience: high
    proposition: The library's dated, bare-looking project page indicates it is abandoned
      and should be replaced.
    salience_source: B/D — vivid concrete detail of the dated page carrying the bridge
      that a neglected-looking project is an unmaintained one.
    why_plausible: Abandoned projects often do have stale, neglected pages, so a dated
      page is a real and common warning sign.
    why_irrelevant: Page aesthetics are decoupled from maintenance activity; a plain
      page can sit atop an actively developed codebase, which only the repo's activity
      reveals.
  LL:
    distractor: El aspecto desactualizado y básico de la página del proyecto indica
      que está abandonada y debería reemplazarse.
    diagnosticity: low
    salience: low
    proposition: The library's dated, bare-looking project page indicates it is abandoned
      and should be replaced.
    matched_to: HL
  HH:
    distractor: Al mirar el repositorio en lugar de la página de inicio, hay commits
      de esta semana, los mantenedores están cerrando incidencias en uno o dos días,
      la última versión muestra un badge de CI en verde, y varios frameworks que ya
      usamos la declaran como dependencia.
    diagnosticity: high
    salience: high
    proposition: The repository shows commits within the last week, maintainers closing
      issues within days, a green CI badge on the latest release, and it is a declared
      dependency of several widely used frameworks.
    salience_source: Concrete maintenance signals — fresh commits, days-fast issue
      turnaround, passing CI, downstream adoption — make active upkeep undeniable.
  LH:
    distractor: El repositorio tiene commits de esta semana, incidencias cerradas
      en pocos días, un badge de CI en verde en la última versión, y varios frameworks
      importantes la declaran como dependencia.
    diagnosticity: high
    salience: low
    proposition: The repository shows commits within the last week, maintainers closing
      issues within days, a green CI badge on the latest release, and it is a declared
      dependency of several widely used frameworks.
    matched_to: HH
