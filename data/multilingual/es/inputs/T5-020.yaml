domain: open_qa
complexity: high
xbase: 'Estoy eligiendo entre dos coches usados del mismo modelo y con un kilometraje
  y precio similares. Uno está absolutamente impecable: pintura perfecta, interior
  inmaculado, parece que acaba de salir de un concesionario. El otro está limpio pero
  sin nada especial, con algunos arañazos leves y un acabado apagado. Planeo conservar
  el que compre durante muchos años, así que la fiabilidad me importa mucho más que
  el aspecto. {DS}'
focal_diagnostic_feature: Un informe del historial del vehículo muestra que el coche
  impecable tiene un título de salvamento por daños previos de inundación y lagunas
  en su historial de servicio, mientras que el coche apagado tiene un título limpio
  y un historial de servicio completo, sellado por el concesionario.
low_diagnostic_proposition: The gleaming car's showroom-perfect condition is a sign
  it has been well maintained mechanically and is the more reliable choice.
oracle_action: ANSWER
oracle_focus: Buy the dull car; its clean title and complete service history outweigh
  appearance, while the gleaming car's salvage/flood-damage title and service gaps
  are serious reliability red flags a detailing job hides.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not read mechanical condition from how shiny the car
  looks. Ask for each car's title status, accident/flood history, and service records.
