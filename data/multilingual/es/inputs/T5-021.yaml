xbase: 'Uso una extensión de navegador de gestor de contraseñas y tengo ganas de cambiarme
  a una comercial más llamativa. La que tengo funciona, pero su interfaz parece casera:
  un icono sencillo, cuadros de diálogo básicos, sin animaciones, nada elegante. La
  alternativa tiene un aspecto precioso y moderno. Como esta herramienta protege todas
  mis cuentas, quiero la que sea realmente más segura. {DS}'
focal_diagnostic_feature: La extensión sencilla es de código abierto y tiene una auditoría
  de seguridad independiente reciente publicada sin hallazgos críticos, mientras que
  la alternativa llamativa es de código cerrado y nunca ha sido auditada de forma
  independiente.
low_diagnostic_proposition: The polished, modern-looking extension is the more secure
  and trustworthy choice because of how refined it looks.
oracle_action: ANSWER
oracle_focus: Keep the plain extension; an open-source tool with a clean published
  independent audit is the stronger security choice, and the flashy alternative's
  unaudited closed source is what actually matters, not its visual polish.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not equate a refined interface with security. Ask
  whether each extension is open-source and whether it has a published independent
  security audit.
