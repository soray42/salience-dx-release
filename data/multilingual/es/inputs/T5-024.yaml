plausible_alternative_directions:
- label: Exportación de datos a largo plazo y portabilidad
  description: La capacidad de exportar el historial de transacciones en un formato
    portable (CSV, OFX) puede importar más con el tiempo que la precisión de categorización
    a corto plazo.
- label: Soporte al cliente y frecuencia de actualizaciones
  description: Las integraciones de conexión bancaria se rompen cuando las entidades
    cambian sus APIs; la velocidad de actualización del proveedor y la capacidad de
    respuesta del soporte son relevantes para una configuración multicuenta a lo largo
    de los años.
- label: Política de privacidad y uso compartido de datos
  description: Es probable que ambas aplicaciones compartan datos agregados o anonimizados
    con terceros; las condiciones específicas de uso compartido podrían superar las
    diferencias de funciones para algunos usuarios.
