distractor_direction:
  label: Ahorro anunciado inflado
  description: Tratar la página de comparativa recargada y llena de asteriscos como
    evidencia de que el ahorro indicado por el proveedor está artificialmente inflado
    y no debe tomarse en serio.
plausible_alternative_directions:
- label: Reducción de coberturas
  description: El paquete puede ofrecer límites de cobertura más bajos o excluir condiciones
    presentes en las pólizas separadas, haciendo que el ahorro aparente sea engañoso
    en comparación directa.
- label: Riesgo de estabilidad financiera del proveedor único
  description: Concentrar las tres pólizas con un único proveedor crea un riesgo de
    punto único de fallo si el proveedor cambia las condiciones, quiebra o abandona
    una línea de producto en la renovación.
- label: Penalización por cancelación de las pólizas actuales
  description: La cancelación anticipada de las pólizas separadas existentes puede
    generar comisiones de salida que compensen parcial o totalmente el ahorro anual
    proyectado del paquete.
