variants:
  HL:
    distractor: Cada bug de red en Docker que he encontrado antes era una línea EXPOSE
      faltante, así que sigo mirando fijamente el Dockerfile aunque este se siente
      diferente.
    diagnosticity: low
    salience: high
    proposition: The user's previous Docker networking issues were caused by missing
      EXPOSE directives.
    salience_source: familiar past Docker fix, repeated troubleshooting habit
    why_plausible: EXPOSE is a common source of Docker confusion.
    why_irrelevant: EXPOSE does not control DNS resolution; NXDOMAIN inside the container
      points to resolver/network configuration.
  LL:
    distractor: Los problemas de red anteriores en Docker del usuario se atribuyeron
      generalmente a directivas EXPOSE faltantes.
    diagnosticity: low
    salience: low
    proposition: The user's previous Docker networking issues were caused by missing
      EXPOSE directives.
    matched_to: HL
  HH:
    distractor: Dentro del contenedor, `nslookup internal-api.company.local` devuelve
      NXDOMAIN; en el anfitrión el mismo nombre se resuelve correctamente, y el contenedor
      está en el bridge predeterminado de Docker.
    diagnosticity: high
    salience: high
    proposition: Inside the container, `nslookup internal-api.company.local` returns
      NXDOMAIN, while the same lookup succeeds on the host; the container uses the
      default bridge network.
    salience_source: host/container DNS contrast
  LH:
    distractor: La resolución DNS del nombre de host interno falla dentro del contenedor
      con red bridge predeterminada, pero funciona en el anfitrión.
    diagnosticity: high
    salience: low
    proposition: Inside the container, `nslookup internal-api.company.local` returns
      NXDOMAIN, while the same lookup succeeds on the host; the container uses the
      default bridge network.
