distractor_direction:
  label: Directiva EXPOSE faltante
  description: Investigar si los metadatos EXPOSE del Dockerfile están ausentes o
    son incorrectos y bloquean la conectividad del contenedor.
plausible_alternative_directions:
- label: Regla de firewall del contenedor
  description: El firewall del contenedor o del anfitrión puede estar bloqueando el
    tráfico saliente hacia la API.
- label: Variables de proxy ausentes
  description: Las variables de entorno de proxy HTTP, NO_PROXY o certificados pueden
    estar ausentes dentro del contenedor.
- label: Problema de credenciales de la API
  description: El contenedor puede no tener credenciales o tokens válidos para la
    API interna.
