domain: technical_troubleshooting
complexity: medium
xbase: Mi contenedor Docker arranca, pero la aplicación dentro de él no puede conectarse
  a la API interna de nuestra empresa. La máquina anfitriona sí puede acceder a otros
  recursos internos. {DS}
focal_diagnostic_feature: Dentro del contenedor, `nslookup internal-api.company.local`
  devuelve NXDOMAIN, mientras que la misma consulta tiene éxito en el anfitrión; el
  contenedor usa la red bridge predeterminada.
low_diagnostic_proposition: The user's previous Docker networking issues were caused
  by missing EXPOSE directives.
oracle_action: ANSWER
oracle_focus: Configure container DNS or networking for the internal domain; this
  is resolver configuration, not EXPOSE metadata.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not reuse the EXPOSE explanation. Ask for DNS resolution
  inside the container versus the host.
