distractor_direction:
  label: Reiniciar el router de casa lo soluciona
  description: El historial personal del usuario de resolver el audio robótico en
    videollamadas reiniciando el router de casa sugiere que el episodio actual también
    está causado por el estado del router o la congestión de la red doméstica.
plausible_alternative_directions:
- label: Throttling térmico de la CPU
  description: La CPU del portátil acumula calor durante el día y al llegar la noche
    reduce su velocidad de reloj, degradando el procesamiento en tiempo real del códec
    de audio y produciendo distorsión robótica en la captura de audio local.
- label: Fallo del driver de audio o del software
  description: Un bug en el driver, un cambio reciente en la configuración de audio
    o un proceso de audio en segundo plano en conflicto provoca un mal funcionamiento
    en el pipeline de entrada del micrófono, con síntomas que aparecen solo después
    de un tiempo prolongado de uso del sistema.
- label: Cambio de perfil de gestión de energía
  description: Un cambio automático a un perfil de ahorro de batería o de bajo consumo
    por la noche reduce la prioridad de la CPU y del subsistema de audio, haciendo
    que el pipeline de captura de audio pierda muestras y produzca artefactos robóticos.
