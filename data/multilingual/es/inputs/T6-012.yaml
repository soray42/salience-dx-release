distractor_direction:
  label: Recurrencia del estado del software del televisor
  description: La hipótesis de que el software interno o el estado de las aplicaciones
    del televisor se ha degradado de nuevo, como ocurrió en el pasado, y que un restablecimiento
    de fábrica lo corregirá — la misma solución que funcionó antes funcionará ahora.
plausible_alternative_directions:
- label: Throttling del ISP en horas pico
  description: El ISP reduce el ancho de banda disponible durante las ventanas de
    uso pico vespertino, causando cortes independientemente del estado del dispositivo
    local o del televisor.
- label: Degradación de la señal Wi-Fi
  description: La conexión Wi-Fi del televisor se ha debilitado debido a interferencias
    o distancia, causando un rendimiento insuficiente para la aplicación de streaming
    específicamente durante los periodos de alta demanda.
- label: Firmware o aplicación del televisor desactualizado
  description: La aplicación de streaming o el sistema operativo del televisor tiene
    un bug conocido en la versión actual que provoca interrupciones en la reproducción,
    solucionable con una actualización en lugar de un restablecimiento de fábrica
    completo.
