distractor_direction:
  label: desfase de reloj / deriva NTP
  description: La hipótesis de que los fallos mTLS están causados por deriva en la
    sincronización temporal entre nodos, tal como ha ocurrido en incidentes pasados
    en este entorno. Este es el primer instinto del ingeniero de guardia basado en
    el historial personal de incidentes.
plausible_alternative_directions:
- label: certificado incorrecto montado
  description: El despliegue configuró incorrectamente la referencia al Secret del
    certificado o la ruta de montaje del volumen, haciendo que los sidecars carguen
    un certificado obsoleto o incorrecto que no coincide con la CA esperada.
- label: discrepancia de SAN
  description: La nueva configuración de cert-manager emitió certificados con Subject
    Alternative Names que no incluyen los hostnames actuales del servicio ni las direcciones
    IP, provocando fallos en la verificación entre pares.
- label: endpoint de CRL u OCSP desactualizado
  description: La configuración actualizada de cert-manager apunta a un endpoint de
    revocación de certificados que es inalcanzable o devuelve un error, provocando
    que la pila TLS rechace el certificado como no verificable.
