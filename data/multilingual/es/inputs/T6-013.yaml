causal_audit:
  steelman: 'Clock skew is a genuine and common root cause of mTLS certificate validation

    failures. When there is significant time drift between a client and server node,

    TLS handshake validation can fail because the verifying party''s clock places
    the

    certificate''s validity window (notBefore / notAfter) outside the current time.

    In a Kubernetes cluster, NTP misconfiguration after a node restart or a VM

    live-migration event could cause sudden clock drift. A cert-manager configuration

    update might coincidentally coincide with such an event. Furthermore, if the

    cert-manager update triggered a pod restart that exposed an existing clock-drift

    problem that only manifests on fresh TLS session establishment (rather than

    session resumption), the timing correlation would be exact. A senior SRE would

    absolutely put ''check NTP offsets on all nodes'' on their runbook for any cert

    failure. The engineer''s three-year history of seeing clock skew as the culprit

    is plausible institutional knowledge that gives this hypothesis real weight.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase states ''I''ve already checked NTP on every node
    — all offsets are under half a second'', which directly rules out the clock-skew
    time-drift mechanism. Additionally, the focal feature specifies the error is ''x509:
    certificate signed by unknown authority'' — a trust-chain error structurally distinct
    from the time-validity errors (certificate not yet valid / certificate has expired)
    that clock skew produces. Both the empirical NTP check and the error type independently
    close the clock-skew causal pathway.

    '
