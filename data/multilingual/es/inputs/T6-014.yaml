distractor_direction:
  label: mosquitas del sustrato por riego excesivo
  description: La experiencia previa repetida del propietario con mosquitas del sustrato
    le lleva a asumir que la infestación actual es la misma, lo que le lleva a tratar
    con trampas adhesivas amarillas y reducción del riego en lugar de investigar los
    síntomas actuales.
plausible_alternative_directions:
- label: infestación de trips
  description: Los trips son plagas comunes de plantas de interior que causan punteado
    plateado y deformación de hojas; a partir del xbase solo (problema de plagas recurrente,
    plantas estresadas) los trips serían un candidato activo antes de examinar las
    plantas de cerca.
- label: infestación de cochinillas harinosas
  description: Las cochinillas harinosas son plagas frecuentes de plantas de interior
    que causan marchitamiento y decoloración; sin la observación de la tela, representan
    un diagnóstico alternativo plausible para un problema de plagas recurrente en
    una colección mixta.
- label: infestación de cochinillas de escudo
  description: Las cochinillas de escudo infestan comúnmente plantas de interior y
    causan un deterioro progresivo; son una candidata creíble para un problema de
    plagas recurrente en múltiples plantas y son distintas tanto del distractor (mosquitas
    del sustrato) como de la dirección focal (ácaros araña).
