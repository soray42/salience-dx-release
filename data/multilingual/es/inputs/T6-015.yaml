distractor_direction:
  label: atribución a la marca de detergente
  description: El usuario atribuye el olor a humedad a la marca de detergente, basándose
    en un patrón consistente de problemas anteriores con la ropa. En el caso actual,
    esta hipótesis queda estructuralmente descartada porque la marca y el uso han
    sido constantes durante más de tres años mientras el síntoma apareció recientemente.
plausible_alternative_directions:
- label: acumulación en el filtro del tambor o trampa de la bomba
  description: Los residuos acumulados en el filtro del tambor o la trampa de la bomba
    de la lavadora pueden causar olores desagradables que se transfieren a la ropa;
    un propietario novato quizás nunca haya limpiado estos componentes.
- label: problema con la manguera de desagüe o el sifón
  description: Una manguera de desagüe parcialmente obstruida o incorrectamente posicionada
    puede permitir que las aguas residuales sifonen de vuelta al tambor, dejando agua
    sucia residual que produce olores a humedad.
- label: moho en el interior del tambor o residuos de detergente
  description: El moho puede crecer en el interior del tambor o sobre una película
    de residuos de detergente acumulados dentro de la máquina, independientemente
    de la junta, especialmente en lavadoras que funcionan principalmente con ciclos
    fríos o cortos.
