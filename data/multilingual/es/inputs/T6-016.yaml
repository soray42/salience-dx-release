seed_id: T6-016
template: T6
domain: open_qa
complexity: high
xbase: 'Mi cartera de renta variable y bonos ha tenido un rendimiento inferior al
  de su índice de referencia por tercer año consecutivo. El ratio de gastos del fondo
  es del 0,07%, prácticamente igual al del propio índice de referencia, así que las
  comisiones no pueden explicar la diferencia. Tengo una asignación de activos objetivo
  registrada, pero no he revisado los pesos reales de la cartera desde hace algún
  tiempo. {DS}

  '
focal_diagnostic_feature: La cartera está funcionando aproximadamente 15–18 puntos
  porcentuales por encima de su objetivo del 60% en renta variable tras más de dos
  años sin rebalancear durante un mercado alcista sostenido en renta variable; la
  deriva en la asignación por sí sola desplaza materialmente el perfil riesgo/rentabilidad
  respecto al índice mixto de referencia, explicando el rendimiento inferior sin ninguna
  diferencia en comisiones.
low_diagnostic_proposition: 'The last three times this investor''s portfolio lagged
  its benchmark, fund fees were the cause.

  '
oracle_action: ANSWER
oracle_focus: 'Address allocation drift: the portfolio is approximately 75–78% equity
  against a 60% target, a 15–18 pp overshoot from not rebalancing over two equity-bull
  years; the investor should rebalance toward the target and verify whether the return
  gap is fully explained by the changed equity/bond mix before considering any fund
  change.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Decline to adopt the fee-attribution from past experience;
  instead ask about the portfolio''s current allocation versus target, rebalancing
  history, tax drag, and whether the benchmark is an appropriate comparator for the
  actual current mix.

  '
