distractor_direction:
  label: atribución pasada a comisiones
  description: El inversor atribuye el rezago actual respecto al índice de referencia
    a las comisiones del fondo, razonando a partir de tres episodios personales previos
    en los que las comisiones fueron la causa diagnosticada. Aquí la vía de las comisiones
    está cerrada porque el ratio de gastos del fondo es insignificantemente bajo y
    coincide con el del índice.
plausible_alternative_directions:
- label: discrepancia con el índice de referencia
  description: El índice de referencia elegido puede no reflejar la estrategia real
    de la cartera ni su perfil de riesgo actual, haciendo que la comparación sea engañosa
    en lugar de indicar un verdadero rendimiento inferior.
- label: arrastre fiscal
  description: Las distribuciones de plusvalías imponibles o las decisiones de cosecha
    de pérdidas pueden haber reducido los rendimientos netos de impuestos en relación
    con el índice de referencia antes de impuestos, explicando la brecha aparente
    sin ningún problema de rendimiento subyacente.
- label: arrastre de liquidez
  description: El efectivo no invertido mantenido en la cuenta reduce la exposición
    global a renta variable y bonos, creando un déficit estructural frente a un índice
    de referencia completamente invertido.
