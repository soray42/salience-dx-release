    salience_source: B/C — a vivid personal history of 504s-as-slow-queries plus the
      confident first instinct to reach for query plans.
    why_plausible: Slow queries are a genuinely common cause of gateway timeouts,
      so a strong personal track record makes it the reflexive first guess.
    why_irrelevant: The 504 lands precisely at the LB's 60-second idle cap while the
