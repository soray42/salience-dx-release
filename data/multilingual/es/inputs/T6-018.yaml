domain: technical_troubleshooting
complexity: medium
xbase: 'Un endpoint de nuestro servicio devuelve 504 Gateway Timeout, pero solo en
  la exportación CSV masiva — todos los demás endpoints funcionan bien. No es constante;
  falla en las exportaciones más grandes y tiene éxito en las pequeñas. No hemos cambiado
  el código de exportación recientemente, y los logs de la aplicación muestran que
  el handler sigue ejecutándose, sin errores, cuando el 504 llega al cliente. Una
  traza a nivel de consulta muestra que cada consulta individual a la base de datos
  que realiza la exportación se completa en bien menos de un segundo, incluso con
  los conjuntos de datos más grandes. {DS}

  '
focal_diagnostic_feature: El 504 salta exactamente a los 60 segundos, coincidiendo
  con el idle timeout del balanceador de carga, mientras que la exportación grande
  necesita legítimamente unos 75 segundos de extremo a extremo.
low_diagnostic_proposition: Every past 504 the user has dealt with came from a slow
  database query, so this one is probably a slow query too.
oracle_action: ANSWER
oracle_focus: Raise the load balancer's idle/response timeout for this endpoint (or
  paginate the export); the 504 fires at the LB's 60-second cutoff while a valid ~75-second
  export is still running.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a slow query from past 504s. Ask at what
  elapsed time the 504 fires and whether it matches a proxy or load-balancer timeout.
