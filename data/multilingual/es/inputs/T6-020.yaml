xbase: La latencia p99 de nuestra API ha sufrido picos graves varias veces al día
  durante la última semana, y mi primer movimiento es revertir nuestro despliegue
  más reciente. Los picos son breves pero severos; luego la latencia vuelve a la normalidad
  por sí sola. El tráfico es estable durante los picos y las tasas de error permanecen
  bajas. Hacemos varios despliegues al día, pero al cruzar los momentos de los picos
  con nuestro registro de despliegues, varios picos ocurrieron en horas en las que
  no desplegamos nada, por lo que no están relacionados con ningún despliegue. {DS}
focal_diagnostic_feature: Los picos ocurren exactamente al inicio de cada hora con
  independencia del momento de los despliegues — incluso en horas sin ningún despliegue
  — y se alinean con precisión con una actualización horaria de una vista materializada
  que adquiere un bloqueo pesado y satura los IOPS de la base de datos.
low_diagnostic_proposition: Every latency regression the user has handled before was
  caused by a bad deploy, so this one is probably a bad deploy too.
oracle_action: ANSWER
oracle_focus: Do not roll back; the spikes hit exactly on the hour independent of
  deploys and match an hourly materialized-view refresh that locks and saturates DB
  IOPS, so reschedule, incrementalise, or throttle that job.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a bad deploy from past regressions. Ask
  whether the spikes line up with deploy times or instead recur on a fixed schedule
  independent of deploys.
