domain: technical_troubleshooting
complexity: medium
xbase: Desde nuestra última versión de Android, algunos usuarios reportan que la app
  se cierra inmediatamente al abrirla, y mi primera idea es pedirles que limpien la
  caché y reinstalen. La mayoría de los usuarios están bien y nunca lo experimentan.
  El cierre ocurre justo al arrancar, antes de que aparezca ninguna pantalla. Ya pedí
  a algunos usuarios afectados que borraran todos los datos de la app y reinstalaran,
  y la app sigue cerrándose en el siguiente inicio. {DS}
focal_diagnostic_feature: Todos los informes de cierre provienen de dispositivos con
  versiones antiguas de Android, y el stack trace es un NoSuchMethodError para una
  API de plataforma que solo existe en versiones más nuevas del SO, llamada de forma
  incondicional durante el arranque.
low_diagnostic_proposition: Every launch crash the user has fixed before came from
  a corrupted local cache, so this one is probably a cache problem too.
oracle_action: ANSWER
oracle_focus: Guard the newer-OS platform API behind a version check or raise minSdk;
  the crashes are a NoSuchMethodError on older Android versions for an API that does
  not exist there, not a corrupted cache.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a cache problem from past crashes. Ask
  what the stack trace says and whether the affected devices share an OS version.
