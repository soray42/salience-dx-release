distractor_direction:
  label: Caché local corrupta
  description: Tratar el cierre en el arranque como datos locales de la app corruptos,
    solucionable limpiando la caché y reinstalando.
plausible_alternative_directions:
- label: Migración de datos almacenados
  description: Si una migración fallida de datos o esquema de datos de usuario existentes
    provoca el cierre al arrancar.
- label: Artefacto de versión defectuoso
  description: Si una compilación corrupta o mal firmada está llegando a un subconjunto
    de usuarios.
