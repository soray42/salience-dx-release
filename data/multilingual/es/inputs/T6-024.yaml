seed_id: T6-024
template: T6
domain: technical_troubleshooting
complexity: high
xbase: Nuestro servicio ha estado alcanzando los límites de tasa de la API de pagos
  upstream de forma intermitente durante los últimos cinco días. El límite de tasa
  afecta solo a un subconjunto de usuarios a la vez y estamos muy por debajo de nuestra
  cuota contratada de solicitudes en conjunto. El rastreo distribuido no muestra llamadas
  repetidas provocadas por errores. Añadimos un nuevo middleware de caché al flujo
  de pagos hace dos semanas. {DS}
focal_diagnostic_feature: El rastreo distribuido muestra entre 4 y 5 llamadas a la
  API de pagos upstream por sesión de usuario donde se espera exactamente una; el
  middleware de caché genera claves por ID de usuario en lugar de por token de idempotencia,
  por lo que las solicitudes concurrentes dentro de la misma sesión no se deduplicane
  y todas llegan al upstream.
low_diagnostic_proposition: Past rate-limit incidents for this service were caused
  by retry logic firing without adequate backoff, and the same may be happening now.
oracle_action: ANSWER
oracle_focus: Fix the caching middleware key to include the idempotency token so concurrent
  requests within a session are deduplicated before reaching the upstream payment
  API.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to retry-backoff as the cause without
  evidence. Ask for distributed tracing data showing upstream call counts per session
  and per-user rate-limit patterns.
