seed_id: T1-001
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Наш CI начал падать во вторник. Юнит-тесты, линтинг и сборка по-прежнему проходят
  успешно. Сбои появляются только тогда, когда интеграционный этап пытается подключиться
  к staging-реплике Postgres; ошибка — просто таймаут соединения на 30 секунд. Мы
  не вносили изменений ни в тесты, ни в схему базы данных в последнее время. {DS}
focal_diagnostic_feature: Подключение с CI-runner'а к порту Postgres завершается таймаутом
  до того, как происходит какая-либо аутентификация базы данных или выполняется запрос.
low_diagnostic_proposition: A comparable timeout at another company was attributed
  to an ORM connection-pool setting.
oracle_action: ASK
oracle_focus: Treat this as a reachability problem between CI and the staging replica;
  check DNS, firewall/security-group rules, routing, NAT/VPN, and DB port access from
  the runner.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the outside ORM story. Ask for direct connectivity
  checks from the CI runner to the replica before diagnosing application code.
cell_oracles:
  HL:
    action: ASK
    focus: Do not adopt the outside ORM story. Ask for direct connectivity checks
      from the CI runner to the replica before diagnosing application code.
  LL:
    action: ASK
    focus: Do not adopt the outside ORM story. Ask for direct connectivity checks
