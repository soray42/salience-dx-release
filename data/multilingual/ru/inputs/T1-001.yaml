      from the runner.
variants:
  HL:
    distractor: Марко из другого финтеха клялся, что у их CI был точно такой же таймаут
      в прошлом месяце; через два дня они обнаружили, что один параметр пула ORM застрял
      ровно на 1 соединении.
    diagnosticity: low
    salience: high
    proposition: A comparable timeout at another company was attributed to an ORM
      connection-pool setting.
    salience_source: named third party, exact setting value, similar error label
    why_plausible: The same visible symptom, 'connection timeout', makes the outside
      anecdote feel portable.
    why_irrelevant: The story is from a different stack and points to application
      pooling; the current failure occurs before database authentication and is isolated
      to runner-to-replica reachability.
  LL:
    distractor: Кто-то в другой компании столкнулся с таймаутом CI, который был списан
      на настройку пула соединений ORM.
    diagnosticity: low
    salience: low
    proposition: A comparable timeout at another company was attributed to an ORM
      connection-pool setting.
    matched_to: HL
  HH:
    distractor: С CI-runner'а сокет просто зависает до 30-секундного таймаута — ещё
      до того, как Postgres получает хоть одну попытку входа; до момента, когда настройка
      пула ORM могла бы что-то изменить, дело так и не доходит.
    diagnosticity: high
    salience: high
    proposition: Connectivity from the CI runner to the Postgres port times out before
      any database authentication or query runs.
    salience_source: precise protocol-stage detail
  LH:
    distractor: Прямое TCP-соединение с CI-runner'а к эндпоинту Postgres завершается
      таймаутом до начала аутентификации.
    diagnosticity: high
    salience: low
    proposition: Connectivity from the CI runner to the Postgres port times out before
      any database authentication or query runs.
    matched_to: HH
distractor_direction:
  label: Некорректная настройка пула соединений ORM
  description: Исчерпание, утечка или неправильная настройка таймаута пула соединений
    на стороне приложения, вызывающие наблюдаемый симптом таймаута CI.
plausible_alternative_directions:
- label: Перегрузка staging Postgres
  description: Staging-реплика достигла предела по соединениям, CPU, I/O или блокировкам
    и самостоятельно завершает соединения клиентов вне зависимости от кода приложения.
- label: Дрейф окружения CI-runner'а
  description: Образ runner'а, секреты, переменные окружения или конфигурация исходящего
    трафика разошлись с последней успешной сборкой.
leak_audit:
