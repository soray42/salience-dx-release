  HH:
    action: ASK
    focus: Treat this as a reachability problem between CI and the staging replica;
      check DNS, firewall/security-group rules, routing, NAT/VPN, and DB port access
      from the runner.
  LH:
    action: ASK
    focus: Treat this as a reachability problem between CI and the staging replica;
