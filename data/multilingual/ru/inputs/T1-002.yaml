variants:
  HL:
    distractor: У Прии был телефон, который показывал значок молнии, но намертво завис
      на 12%; позже выяснилось, что в предыдущее воскресенье он соскользнул в раковину
      с мыльной водой.
    diagnosticity: low
    salience: high
    proposition: A relative's similar charging symptom was caused by liquid contact.
    salience_source: named relative, vivid liquid detail, exact battery percentage
