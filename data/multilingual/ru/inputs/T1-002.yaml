distractor_direction:
  label: Повреждение от попадания влаги
  description: Исследование того, не повредил ли контакт с жидкостью зарядный тракт
    телефона, батарею или схему разъёма.
plausible_alternative_directions:
- label: Неисправность кабеля или адаптера
  description: Зарядный кабель или сетевой адаптер неисправен, несовместим или не
    обеспечивает достаточный ток.
- label: Сбой калибровки батареи
  description: Программный индикатор заряда батареи устарел или разошёлся с реальным
    значением, несмотря на обнаружение зарядки.
