domain: technical_troubleshooting
complexity: low
xbase: Мой телефон показывает, что заряжается, когда я его подключаю, но процент заряда
  батареи не меняется. Телефону два года, на экране нет никаких предупреждений. Я
  не замечал никаких недавних падений или попаданий влаги. {DS}
focal_diagnostic_feature: Одно и то же поведение при зарядке воспроизводится с несколькими
  заведомо исправными кабелями и сетевыми адаптерами.
low_diagnostic_proposition: A relative's similar charging symptom was caused by liquid
  contact.
oracle_action: ASK
oracle_focus: 'Focus on the phone side: battery health or charging-port hardware.
  Ask about port debris/damage, heat while plugged in, and battery-health diagnostics.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer liquid damage from someone else's phone.
  First isolate cable/adapter versus phone-side failure.
