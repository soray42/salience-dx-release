distractor_direction:
  label: Перестановка лейблов в пайплайне
  description: Исследование того, не были ли тренировочные или оценочные лейблы переставлены,
    инвертированы или неправильно объединены в пайплайне модели.
plausible_alternative_directions:
- label: Некалиброванный порог принятия решений
  description: Порог скора модели или слой калибровки изменились, что снизило точность
    без существенного изменения полноты.
- label: Регрессия логирования признаков
  description: Изменение в генерации признаков или логировании испортило один или
    несколько входных параметров модели после развёртывания.
- label: Запоздалые лейблы мошенничества
  description: Лейблы результатов поступают с задержкой или неравномерно, искажая
    последние измерения точности.
