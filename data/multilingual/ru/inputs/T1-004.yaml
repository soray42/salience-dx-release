template: T1
domain: technical_troubleshooting
complexity: high
xbase: Точность нашей производственной модели обнаружения мошенничества снижалась
  в течение последних нескольких недель, тогда как полнота практически не изменилась.
  Модель была развёрнута девять месяцев назад и с тех пор не переобучалась. Я не нашёл
  свидетельств недавних изменений в лейбл-пайплайне. {DS}
focal_diagnostic_feature: Потеря точности сосредоточена в новой категории мерчантов,
  которой не существовало в обучающих данных.
low_diagnostic_proposition: A fraud-model regression at another bank was caused by
  swapped labels in their pipeline.
oracle_action: ASK
oracle_focus: Investigate per-MCC precision and distribution shift; the pattern suggests
