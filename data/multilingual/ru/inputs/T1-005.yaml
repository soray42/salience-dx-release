seed_id: T1-005
template: T1
domain: open_qa
complexity: medium
xbase: У меня есть предложение о новой должности. Базовая зарплата заметно выше нынешней,
  у компании есть публичная финансовая отчётность, а её основная линейка продуктов
  выглядит стабильно. Мне нравится моя нынешняя команда, но я не уверен, помогает
  ли мне оставаться там в долгосрочной перспективе. {DS}
focal_diagnostic_feature: На нынешней должности нет определённого пути карьерного
  роста, несмотря на сильные отзывы, тогда как в новой роли есть прописанная карьерная
  лестница.
low_diagnostic_proposition: A comparable job move by an acquaintance ended badly because
  of team culture.
oracle_action: ANSWER
oracle_focus: On the stated facts, the move is favourable, while still leaving room
  to verify team culture before accepting.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let one external culture story override the offer
  facts. Ask about this specific manager, team norms, and promotion criteria.
