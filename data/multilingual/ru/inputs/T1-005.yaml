variants:
  HL:
    distractor: Даниэль перешёл ради более высокой зарплаты в прошлом году, к концу
      второго месяца возненавидел команду и уволился через семь мучительных месяцев.
    diagnosticity: low
    salience: high
    proposition: A comparable job move by an acquaintance ended badly because of team
      culture.
    salience_source: named person, concrete timeline, bad outcome narrative
    why_plausible: A cautionary story makes any job move feel risky.
    why_irrelevant: The anecdote concerns another team and cannot substitute for evidence
      about this offer's manager, role, or progression structure.
  LL:
    distractor: Знакомый принял похожее предложение с более высокой оплатой и позже
      сообщил о плохой совместимости с командой.
    diagnosticity: low
    salience: low
    proposition: A comparable job move by an acquaintance ended badly because of team
      culture.
    matched_to: HL
  HH:
    distractor: Три года я получаю сильные отзывы без смены должности и без чёткого
      карьерного пути; в новой роли есть написанная лестница с конкретными критериями.
    diagnosticity: high
    salience: high
    proposition: The current role has no defined promotion path despite strong reviews,
      while the new role has a written promotion ladder.
    salience_source: career-progression contrast
  LH:
    distractor: На нынешней должности нет определённого пути продвижения, несмотря
      на сильные отзывы, тогда как в предложении прописаны задокументированные критерии
      продвижения.
    diagnosticity: high
    salience: low
    proposition: The current role has no defined promotion path despite strong reviews,
      while the new role has a written promotion ladder.
    matched_to: HH
distractor_direction:
  label: Плохая совместимость с командой
  description: Оценка того, не столкнётся ли новая должность с проблемами культуры,
    руководителя или командной совместимости, несмотря на более высокую оплату.
plausible_alternative_directions:
- label: Финансовая устойчивость компании
  description: Насколько потенциальный работодатель финансово устойчив для долгосрочного
    обеспечения данной должности.
- label: Ценность удержания в нынешней команде
  description: Предоставляет ли пребывание в нынешней команде преимущества в виде
    наставничества, поддержки или внутренней мобильности.
- label: Несоответствие масштаба роли
  description: Насколько должность и реальные обязанности в новой роли соответствуют
    карьерному вектору пользователя.
