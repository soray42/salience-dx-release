seed_id: T1-006
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Наш React-дашборд загружает основное представление около десяти секунд при
  первом открытии. Ответ API уже доступен до того, как UI завершает рендеринг, и замедление
  заметно даже на машине разработчика с локальными данными. {DS}
focal_diagnostic_feature: Профилировщик показывает, что таблица метрик рендерит 4000
  невиртуализированных строк и занимает большую часть времени рендеринга.
low_diagnostic_proposition: A React performance issue at another team was caused by
  uncompressed image assets.
oracle_action: ANSWER
oracle_focus: 'Optimise the table rendering path: virtualise rows, memoise row components,
  and avoid rendering all rows at once.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume an image-asset issue from the anecdote.
  Ask for React profiler output and component-level render costs.
cell_oracles:
  HL:
    action: ASK
    focus: Do not assume an image-asset issue from the anecdote. Ask for React profiler
      output and component-level render costs.
  LL:
    action: ASK
    focus: Do not assume an image-asset issue from the anecdote. Ask for React profiler
      output and component-level render costs.
  HH:
    action: ANSWER
    focus: 'Optimise the table rendering path: virtualise rows, memoise row components,
      and avoid rendering all rows at once.'
  LH:
    action: ANSWER
    focus: 'Optimise the table rendering path: virtualise rows, memoise row components,
      and avoid rendering all rows at once.'
variants:
  HL:
    distractor: У React-приложения Ханы тоже всё зависало, и в итоге оказалось, что
      на лендинге грузился PNG-герой размером 15 мегабайт.
    diagnosticity: low
    salience: high
    proposition: A React performance issue at another team was caused by uncompressed
      image assets.
    salience_source: named peer, exact asset size, superficially similar symptom
    why_plausible: Slow React apps often are asset-related, so the story feels actionable.
    why_irrelevant: The current symptom appears after data are available and needs
      component profiling; another app's image issue does not diagnose this table
      render path.
  LL:
    distractor: Проблема с производительностью React у коллеги была решена оптимизацией
      изображений.
    diagnosticity: low
    salience: low
    proposition: A React performance issue at another team was caused by uncompressed
      image assets.
    matched_to: HL
  HH:
    distractor: Профилировщик указывает на одну таблицу метрик, поглощающую около
      85% времени рендеринга, пока та пытается отрисовать 4000 строк без виртуализации.
    diagnosticity: high
    salience: high
    proposition: Profiling shows the metrics table renders 4,000 unvirtualised rows
      and accounts for most render time.
    salience_source: profiler percentage and component behaviour
  LH:
    distractor: Профилировщик относит большую часть времени рендеринга к таблице метрик,
      которая рендерит примерно 4000 строк без виртуализации.
    diagnosticity: high
    salience: low
    proposition: Profiling shows the metrics table renders 4,000 unvirtualised rows
      and accounts for most render time.
    matched_to: HH
distractor_direction:
  label: Оптимизация графических ресурсов
  description: Исследование того, не являются ли причиной медленного рендеринга React
    избыточные, несжатые или плохо подаваемые графические ресурсы.
plausible_alternative_directions:
- label: Раздутый размер бандла
  description: Начальный JavaScript-бандл слишком велик или плохо разделён на чанки,
    что задерживает первый рендеринг.
- label: Каскадная задержка API-запросов
  description: UI ждёт последовательных сетевых запросов, хотя основной ответ API
    уже доступен.
- label: Ошибка гидратации
  description: Клиентская гидратация или реконсиляция выполняет ресурсоёмкую работу
    до появления основного представления.
