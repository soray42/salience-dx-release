variants:
  HL:
    distractor: 'У Тома в прошлом лете ноутбук гудел, как фен: в его комнате было
      35°C, потому что в съёмной квартире сломался кондиционер.'
    diagnosticity: low
    salience: high
    proposition: A comparable fan-noise issue elsewhere was caused by high room temperature.
    salience_source: named friend, concrete room temperature, vivid sound comparison
