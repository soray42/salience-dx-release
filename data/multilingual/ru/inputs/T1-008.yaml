domain: technical_troubleshooting
complexity: low
xbase: Вентиляторы моего ноутбука шумят почти весь день на протяжении последних нескольких
  недель. Нижняя поверхность нагревается, однако Activity Monitor не показывает зависших
  приложений или аномально высокой загрузки CPU. {DS}
focal_diagnostic_feature: Решётка вентилятора и область забора воздуха видимо забиты
  пылью.
low_diagnostic_proposition: A comparable fan-noise issue elsewhere was caused by high
  room temperature.
oracle_action: ANSWER
oracle_focus: This is most likely blocked airflow; clean the vents/fan grille carefully
  and check temperatures afterward.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not conclude ambient-temperature cause from another
  person's room. Ask the user to inspect vents, airflow, and dust buildup.
