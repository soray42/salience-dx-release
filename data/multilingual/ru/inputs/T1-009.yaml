distractor_direction:
  label: Риск дефектов конкретного экземпляра
  description: Исследование вопроса о том, имеет ли данная модель телевизора единичные
    дефекты контроля качества, которые должны определять выбор при покупке.
plausible_alternative_directions:
- label: Соответствие освещённости помещения
  description: Что лучше подходит для типичной вечерней обстановки пользователя —
    OLED или LED.
- label: Долгосрочный риск выгорания
  description: Следует ли учитывать деградацию OLED-панели или выгорание при принятии
    решения о многолетней покупке.
- label: Политика возврата магазина
  description: Насколько гарантия и процедура возврата в магазине существенно снижают
    риск покупки.
