variants:
  HL:
    distractor: Моя двоюродная сестра купила именно этот OLED в спальню и вернула
      его, заметив крошечное кольцо пыли под стеклом в тёмных сценах.
    diagnosticity: low
    salience: high
    proposition: A relative returned Model A because of a unit-specific dust defect.
    salience_source: specific relative, exact defect image, same model
    why_plausible: A defect story about the exact model feels more concrete than aggregate
      reviews.
    why_irrelevant: A single unit defect does not outweigh systematic differences
      in panel technology, warranty, and review base.
  LL:
    distractor: Один родственник вернул ту же модель из-за дефекта дисплея, характерного
      для конкретного экземпляра.
    diagnosticity: low
    salience: low
    proposition: A relative returned Model A because of a unit-specific dust defect.
    matched_to: HL
  HH:
    distractor: Всего за €20 разницы модель A — OLED вместо LED, трёхлетняя гарантия
      вместо однолетней, и десятки профессиональных обзоров со средней оценкой 4,6
      из 5.
    diagnosticity: high
    salience: high
    proposition: For €20 more, Model A has OLED rather than LED, a longer warranty,
      and a much larger professional review base.
    salience_source: multi-attribute product comparison
  LH:
    distractor: Модель A стоит на €20 дороже, но предлагает OLED вместо LED, гарантию
