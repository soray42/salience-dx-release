complexity: low
xbase: Я выбираю между двумя телевизорами одного размера, продающимися в одном и том
  же магазине. Модель A стоит €699, модель B — €679. Я в основном смотрю фильмы вечером
  и хочу, чтобы покупка прослужила несколько лет. {DS}
focal_diagnostic_feature: За €20 дополнительной стоимости модель A имеет OLED вместо
  LED, более длительную гарантию и значительно более обширную базу профессиональных
  обзоров.
low_diagnostic_proposition: A relative returned Model A because of a unit-specific
  dust defect.
oracle_action: ANSWER
oracle_focus: Choose Model A unless there is a hidden constraint; the better panel,
  warranty, and evidence base easily justify the small price difference.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not generalise from one defective unit. Ask for display
  type, warranty, and review evidence before deciding.
