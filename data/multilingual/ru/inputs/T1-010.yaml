distractor_direction:
  label: Ограничение трафика провайдером
  description: Исследование вопроса о том, ограничивает ли интернет-провайдер зашифрованный
    VPN-трафик.
plausible_alternative_directions:
- label: Перегрузка шлюза
  description: Удалённый корпоративный VPN-шлюз перегружен или недостаточно масштабирован
    под текущую нагрузку.
- label: Несовместимость протокола VPN
  description: Выбранный протокол VPN, шифр или транспорт неэффективны для данного
    маршрута.
- label: Деградация маршрута пиринга
  description: Маршрут между домашним провайдером и зарубежным шлюзом имеет плохой
    пиринг или потери пакетов.
