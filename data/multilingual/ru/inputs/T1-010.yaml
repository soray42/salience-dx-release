  другой стране, и на этой неделе я не менял настройки VPN-клиента. {DS}'
focal_diagnostic_feature: Другие коллеги в том же городе, использующие тот же шлюз
  сегодня, получают более 100 Мбит/с.
low_diagnostic_proposition: A peer's VPN problem was attributed to ISP-level throttling
  of encrypted traffic.
oracle_action: ASK
oracle_focus: The problem is local to this user's path or device; check Wi-Fi/NIC,
