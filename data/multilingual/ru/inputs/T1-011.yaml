seed_id: T1-011
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Моё Android-приложение падает при запуске у части пользователей. Краш проявляется
  только в релизном APK — вся наша команда может запускать отладочную сборку без каких-либо
  проблем, в том числе на тех же устройствах, где релизная сборка падает. Краш происходит
  внутри onCreate до выполнения каких-либо сетевых вызовов. {DS}
focal_diagnostic_feature: В стектрейсе краша — java.lang.ClassNotFoundException для
  класса, к которому обращаются через рефлексию, а в release build.gradle включена
  R8-минификация без keep-правила для этого класса.
low_diagnostic_proposition: 'Another company''s release-only startup crash was caused
  by OEM-specific device customizations.

  '
oracle_action: ANSWER
oracle_focus: 'Focus on R8/ProGuard minification stripping the reflection-accessed
  class; add an appropriate -keep rule in proguard-rules.pro to preserve the class
  name at runtime.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Request the crash stack trace and the project''s build
  configuration (especially minifyEnabled and proguard rules) to identify why the
  release build crashes while the debug build succeeds; do not pursue OEM-specific
  device customizations as a primary direction.

  '
