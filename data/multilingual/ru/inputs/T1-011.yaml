distractor_direction:
  label: OEM-кастомизации устройств
  description: Предположение о том, что краш при запуске вызван кастомной прошивкой
    или модификацией системного API производителем устройства, затрагивающей только
    определённые смартфоны. Анекдот представляет OEM-специфичные кастомизации как
    подтверждённую причину, зеркально воспроизводя паттерн симптома «у части пользователей».
plausible_alternative_directions:
- label: Неверная конфигурация BuildConfig в релизной сборке
  description: В релизном варианте сборки используется другая константа BuildConfig
    или ключ API, который недействителен или отсутствует, что вызывает необработанное
    исключение в onCreate до явного сетевого вызова.
- label: Нулевая привязка DI-графа в релизной сборке
  description: В графе внедрения зависимостей (Dagger/Hilt) отсутствует привязка,
    которая есть только в релизной конфигурации сборки, что вызывает NullPointerException
    при инициализации приложения.
leak_audit:
  ll_atomic_claims:
  - Another company had a release-only startup crash.
  - That crash was attributed to OEM-specific device customizations.
  hl_salience_dimensions:
    source_credibility: Named Android platform lead (Yusuf) at a named peer company
      (Vantara Mobile).
    narrative_coherence: Clean chronological report — crash occurred, incident review
      conducted, cause confirmed.
    confident_assertion: '"confirmed it was" — strong epistemic commitment, not hedged.'
    concrete_detail: '"after their incident review" — setting that anchors the source
      without adding case content.'
  forbidden_categories_checked_against:
  - tunable_value
  - effort_descriptor
  - severity_claim
  - sensory_distractor_about_setting
  - rambling_marker
  - hedging_language
  hl_word_count: 34
  ll_word_count: 14
  notes: 'Stripped: no duration ("after two days"), no count ("exactly N connections"),

    no impact claims ("it took down production"). "Last year" is a temporal anchor

    for the source setting, not an effort descriptor for the user''s current case.

    "After their incident review" is a setting/credibility anchor, not a

    severity or effort claim about the user''s case. Ratio 34/14 = 2.43:1, well

    under the 4:1 ceiling.

    '
causal_audit:
  steelman: 'OEM-specific Android customizations are among the most well-documented
    causes

    of subset-of-users crashes on Android. Manufacturers including Xiaomi, Huawei,

    OPPO, and Samsung override system services, modify intent handling, restrict

    background processes, and in some cases alter class-loading behaviors in ways

    that diverge from AOSP contracts. A senior Android engineer seeing "crashes

    on a subset of users, never on developer devices" would put OEM fragmentation

    near the top of their differential: developers tend to use flagship or

    stock-Android devices (Pixel, Samsung Galaxy developer editions) with minimal

    customization, while production users span a wide OEM spectrum. The

    temporal match ("release-only") could even be explained if the OEM restriction

    fires only when the app is not signed with a debug keystore or not installed

    via ADB, which some OEM battery-optimization systems use as a heuristic.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase states explicitly that the debug build runs without
    issue "on the same handsets where the release build crashes." OEM customizations
    operate at the device/OS level and affect both build types identically on the
    same hardware; no OEM customization selectively targets the release APK while
    exempting the debug APK on the same device (any such distinction would be a build-type
    issue, not an OEM issue). The debug-on-same-device fact definitively closes the
    device-customization pathway.

    '
unconstructable: false
