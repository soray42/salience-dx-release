distractor_direction:
  label: Задержка из-за синхронных запросов консьюмера
  description: Гипотеза о том, что консьюмер, назначенный на партицию 7, выполняет
    синхронные внешние вызовы (например, запросы к базе данных) внутри consume-цикла,
    снижая пропускную способность и вызывая накопление лага на этой партиции.
plausible_alternative_directions:
- label: Перекос продюсеров на горячую партицию
  description: Диапазон ключей партиции 7 притягивает непропорционально высокий объём
    сообщений от продюсеров, из-за чего консьюмер не успевает их обрабатывать вне
    зависимости от скорости обработки.
- label: Ошибка десериализации «ядовитого» сообщения
  description: Одно или несколько некорректных сообщений на партиции 7 вызывают повторяющиеся
    ошибки или ретраи десериализации, останавливая прогресс консьюмера на этой партиции.
- label: Исчерпание ресурсов экземпляра консьюмера
  description: Конкретный JVM-экземпляр консьюмера, назначенный на партицию 7, испытывает
    нехватку heap или CPU, что вызывает паузы GC или thread starvation, замедляющие
    потребление независимо от состояния брокера.
