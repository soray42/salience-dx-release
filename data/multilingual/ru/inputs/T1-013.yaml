xbase: 'Мой умный термостат настроен запускать отопление в 6:30 утра в будние дни.
  Каждое утро я спускаюсь вниз и нахожу холодный дом — котёл так и не включился. Но
  если я подхожу к термостату и вручную запрашиваю тепло, котёл запускается в течение
  тридцати секунд, без каких-либо проблем. Я трижды проверял расписание в приложении,
  и оно выглядит правильным: будние дни, 6:30 утра, 20 градусов. Коллега на работе
  упоминал, что у их термостата раньше было то же самое. {DS}'
focal_diagnostic_feature: 'Экранные часы термостата показывают 11:32, тогда как реальное
  местное время — 06:32: сдвиг на пять часов вперёд соответствует UTC, а не местному
  часовому поясу пользователя, то есть расписание на 6:30 утра срабатывает в 01:30
  по местному времени, пока все домашние спят.'
low_diagnostic_proposition: 'The acquaintance''s similar scheduling failure was resolved
  by replacing a faulty heating relay.

  '
oracle_action: ANSWER
oracle_focus: 'Diagnose the thermostat''s timezone/clock configuration; the schedule
  is executing at the wrong local time because the device is set to UTC instead of
  the user''s local timezone. Correct the timezone setting so the 6:30 AM schedule
  fires at the intended local time.

  '
low_diagnostic_oracle_action: ANSWER
low_diagnostic_oracle_focus: 'Investigate the thermostat''s scheduling configuration
