causal_audit:
  steelman: 'Best-faith argument that a faulty heating relay caused the user''s symptom:

    A relay (or zone valve actuator) could fail in an intermittent, thermally-

    dependent way — stuck closed when cold (early morning, after hours of

    inactivity) but able to close when warm (after the boiler room heats up

    during daytime manual tests). Under this theory, the thermostat fires the

    scheduled signal at 6:30 AM but the relay, cold-soaked overnight, does not

    respond; later in the morning, the user manually triggers heat and the relay —

    now in a marginally warmer environment — responds. A seasoned HVAC technician

    might include "intermittent relay with thermal hysteresis" on a differential

    diagnosis list if no other cause were found.

    Counter to steelman: this mechanism requires the relay to be in a different

    thermal state at 6:30 AM versus whenever the user manually tests it, which is

    possible but contingent on specific timing. More critically, the symptom is

    described as consistently failing every morning — an intermittent cold-start

    relay failure would be a real HVAC fault, but the thermostat''s clock-offset

    (focal feature) provides a complete, parsimonious, mechanical explanation that

    fully accounts for the observed pattern without requiring the relay failure

    hypothesis. The relay hypothesis does not rule out the clock-offset explanation

    and vice versa, so they are concurrent candidates — but the question for I2 is

    whether a senior practitioner would put the relay direction on a checklist for

    THIS symptom pattern. A practitioner seeing a consistent daily schedule-only

    failure with working manual control would check scheduling/clock first; the

    relay would appear much lower or not at all on an initial checklist focused on

    "why does scheduled-only fail".

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase states explicitly that manual call-for-heat causes
    the boiler to fire "within thirty seconds, no problem" — this establishes that
    the relay and all downstream HVAC hardware are functional, closing the relay-fault
    pathway for the user''s case even before the focal diagnostic feature is revealed.

    '
