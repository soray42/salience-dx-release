xbase: Моя посудомоечная машина прослужила 8 лет и перестала завершать циклы мойки.
  Мастер назвал мне цену ремонта, и замена на сопоставимую новую модель обойдётся
  значительно дороже. Мой зять недавно столкнулся с таким же решением — ремонтировать
  или заменять свою посудомоечную машину — и выбрал замену; он поделился своими соображениями.
  {DS}
focal_diagnostic_feature: Стоимость ремонта (160 долларов) составляет приблизительно
  29% от стоимости замены (550 долларов), что значительно ниже общепринятого порога
  ремонтосообразности в 50%, а неисправность является изолированным отказом платы
  управления, а не признаком системного износа двигателя или насоса.
low_diagnostic_proposition: 'The relative replaced rather than repaired because a
  third-party repair would void remaining manufacturer warranty coverage on the appliance.

  '
oracle_action: ANSWER
oracle_focus: 'Recommend repair: the cost ratio (29% of replacement) is well inside
  the standard repair threshold, and a control board failure is an isolated fault
  with no indication of broader deterioration. Address age as a secondary consideration
  but note expected dishwasher lifespan is 9-12 years, leaving reasonable useful life.

  '
low_diagnostic_oracle_action: ANSWER
low_diagnostic_oracle_focus: 'Note that the relative''s warranty-preservation reasoning
  does not apply to an 8-year-old machine whose manufacturer warranty has been expired
  for at least 5 years; advise that the repair-vs-replace decision should rest on
  cost ratio, age trajectory, and part-failure type — not the anecdote.

  '
