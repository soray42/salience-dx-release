distractor_direction:
  label: защелачивание почвы и блокировка железа
  description: Пожелтение томатов у соседа было вызвано слишком высоким pH почвы,
    из-за чего растения не могли усваивать железо — гипотеза, которую пользователь
    может попытаться применить к своему случаю по аналогии.
plausible_alternative_directions:
- label: дефицит магния
  description: Магний — тоже мобильный питательный элемент, дефицит которого вызывает
    пожелтение нижних листьев (нередко межжилковое) у контейнерных томатов при его
    истощении; реальный дифференциальный диагноз наряду с дефицитом азота.
- label: естественное старение листьев
  description: Нижние листья плодоносящих томатов естественным образом желтеют и опадают
    по мере созревания растения, перераспределяющего энергию на плоды; темп и масштаб
    отличают этот процесс от недостатка питательных веществ.
- label: ограничение корней или уплотнение почвы
  description: Балконные контейнеры за сезон могут стать тесными для корневой системы
    или развить уплотнённую почву, ограничивая усвоение питательных веществ и воды
    и вызывая пожелтение нижних листьев даже при регулярном поливе.
