seed_id: T1-018
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Один сквозной тест в нашем наборе начал периодически падать — примерно один
  раз из пяти запусков. Он проверяет, что только что созданный счёт отображается в
  разделе «выставить срок на этой неделе». Код приложения, связанный со счетами, не
  менялся уже месяц, и тест стабильно проходит, когда я запускаю его отдельно на своей
  машине. В CI он падает, казалось бы, в случайном порядке — даже когда я закрепляю
  задание на запуск только этой спецификации отдельно, без других тестов, разделяющих
  процесс. {DS}
focal_diagnostic_feature: Тест использует жёстко заданную строку даты срока, и падает
  только в тех запусках CI, которые начинаются после 23:00 UTC, когда «эта неделя»
  переходит в следующую неделю по ISO.
low_diagnostic_proposition: A comparable flaky test elsewhere was caused by tests
  sharing state when run in parallel.
oracle_action: ANSWER
oracle_focus: 'Fix the test''s time handling: the hardcoded due date crosses the week
  boundary late in the day, so make the fixture relative to a frozen clock rather
  than a literal date, rather than chasing parallelism.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the parallel-state explanation from another
  project. Ask when the failing runs occur and whether any date or time value in the
  test is fixed.
