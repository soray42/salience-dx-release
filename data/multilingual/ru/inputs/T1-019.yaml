domain: open_qa
complexity: medium
xbase: Я подал заявление об увольнении после получения внешнего предложения, и мой
  нынешний работодатель сделал встречное предложение. Они готовы сравняться с новой
  зарплатой и, что для меня важнее, говорят, что устранят структурные проблемы, которые
  заставляли меня думать об уходе. Мне здесь по-настоящему нравится работа, когда
  условия складываются правильно. У меня есть три дня на ответ. {DS}
focal_diagnostic_feature: Встречное предложение оформлено письменно и конкретно устраняет
  обе причины, по которым пользователь хотел уйти, — смену команды и линию подчинения,
  — а не только зарплату.
low_diagnostic_proposition: An acquaintance who accepted a counteroffer was managed
  out of the company within a year.
oracle_action: ANSWER
oracle_focus: 'The counteroffer is reasonable to accept: in writing it addresses the
  actual drivers of the user''s departure (team and manager), not just salary, so
  the generic "counteroffers backfire" worry does not apply to these terms.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not generalise from one person's counteroffer going
  badly. Ask what the counteroffer actually changes and whether it addresses why the
  user wanted out.
