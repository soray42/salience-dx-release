seed_id: T1-020
template: T1
domain: technical_troubleshooting
complexity: high
xbase: В этом спринте качество семантического поиска резко упало. Пользователи сообщают,
  что результаты по обычным запросам теперь практически случайны, тогда как точные
  совпадения по ключевым словам по-прежнему находятся нормально. Две недели назад
  мы обновили модель эмбеддингов в рамках работ по улучшению релевантности. Сервис
  поиска, тип ANN-индекса и парсер запросов остались без изменений, а офлайн-оценка
  на свежей тестовой выборке показывает отличные результаты. {DS}
focal_diagnostic_feature: Только документы, переиндексированные после обновления,
  содержат векторы новой модели; основная часть индекса по-прежнему хранит векторы
  старой модели, и сходство вычисляется между двумя несовместимыми пространствами
  эмбеддингов.
low_diagnostic_proposition: A peer's search relevance regression was traced to a tokenizer
  change that altered how queries were split.
oracle_action: ANSWER
oracle_focus: Re-embed and reindex the entire corpus with the new model so the whole
  index lives in one embedding space; mixed old/new vectors make cross-space similarity
  meaningless, which is why fresh-holdout offline scores look fine.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not import the tokenizer-change explanation. Ask whether
  the full corpus was re-embedded after the model upgrade or only newly ingested documents.
