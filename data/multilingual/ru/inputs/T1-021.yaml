xbase: Я решаю, стоит ли покупать отдельный полис страхования путешествий, который
  настойчиво предлагает сайт бронирования для моей предстоящей поездки на длинные
  выходные. Это добавит около €60 к стоимости. Я склонен к осторожности, а подсказка
  купить его довольно настойчива. Поездка — один короткий перелёт и две ночи в отеле.
  {DS}
focal_diagnostic_feature: Как перелёт, так и отель полностью возвратны за 24 часа
  до поездки, а карта, которой пользователь оплатил бронирования, уже включает страхование
  от отмены поездки и задержки рейса.
low_diagnostic_proposition: A relative skipped travel insurance and lost a large non-refundable
  deposit when their trip was cancelled.
oracle_action: ANSWER
oracle_focus: Skip the standalone policy; the bookings are fully refundable and the
  paying card already provides cancellation and delay cover, so the €60 add-on largely
  duplicates protection the user already holds.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not buy on the strength of someone else's loss. Ask
