variants:
  HL:
    distractor: 'Идунн, SRE, с которой я работал бок о бок много лет, рассказала мне,
      что однажды исчезнувшая cron-задача объяснялась заполненным диском: диск был
      заполнен, поэтому cron не мог записывать журналы запусков и просто перестал
      запускать задачу.'
    diagnosticity: low
    salience: high
    proposition: A colleague's cron job stopped running because a full disk prevented
      the daemon from writing its logs.
    salience_source: A — an experienced SRE colleague recounting a closely matching
      'vanished cron job' debugging story.
    why_plausible: A full disk genuinely breaks many background jobs and is a common
      gotcha, so it is a reasonable thing to check first.
    why_irrelevant: xbase reports df shows every partition well under 80% full, so
      disk space is affirmatively adequate; the failure is specific to cron's scheduled
      session, which a full disk does not explain.
  LL:
    distractor: У коллеги cron-задача перестала выполняться из-за заполненного диска,
      который не давал демону записывать журналы.
    diagnosticity: low
    salience: low
    proposition: A colleague's cron job stopped running because a full disk prevented
      the daemon from writing its logs.
    matched_to: HL
  HH:
    distractor: 'Журнал аутентификации говорит сам за себя: каждую ночь в запланированную
      минуту cron фиксирует ошибку сессии с записью «account locked» для сервисного
      пользователя, от имени которого выполняется задача. Этот аккаунт был заблокирован
      в ходе проверки безопасности восемь дней назад — как раз тогда, когда перестали
      приходить дайджесты.'
    diagnosticity: high
    salience: high
    proposition: The system auth log shows cron refusing to start the job's session
      with "account locked", and the dedicated service account was locked during a
      security-hardening pass eight days ago.
    salience_source: The auth-log line and the dated hardening sweep make the locked-account
      cause precise and corroborated.
  LH:
    distractor: В журнале аутентификации видно, что cron завершает сессию сервисного
      аккаунта задачи ошибкой «account locked», заблокированного при прохождении проверки
      безопасности восемь дней назад, когда и прекратила приходить сводка.
    diagnosticity: high
    salience: low
    proposition: The system auth log shows cron refusing to start the job's session
      with "account locked", and the dedicated service account was locked during a
      security-hardening pass eight days ago.
    matched_to: HH
distractor_direction:
  label: Сбой из-за заполненного диска
  description: Расследование того, не привело ли переполнение диска к невозможности
    cron записывать журналы и, следовательно, запускать задачу.
plausible_alternative_directions:
- label: Различие переменных среды crontab
  description: Отличается ли минималистичная среда cron (PATH, переменные) от интерактивной
    оболочки и не ломает ли это задачу.
  variables) differs from the interactive shell and breaks the job.: null
- label: Демон cron не запущен
  description: Не был ли сам сервис cron остановлен или не завершился ли он аварийно
    на хосте.
leak_audit:
  ll_atomic_claims:
  - A colleague's cron job stopped running.
  - The cause was a full disk preventing the daemon from writing its logs.
  hh_atomic_claims:
  - The auth log shows cron failing the job's session with "account locked" every
    scheduled night.
  - The failure is for the dedicated service account the job runs as.
  - That account was locked during a security-hardening pass eight days ago, matching
    when digests stopped.
  hl_salience_dimensions:
    source_credibility: Named long-time SRE colleague (Idunn).
    narrative_coherence: Coherent recollection of a closely matching vanished-cron-job
      incident.
    confident_assertion: Told me confidently it came down to a full disk.
    concrete_detail: N/A — HL adds only source identification (Idunn, SRE) and the
      shared mechanism, no case-specific detail LL lacks.
  forbidden_categories_checked_against:
  - tunable_value
  - effort_descriptor
  - severity_claim
  - sensory_distractor_about_setting
  - rambling_marker
  - hedging_language
  xbase_word_count: 70
  hl_word_count: 39
  ll_word_count: 17
  hh_word_count: 45
  lh_word_count: 23
  notes: 'xbase establishes "runs by hand, no app error, crontab unchanged" — symptoms
    shared by many cron failures.

    xbase now also closes the disk pathway with a neutral df check (every partition
    well under 80% full),

    naming no affirmative cause, so the full-disk distractor retains no defensible
    mechanism for this case.

    The decisive account-locked auth-log evidence is HH/LH-only. HL no longer adds
    the resolution consequence

    ("until they cleared space") or the tunable "partition at 100%" that LL lacked;
    LH now carries HH''s

    "when the digests stopped" temporal correlation, restoring HH/LH flat equivalence.

    '
causal_audit:
  steelman: 'A platform engineer could argue a full disk is a frequent silent killer
    of scheduled jobs — cron and the mailer

    both need to write, and a wedged partition can make jobs fail without an application-level
    error, matching the

    "no error, just stopped" symptom, so checking disk usage is a legitimate early
    step.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'Yes: xbase states ''df shows every partition well under
    80% full'', a neutral check that affirmatively rules out disk pressure without
    naming the locked-account cause (given only in HH/LH); ''runs perfectly by hand''
    further shows script and environment are fine.'
