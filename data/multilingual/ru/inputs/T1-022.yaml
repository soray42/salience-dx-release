seed_id: T1-022
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Около недели назад ночная cron-задача, которая рассылает команде сводку продаж
  по электронной почте, беззвучно перестала выполняться. Дайджест не приходит, но
  в журналах приложения нет никаких ошибок, а скрипт отлично работает при ручном запуске.
  Запись в crontab на месте и выглядит точно так же, как всегда. Никто не трогал ни
  расписание, ни скрипт, а df показывает, что все разделы заняты менее чем на 80%.
  {DS}
focal_diagnostic_feature: Системный журнал аутентификации показывает, что cron отказывается
  запускать сессию задачи с ошибкой «account locked», а выделенный сервисный аккаунт
  был заблокирован в ходе проверки безопасности восемь дней назад.
low_diagnostic_proposition: A colleague's cron job stopped running because a full
  disk prevented the daemon from writing its logs.
oracle_action: ANSWER
oracle_focus: Re-enable (or replace) the locked service account the cron job runs
  as, or move the job to a permitted account; PAM is refusing the cron session because
  the account was locked, which is why no script error appears.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a full-disk cause from another case. Ask
  what the system auth/cron logs show about the job's user account and recent account
  or permission changes.
