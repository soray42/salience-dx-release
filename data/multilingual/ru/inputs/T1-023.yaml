xbase: Я пытаюсь сократить ежемесячные подписки. Я просмотрел выписку по карте за
  прошлый год и выписал всё повторяющееся. Я плачу за два отдельных стриминговых сервиса,
  план облачного хранилища, план музыкального стриминга, новостной сайт и приложение
  для медитации. Я хочу отменить то, чем реально не пользуюсь, а не просто угадывать,
  и у меня есть реальная история использования для проверки. {DS}
focal_diagnostic_feature: Собственная история просмотров пользователя показывает,
  что один из двух стриминговых сервисов не открывался ни разу за последние полгода,
  тогда как второй использовался почти каждую неделю.
low_diagnostic_proposition: A friend regretted cancelling a streaming service because
  a show they later wanted moved exclusively to it.
oracle_action: ANSWER
oracle_focus: Cancel the streaming service the user's own history shows unopened for
  six months; keep the one used most weeks, and review the rest against actual usage
  the same way rather than against someone else's regret story.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let a friend's content-exclusivity regret decide
  it. Ask for the user's own usage history on each service before cancelling anything.
