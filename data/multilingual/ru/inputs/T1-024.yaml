    proposition: A similar 502 problem at another company was traced to an expired
      TLS certificate on the upstream service.
    salience_source: A — a trusted platform engineer recounting a closely symptom-matched
      502 investigation.
    why_plausible: Certificate problems do cause gateway errors and the symptom-match
      (random 502s, nothing in app logs) makes the anecdote feel directly applicable.
    why_irrelevant: An expired upstream certificate fails handshakes consistently
      for the affected period, not one request in fifty with no pattern; the focal
