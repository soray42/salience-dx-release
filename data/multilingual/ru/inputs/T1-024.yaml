seed_id: T1-024
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Наш REST API эпизодически возвращает 502 Bad Gateway примерно одному из пятидесяти
  запросов, без явной закономерности по эндпоинтам. Серверы приложений за балансировщиком
  нагрузки не фиксируют ничего необычного для затронутых запросов, а общий трафик
  заметно ниже максимальной пропускной способности. Последние две недели мы не выкатывали
  новый код и не меняли конфигурацию балансировщика. Быстрая проверка подтвердила,
  что все TLS-сертификаты бэкендов актуальны и одинаковы на каждом инстансе. {DS}
focal_diagnostic_feature: Ошибки 502 возникают только при запросах, где балансировщик
  нагрузки повторно использовал idle keep-alive-соединение, уже закрытое бэкендом,
  — из-за того что таймаут keep-alive бэкенда короче, чем у балансировщика.
low_diagnostic_proposition: A similar 502 problem at another company was traced to
  an expired TLS certificate on the upstream service.
oracle_action: ANSWER
oracle_focus: Align the keep-alive timeouts so the backend's idle timeout is longer
  than the load balancer's, or disable upstream keep-alive reuse; the load balancer
  is reusing connections the backend has already closed, producing the intermittent
  502s.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not import the other company's certificate-expiry
  explanation. Ask whether the 502s correlate with reused idle connections and how
  the backend and load balancer keep-alive timeouts compare.
