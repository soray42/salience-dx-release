    diagnosticity: high
    salience: high
    proposition: The 502s occur only on requests where the load balancer reused an
      idle keep-alive connection whose upstream had already closed it, because the
      backend keep-alive timeout is shorter than the load balancer's.
    salience_source: The packet-level correlation to reused-closed connections plus
