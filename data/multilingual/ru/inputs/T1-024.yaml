    diagnosticity: high
    salience: low
    proposition: The 502s occur only on requests where the load balancer reused an
      idle keep-alive connection whose upstream had already closed it, because the
      backend keep-alive timeout is shorter than the load balancer's.
    matched_to: HH
distractor_direction:
  label: Истёкший TLS-сертификат апстрима
  description: Расследование того, не вызывают ли эпизодические ответы 502 Bad Gateway
    истёкший или недействительный TLS-сертификат на апстрим-сервисе.
plausible_alternative_directions:
- label: Аварийное завершение бэкенда на определённых запросах
  description: Не приводят ли определённые запросы к краш воркера, из-за чего балансировщик
    видит разрыв соединения.
- label: Нестабильные проверки работоспособности балансировщика
  description: Не проваливает ли бэкенд периодически health check и не выводится ли
    ненадолго из ротации, роняя запросы в полёте.
  dropping in-flight requests.: null
