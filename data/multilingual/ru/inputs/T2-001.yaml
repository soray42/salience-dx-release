distractor_direction:
  label: Смена пароля Apple ID
  description: Выяснение того, объясняет ли повторная аутентификация аккаунта, синхронизация
    iCloud или фоновая активность, связанная с учётными данными, расход батареи.
plausible_alternative_directions:
- label: Износ аккумулятора
  description: Аккумулятор телефона деградировал и теперь быстро разряжается при обычном
    использовании.
- label: Фоновая индексация iOS
  description: Операционная система выполняет временную фоновую индексацию или синхронизацию,
    не связанную с конкретным приложением.
- label: Слабый сотовый сигнал
  description: Плохой приём увеличивает потребление радиомодуля и вызывает нагрев.
