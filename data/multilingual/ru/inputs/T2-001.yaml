variants:
  HL:
    distractor: Всё началось именно утром после того, как я сменил пароль Apple ID,
      — ровно с первого полного цикла зарядки после изменения.
    diagnosticity: low
    salience: high
    proposition: The battery drain began shortly after an Apple ID password change.
    salience_source: exact temporal sequence with security-related account event
    why_plausible: Account changes can trigger sync behaviour, so the timing feels
      causal.
    why_irrelevant: A password change does not explain one specific third-party app
      dominating background activity.
  LL:
    distractor: Проблема началась вскоре после обновления учётных данных аккаунта.
    diagnosticity: low
    salience: low
    proposition: The battery drain began shortly after an Apple ID password change.
    matched_to: HL
  HH:
    distractor: В настройках батареи один фоторедактор занимает 64% всей фоновой активности,
      тогда как все остальные приложения — почти нулевые.
    diagnosticity: high
    salience: high
    proposition: Battery settings show one third-party photo editor accounts for most
      background activity.
    salience_source: per-app telemetry concentration
  LH:
    distractor: Пообъектная статистика расхода батареи показывает, что один сторонний
      фоторедактор отвечает за 64% фоновой активности.
    diagnosticity: high
    salience: low
    proposition: Battery settings show one third-party photo editor accounts for most
