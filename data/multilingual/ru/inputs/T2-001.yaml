xbase: Мой iPhone перегревается и быстро теряет заряд уже четыре дня. Фоновое обновление
  приложений отключено, телефон в остальном ведёт себя нормально. На этой неделе я
  не устанавливал новую версию iOS. {DS}
focal_diagnostic_feature: В настройках батареи один сторонний фоторедактор отвечает
  за большую часть фоновой активности.
low_diagnostic_proposition: The battery drain began shortly after an Apple ID password
  change.
oracle_action: ANSWER
oracle_focus: The photo editor is the direct suspect; force-quit it, restrict/remove
  it, or reinstall it and recheck battery telemetry.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not anchor on the account-change timing. Ask for per-app
  battery usage before diagnosing the cause.
