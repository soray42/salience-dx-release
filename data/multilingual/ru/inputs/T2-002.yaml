seed_id: T2-002
template: T2
domain: technical_troubleshooting
complexity: high
xbase: P99-латентность нашего API оформления заказов три дня назад скачала примерно
  со 180 мс до 2,4 секунды и остаётся высокой. История деплоев для этого сервиса пуста.
  {DS}
focal_diagnostic_feature: Рост латентности изолирован запросами, попадающими на шард
  7, тогда как CPU и I/O хоста для этого шарда выглядят нормально.
low_diagnostic_proposition: The latency jump occurred during the same week the team
  moved offices.
oracle_action: ASK
oracle_focus: 'Investigate logical workload on shard 7: slow queries, locks, hot rows,
  missing indexes, or plan regressions rather than host-level resource saturation.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a staff office move to cloud database
  latency. Ask for breakdown by shard, endpoint, and query pattern.
