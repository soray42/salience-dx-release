variants:
  HL:
    distractor: Всё началось именно на той неделе, когда мы переехали на новые места
      на 18-м этаже, — сетевые шкафы там ещё были подписаны малярной лентой.
    diagnosticity: low
    salience: high
    proposition: The latency jump occurred during the same week the team moved offices.
    salience_source: specific physical move, concrete office detail, temporal overlap
    why_plausible: A major organisational event near the onset feels causally tempting.
    why_irrelevant: Staff seating does not selectively slow one production database
      shard in a cloud environment.
  LL:
    distractor: По времени это совпало со сменой физического офиса команды.
    diagnosticity: low
    salience: low
    proposition: The latency jump occurred during the same week the team moved offices.
    matched_to: HL
  HH:
    distractor: P99 в 2,4 секунды наблюдается только у трафика, затрагивающего шард
      7; все остальные шарды держатся около базового уровня, а графики CPU и I/O шарда
      7 скучно ровные.
    diagnosticity: high
    salience: high
    proposition: The latency increase is isolated to requests hitting shard 7, while
      host CPU and IO for that shard look normal.
    salience_source: shard-level localisation with normal host metrics
  LH:
    distractor: Регрессия изолирована шардом 7; остальные шарды остаются около базового
      уровня, а метрики CPU и I/O на уровне шарда в норме.
    diagnosticity: high
    salience: low
    proposition: The latency increase is isolated to requests hitting shard 7, while
      host CPU and IO for that shard look normal.
    matched_to: HH
distractor_direction:
  label: Сетевые изменения при переезде офиса
  description: Выяснение того, является ли физический переезд команды или офисная
    сетевая среда причиной повышенной латентности API оформления заказов.
plausible_alternative_directions:
- label: Замедление downstream-сервиса
  description: Зависимость — платёжная система, инвентаризация или антифрод — работает
    медленно, и это проявляется только в p99-латентности оформления заказов.
- label: Исчерпание пула соединений
  description: Экземпляры приложения исчерпывают пулы соединений с базой данных или
    сервисами под нагрузкой.
- label: Паттерн промахов кэша
  description: Инвалидация кэша или изменение распределения ключей вызывает повторное
    выполнение дорогостоящих запросов к бэкенду.
