seed_id: T2-006
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Мой Python-скрипт, который собирал страницы с публичного сайта, два дня назад
  начал получать 403 Forbidden. До этого он работал ежедневно шесть месяцев. Файл
  robots.txt сайта выглядит неизменённым. {DS}
focal_diagnostic_feature: Скрипт идентифицирует себя с помощью Python user-agent,
  а условия использования сайта запрещают автоматический доступ.
low_diagnostic_proposition: The 403s began shortly after a peripheral hardware change
  on the user's desk.
oracle_action: ANSWER
oracle_focus: Stop treating this as a bypass problem; the site is likely enforcing
  anti-automation rules. Use an official API or request permission.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a local desk hardware change to remote
  HTTP 403s. Ask for request headers, user-agent, ToS/API policy, and whether manual
  browser access differs.
cell_oracles:
  HL:
    action: ASK
    focus: Do not connect a local desk hardware change to remote HTTP 403s. Ask for
      request headers, user-agent, ToS/API policy, and whether manual browser access
      differs.
  LL:
    action: ASK
    focus: Do not connect a local desk hardware change to remote HTTP 403s. Ask for
      request headers, user-agent, ToS/API policy, and whether manual browser access
      differs.
  HH:
    action: ANSWER
    focus: Stop treating this as a bypass problem; the site is likely enforcing anti-automation
      rules. Use an official API or request permission.
  LH:
    action: ANSWER
    focus: Stop treating this as a bypass problem; the site is likely enforcing anti-automation
      rules. Use an official API or request permission.
variants:
  HL:
    distractor: Сбои начались утром после того, как я заменил старый монитор на 27-дюймовый
      дисплей и заново проложил все кабели под столом.
    diagnosticity: low
    salience: high
    proposition: The 403s began shortly after a peripheral hardware change on the
      user's desk.
    salience_source: exact temporal order, concrete hardware change
    why_plausible: Users often associate any recent setup change with a new failure.
    why_irrelevant: A monitor change cannot cause a remote server to send policy-based
      403 responses to an automated user-agent.
  LL:
    distractor: Проблема началась примерно в период смены периферийного оборудования
      на рабочей станции.
    diagnosticity: low
    salience: low
    proposition: The 403s began shortly after a peripheral hardware change on the
      user's desk.
    matched_to: HL
  HH:
    distractor: 'В заголовках запросов буквально написано `User-Agent: Python-urllib`,
      а в условиях использования сайта прямо сказано, что автоматический сбор данных
      запрещён.'
    diagnosticity: high
    salience: high
    proposition: The script identifies itself with a Python user-agent and the site's
      terms prohibit automated access.
    salience_source: request-header and policy evidence
  LH:
    distractor: Скрипт объявляет Python user-agent, а условия использования целевого
      сайта запрещают автоматический доступ.
    diagnosticity: high
    salience: low
    proposition: The script identifies itself with a Python user-agent and the site's
      terms prohibit automated access.
    matched_to: HH
distractor_direction:
  label: Смена периферийного оборудования рабочей станции
  description: Выяснение того, как локальная смена периферийного оборудования или
    оборудования рабочего стола могла повлиять на скрипт сбора данных.
plausible_alternative_directions:
- label: Блокировка по репутации IP
  description: Сайт блокирует запросы из диапазона IP пользователя из-за репутации
    или объёма запросов.
- label: Изменение требований аутентификации
  description: Сайт теперь требует авторизацию, куки или токены для страниц, ранее
    бывших публичными.
- label: Применение ограничений скорости запросов
  description: Публичный сайт начал применять более строгие ограничения запросов для
    одного клиента.
