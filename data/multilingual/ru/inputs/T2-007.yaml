low_diagnostic_proposition: The question arose during news coverage about possible
  retirement-account legislation.
oracle_action: ANSWER
oracle_focus: A full conversion this year is unfavourable in the simple bracket comparison;
  consider waiting for lower-income years or modelling a ladder.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let speculative news set the answer. Ask for current
  and expected future tax brackets before judging the conversion.
