distractor_direction:
  label: Обеспокоенность законодательными изменениями
  description: Исследование того, должны ли возможные изменения в законодательстве
    о пенсионных счетах определять сроки конвертации в Roth.
plausible_alternative_directions:
- label: Влияние на ликвидность портфеля
  description: Создаёт ли использование налогооблагаемых средств для уплаты налога
    с конвертации проблемы с ликвидностью или распределением инвестиций.
- label: Сроки поэтапной конвертации
  description: Даст ли распределение конвертации на годы с более низким доходом лучший
    налоговый результат.
- label: Цель налогового планирования имущества
  description: Делает ли налоговый режим наследников или цели наследования конвертацию
    привлекательной вопреки разнице в налоговых ставках.
