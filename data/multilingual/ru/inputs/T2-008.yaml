variants:
  HL:
    distractor: Это началось сразу после того, как мы получили счёт за электроэнергию
      на 40% выше, чем в прошлом месяце, — с красным предупреждением в рамке.
    diagnosticity: low
    salience: high
    proposition: The issue began around the time of a higher utility bill.
    salience_source: specific percentage, bill warning visual, temporal overlap
    why_plausible: A big bill makes appliance malfunction feel energy-related.
    why_irrelevant: The bill does not identify which machine component is failing;
      the altered spin behaviour directly does.
  LL:
    distractor: Проблема возникла примерно в то время, когда заметно вырос счёт за
      коммунальные услуги.
    diagnosticity: low
    salience: low
    proposition: The issue began around the time of a higher utility bill.
    matched_to: HL
  HH:
    distractor: Цикл отжима теперь работает тише, медленнее и заканчивается раньше;
      бельё выходит настолько тяжёлым, что капает на пол.
    diagnosticity: high
    salience: high
    proposition: The spin step now sounds slower, lower-pitched, and shorter than
      it used to.
    salience_source: changed mechanical sound during spin
  LH:
    distractor: Цикл отжима явно стал медленнее и короче, чем раньше, а бельё задерживает
      значительное количество воды.
    diagnosticity: high
    salience: low
    proposition: The spin step now sounds slower, lower-pitched, and shorter than
      it used to.
    matched_to: HH
distractor_direction:
  label: Аномалия в счёте за коммунальные услуги
  description: Исследование того, объясняют ли более широкие изменения в потреблении
    электроэнергии или воды проблему со стиральной машиной.
plausible_alternative_directions:
- label: Засор сливного насоса
  description: Вода остаётся из-за частичной блокировки сливного насоса, шланга или
    фильтра.
- label: Дисбаланс загрузки
  description: Машина прерывает отжим из-за неравномерного распределения белья.
- label: Ошибка в настройке программы
  description: Выбранный режим или параметр отжима препятствует нормальному проведению
    цикла отжима.
