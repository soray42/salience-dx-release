distractor_direction:
  label: реорганизация офисного пространства
  description: Физическая перестановка офисных столов предлагается в качестве причины
    сбоев доставки webhook на основании временного совпадения. Облачный эндпоинт архитектурно
    изолирован от офисной инфраструктуры, поэтому данное направление не имеет причинно-следственного
    пути.
plausible_alternative_directions:
- label: частичный сбой облачной платформы
  description: Незаметный или региональный инцидент на облачной платформе, не отражённый
    на странице статуса, мог бы вызывать периодические ответы 5xx, которые SaaS-провайдер
    фиксирует как ошибки доставки.
- label: ограничение частоты запросов SaaS-провайдером
  description: SaaS-провайдер мог начать ограничивать доставки на этот эндпоинт из-за
    увеличения объёма событий или изменения политики, вызывая периодические сбои на
    стороне провайдера.
- label: истечение срока действия TLS-сертификата
  description: TLS-сертификат облачного эндпоинта мог истечь или войти в период обновления,
    вызывая ошибки рукопожатия при некоторых попытках доставки.
