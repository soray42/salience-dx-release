domain: technical_troubleshooting
complexity: medium
xbase: 'Мы используем SaaS CRM для отправки событий заказов на webhook-эндпоинт нашей
  команды, развёрнутый на крупной облачной платформе — не в нашей офисной сети. Около
  недели назад доставки стали периодически прерываться: примерно половина успешна,
  остальные завершаются ошибкой. Страница статуса облачной платформы не показывает
  инцидентов, и эндпоинт недавно не переразворачивался. {DS}'
focal_diagnostic_feature: Dashboard доставки webhook у SaaS-провайдера показывает
  HTTP 401 при каждой неудачной доставке, а в журнале событий dashboard видно, что
  секрет подписи webhook был ротирован три дня назад без соответствующего обновления
  кода проверки подписи на стороне эндпоинта.
low_diagnostic_proposition: 'The webhook delivery failures began right after the office
  desks were rearranged.

  '
oracle_action: ANSWER
oracle_focus: 'The HTTP 401 responses confirm a webhook authentication failure. The
  signing secret was rotated in the SaaS provider''s dashboard but the receiving application
  was not updated to use the new secret for signature verification; correcting the
  secret in the application config will resolve the failures.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Request the webhook delivery logs and HTTP response
  codes from the SaaS provider dashboard to identify the failure mode; do not attribute
  the failures to the office desk rearrangement, as a cloud-hosted endpoint is entirely
  outside the office physical environment and the rearrangement has no pathway to
  affect it.

  '
