xbase: Мой ридер перестал держать заряд три недели и теперь разряжается за два дня,
  хотя я не изменил привычек — те же режим чтения, та же яркость экрана. Примерно
  в то же время я купил новую прикроватную лампу, но ридер никак к ней не подключён
  и не питается от неё. Насколько я помню, я не устанавливал новых приложений и не
  менял никаких настроек. {DS}
