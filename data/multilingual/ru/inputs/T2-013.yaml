seed_id: T2-013
template: T2
domain: technical_troubleshooting
complexity: high
xbase: На прошлой неделе наш CI-конвейер начал получать ошибки HTTP 503 «SlowDown»
  при каждой загрузке артефактов в облачный объектный хранилище. Название бакета и
  IAM-учётные данные не изменились, то есть никаких изменений на уровне аккаунта не
  происходило. Троттлинг впервые появился в тот самый день, когда компания публично
  объявила о ребрендинге — новое название, новый логотип — и с тех пор не прекращается.
  {DS}
focal_diagnostic_feature: Две недели назад конвейер был рефакторинг-переработан для
  распределения по 32 параллельным тестовым шардам, что кратно увеличило количество
  одновременных PUT-запросов на один префикс — до уровня, превышающего стандартный
  лимит частоты запросов на префикс в аккаунте облачного хранилища.
low_diagnostic_proposition: 'The upload throttling began because of the company''s
  rebrand announcement.

  '
oracle_action: ANSWER
oracle_focus: 'Investigate the per-prefix PUT request rate introduced by the 32-shard
  parallelism refactor; add request-rate-aware retry/backoff, spread uploads across
  multiple prefixes, or request a quota increase from the cloud provider.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Ask for evidence of what changed in the CI pipeline
  or cloud account around the time throttling began; note that a rebrand announcement
  (new name/logo) with unchanged bucket names and credentials has no infrastructure
  pathway to cause storage throttling, so the timing is coincidental.

  '
