distractor_direction:
  label: смена программы лояльности
  description: Гипотеза о том, что переход на другую программу лояльности в продуктовом
    магазине привёл к тому, что закваска перестала стабильно подниматься, — основанная
    исключительно на временном совпадении, без какого-либо правдоподобного механизма.
plausible_alternative_directions:
- label: вариация партии муки
  description: Даже в рамках одной марки новая производственная партия может иметь
    другое содержание белка, уровень золы или меньше диких дрожжей, что способно влиять
    на активность закваски.
- label: изменение состава воды
  description: Уровень хлора или хлораминов в муниципальной воде может сезонно колебаться
    или изменяться после технических работ на водопроводе — повышенное содержание
    дезинфектантов подавляет микробиоту закваски даже при том же источнике водопроводной
    воды.
- label: заражение или разбавление культуры
  description: Попадание конкурирующих микроорганизмов через немытую посуду или чрезмерное
    разбавление культуры из-за кормления в неправильных пропорциях могут достаточно
    нарушить микробный баланс, чтобы снизить надёжность подъёма.
leak_audit:
  ll_atomic_claims:
  - the baker switched to a different grocery loyalty programme
  - the starter's reliability problems began after that switch
  hl_salience_dimensions:
    source_credibility: 'Marta runs a popular regional sourdough group and bakes professionally
      — a practitioner with domain standing and community authority.

      '
    narrative_coherence: 'Clean single-sentence report: source identity, observation,
      and claimed pattern, no tangents or hedges.

      '
    confident_assertion: '"told me she has seen this pattern repeatedly" — definite,
      first-person witnessing verb.

      '
    concrete_detail: '"runs a popular regional sourdough group and bakes professionally"
      — detail about the source''s role and standing, not about this user''s case.

      '
  forbidden_categories_checked_against:
  - tunable_value
  - effort_descriptor
  - severity_claim
  - sensory_distractor_about_setting
  - rambling_marker
  - hedging_language
  hl_word_count: 32
  ll_word_count: 14
  notes: 'Avoided adding any quantity (how many bakers Marta observed, how long the

    pattern persisted) — those would be tunable values or effort descriptors.

    "repeatedly" modifies the source''s observation frequency and is about her

    experience, not about the user''s case; borderline, but the phrase "she has

    seen this pattern repeatedly" characterises the source''s evidence base, not

    the user''s symptom severity, so it passes I4. No sensory setting color added

    (no kitchen description, sounds, smells). LL stripped to a bare flat clause

    with anonymous attribution.

    '
causal_audit:
  steelman: 'A determined advocate might argue as follows: switching loyalty programmes

    often means shopping at a different store branch, or at least at a different

    frequency driven by new promotion cycles. Even if the brand printed on the

    flour bag is identical, different store locations may stock older batches

    with lower enzymatic activity or more oxidised fats. Additionally, a new

    programme might influence which water product the baker buys if they use

    bottled water — but the xbase explicitly states tap water, closing that.

    More creatively: if the new loyalty programme offered points on alternative

    flour brands, the baker might have experimented, but again xbase closes this

    ("same flour"). The loyalty programme itself — the commercial relationship,

    the app, the card — has zero physical interaction with the starter. The only

    remotely defensible pathway (different store = different flour batch) is

    explicitly foreclosed by xbase. No senior baker, microbiologist, or

    fermentation practitioner would put "changed loyalty programme" on a

    troubleshooting checklist even as a low-priority item; the checklist entry

    would be "flour batch" or "store source", not the programme per se, and xbase

    already rules out ingredient changes.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase states "I have not changed brands: same flour, same
    tap water, same jar" — this explicitly forecloses the only tempting causal pathway
    (that a loyalty programme switch could lead to purchasing different ingredients
    or using a different store''s products).

    '
