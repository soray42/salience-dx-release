domain: open_qa
complexity: medium
xbase: Наш ежемесячный книжный клуб работает уже два года. За последние три месяца
  посещаемость упала примерно с двенадцати человек до пяти-шести, и несколько постоянных
  участников тихо перестали отвечать в общем чате. Снижение началось примерно в тот
  же месяц, когда я перешёл с бумажных книг на электронную читалку. {DS}
focal_diagnostic_feature: Книжный клуб переехал из центрально расположенной библиотеки
  (10 минут ходьбы от метро) в квартиру на окраине города, что сделало место встреч
  недоступным для большинства участников, зависящих от общественного транспорта.
low_diagnostic_proposition: 'When an organiser switches to an e-reader, members who
  prefer physical books tend to drift away.

  '
oracle_action: ANSWER
oracle_focus: 'Advise investigating the venue change as the primary driver of the
  attendance drop; the move from a transit-accessible central library to a peripheral
  flat created a structural access barrier for most members.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Decline to adopt the e-reader-culture hypothesis as
  an explanation; instead ask whether anything else changed around the same time (venue,
  schedule, format) before drawing any conclusion.

  '
