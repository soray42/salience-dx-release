xbase: Я фрилансер, и мои счета основному клиенту раньше оплачивались примерно за
  15 дней. Последние два месяца деньги приходят около 45-го дня. По времени это совпало
  с тем, когда я обновил шаблон счёта — я изменил шрифты, цветовую схему и логотип,
  но строка с условиями оплаты по-прежнему гласит «оплата в течение 15 дней», и все
  те же поля находятся на тех же позициях. {DS}
focal_diagnostic_feature: Редизайн шаблона подтверждён как сугубо косметический (никаких
  изменений полей или содержания), а клиент примерно в то же время реструктурировал
  цепочку согласования в службе кредиторской задолженности — это и является решающим
  причинным фактором; визуальный редизайн структурно не имеет значения.
low_diagnostic_proposition: 'Clients can slow down payments when an invoice design
  looks unfamiliar.

  '
oracle_action: ASK
oracle_focus: 'Ask the client what changed on their side around two months ago — new
  payment approver, changed approval cycle, cash flow constraints, or invoice routing
  change — since the template change was purely cosmetic and the AP approval chain
  restructuring is the decisive client-side factor.

  '
low_diagnostic_oracle_action: ASK
