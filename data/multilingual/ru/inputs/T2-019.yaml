seed_id: T2-019
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Графики на нашем внутреннем аналитическом дашборде отображаются пустыми у части
  команды, тогда как другие видят их без проблем. Страница загружается, API данных
  возвращает 200 с корректным JSON, серверных ошибок нет. Те, у кого пустые графики,
  клянутся, что ничего не меняли, а принудительное обновление страницы не помогает.
  В этом квартале мы не меняли библиотеку для построения графиков. {DS}
focal_diagnostic_feature: У затронутых пользователей консоль браузера показывает,
  что запрос к бандлу графиков заблокирован клиентским фильтром, а сам бандл раздаётся
  с пути, содержащего слово «analytics», которое совпадает с шаблонами списков блокировщиков
  рекламы.
low_diagnostic_proposition: The blank charts started appearing right after the team
  was moved to a new floor with new monitors.
oracle_action: ANSWER
oracle_focus: Rename or reverse-proxy the charting bundle off the "analytics"-matching
  path (or whitelist it); ad-block/content filters are blocking that script for the
  affected browsers, which is why the API succeeds but charts stay blank.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a floor move or new monitors to blank
  charts. Ask what the affected users' browser console shows and whether any script
  request is blocked.
