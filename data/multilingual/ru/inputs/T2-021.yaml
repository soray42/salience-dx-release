seed_id: T2-021
template: T2
domain: technical_troubleshooting
complexity: low
xbase: На моём ноутбуке некоторые клавиши начали вводить не те символы. При нажатии
  клавиши двойной кавычки появляется символ @, клавиша @ выдаёт двойную кавычку, а
  символы фунта стерлингов и решётки тоже поменялись местами. Буквы и цифры в порядке.
  Поведение одинаковое во всех приложениях, физически клавиатура выглядит неповреждённой.
  {DS}
focal_diagnostic_feature: Переставшиеся символы — это в точности различия между раскладками
  клавиатуры UK и US, а индикатор языка ввода в ОС теперь показывает US English вместо
  прежней раскладки UK.
low_diagnostic_proposition: The wrong characters started appearing right after the
  keyboard was cleaned with a disinfectant wipe.
oracle_action: ANSWER
oracle_focus: Switch the OS keyboard layout back to UK English; the specific quote/at
  and hash/pound swaps are the signature of a US-vs-UK layout mismatch, not a hardware
  fault.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect wiping the keyboard to character mapping.
  Ask which exact characters are swapped and what the OS keyboard-layout setting is
  now set to.
