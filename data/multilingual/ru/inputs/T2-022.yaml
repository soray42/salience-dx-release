xbase: За последние несколько недель расход топлива у моего автомобиля заметно вырос,
  и я начинаю думать об обмене на что-то новее. При том же маршруте заправляюсь гораздо
  чаще, чем раньше. Двигатель работает ровно, предупреждающих огней нет, маршрут и
  пробег не изменились. Машина просто пьёт топливо. {DS}
