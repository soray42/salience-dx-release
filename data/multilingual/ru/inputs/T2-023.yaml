seed_id: T2-023
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Наш REST API два дня назад начал возвращать ошибки 504 Gateway Timeout на одном
  конкретном эндпоинте. Этот эндпоинт обрабатывает запросы профилей пользователей,
  все остальные маршруты отвечают нормально в пределах миллисекунд. На этой неделе
  мы не деплоили никаких изменений в коде приложения, а паттерны трафика идентичны
  прошлой неделе. {DS}
focal_diagnostic_feature: Прямой запрос к апстрим-сервису в обход балансировщика нагрузки
  занимает 97 секунд; upstream_read_timeout балансировщика настроен на 60 секунд,
  поэтому прокси прекращает ожидание и возвращает 504 до того, как ответ приходит.
low_diagnostic_proposition: The 504 errors began around the time a new appliance was
  installed in the office break room.
oracle_action: ASK
oracle_focus: Investigate why the user-profile-lookup upstream takes over 90 seconds;
  check for a query plan regression, missing index, or lock contention on that endpoint's
  database path, then tune or raise the upstream timeout appropriately.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a break-room appliance installation to
  cloud API latency. Ask for direct upstream response times and load balancer timeout
  configuration.
