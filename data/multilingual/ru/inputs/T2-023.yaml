    theoretically

    cause voltage sag or EMI affecting local network hardware, which could in turn

    introduce latency or packet loss on the office network path to the upstream. However,

    the upstream service is cloud-hosted and the load balancer is also external; the

    office network is not in the call path for a cloud-to-cloud proxy request. Furthermore,

    the symptom is not intermittent packet loss but a consistent 97-second response
    time

    on the upstream, which is a server-side latency regression, not a network path
    issue.

    '
