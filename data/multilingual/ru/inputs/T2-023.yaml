distractor_direction:
  label: Совпадение с установкой прибора в комнате отдыха
  description: Считать установку нового офисного прибора возможной причиной или подсказкой
    для ошибок 504 API — исключительно на основании временно́го совпадения.
plausible_alternative_directions:
- label: Деградация апстрим-сервиса
  description: Апстрим-сервис поиска профилей самостоятельно деградировал из-за конкуренции
    в базе данных, медленного плана запроса или узкого места в зависимостях, не связанного
    с таймаутом прокси.
- label: Некорректная конфигурация балансировщика нагрузки
  description: Недавнее изменение настроек балансировщика — значений таймаута, порогов
    healthcheck или правил маршрутизации — приводит к преждевременному прерыванию
    апстрим-соединений.
- label: Блокировка зависимости на нижнем уровне
  description: Эндпоинт стал зависеть от медленного или заблокированного внешнего
    сервиса, например реплики для чтения или стороннего вызова, который недавно деградировал.
