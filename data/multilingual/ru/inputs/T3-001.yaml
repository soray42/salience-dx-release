    distractor: Мой научный руководитель мельком взглянул на время выполнения и уверенно
      заявил, что это всегда проблема с неправильной версией CUDA-драйвера.
    diagnosticity: low
    salience: high
    proposition: A senior lab member states that the CUDA driver version is the main
