  HH:
    distractor: Утилизация GPU постоянно скачет между 5% и 30%, а профилировщик показывает,
      что задача ожидает в загрузчике данных, пока данные лежат на сетевом SSD.
    diagnosticity: high
    salience: high
    proposition: Profiling shows low GPU utilisation with most time spent in the dataloader,
