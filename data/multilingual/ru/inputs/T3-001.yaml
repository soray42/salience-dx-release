distractor_direction:
  label: Несовместимость версии CUDA-драйвера
  description: Расследование того, является ли установленная версия CUDA-драйвера
    неправильной или несовместимой, вызывая замедление обучения.
plausible_alternative_directions:
- label: Отключена смешанная точность
  description: Задача обучается в полной точности, тогда как в сравниваемом запуске
    используется смешанная точность.
- label: Несоответствие размера батча
  description: Локальный запуск использует другой эффективный размер батча или настройку
    накопления градиентов.
- label: Узкое место при препроцессинге на CPU
  description: Декодирование или предобработка данных перегружены до того, как тензоры
    поступают на GPU.
