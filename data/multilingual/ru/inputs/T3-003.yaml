    why_irrelevant: The keyspace breakdown gives a concrete unbounded object source
      that explains the shard imbalance.
  LL:
    distractor: Старший инженер утверждал, что фрагментацию памяти Redis следует считать
      основной причиной.
    diagnosticity: low
    salience: low
