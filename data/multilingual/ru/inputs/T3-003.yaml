      as the main cause.
    matched_to: HL
  HH:
    distractor: Один ключевой префикс на узле 2 занимает 38% памяти этого узла, причём
      у этих ключей нет TTL и они никогда не ротируются.
    diagnosticity: high
    salience: high
    proposition: Hot-key analysis shows one key prefix on node 2 accounts for a large
      share of memory and has no TTL or rotation.
    salience_source: prefix-level memory attribution
  LH:
    distractor: Один непросроченный ключевой префикс занимает около 38% памяти на
