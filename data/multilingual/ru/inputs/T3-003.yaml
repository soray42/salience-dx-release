variants:
  HL:
    distractor: Старший архитектор из соседней команды заявил на стендапе, что Redis
      на Linux в продакшене всегда утекает памятью и нам следует сменить хранилище.
    diagnosticity: low
    salience: high
    proposition: A senior engineer says Redis memory fragmentation should be treated
      as the main cause.
    salience_source: senior title, public standup claim, absolute technical statement
    why_plausible: Redis fragmentation is a real phenomenon and the speaker sounds
