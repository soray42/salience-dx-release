seed_id: T3-007
template: T3
domain: technical_troubleshooting
complexity: high
xbase: Наш сервис аутентификации иногда выдаёт JWT, в которых поле `exp` уже просрочено
  на момент выдачи. Это происходит менее чем в 1% токенов. Сервис работает на трёх
  репликах за балансировщиком нагрузки. {DS}
focal_diagnostic_feature: Все проблемные токены поступают с реплики 2, системные часы
  которой отстают от реального времени ровно на 24 часа.
low_diagnostic_proposition: A principal security engineer says the token library should
  be treated as the main cause and replaced.
oracle_action: ANSWER
oracle_focus: Fix time synchronisation on replica 2, recycle it, and add clock-skew
  monitoring across replicas.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not jump to library migration from authority alone.
  Ask for per-replica token attribution and node time checks.
