distractor_direction:
  label: Дефект библиотеки токенов
  description: Расследование того, является ли библиотека JWT/токенов неисправной
    или небезопасной и подлежит ли замене.
plausible_alternative_directions:
- label: Проблема маршрутизации балансировщика нагрузки
  description: Часть запросов может направляться на неправильно настроенный или устаревший
    экземпляр сервиса.
- label: Ошибка ротации ключей подписи
  description: Ротация ключей или кэшированное состояние ключей может приводить к
    непоследовательной валидации или генерации токенов.
- label: Ошибка преобразования часового пояса
  description: Код приложения может некорректно обрабатывать преобразование UTC/локального
    времени при установке значений срока действия.
