distractor_direction:
  label: Ценность диплома MBA
  description: Приоритизация MBA как главной карьерной инвестиции на основании того,
    что топ-менеджер считает диплом универсально ценным.
plausible_alternative_directions:
- label: Спонсирование работодателем
  description: Готов ли работодатель оплатить часть обучения или предоставить гибкий
    график.
- label: Цель перехода в менеджмент
  description: Есть ли у пользователя конкретный план перехода в менеджмент, консалтинг
    или другую сферу, связанную с MBA.
- label: Альтернативные издержки
  description: Вечерняя учёба, усталость и упущенные альтернативы могут перевешивать
    ценность диплома.
