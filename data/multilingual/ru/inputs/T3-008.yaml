domain: open_qa
complexity: high
xbase: Я думаю о заочной вечерней программе MBA в региональной бизнес-школе. Для меня
  это большие деньги, а сейчас я стабильно работаю инженером в середине карьеры. Прямо
  сейчас я не стремлюсь перейти в менеджмент или консалтинг. {DS}
focal_diagnostic_feature: Результаты программы связаны преимущественно с переходом
  в менеджмент/консалтинг, тогда как её оплата опустошит резервный фонд и добавит
  €20 тыс. долга.
low_diagnostic_proposition: A senior executive says an MBA should be treated as the
  main career investment for any professional.
oracle_action: ANSWER
oracle_focus: Do not enrol on the current facts; cost and outcome mismatch are too
  large without a clear target use-case.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept a generic VP endorsement. Ask for target
  career outcome, programme placement data, and financing impact.
