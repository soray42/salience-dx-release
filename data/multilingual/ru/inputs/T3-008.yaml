variants:
  HL:
    distractor: Вице-президент нашей компании сказал мне за ужином, что MBA — это
      единственная важнейшая карьерная инвестиция, которую может сделать любой профессионал.
    diagnosticity: low
    salience: high
    proposition: A senior executive says an MBA should be treated as the main career
      investment for any professional.
    salience_source: authority title, social setting, universal career claim
    why_plausible: A VP's career advice sounds like insider knowledge.
    why_irrelevant: The advice is generic and does not address the user's goals or
      financing burden.
  LL:
    distractor: Один из топ-менеджеров заявил, что MBA следует считать главной карьерной
      инвестицией для специалистов.
    diagnosticity: low
    salience: low
    proposition: A senior executive says an MBA should be treated as the main career
      investment for any professional.
    matched_to: HL
  HH:
    distractor: Большинство успехов этой программы — это переходы в менеджмент или
      консалтинг, чего я не хочу, а оплата потребует опустошить резервный фонд и взять
      кредит на €20 тыс.
    diagnosticity: high
    salience: high
    proposition: The programme's outcomes are mainly management/consulting transitions,
      while paying for it would drain the emergency fund and add €20k in loans.
    salience_source: goal/outcome/financing mismatch
  LH:
    distractor: Данные о результатах программы ориентированы на направления, которые
