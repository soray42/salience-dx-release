distractor_direction:
  label: Слабый сигнал диапазона 5 ГГц
  description: Расследование того, не вызывают ли диапазон 5 ГГц роутера или поведение
    радиомодуля повторные разрывы Wi-Fi.
plausible_alternative_directions:
- label: Проблема прошивки роутера
  description: Прошивка роутера или настройки точки доступа могут содержать ошибку,
    влияющую на некоторых клиентов.
- label: Локальные помехи беспроводной связи
  description: Соседние устройства или сети могут создавать помехи для подключения
    ноутбука.
- label: Настройка энергосбережения
  description: Управление питанием Wi-Fi на ноутбуке может переводить адаптер в режим
    ожидания или снижать его производительность.
