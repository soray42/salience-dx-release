distractor_direction:
  label: Отсутствие privacy manifest
  description: Отказы App Store вызваны отсутствующим или неполным файлом privacy
    manifest (PrivacyInfo.xcprivacy), который Apple требует с 2024 года и который
    является задокументированной причиной отказов при проверке.
plausible_alternative_directions:
- label: Несоответствие метаданных или скриншотов
  description: Отказы обусловлены нарушениями метаданных App Store Connect, например
    скриншотами с функциями, отсутствующими в поданной сборке (Guideline 2.3), что
    является отдельной и распространённой причиной отказа.
- label: Отсутствие объявления capability
  description: Необходимый entitlement или capability (например, push-уведомления,
    доступ к iCloud) присутствует в бинарнике, но не объявлен в App Store Connect,
    что вызывает нарушение политики, не связанное с крэшем.
- label: Нарушение политики сторонним SDK
  description: Встроенный сторонний SDK нарушает текущую политику App Store (например,
    fingerprinting API, устаревшие приватные фреймворки), что приводит к отказу независимо
    от собственного кода приложения или крэша.
