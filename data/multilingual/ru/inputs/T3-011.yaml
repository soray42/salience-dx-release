template: T3
domain: technical_troubleshooting
complexity: medium
xbase: Моё iOS-приложение дважды не прошло проверку App Store, и после каждой подачи
  я получал официальное письмо об отказе от Apple. Письма подробные и конкретные;
  я поделился ими в нашем командном Slack, чтобы команда могла прочитать их перед
  тем, как мы решим, что делать дальше. Кваме, наш старший архитектор, ответил в течение
  нескольких минут, не попросив посмотреть письма. {DS}
focal_diagnostic_feature: Оба письма об отказе явно ссылаются на Guideline 4.0 Design
  с воспроизводимым крэшем при повороте iPad в альбомный режим, задокументированным
  с идентичными шагами в обеих подачах — ошибка обработки ориентации во время выполнения,
  принципиально отличающаяся от соответствия требованиям privacy manifest.
low_diagnostic_proposition: 'The App Store rejections are due to a missing or incomplete
  privacy manifest file.

  '
oracle_action: ANSWER
oracle_focus: 'Identify and fix the iPad landscape-rotation crash in the main navigation
  stack; the Guideline 4.0 Design citation and identical reproduction steps in both
  letters make this the confirmed root cause.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Do not accept the privacy manifest claim without examining
  the actual rejection emails; ask to see the full rejection notes and guideline citations
