xbase: Наш основной сервер Postgres 15 шесть месяцев без инцидентов передаёт данные
  на один горячий резервный сервер. В течение последних трёх недель pg_stat_replication
  показывает, что replay_lag каждую ночь в 02:15 вырастает до 8–12 минут и к 02:30
  возвращается в норму. Я проверил pg_stat_progress_vacuum — во время ни одного из
  пиков не было активных воркеров autovacuum. Я выгрузил полное расписание процессов
  для этого окна. {DS}
focal_diagnostic_feature: pg_stat_activity в 02:15 показывает регулярный ETL-процесс
  с пакетными INSERT, а временная шкала write_lag в pg_stat_replication в точности
  совпадает со скоростью генерации WAL этой пакетной загрузки.
low_diagnostic_proposition: 'PgBouncer connection pool configuration is causing the
  scheduled replication lag.

  '
oracle_action: ANSWER
oracle_focus: 'Investigate the nightly bulk-INSERT ETL job starting at 02:15; its
  WAL generation volume is directly correlated with the replication lag window and
  is the root cause. PgBouncer operates entirely outside the streaming replication
  path and cannot be causal.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Ask for evidence from pg_stat_activity, pg_stat_replication,
  and the process schedule at 02:15 to identify what is generating WAL during the
  spike window; note that PgBouncer manages client connections and has no pathway
  to influence WAL sender throughput or standby apply rate.

  '
