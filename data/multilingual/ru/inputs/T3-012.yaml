distractor_direction:
  label: Пул соединений PgBouncer
  description: Гипотеза о том, что конфигурация пула соединений PgBouncer является
    причиной ночных пиков отставания репликации. PgBouncer работает на уровне соединений
    клиент–primary и не имеет механизма влияния на пропускную способность потоковой
    репликации.
plausible_alternative_directions:
- label: Давление записи при checkpoint
  description: Тяжёлый checkpoint в 02:15, вызванный накопленными грязными страницами
    от более ранней активности записи, создаёт насыщение I/O на primary, замедляя
    сброс WAL на диск и тем самым задерживая доставку на резервный сервер.
- label: Конфликт запросов на горячем резервном сервере
  description: Долгие read-запросы на горячем резервном сервере конфликтуют с применением
    WAL в 02:15, заставляя резервный сервер приостанавливать применение (max_standby_streaming_delay),
    что фиксируется как replay_lag даже при нормальной работе primary.
- label: Узкое место WAL-архивирования
  description: archive_command работает медленно или блокируется в 02:15 — например,
    из-за медленного NFS-монтирования или конкурирующего задания резервного копирования,
    — что приводит к накоплению сегментов WAL на primary перед их доставкой на резервный
    сервер.
