causal_audit:
  steelman: 'First distractor attempt was autovacuum (per the topic brief framing).
    Steelman:

    autovacuum on large tables generates significant WAL (visibility map updates,
    dead tuple

    removal, FSM updates). If a high-churn table accumulates dead tuples on a daily
    cycle,

    autovacuum will trigger at approximately the same clock time each night after
    the workload

    quiets. The resulting WAL stream to the standby can cause replay_lag spikes. A
    senior DBA

    would absolutely put autovacuum on the replication lag checklist. Verdict: defensible

    mechanism found — autovacuum as distractor is contaminated. Restarted.


    Second distractor: PgBouncer connection pool configuration. Steelman: PgBouncer
    in

    transaction-pooling mode causes rapid connection acquisition and release on the
    primary.

    One might hypothesise that connection churn increases lock contention or temporary
    object

    creation, which generates WAL. However, streaming replication uses a dedicated
    walsender

    process that connects via the replication protocol directly to the standby — it
    is entirely

    independent of the PgBouncer connection pool, which only handles client application

    connections. Even complete PgBouncer pool exhaustion (all slots occupied, new
    clients

    queued) has no pathway to affect walsender throughput, standby apply rate, or

    network bandwidth between primary and standby. The WAL generation rate depends
    on DML

    operations committed on the primary, none of which are mediated by PgBouncer in
    any way

    that would change their frequency or volume. No Postgres replication lag troubleshooting

    guide lists PgBouncer pool settings as a candidate. Verdict: no defensible mechanism.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase explicitly states "I checked pg_stat_progress_vacuum
    — no autovacuum workers were active during any spike window", foreclosing the
    autovacuum pathway. PgBouncer has no pathway into the replication stack to foreclose
    (it is structurally inapplicable), so no additional xbase closure is needed for
    the chosen distractor.

    '
