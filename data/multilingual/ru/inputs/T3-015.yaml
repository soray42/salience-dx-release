xbase: 'На заднем дворе у меня небольшой газон — примерно 12 квадратных метров — под
  двумя взрослыми берёзами. Нагрузка на него минимальная: я прохожу по нему изредка,
  чтобы добраться до компостной кучи. Кое-где трава выглядит пятнистой, а никакого
  ухода за почвой я не делал уже несколько лет. Я упомянул об этом председателю садоводческого
  клуба на нашем осеннем собрании. {DS}'
focal_diagnostic_feature: Тест на проникновение отвёртки не выявил уплотнения, а пятнистые
  участки прямо коррелируют с наиболее густой кроной деревьев, а не с тропинками пешеходного
  трафика, что указывает на тень и конкуренцию корней как на причину, а не на уплотнение
  почвы.
low_diagnostic_proposition: 'The lawn needs autumn core aeration.

  '
oracle_action: ANSWER
oracle_focus: 'Soil compaction is ruled out by the easy screwdriver penetration; the
  sparse patches tracking the densest shade under the birches points to shade and
  root competition as the cause. Autumn aeration is not indicated; the user should
  focus on shade management — overseeding with shade-tolerant fine fescue and optionally
  thinning the canopy — rather than aerating.

  '
low_diagnostic_oracle_action: ASK
