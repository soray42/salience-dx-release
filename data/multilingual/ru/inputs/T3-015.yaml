distractor_direction:
  label: уплотнение почвы требует аэрации
  description: Категоричный вердикт председателя подаёт осеннюю аэрацию как универсальное
    средство для любого уставшего газона, неявно приписывая прореживание уплотнению
    почвы. Это эвристика по шаблону, применённая без изучения реального состояния
    газона.
plausible_alternative_directions:
- label: дефицит питательных веществ или нарушение кислотности почвы
  description: Кислая или бедная питательными веществами почва под берёзовой кроной
    может ограничивать жизнеспособность травы, что делает подкормку или известкование
    разумным первым вмешательством, которое специалист мог бы порекомендовать.
- label: неподходящий вид травы для данных условий
  description: Существующий сорт травы может плохо подходить для затенённой, конкурентной
    по корням среды; специалист мог бы рекомендовать заменить его теневыносливым сортом,
    а не проводить какой-либо уход.
- label: разрастание мха, подавляющего траву
  description: Влажные затенённые условия под деревьями способствуют разрастанию мха;
