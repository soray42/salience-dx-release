domain: technical_troubleshooting
complexity: medium
xbase: Один GraphQL-эндпоинт в нашем API работает нестабильно — обычно быстро, но
  иногда запрос возвращается за три-четыре секунды. Он резолвит профиль пользователя
  вместе с его текущим уровнем лояльности. Медленные ответы происходят на том же самом
  запросе, который обычно выполняется быстро, а база данных, которой владеет команда,
  загружена слабо. У нас включена распределённая трассировка, и трейсы показывают,
  что каждый резолвер базы данных завершается за единицы миллисекунд, без разветвления
  запросов. {DS}
focal_diagnostic_feature: Трейсы показывают, что всё медленное время приходится на
  один исходящий вызов к REST API стороннего провайдера лояльности, который периодически
  занимает ~3 секунды; резолверы базы данных завершаются за единицы миллисекунд.
low_diagnostic_proposition: A senior engineer says intermittent GraphQL slowness is
  classically an N+1 query problem and should be addressed with batching.
oracle_action: ANSWER
oracle_focus: Address the slow third-party loyalty REST call shown in traces — add
  a timeout, cache, or circuit breaker around it; the database resolvers are fast,
  so this is not an N+1 query problem.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Reject the N+1 diagnosis: the traces already show the
  database resolvers finishing in single-digit milliseconds with no fan-out, so batching
  is misdirected. Ask what the traces attribute the remaining slow time to.'
