variants:
  HL:
    distractor: Наш фронтенд-лид бегло просмотрел репорт и сказал, что это всегда
      устаревший кеш CDN — что «работает локально, сломано в проде» является хрестоматийным
      признаком устаревшего кеша, — и велел мне очистить CDN, добавить хеш для сброса
      кеша, и всё само решится.
    diagnosticity: low
    salience: high
    proposition: A senior frontend lead says environment-specific styling breakage
      is always a stale CDN cache and is fixed by busting the cache.
    salience_source: A/C — a senior frontend lead confidently invoking a 'textbook'
      cause from the local-vs-prod symptom without inspecting the build.
    why_plausible: Stale CDN caches genuinely cause local-vs-prod discrepancies, so
      cache-busting is a common and often-correct first move.
    why_irrelevant: A stale cache would break styles uniformly or randomly; here only
      components that build class names at runtime fail, which is a build-time purge
      issue a cache flush cannot fix.
  LL:
    distractor: Старший фронтенд-лид заявил, что проблемы со стилями в конкретном
      окружении — это всегда устаревший кеш CDN, и предписал сбросить кеш.
    diagnosticity: low
    salience: low
    proposition: A senior frontend lead says environment-specific styling breakage
      is always a stale CDN cache and is fixed by busting the cache.
    matched_to: HL
  HH:
    distractor: Все компоненты, которые ломаются, собирают имена классов из JavaScript-переменных
      во время выполнения. Продакшн запускает удаление CSS, которое сохраняет только
      имена классов, явно прописанные в исходном коде, поэтому эти сформированные
      в рантайме классы так и не попадают в продакшн-стилссит — тогда как в дев все
      классы попадают без удаления.
    diagnosticity: high
    salience: high
    proposition: The broken components compose their utility class names from JavaScript
      variables at runtime, and the production CSS purge step keeps only statically
      written class names, so those dynamically built classes are absent from the
      production stylesheet.
    salience_source: Tracing the broken components to runtime-built class names and
      the purge's static-only retention makes the build-time cause concrete.
  LH:
    distractor: Сломанные компоненты формируют имена классов из JS-переменных во время
      выполнения; продакшн-шаг удаления CSS сохраняет только буквальные имена классов,
      удаляя эти классы из стилссита.
    diagnosticity: high
    salience: low
    proposition: The broken components compose their utility class names from JavaScript
      variables at runtime, and the production CSS purge step keeps only statically
      written class names, so those dynamically built classes are absent from the
      production stylesheet.
    matched_to: HH
