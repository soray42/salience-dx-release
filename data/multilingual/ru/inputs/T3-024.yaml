    matched_to: HL
  HH:
    distractor: Лимитер использует счётчик с фиксированным окном, которое сбрасывается
      ровно на границе каждой минуты, поэтому клиент, равномерно распределяющий запросы,
      чьи запросы пересекают сброс, накапливает запросы из двух окон в одном учтённом
      окне и на несколько секунд превышает лимит; скользящее окно или схема token
      bucket сгладили бы это.
    diagnosticity: high
    salience: high
    proposition: The limiter uses a fixed-window counter that resets on the minute
      boundary, so clients whose evenly-paced requests straddle a boundary briefly
      exceed the per-window count and get 429s; a sliding-window or token-bucket scheme
      would not.
    salience_source: The fixed-window reset boundary and the straddling-burst mechanism
      name the exact cause of the on-the-minute 429s.
  LH:
    distractor: Лимитер с фиксированным окном сбрасывается на границе минуты, поэтому
