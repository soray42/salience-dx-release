variants:
  HL:
    distractor: 'pgAdmin у нас выглядит ужасно: серые выцветшие панели, крошечные
      шрифты, и цветовая схема, из-за которой вывод плана кажется наполовину сломанным.'
    diagnosticity: low
    salience: high
    proposition: The database administration interface has an old visual theme that
      makes some output hard to read.
    salience_source: ugly interface, degraded readability, surface-level defect
    why_plausible: A broken-looking tool can make the tool itself seem suspect.
    why_irrelevant: Interface styling does not affect the query planner's scan choice
      or table statistics.
  LL:
    distractor: Интерфейс администрирования базы данных использует устаревшую визуальную
      тему, которую некоторые пользователи находят трудночитаемой.
    diagnosticity: low
    salience: low
    proposition: The database administration interface has an old visual theme that
      makes some output hard to read.
    matched_to: HL
  HH:
    distractor: План выполняет полное последовательное сканирование 12 миллионов строк,
      хотя индекс на столбце объединения существует, а статистика таблицы устарела
      на шесть месяцев.
    diagnosticity: high
    salience: high
    proposition: EXPLAIN ANALYZE shows a sequential scan on the 12M-row table, and
      its statistics were last analysed six months ago.
    salience_source: execution plan plus stale statistics
  LH:
    distractor: EXPLAIN ANALYZE выбирает последовательное сканирование таблицы из
      12 миллионов строк, несмотря на наличие индекса; статистика таблицы не обновлялась
      шесть месяцев.
    diagnosticity: high
    salience: low
    proposition: EXPLAIN ANALYZE shows a sequential scan on the 12M-row table, and
      its statistics were last analysed six months ago.
    matched_to: HH
distractor_direction:
  label: Читаемость интерфейса администратора
  description: Изучение того, способен ли интерфейс базы данных или читаемость отображаемых
    планов ввести диагностику в заблуждение.
plausible_alternative_directions:
- label: Отсутствующий составной индекс
  description: Возможно, в запросе отсутствует индекс, покрывающий фактический паттерн
    объединения или фильтрации.
- label: Проблема порядка объединения
  description: Планировщик может выбирать неоптимальный порядок объединения из-за
    распределения данных.
- label: Конкуренция за блокировки
  description: Запрос может ожидать снятия блокировок, а не тратить время на сканирование
    данных.
