seed_id: T5-001
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Запрос Postgres, объединяющий три таблицы, выполняется около 4 секунд и возвращает
  лишь несколько сотен строк. Самая большая таблица содержит около 12 миллионов строк,
  на столбце объединения есть индекс. {DS}
focal_diagnostic_feature: EXPLAIN ANALYZE показывает последовательное сканирование
  таблицы из 12 миллионов строк, а статистика последний раз обновлялась шесть месяцев
  назад.
low_diagnostic_proposition: The database administration interface has an old visual
  theme that makes some output hard to read.
oracle_action: ANSWER
oracle_focus: Run ANALYZE/update statistics and recheck the plan; stale stats are
  likely causing the planner to skip the index.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer query-planner behaviour from UI appearance.
  Ask for EXPLAIN ANALYZE and table statistics age.
