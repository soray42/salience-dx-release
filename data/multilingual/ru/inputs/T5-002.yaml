complexity: low
xbase: Мне предложили постоянную работу преимущественно удалённо, и я пытаюсь решить,
  принимать ли её. В офис нужно приезжать только на онбординг и редкие квартальные
  встречи. Условия контракта выглядят стандартными для моей отрасли. {DS}
focal_diagnostic_feature: Предложение на 18% превышает текущую зарплату, соответствует
  карьерному направлению пользователя и включает двух надёжных бывших коллег в команде.
low_diagnostic_proposition: The office lobby used for occasional visits is dim, dated,
  and smells musty.
oracle_action: ANSWER
oracle_focus: Accept or negotiate from strength; the disclosed compensation, fit,
