  HH:
    distractor: Зарплата на 18% выше моей текущей, роль совпадает с тем направлением,
      которое я хочу развивать, и двое людей, которым я доверяю по прошлым проектам,
      уже в команде.
    diagnosticity: high
    salience: high
    proposition: The offer is 18% above current salary, aligns with the user's career
      direction, and includes two trusted former colleagues on the team.
    salience_source: compensation/fit/team evidence
  LH:
    distractor: Предложение включает повышение зарплаты на 18%, соответствует направлению
