plausible_alternative_directions:
- label: Совместимость с руководителем
  description: Ожидания будущего руководителя и его стиль общения могут определить,
    насколько роль подходит.
- label: Риски испытательного срока
  description: Условия испытательного срока, сроки уведомления об увольнении или скрытые
    договорные условия могут ослабить предложение.
- label: Долгосрочный профессиональный рост
  description: Роль может совпадать или не совпадать с навыками, которые пользователь
    хочет развивать в рамках карьерного направления.
