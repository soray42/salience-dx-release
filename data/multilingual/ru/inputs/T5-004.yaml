variants:
  HL:
    distractor: Пакет предложения — сплошные холодные серые блоки, тонкие линии и
      строгие корпоративные фотографии; от этого весь переезд ощущается как-то мрачно.
    diagnosticity: low
    salience: high
    proposition: The offer letter and relocation brochure use a grey, austere visual
      style.
    salience_source: surface design, colour/texture details, affective framing
    why_plausible: A bleak-looking packet can colour the user's feeling about the
      move.
    why_irrelevant: Document design is not evidence about compensation, relocation
      support, partner portability, or obligations.
  LL:
    distractor: Материалы предложения и переезда оформлены в относительно аскетичном
      визуальном стиле.
    diagnosticity: low
    salience: low
    proposition: The offer letter and relocation brochure use a grey, austere visual
      style.
    matched_to: HL
  HH:
    distractor: Зарплата вырастет на 30%, переезд оплачивается, партнёр может работать
      удалённо откуда угодно, и нас здесь ничто не удерживает — ни дети, ни домашние
      животные, ни уход за кем-то.
    diagnosticity: high
    salience: high
    proposition: The offer raises salary by 30%, covers relocation, the partner's
      job is fully remote, and there are no children, pets, or caretaking obligations.
    salience_source: logistical and financial constraint removal
  LH:
    distractor: Предложение включает повышение зарплаты на 30% и оплату переезда;
      работа партнёра не привязана к месту, и нет ни иждивенцев, ни обязательств по
      уходу за кем-либо.
    diagnosticity: high
    salience: low
    proposition: The offer raises salary by 30%, covers relocation, the partner's
      job is fully remote, and there are no children, pets, or caretaking obligations.
    matched_to: HH
distractor_direction:
  label: Мрачный вид материалов о переезде
  description: Изучение того, сигнализирует ли аскетичный визуальный тон пакета предложения
    и материалов о переезде о неудачном решении.
plausible_alternative_directions:
- label: Логистика партнёра
  description: Насколько удалённая работа партнёра и его предпочтения по переезду
    делают переезд осуществимым.
- label: Издержки привязанности к нынешнему городу
  description: Переезд из нынешнего города может создать социальные или эмоциональные
    издержки, не упомянутые явно.
- label: Перспективы карьерного роста
  description: Предоставляет ли новая компания возможности для обучения, продвижения
    или профессиональной репутации сверх повышения зарплаты.
