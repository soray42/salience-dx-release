seed_id: T5-004
template: T5
domain: open_qa
complexity: medium
xbase: Я рассматриваю предложение о работе в другом городе. Компания — стабильная
  фирма среднего размера в моей отрасли. Мне нравится мой нынешний город, но фиксированных
  местных обязательств у меня нет. {DS}
focal_diagnostic_feature: Предложение повышает зарплату на 30%, покрывает расходы
  на переезд, работа партнёра полностью удалённая, и нет детей, домашних животных
  или обязательств по уходу.
low_diagnostic_proposition: The offer letter and relocation brochure use a grey, austere
  visual style.
oracle_action: ANSWER
oracle_focus: Accept absent undisclosed constraints; the upside and logistics are
  unusually favourable.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not treat document aesthetics as job or relocation
  evidence. Ask about pay, partner work, relocation cost, and local obligations.
