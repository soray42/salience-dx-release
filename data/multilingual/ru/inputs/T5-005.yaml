    усечёнными JSON-ответами и ошибками парсинга.
plausible_alternative_directions:
- label: Баг сериализации на бэкенде
  description: API-сервер может иногда сериализовать или отправлять некорректный JSON
    ещё до того, как прокси его увидит.
- label: Баг парсера мобильного клиента
  description: Мобильный клиент может некорректно обрабатывать валидные, но большие
    JSON-ответы.
- label: Потеря сетевых пакетов
  description: Нестабильное сетевое соединение может усекать ответы до того, как они
    достигают мобильного приложения.
