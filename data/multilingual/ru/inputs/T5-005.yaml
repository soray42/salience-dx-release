xbase: API-клиент нашего мобильного приложения иногда получает усечённый JSON и выбрасывает
  ошибку парсинга. Это происходит редко — примерно один запрос из нескольких сотен.
  API находится за обратным прокси nginx. {DS}
focal_diagnostic_feature: Усечение происходит около 16 300 байт, что совпадает с настройкой
  proxy_buffer_size в 16k в конфигурации nginx.
low_diagnostic_proposition: The internal API documentation site looks old and visually
  neglected.
oracle_action: ANSWER
oracle_focus: Increase/tune nginx proxy buffers for this endpoint or adjust buffering;
  the byte boundary points at proxy buffer limits.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer runtime buffering from docs aesthetics.
  Ask for truncation byte position and nginx buffer settings.
