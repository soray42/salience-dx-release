variants:
  HL:
    distractor: Логи отображаются узким шрифтом с режущими цветами; через десять минут
      они выглядят как стена из сломанного терминального конфетти.
    diagnosticity: low
    salience: high
    proposition: The visual presentation of GitHub Actions logs is unpleasant to read.
    salience_source: visual discomfort, terminal/log aesthetic
    why_plausible: Bad-looking tooling can feel like malfunctioning tooling.
    why_irrelevant: Log typography does not explain step duration; per-step timing
      and missing cache do.
  LL:
    distractor: Логи GitHub Actions имеют оформление, которое команде сложно читать.
    diagnosticity: low
    salience: low
    proposition: The visual presentation of GitHub Actions logs is unpleasant to read.
    matched_to: HL
  HH:
    distractor: Восемнадцать из 22 минут — это просто `npm install`, запускаемый заново
      каждый раз, и во всём YAML нет ни одного шага с кэшем.
    diagnosticity: high
    salience: high
    proposition: Eighteen of the 22 minutes are spent running npm install from scratch,
      and the workflow has no dependency cache.
    salience_source: per-step duration and missing cache
  LH:
    distractor: Шаг установки занимает 18 из 22 минут, а кэширование зависимостей
      в рабочем процессе не настроено.
    diagnosticity: high
    salience: low
    proposition: Eighteen of the 22 minutes are spent running npm install from scratch,
      and the workflow has no dependency cache.
