distractor_direction:
  label: Читаемость логов
  description: Исследование того, объясняется ли долгое время выполнения рабочего
    процесса трудночитаемыми логами CI или особенностями отображения интерфейса.
plausible_alternative_directions:
- label: Медленный тестовый набор
  description: Большую часть времени рабочий процесс может тратить на тесты, а не
    на установку зависимостей.
- label: Задержки реестра
  description: Реестр npm или сетевой доступ могут работать медленно во время установки.
- label: Ограничения ресурсов раннера
  description: Раннер GitHub Actions может быть ограничен по CPU или вводу-выводу.
