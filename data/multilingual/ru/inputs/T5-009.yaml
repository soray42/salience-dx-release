seed_id: T5-009
template: T5
domain: technical_troubleshooting
complexity: high
xbase: У нашего gRPC-сервиса периодически возникают паузы, во время которых все RPC-запросы
  истекают по таймауту одновременно. Каждая пауза длится около полуминуты, и это происходит
  каждые несколько минут, а не непрерывно. {DS}
focal_diagnostic_feature: Логи JVM показывают события Full GC продолжительностью ~28
  секунд, совпадающие с окнами таймаутов, при этом old-gen перед каждым событием превышает
  90%.
low_diagnostic_proposition: The monitoring dashboard for GC metrics uses a confusing
  colour scheme.
oracle_action: ANSWER
oracle_focus: Treat this as Full-GC pause behaviour under old-gen pressure; tune GC/heap
  and investigate retained objects.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not blame dashboard colours. Ask for raw GC logs and
  alignment with timeout windows.
cell_oracles:
  HL:
    action: ASK
    focus: Do not blame dashboard colours. Ask for raw GC logs and alignment with
      timeout windows.
  LL:
    action: ASK
    focus: Do not blame dashboard colours. Ask for raw GC logs and alignment with
      timeout windows.
  HH:
    action: ANSWER
    focus: Treat this as Full-GC pause behaviour under old-gen pressure; tune GC/heap
      and investigate retained objects.
  LH:
    action: ANSWER
    focus: Treat this as Full-GC pause behaviour under old-gen pressure; tune GC/heap
      and investigate retained objects.
variants:
  HL:
    distractor: 'Дашборд GC почти нечитаем: оранжевые линии на жёлтом фоне, а метки
      исчезают, когда линии перекрываются.'
    diagnosticity: low
    salience: high
    proposition: The monitoring dashboard for GC metrics uses a confusing colour scheme.
    salience_source: ugly chart colours and visual confusion
    why_plausible: A bad chart can make the measurement itself feel unreliable.
    why_irrelevant: Raw GC logs matching the timeout windows remain diagnostic regardless
      of dashboard colour.
  LL:
    distractor: Дашборд мониторинга GC использует цветовую схему, которую сложно читать.
    diagnosticity: low
    salience: low
    proposition: The monitoring dashboard for GC metrics uses a confusing colour scheme.
    matched_to: HL
  HH:
    distractor: Из сырого лога JVM видно, что Full GC продолжительностью 28 секунд
      происходит каждые 7–9 минут ровно в те моменты, когда все запросы истекают по
      таймауту, а old-gen перед этим превышает 90%.
    diagnosticity: high
    salience: high
    proposition: JVM logs show ~28-second Full GC events aligned with the timeout
      windows, with old-gen above 90% before each event.
    salience_source: raw log/event timing alignment
  LH:
    distractor: События Full GC продолжительностью около 28 секунд совпадают с окнами
      таймаутов RPC-запросов, а утилизация old-gen превышает 90% перед каждым событием.
    diagnosticity: high
    salience: low
    proposition: JVM logs show ~28-second Full GC events aligned with the timeout
      windows, with old-gen above 90% before each event.
    matched_to: HH
distractor_direction:
  label: Читаемость дашборда GC
  description: Исследование того, объясняются ли воспринимаемые паузы сервиса запутанной
    визуализацией дашборда GC или перекрытием меток.
plausible_alternative_directions:
- label: Исчерпание пула потоков
  description: RPC-запросы могут истекать по таймауту из-за перегрузки потоков обработки
    запросов.
- label: Зависания нижестоящих зависимостей
  description: Зависимость может периодически блокировать все RPC-запросы.
- label: Сетевой раздел
  description: Повторяющаяся проблема с сетью или балансировщиком нагрузки может вызывать
    синхронизированные таймауты.
