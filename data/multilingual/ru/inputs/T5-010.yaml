distractor_direction:
  label: Внешний вид розничного магазина
  description: Исследование того, свидетельствует ли более новый и ухоженный магазин
    провайдера Б о том, что он является лучшим интернет-провайдером.
plausible_alternative_directions:
- label: Качество поддержки клиентов
  description: Оперативность при установке и поддержке в случае сбоев может отличаться
    от заявленных скоростей и цен.
- label: Условия расторжения договора
  description: Штрафы за досрочное расторжение, повышение цен или условия минимального
    срока могут повлиять на выбор провайдера.
- label: Ограничения проводки в здании
  description: Проводка в жилом доме может ограничивать реальную производительность
    для одного из провайдеров.
