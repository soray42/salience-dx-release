xbase: Я выбираю домашнего интернет-провайдера для своей квартиры. Я работаю из дома
  два дня в неделю и мне в основном нужны стабильные видеозвонки. Оба провайдера могут
  провести установку на следующей неделе. {DS}
focal_diagnostic_feature: Провайдер А предлагает 1 Гбит/с оптоволокно за €35/месяц
