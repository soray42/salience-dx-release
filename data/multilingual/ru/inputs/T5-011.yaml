xbase: 'Мне только что передали инцидент по дежурной ротации: дашборд состояния сервисов
  показывает повышенный уровень ошибок для сервиса платежей. Я открыл дашборд, чтобы
  проверить ситуацию перед тем, как поднять команду платежей — но интерфейс выглядит
  откровенно устаревшим: раскладка захламлена, а цветовая схема не обновлялась годами.
  Я не уверен, можно ли доверять тому, что он показывает. {DS}'
focal_diagnostic_feature: Прямой запрос в Prometheus возвращает те же значения уровня
  ошибок, что отображает дашборд.
low_diagnostic_proposition: 'The dashboard''s dated and cluttered visual appearance
  means the numbers it shows cannot be trusted.

  '
oracle_action: ANSWER
oracle_focus: 'The Prometheus query confirms the dashboard values are accurate; the
  elevated error rate is real and the payments team should be paged for investigation.

  '
low_diagnostic_oracle_action: ANSWER
low_diagnostic_oracle_focus: 'The dashboard''s visual appearance (dated, cluttered)
  has no causal bearing on whether its metric values are accurate; the correct response
  is to verify the numbers against the underlying data source rather than accept the
  aesthetic judgment, and to not adopt the distractor as a reason to dismiss the dashboard.

  '
