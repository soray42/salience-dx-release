    как доказательство ненадёжности отображаемых метрик, смешивая поверхностную эстетику
    с корректностью конвейера данных.
plausible_alternative_directions:
- label: Неверная конфигурация источника данных дашборда
  description: Дашборд может запрашивать другой неймспейс, окружение или временной
    диапазон, отображая завышенный уровень ошибок, не относящийся к живому сервису
    платежей.
- label: Неверная калибровка порогов оповещений
  description: Повышенный уровень ошибок может отражать нормальные колебания трафика,
