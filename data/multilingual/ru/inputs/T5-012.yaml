plausible_alternative_directions:
- label: Неполная конфигурация резервного копирования
  description: BackPulse может быть настроен с исключением определённых путей к файлам,
    незаметно пропуская данные из резервных копий без возникновения ошибки.
- label: Повреждение на уровне хранилища
  description: Базовый дисковый или сетевой том хранилища может самостоятельно вносить
    повреждения независимо от инструмента резервного копирования.
- label: Ошибка логики инкрементных снапшотов
  description: Алгоритм инкрементного резервного копирования BackPulse может включать
    устаревшие или неправильные версии файлов без отображения ошибок на этапе резервного
    копирования.
