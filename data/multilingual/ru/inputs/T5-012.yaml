xbase: Я использую BackPulse — опенсорсный CLI для резервного копирования — для защиты
  снапшотов нашей производственной базы данных. Я начал беспокоиться, что инструмент
  может незаметно повреждать данные резервных копий. Я выполнил полное восстановление
  на отдельный тестовый том, а затем использовал встроенную команду verify инструмента
  для проверки целостности. {DS}
