      onCompletionCallback, и сбой происходит на три фрейма вглубь нашего колбэка
      — в момент, когда мы пишем в общий изменяемый словарь без блокировки.'
    diagnosticity: high
    salience: high
    proposition: 'Each of the three crash stack traces terminates inside the app-owned
      onCompletionCallback, not within any SDK frame, indicating the crash originates
      in application code, not the SDK.

      '
    salience_source: 'Precise technical detail (three matching stack traces, named
      callback, specific frame depth, specific operation — unsynchronised dictionary
