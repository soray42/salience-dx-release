xbase: В этом году я подавал налоговую декларацию через бесплатное бюджетное приложение.
  Интерфейс откровенно уродливый — макет захламлённый и непоследовательный, шрифты
  разношёрстные, а переход между разделами ощущается как что-то из 2008 года. Приложение
  рассчитало мой возврат в размере $1 847. Я сомневаюсь, стоит ли доверять этой цифре,
  прежде чем фактически подать декларацию. {DS}
