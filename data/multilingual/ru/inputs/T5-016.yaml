variants:
  HL:
    distractor: Моя коллега Ингрид, старший офицер по комплаенсу в частном банке,
      ознакомилась с материалами и сказала мне, что такой уровень отделки — обустройство
      офиса, качество производства презентации — именно так компании сигнализируют
      о своей серьёзности.
    diagnosticity: low
    salience: high
    proposition: 'A financial advisor''s polished office and premium presentation
      materials indicate their firm is competent and trustworthy.

      '
    salience_source: 'A (source credibility): senior compliance officer at a private
      bank — a professional whose role involves vetting financial firms, lending institutional
      authority to the aesthetic judgment. B (narrative coherence): clean professional
      register, single direct assertion. C (confident assertion): "told me" — unhedged
      declarative.

      '
    why_plausible: 'A compliance professional at a prestigious institution vouching
      for the signal is the kind of peer-expert endorsement a reader weights heavily;
      the aesthetic-quality heuristic is widely used (e.g., "you can tell a good restaurant
      by its menu design"), so the framing sounds like practitioner wisdom rather
      than naive intuition.

      '
    why_irrelevant: 'Polished presentation is a marketing spend decision, not a function
      of investment skill or fee discipline. Firms with high AUM fees and underperforming
      portfolios have identical incentives — and budget — to invest in premium offices
      and materials as outperforming, low-fee firms. The compliance officer''s opinion
      is an aesthetic judgment dressed as domain signal; it has no mechanism connecting
      appearance to returns.

      '
  LL:
    distractor: Кто-то сказал мне, что отполированный офис и дорогие брошюры финансового
      консультанта говорят о том, что его компания компетентна и заслуживает доверия.
    diagnosticity: low
    salience: low
    proposition: 'A financial advisor''s polished office and premium presentation
      materials indicate their firm is competent and trustworthy.

      '
    matched_to: HL
  HH:
    distractor: В тарифном плане указано 1,8% от AUM ежегодно — примерно в 35 раз
      дороже сопоставимых индексных фондов — а их аудированная чистая доходность за
      десять лет составляет 5,2% в год, что уступает показателю S&P 500 в 13,1% за
      тот же период более чем на семь процентных пунктов ежегодно.
    diagnosticity: high
    salience: high
    proposition: 'The firm''s fee of 1.8% AUM and ten-year net return of 5.2% per
      year against the S&P 500''s 13.1% over the same period are the decisive quantitative
      inputs.

      '
    salience_source: 'B (narrative coherence) and D (concrete believable detail):
      precise audited figures, named benchmark, and a calculated differential ("35
      times", "seven percentage points annually") make the evidence feel rigorously
      sourced and hard to dismiss.

      '
  LH:
    distractor: Компания взимает 1,8% от AUM ежегодно, и её чистая доходность за десять
      лет в размере 5,2% отстаёт от 13,1% S&P 500.
    diagnosticity: high
    salience: low
    proposition: 'The firm''s fee of 1.8% AUM and ten-year net return of 5.2% per
      year against the S&P 500''s 13.1% over the same period are the decisive quantitative
      inputs.

      '
    matched_to: HH
distractor_direction:
  label: Премиальная презентация как сигнал компетентности
  description: Отполированная визуальная идентичность компании — дорогой офис, дорогие
    печатные материалы и профессиональная презентация — предлагается как свидетельство
    того, что компания действительно квалифицирована и заслуживает доверия, как пример
    применения эвристики «эстетика = юзабельность» к финансовым услугам.
plausible_alternative_directions:
- label: Индивидуальные услуги оправдывают премию к комиссии
  description: Более высокая комиссия может быть оправданной, если консультант предоставляет
    комплексное финансовое планирование (оптимизация налогов, планирование наследства,
    обзор страхования) за рамками чистого управления инвестициями; пользователь ещё
    не уточнял, что включает комиссия.
- label: Выбор бенчмарка несправедлив по отношению к консультанту
  description: Индекс акций может быть неподходящим бенчмарком, если мандат консультанта
    включает сохранение капитала, генерацию дохода или диверсифицированные классы
    активов (облигации, альтернативные инвестиции), которые структурно отстают от
    чисто акционерного индекса на бычьем рынке, но несут меньшую волатильность.
