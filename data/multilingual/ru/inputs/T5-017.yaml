variants:
  HL:
    distractor: Честно говоря, интерфейс настолько примитивный — выцветшие серые панели,
      пиксельные значки с зазубринами, шрифт прямо из старого мастера установки —
      что всё это кричит об abandonware, а инструмент с таким запущенным видом вполне
      мог бы выдавать ложные тревоги с такой же беспечностью.
    diagnosticity: low
    salience: high
    proposition: The disk-health tool's dated, unprofessional interface suggests its
      failure warning should not be trusted.
    salience_source: B/D — vivid description of the tool's crude appearance, with
      the bridge that a neglected-looking tool gives unreliable warnings.
    why_plausible: Polished software does feel more trustworthy, so a shabby interface
      invites doubt about the substance behind it.
    why_irrelevant: A SMART warning is just a readout of the drive's own counters;
      the tool's visual styling has no bearing on whether those hardware counters
      are degrading.
  LL:
    distractor: Устаревший и непрофессиональный вид инструмента говорит о том, что
      его предупреждению о неисправности диска не стоит доверять.
    diagnosticity: low
    salience: low
    proposition: The disk-health tool's dated, unprofessional interface suggests its
      failure warning should not be trusted.
    matched_to: HL
  HH:
    distractor: Если отвлечься от внешнего вида и посмотреть на реальные цифры, данные
      SMART диска показывают растущее количество переназначенных секторов и ненулевое
      количество ожидающих секторов — оба являются классическими признаками умирающего
      SSD. Я перепроверил во встроенной утилите диска операционной системы, и она
      сообщает точно такие же неудовлетворительные значения.
    diagnosticity: high
    salience: high
    proposition: The drive's own SMART attributes show a rising reallocated-sector
      count and non-zero pending sectors, and the operating system's built-in disk
      utility reports the identical failing values.
    salience_source: Naming the specific SMART attributes and the OS-utility cross-check
      makes the hardware evidence concrete and independent of the tool.
  LH:
    distractor: SMART показывает растущее количество переназначенных секторов и ненулевое
      количество ожидающих секторов — оба являются признаками умирающего накопителя,
      — и утилита диска ОС сообщает идентичные значения.
    diagnosticity: high
    salience: low
    proposition: The drive's own SMART attributes show a rising reallocated-sector
      count and non-zero pending sectors, and the operating system's built-in disk
      utility reports the identical failing values.
    matched_to: HH
