domain: technical_troubleshooting
complexity: medium
xbase: 'Мы используем небольшую библиотеку с открытым исходным кодом для разбора дат,
  и один из коллег хочет от неё избавиться: страница проекта выглядит заброшенной
  — голый README, старый логотип, сайт прямо из 2009 года. Мы выяснили, что устаревший
  вид — это просто минималистский стиль мейнтейнера, который никогда не синхронизируется
  с проектом, поэтому страница ничего не говорит нам о том, поддерживается ли код.
  Замена затронет много кода, и я пытаюсь решить, оправдывает ли переход на другую
  библиотеку этот риск. {DS}'
focal_diagnostic_feature: В репозитории есть коммиты за последнюю неделю, мейнтейнеры
  закрывают задачи в течение нескольких дней, на последнем релизе горит зелёный значок
  CI, и библиотека является объявленной зависимостью нескольких широко используемых
  фреймворков.
low_diagnostic_proposition: The library's dated, bare-looking project page indicates
  it is abandoned and should be replaced.
oracle_action: ANSWER
oracle_focus: Keep the library; recent commits, fast issue turnaround, passing CI,
  and its use by major frameworks show it is actively maintained, so a risky, large
  swap is not justified by its dated page.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer abandonment from the page's look. Ask about
  commit recency, issue response times, CI status, and downstream adoption.
