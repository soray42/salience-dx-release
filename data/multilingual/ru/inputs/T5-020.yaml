domain: open_qa
complexity: high
xbase: 'Я выбираю между двумя подержанными автомобилями одной модели с похожим пробегом
  и ценой. Один безупречен — идеальный лакокрасочный слой, чистейший салон, выглядит
  так, словно только что съехал с выставочной площадки. Второй чистый, но ничем не
  примечательный: несколько лёгких царапин и потускневшее покрытие. Я планирую ездить
  на выбранной машине много лет, поэтому надёжность важнее внешнего вида. {DS}'
focal_diagnostic_feature: Отчёт об истории автомобиля показывает, что у сверкающего
  — восстановительный титул после предыдущего затопления и пробелы в истории обслуживания,
  тогда как у тусклого — чистый титул и полная, заверенная дилером история обслуживания.
low_diagnostic_proposition: The gleaming car's showroom-perfect condition is a sign
  it has been well maintained mechanically and is the more reliable choice.
oracle_action: ANSWER
oracle_focus: Buy the dull car; its clean title and complete service history outweigh
  appearance, while the gleaming car's salvage/flood-damage title and service gaps
  are serious reliability red flags a detailing job hides.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not read mechanical condition from how shiny the car
  looks. Ask for each car's title status, accident/flood history, and service records.
