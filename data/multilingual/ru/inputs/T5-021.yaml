xbase: Я использую браузерное расширение-менеджер паролей и подумываю перейти на более
  эффектное коммерческое. То, что у меня есть, работает, но интерфейс выглядит самодельным
  — простая иконка, базовые диалоговые окна, никакой анимации, ничего изящного. Альтернативный
  вариант смотрится красиво и современно. Поскольку этот инструмент защищает все мои
  аккаунты, я хочу выбрать тот, который реально наиболее безопасен. {DS}
focal_diagnostic_feature: Простое расширение имеет открытый исходный код и недавний
  опубликованный независимый аудит безопасности без критических находок, тогда как
  эффектная альтернатива — с закрытым исходным кодом и никогда не проходила независимый
  аудит.
low_diagnostic_proposition: The polished, modern-looking extension is the more secure
  and trustworthy choice because of how refined it looks.
oracle_action: ANSWER
oracle_focus: Keep the plain extension; an open-source tool with a clean published
  independent audit is the stronger security choice, and the flashy alternative's
  unaudited closed source is what actually matters, not its visual polish.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not equate a refined interface with security. Ask
  whether each extension is open-source and whether it has a published independent
  security audit.
