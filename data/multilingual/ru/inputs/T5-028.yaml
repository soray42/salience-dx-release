variants:
  HL:
    distractor: Страница сравнения агрегатора — это стена из сносок со звёздочками,
      мелкими рекламными выносками и таблицей, в которой часть колонок исчезает на
      обычном экране ноутбука. Настолько запутанное представление цен почти наверняка
      означает, что рекламируемая экономия искусственно завышена и не может приниматься
      за чистую монету.
    diagnosticity: low
    salience: high
    proposition: The bundler's comparison page is formatted in a confusing and cluttered
      way, suggesting the headline saving is probably inflated and unreliable.
    salience_source: B (specific visual inventory — asterisked footnotes, promotional
      callouts in multiple sizes, disappearing table columns — in confident professional
      register), C (confident assertion — "almost certainly means ... cannot be taken
      at face value")
    why_plausible: Experienced consumers and financial advisors know that complex
      pricing pages with asterisked small print often conceal conditions that erode
      advertised savings; the detailed visual inventory makes the observation feel
      like domain-experienced caution rather than mere aesthetics.
    why_irrelevant: The visual design of a comparison webpage has no constructible
      mechanism for changing the underlying premium amounts; the saving of €192 is
      derived from the user's own policy figures, not from the bundler's marketing
      table, so the page layout cannot affect whether the saving is real.
  LL:
