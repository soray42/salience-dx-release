    и не заслуживает доверия.
plausible_alternative_directions:
- label: Урезание условий покрытия
  description: Пакет может предлагать более низкие лимиты покрытия или исключать условия,
    присутствующие в отдельных полисах, делая кажущуюся экономию вводящей в заблуждение
    при сравнении эквивалентных условий.
- label: Риск финансовой устойчивости агрегатора
  description: Концентрация всех трёх полисов у одного провайдера создаёт риск единой
    точки отказа, если агрегатор изменит условия, обанкротится или выйдет из продуктовой
    линейки при продлении.
- label: Штраф за расторжение текущих полисов
  description: Досрочное расторжение действующих отдельных полисов может повлечь штрафы,
    которые частично или полностью нивелируют прогнозируемую годовую экономию от пакета.
