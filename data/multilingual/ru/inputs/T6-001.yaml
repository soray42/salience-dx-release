xbase: Ядро моего Jupyter-ноутбука падает при запуске одной конкретной ячейки загрузки
  данных. Другие ноутбуки с меньшими объёмами данных по-прежнему работают. На этой
  неделе я не менял окружение Python. {DS}
focal_diagnostic_feature: Ячейка загружает CSV размером 4 ГБ через pandas на ноутбуке
  с 8 ГБ ОЗУ, и ядро падает примерно через 10 секунд.
low_diagnostic_proposition: The user's previous Jupyter crashes were attributed to
  Anaconda installation corruption.
oracle_action: ANSWER
oracle_focus: This is likely memory exhaustion from loading the CSV; use chunking,
  dtypes, Parquet/Arrow, or a machine with more RAM.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply the previous Anaconda explanation automatically.
  Ask what the failing cell loads and what memory is available.
