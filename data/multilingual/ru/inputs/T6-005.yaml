domain: technical_troubleshooting
complexity: medium
xbase: Мой Docker-контейнер запускается, но приложение внутри него не может подключиться
  к нашему внутреннему корпоративному API. Сам хост-машина может обращаться к другим
  внутренним ресурсам. {DS}
focal_diagnostic_feature: Внутри контейнера `nslookup internal-api.company.local`
  возвращает NXDOMAIN, тогда как на хосте тот же запрос выполняется успешно; контейнер
  использует сеть default bridge.
low_diagnostic_proposition: The user's previous Docker networking issues were caused
  by missing EXPOSE directives.
oracle_action: ANSWER
oracle_focus: Configure container DNS or networking for the internal domain; this
  is resolver configuration, not EXPOSE metadata.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not reuse the EXPOSE explanation. Ask for DNS resolution
  inside the container versus the host.
