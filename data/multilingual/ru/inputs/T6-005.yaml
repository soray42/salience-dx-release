variants:
  HL:
    distractor: Каждая проблема с сетью Docker, с которой я сталкивался раньше, была
      из-за отсутствующей строки EXPOSE, поэтому я продолжаю смотреть в Dockerfile,
      хотя эта ситуация ощущается иначе.
    diagnosticity: low
    salience: high
    proposition: The user's previous Docker networking issues were caused by missing
      EXPOSE directives.
    salience_source: familiar past Docker fix, repeated troubleshooting habit
    why_plausible: EXPOSE is a common source of Docker confusion.
    why_irrelevant: EXPOSE does not control DNS resolution; NXDOMAIN inside the container
      points to resolver/network configuration.
  LL:
    distractor: Предыдущие проблемы с сетью Docker у этого пользователя обычно объяснялись
      отсутствием директив EXPOSE.
    diagnosticity: low
    salience: low
    proposition: The user's previous Docker networking issues were caused by missing
      EXPOSE directives.
    matched_to: HL
  HH:
    distractor: Внутри контейнера `nslookup internal-api.company.local` возвращает
      NXDOMAIN; на хосте то же имя разрешается, а контейнер находится на стандартном
      bridge Docker.
    diagnosticity: high
    salience: high
    proposition: Inside the container, `nslookup internal-api.company.local` returns
      NXDOMAIN, while the same lookup succeeds on the host; the container uses the
      default bridge network.
    salience_source: host/container DNS contrast
  LH:
    distractor: DNS-разрешение внутреннего имени хоста не работает внутри контейнера
      на сети default bridge, но успешно выполняется на хосте.
    diagnosticity: high
    salience: low
    proposition: Inside the container, `nslookup internal-api.company.local` returns
      NXDOMAIN, while the same lookup succeeds on the host; the container uses the
      default bridge network.
    matched_to: HH
distractor_direction:
  label: Отсутствие директивы EXPOSE
  description: Проверка того, не отсутствует ли метаданные EXPOSE в Dockerfile или
    не указан ли неверный порт, блокирующий подключение к контейнеру.
plausible_alternative_directions:
- label: Правило брандмауэра контейнера
  description: Брандмауэр контейнера или хоста может блокировать исходящий трафик
    к API.
- label: Отсутствие переменных прокси
  description: Внутри контейнера могут отсутствовать переменные окружения HTTP-прокси,
    NO_PROXY или сертификатов.
- label: Проблема с учётными данными API
  description: У контейнера могут отсутствовать действительные учётные данные или
    токены для доступа к внутреннему API.
