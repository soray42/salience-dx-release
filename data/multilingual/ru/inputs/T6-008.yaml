xbase: Я выбираю между двумя тарифными планами на телефон. Тариф А — более дешёвый
  с фиксированным пакетом данных. Тариф Б — более дорогой безлимитный. Дома и на работе
  я в основном пользуюсь Wi-Fi. {DS}
focal_diagnostic_feature: Тариф А стоит €12/мес при 20 ГБ данных, тариф Б — €35/мес
  безлимит, а потребление пользователя стабильно держится в диапазоне 8–12 ГБ на протяжении
  18 месяцев.
low_diagnostic_proposition: The user recalls peers having bad outcomes after choosing
  cheaper capped phone plans.
oracle_action: ANSWER
oracle_focus: Choose Plan A unless expected usage changes materially; the unlimited
  plan's premium is not justified by the usage history.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let friends' overage stories decide it. Ask for
  actual monthly usage, overage rules, and expected changes.
