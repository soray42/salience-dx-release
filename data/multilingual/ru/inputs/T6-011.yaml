distractor_direction:
  label: Перезагрузка домашнего роутера устраняет проблему
  description: Личная история пользователя с устранением роботизированного звука на
    видеозвонках путём перезагрузки домашнего роутера предполагает, что текущий эпизод
    тоже вызван состоянием роутера или перегрузкой домашней сети.
plausible_alternative_directions:
- label: Тепловое троттлирование CPU
  description: Процессор ноутбука накапливает тепло за день, и к вечеру начинает снижать
    тактовую частоту, что ухудшает обработку аудио в реальном времени и приводит к
    роботизированным искажениям при локальном захвате звука.
- label: Неисправность аудиодрайвера или программного обеспечения
  description: Ошибка в драйвере, недавно изменённая аудиоконфигурация или конфликтующий
    фоновый аудиопроцесс нарушают работу конвейера ввода микрофона, причём симптомы
    проявляются только после продолжительной работы системы.
- label: Изменение профиля управления питанием
  description: Автоматическое переключение вечером на режим экономии заряда или пониженного
    энергопотребления снижает приоритет CPU и аудиосистемы, из-за чего конвейер захвата
    звука пропускает сэмплы и формирует роботизированные артефакты.
