xbase: 'Мои комнатные растения снова страдают от вредителей. За последние два года
  я сталкивался с этим три раза: каждый раз я проверял грунт, подтверждал переполив
  и обнаруживал грибных комариков — стоило наладить полив и использовать жёлтые клейкие
  ловушки, и проблема каждый раз исчезала. Поэтому на этот раз я уже заказал ещё ловушек
