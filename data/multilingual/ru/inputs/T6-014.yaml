distractor_direction:
  label: грибные комарики из-за переполива
  description: Многократный прошлый опыт хозяина с грибными комариками заставляет
    его предполагать, что текущее заражение — то же самое, что побуждает к лечению
    жёлтыми клейкими ловушками и сокращению полива, а не к исследованию текущих симптомов.
plausible_alternative_directions:
- label: заражение трипсами
  description: Трипсы — распространённые вредители комнатных растений, вызывающие
    серебристую крапчатость и деформацию листьев; только по данным сценария (повторяющаяся
    проблема, ослабленные растения) они были бы живым кандидатом до тщательного осмотра
    растений.
- label: заражение мучнистыми червецами
  description: Мучнистые червецы — частые вредители комнатных растений, вызывающие
    увядание и обесцвечивание; без наблюдения паутины они представляют собой правдоподобный
    альтернативный диагноз для повторяющейся проблемы с вредителями в смешанной коллекции.
- label: заражение щитовками
  description: Щитовки часто поражают комнатные растения и вызывают прогрессирующее
    ухудшение состояния; они являются достоверным кандидатом для повторяющейся многорастительной
    проблемы с вредителями и отличаются как от отвлекающего варианта (грибные комарики),
    так и от фокального направления (паутинный клещ).
