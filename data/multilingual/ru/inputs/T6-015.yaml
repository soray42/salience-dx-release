xbase: 'Моя стиральная машина с фронтальной загрузкой оставляет бельё с затхлым запахом
  сразу после стирки — это началось несколько недель назад. Я ничего не менял: тот
  же порошок, которым пользуюсь уже больше трёх лет, тот же объём загрузки, те же
  настройки температуры. Мой распорядок не изменился вообще никак. {DS}'
focal_diagnostic_feature: Пользователь всегда закрывает дверцу машины сразу после
  выгрузки белья и никогда не чистил и не осматривал резиновую дверную манжету.
low_diagnostic_proposition: 'In the user''s past experience, musty laundry smell was
  always caused by the detergent brand.

  '
oracle_action: ANSWER
oracle_focus: 'The door gasket is the primary suspect: keeping the door closed traps
  moisture and the uncleaned gasket has accumulated mold or mildew that transfers
  odour onto clothes each cycle. Advise the user to clean the gasket thoroughly and
  establish a habit of leaving the door ajar between washes.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'The user''s past-experience attribution to detergent
  brand is not supported by the current case facts — the detergent is unchanged over
  three-plus years and the problem is new. Do not adopt the detergent-brand hypothesis.
  Instead, ask about machine maintenance habits: specifically whether the door is
  left open between cycles and when the gasket was last cleaned.

  '
