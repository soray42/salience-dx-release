distractor_direction:
  label: объяснение маркой порошка
  description: Пользователь связывает затхлый запах с маркой порошка, основываясь
    на устойчивом паттерне прошлых проблем со стиркой. В данном случае эта гипотеза
    структурно исключена, поскольку марка и дозировка не менялись более трёх лет,
    а симптом появился только недавно.
plausible_alternative_directions:
- label: засорение фильтра барабана или насосной ловушки
  description: Мусор и остатки, накапливающиеся в фильтре барабана или насосной ловушке
    машины, могут вызывать неприятные запахи, которые передаются белью; владелец,
    никогда не чистивший эти компоненты, может столкнуться с этим впервые.
- label: проблема со сливным шлангом или сифоном
  description: Частично заблокированный или неправильно расположенный сливной шланг
    может допустить обратное всасывание сточных вод в барабан, оставляя остатки грязной
    воды, которые производят затхлый запах.
- label: плесень внутри барабана или остатки порошка
  description: Плесень может развиваться на внутренней поверхности барабана или на
    плёнке накопившегося порошка внутри машины — отдельно от манжеты, — особенно в
    машинах, которые работают преимущественно на холодных или коротких циклах.
