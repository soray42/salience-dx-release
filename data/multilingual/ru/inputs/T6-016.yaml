seed_id: T6-016
template: T6
domain: open_qa
complexity: high
xbase: 'Мой портфель из акций и облигаций отстаёт от своего эталонного индекса третий
  год подряд. Коэффициент расходов фонда составляет 0,07% — практически столько же,
  сколько у самого индексного трекера, так что комиссии не могут объяснить разрыв.
  У меня есть целевое распределение активов, однако я не пересматривал фактические
  веса портфеля уже довольно долго. {DS}

  '
focal_diagnostic_feature: Портфель превышает целевое распределение в 60% по акциям
  примерно на 15–18 процентных пунктов после двух с лишним лет без ребалансировки
  в условиях устойчивого бычьего рынка акций; дрейф распределения сам по себе существенно
  смещает профиль риска/доходности от смешанного бенчмарка, что объясняет отставание
  без какой-либо разницы в комиссиях.
low_diagnostic_proposition: 'The last three times this investor''s portfolio lagged
  its benchmark, fund fees were the cause.

  '
oracle_action: ANSWER
oracle_focus: 'Address allocation drift: the portfolio is approximately 75–78% equity
  against a 60% target, a 15–18 pp overshoot from not rebalancing over two equity-bull
  years; the investor should rebalance toward the target and verify whether the return
  gap is fully explained by the changed equity/bond mix before considering any fund
  change.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Decline to adopt the fee-attribution from past experience;
  instead ask about the portfolio''s current allocation versus target, rebalancing
  history, tax drag, and whether the benchmark is an appropriate comparator for the
  actual current mix.

  '
