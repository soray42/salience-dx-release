  LH:
    action: ANSWER
    focus: 'Address allocation drift: the portfolio is approximately 75–78% equity
      against a 60% target, a 15–18 pp overshoot from not rebalancing over two equity-bull
      years; the investor should rebalance toward the target and verify whether the
      return gap is fully explained by the changed equity/bond mix before considering
