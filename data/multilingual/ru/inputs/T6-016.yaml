variants:
  HL:
    distractor: 'Я хорошо знаю эту закономерность: каждый раз, когда мой портфель
      раньше отставал — три отдельных года — причиной, которая в итоге выяснялась,
      были комиссии фонда, каждый раз без исключения.'
    diagnosticity: low
    salience: high
    proposition: 'The last three times this investor''s portfolio lagged its benchmark,
      fund fees were the cause.

      '
    salience_source: 'B (narrative coherence: clean first-person history with specific
      count), C (confident assertion: "I traced the lag back to fund fees"), D (concrete
      detail about past episodes: "three prior years").

      '
    why_plausible: 'Fund fees are a canonical cause of benchmark underperformance,
      and the investor''s own three-time track record of diagnosing fees gives the
      claim credibility and emotional familiarity — a busy reader pattern-matches
      to the well-known fees story.

      '
    why_irrelevant: 'The xbase explicitly discloses an expense ratio of 0.07%, essentially
      equal to the index tracker; there is no fee differential capable of explaining
      multi-year lag, so the past-experience pattern does not transfer to this case.

      '
  LL:
    distractor: Три последних раза, когда мой портфель отставал, причиной оказывались
      комиссии фонда.
    diagnosticity: low
    salience: low
    proposition: 'The last three times this investor''s portfolio lagged its benchmark,
      fund fees were the cause.

      '
    matched_to: HL
  HH:
    distractor: Моё подтверждённое целевое распределение — 60% акций, но я не проводил
      ребалансировку уже более двух лет; рынки акций за этот период сильно выросли,
      поэтому мой текущий вес по акциям составляет 75–78% — примерно на 15–18 процентных
      пунктов выше целевого.
    diagnosticity: high
    salience: high
    proposition: 'The portfolio''s equity allocation has drifted approximately 15–18
      percentage points above the 60% target due to no rebalancing over two equity-bull
      years.

      '
    salience_source: 'C (confident self-report with precise figures), D (concrete
      measurable detail: specific current weight range, specific target, specific
      drift magnitude).

      '
  LH:
    distractor: Моё распределение по акциям сдвинулось примерно до 75–78% — примерно
      на 15–18 п.п. выше целевых 60% — после двух лет роста рынка акций без ребалансировки.
    diagnosticity: high
    salience: low
    proposition: 'The portfolio''s equity allocation has drifted approximately 15–18
      percentage points above the 60% target due to no rebalancing over two equity-bull
      years.

      '
    matched_to: HH
distractor_direction:
  label: прошлое объяснение комиссиями
  description: Инвестор связывает текущее отставание от бенчмарка с комиссиями фонда,
    рассуждая из трёх предыдущих личных эпизодов, где комиссии были диагностированной
    причиной. Здесь этот путь закрыт, поскольку коэффициент расходов фонда ничтожно
    мал и соответствует индексу.
plausible_alternative_directions:
- label: несоответствие бенчмарка
  description: Выбранный эталонный индекс может не отражать реальную стратегию или
    текущий профиль риска портфеля, делая сравнение вводящим в заблуждение, а не указывающим
    на истинное отставание.
- label: налоговые потери
  description: Налогооблагаемые распределения прироста капитала или решения о сборе
    убытков могут снизить доходность после вычета налогов относительно доналогового
    бенчмарка, объясняя видимый разрыв без какой-либо реальной проблемы с результатами.
- label: потери от кэша
  description: Неинвестированные денежные средства на счёте снижают общую подверженность
    акциям и облигациям, создавая структурный дефицит по сравнению с полностью инвестированным
    эталонным индексом.
leak_audit:
  ll_atomic_claims:
  - The investor's portfolio lagged its benchmark on at least three prior occasions.
  - Fund fees were identified as the cause each of those times.
  hl_salience_dimensions:
    source_credibility: N/A — no external source; salience derives from the user's
      own repeated personal experience
    narrative_coherence: 'Clean, first-person chronological account: prior years,
      consistent diagnosis, current instinct'
    confident_assertion: '"I traced the lag back to fund fees" — active, definite
      verb of causal finding'
    concrete_detail: '"three prior years" anchors the history count without adding
      case content'
  forbidden_categories_checked_against:
  - tunable_value
  - effort_descriptor
  - severity_claim
  - sensory_distractor_about_setting
  - rambling_marker
  - hedging_language
  hl_word_count: 25
  ll_word_count: 15
  lh_word_count: 21
  notes: 'Avoided "after going through my statements carefully" (effort_descriptor).

    Avoided naming a specific fund or fee figure in the distractor (tunable_value).

    "Three prior years" refers to the user''s past history count, not a case-content
    value.

    HL ratio 29/15 = 1.93, well within the 4:1 ceiling.

    No sensory environment color added anywhere.

    REPAIR (revision 2): LH distractor rewritten to include all three claims present
    in HH

    but absent in original LH: (1) two-year duration of non-rebalancing, (2) equity-market

    appreciation mechanism, (3) explicit drift magnitude of 15–18 pp. New LH wording:
    "My

    equity allocation has drifted to about 75–78% — roughly 15–18 pp above my 60%
    target —

    after two equity-bull years without rebalancing." (21 words, within 12–25 limit).
    LH

    proposition unchanged; HH/LH propositional equivalence now restored.


    rev3 2026-06-11: HL hand-repaired per QC r2 verdict (orchestrator edit); word
    count 26.

    rev4 2026-06-11: effort-descriptor strip per QC r3.

    rev5 2026-06-11: cell-integrity repair — xbase no longer narrates drift figures
    (60% target vs 75-78% current weight, two equity-bull years); focal evidence now
    lives exclusively in HH/LH variants. xbase retains: third-year underperformance,
    0.07% expense ratio (fees-pathway closure), and existence of a target allocation
    without quantified drift.'
causal_audit:
  steelman: 'Fund expense ratios directly reduce investor returns year-over-year;
    a 1%

    annual fee compounds into a ~10% return gap over a decade. On any portfolio

    underperformance investigation, a senior CFP or investment adviser would

    check the fund''s total expense ratio as a first-order diagnostic. The

    investor''s three prior successful diagnoses of fees further support the

    hypothesis. If the fund had a higher expense ratio than the index, fees

    would be a fully defensible primary explanation.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase states the fund''s expense ratio is 0.07%, described
    as "essentially the same as the index tracker itself"; this eliminates any material
    fee differential as an explanatory variable, collapsing the fees pathway to ~0bp
    impact and making the past-experience pattern inapplicable to this specific case.

    '
