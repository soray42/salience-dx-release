xbase: Одна акция в моём долгосрочном портфеле упала примерно на 18% за две недели,
  и я завис над кнопкой «продать». Я купил её в расчёте держать несколько лет, и позиция
  составляет небольшую долю в диверсифицированном портфеле. Никакой срочной потребности
  в деньгах, которая вынуждала бы продавать, у меня нет. Падение просто выбивает меня
  из колеи, и я всё время чувствую, что надо избавиться от неё, пока не стало хуже.
  {DS}
