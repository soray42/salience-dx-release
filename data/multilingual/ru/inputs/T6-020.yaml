template: T6
domain: technical_troubleshooting
complexity: high
xbase: p99-задержка нашего API несколько раз в день резко скачет на протяжении последней
  недели, и моим первым шагом является откат последнего деплоя. Спайки короткие, но
  сильные, после чего задержка сама возвращается к норме. Трафик во время спайков
  не меняется, а частота ошибок остаётся низкой. Мы выкатываем несколько деплоев в
  день, но сравнив время спайков с журналом деплоев, я обнаружил, что часть спайков
  пришлась на часы, когда мы ничего не выкатывали, — значит, они не связаны ни с одним
  деплоем. {DS}
focal_diagnostic_feature: Спайки происходят ровно в начало каждого часа независимо
  от времени деплоев — включая часы без деплоев — и точно совпадают с почасовым обновлением
  материализованного представления, которое захватывает тяжёлую блокировку и насыщает
  IOPS базы данных.
low_diagnostic_proposition: Every latency regression the user has handled before was
  caused by a bad deploy, so this one is probably a bad deploy too.
oracle_action: ANSWER
oracle_focus: Do not roll back; the spikes hit exactly on the hour independent of
  deploys and match an hourly materialized-view refresh that locks and saturates DB
  IOPS, so reschedule, incrementalise, or throttle that job.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a bad deploy from past regressions. Ask
