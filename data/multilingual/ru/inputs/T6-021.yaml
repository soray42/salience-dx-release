complexity: low
xbase: Раковина в ванной медленно сливает, и я уже готов взять трос-змейку и прочистить
  засор самостоятельно, как всегда. Она ещё не полностью заблокирована, просто вялая.
  Дом старый, но раньше проблем с сантехникой здесь не было. Я бы предпочёл не платить
  за сантехника за то, с чем сам справлюсь за десять минут в выходные. {DS}
focal_diagnostic_feature: Вода выходит из унитаза и ванны одновременно, пока работает
  раковина, а из нескольких точек слышится бульканье — признаки того, что засор находится
  в общей канализационной магистрали, а не в сифоне одного прибора.
low_diagnostic_proposition: Every drain clog the user has cleared before was a simple
  hair or debris clog in the trap, so this one is probably the same.
oracle_action: ANSWER
oracle_focus: Call a professional for the main line; backups and gurgling across the
  toilet, tub, and sink together point to a shared sewer-line blockage that a fixture
  drain snake cannot reach, not a local trap clog.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a simple trap clog from past experience.
  Ask whether other fixtures back up or gurgle when this drain is used.
