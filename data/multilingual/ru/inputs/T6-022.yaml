variants:
  HL:
    distractor: Каждый крэш при запуске, который я когда-либо расследовал, в итоге
      оказывался повреждённым локальным кэшем, поэтому мой инстинкт немедленно хочет
      разослать всем затронутым пользователям инструкцию по очистке кэша и переустановке
      и закрыть вопрос.
    diagnosticity: low
    salience: high
    proposition: Every launch crash the user has fixed before came from a corrupted
      local cache, so this one is probably a cache problem too.
    salience_source: B/C — a vivid personal history of launch crashes as cache corruption
      plus the confident first instinct to push a clear-cache fix.
    why_plausible: Corrupted local state genuinely does cause launch crashes, and
      a clean reinstall is a familiar, often-successful first remedy.
    why_irrelevant: A missing platform method exists only on certain OS versions;
      clearing cache changes nothing about which APIs the device's OS provides, so
      it cannot fix it.
  LL:
    distractor: Каждый крэш при запуске, который пользователь исправлял раньше, был
      вызван повреждённым локальным кэшем — значит, этот, скорее всего, тоже является
      проблемой кэша.
    diagnosticity: low
    salience: low
    proposition: Every launch crash the user has fixed before came from a corrupted
      local cache, so this one is probably a cache problem too.
    matched_to: HL
  HH:
    distractor: Просматривая отчёты о крэшах, я замечаю, что каждый из них поступает
      с устройства на старой версии Android, а стек-трейс один и тот же — NoSuchMethodError
      для API платформы, который существует только на новых версиях ОС, — причём мы
      вызываем его безусловно при старте, до любой проверки версии.
    diagnosticity: high
    salience: high
    proposition: Every crash report comes from devices on older Android versions,
      and the stack trace is a NoSuchMethodError for a platform API that only exists
      on newer OS versions, called unconditionally during startup.
    salience_source: The older-OS-only crash population plus the NoSuchMethodError
      on a newer-only API makes the API-availability bug concrete.
  LH:
    distractor: Все отчёты о крэшах поступают с устройств на старых версиях Android,
      а в стек-трейсе — NoSuchMethodError для API платформы, который существует только
      на новых версиях ОС и вызывается безусловно при старте.
    diagnosticity: high
    salience: low
    proposition: Every crash report comes from devices on older Android versions,
      and the stack trace is a NoSuchMethodError for a platform API that only exists
      on newer OS versions, called unconditionally during startup.
    matched_to: HH
distractor_direction:
  label: Повреждённый локальный кэш
  description: Отношение к крэшу при запуске как к повреждённым локальным данным приложения,
    которые исправляются очисткой кэша и переустановкой.
plausible_alternative_directions:
- label: Миграция хранимых данных
  description: Не вызывает ли крэш при старте неудачная миграция данных или схемы
    существующих пользовательских данных.
- label: Некорректный артефакт релиза
  description: Не попадает ли к части пользователей повреждённая или неправильно подписанная
    сборка.
