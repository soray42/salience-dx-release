seed_id: T6-022
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: После последнего релиза для Android часть пользователей сообщает, что приложение
  мгновенно падает при запуске, и моя первая мысль — попросить их очистить кэш и переустановить
  приложение. Большинство пользователей в полном порядке и никогда этого не видят.
  Крэш происходит прямо при старте, до того как появляется хоть какой-нибудь экран.
  Я уже попросил нескольких затронутых пользователей очистить все данные приложения
  и переустановить его, но приложение всё равно падает у них при следующем же запуске.
  {DS}
focal_diagnostic_feature: Каждый отчёт о крэше поступает с устройств на старых версиях
  Android, а в стек-трейсе — NoSuchMethodError для API платформы, который существует
  только на новых версиях ОС и вызывается безусловно при старте.
low_diagnostic_proposition: Every launch crash the user has fixed before came from
  a corrupted local cache, so this one is probably a cache problem too.
oracle_action: ANSWER
oracle_focus: Guard the newer-OS platform API behind a version check or raise minSdk;
  the crashes are a NoSuchMethodError on older Android versions for an API that does
  not exist there, not a corrupted cache.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a cache problem from past crashes. Ask
  what the stack trace says and whether the affected devices share an OS version.
