  HL:
    distractor: Каждая проблема с rate-лимитами, которую я разбирал в этом сервисе,
      в итоге упиралась в то, что retry-код долбил upstream без нормального экспоненциального
      backoff, и, поддерживая этот сервис уже несколько лет, мой инстинкт подсказывает,
      что та же неправильная конфигурация backoff снова бьёт нас прямо сейчас.
    diagnosticity: low
    salience: high
    proposition: Past rate-limit incidents for this service were caused by retry logic
      firing without adequate backoff, and the same may be happening now.
    salience_source: B/C — first-person service-specific history ('every rate-limit
      problem I have debugged on this service'), long-tenure authority marker ('having
      maintained this service for years'), and confident forward inference ('my instinct
      is that the same backoff misconfiguration is biting us').
    why_plausible: Retry amplification is one of the most common rate-limit causes;
      a practitioner who has fixed it on the same service before has domain-relevant
      pattern recognition that a busy reviewer would take seriously.
    why_irrelevant: Distributed tracing in xbase confirms no error-triggered repeat
      calls, directly ruling out retry amplification as a mechanism. The focal evidence
      further shows the excess calls are first-attempt duplicates from cache-key collision,
      not retries, and would appear even with perfect backoff.
  LL:
    distractor: Прошлые инциденты с rate-лимитами в этом сервисе были вызваны retry-логикой,
