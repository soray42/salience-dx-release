      rather than the idempotency token, so concurrent requests within the same session
      are not deduplicated and all reach the upstream.
    matched_to: HH
distractor_direction:
  label: Неправильная настройка retry backoff
  description: Расследование того, не срабатывает ли retry-логика сервиса без нормального
    экспоненциального backoff, усиливая количество upstream-запросов и вызывая rate-лимиты.
plausible_alternative_directions:
- label: Изменение rate-limit тира на стороне upstream
  description: Провайдер платёжного API мог молча снизить пороги rate-лимита на уровне
    пользователя, не уведомив нижестоящих интеграторов, что делает прежде допустимые
    паттерны вызовов нарушающими.
- label: Всплеск конкурентности сессий
  description: Недавнее изменение продукта могло увеличить легитимную конкурентность
    сессий — например, несколько вкладок браузера или новая мобильная функция, отправляющая
    параллельные запросы, — превышая то, что разрешает upstream на уровне сессии.
- label: Retry платёжного флоу при таймауте
  description: 'Смежный, но отличный механизм: платёжный UI может повторять запрос
    при медленном ответе, а не при ошибке, создавая дублирующие вызовы, каждый из
    которых корректен по отдельности, но избыточен в сумме.'
