  HH:
    distractor: Распределённая трассировка показывает, что каждая пользовательская
      сессия генерирует от 4 до 5 вызовов upstream платёжного API там, где ожидается
      один; ключ кэша использует только user ID, поэтому параллельные запросы в рамках
      одной сессии приходят с разными idempotency token, не попадают в кэш и все уходят
      на upstream.
    diagnosticity: high
    salience: high
    proposition: Distributed tracing shows 4 to 5 upstream payment API calls per user
      session where exactly one is expected; the caching middleware keys on user ID
      rather than the idempotency token, so concurrent requests within the same session
      are not deduplicated and all reach the upstream.
    salience_source: B — concrete trace metric (4-5 calls per session vs 1 expected)
      paired with a specific code-level mechanism (cache key omits idempotency token),
      forming a complete causal chain from middleware design to upstream excess calls.
  LH:
    distractor: Трассировка по сессиям показывает 4–5 вызовов upstream API там, где
      ожидается один; ключ кэша не включает idempotency token, поэтому запросы не
      дедуплицируются.
    diagnosticity: high
    salience: low
    proposition: Distributed tracing shows 4 to 5 upstream payment API calls per user
