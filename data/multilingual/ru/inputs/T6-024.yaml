seed_id: T6-024
template: T6
domain: technical_troubleshooting
complexity: high
xbase: На протяжении последних пяти дней наш сервис периодически упирается в rate-лимиты
  стороннего платёжного API. Rate-лимиты затрагивают лишь часть пользователей одновременно,
  а в совокупности мы заметно ниже договорного квоты по запросам. Распределённая трассировка
  не показывает повторных вызовов, инициированных ошибками. Две недели назад мы добавили
  новый кэширующий middleware в платёжный флоу. {DS}
focal_diagnostic_feature: Распределённая трассировка показывает от 4 до 5 вызовов
  upstream платёжного API на пользовательскую сессию там, где ожидается ровно один;
  кэширующий middleware использует в качестве ключа user ID, а не idempotency token,
  поэтому параллельные запросы в рамках одной сессии не дедуплицируются и все достигают
  upstream.
low_diagnostic_proposition: Past rate-limit incidents for this service were caused
  by retry logic firing without adequate backoff, and the same may be happening now.
oracle_action: ANSWER
oracle_focus: Fix the caching middleware key to include the idempotency token so concurrent
  requests within a session are deduplicated before reaching the upstream payment
  API.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to retry-backoff as the cause without
  evidence. Ask for distributed tracing data showing upstream call counts per session
  and per-user rate-limit patterns.
