distractor_direction:
  label: 团队融入度差
  description: 排查新职位尽管薪资更高，是否可能存在文化、管理风格或团队融入方面的问题。
plausible_alternative_directions:
- label: 公司财务稳定性
  description: 潜在雇主的财务状况是否足以长期支撑该职位。
- label: 现团队的留任价值
  description: 留在现团队是否能获得导师指导、晋升支持或内部转岗机会。
- label: 职责范围不匹配
  description: 新职位的头衔与实际职责是否与用户的职业发展方向不符。
