distractor_direction:
  label: OEM设备定制化
  description: 启动崩溃由设备制造商自定义的Android皮肤或系统API修改所致，仅影响特定手机型号。该轶事将OEM特定的定制化确认为根本原因，与部分用户崩溃的症状模式相吻合。
plausible_alternative_directions:
- label: 正式构建BuildConfig配置错误
  description: 正式构建flavor使用了无效或缺失的BuildConfig常量或API密钥，在任何显式网络调用之前就在onCreate中触发了未处理异常。
- label: 正式构建中DI图的空绑定
  description: 依赖注入图（Dagger/Hilt）中存在仅在正式构建配置下缺失或为null的绑定，导致应用初始化期间出现NullPointerException。
