plausible_alternative_directions:
- label: 日程配置错误
  description: 应用中的日程天数、时间或温度设定点可能配置错误——例如，日程可能仅设置了特定几天而不包括当前工作日，或者目标温度可能低于当前室温。
- label: 恒温器固件或应用同步失败
  description: 固件更新失败或手机应用与恒温器本地存储之间的同步中断，可能导致恒温器运行过时或空白的日程数据，尽管应用显示日程为正确状态。
- label: 保持模式或度假模式已激活
  description: 在恒温器上（或通过应用）设置的手动保持、度假模式或临时温度覆盖可能正在抑制所有计划事件，直到保持状态到期或被清除。
