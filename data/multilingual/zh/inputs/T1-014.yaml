xbase: 我的洗碗机已经用了8年，最近停止完成清洗循环。一位技师给出了维修报价，而换一台同等新机型的费用要高出不少。我的姐夫/妹夫最近也面临同样的维修还是换新的决定，他选择了换新；他分享了自己的考量。{DS}
focal_diagnostic_feature: 维修报价（160美元）约为换新成本（550美元）的29%，远低于通行的50%维修门槛，且故障是独立的控制板失效，而非系统性电机或水泵老化的征兆。
low_diagnostic_proposition: 'The relative replaced rather than repaired because a
  third-party repair would void remaining manufacturer warranty coverage on the appliance.

  '
oracle_action: ANSWER
oracle_focus: 'Recommend repair: the cost ratio (29% of replacement) is well inside
  the standard repair threshold, and a control board failure is an isolated fault
  with no indication of broader deterioration. Address age as a secondary consideration
  but note expected dishwasher lifespan is 9-12 years, leaving reasonable useful life.

  '
low_diagnostic_oracle_action: ANSWER
low_diagnostic_oracle_focus: 'Note that the relative''s warranty-preservation reasoning
