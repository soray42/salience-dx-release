distractor_direction:
  label: HELOC整合作为策略
  description: 建议正确做法是在续签时将房屋净值信贷额度（HELOC）整合入固定利率房贷，如同事所做的那样。这一方向将同事的整合经历视为适用于用户利率类型决策的可借鉴模式。
plausible_alternative_directions:
- label: 利率差距盈亏平衡分析
  description: 在0.7个百分点的溢价下，固定利率只有在浮动利率在有效持有期内上升幅度超过该差距时才在经济上更合算；实务人员会测算多少次加息才能达到盈亏平衡。
- label: 劳动合同收入稳定性
  description: 双方均有长期劳动合同，降低了收入中断导致浮动利率还款困难的概率；顾问可能会权衡这种稳定性是否有利于承担浮动利率风险。
- label: 10年锁定期与持有期限的匹配度
  description: 10年固定期限异常之长；顾问可能会评估用户的生活状况（家庭计划、职业流动性、可能的房产升级）是否使10年锁定在结构上合适，或者较短的固定期限是否更可取。
