    distractor: Priya——在一家地区性养老基金担任金融分析师，也是我们团队里金融素养最高的人——告诉我，她在去年续签时，把房屋净值信贷额度并入了一笔统一的固定利率房贷。
    diagnosticity: low
    salience: high
    proposition: 'A colleague fixed their mortgage at renewal by rolling a home equity
