    salience_source: A — a named QA lead at a peer company recounting a closely matching
      flakiness symptom.
    why_plausible: Shared mutable state under parallel execution is one of the most
      common real causes of intermittent E2E failures, so it is a natural first guess.
    why_irrelevant: xbase already reports the failure reproduces on CI with that single
      spec running alone in the process, so no cross-test state-sharing is present;
      the focal evidence shows the failure is a deterministic function of wall-clock
      time.
  LL:
