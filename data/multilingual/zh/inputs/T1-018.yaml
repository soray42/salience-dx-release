causal_audit:
  steelman: 'A senior test engineer could argue CI commonly runs specs in parallel
    while local runs are serial, which would

    perfectly explain "passes alone, flaky on CI"; shared seeded rows under concurrency
    is textbook flakiness and

    would normally top the differential for an intermittent E2E failure.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase closes the parallelism pathway: it states the failure
    still reproduces on CI when the single spec runs alone in the process with no
    other tests, so cross-test shared-state clobbering cannot be the cause. This neutrally
    rules out the one tempting mechanism without supplying the affirmative cause,
    which the focal time-boundary evidence in HH/LH provides.'
