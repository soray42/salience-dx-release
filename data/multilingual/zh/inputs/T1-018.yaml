  HH:
    distractor: 我将CI历史记录与时间戳对齐，发现每次失败的运行都在23:00 UTC之后开始；该测试固定了一个字面量到期日字符串，在那个时间点之后「本周到期」已滚动到下一个ISO周，所以发票不再匹配测试所期望的时间窗口。
    diagnosticity: high
    salience: high
    proposition: The test hardcodes a fixed due-date string, and it fails only on
