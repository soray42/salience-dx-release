distractor_direction:
  label: 并行共享状态
  description: 调查并行运行的测试是否破坏了共享的数据库或fixture状态，导致间歇性失败。
plausible_alternative_directions:
- label: CI环境差异
  description: CI镜像或预置数据是否与本地环境存在差异，这种差异只在runner上才会显现。
- label: 异步时序竞争
  description: 断言是否在一个异步写入尚未提交时就提前读取，从而与该写入发生竞争。
