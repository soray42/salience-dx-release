seed_id: T1-022
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: 大约一周前，一个每晚向团队发送销售日报的定时任务悄无声息地停止运行了。日报不再发送，但应用日志中没有任何报错，脚本手动执行时完全正常。crontab
  条目仍然存在，看起来和以前一模一样。没有人更改过调度配置或脚本，df 显示每个分区的使用率都远低于 80%。{DS}
focal_diagnostic_feature: 系统认证日志显示 cron 以「账户已锁定」拒绝启动任务会话，而专用服务账户在八天前的安全加固操作中被锁定。
low_diagnostic_proposition: A colleague's cron job stopped running because a full
  disk prevented the daemon from writing its logs.
oracle_action: ANSWER
oracle_focus: Re-enable (or replace) the locked service account the cron job runs
  as, or move the job to a permitted account; PAM is refusing the cron session because
  the account was locked, which is why no script error appears.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a full-disk cause from another case. Ask
  what the system auth/cron logs show about the job's user account and recent account
  or permission changes.
