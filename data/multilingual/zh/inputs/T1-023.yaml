xbase: 我正在精简每月的订阅支出。我翻出了去年的信用卡账单，列出了所有循环扣款项目。我订阅了两个不同的流媒体服务、一个云存储套餐、一个音乐会员、一个新闻网站和一个冥想
  App。我想取消那些自己确实没在用的，而不是凭感觉乱猜，而且我可以查阅实际的使用记录。{DS}
focal_diagnostic_feature: 用户自己的观看记录显示，两个流媒体服务中有一个在过去六个月里从未打开，而另一个几乎每周都在使用。
low_diagnostic_proposition: A friend regretted cancelling a streaming service because
  a show they later wanted moved exclusively to it.
oracle_action: ANSWER
