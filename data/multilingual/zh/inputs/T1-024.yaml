causal_audit:
  steelman: 'A senior engineer could argue that TLS handshakes can fail probabilistically
    across a multi-backend fleet if

    only some upstream instances serve a stale or near-expiry certificate, or if a
    renewed cert propagated unevenly;

    roughly one-in-fifty requests hitting an unlucky instance would receive a TLS
    handshake failure and appear as a

    502 with clean app logs (if TLS terminates at the LB). This is a genuine practitioner
    checklist item for the

    symptom pattern described in xbase alone — the steelman is defensible.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase now carries an explicit closure: ''A quick check
    confirmed all backend TLS certificates are current and consistent across every
    instance.'' This sentence forecloses the uneven-cert-propagation pathway without
    naming the real cause (C4 compliant — it neutrally rules out ONE tempting mechanism).'
