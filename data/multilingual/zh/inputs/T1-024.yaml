variants:
  HL:
    distractor: Renata 是我上一份工作中信任的平台工程师，她告诉我她的团队曾追查过类似的 502 问题，最终发现是上游服务的 TLS 证书过期了。
    diagnosticity: low
    salience: high
    proposition: A similar 502 problem at another company was traced to an expired
      TLS certificate on the upstream service.
    salience_source: A — a trusted platform engineer recounting a closely symptom-matched
      502 investigation.
    why_plausible: Certificate problems do cause gateway errors and the symptom-match
      (random 502s, nothing in app logs) makes the anecdote feel directly applicable.
    why_irrelevant: An expired upstream certificate fails handshakes consistently
      for the affected period, not one request in fifty with no pattern; the focal
      evidence ties the 502s to reused stale keep-alive connections, a different mechanism.
  LL:
    distractor: 另一家公司出现过类似的 502 问题，原因被追溯到上游服务的 TLS 证书过期。
    diagnosticity: low
    salience: low
    proposition: A similar 502 problem at another company was traced to an expired
      TLS certificate on the upstream service.
    matched_to: HL
  HH:
    distractor: 抓包结果显示，502 精确地落在负载均衡器复用了一个后端已经关闭的空闲连接池连接的请求上：后端的 keep-alive 空闲超时时间短于负载均衡器的，导致均衡器往一个半死的套接字写入数据并收到
      reset。
    diagnosticity: high
    salience: high
    proposition: The 502s occur only on requests where the load balancer reused an
      idle keep-alive connection whose upstream had already closed it, because the
      backend keep-alive timeout is shorter than the load balancer's.
    salience_source: The packet-level correlation to reused-closed connections plus
      the timeout ordering names the mechanism precisely.
  LH:
    distractor: 502 只发生在负载均衡器复用了后端已关闭连接的情况下，因为后端的 keep-alive 超时时间短于负载均衡器的。
    diagnosticity: high
    salience: low
    proposition: The 502s occur only on requests where the load balancer reused an
      idle keep-alive connection whose upstream had already closed it, because the
      backend keep-alive timeout is shorter than the load balancer's.
    matched_to: HH
