distractor_direction:
  label: 办公场所重新布局
  description: 办公桌的物理重新摆放被认为是导致webhook投递失败的原因，依据是时间上的巧合。云端托管的端点在架构上与办公室本地基础设施完全隔离，使这一方向没有任何因果路径。
plausible_alternative_directions:
- label: 云平台局部故障
  description: 状态页面未反映的细微或区域性云平台故障可能导致间歇性的5xx响应，SaaS提供商会将其记录为投递失败。
- label: SaaS提供商限流
  description: SaaS提供商可能因事件量增加或政策变更，开始对该端点进行限流，从提供商侧造成间歇性失败。
- label: TLS证书到期
  description: 云端端点的TLS证书可能已过期或进入续期窗口，导致部分投递尝试因握手错误而失败。
