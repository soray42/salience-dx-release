causal_audit:
  steelman: 'LED bedside lamps with switching-mode power supplies emit electromagnetic

    interference (EMI) across a broad frequency range. An e-reader on a

    nightstand centimetres away could have its Wi-Fi or Bluetooth radio

    disrupted, causing the radio to retry connections more aggressively and

    consume more power. A consumer electronics technician could cite

    documented cases of cheap LED drivers interfering with nearby wireless

    devices. Some poorly shielded lamps can also emit conducted interference

    if sharing a circuit — though the scenario rules out a shared electrical

    connection. Even without a shared circuit, radiated EMI from a lamp

    within 30 cm could in principle add marginal load to a wireless radio.

    This is the strongest argument FOR the lamp hypothesis.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: '"the e-reader never connects to it or plugs into it in
    any way" removes any conducted-interference pathway (shared circuit). The radiated
    EMI pathway is not explicitly closed, but: the magnitude of the drain (roughly
    10x) is wildly disproportionate to what household lamp EMI could cause; no mainstream
    e-reader troubleshooting guide lists nearby lamp EMI as a checklist item; the
    mechanism requires the e-reader radio to already be active, making it downstream
    of the real cause rather than independent. A senior practitioner would not pursue
    the lamp hypothesis given a confirmed Wi-Fi/sync change.

    '
