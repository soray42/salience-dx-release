distractor_direction:
  label: 换积分计划导致问题
  description: 该假设认为，换用不同的超市积分计划导致酵母种停止可靠膨胀，仅基于时间上的巧合，没有任何合理的机制。
plausible_alternative_directions:
- label: 面粉批次差异
  description: 即便是同一品牌，新生产批次的蛋白质含量、灰分水平或野生酵母含量可能不同，从而影响酵母种的活力。
- label: 水处理变化
  description: 市政供水的氯或氯胺含量可能随季节或基础设施变更而波动，过高的消毒剂含量即便使用同一水龙头也会抑制酵母种的微生物群落。
- label: 污染或菌群稀释
  description: 通过未清洗的工具引入竞争性微生物，或因喂养比例不当导致菌群过度稀释，可能使微生物平衡发生偏移，足以降低发酵可靠性。
