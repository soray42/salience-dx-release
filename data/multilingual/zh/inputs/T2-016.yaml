- label: 客户现金流紧张
  description: 客户正面临财务困难，对所有供应商拉长付款周期，与发票格式无关。
- label: 发票送达或路由故障
  description: 发票未能抵达正确收件人——被归入垃圾邮件、发送到已更改的邮件地址或错误部门——导致在正式处理开始之前就产生排队延误。
- label: 支付平台验证暂扣
  description: 自由职业者的款项被银行或平台方列入额外验证或反欺诈审查，在客户内部审批流程之外独立增加了处理天数。
