variants:
  HL:
    distractor: 我突然意识到，投诉空白图表的时间点，恰好和我们搬到新楼层并换上崭新外接显示器的时间完全吻合——整个部门在周五打包搬家，周一就开箱用上了亮闪闪的新屏幕。
    diagnosticity: low
    salience: high
    proposition: The blank charts started appearing right after the team was moved
      to a new floor with new monitors.
    salience_source: B/C — a confident first-person timeline pinning the symptom to
      a concrete, recent workplace change.
    why_plausible: A move plus new hardware is a big visible change, so it is tempting
      to treat as the trigger when complaints surface afterward.
    why_irrelevant: A different floor and new monitors cannot alter which JavaScript
      a browser blocks; the split tracks browser extensions, not desks or displays.
  LL:
    distractor: 空白图表的问题，大约是在团队搬到新楼层、换上新显示器前后开始出现的。
    diagnosticity: low
    salience: low
    proposition: The blank charts started appearing right after the team was moved
      to a new floor with new monitors.
    matched_to: HL
  HH:
    distractor: 在一台受影响的笔记本电脑上，控制台显示图表包的请求被内容过滤器拦截，请求根本没有到达网络层。该包的服务路径包含「analytics」字样，常见广告拦截列表会匹配这个路径，因此开启了拦截器的用户恰好丢失了这一个脚本，而数据
      API 依然能正常加载。
    diagnosticity: high
    salience: high
    proposition: For affected users the browser console shows the charting bundle
      request blocked by a client-side filter, and the bundle is served from a path
      containing the word "analytics" that ad-block lists match.
    salience_source: The console block and the literal 'analytics' path make the client-filter
      mechanism concrete and reproducible.
  LH:
    distractor: 受影响的浏览器显示图表包的请求被客户端过滤器拦截；该包的服务路径包含「analytics」字样，正好被广告拦截列表匹配。
    diagnosticity: high
    salience: low
    proposition: For affected users the browser console shows the charting bundle
