domain: technical_troubleshooting
complexity: medium
xbase: 我们内部分析仪表盘上的图表，对部分团队成员显示空白，而另一些人却能正常查看。页面本身可以加载，数据 API 返回 200 状态码及有效的 JSON，服务器也没有报错。看到空白的同事坚称自己什么都没改，强制刷新也无济于事。本季度我们没有更换过图表库。{DS}
focal_diagnostic_feature: 对于受影响的用户，浏览器控制台显示图表包的请求被客户端过滤器拦截，而该包的服务路径包含「analytics」字样，正好被广告拦截列表匹配。
low_diagnostic_proposition: The blank charts started appearing right after the team
  was moved to a new floor with new monitors.
oracle_action: ANSWER
oracle_focus: Rename or reverse-proxy the charting bundle off the "analytics"-matching
  path (or whitelist it); ad-block/content filters are blocking that script for the
  affected browsers, which is why the API succeeds but charts stay blank.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a floor move or new monitors to blank
  charts. Ask what the affected users' browser console shows and whether any script
  request is blocked.
