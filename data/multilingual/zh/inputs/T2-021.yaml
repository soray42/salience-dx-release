variants:
  HL:
    distractor: 让我印象深刻的是，错误字符出现的时间恰好就在我用消毒湿巾擦过键盘之后；这个时间点对我来说太明显了，感觉就是直接原因。
    diagnosticity: low
    salience: high
    proposition: The wrong characters started appearing right after the keyboard was
      cleaned with a disinfectant wipe.
    salience_source: B/C — a confident first-person timeline tying the symptom to
      a specific, recent hands-on action.
    why_plausible: Cleaning a keyboard the night before a fault feels like the obvious
      culprit, since hands-on contact with the keys is easy to blame.
    why_irrelevant: Cleaning cannot remap which character a key produces; consistent
      symbol swaps across all apps are a software layout setting, not a hardware fault.
  LL:
    distractor: 错误字符是在用消毒湿巾清洁键盘之后开始出现的。
