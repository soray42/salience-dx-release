distractor_direction:
  label: 清洁／液体损坏
  description: 认为近期用消毒湿巾清洁键盘对硬件造成了损坏，从而导致按键错乱。
plausible_alternative_directions:
- label: 修饰键卡住
  description: 某个修饰键（如 Fn 键或大写锁定键）是否一直处于按下状态，导致输出字符异常。
- label: 键盘固件或驱动故障
  description: 键盘驱动程序或固件是否存在问题，在底层对输入进行了重新映射。
