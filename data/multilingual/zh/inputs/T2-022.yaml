xbase: 过去几周，我的车油耗明显变差了，我开始考虑换一辆新车。同样的通勤路程，我加油的频率比以前高多了。发动机运转正常，没有任何故障灯亮起，我的行驶路线和里程也没有改变。车就是变得很耗油。{DS}
