plausible_alternative_directions:
- label: 上游服务性能劣化
  description: 上游用户资料查询服务因数据库争用、慢查询计划或某个依赖项的瓶颈而独立出现性能下降，与代理超时无关。
- label: 负载均衡器配置错误
  description: 负载均衡器的设置（超时值、健康检查阈值或路由规则）近期发生了变更，导致提前放弃上游连接。
- label: 下游依赖锁定
  description: 该端点新增了对某个缓慢或被锁定的外部服务的依赖，例如近期出现性能退步的只读副本或第三方调用。
