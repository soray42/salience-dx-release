distractor_direction:
  label: CUDA驱动版本不匹配
  description: 调查已安装的CUDA驱动版本是否错误或不兼容，从而导致训练速度下降。
plausible_alternative_directions:
- label: 未启用混合精度
  description: 当前任务使用全精度训练，而对比运行使用了混合精度。
- label: batch size不一致
  description: 本地运行使用了不同的有效batch size或梯度累积设置。
- label: CPU预处理瓶颈
  description: 数据解码或预处理在张量到达GPU之前就已饱和。
