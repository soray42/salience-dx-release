xbase: 我们的React Native应用在iOS上崩溃，每次发生在用户打开某个特定页面时——该页面用于展示用户上传的图片。同一页面在Android上通常不会崩溃。{DS}
focal_diagnostic_feature: 'iOS崩溃日志显示「Memory pressure: terminated」，且该页面以全分辨率加载4000x3000的图片。'
low_diagnostic_proposition: A senior engineering leader says native bridge serialisation
  should be treated as the main cause of iOS React Native crashes.
oracle_action: ANSWER
oracle_focus: Downsample/cache images appropriately; the crash is an iOS memory-pressure
  termination from full-resolution image loading.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not take the CTO's bridge explanation without logs.
  Ask for the iOS crash reason and image dimensions/loading behaviour.
