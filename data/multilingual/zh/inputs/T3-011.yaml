distractor_direction:
  label: 隐私清单缺失
  description: App Store 拒绝是由于 PrivacyInfo.xcprivacy 隐私清单文件缺失或不完整所致，Apple 自 2024 年起已将其列为必需项，且其已被记录为审核拒绝的常见来源。
plausible_alternative_directions:
- label: 元数据或截图不匹配
  description: 拒绝原因是 App Store Connect 元数据违规，例如截图展示了提交版本中不存在的功能（准则 2.3），这是一个独立且常见的拒绝原因。
- label: 能力声明缺失
  description: 某个必需的权限或能力（例如推送通知、iCloud 访问）存在于二进制文件中但未在 App Store Connect 中声明，从而触发与崩溃无关的政策违规。
- label: 第三方 SDK 违反政策
  description: 捆绑的第三方 SDK 违反了当前 App Store 政策（例如使用了指纹识别 API 或已废弃的私有框架），与应用自身代码或崩溃行为无关地导致了拒绝。
