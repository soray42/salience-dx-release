xbase: 我的 iOS 应用已经两次未通过 App Store 审核，每次提交后我都收到了 Apple 正式的拒绝信。这些信件内容详尽具体；我把它们分享到了团队的
  Slack 频道，以便团队在决定下一步行动之前能够阅读。我们的高级架构师 Kwame 在几分钟内就回复了，却没有要求查看这些信件。{DS}
