distractor_direction:
  label: PgBouncer 连接池
  description: 该假设认为 PgBouncer 连接池配置是导致每晚复制延迟峰值的原因。PgBouncer 运行在客户端到主库的连接层，在机制上无法影响流复制吞吐量。
plausible_alternative_directions:
- label: 检查点写入压力
  description: 02:15 触发的大量检查点——由此前写入活动积累的脏页引起——导致主库 I/O 饱和，减慢 WAL 刷盘速度，从而延迟向备库的投递。
- label: 热备库查询冲突
  description: 热备库上的长时间读查询在 02:15 与 WAL 应用产生冲突，导致备库暂停应用（max_standby_streaming_delay），即使主库运行正常也会产生
    replay_lag。
- label: WAL 归档瓶颈
  description: archive_command 在 02:15 缓慢或阻塞——例如 NFS 挂载缓慢或存在竞争的备份作业——导致 WAL 段在主库上排队，备库无法及时接收。
