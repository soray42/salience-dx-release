- label: 构建压缩差异
  description: 生产环境专用的压缩器或后处理器是否以与开发环境不同的方式删改或重写了样式。
- label: 资源路径/加载顺序不匹配
  description: 样式表在生产环境中是否以不同的顺序或路径加载，从而改变了CSS层叠关系。
  changing the cascade.: null
