xbase: 一个连接三张表的 Postgres 查询只返回几百行，却需要大约 4 秒。最大的表有约 1200 万行，连接列上存在索引。{DS}
focal_diagnostic_feature: EXPLAIN ANALYZE 显示对 1200 万行的表进行了顺序扫描，且统计信息已有六个月未分析更新。
low_diagnostic_proposition: The database administration interface has an old visual
