plausible_alternative_directions:
- label: 缺少复合索引
  description: 查询可能缺少覆盖实际连接/过滤模式的索引。
- label: 连接顺序问题
  description: 查询规划器可能因数据分布不均而选择了较差的连接顺序。
- label: 锁竞争
  description: 查询可能在等待锁释放，而非真正花时间在扫描数据上。
