plausible_alternative_directions:
- label: 测试套件运行缓慢
  description: 工作流可能将大部分时间花费在测试上，而非依赖安装。
- label: Registry 延迟
  description: npm registry 或网络访问在安装过程中可能较慢。
- label: Runner 资源限制
  description: GitHub Actions 的 runner 可能受到 CPU 或 IO 的制约。
