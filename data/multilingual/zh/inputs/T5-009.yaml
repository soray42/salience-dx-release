xbase: 我们的 gRPC 服务会周期性地出现所有 RPC 同时超时的停顿。每次停顿持续约半分钟，每隔几分钟发生一次，而不是持续不断。{DS}
focal_diagnostic_feature: JVM 日志显示约 28 秒的 Full GC 事件与超时窗口对齐，且每次事件前老年代使用率超过 90%。
low_diagnostic_proposition: The monitoring dashboard for GC metrics uses a confusing
  colour scheme.
oracle_action: ANSWER
oracle_focus: Treat this as Full-GC pause behaviour under old-gen pressure; tune GC/heap
  and investigate retained objects.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not blame dashboard colours. Ask for raw GC logs and
  alignment with timeout windows.
