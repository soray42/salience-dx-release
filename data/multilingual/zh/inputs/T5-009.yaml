distractor_direction:
  label: GC 面板可读性
  description: 调查令人困惑的 GC 面板视觉效果或标签重叠是否能解释感知到的服务停顿。
plausible_alternative_directions:
- label: 线程池耗尽
  description: RPC 可能因请求处理线程饱和而超时。
- label: 下游依赖阻塞
  description: 某个依赖项可能周期性地阻塞所有 RPC。
- label: 网络分区
  description: 周期性的网络或负载均衡器问题可能导致同步超时。
