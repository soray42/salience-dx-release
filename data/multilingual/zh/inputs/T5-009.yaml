variants:
  HL:
    distractor: GC 监控面板几乎没法看：黄色背景上显示橙色曲线，线条重叠时标签就消失了。
    diagnosticity: low
    salience: high
    proposition: The monitoring dashboard for GC metrics uses a confusing colour scheme.
    salience_source: ugly chart colours and visual confusion
    why_plausible: A bad chart can make the measurement itself feel unreliable.
