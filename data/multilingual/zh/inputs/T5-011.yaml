distractor_direction:
  label: 外观陈旧意味着数据不可信
  description: 仪表盘在视觉上过时、布局杂乱被作为其显示的指标值不可靠的证据，将表面美观与数据管道的正确性混为一谈。
plausible_alternative_directions:
- label: 仪表盘数据源配置错误
  description: 仪表盘可能查询的是错误的命名空间、环境或时间范围，导致呈现的错误率与实时支付服务无关。
- label: 告警阈值校准不当
  description: 偏高的错误率可能反映的是正常流量波动触发了过于敏感的阈值，而非真正的服务降级。
