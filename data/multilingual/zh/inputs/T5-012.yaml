- label: 存储层损坏
  description: 底层磁盘或网络存储卷可能独立于备份工具本身引入了数据损坏。
- label: 增量快照逻辑缺陷
  description: BackPulse 的增量备份算法可能在备份阶段不触发错误的情况下包含了陈旧或不正确的文件版本。
