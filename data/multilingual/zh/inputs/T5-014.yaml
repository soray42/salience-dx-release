distractor_direction:
  label: UI 美观度预示计算错误
  description: 这款预算工具杂乱、过时的界面被视为其计算逻辑不可靠或不正确的证据。
plausible_alternative_directions:
- label: 税率表过时
  description: 该应用可能使用了上一年度过时的税率级距、标准扣除额或税率表，无论界面是否精美，都会得出与当前年度规则不符的结果。
- label: 数据录入转录错误
  description: 用户可能在应用中输入了错误的收入或扣除项数据，导致计算出的退税额与正确申报应得的金额不符。
