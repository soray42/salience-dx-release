variants:
  HL:
    distractor: 我的邻居 Petra 在过去五年里搬过三次家，她看了两家公司的网站后告诉我，A 公司的网站看起来现代感和精致程度都远胜 B 公司。
    diagnosticity: low
    salience: high
    proposition: 'Company A has a more modern and professional-looking website than
      Company B.

      '
    salience_source: 'A: source credibility (neighbor with repeated moving experience
      framed as a knowledgeable repeat consumer); C: confident assertion ("told me");
      D: concrete detail about the source''s context ("moved three times in the past
      five years").

      '
    why_plausible: 'Website quality is a common proxy heuristic for business quality;
      a credible source invoking it explicitly gives the inference a confident endorsement
      that a busy reader may accept without checking the underlying logic.

      '
    why_irrelevant: 'Website aesthetics have no causal pathway to insurance coverage
      levels or customer service outcomes; the user has already obtained the direct
      evidence (insurance certificates, spoken references) that makes the proxy superfluous.

      '
