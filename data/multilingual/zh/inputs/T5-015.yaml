distractor_direction:
  label: 以网站美观度作为质量代理指标
  description: A 公司网站的视觉现代感和精致程度被视为 A 公司运营更专业、更可靠的证据，暗示应优先选择 A 公司而非 B 公司。
plausible_alternative_directions:
- label: 报价价格差异
  description: 书面报价的总费用可能存在显著差异，若某家公司在相同服务范围内报价大幅偏低，这可能成为决定性因素。
- label: 公司资历与投诉记录
  description: 营业年限、许可资质，或消费者保护机构的正式投诉记录，可提供情景中未提及的独立可靠性信号。
