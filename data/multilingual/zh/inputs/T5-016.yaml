  notes: 'Stripped: no effort descriptor ("after reviewing for hours"), no tunable

    value (no specific AUM figure attributed to Ingrid''s bank or observation),

    no severity claim about the case, no sensory environment detail. The

    phrase "office fit-out, the pitch deck production quality" names aesthetic

    elements already present in xbase — it is the SOURCE paraphrasing what she

    saw, not adding new case facts. Ratio 42:19 = 2.2:1, within the 4:1 cap.

    "Marco" (T1-001) was noted as already used; "Ingrid" is a fresh name.

    xbase repair (cell-integrity 2026-06-11): removed the specific fee figure

    (1.8% AUM), multiplier (35x), and ten-year performance numbers (5.2% vs

