    distractor: 说实话，这个界面太粗糙了——褪色的灰色面板、像素化的锯齿图标、字体直接从老式安装向导里扒出来——整个东西就是弃坑软件的既视感，一款连外观都不打理的工具，随随便便误报个警告也不奇怪。
    diagnosticity: low
