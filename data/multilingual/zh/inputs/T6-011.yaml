distractor_direction:
  label: 重启家用路由器即可解决
  description: 用户过去通过重启家用路由器解决机器人音效的个人经历，暗示本次问题同样由路由器状态或家庭网络拥塞引起。
plausible_alternative_directions:
- label: CPU 热降频
  description: 笔记本 CPU 经过一天的运行后温度升高，到晚间触发降频，导致音频编解码器的实时处理性能下降，产生本地音频采集的机器人失真。
- label: 音频驱动或软件故障
  description: 驱动程序缺陷、近期修改的音频配置，或后台冲突的音频进程导致麦克风输入管道异常，症状仅在系统长时间运行后出现。
- label: 电源管理配置变更
  description: 夜间自动切换到省电或低功耗模式，降低了 CPU 和音频子系统的优先级，导致音频采集管道丢帧，产生机器人失真。
