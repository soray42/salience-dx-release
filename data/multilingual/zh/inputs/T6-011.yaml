causal_audit:
  steelman: 'Evening home network congestion is one of the most common causes of

    robotic VoIP audio: residential ISPs throttle bandwidth during peak

    hours (7-10 PM), causing packet loss and jitter that forces codecs

    such as Opus into artifact-heavy error-concealment modes. The router

    itself may accumulate a degraded NAT table or suffer a firmware

    memory leak after days of uptime, both of which can be resolved by

    a restart. A senior network engineer would place "check for evening

    packet loss and reboot router" near the top of any home-network

    VoIP troubleshooting checklist. The user''s multi-year track record

    of router-restart success provides inductive support for the same

    diagnosis now.

    However: the xbase explicitly states that a locally recorded voice

    memo captured offline at the same hour also sounds robotic. No

    network state — router memory, ISP congestion, packet loss, jitter —

    can affect audio that is recorded locally without any network

    involvement. The distortion is present before packetisation, which

    is physically incompatible with a network or router cause. The

    steelman''s mechanism is valid in general but is foreclosed by the

    offline recording evidence present in xbase.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'The xbase states "I recorded a short voice memo offline
    on the same laptop at that hour and it sounded equally robotic." Because local
    recording requires no network connection, any router or ISP pathway is physically
    impossible for this specific episode.

    '
