causal_audit:
  steelman: 'A competent AV or smart-TV technician could argue: smart TV operating

    systems (Tizen, webOS, Android TV) accumulate corrupted cache, broken

    manifest files, or stale CDN tokens in streaming apps over time. This

    degradation can manifest as buffering that is selective by app or

    time-of-day if a background refresh process runs at fixed intervals. If

    the user''s past factory-resets fixed the same symptom, that is inductive

    evidence the TV''s internal state can be the cause. Even if the uplink is

    also under load from another device, a degraded TV app might fail to

    handle mild congestion that a healthy app would buffer through gracefully —

    so both problems could coexist, and the past-reset pattern is not

    irrelevant. A technician might plausibly say: "Rule out the TV''s app state

    first since you have a proven fix; then look at network load."

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'The focal feature closes the distractor''s pathway decisively:
    if the router''s traffic monitor shows a different device consuming nearly all
    of the uplink during exactly those hours, the congestion is exogenous to the TV.
    A factory reset cannot release bandwidth consumed by a separate device. The coexistence
    argument in the steelman would apply only if the TV were also misbehaving, but
    the router data attributes the uplink saturation entirely to the other device
    — making TV-internal state a dormant hypothesis unsupported by any of the observable
    evidence. The structural difference between the past cases (no other device implicated;
    reset fixed it) and the present case (another device identified as the uplink
    consumer) is precisely what the focal feature exposes, satisfying I3.

    '
