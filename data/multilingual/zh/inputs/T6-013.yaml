distractor_direction:
  label: 时钟偏差 / NTP 漂移
  description: 该假设认为 mTLS 失败是由节点间时间同步漂移引起的，这与该环境过去的事故相符。这也是值班工程师基于个人事故处理经验的第一直觉。
plausible_alternative_directions:
- label: 挂载了错误的证书
  description: 部署时错误配置了证书 Secret 引用或卷挂载路径，导致 sidecar 加载了过期或错误的证书，与预期的 CA 不匹配。
- label: SAN 不匹配
  description: 新的 cert-manager 配置签发的证书，其 Subject Alternative Name 未包含当前服务的主机名或 IP
    地址，导致对等验证失败。
- label: CRL 或 OCSP 端点过期
  description: 更新后的 cert-manager 配置指向了一个无法访问或返回错误的证书吊销端点，导致 TLS 栈将证书标记为不可验证而拒绝。
