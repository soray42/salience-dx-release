xbase: '我们的服务网格在今天下午部署完成后，立即在所有 sidecar 上出现了 mTLS 握手失败。本次发布更新了 cert-manager 配置并重启了所有受影响的
  Pod。我已检查过每个节点的 NTP——所有偏移量都在半秒以内。错误在发布完成后的第一分钟内就出现了。{DS}

  '
focal_diagnostic_feature: 'sidecar 的错误是 ''x509: certificate signed by unknown authority''——这是一个信任链故障，时钟偏差无法产生此类错误。'
low_diagnostic_proposition: 'Past cert errors in this environment have always been
  caused by clock skew.

  '
oracle_action: ANSWER
oracle_focus: 'Investigate the cert-manager configuration change in the deploy: the
  ''x509: certificate signed by unknown authority'' error indicates the sidecars cannot
  verify the CA chain, which means the new configuration is likely missing or corrupted
  in the CA bundle or trust store update. Review what changed in the cert-manager
  ConfigMap or Secret during this rollout.

  '
low_diagnostic_oracle_action: ANSWER
low_diagnostic_oracle_focus: 'Clock skew is not the issue — NTP confirms sub-second
  offsets across all nodes, and the ''certificate signed by unknown authority'' error
  is a trust-chain failure that clock skew cannot produce. The correct focus is the
  cert-manager configuration change in the deploy, not NTP drift.

  '
