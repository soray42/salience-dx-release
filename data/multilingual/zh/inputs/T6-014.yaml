distractor_direction:
  label: 过度浇水导致菌蚊
  description: 植物主人根据多次菌蚊的历史经验，认为本次侵染与以往相同，因此采用黄色粘虫板和减少浇水的方案处理，而非先检查当前症状。
plausible_alternative_directions:
- label: 蓟马侵染
  description: 蓟马是常见的室内植物害虫，会造成银色点状斑纹和叶片变形；仅凭 xbase（反复出现病虫害、植物状态不佳），在仔细检查植物之前，蓟马是一个合理的候选诊断。
- label: 粉蚧侵染
  description: 粉蚧是常见的室内植物害虫，会导致萎蔫和褪色；在没有观察到蜘网的情况下，对于反复出现病虫害的混合植物收藏而言，粉蚧是另一个合理的备选诊断。
- label: 介壳虫侵染
  description: 介壳虫常侵染室内植物，导致植物逐渐衰退；作为反复、多株出现病虫害问题的合理候选，介壳虫有别于干扰项（菌蚊）和焦点方向（蜘蛛螨）。
