variants:
  HL:
    distractor: 我很了解这个规律：我的组合之前每次跑输基准——一共三次——最终显现出来的原因都是基金费用，每一次都是。
    diagnosticity: low
    salience: high
    proposition: 'The last three times this investor''s portfolio lagged its benchmark,
      fund fees were the cause.

      '
    salience_source: 'B (narrative coherence: clean first-person history with specific
      count), C (confident assertion: "I traced the lag back to fund fees"), D (concrete
      detail about past episodes: "three prior years").

      '
    why_plausible: 'Fund fees are a canonical cause of benchmark underperformance,
      and the investor''s own three-time track record of diagnosing fees gives the
      claim credibility and emotional familiarity — a busy reader pattern-matches
      to the well-known fees story.

      '
    why_irrelevant: 'The xbase explicitly discloses an expense ratio of 0.07%, essentially
      equal to the index tracker; there is no fee differential capable of explaining
      multi-year lag, so the past-experience pattern does not transfer to this case.

      '
  LL:
    distractor: 我的组合过去三次跑输基准，最终发现的原因都是基金费用。
    diagnosticity: low
    salience: low
    proposition: 'The last three times this investor''s portfolio lagged its benchmark,
      fund fees were the cause.

      '
    matched_to: HL
  HH:
    distractor: 我确认的目标配置是 60% 股票，但我已经超过两年没有再平衡了；那段时间股票市场表现强劲，所以我当前的股票实际权重约为 75–78%——大约比目标高出
      15–18 个百分点。
    diagnosticity: high
    salience: high
    proposition: 'The portfolio''s equity allocation has drifted approximately 15–18
      percentage points above the 60% target due to no rebalancing over two equity-bull
      years.

      '
    salience_source: 'C (confident self-report with precise figures), D (concrete
      measurable detail: specific current weight range, specific target, specific
      drift magnitude).

      '
  LH:
    distractor: 两年多没有再平衡之后，我的股票配置已经漂移至约 75–78%——比我 60% 的目标大约高出 15–18 个百分点。
    diagnosticity: high
    salience: low
    proposition: 'The portfolio''s equity allocation has drifted approximately 15–18
