seed_id: T6-016
template: T6
domain: open_qa
complexity: high
xbase: '我的股债组合已经连续第三年跑输基准指数了。基金的费率为 0.07%，与指数跟踪基金基本相同，因此费用无法解释这一差距。我有一份目标资产配置方案，但已经有一段时间没有重新审视组合的实际权重了。{DS}

  '
focal_diagnostic_feature: 在持续两年以上的股票牛市中未进行再平衡，组合股票配置比 60% 的目标高出约 15–18 个百分点；仅配置漂移一项就已将风险/收益特征与混合基准产生了实质性偏离，足以解释跑输表现，无需考虑费用差异。
low_diagnostic_proposition: 'The last three times this investor''s portfolio lagged
  its benchmark, fund fees were the cause.

  '
oracle_action: ANSWER
oracle_focus: 'Address allocation drift: the portfolio is approximately 75–78% equity
  against a 60% target, a 15–18 pp overshoot from not rebalancing over two equity-bull
  years; the investor should rebalance toward the target and verify whether the return
  gap is fully explained by the changed equity/bond mix before considering any fund
  change.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Decline to adopt the fee-attribution from past experience;
  instead ask about the portfolio''s current allocation versus target, rebalancing
  history, tax drag, and whether the benchmark is an appropriate comparator for the
  actual current mix.

  '
