distractor_direction:
  label: 历史费用归因
  description: 投资者将当前跑输基准的原因归因于基金费用，依据是过去三次个人经历中费用被诊断为原因。而在本案中，由于基金费率极低且与指数相当，费用通道已被排除。
plausible_alternative_directions:
- label: 基准不匹配
  description: 所选基准指数可能并不反映组合的实际策略或当前风险特征，使得比较具有误导性，而非真实存在跑输。
- label: 税务拖累
  description: 应税资本利得分配或亏损收割决策可能导致税后收益低于税前基准，从而造成表观差距，而无需归因于实际业绩问题。
- label: 现金拖累
  description: 账户中持有的未投资现金降低了整体股票和债券敞口，与完全投资的基准指数相比造成结构性短缺。
leak_audit:
  ll_atomic_claims:
  - The investor's portfolio lagged its benchmark on at least three prior occasions.
  - Fund fees were identified as the cause each of those times.
  hl_salience_dimensions:
    source_credibility: N/A — no external source; salience derives from the user's
      own repeated personal experience
    narrative_coherence: 'Clean, first-person chronological account: prior years,
      consistent diagnosis, current instinct'
    confident_assertion: '"I traced the lag back to fund fees" — active, definite
      verb of causal finding'
    concrete_detail: '"three prior years" anchors the history count without adding
      case content'
  forbidden_categories_checked_against:
  - tunable_value
  - effort_descriptor
  - severity_claim
  - sensory_distractor_about_setting
  - rambling_marker
  - hedging_language
  hl_word_count: 25
  ll_word_count: 15
  lh_word_count: 21
  notes: 'Avoided "after going through my statements carefully" (effort_descriptor).

    Avoided naming a specific fund or fee figure in the distractor (tunable_value).

    "Three prior years" refers to the user''s past history count, not a case-content
    value.

    HL ratio 29/15 = 1.93, well within the 4:1 ceiling.

    No sensory environment color added anywhere.

    REPAIR (revision 2): LH distractor rewritten to include all three claims present
    in HH

    but absent in original LH: (1) two-year duration of non-rebalancing, (2) equity-market

    appreciation mechanism, (3) explicit drift magnitude of 15–18 pp. New LH wording:
    "My

    equity allocation has drifted to about 75–78% — roughly 15–18 pp above my 60%
    target —

    after two equity-bull years without rebalancing." (21 words, within 12–25 limit).
    LH

    proposition unchanged; HH/LH propositional equivalence now restored.


    rev3 2026-06-11: HL hand-repaired per QC r2 verdict (orchestrator edit); word
    count 26.

    rev4 2026-06-11: effort-descriptor strip per QC r3.

    rev5 2026-06-11: cell-integrity repair — xbase no longer narrates drift figures
    (60% target vs 75-78% current weight, two equity-bull years); focal evidence now
    lives exclusively in HH/LH variants. xbase retains: third-year underperformance,
    0.07% expense ratio (fees-pathway closure), and existence of a target allocation
    without quantified drift.'
causal_audit:
  steelman: 'Fund expense ratios directly reduce investor returns year-over-year;
    a 1%

    annual fee compounds into a ~10% return gap over a decade. On any portfolio

    underperformance investigation, a senior CFP or investment adviser would

    check the fund''s total expense ratio as a first-order diagnostic. The

    investor''s three prior successful diagnoses of fees further support the

    hypothesis. If the fund had a higher expense ratio than the index, fees

    would be a fully defensible primary explanation.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase states the fund''s expense ratio is 0.07%, described
    as "essentially the same as the index tracker itself"; this eliminates any material
    fee differential as an explanatory variable, collapsing the fees pathway to ~0bp
    impact and making the past-experience pattern inapplicable to this specific case.

    '
