xbase: 我家浴室洗手盆排水很慢，我正准备拿出通管器自己清一下，就像我一贯处理的方式一样。目前还没有完全堵死，只是排水迟缓。这房子有些年头了，但我在这里从来没遇到过管道问题。我不想为这种自己十分钟就能搞定的事情花钱请水管工。{DS}
focal_diagnostic_feature: 使用洗手盆时马桶和浴缸同时出现倒灌，并伴随多处排水口的咕噜声——这些迹象表明堵塞位于共用的主下水道，而非某个单独存水弯。
low_diagnostic_proposition: Every drain clog the user has cleared before was a simple
  hair or debris clog in the trap, so this one is probably the same.
oracle_action: ANSWER
oracle_focus: Call a professional for the main line; backups and gurgling across the
  toilet, tub, and sink together point to a shared sewer-line blockage that a fixture
  drain snake cannot reach, not a local trap clog.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a simple trap clog from past experience.
