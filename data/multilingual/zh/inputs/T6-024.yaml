seed_id: T6-024
template: T6
domain: technical_troubleshooting
complexity: high
xbase: 过去五天，我们的服务间歇性地触发了上游支付API的速率限制。速率限制每次只影响一部分用户，而我们在总量上远低于合同约定的请求配额。分布式链路追踪显示没有由错误触发的重复调用。两周前，我们在支付流程中新增了一个缓存中间件。{DS}
focal_diagnostic_feature: 分布式链路追踪显示每个用户会话有4到5次上游支付API调用，而预期只有1次；缓存中间件的缓存键使用用户ID而非幂等性令牌，导致同一会话内的并发请求未被去重，全部到达上游。
low_diagnostic_proposition: Past rate-limit incidents for this service were caused
  by retry logic firing without adequate backoff, and the same may be happening now.
oracle_action: ANSWER
oracle_focus: Fix the caching middleware key to include the idempotency token so concurrent
  requests within a session are deduplicated before reaching the upstream payment
  API.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to retry-backoff as the cause without
  evidence. Ask for distributed tracing data showing upstream call counts per session
  and per-user rate-limit patterns.
