causal_audit:
  steelman: 'JPEG compression introduces lossy artifacts including blurring around
    edges, which

    can look similar to a resolution mismatch at first glance. If the previous errors

    produced similar-looking output, the user''s heuristic is grounded in a real mechanism.

    However, the current symptom is on-screen canvas rendering — no export is involved
    —

    and JPEG encoding only occurs when the canvas is serialised via toDataURL or toBlob.

    On-screen blurring from a format mismatch has no constructible mechanism: the
    browser

    renders the canvas bitmap directly to the display without involving image compression.

    The two failure modes are structurally separate and the past fix cannot apply
    here.

    '
  steelman_verdict: no_defensible_mechanism
