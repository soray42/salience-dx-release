oracle_action: ANSWER
oracle_focus: Multiply the canvas width and height attributes by window.devicePixelRatio,
  then scale the context down by the same factor using ctx.scale(); this aligns the
  bitmap to physical pixels and eliminates blurring on high-DPI screens.
