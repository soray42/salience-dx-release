seed_id: T1-003
template: T1
domain: open_qa
complexity: low
xbase: I came back to my car this morning and found broken glass near the driver's
  door. The laptop bag I had left on the back seat is no longer there. The car was
  parked overnight on a public street. {DS}
focal_diagnostic_feature: Multiple windows are smashed and the remaining cracked window
