distractor_direction:
  label: OEM device customizations
  description: 'The startup crash is caused by a device manufacturer''s custom Android
    skin or system-API modification that affects only certain handsets. The anecdote
    frames OEM-specific customizations as the confirmed root cause, mirroring the
    subset-of-users symptom pattern.

    '
plausible_alternative_directions:
- label: Release BuildConfig misconfiguration
  description: 'The release build flavor uses a different BuildConfig constant or
    API key that is invalid or missing, triggering an unhandled exception in onCreate
    before any explicit network call.

    '
- label: DI graph null binding in release
  description: 'The dependency injection graph (Dagger/Hilt) has a missing or null
    binding that is only absent in the release build configuration, causing a NullPointerException
    during application initialization.

    '
