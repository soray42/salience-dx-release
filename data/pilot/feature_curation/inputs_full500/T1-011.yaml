causal_audit:
  steelman: 'OEM-specific Android customizations are among the most well-documented
    causes

    of subset-of-users crashes on Android. Manufacturers including Xiaomi, Huawei,

    OPPO, and Samsung override system services, modify intent handling, restrict

    background processes, and in some cases alter class-loading behaviors in ways

    that diverge from AOSP contracts. A senior Android engineer seeing "crashes

    on a subset of users, never on developer devices" would put OEM fragmentation

    near the top of their differential: developers tend to use flagship or

    stock-Android devices (Pixel, Samsung Galaxy developer editions) with minimal

    customization, while production users span a wide OEM spectrum. The

    temporal match ("release-only") could even be explained if the OEM restriction

    fires only when the app is not signed with a debug keystore or not installed

    via ADB, which some OEM battery-optimization systems use as a heuristic.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase states explicitly that the debug build runs without
    issue "on the same handsets where the release build crashes." OEM customizations
    operate at the device/OS level and affect both build types identically on the
    same hardware; no OEM customization selectively targets the release APK while
    exempting the debug APK on the same device (any such distinction would be a build-type
    issue, not an OEM issue). The debug-on-same-device fact definitively closes the
    device-customization pathway.

    '
