domain: technical_troubleshooting
complexity: low
xbase: 'My smart thermostat is set to start heating at 6:30 AM on weekdays. Every
  morning I come downstairs to a cold house — the boiler never ran. But if I walk
  to the thermostat and manually call for heat, the boiler fires up within thirty
  seconds, no problem. I''ve checked the schedule in the app three times and it looks
  right: weekdays, 6:30 AM, 20 degrees. A colleague at work mentioned their thermostat
  used to do the same thing. {DS}

  '
focal_diagnostic_feature: 'The thermostat''s on-screen clock reads 11:32 when the
  actual local time is 06:32 — a five-hour ahead offset that matches UTC rather than
  the user''s local timezone, meaning the 6:30 AM schedule fires at 01:30 local time
  while the household is asleep and unaware.

  '
low_diagnostic_proposition: 'The acquaintance''s similar scheduling failure was resolved
  by replacing a faulty heating relay.

  '
oracle_action: ANSWER
oracle_focus: 'Diagnose the thermostat''s timezone/clock configuration; the schedule
  is executing at the wrong local time because the device is set to UTC instead of
  the user''s local timezone. Correct the timezone setting so the 6:30 AM schedule
  fires at the intended local time.

  '
low_diagnostic_oracle_action: ANSWER
low_diagnostic_oracle_focus: 'Investigate the thermostat''s scheduling configuration
  — check the internal clock, timezone setting, and whether the schedule days/times
  are correctly saved. Do not adopt the relay-replacement story from the acquaintance''s
  case as a diagnosis here, because if the relay were faulty the manual call-for-heat
  would also fail; the relay is demonstrably functional.

  '
