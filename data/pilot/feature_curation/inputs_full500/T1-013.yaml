distractor_direction:
  label: heating relay failure
  description: 'The acquaintance''s similar symptom (schedule not firing, manual works)
    was resolved by replacing a faulty heating relay/contactor, suggesting the user
    might have the same hardware fault.

    '
plausible_alternative_directions:
- label: schedule misconfiguration
  description: 'The schedule days, time, or temperature setpoint may be incorrectly
    configured in the app — for example, the schedule might be set only for certain
    days that do not include the current weekday, or the target temperature may be
    below the current room temperature.

    '
- label: thermostat firmware or app sync failure
  description: 'A failed firmware update or a broken sync between the mobile app and
    the thermostat''s local storage could leave the thermostat running stale or blank
    schedule data even though the app displays the schedule as correct.

    '
- label: hold or vacation mode active
  description: 'An active manual hold, vacation mode, or temporary temperature override
    set on the thermostat (or via the app) could be suppressing all scheduled events
    until the hold expires or is cleared.

    '
