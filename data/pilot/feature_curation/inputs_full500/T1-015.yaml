template: T1
domain: open_qa
complexity: low
xbase: 'My balcony tomato plants have had some leaves turning yellow over the past
  few weeks, even though I have kept to the same watering routine throughout. The
  soil stays consistently moist but never waterlogged, and the rest of the plant looks
  healthy and is still setting fruit. My next-door neighbour had a similar yellowing
  problem with their tomatoes last summer. {DS}

  '
focal_diagnostic_feature: 'The yellowing begins on the oldest, lowest leaves and progresses
  upward while new growth remains green — the definitive pattern of a mobile-nutrient
  (nitrogen) deficiency, which structurally excludes iron-uptake or pH problems that
  always present first on young upper leaves.

  '
low_diagnostic_proposition: 'Someone else''s tomato plants had lower-leaf yellowing
  caused by soil that was too alkaline, which blocked iron uptake.

  '
oracle_action: ANSWER
oracle_focus: 'The bottom-up progression from oldest to newest leaves is the textbook
  signature of nitrogen deficiency (a mobile nutrient the plant relocates upward).
  Recommend a nitrogen-rich liquid feed or balanced tomato fertiliser, and consider
  whether the container potting mix is depleted. The neighbour''s alkaline-soil/iron-lockout
  cause is excluded by symptom location: iron deficiency (immobile nutrient) always
  manifests first as interveinal chlorosis on the youngest, uppermost leaves, not
  on old lower leaves.

  '
low_diagnostic_oracle_action: ANSWER
low_diagnostic_oracle_focus: 'Acknowledge the neighbour''s anecdote but note it does
  not apply here: alkaline-soil iron lockout produces interveinal chlorosis on new
  upper growth, not uniform yellowing ascending from the oldest lower leaves. Ask
  about feeding history and potting mix age to identify whether the actual cause is
  nitrogen depletion, magnesium deficiency, or natural senescence, and give guidance
  based on that information.

  '
