distractor_direction:
  label: alkaline soil iron lockout
  description: 'The neighbour''s tomato yellowing was caused by soil pH rising too
    high, which prevented the plants from absorbing iron — a hypothesis the user might
    apply to their own case by analogy.

    '
plausible_alternative_directions:
- label: magnesium deficiency
  description: 'Magnesium is also a mobile nutrient that produces lower-leaf yellowing
    (often interveinal) in container tomatoes when depleted; a real differential diagnosis
    alongside nitrogen.

    '
- label: natural senescence
  description: 'Lower leaves on fruiting tomato plants naturally yellow and drop as
    the plant matures and redirects energy to fruit; the rate and extent distinguish
    this from a deficiency.

    '
- label: root restriction or compaction
  description: 'Balcony containers can become root-bound or develop compacted soil
    over a season, limiting nutrient and water uptake and causing lower-leaf yellowing
    even with a regular watering routine.

    '
