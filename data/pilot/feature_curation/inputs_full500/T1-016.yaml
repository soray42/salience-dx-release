distractor_direction:
  label: HELOC consolidation as strategy
  description: 'The suggestion that the correct action is to consolidate a home equity
    line of credit into a fixed-rate mortgage at renewal, as the colleague did. This
    direction treats the colleague''s consolidation experience as a transferable model
    for the user''s rate-type decision.

    '
plausible_alternative_directions:
- label: rate differential break-even analysis
  description: 'At a 0.7-percentage-point premium, the fixed rate becomes economically
    preferable only if variable rates rise by more than that margin before the end
    of the effective holding period; a practitioner would model how many rate increases
    break even.

    '
- label: employment contract income stability
  description: 'Both partners are on long-term employment contracts, reducing the
    probability of income disruption that would make variable-rate payments unmanageable;
    an advisor might weigh whether this stability favours accepting variable-rate
    risk.

    '
- label: 10-year lock-in horizon alignment
  description: 'A 10-year fixed term is unusually long; an advisor might assess whether
    the user''s life circumstances (family plans, career mobility, possible property
    upgrade) make a 10-year lock-in structurally appropriate or whether a shorter
    fixed term is preferable.

    '
