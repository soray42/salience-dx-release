seed_id: T1-016
template: T1
domain: open_qa
complexity: high
xbase: 'My mortgage is up for renewal in six weeks and I''m stuck between locking
  in a 10-year fixed or staying variable. Both my partner and I are on long-term employment
  contracts, and our combined income comfortably covers either payment scenario. The
  rate differential is 0.7 percentage points — fixed is higher. A colleague at work
  brought up their own renewal experience recently. {DS}

  '
focal_diagnostic_feature: 'The user holds no home equity line of credit or variable-rate
  debt secured against the property, removing any consolidation rationale from the
  decision and leaving the fixed-versus-variable choice to be resolved by the presented
  rate differential, income stability, and holding horizon.

  '
low_diagnostic_proposition: 'A colleague fixed their mortgage at renewal by rolling
  a home equity line of credit into a single consolidated fixed-rate product.

  '
oracle_action: ANSWER
oracle_focus: 'Evaluate fixed-versus-variable on the basis of the 0.7-percentage-point
  rate differential, the couple''s income stability, their indefinite holding horizon,
  and the absence of any variable-rate debt to consolidate; note that the colleague''s
  HELOC consolidation experience is structurally inapplicable and should not influence
  the rate-type decision.

  '
low_diagnostic_oracle_action: ANSWER
low_diagnostic_oracle_focus: 'Acknowledge the colleague''s experience but identify
  that it involved a HELOC consolidation absent from the user''s situation; address
  the fixed-versus-variable decision on the presented cash-flow facts alone without
  treating the anecdote as informative for this case.

  '
