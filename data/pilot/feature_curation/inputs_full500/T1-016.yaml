variants:
  HL:
    distractor: 'Priya — a financial analyst at a regional pension fund and easily
      the most financially literate person in our team — told me she had rolled her
      home equity line of credit into one consolidated fixed-rate mortgage at her
      renewal last year.

      '
    diagnosticity: low
    salience: high
    proposition: 'A colleague fixed their mortgage at renewal by rolling a home equity
      line of credit into a single consolidated fixed-rate product.

      '
    salience_source: 'A (source credibility): Priya is named, given a domain-relevant
      professional role (financial analyst at a pension fund), and positioned as the
      most financially literate person on the team; B (narrative coherence): clean
      single-clause report in professional register; C (confident assertion): "told
      me she had rolled" — direct, unhedged.

      '
    why_plausible: 'A financially literate colleague describing a concrete mortgage
      action at renewal sounds like directly applicable peer experience; a busy reader
      might assume the consolidation-plus-fix strategy is the recommended approach
      for anyone facing a similar renewal decision.

      '
    why_irrelevant: 'Priya''s decision was driven by the existence of a HELOC she
      needed to consolidate — a structural precondition the user does not share. Without
      a HELOC, the consolidation pathway does not exist and her experience offers
      no transferable lesson about the rate-type decision.

      '
