seed_id: T1-018
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: One end-to-end test in our suite has started failing intermittently, maybe
  one run in five. It asserts that a newly created invoice shows up under "due this
  week". The application code around invoices has not changed in a month, and the
  test passes reliably when I run it alone on my machine. On CI it fails seemingly
  at random, even when I pin the job to run that single spec by itself with no other
  tests sharing the process. {DS}
focal_diagnostic_feature: The test hardcodes a fixed due-date string, and it fails
  only on CI runs that start after 23:00 UTC, when "this week" has rolled into the
  next ISO week.
low_diagnostic_proposition: A comparable flaky test elsewhere was caused by tests
  sharing state when run in parallel.
oracle_action: ANSWER
oracle_focus: 'Fix the test''s time handling: the hardcoded due date crosses the week
  boundary late in the day, so make the fixture relative to a frozen clock rather
  than a literal date, rather than chasing parallelism.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the parallel-state explanation from another
  project. Ask when the failing runs occur and whether any date or time value in the
  test is fixed.
