distractor_direction:
  label: Parallel shared state
  description: Investigating whether tests running in parallel are clobbering shared
    database or fixture state, producing intermittent failures.
plausible_alternative_directions:
- label: CI environment drift
  description: Whether the CI image or seeded data differs from the local environment
    in a way that surfaces only on the runner.
- label: Async timing race
  description: Whether the assertion races ahead of an asynchronous write that has
    not yet committed when the test reads.
