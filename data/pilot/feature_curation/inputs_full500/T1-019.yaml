    why_plausible: The 'counteroffers are a trap' belief is widely repeated and sometimes
      true when a counter only patches pay, so it lands as conventional wisdom.
    why_irrelevant: Her outcome turned on loyalty distrust after a pay-only counter;
      it cannot tell us whether THIS written offer, which restructures the user's
      role, will be honoured.
