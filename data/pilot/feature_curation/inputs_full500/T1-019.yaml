plausible_alternative_directions:
- label: Burned bridge with new employer
  description: Whether reneging on the accepted external offer damages a relationship
    worth preserving.
- label: Root cause unresolved
  description: Whether the underlying problems would actually persist despite the
    counteroffer's promises.
