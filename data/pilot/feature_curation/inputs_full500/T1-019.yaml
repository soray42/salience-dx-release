seed_id: T1-019
template: T1
domain: open_qa
complexity: medium
xbase: I handed in my resignation after getting an external offer, and my current
  employer has come back with a counteroffer. They are matching the new salary and,
  more importantly to me, they say they will address the structural issues that made
  me want to leave. I genuinely like the work here when the conditions are right.
  I have three days to respond. {DS}
focal_diagnostic_feature: The counteroffer is in writing and concretely fixes both
  reasons the user wanted to leave — the team assignment and the reporting line —
  not only the pay.
low_diagnostic_proposition: An acquaintance who accepted a counteroffer was managed
  out of the company within a year.
oracle_action: ANSWER
oracle_focus: 'The counteroffer is reasonable to accept: in writing it addresses the
  actual drivers of the user''s departure (team and manager), not just salary, so
  the generic "counteroffers backfire" worry does not apply to these terms.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not generalise from one person's counteroffer going
  badly. Ask what the counteroffer actually changes and whether it addresses why the
  user wanted out.
