seed_id: T1-020
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Our semantic search quality fell off a cliff this sprint. Users report that
  results for ordinary queries are now nearly random, while exact keyword matches
  still surface fine. We upgraded the embedding model two weeks ago as part of a relevance
  push. The retrieval service, the ANN index type, and the query parser are all unchanged,
  and offline evaluation on a fresh holdout looks excellent. {DS}
focal_diagnostic_feature: Only documents re-embedded after the upgrade carry the new
  model's vectors; the bulk of the index still holds old-model vectors, and similarity
  is being computed across two incompatible embedding spaces.
low_diagnostic_proposition: A peer's search relevance regression was traced to a tokenizer
  change that altered how queries were split.
oracle_action: ANSWER
oracle_focus: Re-embed and reindex the entire corpus with the new model so the whole
  index lives in one embedding space; mixed old/new vectors make cross-space similarity
  meaningless, which is why fresh-holdout offline scores look fine.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not import the tokenizer-change explanation. Ask whether
  the full corpus was re-embedded after the model upgrade or only newly ingested documents.
cell_oracles:
  HL:
    action: ASK
    focus: Do not import the tokenizer-change explanation. Ask whether the full corpus
      was re-embedded after the model upgrade or only newly ingested documents.
  LL:
    action: ASK
    focus: Do not import the tokenizer-change explanation. Ask whether the full corpus
