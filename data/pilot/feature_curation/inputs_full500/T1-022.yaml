seed_id: T1-022
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: A nightly cron job that emails our team a sales digest silently stopped running
  about a week ago. No digest arrives, but there is no error in my application logs
  and the script runs perfectly when I execute it by hand. The crontab entry is still
  there and looks exactly as it always did. Nobody touched the schedule or the script,
  and df shows every partition well under 80% full. {DS}
focal_diagnostic_feature: The system auth log shows cron refusing to start the job's
  session with "account locked", and the dedicated service account was locked during
  a security-hardening pass eight days ago.
low_diagnostic_proposition: A colleague's cron job stopped running because a full
  disk prevented the daemon from writing its logs.
oracle_action: ANSWER
oracle_focus: Re-enable (or replace) the locked service account the cron job runs
  as, or move the job to a permitted account; PAM is refusing the cron session because
  the account was locked, which is why no script error appears.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a full-disk cause from another case. Ask
  what the system auth/cron logs show about the job's user account and recent account
  or permission changes.
