xbase: I am trying to trim my monthly subscriptions. I went through last year's card
  statement and listed everything recurring. I pay for two separate streaming services,
  a cloud storage plan, a music plan, a news site, and a meditation app. I want to
  cancel whatever I am genuinely not using rather than just guessing, and I have my
  actual usage history available to check. {DS}
focal_diagnostic_feature: The user's own viewing history shows one of the two streaming
  services was opened zero times in the last six months, while the other was used
  most weeks.
low_diagnostic_proposition: A friend regretted cancelling a streaming service because
  a show they later wanted moved exclusively to it.
oracle_action: ANSWER
oracle_focus: Cancel the streaming service the user's own history shows unopened for
  six months; keep the one used most weeks, and review the rest against actual usage
  the same way rather than against someone else's regret story.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let a friend's content-exclusivity regret decide
  it. Ask for the user's own usage history on each service before cancelling anything.
