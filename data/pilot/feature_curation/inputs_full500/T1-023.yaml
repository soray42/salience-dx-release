distractor_direction:
  label: Future-content lock-in regret
  description: Treating the risk that a future desired show moves exclusively to a
    cancelled service as the dominant reason to keep both streaming subscriptions.
plausible_alternative_directions:
- label: Bundle/annual discount check
  description: Whether switching either service to an annual or bundled plan changes
    the cost calculus before cancelling.
- label: Household shared use
  description: Whether someone else in the household uses the seemingly-idle service
    even if the user does not.
