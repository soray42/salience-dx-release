variants:
  HL:
    distractor: Renata, a platform engineer I trust from a previous job, told me her
      team chased similar 502s and it finally turned out to be an expired TLS certificate
      on the upstream service.
    diagnosticity: low
    salience: high
    proposition: A similar 502 problem at another company was traced to an expired
      TLS certificate on the upstream service.
    salience_source: A — a trusted platform engineer recounting a closely symptom-matched
      502 investigation.
    why_plausible: Certificate problems do cause gateway errors and the symptom-match
      (random 502s, nothing in app logs) makes the anecdote feel directly applicable.
    why_irrelevant: An expired upstream certificate fails handshakes consistently
      for the affected period, not one request in fifty with no pattern; the focal
      evidence ties the 502s to reused stale keep-alive connections, a different mechanism.
  LL:
    distractor: A similar 502 problem at another company was traced to an expired
      TLS certificate on the upstream service.
    diagnosticity: low
    salience: low
    proposition: A similar 502 problem at another company was traced to an expired
      TLS certificate on the upstream service.
    matched_to: HL
  HH:
    distractor: 'Packet captures show the 502s land exactly on requests where the
      load balancer reused an idle pooled connection the backend had already closed:
      the backend keep-alive idle timeout is shorter than the load balancer''s, so
      the balancer writes onto a half-dead socket and gets a reset.'
    diagnosticity: high
    salience: high
    proposition: The 502s occur only on requests where the load balancer reused an
      idle keep-alive connection whose upstream had already closed it, because the
      backend keep-alive timeout is shorter than the load balancer's.
    salience_source: The packet-level correlation to reused-closed connections plus
      the timeout ordering names the mechanism precisely.
  LH:
    distractor: The 502s fall only on load balancer connections reused after the backend
      closed them, because the backend keep-alive timeout is shorter than the balancer's.
    diagnosticity: high
    salience: low
    proposition: The 502s occur only on requests where the load balancer reused an
      idle keep-alive connection whose upstream had already closed it, because the
      backend keep-alive timeout is shorter than the load balancer's.
    matched_to: HH
distractor_direction:
  label: Upstream TLS certificate expiry
  description: Investigating whether an expired or invalid TLS certificate on the
    upstream service is causing the intermittent 502 Bad Gateway responses.
plausible_alternative_directions:
- label: Backend crash on specific requests
  description: Whether particular requests crash a worker so the load balancer sees
    a dropped connection.
- label: Load balancer health-check flapping
  description: Whether a backend intermittently fails health checks and is briefly
    pulled
  dropping in-flight requests.: null
