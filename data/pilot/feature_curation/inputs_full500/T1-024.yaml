seed_id: T1-024
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Our REST API intermittently returns 502 Bad Gateway to a fraction of clients,
  maybe one request in fifty, with no clear pattern by endpoint. The application servers
  behind the load balancer log nothing unusual for the affected requests, and overall
  traffic is well within capacity. We have not deployed new code or changed the load
  balancer configuration in the last two weeks. A quick check confirmed all backend
  TLS certificates are current and consistent across every instance. {DS}
focal_diagnostic_feature: The 502s occur only on requests where the load balancer
  reused an idle keep-alive connection whose upstream had already closed it, because
  the backend keep-alive timeout is shorter than the load balancer's.
low_diagnostic_proposition: A similar 502 problem at another company was traced to
  an expired TLS certificate on the upstream service.
oracle_action: ANSWER
oracle_focus: Align the keep-alive timeouts so the backend's idle timeout is longer
  than the load balancer's, or disable upstream keep-alive reuse; the load balancer
  is reusing connections the backend has already closed, producing the intermittent
  502s.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not import the other company's certificate-expiry
  explanation. Ask whether the 502s correlate with reused idle connections and how
  the backend and load balancer keep-alive timeouts compare.
