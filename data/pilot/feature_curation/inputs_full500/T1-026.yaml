distractor_direction:
  label: Validation-library tightening
  description: Investigating whether a JSON schema or request-validation library upgrade
    tightened constraints and is rejecting previously valid payloads.
plausible_alternative_directions:
- label: Client serialization change
  description: Whether a client library update started sending a malformed or differently
    encoded body that the server rejects.
- label: Content-Type mismatch
  description: Whether some clients send a Content-Type the route no longer accepts.
