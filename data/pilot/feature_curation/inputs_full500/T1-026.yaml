seed_id: T1-026
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Clients calling one POST endpoint on our REST API started getting 400 Bad Request
  responses for some requests since yesterday. The same payloads worked fine before,
  and a teammate calling the endpoint from a desktop HTTP tool gets a clean 200 every
  time. The application code handling the route has not changed, and the requests
  that fail look identical in the browser network tab. {DS}
focal_diagnostic_feature: The failing requests are the ones whose custom header name
  contains an underscore; the newly added reverse proxy drops underscore-named headers
  by default, so the app sees the required header missing and returns 400.
low_diagnostic_proposition: A comparable 400-error problem on another team was caused
  by a JSON schema validation library upgrade tightening field constraints.
oracle_action: ANSWER
oracle_focus: Enable underscore-in-header support on the reverse proxy (or rename
  the custom header to use hyphens); the proxy is silently stripping the underscore-named
  header the app requires, which is why those requests 400 while direct calls succeed.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the other team's validation-library-upgrade
  explanation. Ask what distinguishes the failing requests from the passing ones,
  especially headers and the path they take through any proxy.
