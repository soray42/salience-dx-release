xbase: I am reviewing my recurring expenses and looking at my cloud storage subscription.
  I currently pay for a 2 TB plan, which is the second-highest tier the provider offers.
  The bill is one of my larger monthly subscriptions, and I set it up years ago when
  I was archiving a big video project. I can see exactly how much storage I am actually
  using in the account dashboard. {DS}
focal_diagnostic_feature: The account dashboard shows the user is storing 180 GB total,
  comfortably within the provider's 1 TB tier, which costs roughly half of the 2 TB
  plan.
low_diagnostic_proposition: A relative downgraded their cloud storage plan and then
  lost access to syncing some files until they upgraded again.
oracle_action: ANSWER
oracle_focus: Downgrade to the 1 TB tier; the dashboard shows only 180 GB stored,
  well within that tier, so the lower plan covers actual use at roughly half the cost
  without affecting the stored files.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let a relative's downgrade trouble decide it.
  Ask how much storage the user is actually using relative to the lower tier's limit
  before downgrading.
