seed_id: T1-028
template: T1
domain: technical_troubleshooting
complexity: high
xbase: 'Customers of our payments REST API are occasionally seeing duplicate charges:
  the same order gets billed twice within a few seconds. It is rare, well under a
  percent of orders, and our payment processor confirms it received two distinct authorization
  calls for those orders. The application code that builds the charge request has
  not changed in months, and our database shows two separate charge rows for each
  affected order. In each case the two authorization timestamps are about ten seconds
  apart, consistent with a typical gateway timeout. {DS}'
focal_diagnostic_feature: The duplicates happen only when the first charge call hit
  a gateway 504 timeout; the client library automatically retried the POST, but the
  charge had actually succeeded, and the endpoint accepts no idempotency key to suppress
  the retry.
low_diagnostic_proposition: A similar double-charge issue at another company was caused
  by a race condition where two app threads processed the same order concurrently.
oracle_action: ANSWER
oracle_focus: Add idempotency-key support to the charge endpoint so retried POSTs
  after a 504 do not create a second authorization; the duplicates come from automatic
  client retries of requests that timed out at the gateway but had already succeeded.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the other company's concurrency-race explanation.
  Ask whether the duplicate charges follow a gateway timeout and a retry, and whether
  the endpoint enforces idempotency keys.
