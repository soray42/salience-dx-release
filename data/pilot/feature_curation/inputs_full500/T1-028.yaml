causal_audit:
  steelman: 'A senior backend engineer could argue that duplicate writes are most
    commonly a concurrency defect: an order

    enqueued twice, a missing unique constraint, or two workers racing on the same
    record will each issue a charge,

    producing exactly two rows seconds apart — so auditing locking, queue delivery,
    and idempotency at the data layer

    is the standard first response to phantom double-charges.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase notes that the two authorization timestamps for each
    duplicate are about ten seconds apart, consistent with a typical gateway timeout
    interval — a concurrent race would produce near-simultaneous calls, not a sequential
    gap of that length, making the race mechanism implausible from xbase alone.
