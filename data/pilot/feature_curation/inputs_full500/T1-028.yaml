variants:
  HL:
    distractor: Henrique, a staff engineer I trust from a fintech I used to work at,
      told me they had nearly identical phantom double-charges and it came down to
      a concurrency race where two worker threads picked up the same order and billed
      it at the same instant.
    diagnosticity: low
    salience: high
    proposition: A similar double-charge issue at another company was caused by a
      race condition where two app threads processed the same order concurrently.
    salience_source: A — a trusted staff engineer recounting a closely symptom-matched
      double-charge investigation.
    why_plausible: Concurrency races are a textbook source of duplicate writes and
      the symptom (two charge rows for the same order) fits, so it is a natural leading
      hypothesis.
    why_irrelevant: A thread race would produce two near-simultaneous calls; xbase
      shows the two authorizations are about ten seconds apart — consistent with a
      timeout interval, not concurrent threads — so the race mechanism is implausible
      from xbase alone.
  LL:
    distractor: A similar double-charge issue at another company was caused by a race
      condition where two app threads processed the same order concurrently.
    diagnosticity: low
    salience: low
    proposition: A similar double-charge issue at another company was caused by a
      race condition where two app threads processed the same order concurrently.
    matched_to: HL
  HH:
    distractor: 'Tracing shows every duplicate follows the same sequence: the first
      charge POST hit a 504 at the gateway, the client library automatically retried
      it, but the original charge had actually gone through; the endpoint accepts
      no idempotency key, so the retry simply created a second authorization.'
    diagnosticity: high
    salience: high
    proposition: The duplicates happen only when the first charge call hit a gateway
      504 timeout; the client library automatically retried the POST, but the charge
      had actually succeeded, and the endpoint accepts no idempotency key to suppress
      the retry.
    salience_source: The traced 504-then-retry sequence and the absent idempotency
      key name the exact duplication mechanism.
  LH:
    distractor: Each duplicate follows a 504 timeout and an automatic client retry
      of a charge that had already succeeded, with no idempotency key to suppress
      it.
    diagnosticity: high
    salience: low
    proposition: The duplicates happen only when the first charge call hit a gateway
      504 timeout; the client library automatically retried the POST, but the charge
      had actually succeeded, and the endpoint accepts no idempotency key to suppress
      the retry.
    matched_to: HH
distractor_direction:
  label: Concurrency race condition
  description: Investigating whether two application threads or workers process the
    same order concurrently and issue two charges.
plausible_alternative_directions:
- label: Duplicate webhook/event
  description: Whether a duplicated upstream event triggers the charge path twice
    for one order.
- label: Double form submission
  description: Whether the client UI submits the order twice from a single user action.
