xbase: I have an offer to join a company that would require me to relocate to another
  region, and I need to give an answer by Friday. The base pay is a clear step up
  from what I earn now, and the work is squarely in my field. I like where I live,
  but I have no lease I cannot break and no family tying me to this city. I keep hesitating
  because uprooting feels like a big swing. {DS}
focal_diagnostic_feature: The role is permanent at a profitable twenty-year-old firm,
  the signed contract includes a six-month severance clause, and the user's specialty
  is in demand in the new region too.
low_diagnostic_proposition: A friend relocated for a job and was laid off within a
  few months, regretting the move.
oracle_action: ANSWER
oracle_focus: On these facts the move is favourable; the role is stable, the contract
  carries strong severance protection, and the user's skills are portable, so accepting
  or negotiating from strength is reasonable.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let one friend's layoff story decide this. Ask
