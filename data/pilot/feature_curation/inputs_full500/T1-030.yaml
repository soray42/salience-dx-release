distractor_direction:
  label: Expired push certificate
  description: Investigating whether a lapsed or invalid push-notification certificate
    on the server is silencing message delivery.
plausible_alternative_directions:
- label: FCM topic/token churn
  description: Whether device push tokens are being invalidated or unregistered
  dropping the delivery target.: null
- label: Notification channel muted
  description: Whether the app's notification channel importance was lowered so messages
    arrive silently or deferred.
leak_audit:
  ll_atomic_claims:
  - Another shop had a similar missing-notification problem.
  - That problem was traced to an expired push certificate.
  hh_atomic_claims:
  - When the app is foregrounded or recently used, notifications arrive instantly.
  - The delivery gap only appears after the phone is idle.
  - The OS battery screen now lists the app as "Optimized" rather than "Unrestricted".
  hl_salience_dimensions:
    source_credibility: Named peer (Adebayo) who runs mobile at a partner studio recounting
      his own incident.
    narrative_coherence: Clean last-quarter, one-week chronology of his outage.
    confident_assertion: He 'swears' it is the usual culprit — confidence about the
      source's generic experience, allowed under C1.
    concrete_detail: Detail about the source's role and his own incident only — nothing
      about this app's present case.
  forbidden_categories_checked_against:
  - tunable_value
  - effort_descriptor
  - severity_claim
  - sensory_distractor_about_setting
  - rambling_marker
  - hedging_language
  xbase_word_count: 75
  hl_word_count: 46
  ll_word_count: 14
  hh_word_count: 42
  lh_word_count: 17
  notes: 'LL carries only the other-shop-expired-certificate claim; the named peer,
    his role, the "last quarter" timing

    and his "usual culprit" generalisation are HL-only and concern the source, not
    this app''s present case. xbase

    states symptoms (delayed pushes after idle, several models, iOS fine) but deliberately
    withholds the

    foregrounded-instant behaviour and the battery-setting label, so HL/LL cannot
    rule the certificate in or out.

    The decisive foreground-contrast and "Optimized" label live only in HH/LH. The
    iOS-fine line in xbase is a

    symptom, not the focal feature, and does not by itself defeat a certificate theory
    (separate certs per platform).

    '
causal_audit:
  steelman: 'A mobile engineer could argue an expired or rotated push certificate
    is a leading suspect: it silences

    notifications without code changes, can manifest gradually as cached tokens age
    out, and matches a problem that

    started without a backend deploy. The argument collapses against this case''s
    behaviour, though. An invalid

    certificate causes the push gateway to reject delivery outright, independent of
    whether the user has the app

    open; it cannot produce notifications that arrive instantly the moment the app
    is foregrounded and only stall

    after idle. That foreground-versus-idle split is a signature of on-device background
    suppression, not a

    server-side credential failure, so the certificate direction has no mechanism
    for this case.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the certificate pathway is closed by the focal feature
    (instant delivery while foregrounded) in HH/LH, not in xbase; xbase keeps only
    symptoms.
unconstructable: false
