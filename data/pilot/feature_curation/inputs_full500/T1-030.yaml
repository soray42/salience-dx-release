seed_id: T1-030
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Users of our Android app have started reporting that push notifications stop
  arriving after the phone sits idle for a while. Messages that should ping them in
  real time only appear hours later, or only once they open the app. This began over
  the last couple of weeks across several different device models, and we have not
  changed our notification backend or message format in that window. The same accounts
  get notifications fine on iOS. {DS}
focal_diagnostic_feature: When the app is open or was recently used, notifications
  arrive instantly; the OS battery settings now list the app as "Optimized" rather
  than "Unrestricted".
low_diagnostic_proposition: A similar missing-notification problem at another shop
  was caused by an expired push certificate.
oracle_action: ANSWER
oracle_focus: Treat this as background-delivery suppression by Android battery optimisation;
  the app is being prevented from holding its push connection while idle, so guide
  users to exempt it from battery optimisation and review background-work limits.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the expired-certificate story from another
  team. Ask whether notifications arrive when the app is foregrounded and what the
  per-app battery optimisation setting shows before diagnosing the push backend.
