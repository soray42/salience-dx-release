xbase: I have an external offer and I am leaning toward turning it down to stay where
  I am, mostly because my current salary is comfortable and leaving feels risky. The
  external company is reputable and the pay is similar to what I make now. I have
  been at my current employer for five years and I know the systems inside out. I
  keep telling myself the grass is not always greener, and I have until the end of
  next week to respond. {DS}
focal_diagnostic_feature: The external offer carries a senior title and ownership
  of a platform area the user has been denied internally for three years, while staying
  keeps them under the same manager who has repeatedly blocked that scope.
low_diagnostic_proposition: A friend left a great company for an outside offer, found
  the new place chaotic, and regretted leaving.
oracle_action: ANSWER
oracle_focus: Lean toward taking the external offer; it resolves the multi-year scope
  and title block that staying perpetuates under the same manager, which outweighs
  the comfort of familiarity at similar pay.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let one friend's bad outside move decide this.
