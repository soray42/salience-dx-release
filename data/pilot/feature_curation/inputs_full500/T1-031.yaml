causal_audit:
  steelman: 'A career advisor might argue the friend''s experience is genuinely informative:
    leaving a company you know well

    for an outside role trades known good conditions for unknown ones, and the friend''s
    slide into chaos shows how

    badly that bet can go, which is a reason to weight staying. But that reasoning
    only holds if the new employer''s

    conditions are actually unknown and the current ones are actually good. The friend''s
    chaos occurred at a

    different company under different management; it provides no evidence about THIS
    offer''s title and scope or about

    the user''s own three-year scope block, which are the facts that determine whether
    leaving is the better move.

    '
