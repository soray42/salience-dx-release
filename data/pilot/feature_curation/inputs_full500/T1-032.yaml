  notes: 'LL carries only the other-app-lapsed-agreement claim; the named source,
    the conference, her team''s whole-base

    break and her triage rule are HL-only and concern the source, not this app''s
    present case. xbase states symptoms

    (restore fails, new purchases work, server-side validation, version-agnostic)
    but withholds the

    App-Store-versus-TestFlight split and the "Sandbox" environment field, so HL/LL
    cannot rule the agreement in or

    out. The "new purchases work" line in xbase is a symptom that narrows but does
    not alone defeat the agreement

    theory (a reader could imagine partial outages); the decisive build-split and
    Sandbox-environment facts live

    only in HH/LH.

    '
causal_audit:
  steelman: 'An iOS specialist could argue the lapsed-agreement direction deserves
    a top spot: Apple disables in-app purchase

    APIs across an account when the Paid Applications agreement lapses, the failure
    surfaces with no code change, and

    it can present as restores returning nothing. The steelman fails on this case''s
    evidence, though. An inactive

    agreement disables purchases and restores for every build and every user, yet
    here both new purchases and live

    App Store restores succeed, and failure is confined to TestFlight builds whose
    receipts carry a Sandbox

    environment. That pattern is a receipt-environment validation mismatch, not an
    account-level agreement lapse, so

    the agreement direction has no mechanism for this case.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the lapsed-agreement pathway is closed by the focal
    feature (App Store restores and new purchases work) in HH/LH, not in xbase; xbase
    keeps only symptoms.
