seed_id: T1-032
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Our iOS app sells a subscription, and a chunk of users say "Restore Purchases"
  does nothing — it spins and then reports that nothing was found to restore, even
  for people who clearly paid. New purchases seem to go through; it is mainly the
  restore path that fails. We validate receipts on our own server before unlocking
  the subscription. We have not changed our StoreKit code or our pricing in the last
  few releases, and the failures are not tied to one app version. {DS}
focal_diagnostic_feature: Restore works for users on the live App Store build but
  fails for everyone on TestFlight builds, where the receipt's environment field reads
  "Sandbox" while our server validates only against the production endpoint.
low_diagnostic_proposition: A comparable restore outage at another app was caused
  by a lapsed Paid Applications agreement.
oracle_action: ANSWER
oracle_focus: 'Fix receipt-environment handling: validate sandbox receipts against
  the sandbox endpoint (or fall back on the production endpoint''s sandbox status
  code), so TestFlight receipts are no longer rejected by production-only validation.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the lapsed-agreement explanation from the
  other app. Ask whether the failing users are on TestFlight versus the App Store
  build and what receipt environment the server sees before assuming an account-agreement
  problem.
