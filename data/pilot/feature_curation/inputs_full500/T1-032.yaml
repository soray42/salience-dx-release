  ll_atomic_claims:
  - Another app had a comparable restore outage.
  - That outage was traced to a lapsed Paid Applications agreement.
  hh_atomic_claims:
  - Restore succeeds for users on the live App Store build.
  - Restore fails for users on TestFlight builds.
  - On failure the receipt's environment field reads "Sandbox".
  - The server validates receipts only against the production endpoint.
  hl_salience_dimensions:
    source_credibility: Named senior iOS lead (Ngozi) recounting her own team's incident.
    narrative_coherence: Clean whole-user-base break to agreement-lapse discovery.
    confident_assertion: She 'insists' it is the first thing to check — confidence
      about her generic advice, allowed under C1.
    concrete_detail: Detail about the source (conference acquaintance, her team's
