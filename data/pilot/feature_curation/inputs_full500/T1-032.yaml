  LH:
    action: ANSWER
    focus: 'Fix receipt-environment handling: validate sandbox receipts against the
      sandbox endpoint (or fall back on the production endpoint''s sandbox status
      code), so TestFlight receipts are no longer rejected by production-only validation.'
variants:
  HL:
    distractor: Ngozi, a senior iOS lead I know from a conference, said her team had
      restores silently break across their whole user base and it turned out their
      Paid Applications agreement had lapsed in App Store Connect; she insists that
      agreement is the first thing to check when purchases fail.
    diagnosticity: low
    salience: high
    proposition: A comparable restore outage at another app was caused by a lapsed
      Paid Applications agreement.
    salience_source: A — a named senior iOS lead recounting her own team's incident
      gives the lapsed-agreement theory expert authority.
    why_plausible: A lapsed Paid Applications agreement really does disable in-app
      purchase functionality, so an expert pointing to it as the first check feels
      like solid triage.
    why_irrelevant: A lapsed agreement disables purchases account-wide for every build;
      here new purchases and live App Store restores still work and only TestFlight
      restores fail, so the agreement is plainly active.
  LL:
    distractor: A comparable restore outage at another app was traced to a lapsed
      Paid Applications agreement.
    diagnosticity: low
    salience: low
    proposition: A comparable restore outage at another app was caused by a lapsed
      Paid Applications agreement.
    matched_to: HL
  HH:
    distractor: Restore succeeds for everyone on the live App Store build and fails
      only for users on TestFlight builds; when it fails, the receipt we receive carries
      an environment of "Sandbox", yet our server only ever validates receipts against
      the production endpoint.
    diagnosticity: high
    salience: high
    proposition: Restore works for users on the live App Store build but fails for
      everyone on TestFlight builds, where the receipt's environment field reads "Sandbox"
      while our server validates only against the production endpoint.
    salience_source: The exact App-Store-versus-TestFlight split plus the 'Sandbox'
      environment field against production-only validation makes the environment mismatch
      concrete.
  LH:
    distractor: Restore works on the App Store build but fails on TestFlight, where
      receipts read "Sandbox" while the server validates only against production.
    diagnosticity: high
    salience: low
    proposition: Restore works for users on the live App Store build but fails for
      everyone on TestFlight builds, where the receipt's environment field reads "Sandbox"
      while our server validates only against the production endpoint.
    matched_to: HH
distractor_direction:
  label: Lapsed Paid Apps agreement
  description: Investigating whether an expired or unsigned Paid Applications agreement
    in App Store Connect has disabled in-app purchase functionality.
plausible_alternative_directions:
- label: Receipt-refresh failure
  description: Whether SKReceiptRefreshRequest is failing so the device never presents
    a valid receipt to restore against.
- label: Product-ID mismatch
  description: Whether the restored transactions reference product identifiers the
    current build no longer maps to an entitlement.
