xbase: My manager has offered to promote me into a team-lead role, and I have to give
  an answer this week. It comes with a noticeable raise and it is something I actually
  asked for after enjoying the informal mentoring I already do. Part of me worries
  that stepping up means losing the hands-on work I love to endless meetings. I keep
  replaying a cautionary story a friend told me and second-guessing whether I really
  want this, though the offer does include a written hands-on-time commitment. {DS}
focal_diagnostic_feature: The promotion comes with a written agreement protecting
  fifty percent hands-on engineering time and a twenty-five percent raise, and the
  user requested it after a year of mentoring they have enjoyed.
low_diagnostic_proposition: A peer took a management role, burned out, and hated losing
  all of their hands-on work.
oracle_action: ANSWER
oracle_focus: Lean toward accepting; the role is something the user wanted, includes
  a written guarantee of half their time on hands-on work, and carries a meaningful
  raise, so the main feared downside is contractually mitigated.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let one peer's burnout story decide this. Ask
  how much hands-on time this specific role protects, whether the user wants it, and
  what the compensation is before treating the promotion as a trap.
