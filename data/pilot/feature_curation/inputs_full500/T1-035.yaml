xbase: My five-year-old front-loading washing machine has started leaving a small
  puddle of water on the floor after most wash cycles. The puddle shows up near the
  front of the machine, the laundry itself comes out properly washed and spun, and
  there is no error code on the display. A local technician quoted me €140 to come
  and look at it, and a comparable new machine in the same class runs about €520.
  I am trying to decide whether this is worth fixing. {DS}
focal_diagnostic_feature: The water on the floor is clean rinse water and it appears
  only at the front lip of the door, while the rubber door gasket has a visible split
  along its lower fold.
low_diagnostic_proposition: A neighbour's washing machine leaked and the cause turned
  out to be a corroded outer drum that made repair uneconomical.
oracle_action: ANSWER
oracle_focus: Repair it; a split door gasket is a cheap, common, well-bounded part
  to replace, so the leak does not point to an expensive structural failure that would
  favour replacement.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a drum failure from the neighbour's case.
  Ask where the water originates and whether the visible source is a cheap part or
  a structural one.
