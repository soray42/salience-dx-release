seed_id: T1-036
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Our recommendation model's offline evaluation looks great, but live click-through
  is far below what the offline metrics predicted, and it has been that way since
  we shipped this version. The serving stack reads features at request time from an
  online store, while training reads the same feature names from a nightly batch warehouse.
  The model code is unchanged and the online store is healthy. Candidate generation
  is upstream and shared identically by the offline run and live serving; this model
  only scores a fixed candidate set. {DS}
focal_diagnostic_feature: One heavily weighted feature, a 30-day purchase count, is
  computed with a different aggregation window in the online store than in the training
  warehouse, so the serving value is systematically lower than the trained-on value.
low_diagnostic_proposition: A peer team's recommendation model underperformed live
  and the cause turned out to be that their candidate retrieval index was stale.
oracle_action: ANSWER
oracle_focus: 'Fix the training-serving skew on the 30-day purchase-count feature:
  align the online aggregation window to the training window so the served feature
  matches what the model learned on.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not import the stale-index explanation from the other
  team. Ask whether the feature values served at request time match the values the
  model was trained on.
