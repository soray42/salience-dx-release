variants:
  HL:
    distractor: Henrik, who runs the ranking team in the other division, told me they
      had almost identical symptoms last quarter — offline numbers beautiful, live
      engagement flat — and after a long hunt they found their candidate retrieval
      index had quietly gone stale and was serving yesterday's catalogue.
    diagnosticity: low
    salience: high
    proposition: A peer team's recommendation model underperformed live and the cause
      turned out to be that their candidate retrieval index was stale.
    salience_source: A — a named lead of a peer ranking team recounting a symptom-matched
      incident lends the story credibility.
    why_plausible: A stale retrieval index is a genuine cause of live underperformance
      with healthy offline metrics, so the match feels diagnostic.
    why_irrelevant: The other team's index staleness says nothing about whether THIS
      system's served feature values match its trained values; that is the property
      the focal evidence checks.
  LL:
    distractor: A peer team's recommendation model underperformed live and was traced
      to a stale candidate retrieval index.
    diagnosticity: low
    salience: low
    proposition: A peer team's recommendation model underperformed live and the cause
      turned out to be that their candidate retrieval index was stale.
    matched_to: HL
  HH:
    distractor: 'I logged the raw feature vector for the same user at serve time and
      at train time and diffed them: the 30-day purchase count, one of the highest-weighted
      inputs, comes back consistently lower online because the store aggregates it
      over a 7-day window while training aggregates it over 30.'
    diagnosticity: high
    salience: high
    proposition: One heavily weighted feature, a 30-day purchase count, is computed
      with a different aggregation window in the online store than in the training
      warehouse, so the serving value is systematically lower than the trained-on
      value.
    salience_source: A side-by-side serve-vs-train diff naming the exact mismatched
      window makes the skew concrete and decisive.
  LH:
    distractor: The 30-day purchase-count, one of the highest-weighted inputs, aggregates
      over 7 days online versus 30 in training, making served values systematically
      lower.
    diagnosticity: high
    salience: low
    proposition: One heavily weighted feature, a 30-day purchase count, is computed
      with a different aggregation window in the online store than in the training
      warehouse, so the serving value is systematically lower than the trained-on
      value.
    matched_to: HH
distractor_direction:
  label: Stale retrieval index
  description: Investigating whether a stale or lagging candidate retrieval index
    is serving an out-of-date catalogue and causing the live underperformance.
plausible_alternative_directions:
- label: Online-store data freshness
  description: Whether the online feature store itself is serving lagged or partially
    populated values rather than mismatched-window values.
- label: Logging or ranking bug at serve time
  description: Whether the scoring or impression-logging path differs from the offline
    evaluation harness.
- label: Position or presentation bias
  description: Whether live ranking is affected by UI position effects absent from
    the offline replay.
leak_audit:
  ll_atomic_claims:
  - A peer team's recommendation model underperformed live.
  - The cause was a stale candidate retrieval index.
  hh_atomic_claims:
  - The 30-day purchase-count feature is a highly weighted input.
  - The online store aggregates it over a 7-day window.
  - Training aggregates it over a 30-day window.
  - Consequently served values are systematically lower than trained values.
  hl_salience_dimensions:
    source_credibility: Named peer ranking-team lead (Henrik) recounting a symptom-matched
      incident.
    narrative_coherence: Coherent last-quarter offline-good/live-flat sequence ending
      in the stale-index find.
    confident_assertion: N/A
    concrete_detail: Detail about the source's incident (their retrieval index, yesterday's
      catalogue) only — no claim about THIS system's feature values.
  forbidden_categories_checked_against:
