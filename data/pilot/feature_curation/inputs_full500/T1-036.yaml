  hh_word_count: 49
  lh_word_count: 22
  notes: 'xbase establishes the offline-good/live-bad gap, the split train/serve feature
    paths, and a healthy online store,

    but does NOT reveal that a feature''s values diverge between the two paths — that
    decisive fact lives only in

    HH/LH. The HL/LL cells therefore cannot resolve the case. LL carries only the
    peer-team stale-index claim; the

    name, division, and ''long hunt'' are HL-only and about the source''s incident.

    QC repair: LH was missing the ''highest-weighted input'' claim present in HH (C10
    leak). Added ''one of the

    highest-weighted inputs'' to LH; reworded to stay within 14-23 word target (new
    count: 22). lh_word_count

    corrected from 23 to 22 (original text was 24 words; prior count was also off
    by one).

    '
causal_audit:
  steelman: 'A senior ML engineer could argue that a stale retrieval index is a textbook
    cause of exactly this pattern —

    excellent offline metrics computed on a fresh catalogue, weak live engagement
    because users are shown outdated

    candidates — so Henrik''s incident looks like a strong analogy worth checking
    first. The analogy, however, is a

    fact about a different system. Nothing in xbase indicates retrieval is involved
    or that the catalogue is lagging.

    The focal evidence shows the actual defect: a high-weight feature is computed
    over mismatched windows so the

    model is scored on inputs unlike its training inputs, a training-serving skew
    that fully accounts for the gap and

    is independent of the retrieval layer. The stale-index story has no mechanism
    for this skew.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states candidate generation is upstream/shared and
    the model only scores a fixed set, ruling out the stale-retrieval-index mechanism.
unconstructable: false
