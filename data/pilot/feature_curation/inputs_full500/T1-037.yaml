xbase: My countertop microwave has stopped heating food properly; a mug of water comes
  out barely warm after two minutes. It still powers on, the light comes on, and the
  plate turns. It is about four years old and I am wondering whether to repair or
  just replace it. {DS}
focal_diagnostic_feature: The microwave makes a loud buzzing hum while running and
  the test mug of water stays cold, which points to a failed magnetron — the costliest,
  hardest part to replace on this appliance.
low_diagnostic_proposition: A coworker's microwave stopped heating and the fix was
  a cheap blown ceramic fuse.
oracle_action: ANSWER
oracle_focus: Replace the microwave; a loud-hum no-heat symptom points to a failed
  magnetron, whose part and labour cost typically approaches or exceeds the price
  of a new unit at this age.
