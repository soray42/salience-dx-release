causal_audit:
  steelman: 'A repair-minded person could argue that a microwave that powers on but
    does not heat very often has a cheap,

    fixable fault — a blown line fuse, a thermal cutout, a door switch — and that
    Anneli''s two-euro fuse is a

    realistic and encouraging precedent, so repair should be tried before writing
    the unit off. The flaw is that

    this reasons from a different microwave''s fault to this one''s. xbase does not
    say which part failed. The focal

    evidence — a loud straining hum during operation together with water that stays
    stone cold — is the recognised

    signature of magnetron burnout, the one component whose part-plus-labour cost
    rivals a new microwave, so the

    cheap-fuse precedent has no bearing on this unit''s economics.

    '
