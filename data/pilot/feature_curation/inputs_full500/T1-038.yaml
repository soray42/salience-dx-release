seed_id: T1-038
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Our daily revenue dashboard suddenly shows total bookings about 35% higher
  than finance's own ledger, starting with the report that ran after Monday's model
  and transform changes. The numbers were matching for months before that. The pipeline
  pulls bookings, joins them to a campaign-attribution table, and sums the amounts.
  The raw bookings table on its own still has the correct count of rows. {DS}
focal_diagnostic_feature: A booking can match multiple rows in the campaign-attribution
  table, so the join fans out and the same booking amount is summed several times,
  inflating the total above the true figure.
low_diagnostic_proposition: A colleague's revenue numbers were once overstated because
  their currency-conversion rates were loaded a day stale.
oracle_action: ANSWER
oracle_focus: 'Fix the fan-out join: deduplicate or pre-aggregate the campaign-attribution
  side so each booking contributes its amount once before summing.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a stale FX-rate issue from the colleague's
  case. Ask whether the join multiplies booking rows so amounts are counted more than
  once.
