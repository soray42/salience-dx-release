causal_audit:
  steelman: 'A data engineer might argue that stale currency-conversion rates are
    a classic, easily missed cause of revenue

    overstatement in any multi-currency pipeline, and that Torvald''s case matched
    these symptoms closely, so the FX

    layer deserves first inspection. But that is reasoning from a different pipeline''s
    defect. Nothing in xbase says

    revenue is multi-currency or that an FX step exists, and the raw bookings count
    is stated to be correct. The

    focal evidence shows the actual mechanism: a one-to-many join to the attribution
    table duplicates each booking''s

    row and the SUM counts its amount once per duplicate. That fan-out fully explains
    a 35% inflation with the raw

    data intact, and stale FX rates have no mechanism to produce row duplication.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: The raw-bookings-row-count statement in xbase is a narrow
    C4-compliant closure of the source-duplication mechanism only; it does not foreclose
    the stale-FX distractor, the join-key/filter alternative, or the refund-exclusion
    alternative. The decisive join fan-out lives only in HH/LH.
