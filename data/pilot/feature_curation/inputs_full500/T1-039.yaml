xbase: My upright vacuum cleaner has lost most of its suction over the last couple
  of weeks; it barely lifts crumbs off a hard floor now. The motor still runs and
  sounds normal, the bin is empty, and I have already washed the filter and checked
  it is dry. It is about three years old. A replacement model in the same range costs
  around €180, and I am trying to work out whether it is worth taking in for repair
  instead. {DS}
focal_diagnostic_feature: Holding a hand over the hose inlet there is almost no pull,
  and running a finger along the flexible hose finds a clear split where it flexes
  at the base, so air is leaking in before it reaches the floor head.
low_diagnostic_proposition: A friend's vacuum lost suction and the cause was a worn-out
  motor that made repair not worth it.
oracle_action: ANSWER
oracle_focus: Repair it; a split hose is a cheap, standard replacement part, so the
  suction loss does not indicate the expensive motor failure that would favour buying
  new.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a dead motor from the friend's case. Ask
  where the airflow is lost and whether the failing part is cheap or expensive.
