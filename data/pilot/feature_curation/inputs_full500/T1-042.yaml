causal_audit:
  steelman: 'A network engineer might note that partial provider outages can degrade
    specific CDNs or peering paths, so one

    app routed through an affected CDN could fail while others survive. But an outage
    cannot explain the same

    provider streaming perfectly on the phone on the same connection AND every other
    app working; the failure is a

    per-hostname NXDOMAIN on one device behind the router''s filter, which no provider
    outage produces.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the phone plays that same streaming service
    on the same home Wi-Fi and every other TV app works, foreclosing a connection-wide
    or provider-wide outage.
