seed_id: T1-042
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: My smart TV suddenly cannot open one streaming app; it spins and then shows
  "can't connect to the service." Every other app on the same TV streams fine, and
  my phone plays that same streaming service perfectly on the same home Wi-Fi. I rebooted
  the TV and the router, and nothing changed. I have not touched any router settings
  that I know of. {DS}
focal_diagnostic_feature: On the TV the streaming app's API hostname returns NXDOMAIN,
  while every other app and the phone resolve it, because the TV is configured to
  use the router as its DNS and the router's DNS-rebind protection is dropping that
  provider's CDN hostname.
low_diagnostic_proposition: A neighbour reported that the user's internet provider
  had a regional outage around the same time.
oracle_action: ANSWER
oracle_focus: Treat this as DNS resolution failing for that one provider's hostname
  on the TV; add an exception in the router's DNS-rebind protection or point the TV
  at a public resolver, since the name resolves everywhere except through the router's
  filter.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not attribute this to a provider outage. Ask whether
  the failing app's hostname resolves on the TV versus other devices and what DNS
  the TV is configured to use before concluding anything about the streaming service.
