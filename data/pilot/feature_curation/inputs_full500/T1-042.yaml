variants:
  HL:
    distractor: Quang two doors down, who works at a phone shop, messaged the building
      group to say our internet provider was having a regional outage that same evening,
      and he was sure that was why people's apps were acting up across the street.
    diagnosticity: low
    salience: high
    proposition: A neighbour reported that the user's internet provider had a regional
      outage around the same time.
    salience_source: A/C — a named neighbour with telecom-adjacent work confidently
      reporting a provider outage to the group.
    why_plausible: Provider outages do break streaming, and a confident neighbour's
      outage report during the same evening feels like the obvious explanation.
    why_irrelevant: A provider-wide outage would not let every other app and the phone
      stream fine on the same connection; the failure is isolated to one hostname
      on one device, which an outage cannot produce.
  LL:
    distractor: A neighbour said the internet provider had a regional outage around
