      the router as its DNS and the router's DNS-rebind protection is dropping that
      provider's CDN hostname.
    matched_to: HH
distractor_direction:
  label: Provider regional outage
  description: Attributing the single app's failure to a reported internet-provider
    outage in the area.
plausible_alternative_directions:
- label: App-side service problem
  description: Whether the streaming provider's own servers or the TV app build are
    broken rather than the network path.
- label: TV app cache or login
  description: Whether a corrupted app cache or expired session on the TV is blocking
    the connection.
- label: TV firmware regression
  description: Whether a recent TV firmware update broke that specific app's networking.
