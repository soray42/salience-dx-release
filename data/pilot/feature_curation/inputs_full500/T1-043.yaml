domain: open_qa
complexity: medium
xbase: 'My three-year-old tablet has a cracked screen but otherwise works exactly
  as it always has: snappy, good battery, all my apps and notes on it. I use it daily
  for reading and sketching. A shop quoted me to replace just the screen, and I''m
  torn between paying that or putting the money toward a new tablet instead. I''d
  rather not lose my setup if I don''t have to. {DS}'
focal_diagnostic_feature: The screen-repair quote is 22% of an equivalent new tablet's
  price, and this tablet still receives the manufacturer's OS and security updates
  for two more years.
low_diagnostic_proposition: A relative said that screen repairs on tablets never hold
  and the device breaks again soon after.
oracle_action: ANSWER
oracle_focus: Repair the screen; at roughly a fifth of replacement cost on a device
  that is otherwise healthy and still supported for two more years, repair clearly
  wins over buying new and migrating the user's setup.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not treat a relative's "repairs never hold" claim
  as decisive. Ask for the repair quote relative to a new tablet's price and how long
  this tablet will keep getting updates before choosing repair or replace.
