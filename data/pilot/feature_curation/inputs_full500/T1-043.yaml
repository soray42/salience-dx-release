causal_audit:
  steelman: 'One could argue that aftermarket screen replacements introduce digitizer
    and seal weaknesses, so a relative''s

    repeated experience of repairs failing is a genuine reliability prior. But it
    is a generic claim about other

    devices and unknown shops; it gives no information about this shop, this model,
    or the cost/support economics

    that actually decide repair versus replace here.

    '
