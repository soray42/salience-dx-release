seed_id: T1-044
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Since this morning, about a third of our users cannot reach our API; the rest
  are completely fine. The failing users get an immediate "host not found" in the
  client, not a slow timeout. Our servers are up, the certificate is valid, and the
  application logs show no errors because the requests never arrive. There was a brief
  authoritative-zone misconfiguration overnight that we reverted within minutes. {DS}
focal_diagnostic_feature: The failing users all resolve through one upstream public
  resolver that cached the overnight NXDOMAIN for the API hostname at a long negative
  TTL, so it keeps returning "host not found" while resolvers without that cached
  negative answer succeed.
low_diagnostic_proposition: An engineer at a peer company said a similar partial-reachability
  incident of theirs turned out to be a BGP route leak by a transit provider.
oracle_action: ANSWER
oracle_focus: 'Treat this as a stale negative DNS cache: the overnight NXDOMAIN was
  cached with a long negative TTL on the resolvers the failing users share; shorten
  the SOA negative-caching TTL and have affected resolvers flush, since the records
  are correct now.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the peer's BGP-route-leak story. Ask whether
  the failing users share a common DNS resolver and whether that resolver still returns
  NXDOMAIN for the API hostname before investigating routing.
