seed_id: T1-046
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: On our office VoIP phones, outbound calls connect but the far side often cannot
  hear us, while we hear them perfectly. It is not every call, and the desk phones
  register fine and show full signal. Internal calls between two of our phones are
  flawless. We replaced one handset and the problem followed the same set of calls,
  not the hardware. Nothing about our call provider has changed on our account. {DS}
focal_diagnostic_feature: The affected calls are the ones whose media path traverses
  the office router, whose SIP ALG is rewriting the SDP and advertising the wrong
  private RTP address, so the far end sends audio to an unreachable address while
  our inbound audio is unaffected.
low_diagnostic_proposition: A colleague's similar one-way-audio complaint at a previous
  job was caused by a faulty headset microphone.
oracle_action: ANSWER
oracle_focus: Disable SIP ALG on the office router (and use proper NAT traversal);
  the one-way-audio pattern comes from the ALG rewriting SDP to an unreachable private
  RTP address, which breaks only the outbound media path.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the faulty-headset-microphone explanation.
  Ask whether the issue follows the call path rather than the handset and whether
  the router has SIP ALG enabled before blaming hardware.
