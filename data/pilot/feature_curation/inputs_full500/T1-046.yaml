distractor_direction:
  label: Faulty handset microphone
  description: Investigating a failing microphone in the phones or headsets as the
    cause of the far side not hearing the user.
plausible_alternative_directions:
- label: Codec negotiation mismatch
  description: Whether a one-sided codec mismatch with the provider is silencing the
    outbound stream on some calls.
- label: One-way firewall/QoS rule
  description: Whether a firewall or QoS rule is dropping outbound RTP packets on
    certain routes.
- label: Provider trunk problem
  description: Whether the SIP trunk provider is mishandling media on a subset of
    routes.
