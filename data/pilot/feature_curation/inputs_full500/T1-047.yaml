causal_audit:
  steelman: 'A seasoned traveller might argue seat comfort is a legitimate decision
    axis on a nine-hour flight and that a

    carrier with brutal seat pitch is one to avoid, so the warning could steer the
    airline choice. But the symptom

    this seed turns on is connection risk, not comfort: the focal feature is that
    the two tickets are separate with a

    55-minute gap, immigration, bag re-check, and no airside link. Seat pitch has
    no mechanism to make a connection

    bookable or unbookable; it cannot inform whether the second flight will be missed.
    The comfort story therefore

    has no bearing on the deciding fact, which is the feasibility of the transfer.

    '
