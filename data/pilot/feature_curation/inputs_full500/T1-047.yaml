seed_id: T1-047
template: T1
domain: open_qa
complexity: medium
xbase: I'm booking a long-haul trip and deciding between a single itinerary on one
  airline and a cheaper combination of two separate tickets on different airlines
  with a connection in between. The cheaper option saves a fair bit and the flight
  times look convenient. I have travelled plenty and am comfortable moving through
  a connecting airport on my own. I just want to be sure I am not setting myself up
  for trouble at the connection. {DS}
focal_diagnostic_feature: The two separate tickets give a 55-minute connection that
  requires clearing immigration and re-checking bags at an airport with no inter-terminal
  transfer.
low_diagnostic_proposition: An acquaintance had a miserable long-haul trip because
  of a cramped seat on a budget carrier.
oracle_action: ANSWER
oracle_focus: Do not book the two separate tickets; a 55-minute self-transfer that
  requires immigration and bag re-check at that airport is too tight, so a missed
  connection is uncovered and likely.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let a seat-comfort story decide this. Ask about
  the connection time, whether the tickets are separate, and what the transfer at
  that airport requires.
