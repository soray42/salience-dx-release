seed_id: T1-048
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Our PostgreSQL primary has been showing rising write latency over the past
  two weeks, and a few transactions now occasionally hit lock-wait timeouts on a busy
  orders table. Read traffic is fine and the schema has not changed. We run on provisioned
  SSD storage that has plenty of headroom on throughput and IOPS graphs. The team
  is starting to talk about scaling up the instance class. {DS}
focal_diagnostic_feature: Autovacuum has not completed on the orders table for two
  weeks, and pg_stat_user_tables shows roughly four million dead tuples accumulating
  on it.
low_diagnostic_proposition: A comparable Postgres write-latency problem at another
  company was traced to an undersized disk that had run out of IOPS.
oracle_action: ANSWER
oracle_focus: Address autovacuum on the orders table; the dead-tuple bloat is forcing
  the planner and locks to traverse millions of dead rows, so tune autovacuum or run
  a manual vacuum rather than scaling the instance.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not import the other company's disk-IOPS explanation.
  Ask for autovacuum status, dead-tuple counts, and whether storage metrics are actually
  saturated before scaling.
