  HL:
    action: ASK
    focus: Do not import the other company's disk-IOPS explanation. Ask for autovacuum
      status, dead-tuple counts, and whether storage metrics are actually saturated
      before scaling.
  LL:
    action: ASK
    focus: Do not import the other company's disk-IOPS explanation. Ask for autovacuum
