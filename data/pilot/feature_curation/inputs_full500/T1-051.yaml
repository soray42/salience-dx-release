domain: open_qa
complexity: medium
xbase: I'm deciding whether to rent a car for a week-long trip to a small island or
  rely on local transport and the occasional taxi. The rental quote is reasonable
  and I enjoy the freedom of driving myself around when I travel. I want to visit
  a handful of beaches and villages spread around the island over the week. I have
  to confirm the rental booking by tomorrow or lose the rate. {DS}
focal_diagnostic_feature: The island requires an International Driving Permit that
  the user does not hold and cannot obtain before departure, and rental firms there
  refuse to hand over keys without it.
low_diagnostic_proposition: A friend who rented a car on a different island found
  the local roads stressfully narrow and winding.
oracle_action: ANSWER
oracle_focus: Do not book the rental; the user lacks the International Driving Permit
  the island requires and cannot obtain it in time, so rental firms there will not
  release a car, and local transport plus taxis is the workable plan.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let a narrow-roads story decide this. Ask what
  documentation the island requires to rent and whether the user already holds it.
