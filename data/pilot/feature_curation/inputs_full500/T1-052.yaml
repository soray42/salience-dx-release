causal_audit:
  steelman: 'A ClickHouse expert would note that engine choice is a real performance
    determinant and that a table left on the

    Log engine cannot use a primary index at all, so a matching slowdown fixed by
    moving to MergeTree is a plausible

    parallel worth checking. The defeater is the focal evidence: this table already
    has a sorting key and primary

    index (it is MergeTree), and the slowdown is that the query filters on a column
    absent from that key, defeating

    granule pruning as the table grew. An engine swap addresses tables that lack an
    index entirely; here the index

    exists and is simply unusable for this filter, so the engine story has no mechanism
    to act on this case.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the table schema and cluster sizing are unchanged
    and resources are comfortable, which together with the index-dependent symptom
    implies an indexed MergeTree table; the decisive sorting-key/filter mismatch is
    withheld to HH/LH so HL/LL cannot resolve the engine question.
