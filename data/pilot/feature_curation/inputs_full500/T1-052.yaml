seed_id: T1-052
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Our analytics warehouse on ClickHouse has a dashboard query that used to return
  in under a second and now takes nearly thirty. It is a filtered aggregation over
  an events table that has grown over the past few months. The query, the table schema,
  and the cluster sizing are all unchanged, and CPU and memory on the nodes look comfortable
  while the query runs. {DS}
focal_diagnostic_feature: The query filters on a column that is not part of the table's
  sorting key, so it now scans nearly every granule of a much larger table instead
  of skipping with the primary index.
low_diagnostic_proposition: A comparable ClickHouse slowdown at another shop was fixed
  by switching the table from the Log engine to MergeTree.
oracle_action: ANSWER
oracle_focus: 'Address data skipping: the filter column is not in the sorting key
  so the primary index cannot prune, forcing a near-full scan; add a suitable sorting
  key, projection, or skip index for that filter.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not import the other shop's engine-swap fix. Ask which
  columns are in the sorting key, whether the filter prunes granules, and how much
  of the table the query reads.
cell_oracles:
  HL:
    action: ASK
    focus: Do not import the other shop's engine-swap fix. Ask which columns are in
      the sorting key, whether the filter prunes granules, and how much of the table
      the query reads.
  LL:
    action: ASK
    focus: Do not import the other shop's engine-swap fix. Ask which columns are in
