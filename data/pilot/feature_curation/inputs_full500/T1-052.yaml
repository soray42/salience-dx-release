  HH:
    action: ANSWER
    focus: 'Address data skipping: the filter column is not in the sorting key so
      the primary index cannot prune, forcing a near-full scan; add a suitable sorting
      key, projection, or skip index for that filter.'
  LH:
    action: ANSWER
    focus: 'Address data skipping: the filter column is not in the sorting key so
      the primary index cannot prune, forcing a near-full scan; add a suitable sorting
      key, projection, or skip index for that filter.'
variants:
  HL:
    distractor: Lubomír, a data engineer I trust from a previous job, told me they
      had an almost identical ClickHouse slowdown and it turned out their events table
      was on the Log engine; switching to MergeTree made the query instant, and he
      was confident that was the root.
    diagnosticity: low
    salience: high
    proposition: A comparable ClickHouse slowdown at another shop was fixed by switching
      the table from the Log engine to MergeTree.
    salience_source: A — a trusted data engineer recounting a near-identical slowdown
      with a definite fix lends the engine-swap story credibility.
    why_plausible: Engine choice genuinely affects ClickHouse performance, and Log-vs-MergeTree
      is a real lever, so the matching story tempts an engineer to check the engine
      first.
    why_irrelevant: This table is already MergeTree (it has a sorting key and primary
      index); the slowdown comes from the filter not aligning with that key, which
      an engine swap cannot address.
  LL:
    distractor: A comparable ClickHouse slowdown at another shop was fixed by switching
      the table from the Log engine to MergeTree.
    diagnosticity: low
    salience: low
    proposition: A comparable ClickHouse slowdown at another shop was fixed by switching
      the table from the Log engine to MergeTree.
    matched_to: HL
  HH:
    distractor: The query filters on a column that is not in the table's sorting key,
      so the primary index cannot prune by it; as the events table grew, the query
      now reads nearly every granule and scans almost the whole table instead of skipping
      past irrelevant parts.
    diagnosticity: high
    salience: high
    proposition: The query filters on a column that is not part of the table's sorting
      key, so it now scans nearly every granule of a much larger table instead of
      skipping with the primary index.
    salience_source: Concrete index mechanics (filter column absent from the sorting
      key, granules unprunable, near-full scan) make the cause precise.
  LH:
    distractor: The filter column is not in the sorting key, so the primary index
      cannot prune and the query scans nearly the whole enlarged table.
    diagnosticity: high
    salience: low
    proposition: The query filters on a column that is not part of the table's sorting
      key, so it now scans nearly every granule of a much larger table instead of
      skipping with the primary index.
    matched_to: HH
distractor_direction:
  label: Table engine choice
  description: Investigating whether the table is on a slow engine and should be switched
    to MergeTree to fix the slowdown.
plausible_alternative_directions:
- label: Background merge backlog
  description: Whether unmerged parts have piled up so the query reads many small
    parts.
- label: Stale or missing statistics
  description: Whether outdated metadata is leading the query to a poor execution
    choice.
