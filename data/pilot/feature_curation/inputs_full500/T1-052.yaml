  - A comparable ClickHouse slowdown occurred at another shop.
  - It was fixed by switching the table from the Log engine to MergeTree.
  hh_atomic_claims:
  - The query filters on a column that is not in the table's sorting key.
  - The primary index therefore cannot prune by that filter.
  - The query now reads nearly every granule, scanning almost the whole enlarged table.
  hl_salience_dimensions:
    source_credibility: Named data engineer (Lubomír) from a previous job describing
      an almost identical slowdown.
    narrative_coherence: Coherent account ending in the engine swap with a confident
      conclusion.
    confident_assertion: He was confident that was the root.
    concrete_detail: Detail about the source's case (Log engine, MergeTree move, instant
      query) only — no claim about this table's sorting key.
