variants:
  HL:
    distractor: Emre, who used to manage my old shared house, kept renting for a decade
      and now says it was his biggest regret, because the friend who bought a similar
      flat back then has built a serious pile of equity while he has nothing to show
      for the rent.
    diagnosticity: low
    salience: high
    proposition: A relative bought instead of renting and built substantial equity
      over the years.
    salience_source: A — a named former housemate recounting a coherent, lived comparison
      lends the equity-regret story weight.
    why_plausible: Long-run owning often does beat renting on equity, so the regret
      feels like sound general housing wisdom.
    why_irrelevant: A multi-year equity gain is irrelevant to a buyer who will sell
      within eighteen months; only the user's holding period decides whether buying
      recovers its costs.
  LL:
    distractor: Someone bought a similar flat rather than renting and accumulated
      substantial equity over the following years.
    diagnosticity: low
    salience: low
    proposition: A relative bought instead of renting and built substantial equity
      over the years.
    matched_to: HL
  HH:
    distractor: I signed a transfer agreement with my employer last month committing
      me to move to our office in another city within eighteen months; the relocation
      is confirmed in writing, not a maybe, so I will not be living in this flat long
      enough to call it home.
    diagnosticity: high
    salience: high
    proposition: The user's job requires relocating to a different city within the
      next eighteen months under a signed transfer agreement.
    salience_source: The signed, dated transfer commitment makes the short horizon
      concrete and binding rather than speculative.
  LH:
    distractor: A signed employer transfer commits the user to relocate to another
      city within eighteen months.
    diagnosticity: high
    salience: low
    proposition: The user's job requires relocating to a different city within the
      next eighteen months under a signed transfer agreement.
    matched_to: HH
distractor_direction:
  label: Long-run equity upside
  description: Treating the decision as favouring purchase because owning historically
    builds equity that renting forgoes.
plausible_alternative_directions:
- label: Purchase-cost fairness
  description: Whether the offered price and financing terms are genuinely fair relative
    to the local market.
- label: Maintenance and service-charge exposure
  description: Whether ongoing ownership costs for this specific unit are acceptable.
