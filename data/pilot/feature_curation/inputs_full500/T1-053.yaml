seed_id: T1-053
template: T1
domain: open_qa
complexity: low
xbase: I'm deciding whether to buy the two-bedroom flat I currently rent or keep renting
  it. The landlord has offered to sell at what looks like a fair market price, and
  I can cover the deposit without touching my pension. I like the area and could see
  myself here for a while. The numbers around the purchase itself seem to work on
  paper, so the question is really about whether owning this particular unit makes
  sense for me. {DS}
focal_diagnostic_feature: The user's job requires relocating to a different city within
  the next eighteen months under a signed transfer agreement.
low_diagnostic_proposition: A relative bought instead of renting and built substantial
  equity over the years.
oracle_action: ANSWER
oracle_focus: Do not buy this flat; a confirmed relocation inside eighteen months
  means the user would face buying-and-selling transaction costs over a holding period
  far too short to recover them, so renting fits their actual horizon.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let a relative's equity story decide this. Ask
  how long the user realistically expects to stay in this flat before judging buy
  versus rent.
cell_oracles:
  HL:
    action: ASK
    focus: Do not let a relative's equity story decide this. Ask how long the user
      realistically expects to stay in this flat before judging buy versus rent.
  LL:
    action: ASK
    focus: Do not let a relative's equity story decide this. Ask how long the user
