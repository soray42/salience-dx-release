    diagnosticity: high
    salience: high
    proposition: The push fails only on runs assigned to the self-hosted runner whose
      disk is above ninety-five percent full, leaving no room to stage image layers.
    salience_source: The exact runner attribution plus the over-ninety-five-percent
      disk figure makes the resource exhaustion concrete and one-sided.
  LH:
