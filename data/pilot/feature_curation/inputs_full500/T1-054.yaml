variants:
  HL:
    distractor: Selin, who runs platform engineering at a company I trust, told me
      they chased an almost identical flaky container push for a week and it turned
      out their registry provider had quietly tightened anonymous and burst pull limits,
      so pushes failed whenever they brushed the new ceiling.
    diagnosticity: low
    salience: high
    proposition: A comparable intermittent push failure elsewhere was traced to registry-side
      rate limiting.
    salience_source: A — a named senior platform engineer at a trusted peer company
      recounting a closely matched incident.
    why_plausible: Registry rate limits are a real and common cause of intermittent
      push and pull failures, so the story pattern-matches the symptom.
    why_irrelevant: Rate limiting would be independent of which runner executes the
      job, whereas these failures track one specific runner's exhausted disk, which
      registry limits cannot explain.
  LL:
    distractor: An intermittent container push failure elsewhere was attributed to
      registry-side rate limiting.
    diagnosticity: low
