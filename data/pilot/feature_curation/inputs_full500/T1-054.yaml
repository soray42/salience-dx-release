seed_id: T1-054
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Our GitHub Actions pipeline started failing intermittently this week on the
  deploy job, while build and test jobs stay green. The deploy job runs a container
  push to our registry, and roughly one run in four exits non-zero partway through
  the push. We have not changed the deploy workflow file or the registry credentials
  recently, and the same image builds fine locally. {DS}
focal_diagnostic_feature: The push fails only on runs assigned to the self-hosted
  runner whose disk is above ninety-five percent full, leaving no room to stage image
  layers.
low_diagnostic_proposition: A comparable intermittent push failure elsewhere was traced
  to registry-side rate limiting.
oracle_action: ANSWER
oracle_focus: 'Treat this as a disk-space problem on the self-hosted runner: the push
  fails when layer staging cannot fit on the nearly full disk. Free space or move
  to a runner with headroom and confirm the failures disappear.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the registry rate-limit story. Ask which
  runner the failing runs land on and what the disk and resource state of that runner
  is during the push.
