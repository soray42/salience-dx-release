distractor_direction:
  label: Registry rate limiting
  description: Investigating whether the container registry is throttling or rate-limiting
    pushes, causing the intermittent push failures.
plausible_alternative_directions:
- label: Credential or token expiry
  description: Whether a periodically refreshed push token is intermittently invalid
    during the deploy step.
- label: Network flakiness to registry
  description: Whether transient network drops between runner and registry interrupt
    the layer upload.
leak_audit:
  ll_atomic_claims:
  - An intermittent container push failure occurred elsewhere.
  - It was attributed to registry-side rate limiting.
  hh_atomic_claims:
  - All failing runs land on one self-hosted runner.
  - That runner's disk is above ninety-five percent full.
  - The push aborts when staging layers finds no room, while runners with free space
    succeed.
  hl_salience_dimensions:
    source_credibility: Named senior platform engineer (Selin) at a trusted peer company.
    narrative_coherence: Coherent week-long investigation ending in a clear registry-limit
      finding.
    confident_assertion: States the cause was the tightened limits.
    concrete_detail: Detail about the source's incident (anonymous and burst pull
      limits) only — no fact about the user's own runners.
  forbidden_categories_checked_against:
  - tunable_value
  - effort_descriptor
  - severity_claim
  - sensory_distractor_about_setting
  - rambling_marker
  - hedging_language
  xbase_word_count: 71
  hl_word_count: 45
  ll_word_count: 13
  hh_word_count: 44
  lh_word_count: 17
  notes: 'LL carries only the elsewhere-failure and rate-limit-attribution claims;
    the named source, the week of chasing,

    and the burst-limit detail are HL-only and describe the source''s incident. xbase
    reports the symptom (one run in

    four fails partway through the push) and what is unchanged, but never names a
    runner or any disk state, so the

    HL/LL cells cannot localise the fault. The decisive runner-and-disk fact lives
    only in HH/LH.

    '
causal_audit:
  steelman: 'A senior SRE could argue rate limiting is a leading hypothesis: intermittent
    push failures that build fine

    locally are a textbook registry-throttling signature, providers do silently change
    burst and anonymous limits,

    and a one-in-four failure rate is consistent with brushing a ceiling under concurrent
    traffic. That mechanism,

    however, is indifferent to which CI runner executes the job — a registry limit
    would strike pushes regardless of

    origin host. The focal evidence shows the failures are perfectly correlated with
    a single self-hosted runner

    whose disk is over ninety-five percent full and that the abort happens precisely
    at layer staging, a local

    disk-space failure mode; runners with free space never fail. Registry rate limiting
    cannot produce that

    runner-specific, disk-correlated pattern, so it has no defensible mechanism for
    this case.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the decisive runner-and-disk fact is withheld from
    xbase and lives only in HH/LH.
unconstructable: false
