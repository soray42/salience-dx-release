variants:
  HL:
    distractor: Deniz, a staff engineer I worked with at a previous company, said
      they hit a near-identical creeping CI slowdown last quarter and after a long
      hunt found their CI runners had been silently downsized to fewer cores and less
      memory, so every build was simply starved of compute.
    diagnosticity: low
    salience: high
    proposition: A comparable CI slowdown at another company was caused by under-provisioned
      runner machines.
    salience_source: A — a named staff engineer recounting a closely matched, methodically
      diagnosed incident at a prior employer.
    why_plausible: Runner under-provisioning genuinely does slow builds across the
      board, so the across-the-org pattern superficially fits.
    why_irrelevant: Starved runners would slow even cache-hit builds proportionally,
      whereas here the cache hit rate has collapsed to near zero, so builds are doing
      full work no amount of compute would shortcut.
  LL:
    distractor: A comparable CI build slowdown at another company was attributed to
      under-provisioned runner machines.
    diagnosticity: low
    salience: low
