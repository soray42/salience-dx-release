  notes: 'LL carries only the elsewhere-slowdown and under-provisioned-runner claims;
    the named source, the long hunt, and

    the cores-and-memory detail are HL-only and about the source''s incident. xbase
    reports the symptom (build time

    crept from nine to forty minutes across most PRs) and that remote caching is enabled,
    but never reports the cache

    hit rate or any input change, so the HL/LL cells cannot localise the regression.
    The decisive cache-collapse fact

    lives only in HH/LH.

    '
causal_audit:
  steelman: 'A platform lead could argue under-provisioned runners is a strong hypothesis:
    an org-wide, gradual slowdown that

    touches most pull requests is exactly what compute starvation looks like, runners
    do get silently re-tiered by

    cloud changes or quota shifts, and the timeline fits a quiet downsizing. That
    mechanism predicts a roughly

    proportional slowdown of work the runner actually performs. The focal evidence
    shows the remote cache hit rate

    has collapsed from ninety percent to near zero because a generated file now embeds
    a build timestamp, so builds

    are no longer reusing cached outputs at all and are doing full work every time.
    That fourfold increase is

    explained by lost cache reuse, not by per-core throughput; faster runners would
    not restore the cache hits.

    Under-provisioning therefore has no defensible mechanism for this specific collapse.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the decisive cache-hit-rate collapse is withheld
    from xbase and lives only in HH/LH.
unconstructable: false
