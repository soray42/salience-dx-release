seed_id: T1-056
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Our monorepo's CI build time has crept from about nine minutes to over forty
  minutes over the past two months, even though the codebase has grown only modestly.
  We use a build tool with remote caching enabled, and the slowdown shows up across
  most pull requests rather than a single project. Nothing obvious changed in our
  runner configuration, and developers are starting to complain that the wait is killing
  their flow. {DS}
focal_diagnostic_feature: Build logs show the remote cache hit rate has collapsed
  to near zero because a recently added timestamp in a generated file makes every
  build input unique, defeating caching.
low_diagnostic_proposition: A comparable CI slowdown at another company was caused
  by under-provisioned runner machines.
oracle_action: ANSWER
oracle_focus: 'Fix the cache-busting input: a generated file now embeds a build timestamp,
  making every cache key unique and forcing full rebuilds. Make that input deterministic
  so remote cache hits return, then confirm build time drops.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the under-provisioned-runner story. Ask
  for the remote cache hit rate and what build inputs changed before assuming a hardware
  capacity problem.
