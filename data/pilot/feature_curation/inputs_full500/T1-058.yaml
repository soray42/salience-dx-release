seed_id: T1-058
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Our Jenkins pipeline's test stage has started timing out and getting killed
  at the sixty-minute job limit, where it used to finish in about twenty-five. The
  test suite itself has not grown much, and running the same tests on a developer
  laptop finishes in roughly the usual time. The failures began appearing on most
  branches this week, and re-running sometimes gets further before the limit cuts
  it off. {DS}
focal_diagnostic_feature: A new integration test acquires a lock on a shared sandbox
  database and never releases it, so subsequent tests block waiting on that lock until
  the job-level timeout fires.
low_diagnostic_proposition: A comparable Jenkins timeout elsewhere was caused by an
  undersized executor heap triggering thrashing.
oracle_action: ANSWER
oracle_focus: Find the test that holds the shared-database lock and never releases
  it; later tests block on that lock until the job timeout. Fix the lock-release path
  or isolate the sandbox so tests stop serialising behind it.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the executor-heap story. Ask where in the
  run the suite stalls and whether tests are blocking on a shared resource before
  assuming memory pressure.
cell_oracles:
  HL:
    action: ASK
    focus: Do not adopt the executor-heap story. Ask where in the run the suite stalls
      and whether tests are blocking on a shared resource before assuming memory pressure.
  LL:
    action: ASK
    focus: Do not adopt the executor-heap story. Ask where in the run the suite stalls
