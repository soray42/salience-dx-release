xbase: My sponge cakes keep coming out dense and sunken in the middle, even though
  I follow a recipe I have made before. I weigh the flour, sugar, and eggs on a scale,
  and I beat the batter until it looks pale and airy. The bake time and shelf position
  are the same as the recipe says. The texture is the same every attempt, so something
  steady is off rather than a one-off mistake. I tested the baking powder in warm
  water and it bubbled vigorously. {DS}
focal_diagnostic_feature: A separate oven thermometer on the middle shelf reads about
  30°C below the dial setting throughout the bake.
low_diagnostic_proposition: A comparable dense-cake problem elsewhere was traced to
  leavening that had lost its potency.
oracle_action: ANSWER
oracle_focus: The oven is running roughly 30°C cold, so the batter sets too slowly
  and collapses; recalibrate or compensate the temperature and verify with the thermometer
  before changing the recipe.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume stale leavening from someone else's case.
  Ask whether the actual oven temperature has been measured independently of the dial.
