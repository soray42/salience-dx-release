causal_audit:
  steelman: 'A keen home cook could argue that oil taken past its smoke point is a
    genuine cause of sticking: overheated oil

    polymerises into a tacky varnish that food bonds to, and that residue accumulates
    morning after morning, which

    would explain why a once-reliable pan now grips everything. That account is defeated
    by the coating''s state:

    once bare metal is showing where the non-stick layer has flaked away, the release
    surface is simply gone, and no

    change of oil or cleaning routine restores a worn-through pan. Nothing in xbase
    elevates the oil hypothesis for

    this user, who already cooks on medium heat with a little oil, so the anecdote
    has no mechanism for this pan.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the user cooks on medium heat with a little
