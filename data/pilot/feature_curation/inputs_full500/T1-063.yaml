xbase: My homemade yogurt keeps coming out runny and barely set, more like thin drinkable
  kefir than the thick spoonable yogurt I want. I heat the milk first, let it cool,
  stir in a spoon of live culture, and leave it overnight before chilling it. I use
  whole milk and a fresh tub of plain live yogurt as the starter each time. Every
  batch turns out the same loose consistency. {DS}
focal_diagnostic_feature: A thermometer in the incubating jar shows it holding around
  22°C overnight, well below the roughly 43°C the cultures need to set.
low_diagnostic_proposition: A similar runny-yogurt problem for someone else was caused
  by a dead or inactive starter culture.
oracle_action: ANSWER
oracle_focus: The incubation temperature is far too low for the cultures to thicken
  the milk; hold the jar near 43°C with a warm method rather than replacing the starter.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a dead starter from another person's case.
  Ask what temperature the milk is actually held at during incubation.
