causal_audit:
  steelman: 'A regular yogurt-maker could argue a dead starter is the obvious cause:
    yogurt sets only because live cultures

    ferment the milk, and if the starter tub has been frozen, left past date, or pasteurised,
    the cultures are gone

    and every batch stays thin no matter what else you do, which fits the consistent
    runniness here. That account is

    defeated by the incubation temperature: the focal feature shows active cultures
    held at around 22°C overnight,

    far below the roughly 43°C they need, so they are alive but barely working — a
    thermal problem, not a dead

    culture. Nothing in xbase elevates the starter for this user, who uses a fresh
    live tub each time, so the

    anecdote has no mechanism for this case.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the user uses a fresh tub of plain live yogurt
    as the starter each time, weakening the dead-starter pathway without naming the
    incubation temperature; the decisive thermometer reading lives only in HH/LH.
