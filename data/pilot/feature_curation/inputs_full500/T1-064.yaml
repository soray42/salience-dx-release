distractor_direction:
  label: Connection-pool exhaustion
  description: Investigating whether application-side connection-pool depletion or
    queue-wait time is causing the P99 latency spike on the RPC endpoint.
plausible_alternative_directions:
- label: Downstream service degradation
  description: Whether one of the three downstream services the endpoint calls is
    itself degraded, with the cascade causing the P99 regression.
- label: Database query plan regression
  description: Whether a query-plan change on the backing database — triggered by
    stale statistics or a schema change — slowed queries independently of the cache
    tier.
- label: Network routing change
  description: Whether a route or peering change between the endpoint host and its
    dependencies introduced latency for this traffic class.
