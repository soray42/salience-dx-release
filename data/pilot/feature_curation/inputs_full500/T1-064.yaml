seed_id: T1-064
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Our distributed tracing shows a spike in P99 response time for our most-called
  internal RPC endpoint — up from around 90 ms to nearly two seconds over the past
  five days. No application code changes were deployed during that window. The endpoint
  hits three downstream services, and I have not found an obvious suspect looking
  at aggregate metrics. I opened a thread in our reliability channel asking for help.
  {DS}
focal_diagnostic_feature: The cache tier between the endpoint and the database shows
  disk read latency averaging 800 ms on cold keys while pool metrics across all replicas
  show healthy utilisation throughout the spike.
low_diagnostic_proposition: A senior SRE at a peer company attributed a similar RPC
  P99 spike to connection-pool exhaustion.
oracle_action: ANSWER
oracle_focus: Investigate the cache tier's cold-key disk read path; the 800 ms cold-read
  latency on cache misses accounts for the P99 regression while healthy pool metrics
  rule out connection-pool exhaustion.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the connection-pool-exhaustion diagnosis
  from the external anecdote. Ask for per-service latency breakdown and pool-wait
  metrics before diagnosing application-side pooling.
