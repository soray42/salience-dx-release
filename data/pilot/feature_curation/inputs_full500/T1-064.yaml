causal_audit:
  steelman: 'A senior SRE invoking connection-pool exhaustion is credible: depleted
    pools

    cause requests to queue at the application boundary, which manifests as a

    P99 spike on the RPC endpoint. The pattern of no-code-change plus sudden

    P99 regression is consistent with a pool leak accumulating over days. A

    busy practitioner would reasonably put pool exhaustion on a checklist. The

    seed is clean, however, because the focal evidence in HH shows pool metrics

    are healthy across all replicas throughout the spike — elevated pool-wait

    time would be visible in pool utilisation dashboards if exhaustion were the

    cause. Cold-key cache disk reads at 800 ms, with warm reads at 5 ms, points

    to a cache cold-start or eviction issue as the mechanism, not pool queuing.

    The pool-metrics data structurally rule out exhaustion for this case.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — xbase states only that aggregate metrics show no
    obvious suspect; the pool-health evidence lives only in HH/LH.
