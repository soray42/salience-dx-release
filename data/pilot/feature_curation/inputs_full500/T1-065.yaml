xbase: I'm deciding whether to move my workouts from early morning to after work.
  I've been a morning lifter for two years and it has mostly stuck, but lately the
  alarm feels brutal and a colleague raves about training in the evening. My job ends
  at a predictable time and the gym is open both early and late, so either slot is
  physically available to me. I want to keep my four-sessions-a-week habit intact
  through the switch. {DS}
