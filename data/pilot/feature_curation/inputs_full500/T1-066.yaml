seed_id: T1-066
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: One of our employees cannot complete SSO login to our SAML app; everyone else
  signs in fine. The identity provider shows a successful authentication, but when
  the browser posts the assertion back, our service provider rejects it and bounces
  the user to an error page. This started for this one person yesterday and has not
  spread. Nothing in our SAML configuration or the IdP metadata changed in that window.
  {DS}
focal_diagnostic_feature: The service provider's logs reject the assertion with a
  NotBefore violation, and the failing user's laptop clock is running eleven minutes
  ahead of real time.
low_diagnostic_proposition: A comparable SSO failure at another company was traced
  to a rotated identity-provider signing certificate.
oracle_action: ANSWER
oracle_focus: Fix the time sync on the affected user's laptop; the assertion's NotBefore
  is in that machine's future because its clock is eleven minutes fast, so the SP
  legitimately rejects it.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the outside certificate-rotation story.
  Ask for the SP's exact rejection reason and whether the failure is isolated to one
  user or device.
