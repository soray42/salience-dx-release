xbase: I'm picking between two structured running plans to take me from a comfortable
  5k to a 10k over the next few months. Plan A and Plan B both have good reputations
  and similar prices, and I can start either one next week. My only fixed constraint
  is that I can reliably train at 6am on weekdays before work, and weekends are usually
  taken up with family. I want a plan I can actually follow rather than one I admire
  from a distance. {DS}
