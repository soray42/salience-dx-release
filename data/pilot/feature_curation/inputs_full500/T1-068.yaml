causal_audit:
  steelman: 'A senior engineer could argue that identity-provider rate limits are
    a notorious source of intermittent 401s in

    high-throughput gateways: when token introspection or JWKS fetches exceed a quota,
    the provider returns auth

    errors on the throttled subset, producing exactly the one-in-eight, retry-succeeds
    pattern observed. That is a

    legitimate cause-class in general. But it cannot fit THIS case: xbase states the
    IdP reports no errors on its

    side and tokens verify in local tooling, so the provider is not rejecting anything,
    and the focal evidence

    concentrates all failures on a single replica''s stale key cache rather than on
    a provider quota. The rate-limit

    pathway is structurally excluded by the clean provider status and the single-replica
    concentration.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the IdP reports no errors and tokens verify
