seed_id: T1-068
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Our API gateway intermittently returns 401 Unauthorized to clients that are
  presenting valid, unexpired access tokens; a retry of the identical request usually
  succeeds. The rate of failures is small but steady, around one in eight calls, and
  it has persisted across three days. The tokens themselves verify fine in our local
  tooling, and the upstream identity provider reports no errors on its side. We run
  several gateway replicas behind a load balancer. {DS}
focal_diagnostic_feature: Every 401 is served by one specific gateway replica whose
  cached JWKS is stale, so it lacks the new signing key the IdP rotated to four days
  ago and rejects tokens signed with it.
low_diagnostic_proposition: A comparable intermittent-401 problem at another company
  was caused by hitting the identity provider's rate limit.
oracle_action: ANSWER
oracle_focus: Force a JWKS refresh on the affected replica and fix its key-cache TTL
  or rotation handling; it is rejecting tokens signed with a key it never fetched
  after the IdP's rotation four days ago.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the outside rate-limit story. Ask whether
  the 401s correlate with a specific replica and whether each replica's signing-key
  cache is current.
