variants:
  HL:
    distractor: Dimitris, a staff engineer at a company with a near-identical gateway
      setup, told me they chased this exact intermittent-401 pattern for days and
      it turned out they were silently tripping the identity provider's rate limit,
      which replied with 401s on the calls that got throttled.
    diagnosticity: low
    salience: high
    proposition: A comparable intermittent-401 problem at another company was caused
      by hitting the identity provider's rate limit.
    salience_source: A — a named staff engineer with a matching architecture recounting
      a first-hand debugging effort lends strong domain credibility.
    why_plausible: Provider rate limits do return auth-style errors intermittently,
      so for a busy on-call the throttling story fits the one-in-eight pattern.
    why_irrelevant: The IdP reports no errors and tokens verify locally; a rate-limit
      cause would show provider-side throttling, not failures concentrated on a single
      replica's stale key cache.
  LL:
    distractor: Another company's similar intermittent-401 issue was caused by hitting
      the identity provider's rate limit.
    diagnosticity: low
    salience: low
    proposition: A comparable intermittent-401 problem at another company was caused
      by hitting the identity provider's rate limit.
    matched_to: HL
  HH:
    distractor: 'I correlated the 401s by host and every single one comes from replica
      three. Its JWKS cache is stale: it never picked up the new signing key the IdP
      rotated to four days ago, so it rejects any token signed with that key while
      the other replicas accept them.'
    diagnosticity: high
    salience: high
    proposition: Every 401 is served by one specific gateway replica whose cached
      JWKS is stale, so it lacks the new signing key the IdP rotated to four days
      ago and rejects tokens signed with it.
    salience_source: Concrete by-host correlation pinning all 401s to replica three
      plus the named four-day-old key rotation makes the cause precise and undeniable.
  LH:
    distractor: All 401s come from one replica whose stale JWKS lacks the IdP's signing
      key rotated four days ago.
    diagnosticity: high
    salience: low
    proposition: Every 401 is served by one specific gateway replica whose cached
      JWKS is stale, so it lacks the new signing key the IdP rotated to four days
      ago and rejects tokens signed with it.
    matched_to: HH
distractor_direction:
  label: Provider rate limiting
  description: Investigating whether the identity provider is throttling the gateway's
    token-validation traffic and returning 401s on rate-limited calls.
plausible_alternative_directions:
- label: Clock skew on a replica
  description: Whether one replica's clock drift causes it to treat valid tokens as
    expired or not-yet-valid.
- label: Load-balancer session affinity
  description: Whether sticky-session or routing behaviour sends a subset of requests
    down a misconfigured validation path.
