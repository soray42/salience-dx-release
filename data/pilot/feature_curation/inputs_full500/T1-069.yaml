xbase: I'm deciding whether to buy the annual pass for a local eight-race running
  series. The pass costs €120 up front, while paying race by race is €25 each. I enjoy
  these events and like the idea of committing to the whole season. The weekends matter
  here, because I have a fixed family rota that blocks out specific Saturdays well
  in advance, and most of these races are on Saturday mornings. I have to buy the
  pass before the early-bird window closes this week. {DS}
