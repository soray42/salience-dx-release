causal_audit:
  steelman: 'A behaviour-change coach might argue that a season pass is a commitment
    device: by sinking €120 up front the

    user raises the cost of skipping and may attend more often, and a credible peer
    who loved that effect suggests

    the user could too, making the nominal per-race math beside the point. The motivation
    mechanism is real in the

    abstract. But it cannot bear on THIS case, because the user''s non-attendance
    is driven by a fixed external family

    rota that blocks specific Saturdays regardless of how committed they feel; sunk
    cost cannot free a rota-blocked

    weekend. With only two of eight dates available, the pass is dominated by per-race
    pricing, and the peer''s

    enthusiasm has no mechanism to change that.

    '
