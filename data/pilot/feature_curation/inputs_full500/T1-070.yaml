seed_id: T1-070
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Our backend service fails its TLS handshake when one particular partner client
  connects to it, while our own browsers and our test harness reach the same endpoint
  over HTTPS without complaint. The partner reports a generic certificate validation
  error and the connection is dropped before any application data flows. Our certificate
  is current and was issued by a well-known public CA. We did not change the certificate
  or the server configuration when this began. {DS}
focal_diagnostic_feature: A handshake capture shows the server presents only its leaf
  certificate and omits the intermediate, so clients without that intermediate cached
  cannot build a path to the trusted root.
low_diagnostic_proposition: A similar TLS validation failure elsewhere was caused
  by an expired root certificate in the client's trust store.
oracle_action: ANSWER
oracle_focus: Fix the server to send the full chain including the intermediate certificate;
  it currently presents only the leaf, so clients lacking that intermediate cannot
  build a path to the root and reject the handshake.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the outside expired-root story. Ask what
  certificates the server actually presents in the handshake and whether the chain
  includes the intermediate.
cell_oracles:
  HL:
    action: ASK
    focus: Do not adopt the outside expired-root story. Ask what certificates the
      server actually presents in the handshake and whether the chain includes the
