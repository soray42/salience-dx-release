seed_id: T1-071
template: T1
domain: open_qa
complexity: medium
xbase: I'm deciding whether to enrol in a part-time online data-analytics certificate
  that costs about €2,400 over six months. I work full time and could realistically
  spend maybe five hours a week on it. The provider has decent public reviews and
  the syllabus covers tools my field actually uses. My manager has hinted that more
  analytics skills would help, but nothing is promised in writing. I want to make
  a sound decision before the early-bird deadline closes. {DS}
focal_diagnostic_feature: The certificate requires roughly twelve hours of coursework
  per week to complete on schedule, three times what the user can commit.
low_diagnostic_proposition: A former colleague enrolled in a similar online certificate
  and dropped out because the instruction was poorly delivered.
oracle_action: ANSWER
oracle_focus: Do not enrol on the current plan; the course needs about twelve hours
  weekly and the user can give five, so they would fall behind and likely not finish
  on time.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let one colleague's bad experience decide this.
  Ask how many hours per week the course actually requires and how that compares with
  the time the user can give.
