distractor_direction:
  label: Teaching-quality risk
  description: Treating the enrolment decision as mainly about whether the course
    is well taught, because a colleague dropped out over poor instruction.
plausible_alternative_directions:
- label: Career payoff uncertainty
  description: Whether the skills will actually advance the user's role given no written
    commitment from the manager.
- label: Cost versus alternatives
  description: Whether cheaper or self-paced resources could deliver the same skills
    for less money.
