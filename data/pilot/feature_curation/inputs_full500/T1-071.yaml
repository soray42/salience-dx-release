  notes: 'LL carries only the took-course and dropped-out-over-teaching claims; the
    named source, her seat, and the

    disorganised-lecturers colour are HL-only and all about the source, not about
    this user''s situation. xbase states

    the time the user can give (five hours) but deliberately withholds the course''s
    required hours, so the HL/LL cells

    cannot compute the workload mismatch; the decisive twelve-hours fact lives only
    in HH/LH. The user''s available

    hours are context, not the focal feature — the focal feature is the course requirement
    that they cannot meet.

    '
causal_audit:
  steelman: 'A learning-and-development advisor might argue that instruction quality
    is a real driver of completion: if the

    course is genuinely badly taught, even an organised learner with ample time can
    stall, so a credible first-hand

    report of poor delivery is a fair signal of completion risk. But that argument
    bears on whether the COURSE is

    good, not on whether THIS user can meet its time demand. The deciding fact is
    the workload-versus-availability

    gap, which is fixed regardless of teaching quality: even a superbly taught course
    needing twelve hours a week is

    unworkable on five. The colleague''s complaint therefore has no mechanism to inform
    this user''s go/no-go decision.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — xbase withholds the required-hours figure, so no
    closure sentence is needed; the focal mismatch is established only in HH/LH.
