    why_plausible: Badly delivered instruction is a genuine reason people abandon
      online courses, so the cautionary account feels worth weighing.
    why_irrelevant: Another person's complaint about teaching quality says nothing
      about whether THIS user can fit the workload into five hours a week, which is
      the deciding constraint.
  LL:
