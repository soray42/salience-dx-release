seed_id: T1-072
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Our Kubernetes pods for one service keep getting OOMKilled and restarting a
  few times an hour. The deployment is unchanged for six weeks and traffic is flat.
  The container has a 512Mi memory limit, and the service is a fairly standard JVM
  application behind a sidecar. Liveness and readiness probes pass between restarts,
  and the node itself has plenty of free memory. The kills happen within seconds of
  each pod starting, before any request load arrives. {DS}
focal_diagnostic_feature: The JVM has no explicit max-heap flag, so it sizes its heap
  to a fraction of the node's total memory and ignores the 512Mi cgroup limit.
low_diagnostic_proposition: A team elsewhere had recurring OOMKills that turned out
  to be a memory leak in their application code.
oracle_action: ANSWER
oracle_focus: The JVM is sizing its heap from node memory, not the 512Mi cgroup limit,
  so it grows past the container cap; set an explicit max-heap or enable container-aware
  memory sizing so the heap fits inside the limit.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the outside memory-leak story. Ask whether
  the JVM heap is sized to the node or the cgroup limit and what the actual heap and
  RSS look like before each kill.
cell_oracles:
