xbase: I'm trying to pick between two language-learning app subscriptions to finally
  get conversational in Portuguese. Both cost roughly the same per year and both have
  large user bases. I can study about twenty minutes a day on my commute. I want to
  choose well because I tend to stick with whatever I start. {DS}
focal_diagnostic_feature: Only App A includes live tutor conversation sessions; App
  B is entirely solo drills with no speaking practice, which the user's spoken-fluency
  goal requires.
low_diagnostic_proposition: A friend used one of these apps and found its review-scheduling
  algorithm frustratingly aggressive.
