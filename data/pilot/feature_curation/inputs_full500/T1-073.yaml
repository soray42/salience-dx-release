causal_audit:
  steelman: 'A language-app reviewer might argue scheduler aggressiveness matters:
    spaced repetition that overwhelms a learner

    drives abandonment, and since the user says they stick with what they start, an
    app that becomes a daily chore

    could undermine the whole effort, making the friend''s report decision-relevant.
    But that bears on retention

    comfort, not on capability: the user''s stated goal is conversational fluency,
    and an app with no speaking practice

    cannot deliver it no matter how gentle its scheduling. The decisive feature is
    the presence of live conversation,

    which the friend''s scheduling complaint does not touch, so it has no mechanism
    to pick the right app here.

    '
