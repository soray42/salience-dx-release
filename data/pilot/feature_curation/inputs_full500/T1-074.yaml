seed_id: T1-074
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Our nightly job that pushes container images to a private registry has started
  failing intermittently for about a week. Roughly one push in five fails partway
  through with a generic error, and a retry usually succeeds. The registry is managed,
  the credentials are valid, and smaller images push fine. We did not change the CI
  pipeline or the registry plan recently. I want a clear direction before the next
  release train. {DS}
focal_diagnostic_feature: Only pushes of the largest multi-gigabyte images fail, and
  they fail at roughly the same elapsed time, matching the registry's per-request
  upload timeout.
low_diagnostic_proposition: A team at another company had registry push failures caused
  by their auth token expiring mid-operation.
oracle_action: ANSWER
oracle_focus: The large images are hitting the registry's per-request upload timeout;
  use chunked or resumable blob uploads, raise the client timeout, or shrink the image
  layers so each upload completes inside the window.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the outside token-expiry story. Ask which
  images fail, at what elapsed time they fail, and whether failures track image size
  rather than credentials.
