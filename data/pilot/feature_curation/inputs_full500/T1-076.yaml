seed_id: T1-076
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Our managed Kubernetes cluster autoscaler keeps adding nodes even though dashboards
  show the existing nodes sitting around 30% CPU and memory. We end up paying for
  far more nodes than the workload seems to need. Nothing changed in the autoscaler
  config for two months, and pod counts are steady. The cluster is multi-tenant with
  several teams' workloads. I want to understand the scale-up before our cloud bill
  grows further. {DS}
focal_diagnostic_feature: A batch of pods sit in Pending because their CPU resource
  requests sum above node capacity, so the autoscaler adds nodes to satisfy requests
  even though actual usage is low.
low_diagnostic_proposition: Another company saw runaway node scale-up caused by a
  metrics-server misconfiguration reporting inflated utilisation.
oracle_action: ANSWER
oracle_focus: The autoscaler scales on pod resource requests, not actual usage; pending
  pods with oversized CPU requests are forcing scale-up. Right-size the pod requests
  to match real usage so the scheduler packs them onto fewer nodes.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the outside metrics-server story. Ask whether
  pods are Pending on unschedulable requests and what the sum of pod CPU requests
  is versus node capacity.
cell_oracles:
  HL:
    action: ASK
    focus: Do not adopt the outside metrics-server story. Ask whether pods are Pending
      on unschedulable requests and what the sum of pod CPU requests is versus node
      capacity.
  LL:
    action: ASK
    focus: Do not adopt the outside metrics-server story. Ask whether pods are Pending
