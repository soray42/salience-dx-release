domain: open_qa
complexity: low
xbase: My greenhouse tomatoes looked perfect until this week. The plants are tall,
  the foliage is a healthy green, and the upper fruit are ripening normally. But several
  of the larger fruit lower on the vines have developed an ugly dark patch, and a
  couple have started to look unappetising where that patch sits. I have grown tomatoes
  for three summers and never seen this exact thing. None of the patches look wet
  or feel soft, and they have not spread to neighbouring fruit. {DS}
focal_diagnostic_feature: The dark patch is confined to the blossom end of each affected
  fruit, is dry, sunken, and leathery rather than mouldy, and the foliage shows no
  lesions.
low_diagnostic_proposition: Another grower's tomatoes developed similar dark spots
  that were attributed to a fungal blight requiring spraying.
oracle_action: ANSWER
oracle_focus: 'Treat this as blossom-end rot: a calcium-availability problem driven
  by uneven watering, not an infection. Even out soil moisture, mulch, and avoid heavy
  nitrogen; do not spray fungicide for it.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the fungal-blight story from another grower's
  crop. Ask where on the fruit the patch sits, whether it is moist or dry, and whether
  the leaves show any lesions.
