  HH:
    action: ANSWER
    focus: Reserve layout space for the late-loading media before it arrives — set
      explicit width/height (or aspect-ratio) on the images and fixed dimensions on
      the ad slots — so the browser no longer reflows the text as each element loads.
  LH:
    action: ANSWER
    focus: Reserve layout space for the late-loading media before it arrives — set
