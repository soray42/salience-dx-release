  HL:
    action: ASK
    focus: Do not adopt the web-font-swap explanation from the peer's site. Ask what
      each shift coincides with and whether the images and ad slots declare explicit
      dimensions.
  LL:
    action: ASK
    focus: Do not adopt the web-font-swap explanation from the peer's site. Ask what
