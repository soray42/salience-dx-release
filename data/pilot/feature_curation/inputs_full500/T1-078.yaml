seed_id: T1-078
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: 'On our news site the article page visibly jumps around for the first second
  or two after it opens. A reader starts reading the headline, then the whole text
  lurches downward and they lose their place; sometimes they tap the wrong link because
  a button slides under their thumb just as they reach for it. It happens on phones
  and on desktop, and our Core Web Vitals report flags a poor layout-stability score.
  Our fonts use font-display: optional and are preloaded, so no font swap occurs.
  {DS}'
focal_diagnostic_feature: Each layout shift coincides with an image or ad slot finishing
  its load, and those elements declare no width or height, so the browser reserves
  no space for them until they arrive.
low_diagnostic_proposition: A peer's site had the same jumping behaviour that was
  traced to a web font swapping in after the fallback rendered.
oracle_action: ANSWER
oracle_focus: Reserve layout space for the late-loading media before it arrives —
  set explicit width/height (or aspect-ratio) on the images and fixed dimensions on
  the ad slots — so the browser no longer reflows the text as each element loads.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the web-font-swap explanation from the peer's
  site. Ask what each shift coincides with and whether the images and ad slots declare
  explicit dimensions.
