xbase: 'I planted a clematis against my back fence last spring hoping for a wall of
  summer flowers. It has gone absolutely wild with growth: thick stems, masses of
  big dark-green leaves, and it has already climbed past the top of the fence. The
  trouble is there is hardly a single flower bud on the whole thing. Last year it
  bloomed reasonably well in its first season, so I know the plant can flower. I tested
  the soil last month and potassium is adequate. {DS}'
focal_diagnostic_feature: The plant sits in a strip receiving regular high-nitrogen
  lawn feed and shows lush dark foliage and vigorous leafy growth with almost no flower
  buds, the signature of nitrogen overload.
low_diagnostic_proposition: An experienced gardener said a non-flowering climber like
  this needs a high-potassium bloom feed to start flowering.
oracle_action: ANSWER
oracle_focus: Stop the nitrogen reaching the plant — keep the lawn feed off this strip
  — rather than adding more fertiliser; the lush leaf-heavy, bud-poor growth shows
  it has excess nitrogen, and a bloom feed will not fix an oversupply of the wrong
  nutrient.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the add-a-bloom-feed advice. Ask what fertiliser
  the plant is already receiving and whether its growth is leaf-heavy and bud-poor
  before recommending more feeding.
