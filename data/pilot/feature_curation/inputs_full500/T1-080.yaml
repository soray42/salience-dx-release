    why_plausible: Charting libraries can genuinely retain datasets, and a session
      that crawls over hours is a believable library-cache leak, so a trusted peer's
      account is tempting to act on.
    why_irrelevant: The retained memory here is detached component trees pinned by
      the application's own un-removed window listeners; xbase already shows the growth
      persists without the charting library, so the library-cache path is structurally
      closed.
