causal_audit:
  steelman: 'A front-end performance engineer could argue that charting libraries
    are a classic memory-leak source: many keep

    references to series data or canvas contexts for re-rendering, a dashboard that
    re-renders charts on every view

    would accumulate them, and a trusted peer who fixed an identical creep by replacing
    the library has direct evidence.

    However, xbase now directly forecloses this path: profiling with the charting
    library removed still shows the same

    monotonic growth, which eliminates the library as a necessary or sufficient contributor
    to this case.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states 'Profiling with the charting library removed
    shows the same growth pattern' — this rules out third-party library retention
    as a causal path for this case specifically, leaving no mechanism by which the
    charting-library-cache hypothesis could explain the observed growth.
