distractor_direction:
  label: Charting library cache leak
  description: Investigating whether a third-party charting library retains every
    rendered dataset internally and should be replaced to stop the memory growth.
plausible_alternative_directions:
- label: Un-removed event listeners
  description: Whether components register global listeners that are never torn down,
    pinning detached DOM and state across navigations.
- label: Growing client-side cache
  description: Whether the app accumulates fetched data in an in-memory store that
    is never evicted as the session runs.
