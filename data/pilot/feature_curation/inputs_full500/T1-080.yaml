seed_id: T1-080
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Our single-page dashboard gets slower the longer someone keeps the tab open.
  After a busy analyst has clicked between views for a couple of hours, scrolling
  stutters, charts lag, and eventually the tab can crash with an out-of-memory error.
  A hard reload fixes it instantly, then the slow creep starts again. The bundle size
  is reasonable and the API responses are quick, so the network is not the problem.
  Profiling with the charting library removed shows the same growth pattern. {DS}
focal_diagnostic_feature: Heap snapshots show detached-node counts climbing on every
  view switch and never falling, because each view registers window listeners on mount
  and never removes them on unmount, keeping old component trees referenced.
low_diagnostic_proposition: A peer reported the same memory creep, attributed to a
  third-party charting library caching every rendered dataset.
oracle_action: ANSWER
oracle_focus: Fix the listener leak in the views' lifecycle — remove the window resize
  and scroll handlers on unmount (return a cleanup function) so detached component
  trees become collectable; the growth is the application's own un-cleaned listeners,
  not the charting library's cache.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the peer's charting-library cache explanation.
  Ask for heap snapshots across navigations and whether detached nodes accumulate
  and which references retain them.
