seed_id: T1-081
template: T1
domain: open_qa
complexity: low
xbase: I planted a young hydrangea in a border about three weeks ago and it is wilting
  badly. The leaves go limp and droopy by midday even though I water it generously,
  and the soil around the base feels damp whenever I check it. The plant came from
  a reputable nursery and looked perfectly healthy when I bought it. The weather has
  been mild, not a heatwave. {DS}
focal_diagnostic_feature: The root ball is still enclosed in its original plastic-backed
  burlap and wire wrapping, the roots have not grown out into the surrounding soil,
  and the soil stays damp.
low_diagnostic_proposition: A knowledgeable neighbour said a sudden wilt like this
  is nearly always a sap-sucking pest infestation needing insecticide.
oracle_action: ANSWER
oracle_focus: Lift the plant and remove the plastic-backed burlap and wire wrapping
  from the root ball, then replant so roots can grow into the soil; the wilt is the
  wrapped roots failing to take up water despite damp soil, not a pest, so no spray
  is warranted.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the pest-infestation diagnosis. Ask whether
  there are actual insects or feeding signs, and whether the root ball was unwrapped
  at planting and the soil is damp.
