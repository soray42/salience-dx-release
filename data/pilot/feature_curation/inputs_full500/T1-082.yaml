template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Our booking web app shows the appointment time correctly for most of our staff,
  but a handful of users keep reporting that the date field reads 'Invalid Date' and
  the confirmation screen is blank for them. We cannot reproduce it on our own machines
  no matter what we try. The same code path, the same API response, and the same booking
  flow are involved every time someone hits it. {DS}
focal_diagnostic_feature: All affected users are on Safari, and the API returns the
  time as a space-separated string that Chrome parses but Safari's Date parser rejects,
  returning Invalid Date because it lacks the ISO 'T' separator.
low_diagnostic_proposition: A peer attributed a similar invalid-date problem to timestamps
  lacking a timezone offset being assumed UTC by the browser.
oracle_action: ANSWER
oracle_focus: Normalise the timestamp string before parsing — supply a real ISO-8601
  value with the 'T' separator (or parse explicitly) so Safari's stricter Date parser
  accepts it; the failure is browser-specific string parsing, not a missing timezone
  offset.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the missing-timezone-offset explanation.
  Ask which browsers the affected users run and what exact string the API returns
  and how it is parsed.
