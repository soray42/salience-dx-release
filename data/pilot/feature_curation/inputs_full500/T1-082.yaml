distractor_direction:
  label: Missing timezone offset
  description: Investigating whether timestamps without a timezone offset are being
    assumed UTC and shifting the displayed date.
plausible_alternative_directions:
- label: Client-side error swallowing the value
  description: Whether a JavaScript exception or empty API field clears the date before
    rendering, independent of the browser's own date parser.
- label: Locale or encoding difference
  description: Whether affected users have a locale, language, or encoding setting
    that changes how the string is interpreted.
