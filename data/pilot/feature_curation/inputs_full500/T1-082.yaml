    why_plausible: Missing timezone offsets are a classic date-handling bug that produces
      wrong days and confusing output, so a trusted peer naming it is a defensible
      first hypothesis.
    why_irrelevant: A missing offset shifts a valid date by hours; it does not produce
      'Invalid Date'. The failure is a parse rejection confined to Safari for a non-ISO
      string, which a timezone offset would not cause.
