xbase: I drive a small hatchback and I'm trying to decide whether to buy a set of
  dedicated winter tyres this year, which is a real expense for me. I keep my current
  all-season tyres in good shape, I park in a covered carport, and my daily commute
  is short and mostly on main roads that get cleared. The area where I live rarely
  drops below about 7°C in winter. {DS}
focal_diagnostic_feature: Settling snow occurs only two or three days a year in the
  user's area, and the user can avoid driving on those days by working from home.
low_diagnostic_proposition: A driver who slid through a junction on all-season tyres
  concluded that dedicated winter tyres are an essential safety upgrade.
oracle_action: ANSWER
oracle_focus: On these conditions, dedicated winter tyres are not worth the cost for
  this user; the climate rarely reaches the temperature where winter rubber helps
  and the few snow days can be avoided entirely, so good all-seasons are sufficient.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let one person's crash story set the answer. Ask
