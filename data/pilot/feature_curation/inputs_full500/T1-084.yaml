seed_id: T1-084
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Our RabbitMQ queue depth keeps climbing while our consumer service sits almost
  idle, barely using any CPU. The consumers are connected and the management UI shows
  them attached to the queue, but throughput has collapsed to a trickle. We did not
  change the consumer code or the broker version in this release, and the publishers
  are sending at their normal rate. {DS}
focal_diagnostic_feature: Each consumer has a prefetch count of 250 and is holding
  250 unacknowledged messages while blocked on a slow downstream call, so the broker
  will not deliver more to channels that have not acknowledged.
low_diagnostic_proposition: A comparable idle-consumer backlog at another company
  was caused by consumers silently failing on each message and reconnecting in a loop.
oracle_action: ANSWER
oracle_focus: The consumers are saturated with unacknowledged messages because each
  holds its full prefetch while blocked on a slow downstream call; reduce or fix the
  downstream latency, lower prefetch, or move slow work off the consumer so messages
  get acknowledged and the broker resumes delivery.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not import the other company's crash-loop explanation.
  Ask whether these consumers are actually crashing and reconnecting, or holding unacknowledged
  messages, and check the prefetch count and unacked depth per channel.
