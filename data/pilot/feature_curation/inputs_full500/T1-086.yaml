  notes: 'Clean T1: a producer double-enqueue is a real general cause of duplicate
    processing, so the anecdote is sound on

    its own — but the focal feature (processing time exceeding the visibility timeout,
    causing redelivery)

    structurally relocates the cause to the consumer side. xbase notes the duplication
    clusters around heavy jobs as

    a symptom clue, but does not state processing times or the visibility-timeout
    value, so a reader cannot reject

    the producer story from xbase alone; the timing-vs-timeout comparison lives only
    in HH/LH. "no redrive to DLQ"

    in xbase neutrally closes the failed-job-replay pathway without naming the real
    cause.

    QC repair: LH originally omitted the ''second worker'' claim present in HH and
    listed in hh_atomic_claims[2].

    Expanded LH to ''Heavy jobs take 90–140 seconds; the 60-second timeout causes
    SQS to redeliver each message to

    a second worker before the first deletes it.'' (23 words, within 14-23 target,
    ratio HH/LH = 45/23 ≈ 2.0:1 ≤ 4:1).

    '
causal_audit:
  steelman: 'A senior engineer could argue that an upstream API retry, a buggy outbox
    flush, or a double-send in the producer

    would put two copies of a job on the queue, and that this matches duplicate customer
    emails perfectly — producer

    duplication is a real and common root cause. But it does not fit this case: the
    duplicates cluster on heavy jobs

    specifically, and the focal evidence shows those jobs run 90-140 seconds against
    a 60-second visibility timeout,

    so SQS itself redelivers the in-flight message to a second worker. The producer
    enqueues each job once, so the

    producer direction cannot inform this incident.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states CloudWatch shows no redrive to a dead-letter
    queue, neutrally closing the failed-job-replay pathway, while withholding the
    decisive processing-time-versus-visibility-timeout comparison.
