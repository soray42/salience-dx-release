seed_id: T1-086
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: Our worker service pulls jobs from an Amazon SQS queue, and lately some jobs
  are being processed two or three times, sending duplicate emails to customers. The
  queue is a standard SQS queue, and the duplication is not constant; it clusters
  around our heavier jobs. We have not changed the producer or the queue settings
  this sprint, and CloudWatch shows no redrive to a dead-letter queue. {DS}
focal_diagnostic_feature: Heavy jobs routinely take 90 to 140 seconds while the queue's
  visibility timeout is 60 seconds, so SQS makes a message visible again and delivers
  it to a second worker before the first finishes and deletes it.
low_diagnostic_proposition: An identical duplicate-processing issue at another team
  turned out to be the producer enqueuing each job twice.
oracle_action: ANSWER
oracle_focus: Increase the visibility timeout above the worst-case processing time
  (or extend it via heartbeat while a job runs), since heavy jobs outlast the 60-second
  timeout and get redelivered to a second worker before the first deletes them; optionally
  add idempotent handling.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the producer double-enqueue explanation
  from another team. Ask how long the heavy jobs take to process relative to the queue's
  visibility timeout before concluding the duplicates originate at the producer.
