distractor_direction:
  label: Producer double-enqueue
  description: Investigating whether the producer is enqueuing each job more than
    once, so duplicates exist before any worker runs.
plausible_alternative_directions:
- label: Visibility-timeout expiry
  description: Whether processing exceeds the visibility timeout
  causing SQS to redeliver in-flight messages.: null
- label: Standard-queue at-least-once
  description: Whether the standard queue's inherent at-least-once delivery needs
    idempotent handling.
- label: Worker delete-after-failure
  description: Whether workers fail to delete messages on success
  leaving them to reappear.: null
