seed_id: T1-087
template: T1
domain: open_qa
complexity: medium
xbase: My car has started cranking slowly in the mornings, and twice this week it
  barely turned over before catching. I'm trying to decide whether to just replace
  the battery now or hold off and keep an eye on it, since money is a little tight
  this month. The car is six years old and the battery is the original one that came
  with it. {DS}
focal_diagnostic_feature: A load test failed the battery under cranking load, where
  its voltage sagged well below the pass threshold, while charging voltage with the
  engine running measured normal at the terminals.
low_diagnostic_proposition: Someone's identical slow-cranking turned out to be a failing
  alternator rather than the battery.
oracle_action: ANSWER
oracle_focus: Replace the battery now; at six years it is original, it failed a load
  test under cranking load, and the charging system is delivering normal voltage,
  so the battery itself is the worn-out component, not the alternator.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the alternator explanation from someone
  else's car. Ask for a battery load test and a charging-voltage check before deciding
  whether the battery or the charging system is at fault.
