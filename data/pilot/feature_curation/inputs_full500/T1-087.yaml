  notes: 'Clean T1: a failing alternator is a real general cause of slow cranking
    (it leaves the battery undercharged), so

    the anecdote is reasonable — but the focal feature (failed load test under load
    plus normal charging voltage)

    structurally rules the alternator out and confirms the battery. xbase states the
    battery''s age and the symptom,

    which makes a worn battery plausible, but does NOT report the load-test result
    or charging voltage, so a reader

    cannot conclusively choose battery over alternator from xbase alone; both remain
    live until the HH measurements.

    '
causal_audit:
  steelman: 'A mechanic could argue that an alternator with worn brushes or a bad
    diode undercharges the battery, so the car

    starts the day with a partially depleted battery and cranks slowly — and that
    replacing the battery without fixing

    the alternator would just leave the new battery undercharged too. This is a genuine
    failure mode. But it does not

    fit this car: the focal test shows normal charging voltage at the terminals with
    the engine running, which

    exonerates the alternator, while the battery failed a load test under cranking
    load. The alternator direction

    therefore cannot inform this decision.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the decisive load-test and charging-voltage results
    are intentionally withheld from xbase, which carries only the symptom, the car's
    age, and the original-battery context.
