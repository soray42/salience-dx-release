    quota
  causing fetch throttling independent of partition-key distribution.: null
- label: Slow per-record processing
  description: Whether the consumer's per-record work has slowed
  reducing throughput per shard.: null
- label: Under-provisioned shard count
  description: Whether the stream needs more shards for genuine volume growth.
