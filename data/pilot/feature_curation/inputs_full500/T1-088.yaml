causal_audit:
  steelman: 'A streaming engineer could argue that the KCL writes a checkpoint to
    a DynamoDB table per shard-lease, and if that

    table is under-provisioned it throttles, stalling checkpoints and back-pressuring
    record processors so iterator

    age climbs across the board — a real, documented failure mode. However, xbase
    now explicitly states that

    DynamoDB capacity metrics show no throttling events, which forecloses this pathway
    structurally: there is no

    throttling on the checkpoint table for the KCL to stall against. The checkpoint-throttling
    direction therefore

    cannot inform this incident.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states 'DynamoDB capacity metrics show no throttling
    events', directly ruling out checkpoint-table throttling as a mechanism without
    revealing the affirmative cause.
