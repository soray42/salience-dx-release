seed_id: T1-088
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Our Kinesis Data Streams consumer has been falling steadily behind for the
  past week, and the iterator age keeps climbing into the tens of minutes during business
  hours. The stream has eight shards, and our consumer application runs enough instances
  to cover them. We have not deployed a new consumer build, the overall record volume
  into the stream is only up slightly from last month, and DynamoDB capacity metrics
  show no throttling events. {DS}
focal_diagnostic_feature: Per-shard metrics show one shard carrying almost all the
  traffic while the other seven are nearly idle, because the producer sets the same
  constant partition key on every record, so all records hash to that single hot shard.
low_diagnostic_proposition: An identical Kinesis lag at a partner company was caused
  by throttling on the KCL's DynamoDB checkpoint/lease table.
oracle_action: ANSWER
oracle_focus: Fix the partition-key distribution at the producer so records spread
  across all eight shards instead of hashing to one; the lag comes from a single hot
  shard caused by a constant partition key, which adding consumer instances or DynamoDB
  capacity will not resolve.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not import the partner company's DynamoDB-throttling
  explanation. Ask for per-shard incoming-record and iterator-age metrics and the
  producer's partition-key strategy before concluding the checkpoint table is the
  bottleneck.
