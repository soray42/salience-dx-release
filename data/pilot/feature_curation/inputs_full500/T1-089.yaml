variants:
  HL:
    distractor: Zoltán in my office had nearly the same cracked screen on his laptop
      a few months ago and told me the manufacturer replaced the whole display panel
      for free without any fuss at all.
    diagnosticity: low
    salience: high
    proposition: A friend's cracked-screen warranty claim on a similar laptop was
      approved without difficulty.
    salience_source: A — a named coworker recounting a concrete, recent first-hand
      claim experience lends the reassurance credibility.
    why_plausible: Manufacturers do sometimes approve screen claims, so a confident
      success story makes a free repair feel like the expected outcome.
    why_irrelevant: Another person's claim outcome reveals nothing about whether THIS
      user's warranty covers accidental drop damage; coverage scope, not precedent,
      decides it.
  LL:
    distractor: A friend had a similar cracked laptop screen replaced for free under
      warranty without any difficulty.
    diagnosticity: low
    salience: low
    proposition: A friend's cracked-screen warranty claim on a similar laptop was
      approved without difficulty.
    matched_to: HL
  HH:
    distractor: The crack came purely from the drop onto the tile, and when I reread
      the warranty card it says in plain terms that it covers defects in materials
      and workmanship only, and that accidental physical damage is expressly not covered.
    diagnosticity: high
    salience: high
    proposition: The damage is a physical drop impact, and the manufacturer warranty
      covers only manufacturing defects, explicitly excluding accidental damage.
    salience_source: Pairing the concrete cause of the crack with the warranty's exact
      exclusion language makes the mismatch vivid and decisive.
  LH:
    distractor: The damage was caused by a drop, and the warranty covers only manufacturing
      defects, not accidental damage.
    diagnosticity: high
    salience: low
    proposition: The damage is a physical drop impact, and the manufacturer warranty
      covers only manufacturing defects, explicitly excluding accidental damage.
    matched_to: HH
distractor_direction:
  label: Claim-approval precedent
  description: Treating a friend's successful free-repair claim as evidence that this
    user's claim is likely to be approved.
plausible_alternative_directions:
- label: Paid out-of-pocket repair
  description: Whether paying for a third-party or manufacturer screen replacement
    is the realistic path given the cause of damage.
- label: Separate accidental coverage
  description: Whether any home-contents policy or card benefit might cover accidental
    damage where the manufacturer warranty does not.
