seed_id: T1-089
template: T1
domain: open_qa
complexity: low
xbase: My two-year-old laptop's screen cracked yesterday after it slid off the sofa
  arm onto a tiled floor. The display now has a spreading dark blotch and dead pixels,
  though the machine still boots and runs fine. I bought it with the standard manufacturer
  warranty that came in the box, and I never added any separate protection plan. I'm
  wondering whether I should file a warranty claim to get the screen replaced for
  free. {DS}
focal_diagnostic_feature: The damage is a physical drop impact, and the manufacturer
  warranty covers only manufacturing defects, explicitly excluding accidental damage.
low_diagnostic_proposition: A friend's cracked-screen warranty claim on a similar
  laptop was approved without difficulty.
oracle_action: ANSWER
oracle_focus: Do not expect a free repair under this warranty; drop-induced accidental
  damage is outside its scope, so price a paid screen replacement or check whether
  any separate accidental-damage coverage exists.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume approval from a friend's outcome. Ask what
  caused the damage and what the user's specific warranty actually covers before predicting
  a claim result.
