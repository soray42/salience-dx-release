seed_id: T1-090
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: After our latest frontend deploy, a chunk of users are still seeing the old
  stylesheet and the old bundled JavaScript, so the new layout looks broken for them.
  A hard refresh fixes it for any given user, but new visitors keep hitting the stale
  assets. The deploy itself succeeded and the origin server is serving the correct
  new files when I curl it directly. Our assets are fronted by a CDN. Our deploy pipeline
  has no purge step; we rely on versioned URL fingerprinting alone. {DS}
focal_diagnostic_feature: The CDN cache key is configured to ignore the query string,
  so the fingerprinted versioned asset URLs all collapse to one cached entry that
  never refreshes on deploy.
low_diagnostic_proposition: A peer team's stale-asset incident on their CDN was traced
  to a failed cache-purge API call during their deploy.
oracle_action: ANSWER
oracle_focus: Fix the CDN cache-key configuration so the asset version query string
  is part of the key; once each versioned URL caches independently, the new deploy's
  fingerprinted assets will be fetched fresh.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the failed-purge explanation from another
  team. Ask how the CDN builds its cache key and whether the versioned asset URLs
  are being treated as distinct objects.
