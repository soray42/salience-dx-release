xbase: A pipe under my kitchen sink leaked over the weekend and warped a section of
  the laminate flooring. A contractor quoted me €620 to pull up and relay the damaged
  area. I have a home contents and buildings policy and I'm trying to decide whether
  to file a claim or just pay for the repair myself. The leak is fully fixed now and
  there is no ongoing damage. I want to make the financially sensible choice here.
  {DS}
focal_diagnostic_feature: The policy's water-damage excess is €500 and this insurer
  steps the renewal premium up after any claim, so a €620 claim returns roughly €120
  once while adding recurring premium cost.
low_diagnostic_proposition: A neighbour's water-damage insurance claim was paid out
  promptly and covered their repair in full.
oracle_action: ANSWER
oracle_focus: Pay for the €620 repair yourself rather than claiming; after the €500
  excess the claim nets only about €120 once, while the post-claim premium step-up
  costs more than that over the following renewals.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not decide from a neighbour's smooth payout. Ask what
  the policy's excess is and how a claim affects the user's renewal premium before
  judging whether claiming is worthwhile.
