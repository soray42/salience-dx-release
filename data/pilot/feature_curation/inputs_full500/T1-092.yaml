seed_id: T1-092
template: T1
domain: technical_troubleshooting
complexity: high
xbase: Our CDN-served product API returns stale error responses to clients long after
  the origin recovered. The origin itself returns 200s with fresh data when hit directly.
  The issue appeared after a brief origin outage two weeks ago and has persisted at
  roughly 5% of edge nodes since. We have not changed the CDN ruleset or cache-key
  configuration recently. Our monitoring shows origin is healthy and fully recovered.
  {DS}
focal_diagnostic_feature: Affected edge nodes hold a 503 response with a non-zero
  Cache-Control max-age, written by the CDN's error-caching feature during the outage,
  and that cached error has not been purged from those nodes.
low_diagnostic_proposition: A stale CDN response at another company was caused by
  mismatched cache-key configuration across origin shards.
oracle_action: ASK
oracle_focus: 'Investigate CDN error-caching: check whether the error-page TTL or
  error-caching rules wrote a long-lived 503 to edge nodes during the outage and issue
  a targeted cache purge for the affected paths on those nodes; then disable or shorten
  error-caching TTLs to prevent recurrence.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the cache-key-mismatch diagnosis from another
  company's incident. Ask for CDN edge-node diagnostics, cached response headers on
  affected nodes, and whether any error-caching rules could have frozen a 503 during
  the outage.
