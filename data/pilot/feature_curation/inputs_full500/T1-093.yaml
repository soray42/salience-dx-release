seed_id: T1-093
template: T1
domain: open_qa
complexity: low
xbase: I'm buying a new dishwasher and at the till the salesperson is pushing a three-year
  extended warranty for €89 on top of the price. The appliance is a mid-range model
  from a mainstream brand. I tend to keep appliances a long time and I don't want
  a nasty surprise if it breaks. I'm trying to decide whether the extended warranty
  is worth paying for or whether I should skip it. {DS}
focal_diagnostic_feature: The dishwasher already comes with a two-year manufacturer
  warranty, and statutory consumer protection covers faults for years beyond that,
  so the paid plan's first two-plus years duplicate coverage the buyer already has
  for free.
low_diagnostic_proposition: A relative was glad they had bought an extended warranty
  when their appliance failed and the repair was covered.
oracle_action: ANSWER
oracle_focus: Skip the €89 plan; its early years duplicate the free two-year manufacturer
  warranty and statutory protection the buyer already has, so it adds little beyond
  that overlapping window.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not buy on a relative's lucky save. Ask what free
  manufacturer and statutory coverage already applies before judging whether the paid
  plan adds anything.
