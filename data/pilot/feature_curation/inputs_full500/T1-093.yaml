causal_audit:
  steelman: 'A retail finance adviser could argue the relative''s experience is informative:
    appliances genuinely fail,

    out-of-warranty repairs are expensive, and a real covered save demonstrates the
    plan paying off — so for a

    long-term keeper worried about surprises, €89 looks like rational risk transfer.
    The steelman holds only if the

    early years carry uncovered risk. But the buyer already has a free two-year manufacturer
    warranty and multi-year

    statutory protection covering the same faults, so the paid plan''s early years
    transfer risk the buyer has

    already transferred for nothing. The relative''s save cannot change what free
    coverage this purchase carries, so

    it has no mechanism to make the overlapping plan worthwhile.

    '
