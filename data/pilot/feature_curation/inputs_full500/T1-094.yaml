  HH:
    distractor: We never enabled an origin shield, so on a miss every edge location
      pulls from origin on its own; the origin logs show it rate-limiting and rejecting
      requests exactly during the evening peak when that fan-out spikes, and those
      rejections are the 404s and 502s users see.
    diagnosticity: high
    salience: high
    proposition: The CDN has no origin shield, so on a cache miss each of the many
      edge locations fetches independently from origin, and at peak that fan-out exceeds
      the origin's request rate limit, which returns transient errors the edges pass
