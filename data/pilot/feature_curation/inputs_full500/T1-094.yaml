causal_audit:
  steelman: 'A senior delivery engineer would defend the corrupted-object theory:
    bad cached bytes are a classic cause of

    flaky image delivery, they appear intermittent because only some edges hold the
    bad copy, and a colleague found

    exactly this. The steelman holds only if the failure is tied to specific cached
    objects. But corrupted cache

    entries fail repeatably on the same edge until eviction — they do not clear on
    an immediate retry of the same

    URL, and they do not concentrate at the traffic peak. These errors clear instantly
    on retry and scale with

    evening load, which fits miss-time origin rate-limiting from un-shielded fan-out,
    not stored corruption. Nothing

    in xbase independently elevates cached-object corruption for this load-shaped,
    retry-clearing pattern.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states origin has every image and returns them correctly
    on direct request, foreclosing the missing-object and broken-origin pathways;
    the un-shielded fan-out tripping the origin rate limit still lives only in HH/LH.
