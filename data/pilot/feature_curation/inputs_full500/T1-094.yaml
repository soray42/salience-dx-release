seed_id: T1-094
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: 'Some users intermittently get broken images on our site: a small fraction
  of image requests through the CDN come back as 404 or 502, then the same URL loads
  fine on retry seconds later. It is worse during our busy evening window. The origin
  storage has every image present and returns them correctly when I request them directly.
  The CDN edges otherwise serve our traffic normally and no images have been deleted
  or renamed. {DS}'
focal_diagnostic_feature: The CDN has no origin shield, so on a cache miss each of
  the many edge locations fetches independently from origin, and at peak that fan-out
  exceeds the origin's request rate limit, which returns transient errors the edges
  pass through.
low_diagnostic_proposition: A colleague's intermittent CDN image errors turned out
  to be corrupted objects cached at certain edge nodes.
oracle_action: ANSWER
oracle_focus: Enable an origin shield (a mid-tier consolidating cache) so edge misses
  funnel through one origin fetch instead of many; this stops the peak fan-out from
  tripping the origin's rate limit and returning transient errors.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the corrupted-edge-object explanation. Ask
  how cache misses fan out to origin and whether origin is rate-limiting the aggregate
  edge fetch volume at peak.
