causal_audit:
  steelman: 'A restoration-minded buyer could argue scale is the real killer of secondhand
    espresso machines: it hides

    inside boilers, blocks heat exchange, and a seller''s verbal descaling claim is
    unverifiable, so a peer machine

    that died of scale is a fair caution. But that argument is about scale''s general
    prevalence and about the

    friend''s unit, not this one. Nothing in xbase shows scale symptoms here, and
    the deciding defect is a visibly

    cracked, discontinued gasket that no descaling history changes; the scale anecdote
    supplies no reason to rank

    scale as this machine''s leading problem, and the gasket finding settles the decision
    on its own.

    '
