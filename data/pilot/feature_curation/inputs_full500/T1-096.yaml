template: T1
domain: technical_troubleshooting
complexity: high
xbase: My external SSD on my Linux workstation keeps disappearing mid-session. Files
  I am editing suddenly become inaccessible and the mount point empties, then it usually
  comes back if I replug it. It is formatted exFAT and holds my project archives.
  This has happened several times a day for the past week. I have already tried two
  known-good cables and a different port, and the drops continue. {DS}
focal_diagnostic_feature: The kernel logs exFAT I/O errors and a journal-replay failure
  before remounting the volume read-only, across multiple known-good cables and ports.
low_diagnostic_proposition: A colleague's external drive kept vanishing; he traced
  it to a worn USB-C cable and a cable swap fixed it.
oracle_action: ANSWER
oracle_focus: Treat this as filesystem or drive-level corruption, not a connection
  fault; back up immediately, then run fsck.exfat on the unmounted volume and check
  the drive's SMART health, since errors and read-only remounts persist across good
  cables and ports.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the worn-cable explanation; the user has
  already confirmed the drops continue across two known-good cables and a different
  port. Ask what the kernel log shows around each disconnect.
