causal_audit:
  steelman: 'A hardware engineer could note that worn USB-C cables are a leading cause
    of intermittent external-drive drops:

    a flexed or oxidised connector breaks the data link, the OS sees a surprise removal,
    and replugging restores it

    exactly as described. That mechanism is real in general and matches the surface
    symptom. However, xbase now

    explicitly states the user has already tried two known-good cables and a different
    port with drops continuing,

    which forecloses the cable/port mechanism entirely in xbase itself. Even without
    that closure, a cable fault

    does not write exFAT filesystem errors or trigger journal replay — those kernel
    events point to storage-layer

    corruption rather than link interruption. The focal evidence (HH/LH) structurally
    rules out the cable both

    by persistence across hardware substitution and by the nature of the logged errors.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the user has already tried two known-good
    cables and a different port with drops continuing, foreclosing the worn-cable
    mechanism before HH/LH supply the kernel-log evidence.
