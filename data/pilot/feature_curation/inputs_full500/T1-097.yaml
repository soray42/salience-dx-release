xbase: My office chair has gotten wobbly and tilts to one side when I lean back. I
  use it all day for work and would rather repair it than spend on a new one if the
  fix is cheap. It is about seven years old, a mid-range model I liked. A local repair
  shop can look at it next week, and a comparable new chair runs about €180. {DS}
focal_diagnostic_feature: The seat-plate weld is cracked through, and frame parts
  for this discontinued chair are no longer available.
low_diagnostic_proposition: A relative fixed a similar wobbly chair cheaply by replacing
  the worn gas cylinder.
oracle_action: ANSWER
oracle_focus: Replace rather than repair; the wobble is a cracked structural weld
  on a discontinued frame with no available parts, so it cannot be safely fixed with
  a bolt-on component, unlike a swappable gas cylinder.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a cheap cylinder swap from a relative's
  chair. Ask what is actually causing the wobble on this chair and whether the failed
  part can be sourced and replaced.
