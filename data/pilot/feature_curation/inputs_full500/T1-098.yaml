variants:
  HL:
    distractor: Makisig, a sysadmin I trust, said his laptop had the same dead-black
      wake failures and it turned out the battery had degraded so far that the machine
      was quietly dying in sleep instead of resuming; a battery replacement ended
      the whole problem for him.
    diagnosticity: low
    salience: high
    proposition: A colleague had identical wake-from-sleep failures that were caused
      by a degraded battery.
    salience_source: A — a trusted sysadmin recounting a matching symptom he personally
      root-caused on his own laptop.
    why_plausible: A worn battery dying during sleep really can produce a dead-black
      no-wake state, so a matching fix from a sysadmin feels like the right first
      suspect.
    why_irrelevant: His battery diagnosis explains his laptop; it cannot account for
      failures that occur only after docked sleep and coincide with a logged display-driver
      reset.
  LL:
    distractor: A colleague had identical wake-from-sleep failures that turned out
      to be caused by a degraded battery.
    diagnosticity: low
    salience: low
    proposition: A colleague had identical wake-from-sleep failures that were caused
      by a degraded battery.
    matched_to: HL
  HH:
    distractor: It only fails to wake when I had it docked to my external monitor
      before sleeping, and the Event Viewer shows the display driver stopped responding
      and was reset at the exact resume timestamp each time it happens.
    diagnosticity: high
    salience: high
    proposition: The failures occur only after docked sleep, and Event Viewer logs
      a display-driver reset at each resume.
    salience_source: Concrete correlation (docked-only) plus the precise Event Viewer
      driver-reset entry at each resume pins it to graphics, not power.
  LH:
    distractor: The failures occur only after docked sleep, and Event Viewer logs
      a display-driver reset at each resume.
    diagnosticity: high
    salience: low
    proposition: The failures occur only after docked sleep, and Event Viewer logs
      a display-driver reset at each resume.
    matched_to: HH
distractor_direction:
  label: Degraded battery
  description: Investigating whether a worn battery is causing the laptop to die during
    sleep, as it did for a colleague.
plausible_alternative_directions:
- label: Sleep-state firmware bug
  description: Whether a buggy modern-standby or BIOS sleep implementation is leaving
    the machine in a stuck low-power state.
- label: Peripheral wake conflict
  description: Whether a USB or dock device is interfering with the resume sequence
    independent of the GPU.
