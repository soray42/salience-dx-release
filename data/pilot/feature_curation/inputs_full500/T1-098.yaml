  notes: 'LL carries only the colleague-wake-failure-from-degraded-battery claim;
    the named sysadmin and his replacement

    fix are HL-only and about his laptop. xbase reports symptoms only (black screen,
    dead backlight, forced reboot,

    intermittent, no user power-setting changes) and withholds the docked-only correlation
