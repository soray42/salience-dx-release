seed_id: T1-098
template: T1
domain: technical_troubleshooting
complexity: medium
xbase: 'My laptop sometimes fails to wake from sleep: the screen stays black, the
  keyboard backlight does not come on, and I have to hold the power button to force
  a reboot. It runs Windows and is about three years old. It does not happen every
  time, and once it reboots everything works normally for hours. I have not changed
  any power settings myself. {DS}'
focal_diagnostic_feature: The failures occur only after docked sleep, and Event Viewer
  logs a display-driver reset at each resume.
low_diagnostic_proposition: A colleague had identical wake-from-sleep failures that
  were caused by a degraded battery.
oracle_action: ANSWER
oracle_focus: Treat this as a graphics-driver resume bug tied to the external-monitor
  dock, not a battery problem; update or roll back the display driver and test docked
  versus undocked sleep, since the failures correlate with docked sleep and a logged
  driver reset.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the degraded-battery explanation from someone
  else's laptop. Ask whether the failures correlate with any specific condition and
  what the system logs show at the moment of the failed resume.
