    in HH/LH.

    '
causal_audit:
  steelman: 'A field tech could argue a degraded battery is a fair lead: cells that
    collapse under the small sleep draw can

    leave a machine unable to resume, presenting exactly as a dead-black no-wake needing
    a hard reboot, and the

    colleague''s matching fix supports trying it. That is an argument about worn batteries
    generally and about the

    colleague''s laptop. It gives no case-specific reason here, where the failures
    appear only after docked sleep and

    Event Viewer records a display-driver stop-and-reset at each failed resume. A
    failing battery does not

    selectively strike docked sleep nor write a graphics-driver reset, so the focal
    evidence rules it out.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — xbase withholds the docked-only correlation and the
    Event Viewer entry, so the battery theory is only foreclosed by HH/LH.
