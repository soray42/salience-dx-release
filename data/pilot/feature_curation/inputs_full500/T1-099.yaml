xbase: I am picking my first telescope and have narrowed it to two. One is a €280
  refractor on a tabletop mount; the other is a €260 Dobsonian reflector. I mainly
  want to look at large faint things like nebulae and galaxy clusters from my dark
  rural garden. Both are in stock and within budget, and I want to choose this week.
  {DS}
