variants:
  HL:
    distractor: Liwayway, who runs storage for a small studio, told me she hit the
      identical "no space left" failures on her backup array and found the volume
      had genuinely filled to the brim.
    diagnosticity: low
    salience: high
    proposition: A colleague got the same "no space left" backup errors because her
      storage volume had genuinely filled up.
    salience_source: A — a named storage operator recounting an identical error message
      she root-caused on her own array.
    why_plausible: A genuinely full volume is the textbook cause of that exact error,
      so a matching case from someone who runs storage makes adding capacity feel
      obvious.
    why_irrelevant: Her array really was out of bytes; this one has 41% free, so capacity
      is not the constraint here and larger drives would not raise the exhausted inode
      limit.
  LL:
    distractor: A colleague got the same "no space left" backup errors because her
