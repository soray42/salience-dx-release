seed_id: T1-100
template: T1
domain: technical_troubleshooting
complexity: high
xbase: My nightly backup job to my home NAS has failed for the past four nights with
  a "No space left on device" error. The confusing part is that the storage is clearly
  not full. The NAS runs Linux with an ext4 volume, and the backup is mostly many
  small generated thumbnail and cache files from a photo workflow. Nothing about the
  backup script has changed recently. {DS}
focal_diagnostic_feature: Byte usage is 41% but df -i shows inodes fully exhausted
  by the many tiny files, despite free space.
low_diagnostic_proposition: A colleague got the same "no space left" backup errors
  because her storage volume had genuinely filled up.
oracle_action: ANSWER
oracle_focus: Treat this as inode exhaustion, not byte capacity; free or consolidate
  the millions of tiny files, exclude regenerable cache from the backup, or recreate
  the filesystem with more inodes, since df shows ample bytes free while df -i shows
  inodes at 100%.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the disk-is-full explanation from someone
  else's array. Ask for both df and df -i output to confirm whether bytes or inodes
  are actually exhausted before adding storage.
