    matched_to: HL
  HH:
    distractor: Running df shows the volume is 41% full by bytes, but df -i shows
      inode usage at 100%, since the millions of tiny thumbnail files have exhausted
      the filesystem inode table even though plenty of byte capacity remains.
    diagnosticity: high
    salience: high
    proposition: Byte usage is 41% but df -i shows inodes fully exhausted by the many
      tiny files, despite free space.
    salience_source: Concrete split between df (41% bytes) and df -i (100% inodes)
      makes the true constraint vivid and unambiguous.
  LH:
    distractor: Byte usage is 41% but df -i shows inodes fully exhausted by the many
