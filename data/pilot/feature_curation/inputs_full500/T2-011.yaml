distractor_direction:
  label: office space reorganization
  description: 'The physical rearrangement of office desks is proposed as the cause
    of the webhook delivery failures, based on temporal coincidence. The cloud-hosted
    endpoint is architecturally isolated from office-local infrastructure, giving
    this direction no causal pathway.

    '
plausible_alternative_directions:
- label: cloud platform partial outage
  description: 'A subtle or regional cloud platform incident not reflected on the
    status page could be causing intermittent 5xx responses, which the SaaS provider
    would record as delivery failures.

    '
- label: SaaS provider rate limiting
  description: 'The SaaS provider may have started throttling deliveries to this endpoint
    due to increased event volume or a policy change, causing intermittent failures
    from the provider side.

    '
- label: TLS certificate expiry
  description: 'The cloud endpoint''s TLS certificate may have expired or entered
    a renewal window, causing some delivery attempts to fail with handshake errors.

    '
