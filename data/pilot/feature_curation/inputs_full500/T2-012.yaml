xbase: 'My e-reader went from lasting three weeks on a charge to dying in two days,
  and I haven''t changed how I use it — same reading habits, same screen brightness.
  I bought a new bedside lamp around the same time, but the e-reader never connects
  to it or plugs into it in any way. I haven''t installed any new apps or changed
  any settings that I can recall. {DS}

  '
focal_diagnostic_feature: 'Wi-Fi is enabled and set to sync automatically in the background,
  and it was confirmed off before the battery drain began.

  '
low_diagnostic_proposition: 'The new bedside lamp is causing the e-reader battery
  to drain faster.

  '
