xbase: 'My sourdough starter has been unreliable for the past three weeks — it barely
  doubles and the dome collapses before I catch it. I have not changed brands: same
  flour, same tap water, same jar. I also checked my feeding schedule and it has not
  shifted. {DS}

  '
focal_diagnostic_feature: 'The kitchen temperature has dropped approximately five
  degrees Celsius compared to summer, which directly slows fermentation activity and
  would account for the starter''s reduced rise and early collapse.

  '
low_diagnostic_proposition: 'The sourdough starter''s reliability problems began after
  the baker switched to a different grocery loyalty programme.

  '
oracle_action: ANSWER
oracle_focus: 'Investigate the temperature drop as the primary cause of reduced fermentation
  activity; advise warming the proofing environment (e.g. oven with light on, consistent
  warm spot) and explain how a 5°C fall can significantly slow yeast and bacterial
  activity in a starter.

  '
low_diagnostic_oracle_action: ANSWER
low_diagnostic_oracle_focus: 'Acknowledge the timing coincidence but note that a grocery
  loyalty programme change has no pathway to affect starter microbiology, especially
  given the confirmed same flour brand and water; ask about environmental conditions,
