distractor_direction:
  label: loyalty programme switch
  description: 'The hypothesis that changing to a different grocery loyalty programme
    caused the starter to stop rising reliably, based solely on temporal coincidence
    without any plausible mechanism.

    '
plausible_alternative_directions:
- label: flour batch variation
  description: 'Even within the same brand, a new production batch may have different
    protein content, ash level, or lower wild-yeast contamination, which could affect
    starter vigour.

    '
- label: water treatment change
  description: 'Municipal chlorine or chloramine levels can fluctuate seasonally or
    after infrastructure changes, and elevated disinfectants suppress starter microbiota
    even with the same tap source.

    '
- label: contamination or culture dilution
  description: 'Introduction of competing organisms via an unwashed utensil, or over-dilution
    of the culture through off-ratio feedings, could shift the microbial balance enough
    to reduce leavening reliability.

    '
