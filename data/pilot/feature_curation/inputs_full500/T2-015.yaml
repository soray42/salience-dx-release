causal_audit:
  steelman: 'Best-faith argument for the organiser''s e-reader switch causing attendance
    to

    drop: a book club''s identity is partly formed around shared reading culture.

    If the organiser — who sets the group''s tone — visibly abandons physical books,

    members who treat the paper-book ritual as central to the experience may

    interpret this as a signal that the group is changing character. Under social

    identity theory, even one anchor member''s shift can trigger a slow exit among

    the most tradition-oriented participants. Some members might also worry that

    future book selections will skew toward e-book-only titles or that the

    discussion dynamic will change. A community-management consultant reviewing

    a membership drop might plausibly include "check whether a visible cultural

    signal from leadership alienated a cohort" on a diagnostic checklist.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'N/A — the e-reader pathway is foreclosed by the focal
    feature (venue inaccessibility) being a direct structural barrier, not by an explicit
    statement in xbase. The organiser''s device choice has no effect on the physical
    accessibility of the meeting location; the mechanism offered by the steelman (cultural
    identity drift) is speculative and operates over months, not a single meeting
    cycle, and would not produce a halving in the same month as the venue change.
    A senior practitioner would not put a private device preference on a root-cause
    checklist for an abrupt attendance drop when a concurrent venue move is present.

    '
