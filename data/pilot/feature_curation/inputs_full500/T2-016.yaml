seed_id: T2-016
template: T2
domain: open_qa
complexity: high
xbase: 'I''m a freelancer and my invoices to my main client used to be paid within
  about 15 days. For the past two months they''ve been arriving around day 45. The
  timing lines up with when I refreshed my invoice template — I updated the fonts,
  color scheme, and logo, but the payment terms line still says net-15 and all the
  same fields are in the same positions. {DS}

  '
focal_diagnostic_feature: 'The template redesign is confirmed purely cosmetic (no
  field or content changes) and the client restructured their accounts-payable approval
  chain around the time the delays began, making the AP chain restructuring the decisive
  causal factor; the visual redesign is structurally irrelevant.

  '
low_diagnostic_proposition: 'Clients can slow down payments when an invoice design
  looks unfamiliar.

  '
oracle_action: ASK
oracle_focus: 'Ask the client what changed on their side around two months ago — new
  payment approver, changed approval cycle, cash flow constraints, or invoice routing
  change — since the template change was purely cosmetic and the AP approval chain
  restructuring is the decisive client-side factor.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Do not adopt the visual-redesign story; the template
  change was cosmetic with no field or content changes, so the design cannot be the
  cause. Ask the client what changed on their end around the time delays began.

  '
