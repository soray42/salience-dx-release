causal_audit:
  steelman: 'One could strain to argue the new rug or relocated furniture changed
    where the phone usually sits, or how the

    home Wi-Fi propagates, indirectly affecting connectivity — but live video and
    recordings still work over the

    same Wi-Fi, so connectivity is intact, and furniture cannot touch the OS background-execution
    policy that gates

    notifications. No defensible mechanism survives.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states live video and clip recording still work,
