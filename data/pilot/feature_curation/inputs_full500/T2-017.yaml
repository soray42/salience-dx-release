seed_id: T2-017
template: T2
domain: technical_troubleshooting
complexity: low
xbase: My video doorbell stopped sending notifications to my phone about a week ago.
  The doorbell still records clips and I can see live video when I open the app myself,
  so the camera and Wi-Fi are clearly fine. I just never get the alert when someone
  actually presses the button or walks up. The app is signed in and shows no warnings.
  {DS}
focal_diagnostic_feature: Notifications arrive when the app is open in the foreground
  but never when it is backgrounded, and the phone's battery settings list the app
  as "restricted".
low_diagnostic_proposition: The notification problem began right after the living-room
  furniture was rearranged.
oracle_action: ANSWER
oracle_focus: Remove the doorbell app from battery restriction / allow background
  activity and notifications at the OS level; the alerts fail only when the app is
  backgrounded because the phone is killing its background process.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect rearranging furniture to phone notifications.
  Ask whether alerts arrive with the app backgrounded and what the phone's battery/background
  settings say for that app.
