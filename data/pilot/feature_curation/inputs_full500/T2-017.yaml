variants:
  HL:
    distractor: The alerts went quiet around the same time we rearranged the whole
      living room — pushed the sofa to the far wall, moved the TV stand, and rolled
      out a big new rug.
    diagnosticity: low
    salience: high
    proposition: The notification problem began right after the living-room furniture
      was rearranged.
    salience_source: B/C — a clean, confident first-person timeline pinning the symptom
      to a specific, memorable household event.
    why_plausible: People reflexively blame the most recent visible change in the
      home, and the timing genuinely coincides.
    why_irrelevant: Moving furniture cannot affect how the phone's OS schedules a
      background app; the symptom is a software/notification-permission issue with
      no physical pathway to furniture.
  LL:
    distractor: The notification problem began around the time the living-room furniture
      was rearranged.
    diagnosticity: low
    salience: low
    proposition: The notification problem began right after the living-room furniture
      was rearranged.
    matched_to: HL
  HH:
    distractor: 'I tested it deliberately: with the app open on screen, every button
      press pings my phone instantly; the moment I background it or lock the screen,
      no alert ever comes. In battery settings the doorbell app is flagged "restricted",
      so the phone keeps suspending it.'
    diagnosticity: high
    salience: high
    proposition: Notifications arrive when the app is open in the foreground but never
      when it is backgrounded, and the phone's battery settings list the app as "restricted".
    salience_source: A deliberate foreground-vs-background test plus the literal 'restricted'
      flag makes the OS-suspension mechanism vivid.
  LH:
    distractor: Alerts arrive only while the app is foregrounded, never when backgrounded;
      the phone's battery settings mark the app "restricted".
    diagnosticity: high
    salience: low
    proposition: Notifications arrive when the app is open in the foreground but never
      when it is backgrounded, and the phone's battery settings list the app as "restricted".
    matched_to: HH
distractor_direction:
  label: Furniture-rearrangement timing
  description: Treating the recent living-room rearrangement as connected to when
    the notifications stopped.
plausible_alternative_directions:
- label: Push-service/account issue
  description: Whether the push notification token or account registration with the
    doorbell service has broken.
- label: Do-Not-Disturb or mute
  description: Whether a phone-level Do Not Disturb schedule or per-app mute is suppressing
    the alerts.
