xbase: Our household electricity bill has roughly doubled over the last two months
  and I'm trying to decide whether to switch energy providers in protest. The tariff
  on the bill is the same rate per kilowatt-hour we have always paid, and there has
  been no notice of a price increase from the supplier. It just feels like we are
  suddenly paying far too much. {DS}
focal_diagnostic_feature: The itemised bill shows total kilowatt-hours consumed has
  nearly doubled, and a chest freezer was moved into the unheated garage two months
  ago where it now runs almost continuously.
low_diagnostic_proposition: The bill increase started the same month the kitchen and
  dining room were repainted.
oracle_action: ANSWER
oracle_focus: Do not switch provider over price; the rate is unchanged and consumption
  nearly doubled, so address the new always-on load (the garage chest freezer) rather
  than the tariff.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not tie repainting to the electricity bill. Ask whether
  metered consumption rose or the rate changed, and what new or relocated appliances
  are now running.
