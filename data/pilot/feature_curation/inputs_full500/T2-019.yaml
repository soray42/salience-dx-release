    matched_to: HL
  HH:
    distractor: On an affected laptop the console shows the chart bundle request blocked
      by a content filter, never reaching the network. It is served from a path containing
      "analytics", which common ad-block lists match, so blocker users lose exactly
      that one script while the data API still loads.
    diagnosticity: high
    salience: high
    proposition: For affected users the browser console shows the charting bundle
      request blocked by a client-side filter, and the bundle is served from a path
      containing the word "analytics" that ad-block lists match.
    salience_source: The console block and the literal 'analytics' path make the client-filter
      mechanism concrete and reproducible.
  LH:
    distractor: Affected browsers show the chart bundle request blocked by a client-side
