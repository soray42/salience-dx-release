seed_id: T2-019
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Charts on our internal analytics dashboard render blank for some of the team
  while others see them perfectly. The page itself loads, the data API returns 200
  with valid JSON, and there are no server errors. The people who see blanks swear
  they did nothing different, and a hard refresh does not help them. We did not change
  the charting library this quarter. {DS}
focal_diagnostic_feature: For affected users the browser console shows the charting
  bundle request blocked by a client-side filter, and the bundle is served from a
  path containing the word "analytics" that ad-block lists match.
low_diagnostic_proposition: The blank charts started appearing right after the team
  was moved to a new floor with new monitors.
oracle_action: ANSWER
oracle_focus: Rename or reverse-proxy the charting bundle off the "analytics"-matching
  path (or whitelist it); ad-block/content filters are blocking that script for the
  affected browsers, which is why the API succeeds but charts stay blank.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a floor move or new monitors to blank
  charts. Ask what the affected users' browser console shows and whether any script
  request is blocked.
