xbase: I'm close to selling my rental flat because the bank statement shows it bleeding
  cash every month now, where it used to roughly break even. Rent is unchanged, the
  tenant is reliable, and there have been no big repairs. The property itself is in
  a steady neighbourhood I have no other complaints about. Watching money leave the
  account each month is wearing me down. {DS}
