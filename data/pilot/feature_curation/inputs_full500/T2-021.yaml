  description: Treating the recent disinfectant cleaning as having damaged the keyboard
    hardware and scrambled the keys.
plausible_alternative_directions:
- label: Stuck modifier key
  description: Whether a held-down modifier (like a function or shift lock) is altering
    the characters produced.
- label: Keyboard firmware/driver fault
  description: Whether a keyboard driver or firmware issue is remapping inputs at
    a low level.
