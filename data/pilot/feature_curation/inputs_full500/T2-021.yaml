seed_id: T2-021
template: T2
domain: technical_troubleshooting
complexity: low
xbase: Some keys on my laptop have started typing the wrong characters. When I press
  the double-quote key I get an at-sign, the at-sign key gives me a double-quote,
  and the pound and hash symbols are swapped too. Letters and numbers are fine. It
  is the same in every application, and the physical keyboard looks undamaged. {DS}
focal_diagnostic_feature: The swapped characters are exactly the differences between
  the UK and US keyboard layouts, and the OS input-language indicator now shows US
  English instead of the UK layout it used to.
low_diagnostic_proposition: The wrong characters started appearing right after the
  keyboard was cleaned with a disinfectant wipe.
oracle_action: ANSWER
oracle_focus: Switch the OS keyboard layout back to UK English; the specific quote/at
  and hash/pound swaps are the signature of a US-vs-UK layout mismatch, not a hardware
  fault.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect wiping the keyboard to character mapping.
  Ask which exact characters are swapped and what the OS keyboard-layout setting is
  now set to.
