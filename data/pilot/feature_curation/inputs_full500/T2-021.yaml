causal_audit:
  steelman: 'A repair tech might note that physical contact while cleaning could in
    principle dislodge or stick a key, producing

    wrong or stuck characters, and the timing is suggestive — so a cleaning-related
    hardware fault is worth a glance. But

    such faults are erratic and physical, not a clean, app-wide, reciprocal swap of
    exactly the symbols that distinguish

    two standard layouts; that pattern only comes from a layout setting.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase notes letters and numbers work, the behaviour is
    identical in every application, and the keyboard looks undamaged — narrowing toward
    software, though the decisive US/UK identification stays in HH/LH.
