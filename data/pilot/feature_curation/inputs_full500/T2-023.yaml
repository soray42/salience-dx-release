variants:
  HL:
    distractor: This started the exact afternoon someone installed a new espresso
      machine in our break room; I remember because the team gathered around it right
      before the 504 errors first showed up in our dashboards.
    diagnosticity: low
    salience: high
    proposition: The 504 errors began around the time a new appliance was installed
      in the office break room.
    salience_source: B/C — clean first-person chronology with a memorable anchor event
      and confident precise timing ('the exact afternoon').
    why_plausible: A busy on-call engineer logging a new failure pattern naturally
      notes the most salient recent change; temporal proximity feels like signal.
    why_irrelevant: An office espresso machine has no electrical, network, or software
      pathway to upstream API response times; the upstream slowdown is a server-side
      latency regression entirely independent of break-room hardware.
  LL:
    distractor: The 504 errors began around the time a new appliance was installed
      in the office break room.
    diagnosticity: low
    salience: low
    proposition: The 504 errors began around the time a new appliance was installed
      in the office break room.
    matched_to: HL
  HH:
    distractor: A direct curl to the upstream service, bypassing the load balancer,
      consistently takes 97 seconds to return; the load balancer upstream_read_timeout
      is set to 60 seconds, so the proxy abandons the connection and returns 504 before
      the response ever arrives.
    diagnosticity: high
    salience: high
    proposition: A direct request to the upstream service bypassing the load balancer
      takes 97 seconds; the load balancer upstream_read_timeout is configured to 60
      seconds, so the proxy gives up and returns 504 before the response arrives.
    salience_source: B — concrete measured value (97 s) cross-referenced against a
      specific config parameter (60 s timeout), making the causal chain immediately
      legible.
  LH:
    distractor: Direct upstream requests take 97 seconds, exceeding the load balancer's
      60-second timeout, so it returns 504 before the response arrives.
    diagnosticity: high
    salience: low
    proposition: A direct request to the upstream service bypassing the load balancer
      takes 97 seconds; the load balancer upstream_read_timeout is configured to 60
      seconds, so the proxy gives up and returns 504 before the response arrives.
    matched_to: HH
distractor_direction:
  label: break-room appliance coincidence
  description: Treating the installation of a new office appliance as a potential
    cause of or clue to the API 504 errors based solely on temporal proximity.
plausible_alternative_directions:
- label: upstream service degradation
  description: The upstream profile-lookup service has independently degraded due
    to database contention, a slow query plan, or a dependency bottleneck unrelated
    to the proxy timeout.
- label: load balancer misconfiguration
  description: A recent change to load balancer settings — timeout values, health-check
    thresholds, or routing rules — is causing premature upstream abandonment.
- label: downstream dependency lock
  description: The endpoint acquired a dependency on a slow or locked external service
    such as a read-replica or a third-party call that recently regressed.
