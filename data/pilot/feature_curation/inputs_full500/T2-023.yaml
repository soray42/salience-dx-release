seed_id: T2-023
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Our REST API started returning 504 Gateway Timeout errors on one specific endpoint
  two days ago. The endpoint handles user profile lookups and every other route responds
  normally within milliseconds. We have not deployed any application code changes
  this week, and traffic patterns look identical to last week. {DS}
focal_diagnostic_feature: A direct request to the upstream service bypassing the load
  balancer takes 97 seconds; the load balancer upstream_read_timeout is configured
  to 60 seconds, so the proxy gives up and returns 504 before the response arrives.
low_diagnostic_proposition: The 504 errors began around the time a new appliance was
  installed in the office break room.
oracle_action: ASK
oracle_focus: Investigate why the user-profile-lookup upstream takes over 90 seconds;
  check for a query plan regression, missing index, or lock contention on that endpoint's
  database path, then tune or raise the upstream timeout appropriately.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a break-room appliance installation to
  cloud API latency. Ask for direct upstream response times and load balancer timeout
  configuration.
