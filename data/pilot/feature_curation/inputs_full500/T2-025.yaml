seed_id: T2-025
template: T2
domain: technical_troubleshooting
complexity: low
xbase: Our single-page web app suddenly cannot call its own REST API from the browser
  since this morning; the requests fail and the console shows a CORS error. The API
  itself is up, and calling the same endpoints directly with a command-line HTTP client
  returns 200 with the expected data. We did push a small frontend change earlier,
  but nothing about the API server or its CORS setup was touched. {DS}
focal_diagnostic_feature: The frontend change added a new custom request header, and
  the API's CORS configuration does not list that header in Access-Control-Allow-Headers,
  so the browser's preflight fails and blocks the actual request.
low_diagnostic_proposition: The CORS failures started the same morning the office
  replaced the lobby coffee machine.
oracle_action: ANSWER
oracle_focus: Add the new custom request header to the API's Access-Control-Allow-Headers
  list; the browser preflight is failing because the header the frontend now sends
  is not allowed, which is why direct non-browser calls still succeed.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the lobby coffee-machine change to the
  CORS error. Ask what the frontend change altered about the request, especially new
  headers, and what the preflight response permits.
