xbase: I am trying to figure out why my monthly spending crept up and landed on my
  music streaming subscription. The charge is bigger than I remember agreeing to,
  and it has been at this higher amount for the last three billing cycles. I have
  not knowingly changed my plan, and I use the service most days, so I am not looking
  to cancel, just to understand the increase. {DS}
focal_diagnostic_feature: The account page shows the plan silently switched from an
  individual tier to a family tier with extra member slots the user never set up,
  which is why the charge rose.
low_diagnostic_proposition: The user first noticed the higher charge the same month
  they repainted their living room.
oracle_action: ANSWER
oracle_focus: Switch the plan back from the family tier to the individual tier; the
  account shows it changed to a multi-member family plan the user never set up, which
  is why the monthly charge rose.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not tie the increase to the room repainting. Ask what
  the account's plan and billing page shows about the current tier versus the tier
  the user expected.
