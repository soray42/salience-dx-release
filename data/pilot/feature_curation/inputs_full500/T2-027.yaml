    matched_to: HL
  HH:
    distractor: The cursor pages by created_at alone, which is not unique; when several
      rows share the same created_at across a page boundary and new writes arrive,
      the database is free to order those ties differently between requests, so rows
      drift across pages, producing the duplicates and skips.
    diagnosticity: high
    salience: high
    proposition: The cursor pages by created_at alone, which is not unique; when several
      rows share the same created_at across a page boundary, ordering is unstable
      between requests, so rows shift pages, causing the duplicates and skips.
    salience_source: The non-unique created_at cursor and the unstable tie-ordering
      under concurrent writes name the exact paging mechanism.
  LH:
    distractor: The cursor sorts on non-unique created_at, so rows sharing a created_at
      across a page boundary reorder between requests under writes, causing duplicates
      and skips.
    diagnosticity: high
