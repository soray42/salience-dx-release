seed_id: T2-027
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Clients paging through our REST API's list endpoint started seeing the same
  records appear on more than one page about a week ago. The total count looks right,
  but a handful of items are duplicated across page boundaries while a few others
  are skipped. The query and the pagination code have not changed, and the problem
  only shows up under normal production write activity, never on our static test dataset.
  {DS}
focal_diagnostic_feature: The cursor pages by created_at alone, which is not unique;
  when several rows share the same created_at across a page boundary, ordering is
  unstable between requests, so rows shift pages, causing the duplicates and skips.
low_diagnostic_proposition: The duplicate-paging reports started the same week the
  team migrated its dashboards to a new monitoring vendor.
oracle_action: ANSWER
oracle_focus: Make the pagination cursor sort on a unique tiebreaker (created_at plus
  the primary key); rows sharing a created_at currently order unstably across page
  boundaries under concurrent writes, which causes the duplicates and skips.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the monitoring-vendor migration to the
  paging duplicates. Ask what column the cursor sorts on and whether that column is
  unique across rows.
