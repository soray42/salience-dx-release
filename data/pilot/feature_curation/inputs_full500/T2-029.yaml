xbase: A mobile game I play has started crashing back to the home screen the moment
  I tap to launch it. It opens for a second, shows the loading logo, and then dies
  before the menu appears. It happens every single time now, on the same phone I have
  used for two years. Other apps still open normally, and I have plenty of free storage.
  {DS}
focal_diagnostic_feature: The crash began with the game's most recent update, whose
  patch notes mention higher-resolution textures, and the crash log shows an out-of-memory
  termination during asset loading on this older device.
low_diagnostic_proposition: The crashing started right after the user rearranged their
  home-screen icons and changed the wallpaper.
oracle_action: ANSWER
oracle_focus: Treat this as the updated game exceeding the older device's memory during
  asset loading; have the user roll back or reinstall the prior version, lower in-game
  graphics, or check whether the device meets the new build's requirements.
