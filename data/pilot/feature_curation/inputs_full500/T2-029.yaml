causal_audit:
  steelman: 'One could try to argue the cosmetic change matters: a custom high-resolution
    wallpaper consumes some memory, and

    a launcher redraw could momentarily compete for resources, so on a constrained
    device it might nudge an app over

    an edge. But this fails as a mechanism for this case. A static wallpaper is decoded
    once by the launcher and does

    not run while the game loads, and moving an icon into a folder changes nothing
    about runtime memory at all; the

    game''s own asset loading allocates its memory independently. The crash is an
    out-of-memory during the game''s

    enlarged asset load after an update, which the wallpaper and icon arrangement
    cannot influence.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states other apps open normally and storage is plentiful,
    foreclosing the storage-full and general-device-failure pathways without revealing
    the update timing or crash-log cause, which remain only in HH/LH.
