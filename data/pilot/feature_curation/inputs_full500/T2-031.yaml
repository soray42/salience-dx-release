domain: technical_troubleshooting
complexity: medium
xbase: Photos I take with my phone's main camera have started showing an ugly purple-pink
  flare whenever there is a bright light source in the frame, like the sun or a streetlamp.
  In ordinary even light the pictures look fine. It happens on every shot with a bright
  source now, not just occasionally. The phone is otherwise working normally and I
  have not installed a new camera app. {DS}
focal_diagnostic_feature: With any phone case removed, the flare still reproduces,
  and inspecting the main lens under angled light reveals a hairline scratch across
  the cover glass that produces the internal reflection.
low_diagnostic_proposition: The flare started right after the user changed their lock-screen
  wallpaper to a bright photo.
oracle_action: ANSWER
oracle_focus: Treat this as a physical defect on the main lens cover glass causing
  internal reflection under bright light; have the user inspect and clean the lens,
  then seek lens-glass repair or replacement since a scratch will not resolve in software.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the lock-screen wallpaper change to the
  camera flare. Ask whether the flare persists with any case removed and what a close
  inspection of the lens glass shows before treating the wallpaper as relevant.
