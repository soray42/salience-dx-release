causal_audit:
  steelman: 'Someone might try to argue the wallpaper matters: a very bright lock-screen
    could, in principle, be reflected by

    surrounding surfaces or affect display calibration that the user then perceives
    in their gallery. But this has no

    real mechanism for the symptom. The flare appears in the photographic image the
    camera sensor records through the

    lens, an optical path entirely separate from what the display renders; a lock-screen
    image is never in the

    camera''s field of view during a shot. The reproducible case-off flare and the
    physical scratch on the lens glass

    locate the cause in the optics, where the wallpaper cannot reach.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase notes the user installed no new camera app, foreclosing
    the obvious new-software pathway without revealing the case-off reproduction or
    the lens scratch, which remain only in HH/LH.
