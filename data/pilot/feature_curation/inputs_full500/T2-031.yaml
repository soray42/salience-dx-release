variants:
  HL:
    distractor: The strange part is the timing. The flare appeared right after I finally
      changed my lock-screen wallpaper to a bright sunrise photo a friend sent me;
      before that I had used the same dark default image since I bought the phone.
    diagnosticity: low
    salience: high
    proposition: The flare started right after the user changed their lock-screen
      wallpaper to a bright photo.
    salience_source: B/C — a clean, confident first-person chronology pinning the
      flare to the wallpaper swap gives the coincidence narrative weight.
    why_plausible: Users often blame the most recent visible change they made, and
      switching to a noticeably bright wallpaper is a salient one to latch onto.
    why_irrelevant: The lock-screen wallpaper is what the display shows; it has no
      optical path to the camera lens and cannot create a flare in photos the camera
      captures.
  LL:
    distractor: The flare started right after the user changed their lock-screen wallpaper
