seed_id: T2-032
template: T2
domain: open_qa
complexity: high
xbase: A recruiter reached out about joining an early-stage startup as one of its
  first employees, and the pitch is exciting. The founders are likeable and the product
  vision genuinely appeals to me. I currently have a stable, well-paid job, so leaving
  would be a real gamble, but the idea of getting in early keeps pulling at me. I
  have a week to tell them whether I want to move forward. {DS}
focal_diagnostic_feature: The startup has roughly five months of runway, no signed
  revenue and no institutional investors, the offer pays thirty percent below the
  user's current salary, and the equity is 0.3% with a one-year cliff while the user
  has a mortgage on a single income.
low_diagnostic_proposition: The recruiter's message arrived the same week a startup-success
  story was trending across the user's social feeds.
oracle_action: ANSWER
oracle_focus: Lean against joining on these terms; five months of runway with no revenue
  or institutional backing, a thirty percent pay cut, thin cliffed equity, and a mortgage
  on one income make the downside severe relative to the upside.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let a trending success story set the answer. Ask
  for the startup's runway, revenue, funding, the pay change, and the equity terms
  relative to the user's financial obligations before judging the move.
