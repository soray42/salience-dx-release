seed_id: T2-033
template: T2
domain: technical_troubleshooting
complexity: low
xbase: My banking app stopped sending notifications about a week ago. No alerts for
  transactions, balance changes, or login activity arrive. Every other app on my phone
  still notifies me normally, and I have not changed any system notification settings
  that I am aware of. {DS}
focal_diagnostic_feature: The banking app's notification channel is toggled off in
  Android's per-app notification settings, while all other apps' channels remain enabled.
low_diagnostic_proposition: The notification silence began the same day the user changed
  the device's default notification ringtone in system settings.
oracle_action: ASK
oracle_focus: Check the per-app notification settings for the banking app in Android
  settings; the notification channel for the app appears disabled and needs to be
  re-enabled independently of any system sound change.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not attribute the missing notifications to a ringtone
  change; per-app channel toggles are independent of system sound settings. Ask the
  user to inspect the banking app's notification channels in Android settings before
  assuming any other cause.
