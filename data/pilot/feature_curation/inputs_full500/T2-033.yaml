variants:
  HL:
    distractor: This started the exact morning after I changed my default notification
      ringtone in system settings — I had switched from the stock chime to a downloaded
      tone and matched it to every sound category I saw listed in the menu.
    diagnosticity: low
    salience: high
    proposition: The notification silence began the same day the user changed the
      device's default notification ringtone in system settings.
    salience_source: B/C — vivid first-person chronology anchoring the silence to
      a specific action the same morning, with confident 'exact morning after' framing.
    why_plausible: Modifying notification-sound settings sounds adjacent to notification
      delivery, and users often conflate the two sections of the Android settings
      panel.
    why_irrelevant: Android's system ringtone setting controls sound selection only;
      per-app notification channel enable/disable toggles are controlled in a separate
      settings section and are not affected by changing the default ringtone.
  LL:
    distractor: The silence began the same day the default notification ringtone was
      changed in system settings.
    diagnosticity: low
    salience: low
    proposition: The notification silence began the same day the user changed the
      device's default notification ringtone in system settings.
    matched_to: HL
  HH:
    distractor: In the Android per-app notification settings, the banking app's main
      channel is switched to off, while every other installed app I checked still
      has its channels enabled.
    diagnosticity: high
    salience: high
    proposition: The banking app's notification channel is toggled off in Android's
      per-app notification settings, while all other apps' channels remain enabled.
    salience_source: Precise contrast between the banking app's disabled channel and
      all others still enabled makes the anomaly immediately legible and actionable.
  LH:
    distractor: The banking app's notification channel is set to off in Android's
      per-app notification settings, while every other app I checked still has its
      channels enabled.
    diagnosticity: high
    salience: low
    proposition: The banking app's notification channel is toggled off in Android's
      per-app notification settings, while all other apps' channels remain enabled.
    matched_to: HH
distractor_direction:
  label: Ringtone change disabling notifications
  description: Investigating whether changing the system default notification ringtone
    also disabled the banking app's notification delivery.
plausible_alternative_directions:
- label: App-level notification permission revoked
  description: Whether the OS revoked or the user accidentally denied the banking
    app's notification permission at the OS level rather than channel level.
- label: Bank server push outage
  description: Whether the bank's push-notification service or Firebase Cloud Messaging
    integration is down for this account.
- label: Battery optimisation blocking delivery
  description: Whether aggressive battery-optimisation settings are preventing the
    banking app's background process from receiving push payloads.
