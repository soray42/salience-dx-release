seed_id: T2-034
template: T2
domain: open_qa
complexity: medium
xbase: I received an offer with a title that is one level below my current one. The
  compensation package is higher overall and the company is growing fast. I am hesitant
  about the step back in title, even though I have only been at my current level for
  about eight months. {DS}
focal_diagnostic_feature: The offer letter includes a written 12-month senior title
  review commitment, and total compensation including bonus and equity is 22 percent
  above the current package.
low_diagnostic_proposition: The decision arose right after a networking event where
  conversations centred on title inflation and how a downgrade follows a career for
  years.
oracle_action: ANSWER
oracle_focus: Accept the offer on these terms; the written 12-month title review path
  and the 22-percent total-compensation advantage outweigh a title level held for
  only eight months, making the nominal step-back temporary and well-compensated.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let the timing of a title-inflation conversation
  decide the answer. Ask for the offer's total compensation breakdown, any written
  promotion path, and how the title level affects the user's specific career goals.
