distractor_direction:
  label: Networking event title-inflation warning
  description: Treating a recent networking event's unanimous title-inflation discussion
    as a reason to decline a role with a one-level title step-back.
plausible_alternative_directions:
- label: External title perception risk
  description: Whether a lower title on the resume affects the user's negotiating
    position for the next role after this one
  independently of a written review path.: null
- label: Company growth rate and title trajectory
  description: Whether the fast-growing company's internal title structure changes
    over time in ways that could alter the value of the written review commitment.
