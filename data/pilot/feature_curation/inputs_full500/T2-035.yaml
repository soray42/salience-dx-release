seed_id: T2-035
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Our nightly feature-engineering job has started producing nulls in the average-order-value
  column for about a quarter of customers, where that column used to be fully populated.
  The job code has not been touched in weeks, and the rows with nulls are not concentrated
  in any one region or customer segment. The downstream model now silently treats
  those nulls as zeros, which is skewing its scores. {DS}
focal_diagnostic_feature: An upstream source table changed the order-amount column
  from integer cents to a formatted string with a currency symbol, so the job's numeric
  cast now returns null for every value containing that symbol.
low_diagnostic_proposition: The nulls began the same week the team migrated its internal
  documentation from one wiki tool to another.
oracle_action: ANSWER
oracle_focus: 'Fix the type mismatch: the upstream order-amount column is now a currency-formatted
  string, so strip the symbol and parse it (or coerce the type) before the cast that
  is producing nulls.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the wiki migration to the nulls. Ask what
  changed in the upstream data feeding the average-order-value column.
