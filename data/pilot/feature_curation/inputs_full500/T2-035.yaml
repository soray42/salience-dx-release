    with a broader platform change that

    also touched data infrastructure, or that engineers distracted by the migration
    shipped an unnoticed change. But

    these are conjectures about other events, not about the migration itself; the
    migration of documentation content

    from one wiki tool to another moves prose pages and has no read or write path
    to the order data a nightly job

    consumes. It cannot alter a column''s type or insert nulls into a computed field.
    The focal evidence shows the

    real cause — an upstream string-typed currency value defeating the numeric cast
