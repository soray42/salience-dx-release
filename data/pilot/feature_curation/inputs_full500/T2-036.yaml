causal_audit:
  steelman: 'To steelman the repaint timing: one might argue a darker wall absorbs
    more light and warms the room slightly, or

    that during painting the fridge was pulled out, unplugged, or had its airflow
    blocked. But xbase already states

    the coils are clean and there is clear space around the unit, and a sealed system
    maintains its setpoint against

    ordinary room-temperature swings far larger than any paint colour produces; wall
    colour adds no heat load the

    thermostat cannot handle and cannot touch the refrigerant circuit. The focal evidence
    — a frost-free freezer with

    a room-temperature evaporator under a continuously running compressor — is a sealed-system
    failure, mechanically

    unrelated to the paint. No constructible mechanism links repainting to refrigerant
    loss.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the coils are cleaned and there is clear airflow
    space, foreclosing the disturbed-airflow pathway, while the decisive sealed-system
    evidence lives only in HH/LH.
