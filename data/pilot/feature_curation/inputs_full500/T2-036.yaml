complexity: high
xbase: My refrigerator has stopped keeping food properly cold over the past ten days;
  the fridge compartment now sits around 12°C and milk is spoiling early. It is twelve
  years old. The compressor runs almost continuously instead of cycling, the door
  seals look intact and shut snugly, and I have vacuumed the condenser coils and left
  clear space around it for airflow. A technician visit plus likely parts would be
  around €260, and a comparable new fridge is about €600. I need to decide whether
  to repair or replace. {DS}
focal_diagnostic_feature: The freezer section has no frost buildup at all and its
  evaporator stays at room temperature while the compressor runs, indicating the sealed
  refrigerant system has failed — the most expensive repair on the appliance.
low_diagnostic_proposition: The cooling problem started the same week the kitchen
  walls were repainted a darker colour.
oracle_action: ANSWER
oracle_focus: Replace the fridge; a frost-free freezer with a continuously running
  compressor points to a sealed-system (refrigerant/compressor) failure whose repair
  cost on a twelve-year-old unit approaches the price of a new one.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the repainting to the cooling fault. Ask
  whether the sealed cooling system is working and whether the likely failed part
  is cheap or costly.
