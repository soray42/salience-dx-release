distractor_direction:
  label: Dashboard-redesign coincidence
  description: Treating the BI tool's dashboard redesign rollout as connected to the
    export being truncated to 1,000 rows.
plausible_alternative_directions:
- label: Upstream data shortfall
  description: Whether the source genuinely produced fewer rows rather than the export
    capping them.
- label: Export-tool page size
  description: Whether a default pagination or fetch-size setting in the export connector
    is limiting rows.
