variants:
  HL:
    distractor: The very morning the numbers came up short was the exact morning the
      BI tool pushed its big redesigned dashboard — new panels, new colours. That
      is when the export started returning exactly a thousand rows.
    diagnosticity: low
    salience: high
    proposition: The truncation began the same day the BI tool rolled out its redesigned
      dashboard interface.
    salience_source: B/C — a confident same-morning chronology tying the shortfall
      to the memorable redesign launch, with concrete detail about the new look.
    why_plausible: A big visible tool update on the same day is a natural thing to
      blame when output changes.
    why_irrelevant: A dashboard's visual redesign changes presentation only; it does
      not rewrite the export query or cap how many rows it returns.
  LL:
    distractor: The truncation began the same day the BI tool rolled out its redesigned
      dashboard interface.
    diagnosticity: low
    salience: low
    proposition: The truncation began the same day the BI tool rolled out its redesigned
      dashboard interface.
    matched_to: HL
  HH:
    distractor: I opened the export query and there it is near the bottom — a 'LIMIT
      1000' line someone left in from testing — so the database hands back at most
      a thousand rows no matter how many transactions there were, which is exactly
      the cap I am seeing every morning.
    diagnosticity: high
    salience: high
    proposition: The export query still has a 'LIMIT 1000' clause that was added during
      testing and never removed, capping every run at a thousand rows.
    salience_source: Reading the query and finding the leftover LIMIT 1000 names the
      cap directly, making the cause concrete.
  LH:
    distractor: The export query still contains a leftover 'LIMIT 1000' clause from
      testing, capping every run at a thousand rows.
    diagnosticity: high
    salience: low
    proposition: The export query still has a 'LIMIT 1000' clause that was added during
