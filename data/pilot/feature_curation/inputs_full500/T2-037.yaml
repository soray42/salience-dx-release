  xbase_word_count: 53
  hl_word_count: 35
  ll_word_count: 16
  hh_word_count: 46
  lh_word_count: 19
  notes: 'xbase states the exact-1000-row symptom, successful job, and correct contents,
    but withholds the LIMIT clause —

    the decisive cap fact lives only in HH/LH, so HL/LL cannot resolve it. The ''rows
    are correct and recent'' line

    neutrally hints the data is fine without naming the limit. LL carries only the
    same-day redesign coincidence.

    HL repaired: condensed from 51 to 35 words by removing the ''Everyone was talking''
    sentence and tightening

    the chronology while preserving the same-morning coincidence claim and adding
    only setting detail (new panels,

    new colours) about the redesign event itself, not about the export query or its
    behaviour.

    '
causal_audit:
  steelman: 'To steelman the redesign timing: one could speculate the redesign shipped
    alongside a backend update that also

    altered export defaults, or that the new UI changed a row-count setting users
    click through. But these are

    guesses about other changes; the redesign itself is a presentation-layer change
    to dashboards and has no path to

    rewrite a scheduled SQL export or impose a row cap on it. The export runs server-side
    against the database. The

    focal evidence shows the real cause — a leftover ''LIMIT 1000'' in the query —
    which is independent of any

    front-end redesign and would cap the output whether or not the dashboards ever
    changed. No mechanism links them.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the decisive LIMIT clause lives only in HH/LH; the
    dashboard redesign has no path to the server-side export query regardless of xbase.
