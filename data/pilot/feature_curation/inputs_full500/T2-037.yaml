seed_id: T2-037
template: T2
domain: technical_troubleshooting
complexity: low
xbase: Our daily sales export has started arriving with exactly 1,000 rows every morning,
  even on days when I know there were far more transactions. The job runs on schedule
  and reports success, and the 1,000 rows it does contain are all correct and recent.
  It used to export the full day. {DS}
focal_diagnostic_feature: The export query still has a 'LIMIT 1000' clause that was
  added during testing and never removed, capping every run at a thousand rows.
low_diagnostic_proposition: The truncation began the same day the BI tool rolled out
  its redesigned dashboard interface.
oracle_action: ANSWER
oracle_focus: Remove the leftover LIMIT 1000 from the export query so the job returns
  the full day's rows instead of capping at a thousand.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the dashboard redesign to the row cap.
  Ask whether the export query contains a row limit that bounds every run.
