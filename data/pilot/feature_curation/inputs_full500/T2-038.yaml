xbase: My dishwasher has been leaving the dishes wet at the end of every cycle for
  the past two weeks; plastic items in particular come out dripping. The dishes are
  clean, the cycle completes normally with no error, and the machine still gets hot
  during the wash. It is four years old. A call-out to look at it would be about €110,
  and a new dishwasher in the same bracket runs €450, so I am weighing repair against
  replacement. {DS}
focal_diagnostic_feature: The rinse-aid indicator has been showing empty and the dispenser
  is dry, so without rinse aid the water sheets and clings instead of running off,
  which is why everything comes out wet.
low_diagnostic_proposition: The wet dishes started the same week new curtains were
  hung in the kitchen.
oracle_action: ANSWER
oracle_focus: Refill the rinse-aid dispenser (and clear it if blocked); empty rinse
  aid is a trivial, free-to-fix cause of poor drying, so neither a repair call-out
  nor replacement is warranted.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the new curtains to the wet dishes. Ask
  whether the rinse-aid dispenser is filled and working before considering a repair
  or replacement.
