    proposition: The slowdown began the same week the company migrated everyone to
      a new corporate VPN provider.
    salience_source: B/C — a confident first-night-after-the-switch chronology framed
      as a nagging connection.
    why_plausible: A network change feels like it could slow things down, and the
      timing alignment is tempting.
    why_irrelevant: A corporate VPN affects an employee's laptop connectivity, not
      a server-side batch job running inside the cluster, which never traverses the
      VPN.
  LL:
    distractor: The slowdown began the same week the company migrated everyone to
      a new corporate VPN provider.
    diagnosticity: low
    salience: low
    proposition: The slowdown began the same week the company migrated everyone to
      a new corporate VPN provider.
    matched_to: HL
  HH:
    distractor: I compared input sizes and the upstream table the rollup reads jumped
      from a single day's partition to the entire history overnight; the feed was
      switched to a full reload, so the job is now scanning and aggregating years
      of rows every night instead of one day's slice.
    diagnosticity: high
    salience: high
    proposition: An upstream table the job reads was switched from incremental daily
      partitions to a full historical reload, so the rollup now scans and reprocesses
      years of data each night instead of one day's slice.
    salience_source: Comparing input sizes and naming the incremental-to-full-reload
      switch makes the reprocessing-everything cause concrete.
  LH:
    distractor: The upstream input switched from a daily partition to a full historical
      reload, so the rollup now reprocesses years of data each night instead of one
      day.
    diagnosticity: high
    salience: low
    proposition: An upstream table the job reads was switched from incremental daily
      partitions to a full historical reload, so the rollup now scans and reprocesses
      years of data each night instead of one day's slice.
    matched_to: HH
distractor_direction:
  label: VPN-migration coincidence
  description: Treating the corporate VPN provider migration as connected to the nightly
    job's runtime doubling because the timing aligned.
