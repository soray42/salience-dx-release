seed_id: T2-039
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Our nightly analytics rollup job used to finish in about 40 minutes and now
  takes close to two hours, every night for the past week. The cluster it runs on
  is the same size, its own transform code has not changed, and resource graphs show
  no contention from other jobs during its window. The output is still correct; it
  is purely the runtime that has blown up. {DS}
focal_diagnostic_feature: An upstream table the job reads was switched from incremental
  daily partitions to a full historical reload, so the rollup now scans and reprocesses
  years of data each night instead of one day's slice.
low_diagnostic_proposition: The slowdown began the same week the company migrated
  everyone to a new corporate VPN provider.
oracle_action: ANSWER
oracle_focus: 'Restore incremental processing: the upstream feed now delivers a full
  history every night, so reinstate daily partitioning or filter to the new day''s
  slice so the rollup stops reprocessing all of history.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the VPN migration to the runtime. Ask
  whether the upstream input the job reads grew in size or scope since the slowdown
  began.
