  HL:
    distractor: What keeps nagging me is the timing — this all started the same week
      IT cut everyone over to the new corporate VPN. The day my laptop got the new
      VPN profile pushed was the first night the job ran long, and the slowness has
      stuck around ever since the switch.
    diagnosticity: low
