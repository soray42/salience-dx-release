causal_audit:
  steelman: 'To steelman the VPN: one might argue a new VPN could add latency to data
    transfers or that the migration came

    bundled with other network changes affecting the cluster. But the rollup is a
    server-side batch job executing

    within the cluster against the data lake; its reads do not traverse an employee
    VPN, which governs laptop-to-

    corporate connectivity. A VPN change cannot lengthen in-cluster compute, and ''bundled
    changes'' are separate

    events, not properties of the VPN swap. The focal evidence shows the real cause
    — the upstream input ballooned

    from one day to full history because the feed became a full reload — which quadruples
    the data scanned and is

    entirely independent of the VPN. No mechanism connects the migration to the runtime.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the cluster is the same size with no contention,
    closing the resource pathway, while the decisive input-size change lives only
    in HH/LH.
