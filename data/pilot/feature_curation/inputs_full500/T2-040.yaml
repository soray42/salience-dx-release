xbase: My electric oven has stopped heating properly over the past week. It still
  turns on, the display and timer work, the fan runs, and the top grill glows when
  I use it, but on bake mode food stays raw and the cavity never gets near the set
  temperature. It is eight years old. An appliance technician quoted roughly €90 for
  the visit plus parts, while a comparable built-in oven would be about €480 installed.
  I am trying to decide whether repairing it makes sense. {DS}
focal_diagnostic_feature: With the oven cold, the lower bake element has a visible
  burn-through break — a bright blistered gap in the metal loop — and it never glows
  on bake mode, which is a cheap, standard part to swap.
low_diagnostic_proposition: The heating problem began the same week the household
  switched to a new electricity supplier.
oracle_action: ANSWER
oracle_focus: Repair it; a burned-through bake element is an inexpensive, standard
  replacement part, so the no-heat fault does not point to an expensive failure that
  would favour replacing the oven.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the supplier switch to the oven fault.
  Ask which heating element is failing and whether the failed part is cheap or expensive.
