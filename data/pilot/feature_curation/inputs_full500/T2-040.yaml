causal_audit:
  steelman: 'To steelman the supplier switch: one might argue a new supplier could
    deliver different voltage or a degraded

    connection that under-powers the element. But a supplier change is a commercial/billing
    arrangement; the same

    distribution network delivers the same nominal mains voltage regardless of who
    bills for it, and any genuine

    voltage problem would equally affect the grill element, which xbase confirms still
    glows. The focal evidence

    shows the real cause — a physically burned-through bake element that no longer
    completes its circuit, a localized

    component failure — which is independent of the billing contract and would occur
    on any supply. No mechanism

    connects switching suppliers to the broken element.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the grill element still glows, showing mains
    power reaches the oven and closing the supply-power pathway, while the decisive
    broken-bake-element evidence lives only in HH/LH.
