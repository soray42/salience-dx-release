causal_audit:
  steelman: 'One could strain to say moving the desk relocated the machine or jostled
    a cable, indirectly disturbing the

    connection. But internet browsing on the desktop still works and other devices
    reach the drive, so physical

    connectivity is intact; a chair cannot assign IP addresses or steer traffic, and
    the actual fault is an address

    collision with a separately added device. No mechanism survives.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the desktop browses the internet normally
    and other devices reach the drive, foreclosing any physical-connection or cable
    pathway a desk change might be imagined to touch.
