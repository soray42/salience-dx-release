variants:
  HL:
    distractor: The drive started failing the very afternoon I finally swapped out
      my old squeaky desk chair for a new ergonomic one and rearranged the desk around
      it; the timing was so exact that the new chair is the first thing my mind keeps
      jumping back to.
    diagnosticity: low
    salience: high
    proposition: The problem began right after the user swapped the desk chair for
      a new one.
    salience_source: B/C — a precise, confident first-person timeline pinning the
      failure to a memorable desk change.
    why_plausible: People reflexively blame the most recent visible change, and the
      chair swap and failure fell on the same afternoon.
    why_irrelevant: A desk chair has no electrical or network connection to anything;
      it cannot affect IP addressing or how the desktop reaches the server, so it
      has no pathway to the symptom.
  LL:
    distractor: The problem began around the time the user replaced the desk chair.
    diagnosticity: low
    salience: low
    proposition: The problem began right after the user swapped the desk chair for
      a new one.
    matched_to: HL
  HH:
    distractor: 'I checked addresses: the desktop is on a fixed static IP, and a smart
      speaker I set up recently got handed the exact same address by the router''s
      DHCP, so two devices now answer to one IP and the desktop''s drive traffic keeps
      landing on the speaker instead of the server.'
    diagnosticity: high
    salience: high
    proposition: The desktop is set to a static IP that now collides with a new smart
      speaker that was assigned the same address by DHCP, so the desktop's traffic
      to the server intermittently goes to the wrong device.
    salience_source: Concrete address collision (static IP equals a DHCP-assigned
      speaker's address) making the conflict mechanism vivid.
  LH:
    distractor: The desktop's static IP collides with a new smart speaker's DHCP-assigned
      address, so its drive traffic reaches the wrong device.
    diagnosticity: high
    salience: low
    proposition: The desktop is set to a static IP that now collides with a new smart
      speaker that was assigned the same address by DHCP, so the desktop's traffic
      to the server intermittently goes to the wrong device.
    matched_to: HH
distractor_direction:
  label: New-chair timing
  description: Treating the recent desk-chair replacement as connected to when the
    network drive stopped working.
plausible_alternative_directions:
- label: SMB/share permissions
  description: Whether the share's permissions or protocol settings changed for this
    one machine.
- label: Desktop firewall rule
  description: Whether the desktop's firewall is newly blocking the file-sharing ports
    to the server.
- label: Stale credentials
  description: Whether cached or expired credentials are stopping only this desktop
    from mounting the drive.
