seed_id: T2-041
template: T2
domain: technical_troubleshooting
complexity: low
xbase: My desktop at home suddenly cannot open the shared network drive on our little
  home server. Other devices in the house still reach the drive fine, and the desktop
  browses the internet normally. The server is powered on and I can see it listed.
  I have not changed any sharing settings or passwords on either machine. {DS}
focal_diagnostic_feature: The desktop is set to a static IP that now collides with
  a new smart speaker that was assigned the same address by DHCP, so the desktop's
  traffic to the server intermittently goes to the wrong device.
low_diagnostic_proposition: The problem began right after the user swapped the desk
  chair for a new one.
oracle_action: ANSWER
oracle_focus: 'Resolve the IP address conflict: the desktop''s static IP overlaps
  an address the router handed to a new device; move the desktop to an address outside
  the DHCP pool or reserve it, then reconnect to the drive.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a new desk chair to a network-drive failure.
  Ask whether the desktop has an IP address conflict with another device and how its
  address is assigned before diagnosing the share.
