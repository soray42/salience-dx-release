xbase: I bought a new three-piece mesh Wi-Fi system last week to fix dead spots, and
  I'm now wondering whether to return it within the window because my internet doesn't
  feel any faster than before. Web pages and video calls work, but speed tests look
  the same as they did on the old router. The dead-spot rooms do now have a solid
  signal, which they never had. {DS}
focal_diagnostic_feature: The user's internet plan is 50 Mbps, and a wired speed test
  straight from the modem also reads 48 Mbps, so the plan, not the Wi-Fi gear, caps
  the speed; the mesh's job was coverage, which it fixed.
low_diagnostic_proposition: The disappointment with speed started right after the
  user hung new blackout curtains in the rooms.
oracle_action: ANSWER
oracle_focus: Keep the mesh system; the internet plan caps total speed near 50 Mbps
  regardless of hardware, and the mesh delivered what it was for by filling the dead
  spots, so returning it would only bring the dead zones back.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect new curtains to internet speed. Ask what
  the internet plan's rated speed is and what a wired test from the modem shows before
  judging whether the mesh underperforms.
