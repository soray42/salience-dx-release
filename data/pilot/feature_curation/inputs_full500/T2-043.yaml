causal_audit:
  steelman: 'One might argue dense foliage and ceramic pots on the windowsill partially
    obstruct line-of-sight and absorb

    some signal, nudging reliability down. But wired devices are flawless and the
    phone shows full bars during

    dropouts, foreclosing a signal-attenuation story; the issue is specifically channel
    contention from a new

    co-channel network seen on a scan, affecting only 2.4 GHz; a few plants by a window
    cannot create another

    network''s airtime usage, so there is no defensible mechanism.

    '
