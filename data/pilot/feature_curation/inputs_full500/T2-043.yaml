seed_id: T2-043
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: 'My home Wi-Fi has become unreliable over the past two weeks: video calls freeze
  for a second or two and downloads stall and resume. It is not a full outage, and
  wired devices plugged into the router are rock solid the whole time. My phone shows
  full bars when it happens. The router firmware is current and I have not changed
  its settings. {DS}'
focal_diagnostic_feature: A Wi-Fi scan shows a strong new neighbouring network that
  recently appeared on the same crowded 2.4 GHz channel as the user's, and the dropouts
  occur only on 2.4 GHz devices while 5 GHz devices stay solid.
low_diagnostic_proposition: The trouble began right after the user repotted several
  houseplants and moved them onto the windowsill.
oracle_action: ANSWER
oracle_focus: This is 2.4 GHz channel congestion from a strong new neighbouring network
  on the same channel; move the router's 2.4 GHz radio to a clear channel or steer
  devices to 5 GHz, since wired and 5 GHz traffic is unaffected.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect repotting plants to Wi-Fi reliability.
  Ask whether the dropouts hit 2.4 GHz versus 5 GHz devices and what a channel scan
  shows for nearby networks before diagnosing the radio environment.
