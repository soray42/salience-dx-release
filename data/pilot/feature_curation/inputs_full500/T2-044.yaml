    matched_to: HL
  HH:
    distractor: 'I cabled a laptop straight into the modem, bypassing the router entirely,
      and ran tests through the day: it''s full rated speed every daytime hour and
      then collapses to a fraction of it during the exact eight-to-eleven window,
      every night. The router is out of the loop, so the choke is on the shared line.'
    diagnosticity: high
    salience: high
    proposition: A wired speed test plugged straight into the modem also drops to
      a fraction of the rated speed only during the evening window and is full speed
      by day, so the bottleneck is shared upstream congestion that a new router cannot
      fix.
    salience_source: Concrete wired-modem test isolating the drop to the evening window
      with the router bypassed makes the upstream-congestion mechanism unmistakable.
  LH:
    distractor: A wired test from the modem is full speed by day and collapses only
      in the evening window, so the choke is the shared upstream line, not the router.
    diagnosticity: high
    salience: low
    proposition: A wired speed test plugged straight into the modem also drops to
      a fraction of the rated speed only during the evening window and is full speed
      by day, so the bottleneck is shared upstream congestion that a new router cannot
      fix.
    matched_to: HH
