seed_id: T2-044
template: T2
domain: open_qa
complexity: high
xbase: 'I''m about to spend a lot on a top-of-the-line new router because my home
  internet crawls every evening: pages hang and video buffers from roughly eight to
  eleven at night, then it''s perfectly fast again by morning. During the day it''s
  great. Our current router is only two years old and handles the daytime load without
  any trouble at all. {DS}'
focal_diagnostic_feature: A wired speed test plugged straight into the modem also
  drops to a fraction of the rated speed only during the evening window and is full
  speed by day, so the bottleneck is shared upstream congestion that a new router
  cannot fix.
low_diagnostic_proposition: The evening slowdowns began right after the user switched
  to a different email provider.
oracle_action: ANSWER
oracle_focus: Do not buy the new router; a wired test from the modem is equally slow
  only in the evening peak, so the limit is upstream neighbourhood/plan congestion,
  and replacing the router will not change shared-segment throughput.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect changing email providers to evening internet
  speed. Ask whether a wired test from the modem is also slow in the evening window
  before deciding the router is at fault.
