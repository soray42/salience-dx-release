variants:
  HL:
    distractor: Now that I think about it, the evening crawl set in right after I
      moved my whole household over to a new email provider and reconfigured everything
      around it; the changeover and the slow nights lined up so neatly that switching
      back keeps crossing my mind as a fix.
    diagnosticity: low
    salience: high
    proposition: The evening slowdowns began right after the user switched to a different
      email provider.
    salience_source: B/C — a confident first-person timeline pinning the slowdowns
      to a specific, memorable account change.
    why_plausible: People tie new problems to their most recent deliberate change,
      and the email switch and the slow evenings coincided.
    why_irrelevant: An email provider handles only mail and consumes negligible bandwidth;
      it cannot govern whole-connection throughput at a fixed time of night, so it
      has no pathway to the symptom.
  LL:
    distractor: The evening slowdowns began around the same time the user switched
      email providers.
    diagnosticity: low
    salience: low
    proposition: The evening slowdowns began right after the user switched to a different
