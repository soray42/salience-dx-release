variants:
  HL:
    distractor: The whole thing started the same morning I swapped out the dying desk
      lamp beside the printer for a brighter LED one and tucked its cable along the
      same run; the timing was so on-the-nose that the new lamp is honestly the first
      thing I suspect.
    diagnosticity: low
    salience: high
    proposition: The printer went offline right after someone replaced the desk lamp
      next to it.
    salience_source: B/C — a precise, confident first-person timeline pinning the
      failure to a specific, memorable desk change.
    why_plausible: People blame the newest visible change nearby, and the lamp swap
      and the printer dropping offline happened the same morning.
    why_irrelevant: A desk lamp shares no data path with the printer and cannot alter
      IP addressing; the queues fail because they point at an address the printer
      no longer holds, which a lamp cannot cause.
  LL:
    distractor: The printer went offline around the time someone replaced the nearby
      desk lamp.
    diagnosticity: low
    salience: low
    proposition: The printer went offline right after someone replaced the desk lamp
      next to it.
    matched_to: HL
  HH:
    distractor: 'I checked the printer''s network screen: its DHCP lease lapsed and
      the router gave it a brand-new IP, but every computer''s print queue is still
      aimed at the old address, so each job is fired off to an IP nothing answers
      on anymore while the printer waits, perfectly online, on its new one.'
    diagnosticity: high
    salience: high
    proposition: The printer's DHCP lease expired and the router handed it a new IP
      address, but every computer's saved print queue still points at the old IP,
      so jobs are sent to an address nothing answers on.
    salience_source: Concrete address mismatch (new DHCP IP versus the old IP saved
      in every queue) makes the offline cause unmistakable.
  LH:
    distractor: The printer's DHCP lease lapsed; queues target the old IP so jobs
      reach nothing, while the printer is online at its new address.
    diagnosticity: high
    salience: low
    proposition: The printer's DHCP lease expired and the router handed it a new IP
      address, but every computer's saved print queue still points at the old IP,
      so jobs are sent to an address nothing answers on.
    matched_to: HH
distractor_direction:
  label: New-desk-lamp timing
  description: Treating the recent desk-lamp replacement next to the printer as connected
    to it dropping offline.
plausible_alternative_directions:
- label: Print spooler fault
  description: Whether each computer's print spooler service has hung and is mishandling
    jobs.
- label: Printer driver issue
  description: Whether a driver update broke communication with the printer for all
    clients at once.
- label: Switch port problem
  description: Whether the network switch port or cable to the printer is intermittently
    failing.
