seed_id: T2-045
template: T2
domain: technical_troubleshooting
complexity: low
xbase: Our shared office printer suddenly stopped accepting print jobs from everyone's
  computers; jobs just sit in the queue marked "offline." The printer itself is powered
  on, its own screen shows no errors, and it happily prints its internal test page
  from the front panel. Nothing was changed on the printer's menus, and the network
  switch it plugs into is fine. {DS}
focal_diagnostic_feature: The printer's DHCP lease expired and the router handed it
  a new IP address, but every computer's saved print queue still points at the old
  IP, so jobs are sent to an address nothing answers on.
low_diagnostic_proposition: The printer went offline right after someone replaced
  the desk lamp next to it.
oracle_action: ANSWER
oracle_focus: The printer's IP address changed after its DHCP lease renewed; reserve
  a static IP for it on the router and update or re-add the printer queues to the
  new address, since the queues still point at the old IP.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect replacing a desk lamp to the printer dropping
  offline. Ask whether the printer's IP address has changed and what address the computers'
  print queues are pointing to before diagnosing further.
