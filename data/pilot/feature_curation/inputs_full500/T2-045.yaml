causal_audit:
  steelman: 'One might argue the new lamp''s switching power supply emits electrical
    noise that disturbs the nearby network

    cable. But the printer prints its own test page and reaches the switch fine, and
    the failure is purely that

    every queue targets a stale IP after a DHCP renewal; the printer is online at
    a new address, which no lamp can

    cause, so there is no mechanism.

    '
  steelman_verdict: no_defensible_mechanism
