xbase: 'I''m thinking of returning a wireless keyboard I bought last week because
  it keeps cutting out: every so often a burst of my typing just doesn''t register
  and I have to retype it. It''s annoying enough that I assumed I got a faulty unit.
  The same keyboard pairs and types perfectly when I sit on the sofa with it near
  my laptop. Its battery is full. {DS}'
focal_diagnostic_feature: The keyboard's USB receiver is plugged into a USB 3.0 port
  right beside the dongle, and USB 3.0 ports are a known source of 2.4 GHz interference;
  moving the receiver to a short extension or a USB 2.0 port makes the dropouts vanish.
low_diagnostic_proposition: The dropouts started right after the user put a new leather
  desk mat on the desk.
oracle_action: ANSWER
oracle_focus: Do not return the keyboard; the dropouts are USB 3.0 radio interference
  with the 2.4 GHz receiver, which works flawlessly elsewhere, so move the dongle
  to a USB 2.0 port or a short extension cable away from the port instead.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a new desk mat to the keyboard dropping
  out. Ask which USB port the receiver is plugged into and whether moving the dongle
  away from the computer or a USB 3.0 port changes anything before deciding the unit
  is faulty.
