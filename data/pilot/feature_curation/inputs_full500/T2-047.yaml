      or smooth the ingest rate.'
variants:
  HL:
    distractor: The whole thing seems to have started the same week we swapped the
      big status-board television on the office wall for a newer one; the timing was
      so neat that the on-call engineer keeps mentioning it, since the first 429 alert
      landed the very afternoon the new screen went up.
    diagnosticity: low
    salience: high
    proposition: The 429 errors began the same week the team replaced the office's
      wall-mounted status dashboard television.
    salience_source: B/C — a clean, confidently recounted chronology with a memorable
      same-afternoon coincidence makes the timing feel meaningful.
    why_plausible: Humans latch onto sharp 'started right after' coincidences, and
      a hardware swap in the same week is the kind of change-event teams instinctively
      suspect.
    why_irrelevant: A passive display television on the office wall is not in the
      indexing path or the network to the cluster; it has no mechanism to affect Elasticsearch's
      write queue.
  LL:
    distractor: The 429 errors began the same week the office's wall-mounted status
      dashboard television was replaced.
    diagnosticity: low
    salience: low
    proposition: The 429 errors began the same week the team replaced the office's
      wall-mounted status dashboard television.
    matched_to: HL
  HH:
    distractor: During every spike, the bulk thread pool's queue is completely full
      and its rejected-execution counter climbs exactly in step with the 429 responses;
      the bulk requests are simply arriving faster than the pool can drain them, so
      the queue overflows and sheds the excess.
    diagnosticity: high
    salience: high
    proposition: The bulk thread pool's queue is full during the spikes, and its rejected-execution
      counter rises in lockstep with the 429s while bulk requests arrive faster than
      the pool can drain them.
    salience_source: Concrete internal metrics (full bulk queue, rejected-execution
      counter tracking the 429s) make the saturation cause vivid.
  LH:
    distractor: The bulk thread pool's queue is full during the spikes and its rejected-execution
      counter rises in step with the 429s as requests outpace draining.
    diagnosticity: high
    salience: low
    proposition: The bulk thread pool's queue is full during the spikes, and its rejected-execution
      counter rises in lockstep with the 429s while bulk requests arrive faster than
      the pool can drain them.
    matched_to: HH
distractor_direction:
  label: Display-swap timing
  description: Treating the coincident replacement of the office status-board television
    as connected to the indexing rejections.
plausible_alternative_directions:
- label: Shard rebalancing pressure
  description: Whether shard relocation is consuming write capacity and causing rejections
    during spikes.
- label: Mapping or refresh overhead
  description: Whether refresh interval or heavy field mappings are slowing indexing
    throughput.
