seed_id: T2-047
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Our Elasticsearch cluster started rejecting a portion of bulk indexing requests
  with 429 errors about four days ago. Search queries still work, and the rejections
  come and go rather than being constant. We have not changed the indexing client
  or the mappings recently, and the cluster has the same node count it has had for
  months. {DS}
focal_diagnostic_feature: The bulk thread pool's queue is full during the spikes,
  and its rejected-execution counter rises in lockstep with the 429s while bulk requests
  arrive faster than the pool can drain them.
low_diagnostic_proposition: The 429 errors began the same week the team replaced the
  office's wall-mounted status dashboard television.
oracle_action: ANSWER
oracle_focus: 'Address bulk thread-pool saturation: the write queue is overflowing
  during spikes, so throttle or batch the client, increase the queue or pool capacity,
  or smooth the ingest rate.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a wall-display swap to indexing rejections.
  Ask for bulk thread-pool queue depth, rejected-execution counts, and the ingest
  rate during the spikes.
cell_oracles:
  HL:
    action: ASK
    focus: Do not connect a wall-display swap to indexing rejections. Ask for bulk
      thread-pool queue depth, rejected-execution counts, and the ingest rate during
      the spikes.
  LL:
    action: ASK
    focus: Do not connect a wall-display swap to indexing rejections. Ask for bulk
