causal_audit:
  steelman: 'To steelman, one might imagine the new television drew power on a shared
    circuit or added a device to the office

    network. But the television is a passive display on the office wall, not part
    of the indexing client, the

    cluster''s hosts, or their network fabric; an office display does not participate
    in how bulk write requests are

    queued and executed inside Elasticsearch''s thread pools. There is no path — electrical,
    network, or logical — by

    which swapping a status-board screen could change the rate at which the bulk pool
    drains. The coincidence has no

    constructible mechanism for the 429 rejections.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the coincidence (office display swap) has no mechanism
    to close; xbase withholds the bulk-thread-pool saturation evidence, which lives
    only in HH/LH.
