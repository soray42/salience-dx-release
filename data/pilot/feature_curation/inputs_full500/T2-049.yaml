variants:
  HL:
    distractor: The odd thing is the failures started the same week a colleague plugged
      a new desk lamp into the socket strip right beside the server; he half-jokes
      that he has cursed the machine, and we both keep noticing that the timing lines
      up almost to the day.
    diagnosticity: low
    salience: high
    proposition: The backup failures began the same week a new desk lamp was plugged
      in next to the server in the office.
    salience_source: B/C — a clean same-week chronology with a memorable shared joke
      makes the coincidence stick.
    why_plausible: A new device plugged in near a server is exactly the sort of physical
      change people reflexively blame when something breaks soon after.
    why_irrelevant: A desk lamp on the same socket strip draws independent power and
      does nothing to the server's storage; it cannot affect whether a backup file
      can be written.
  LL:
    distractor: The backup failures began the same week a new desk lamp was plugged
      in next to the server.
    diagnosticity: low
    salience: low
    proposition: The backup failures began the same week a new desk lamp was plugged
      in next to the server in the office.
    matched_to: HL
  HH:
    distractor: Looking at the server, the partition the backup writes to is sitting
      at 100% usage, and the dump dies partway through every night with a clear disk-full
      write error — there is simply no room left to finish writing the backup file.
    diagnosticity: high
    salience: high
    proposition: The backup target partition is at 100% usage, and the dump fails
      partway through with a disk-full write error each night.
    salience_source: Concrete state (partition at 100%, disk-full error partway through)
      makes the cause undeniable.
  LH:
    distractor: The backup target partition is at 100% usage and the dump fails partway
      through each night with a disk-full write error.
    diagnosticity: high
    salience: low
    proposition: The backup target partition is at 100% usage, and the dump fails
      partway through with a disk-full write error each night.
    matched_to: HH
distractor_direction:
  label: Desk-lamp timing
  description: Treating the coincident plugging-in of a desk lamp near the server
    as connected to the backup failures.
plausible_alternative_directions:
- label: Database lock during dump
  description: Whether the application is holding a lock that blocks the nightly dump.
- label: File permission change
  description: Whether the backup user lost write permission on the target path.
