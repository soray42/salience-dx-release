  notes: 'LL carries only the same-week-desk-lamp timing claim. The colleague''s joke
    and the socket-strip detail are

    HL-only and about the coincidence event. xbase withholds the disk-full evidence,
    stating only that the job

    failed three nights, ran fine for a year, the app works by day, and the script
    is unchanged; the decisive

    full-partition fact lives only in HH/LH. A desk lamp on a power strip has no path
    to disk space, satisfying C2

    absolute.

    '
causal_audit:
  steelman: 'One could imagine the lamp overloaded a circuit and caused brownouts
    that corrupted writes. But the application

    runs normally during the day on the same server, so the machine is powered and
    stable; a desk lamp on a socket

    strip draws its own current and has no logical or storage path into how the backup
    file is written. There is no

    mechanism by which adding a lamp could fill or restrict the backup partition.
    The timing is pure coincidence and

    the cause is the disk being full.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the application runs normally during the day
    on the same server, foreclosing the power-instability pathway the lamp might be
    imagined to act through; the decisive disk-full evidence lives only in HH/LH.
