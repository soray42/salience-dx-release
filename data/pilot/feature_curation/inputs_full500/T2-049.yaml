seed_id: T2-049
template: T2
domain: technical_troubleshooting
complexity: low
xbase: My nightly database backup job has been failing for the last three nights.
  It is a simple dump of our SQLite-backed application database to a file on the same
  server, and it had run cleanly every night for over a year. The application itself
  is working normally during the day, and I have not changed the backup script. {DS}
focal_diagnostic_feature: The backup target partition is at 100% usage, and the dump
  fails partway through with a disk-full write error each night.
low_diagnostic_proposition: The backup failures began the same week a new desk lamp
  was plugged in next to the server in the office.
oracle_action: ANSWER
oracle_focus: Free space on the backup target partition; it is full, so the dump cannot
  complete — clear old backups, move the target, or expand the disk.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a desk lamp to a backup failure. Ask for
  the exact error and the free space on the backup target partition.
cell_oracles:
  HL:
    action: ASK
    focus: Do not connect a desk lamp to a backup failure. Ask for the exact error
      and the free space on the backup target partition.
  LL:
    action: ASK
    focus: Do not connect a desk lamp to a backup failure. Ask for the exact error
