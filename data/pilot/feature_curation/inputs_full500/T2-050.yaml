template: T2
domain: open_qa
complexity: medium
xbase: My monthly public-transport spending has crept up by roughly thirty euros over
  the last two months and I cannot pin down why. I take the same metro and tram lines
  to work and back, the same number of days a week, and I top up the same travel card
  I have used for years. My commute pattern genuinely has not changed, yet the card
  runs out faster than it used to. {DS}
focal_diagnostic_feature: A fare-zone boundary was redrawn two months ago so the user's
  destination stop now sits in a higher zone, raising the per-trip fare for the same
  journey.
low_diagnostic_proposition: The higher spending began the same month the user started
  using a new coffee-shop loyalty app on their phone.
oracle_action: ANSWER
oracle_focus: 'The increase is the fare-zone change: the destination stop moved into
  a higher zone two months ago, raising the per-trip fare for the same commute, so
  check for a zone-capped pass or season ticket.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a coffee loyalty app to transit spending.
  Ask whether fares or fare zones on the user's lines changed, and compare the old
  and new per-trip price.
