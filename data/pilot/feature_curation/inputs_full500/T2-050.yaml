causal_audit:
  steelman: 'One might argue a loyalty app nudges extra coffee purchases that show
    up in overall card spending. But the

    spending in question is the travel card emptying faster, and a coffee-shop loyalty
    app does not debit the travel

    card or change metro and tram fares; it operates entirely in a separate purchase
    channel. There is no mechanism

    by which adopting that app could raise the per-trip transit fare. The timing coincides,
    but the cause is the

    fare-zone redraw that lifted the journey into a more expensive zone.

    '
  steelman_verdict: no_defensible_mechanism
