causal_audit:
  steelman: 'One might argue a heavy chat client consumes laptop resources or network
    bandwidth that slows clients. But the

    symptom is server-side key eviction inside Redis driven by memory pressure, and
    an internal chat tool neither

    connects to this Redis nor writes keys into it; it has no presence in the instance''s
    keyspace or memory. There

    is no mechanism by which adopting a chat tool could push a Redis instance to its
    maxmemory or evict session keys.

    The timing coincides; the cause is the recurring no-TTL batch job.

    '
