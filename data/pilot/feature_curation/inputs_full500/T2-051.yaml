seed_id: T2-051
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Our Redis instance that backs application sessions has started evicting keys
  unexpectedly, so users are getting logged out mid-session. It began about five days
  ago. We have not deployed the application or changed the Redis configuration, and
  connection counts and command rates look about the same as always on the monitoring
  graphs. {DS}
focal_diagnostic_feature: A scheduled job that runs every five days now writes a large
  batch of cache entries with no TTL into the same instance, pushing it against maxmemory
  so the eviction policy expels session keys.
low_diagnostic_proposition: The eviction problem started the same week the team adopted
  a new chat tool for internal communication.
oracle_action: ANSWER
oracle_focus: The eviction is memory pressure from the five-day batch job loading
  large no-TTL cache entries into the session instance; isolate those entries, give
  them a TTL, or move them to a separate Redis.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a new chat tool to Redis evictions. Ask
  what else writes to the instance, its memory usage versus maxmemory, and which keys
  are being evicted.
