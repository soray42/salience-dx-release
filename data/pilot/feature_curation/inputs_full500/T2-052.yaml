seed_id: T2-052
template: T2
domain: open_qa
complexity: high
xbase: My checked suitcase has arrived damaged on my last three flights — a cracked
  shell one time, a sheared-off wheel the next, a burst zip the third. I use the same
  hard-shell case I have flown with for years, I pack it the same way, and I have
  not started overstuffing it. It always comes off the belt looking like it has been
  through something rough. I am trying to understand the pattern. {DS}
focal_diagnostic_feature: All three damaged trips were tight connections through the
  same hub, where bags are short-shipped and run through an automated high-speed sorter
  known for rough handling on rushed transfers.
low_diagnostic_proposition: The damage streak began around the time the user switched
  to a new brand of luggage tag.
oracle_action: ANSWER
oracle_focus: 'The common factor is the transfer hub: tight connections route the
  bag through a high-speed automated sorter that handles rushed transfers roughly,
  so avoid that hub, allow longer connections, or fly direct.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a luggage-tag brand to case damage. Ask
  what the three trips had in common — routing, connections, and which airports handled
  the bag.
