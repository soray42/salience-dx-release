causal_audit:
  steelman: 'One might argue a tag that obscures or contradicts a barcode could send
    a bag to manual handling or off-route,

    raising mishandling. But the focal evidence is physical destruction — cracked
    shell, sheared wheel, burst zip —

    consistent with mechanical sorter impact, and a passive luggage tag does not govern
    how hard a bag is thrown or

    slammed by a sorter. The tag''s only function is identification; it has no mechanism
    to crack a hard shell. The

    streak is explained by the shared rough-handling hub on tight connections, which
    the tag change cannot touch.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the same case, same packing, and no overstuffing,
    foreclosing the self-inflicted-load pathway; the decisive shared-hub high-speed-sorter
    factor lives only in HH/LH.
