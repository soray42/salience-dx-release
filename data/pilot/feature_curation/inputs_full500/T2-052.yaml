    why_plausible: The tag switch is the one deliberate change the user made, so a
      confident family member's 'began right when' framing is tempting.
    why_irrelevant: A luggage tag is a passive identifier; it does not determine how
      forcefully a bag is thrown or sorted and cannot cause a cracked shell or sheared
      wheel.
