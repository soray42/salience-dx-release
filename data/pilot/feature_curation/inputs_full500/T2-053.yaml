variants:
  HL:
    distractor: The whole thing lines up almost too neatly with the week our facilities
      team retired the old office Wi-Fi name and rolled out a new building-wide network;
      the first failed nightly run was the very morning after everyone had to forget
      the old network and reconnect to the new one.
    diagnosticity: low
    salience: high
    proposition: The failures began around the time the office switched to a new building-wide
      Wi-Fi network name.
    salience_source: B/C — a clean, confidently drawn chronology pinning the first
      failure to the morning after the network rename.
    why_plausible: Network changes feel infrastructural, so a busy engineer might
      loosely associate them with anything connectivity-shaped failing.
    why_irrelevant: The CI runners and the cloud artifact store never touch the office
      Wi-Fi, so renaming an office SSID cannot affect a server-to-server upload.
  LL:
    distractor: The failures began around the time the office switched to a new building-wide
      Wi-Fi network name.
    diagnosticity: low
    salience: low
    proposition: The failures began around the time the office switched to a new building-wide
      Wi-Fi network name.
    matched_to: HL
  HH:
    distractor: The nightly job is scheduled for 02:30, which falls squarely inside
      the artifact store's published daily maintenance window when it rejects all
      uploads; my manual daytime triggers run well outside that window, which is exactly
      why they publish without complaint.
    diagnosticity: high
    salience: high
    proposition: The nightly run is scheduled inside the artifact store's documented
      maintenance window, during which uploads are rejected, while the manual daytime
      runs fall outside it.
    salience_source: The exact schedule time landing inside the documented reject
      window makes the timing collision concrete.
  LH:
    distractor: The nightly run is scheduled inside the artifact store's maintenance
      window, which rejects uploads, while daytime manual runs fall outside it.
    diagnosticity: high
    salience: low
    proposition: The nightly run is scheduled inside the artifact store's documented
      maintenance window, during which uploads are rejected, while the manual daytime
      runs fall outside it.
    matched_to: HH
