seed_id: T2-053
template: T2
domain: technical_troubleshooting
complexity: low
xbase: Our nightly CI build started failing about three days ago at the artifact upload
  step, right at the end of an otherwise green run. The compile and test stages pass,
  and the error is just a generic failure when the job tries to publish the build
  output. We have not touched the pipeline file or the upload credentials this week,
  and the same build publishes fine when I trigger it by hand during the day. {DS}
focal_diagnostic_feature: The nightly run is scheduled inside the artifact store's
  documented maintenance window, during which uploads are rejected, while the manual
  daytime runs fall outside it.
low_diagnostic_proposition: The failures began around the time the office switched
  to a new building-wide Wi-Fi network name.
oracle_action: ANSWER
oracle_focus: Reschedule the nightly job outside the artifact store's maintenance
  window, or add a retry that survives it; the upload fails because the nightly run
  lands inside the window when the store rejects writes.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a Wi-Fi network rename to a server-side
  CI upload failure. Ask when the nightly job runs and what the artifact store does
  at that hour.
