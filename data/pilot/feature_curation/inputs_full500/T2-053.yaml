    '
causal_audit:
  steelman: 'One could try to argue the Wi-Fi changeover matters: if CI runners or
    a self-hosted agent sat on the office

    network, a network rename could break their connectivity. But CI runners and a
    cloud artifact store communicate

    over the internet backend-to-backend; they do not authenticate to or route through
    the office wireless SSID, and

    a daytime manual trigger of the same pipeline — which would use the same renamed
    office network — succeeds. The

    rename therefore has no path to a nightly server-side upload rejection. The real
    cause, the nightly run landing

    inside the store''s maintenance window when writes are refused, is fully independent
    of the office network. The

    coincidence has no constructible mechanism for this symptom.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase notes the same build publishes fine when triggered
    by hand during the day, which would use the very same renamed office network,
    foreclosing the Wi-Fi mechanism without naming the maintenance-window cause.
