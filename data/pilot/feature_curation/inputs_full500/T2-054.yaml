xbase: We moved into our rented house two months ago and the place has felt slightly
  damp ever since, with a faint musty smell in the back bedroom and a couple of patches
  on the wall that look like they are getting worse. The rest of the house seems fine.
  We air the rooms when we can and we have not had any obvious leaks from taps or
  the roof that we have noticed. I want to figure out what is actually driving the
  damp in that one room. {DS}
focal_diagnostic_feature: The back bedroom shares a wall with the bathroom, and that
  wall has no cavity ventilation, so warm moist air condenses on the cold internal
  surface and feeds the damp patches.
low_diagnostic_proposition: The damp seemed to start around the time we replaced all
  the old curtains with heavier blackout ones.
oracle_action: ANSWER
oracle_focus: 'Treat this as condensation on the cold internal wall shared with the
  bathroom: warm moist air is settling on an unventilated surface. Improve that wall''s
  ventilation and surface warmth and address the bathroom moisture source.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not blame the new curtains for the damp. Ask where
  the damp wall sits in the house and whether it adjoins a moisture source like the
  bathroom.
