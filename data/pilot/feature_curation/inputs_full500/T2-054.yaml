causal_audit:
  steelman: 'One might try to argue the blackout curtains contribute: heavier window
    coverings can reduce air movement at the

    glass and, in some rooms, slightly raise local humidity near a cold window, nudging
    condensation. But that

    mechanism acts at the window, not on an internal party wall, and adds no moisture
    to the house; curtains do not

    change the temperature of the bathroom-side wall or pump humid air into the cavity.
    The damp here sits on the

    unventilated wall shared with the bathroom, fed by shower moisture condensing
    on a cold surface — a process

    entirely independent of what hangs over the windows. The curtain coincidence has
    no constructible mechanism for

    damp on that specific internal wall.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase notes the damp is confined to one back room while
