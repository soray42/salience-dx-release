seed_id: T2-055
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Our GitLab CI pipeline's container builds started taking roughly three times
  as long to start about a week ago, where they used to begin almost instantly. Once
  a build actually gets going it runs at normal speed; it is purely the startup before
  any of our build commands run that drags. The pipeline YAML and the base image reference
  are unchanged, and a colleague on the same project sees the same slow start. {DS}
focal_diagnostic_feature: The build's base image was retagged to a much larger variant
  upstream, so each job now pulls a far bigger image before any build step runs, all
  of which happens before our commands start.
low_diagnostic_proposition: The slow starts began around the week the company rolled
  out a new corporate logo and rebranded the CI dashboard.
oracle_action: ANSWER
oracle_focus: 'Investigate the base image pull: the tag now points at a much larger
  image, so every job spends the extra time pulling it before any build command runs.
  Pin a slimmer tag or warm an image cache to cut the startup delay.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a logo rebrand to slow CI startup. Ask
  what the build pulls before commands run and whether the base image size changed.
