causal_audit:
  steelman: 'One could try to argue the rebrand mattered: large platform rollouts
    sometimes ship alongside infrastructure

    changes, and a dashboard reskin might hint at a CI platform upgrade that altered
    scheduling. But a logo and a

    dashboard theme are static front-end assets; they do not change how jobs are scheduled,
    how images are pulled, or

    how runners provision. The symptom is concentrated entirely in the pre-command
    startup phase, which is dominated

    by base-image pulls, and the base image was retagged to a much larger variant
    upstream — a cause wholly

    independent of branding. Presentation-layer rebranding has no constructible mechanism
    for longer image pulls, so

    the coincidence is empty.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase notes the pipeline YAML and base image reference
    are unchanged and the slowness is purely pre-command, which a dashboard reskin
    would not selectively cause, weakening the rebrand pathway without naming the
    image-size cause.
