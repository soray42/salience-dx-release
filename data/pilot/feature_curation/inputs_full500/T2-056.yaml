xbase: I'm reconsidering whether buying my current flat last year was a mistake, because
  my monthly housing cost has felt much tighter for the last few months than it did
  at first. My salary has not changed and I have not taken on new debt. The mortgage
  itself is a fixed-rate deal that does not adjust, and I have kept my spending roughly
  the same. I want to understand what is actually squeezing the budget before I conclude
  that the purchase itself was wrong. {DS}
focal_diagnostic_feature: The building's annual service charge and the local property
  tax both rose sharply this year, and together they account for the entire increase
  in the user's monthly housing outlay.
low_diagnostic_proposition: The squeeze seemed to start around the time I switched
  my grocery shopping to a more upmarket supermarket.
oracle_action: ANSWER
oracle_focus: The purchase was not the error; a sharp rise in the building's service
  charge and the local property tax fully accounts for the higher monthly outlay.
  Address those ongoing-cost line items rather than second-guessing the buy.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not blame the upmarket grocery switch for a housing
  squeeze. Ask which housing line items changed, such as service charges, property
  tax, or insurance, before judging the purchase.
