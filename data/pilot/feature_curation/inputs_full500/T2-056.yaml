  steelman: 'One could try to argue the grocery switch is the culprit: moving to a
    pricier supermarket really does raise

    monthly spending, and a budget can feel tight from exactly such a habit change,
    so it might seem to vindicate the

    suspicion. But the question on the table is whether buying the flat was a mistake,
    which turns on housing costs,

    not on a discretionary grocery category. The focal evidence shows the entire increase
    in monthly housing outlay

    is explained by a sharp service-charge rise and an upward property-tax reassessment,
    with the fixed mortgage

    unchanged. Grocery spending is orthogonal to whether the purchase was sound and
    cannot account for the

    housing-line increase, so the coincidence has no constructible mechanism for the
    question being asked.

    '
