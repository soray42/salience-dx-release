causal_audit:
  steelman: 'One could try to argue the chat migration matters: tool cutovers sometimes
    coincide with webhook or CI-config

    edits, and a new platform''s integration could in principle re-trigger or mis-report
    builds. But a chat tool is a

    notification sink; it receives build results and posts messages, and has no role
    in scheduling, executing, or

    evaluating test assertions. The failures are flaky precisely on a future-deadline
    assertion driven by a date

    literal that has aged into the past, which makes the outcome depend on the wall
    clock at execution time — a cause

    intrinsic to the test, wholly independent of where build notifications are delivered.
    The chat-tool coincidence

    has no constructible mechanism for a clock-dependent date assertion.

    '
