domain: technical_troubleshooting
complexity: low
xbase: Our CircleCI test job started reporting a flaky failure about four days ago
  in one suite that checks date handling. The same job passed reliably for months,
  and the application code under test has not changed. When I re-run the job it sometimes
  passes and sometimes fails on the same assertions about a computed deadline. The
  pipeline configuration and the test code itself are untouched as far as I can tell.
  {DS}
focal_diagnostic_feature: The failing tests hardcode an expected date that has now
  fallen in the past, so the deadline-in-the-future assertion only fails on the runs
  where the test reaches it after a particular wall-clock moment.
low_diagnostic_proposition: The flakiness began the same week our team migrated from
  one chat tool to another for stand-ups.
oracle_action: ANSWER
oracle_focus: 'Fix the test''s hardcoded expected date: it has aged past the point
  where the future-deadline assertion holds, so the suite fails depending on the current
  clock. Use a relative or frozen reference date instead of a fixed literal.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a chat-tool migration to a date-handling
  test failure. Ask what the failing assertions compare and whether any date in the
  test is hardcoded.
