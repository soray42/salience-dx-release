domain: open_qa
complexity: medium
xbase: We moved into our new rented flat about six weeks ago and the kitchen has had
  a steady low-level fruit-fly problem almost since the first week. We keep the surfaces
  clean, take the rubbish out regularly, and store fruit in the fridge, yet there
  is always a small cloud of them near the sink by evening. The rest of the flat is
  clear. I want to work out where they are actually breeding so I can stop them at
  the source. {DS}
focal_diagnostic_feature: The kitchen sink's drain trap is clogged with old organic
  residue from the previous tenants, and the flies are breeding in that biofilm inside
  the drain.
low_diagnostic_proposition: The problem seemed to coincide with us putting up a new
  set of houseplants on the kitchen windowsill.
oracle_action: ANSWER
oracle_focus: 'The breeding site is the kitchen drain: old organic residue in the
  sink trap is harbouring the larvae. Clean or flush the drain and trap thoroughly
  to remove the biofilm rather than treating the surfaces or the plants.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not blame the new windowsill plants. Ask where the
  flies cluster and whether the sink drain or trap has been checked for organic residue.
