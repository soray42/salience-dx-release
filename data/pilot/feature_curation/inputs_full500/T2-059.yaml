      calls.
  HH:
    action: ANSWER
    focus: The service is spending request time on synchronous DEBUG logging to disk;
      set the log level back to INFO or make logging asynchronous, rather than treating
      the dashboard migration as relevant.
  LH:
    action: ANSWER
    focus: The service is spending request time on synchronous DEBUG logging to disk;
