seed_id: T2-059
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Our search API's average response time roughly doubled about a week ago, from
  around 80 ms to 160 ms, and it has stayed there. The slowdown affects every endpoint
  roughly equally and is steady all day rather than tied to load. There were no application
  deploys to the service in that window, and request volume is flat. The hosts are
  not CPU-bound or memory-bound according to the usual graphs. {DS}
focal_diagnostic_feature: The application log level was left at DEBUG, and each request
  now writes dozens of synchronous log lines to disk inline before responding.
low_diagnostic_proposition: The slowdown began the same week the team migrated its
  dashboards to a new Grafana instance.
oracle_action: ANSWER
oracle_focus: The service is spending request time on synchronous DEBUG logging to
  disk; set the log level back to INFO or make logging asynchronous, rather than treating
  the dashboard migration as relevant.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the Grafana migration to the service's
  own latency. Ask what the requests are spending added time on, such as logging,
  I/O, or downstream calls.
cell_oracles:
  HL:
    action: ASK
    focus: Do not connect the Grafana migration to the service's own latency. Ask
      what the requests are spending added time on, such as logging, I/O, or downstream
      calls.
  LL:
    action: ASK
    focus: Do not connect the Grafana migration to the service's own latency. Ask
