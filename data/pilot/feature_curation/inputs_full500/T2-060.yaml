xbase: My macarons have started cracking on top and coming out with no feet, the little
  ruffled rim they are supposed to have, for the last several batches. Before that
  I had a stretch of good ones. I weigh the almond flour and sugar, age the egg whites,
  and whip the meringue to stiff peaks, and I pipe even rounds onto lined trays. The
  oven and bake time are what I have always used. Every recent batch fails the same
  way. {DS}
focal_diagnostic_feature: The piped shells are put straight into the oven with no
  resting time, so no skin forms on top before baking.
low_diagnostic_proposition: The cracking began the same week the user bought a new
  set of decorative kitchen tea towels.
oracle_action: ANSWER
oracle_focus: Rest the piped shells until a dry skin forms before baking; cracks and
  missing feet come from baking unrested shells, not from the new tea towels.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the new tea towels to the macaron failures.
  Ask whether the piped shells are rested to form a skin before they go in the oven.
