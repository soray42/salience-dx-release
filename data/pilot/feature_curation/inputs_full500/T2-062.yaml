    short shift on the same counter, not to a different environment; an espresso shot''s
    taste is governed by grind,

    dose, temperature, and extraction time, none of which a few feet of relocation
    changes. There is no path by

    which moving the machine makes every shot run sour. Nothing in xbase ties location
    to extraction, so the timing

