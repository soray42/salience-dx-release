xbase: The espresso from my home machine has tasted sharp and sour for about a week,
  thin and a bit watery rather than the rounded shots I used to pull. I am using the
  same bag of beans I was using before, stored the same way, and the machine is at
  the same temperature setting. I tamp the same way I always have and use the same
  dose. The sourness shows up in every shot now, not just some. {DS}
focal_diagnostic_feature: The shots now run out in about twelve seconds instead of
  the usual twenty-eight, because the grinder setting has drifted much coarser.
low_diagnostic_proposition: The sour taste started right after the user rearranged
  the kitchen counter and moved the machine to a new spot.
oracle_action: ANSWER
oracle_focus: The grind has drifted too coarse, so the shots run fast and under-extract
  into sourness; dial the grinder finer to bring the shot time back up, rather than
  blaming the counter rearrangement.
