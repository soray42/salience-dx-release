variants:
  HL:
    distractor: The coincidence I cannot shake is that these hourly spikes started
      the same week we cut over our on-call alerting from the old paging tool to a
      new one and reworked all the escalation policies. It was a big change and it
      landed right when the spikes appeared.
    diagnosticity: low
    salience: high
    proposition: The hourly spikes began the same week the team switched its on-call
      alerting from one paging tool to another.
    salience_source: B/C — a confident first-person timeline pinning the spikes to
      the on-call tool migration week.
    why_plausible: A large, recent operational change is tempting to blame when a
      new problem shows up in the same window.
    why_irrelevant: On-call alerting only watches and notifies about the system; switching
      paging tools changes nothing about how the API serves requests, so it cannot
      create hourly latency.
  LL:
    distractor: The hourly spikes began the same week the team switched its on-call
      alerting from one paging tool to another.
    diagnosticity: low
    salience: low
    proposition: The hourly spikes began the same week the team switched its on-call
      alerting from one paging tool to another.
    matched_to: HL
  HH:
    distractor: Digging into the cache, a huge batch of keys were all written with
      the same one-hour TTL, so they expire together exactly on the hour; every request
      then misses at the same instant and they all pile onto the database to rebuild
      the entries, which is the thirty-second stampede we see.
    diagnosticity: high
    salience: high
    proposition: A large set of cache keys all share the same one-hour TTL and expire
      together on the hour, so every request misses at once and stampedes the database
      to repopulate them.
    salience_source: The synchronized one-hour TTL and the simultaneous miss-and-rebuild
      make the stampede mechanism concrete.
  LH:
    distractor: A large batch of cache keys share a one-hour TTL and expire together
      on the hour, so all requests miss at once and stampede the database.
    diagnosticity: high
    salience: low
    proposition: A large set of cache keys all share the same one-hour TTL and expire
      together on the hour, so every request misses at once and stampedes the database
      to repopulate them.
    matched_to: HH
