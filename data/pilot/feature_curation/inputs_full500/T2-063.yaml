causal_audit:
  steelman: 'Could an on-call tool migration cause hourly API latency? One might speculate
    a new agent or integration was

    installed and polls on the hour. But the migration as described is a change of
    paging and escalation tooling —

    the layer that notifies humans about incidents — not a change to the service''s
    runtime; such tools consume

    alerts and metrics, they do not sit in the request path. There is no path by which
    switching who gets paged

    creates a thirty-second on-the-hour latency spike. Nothing in xbase ties the API''s
    processing to the alerting

    tool, so the timing is coincidence with no constructible mechanism, while a batch
    of keys sharing a one-hour TTL

    fully explains a clockwork on-the-hour stampede.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states traffic is smooth with no surge and no deploy
    lined up, ruling out load- and release-driven explanations and leaving an internal
    periodic event, without naming the cache TTL; the decisive stampede finding lives
    only in HH/LH.
