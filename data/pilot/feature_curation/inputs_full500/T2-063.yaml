seed_id: T2-063
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: 'Our product API has a sharp latency spike right at the top of every hour:
  for about thirty seconds the p99 jumps from around 90 ms to over two seconds, then
  it settles back to normal. It happens like clockwork on the hour, every hour, and
  only then. Traffic itself is smooth across the hour with no matching surge. There
  were no deploys lining up with when this started. {DS}'
focal_diagnostic_feature: A large set of cache keys all share the same one-hour TTL
  and expire together on the hour, so every request misses at once and stampedes the
  database to repopulate them.
low_diagnostic_proposition: The hourly spikes began the same week the team switched
  its on-call alerting from one paging tool to another.
oracle_action: ANSWER
oracle_focus: The on-the-hour spike is a cache stampede from many keys expiring together;
  stagger the TTLs or add jitter and request coalescing, rather than connecting it
  to the on-call tool switch.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the paging-tool switch to the API latency.
  Ask what happens in the system precisely on the hour, such as cache expiry or scheduled
  jobs.
