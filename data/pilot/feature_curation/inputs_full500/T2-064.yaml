causal_audit:
  steelman: 'Could a water softener affect canning? One might argue softened water
    has different mineral content that could,

    say, alter boil behaviour in the canner. But the seal itself is mechanical and
    thermal: it forms when the lid''s

    sealing compound presses to the jar rim and the cooling contents draw a vacuum,
    and the processing water never

    contacts that compound or the jar interior. xbase already holds acidity, headspace,
    processing time, and cooling

    constant, so water chemistry has no remaining route to the seal. There is no path
    by which softened tap water

    stops a lid from sealing. Nothing in xbase ties the softener to the seal, so the
    timing is coincidence with no

    constructible mechanism, while reused lids with spent compound fully explain the
    failures.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase holds recipe, processing time, cooling, acidity,
    and headspace constant, foreclosing process-and-chemistry explanations the softener
    might touch, without naming the reused lids; the decisive spent-compound finding
    lives only in HH/LH.
