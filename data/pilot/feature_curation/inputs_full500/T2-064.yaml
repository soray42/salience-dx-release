domain: open_qa
complexity: high
xbase: 'I do a batch of pressure-canned tomatoes every late summer, and this year
  a worrying share of the jars failed to seal: the lids did not pop down and stay
  concave the way sealed ones do, and a few popped back up after cooling. I followed
  my usual recipe, processed for the usual time, and let the jars cool undisturbed
  on the counter overnight. The acidity and headspace were what I always use. About
  half the batch did not take. {DS}'
focal_diagnostic_feature: The canning lids were reused from a previous year, and their
  sealing compound is dried out and indented, so it can no longer form an airtight
  seal.
low_diagnostic_proposition: The sealing failures began the same week a new water softener
  was installed in the house.
oracle_action: ANSWER
oracle_focus: The reused lids have spent sealing compound and cannot seal; use fresh
  single-use lids and reprocess, rather than connecting the failures to the new water
  softener.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the water softener to the jars failing
  to seal. Ask whether the lids were new single-use lids or reused from a prior year.
