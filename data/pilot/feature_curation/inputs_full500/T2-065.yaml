variants:
  HL:
    distractor: Now that I think about it, this all kicked off the same week the building
      crew repainted our whole office floor; the place still smelled of fresh paint
      on the Monday morning the first login complaints started rolling in.
    diagnosticity: low
    salience: high
    proposition: The login problem began the same week the office was repainted.
    salience_source: B/C — a clean, confident first-person chronology tying the symptom
      to a vivid, dated event.
    why_plausible: The repaint and the bug landed in the same week, and coincident
      timing is a natural first thing a tired engineer latches onto.
    why_irrelevant: Repainting walls cannot touch cookie attributes or HTTPS redirects;
      the cause is the session cookie being dropped for lacking the Secure flag.
  LL:
    distractor: The login failures affecting all users started the same week the office
      was repainted.
    diagnosticity: low
    salience: low
    proposition: The login problem began the same week the office was repainted.
    matched_to: HL
  HH:
    distractor: Watching the network trace, the login sets a session cookie but it
      has no Secure attribute, so on the cross-site callback redirect that finalises
      the login the browser silently discards it; the next request then arrives with
      no session at all.
    diagnosticity: high
    salience: high
    proposition: The browser drops the session cookie because it is set without the
      Secure attribute, so it is discarded on the cross-site callback redirect that
      completes the login.
    salience_source: Concrete network-trace observation of the missing Secure flag
      and the drop on redirect makes the mechanism precise.
  LH:
    distractor: The session cookie is set without the Secure attribute and the browser
      discards it on the cross-site callback redirect.
    diagnosticity: high
    salience: low
    proposition: The browser drops the session cookie because it is set without the
      Secure attribute, so it is discarded on the cross-site callback redirect that
      completes the login.
    matched_to: HH
distractor_direction:
  label: Office repaint timing
  description: Investigating whether the building repaint, or anything about that
    week's office activity, is responsible for the login failures.
plausible_alternative_directions:
- label: Session store outage
  description: Whether the server-side session store is failing to persist or look
    up sessions after login.
- label: Clock skew on token validation
  description: Whether server time drift causes freshly issued session tokens to be
    treated as invalid.
