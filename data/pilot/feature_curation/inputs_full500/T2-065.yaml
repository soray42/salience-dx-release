causal_audit:
  steelman: 'One might try to argue the office work mattered: a repaint could accompany
    electrical or network-cabinet changes

    that disrupted connectivity to the session store. But xbase confines the event
    to repainting walls, and a paint

    job has no path to cookie attributes, HTTPS behaviour, or the browser''s decision
    to drop a session cookie on a

    redirect. There is no constructible mechanism by which repainting could cause
    a cookie to be set without the

    Secure flag or be discarded across a cross-site callback. The coincidence is purely
    temporal.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase confines the coincident event to repainting and reports
    clean auth-service and IdP logs, leaving no connectivity or infrastructure pathway
    for the repaint; the decisive cookie-drop fact lives only in HH/LH.
