seed_id: T2-065
template: T2
domain: technical_troubleshooting
complexity: low
xbase: Users on our internal web app are bounced straight back to the login screen
  the moment they finish signing in. The credentials are accepted and the app briefly
  loads, but the very next page request behaves as if they were never authenticated.
  It happens on every fresh login, for everyone, and started this week. The login
  service and our identity provider both report successful authentications with no
  errors logged. {DS}
focal_diagnostic_feature: The browser drops the session cookie because it is set without
  the Secure attribute, so it is discarded on the cross-site callback redirect that
  completes the login.
low_diagnostic_proposition: The login problem began the same week the office was repainted.
oracle_action: ANSWER
oracle_focus: Set the session cookie with the Secure attribute so the browser keeps
  it across the cross-site callback redirect; it is currently dropped, which is why
  each fresh login fails to persist.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect an office repaint to a web authentication
  failure. Ask whether the session cookie is being set and retained across the login
  redirect.
