  and yawning at my desk by two o'clock. My diet and caffeine are unchanged, I still
  get up at the same time for work, and my weekends feel just as tired. I keep meaning
  to get to the bottom of it because it's starting to affect how much I get done.
  I'd like to fix whatever habit slipped rather than just push through. {DS}
