causal_audit:
  steelman: 'One could argue a pillow genuinely affects sleep quality: poor neck support
    fragments sleep and leaves you tired

    despite adequate time in bed, so a new pillow that does not suit the sleeper could
    plausibly cause afternoon

    fatigue from the week it was introduced. The quality-of-sleep mechanism is real
    in general. But it cannot inform

    THIS case: the decisive change is duration, not surface comfort — the user''s
    logged bedtime moved an hour and a

    half later while wake time held constant, so they are simply sleeping less. A
    pillow cannot shorten time in bed,

    so the pillow-timing coincidence has no mechanism for the observed sleep loss.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase fixes the wake time as unchanged and frames the issue
    as a slipped habit, foreclosing a comfort-only explanation while leaving the bedtime
    change unstated; the decisive lost-sleep fact lives only in HH/LH.
