distractor_direction:
  label: Monitoring migration timing
  description: Investigating whether the cutover to a new monitoring and alerting
    platform disrupted the connection between the two services.
plausible_alternative_directions:
- label: CA trust bundle drift
  description: Whether one service stopped trusting the internal CA after a trust-bundle
    change.
- label: Cipher or protocol downgrade
  description: Whether a TLS version or cipher-suite mismatch is causing the post-presentation
    teardown.
