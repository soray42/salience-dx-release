  HH:
    distractor: 'I checked what the server enforces: it validates the client cert''s
      identity against the expected hostname, and the client cert''s SAN still carries
      the service''s old name from last week''s rename. That stale SAN no longer matches,
      so the identity check fails and the server drops it.'
    diagnosticity: high
    salience: high
    proposition: The server validates the client certificate's identity against an
      expected hostname, and the client cert's Subject Alternative Name still carries
