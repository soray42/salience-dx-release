seed_id: T2-067
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Two of our internal services that talk to each other over mutual TLS suddenly
  cannot establish a connection. The handshake gets far enough that both sides present
  certificates, but the server then rejects the client and tears the connection down.
  Both certificates are issued by our internal CA, both are well within their validity
  period, and neither service was redeployed today. The failures are total, not intermittent,
  and began this afternoon. {DS}
focal_diagnostic_feature: The server validates the client certificate's identity against
  an expected hostname, and the client cert's Subject Alternative Name still carries
  the service's old name from a recent rename, so the identity check fails.
low_diagnostic_proposition: The connection failures started right after the team migrated
  its monitoring dashboards to a new tool.
oracle_action: ANSWER
oracle_focus: Reissue the client certificate with a Subject Alternative Name matching
  the service's current hostname; the server rejects it because the SAN still holds
  the pre-rename name that no longer matches the expected identity.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a dashboard migration to an mTLS rejection.
  Ask what identity the server expects and what name the client certificate's SAN
  actually carries.
