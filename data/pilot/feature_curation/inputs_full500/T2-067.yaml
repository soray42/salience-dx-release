variants:
  HL:
    distractor: It only just occurred to me that this lines up exactly with our switch
      to a new monitoring platform this afternoon; we cut over all the dashboards
      and alert routing within the same hour the first mTLS failures showed up in
      the logs.
    diagnosticity: low
    salience: high
    proposition: The connection failures started right after the team migrated its
      monitoring dashboards to a new tool.
    salience_source: B/C — a clean, confident first-person chronology tying the symptom
      to a same-hour, vivid migration.
    why_plausible: A big observability cutover happening the same hour is exactly
      the kind of change an engineer suspects when something breaks.
    why_irrelevant: Dashboards and alert routing only read telemetry; they cannot
      alter what certificate identity the server enforces or what name a client cert's
      SAN carries.
  LL:
    distractor: The connection failures started right after the team migrated its
      monitoring dashboards to a new tool.
    diagnosticity: low
