causal_audit:
  steelman: 'One could argue a monitoring migration is not always read-only: cutting
    over to a new platform sometimes ships

    sidecars, agents, or network-policy changes that ride along and could interfere
    with service-to-service traffic,

    so the same-hour timing might point at the cutover. But xbase limits the change
    to dashboards and alert routing,

    which consume telemetry and do not participate in the mTLS path; they cannot change
    what certificate identity a

    server enforces or what name a client certificate''s SAN encodes. There is no
    mechanism by which a dashboard

    migration produces a SAN-versus-expected-hostname mismatch. The coincidence is
    purely temporal.

    '
