xbase: Our family has been arriving late to work and school almost every morning for
  the past two weeks, and it's becoming a real source of stress. We wake at the same
  time we always have, the kids get dressed at the usual pace, and breakfast runs
  the same as ever. We still aim to pull out of the driveway at 8:10 like we always
  did. Something in the morning has quietly stopped working and I want to find what
  actually changed. {DS}
focal_diagnostic_feature: Two weeks ago the family added a sibling drop-off at a second
  school that adds a 22-minute detour, but the target departure time of 8:10 was never
  moved earlier, so the new leg consumes the entire former arrival margin.
low_diagnostic_proposition: The lateness started the same week a new kitchen clock
  was installed.
