    by a kitchen clock and the new one runs

    slow, everyone would believe they have more time than they do and leave late,
    exactly matching the symptom. The

    misread-time mechanism is coherent in general. But it cannot fit THIS case: xbase
    states the family wakes at the

    same time and aims to depart at the same 8:10 as always, so their schedule is
    anchored to fixed target times,

    not to whatever the clock reads, and the focal change is a newly added 22-minute
    route leg with no compensating

