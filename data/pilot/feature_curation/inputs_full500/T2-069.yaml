variants:
  HL:
    distractor: For what it's worth, this all began the same morning I finally set
      up my new standing desk and rerouted every cable behind it; I powered the machine
      down to move things and brought it back up just before the key stopped working.
    diagnosticity: low
    salience: high
    proposition: The login trouble began right after the user got a new desk setup
      and rerouted their cables.
    salience_source: B/C — a clean, confident first-person chronology tying the symptom
      to a vivid, same-morning physical change.
    why_plausible: A power-down, recabling, and a balky login the same morning is
      exactly the sequence that makes someone suspect the hardware move.
    why_irrelevant: Cables and a desk move cannot alter filesystem permissions on
      the remote server; sshd is ignoring the key because the home directory is group-writable.
  LL:
    distractor: The login trouble began right after the user got a new desk setup
