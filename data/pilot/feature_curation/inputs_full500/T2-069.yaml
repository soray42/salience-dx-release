causal_audit:
  steelman: 'One might try to argue the desk move mattered: powering the workstation
    off and on, or recabling, could have

    interrupted a key agent, a hardware token, or a network path, any of which can
    break key-based login. But xbase

    shows the same key still authenticates fine against a different host, which rules
    out a broken local key, agent,

    or token, and the user reaches port 22 normally, ruling out a network path problem.
    The actual cause is a

    server-side filesystem permission on the user''s home directory, which a desk
    move and recabling cannot touch.

    There is no mechanism by which rearranging cables changes remote directory permissions.
    The coincidence is purely

    temporal.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the same key works against another host and
    port 22 is reachable, foreclosing broken-key and network mechanisms for the desk
    move; the decisive group-writable-directory fact lives only in HH/LH.
