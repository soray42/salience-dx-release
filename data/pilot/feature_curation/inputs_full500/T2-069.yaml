    matched_to: HL
  HH:
    distractor: The server's auth log says it is ignoring my authorized_keys file.
      The reason is that my home directory is now group-writable, and sshd refuses
      to honour keys when the directory holding them has permissions that loose, so
      it silently falls back to password auth.
    diagnosticity: high
    salience: high
    proposition: The server's auth log shows it is ignoring the user's authorized_keys
      because their home directory became group-writable, and sshd refuses keys when
      the containing directory has loose permissions.
    salience_source: Concrete auth-log reason plus the group-writable directory makes
      the permissions cause precise and observable.
  LH:
    distractor: The auth log shows sshd is ignoring authorized_keys because the user's
      home directory is group-writable.
    diagnosticity: high
    salience: low
    proposition: The server's auth log shows it is ignoring the user's authorized_keys
