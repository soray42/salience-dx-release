seed_id: T2-069
template: T2
domain: technical_troubleshooting
complexity: low
xbase: I can no longer log into our build server with my SSH key; it falls straight
  through to asking for a password instead of accepting the key. The key itself is
  unchanged and still works fine against a different host I use. The server is up,
  I can reach it on port 22, and a teammate with their own key logs in without any
  trouble. This started this morning and only affects my account on this one box.
  {DS}
focal_diagnostic_feature: The server's auth log shows it is ignoring the user's authorized_keys
  because their home directory became group-writable, and sshd refuses keys when the
  containing directory has loose permissions.
low_diagnostic_proposition: The login trouble began right after the user got a new
  desk setup and rerouted their cables.
oracle_action: ANSWER
oracle_focus: Tighten the permissions on the user's home and .ssh directory so they
  are not group-writable; sshd is silently ignoring the authorized_keys file because
  the containing directory is too permissive.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a new desk setup to an SSH key rejection.
  Ask what the server's auth log says about why the key is being ignored, such as
  file or directory permissions.
