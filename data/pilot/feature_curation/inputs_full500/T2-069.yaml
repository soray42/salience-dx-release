  label: New desk setup timing
  description: Investigating whether the new desk, recabling, or power-cycle that
    accompanied it is responsible for the SSH key being rejected.
plausible_alternative_directions:
- label: Key removed from authorized_keys
  description: Whether the user's public key was deleted or replaced in the server's
    authorized_keys file.
- label: sshd config change
  description: Whether a server-side change disabled public-key authentication for
    this account.
