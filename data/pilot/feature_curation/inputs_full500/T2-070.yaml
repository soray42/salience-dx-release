seed_id: T2-070
template: T2
domain: open_qa
complexity: medium
xbase: My evening study sessions have become far less productive over the last fortnight.
  I sit down for the same two hours, I'm working through the same course material
  at the same point in the syllabus, and I'm no more tired than usual. Yet I finish
  each night having covered a fraction of what I used to. I want to pin down what
  shifted in how these sessions actually run rather than just blaming my willpower.
  {DS}
focal_diagnostic_feature: The user's time-tracker shows that since they moved from
  studying alone in their room to the shared flat common room, their average uninterrupted
  focus block fell from about 50 minutes to about 9 minutes, with 14 interruptions
  logged per session.
low_diagnostic_proposition: The productivity drop began the same week the user bought
  new over-ear study headphones.
oracle_action: ANSWER
oracle_focus: Return to studying alone or otherwise eliminate the interruptions; since
  moving to the shared common room, focus blocks fragmented from about 50 minutes
  to about 9, which is what cut the user's output.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not blame new headphones for the drop on timing alone.
  Ask how the user's sessions are actually being interrupted and how their focus blocks
  have changed.
