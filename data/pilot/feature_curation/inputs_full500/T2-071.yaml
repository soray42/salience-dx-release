variants:
  HL:
    distractor: I keep coming back to the fact that this all kicked off the same week
      we renamed half our Grafana folders and rebuilt the dashboard hierarchy from
      scratch; the timing lines up almost to the day, and it is the only change in
      that window.
    diagnosticity: low
    salience: high
    proposition: The flapping began the same week the team renamed and reorganised
      its Grafana dashboard folders.
    salience_source: B/C — clean first-person chronology and confident first-instinct
      framing make the coincidence feel like the lead.
    why_plausible: When a symptom appears right after the only visible change, attributing
      it to that change is a natural reflex under time pressure.
    why_irrelevant: Renaming dashboard folders only relabels how metrics are displayed;
      it cannot alter pod readiness behaviour, which is decided by the probe and the
      application, not by Grafana.
  LL:
    distractor: The flapping began around the time the team reorganised and renamed
      its monitoring dashboard folders.
    diagnosticity: low
    salience: low
    proposition: The flapping began the same week the team renamed and reorganised
      its Grafana dashboard folders.
    matched_to: HL
  HH:
    distractor: I traced the dips and the readiness handler makes a synchronous call
      into a downstream service that runs a heavy aggregation job every ten minutes;
      while that job holds the connection the probe times out, the pod is marked not-ready,
      and it recovers the instant the job finishes.
    diagnosticity: high
    salience: high
    proposition: The readiness endpoint synchronously checks a downstream dependency
      that runs a heavy scheduled job every ten minutes, and the probe times out while
      that job holds the connection.
    salience_source: Concrete tracing of the probe-to-downstream call and its alignment
      with the ten-minute job exposes the real mechanism.
  LH:
    distractor: The readiness probe synchronously calls a downstream that runs a ten-minute
      job and times out while it is busy.
    diagnosticity: high
    salience: low
    proposition: The readiness endpoint synchronously checks a downstream dependency
      that runs a heavy scheduled job every ten minutes, and the probe times out while
      that job holds the connection.
    matched_to: HH
distractor_direction:
  label: Dashboard reorganisation
  description: Investigating whether renaming and reorganising monitoring dashboards
    is connected to the readiness flapping because the timing coincided.
plausible_alternative_directions:
- label: Probe threshold too strict
  description: Whether the readiness timeout or failureThreshold is too tight for
    normal latency variation.
- label: Node-level networking
  description: Whether periodic node network saturation interrupts probe traffic.
