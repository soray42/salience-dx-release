    closure is needed because the coincidence has no mechanism at all (C2 absolute).

    '
causal_audit:
  steelman: 'The strongest case for the dashboard change: one might imagine a reorganisation
    that accidentally deleted or

    repointed an alerting rule, making pre-existing flaps newly visible. But that
    is a discovery-timing story, not a

    causal one — relabelling Grafana folders changes only how metrics are named and
    grouped in the UI; it touches no

    probe definition, no application code path, and no load-balancer behaviour. There
    is no mechanism by which

    renaming dashboards can make pods actually fail a readiness probe and leave rotation.
    The real cause, a readiness

    check coupled to a periodic downstream job, is entirely independent of the monitoring
    layer, so the coincidence

    has no constructible mechanism for this symptom.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the coincidence (dashboard reorganisation) has no
    mechanism for readiness flapping; the real periodic-dependency cause lives only
    in HH/LH.
