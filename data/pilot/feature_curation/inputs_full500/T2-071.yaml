seed_id: T2-071
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Our Kubernetes service's pods are failing their readiness probe roughly every
  ten minutes and briefly dropping out of the load-balancer rotation before recovering.
  This started about five days ago. The application logs look clean during the dips,
  and CPU and memory stay well within limits. We have not changed the deployment spec
  or the probe definition. I want a concrete direction before the on-call rotation
  gets tired of the flapping alerts. {DS}
focal_diagnostic_feature: The readiness endpoint synchronously checks a downstream
  dependency that runs a heavy scheduled job every ten minutes, and the probe times
  out while that job holds the connection.
low_diagnostic_proposition: The flapping began the same week the team renamed and
  reorganised its Grafana dashboard folders.
oracle_action: ANSWER
oracle_focus: The readiness probe fails because it synchronously calls a downstream
  that is busy with a ten-minute scheduled job; decouple the probe from the heavy
  dependency or make the check shallow and time-bounded so transient downstream load
  stops evicting pods.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect dashboard reorganisation to readiness
  flapping. Ask what the readiness endpoint actually checks and whether the dips align
  with a periodic downstream job.
