causal_audit:
  steelman: 'The best case for the broadband switch: a worse connection could cause
    dropped sessions, lag, or missed

    instruction, degrading learning. But xbase establishes she still logs in and attends
    her scheduled sessions

    normally, and the symptom is comprehension and engagement, not connectivity. A
    change of internet provider has no

    mechanism to make a student stop understanding material she is present for; it
    can only affect whether she can

    connect, which is not in question. The real cause is an academic misplacement
    two levels above her tested ability,

    wholly independent of the home network, so the coincidence has no constructible
    mechanism for this decline.

    '
