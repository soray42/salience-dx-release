seed_id: T2-072
template: T2
domain: open_qa
complexity: high
xbase: My teenage daughter's grades in her online tutoring programme have slipped
  over the past two months, after a solid first term. She still logs in for her scheduled
  sessions and the platform is the same one she liked before. Her teachers say she
  seems checked out lately. We are paying a meaningful monthly fee and I am trying
  to decide whether the programme is still working or whether something else is going
  on. I want to get this right before the next billing cycle. {DS}
focal_diagnostic_feature: The slip began exactly when the programme moved her into
  an advanced cohort two levels above her placement test, and her session recordings
  show her unable to follow the new material.
low_diagnostic_proposition: The decline started the same month the household switched
  to a new internet provider.
oracle_action: ANSWER
oracle_focus: The grades slipped because the programme advanced her two levels beyond
  her tested placement and she cannot follow the harder material; have her moved back
  to an appropriate level rather than cancelling, and review the misplacement with
  the provider.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not attribute the grade slip to the internet-provider
  switch. Ask what changed in the programme's content or level for her and whether
  the material now matches her ability.
