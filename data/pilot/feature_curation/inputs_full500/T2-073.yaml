variants:
  HL:
    distractor: What sticks with me is that the builds got slow the exact same week
      I redid my whole desktop look — new wallpaper, a fresh terminal colour scheme,
      the works. The timing matches so cleanly that it is hard not to suspect the
      changes I made that week.
    diagnosticity: low
    salience: high
    proposition: The slowdown began the same week the user changed their desktop wallpaper
      and terminal colour scheme.
    salience_source: B/C — clean first-person chronology and confident first-instinct
      framing make the coincidence feel like the lead.
    why_plausible: Pinning a new symptom on the only thing one changed that week is
      a natural reflex, especially when the timing is tidy.
    why_irrelevant: Wallpaper and terminal colours are purely cosmetic UI settings;
      they have no path to Docker's build pipeline or its caching behaviour.
  LL:
    distractor: The slowdown began around the week the user changed their desktop
      wallpaper and terminal colour scheme.
    diagnosticity: low
    salience: low
    proposition: The slowdown began the same week the user changed their desktop wallpaper
      and terminal colour scheme.
    matched_to: HL
  HH:
    distractor: Watching the build output, every dependency step now says it is rebuilding
      rather than using cache; an early COPY of a file that changes on almost every
      run invalidates the cache for every layer after it, so the whole dependency
      install runs cold each time.
    diagnosticity: high
    salience: high
    proposition: The build no longer reuses the Docker layer cache; an early COPY
      of a frequently-changing file invalidates every subsequent layer, so all dependency
      layers rebuild each time.
    salience_source: Concrete reading of the build output showing cache misses and
      the cache-busting early COPY exposes the mechanism.
  LH:
    distractor: An early COPY of a frequently-changing file busts the layer cache,
      so all later dependency layers rebuild each run.
    diagnosticity: high
    salience: low
    proposition: The build no longer reuses the Docker layer cache; an early COPY
      of a frequently-changing file invalidates every subsequent layer, so all dependency
      layers rebuild each time.
    matched_to: HH
