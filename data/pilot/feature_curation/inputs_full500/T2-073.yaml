seed_id: T2-073
template: T2
domain: technical_troubleshooting
complexity: low
xbase: My Docker build on my laptop has gone from about two minutes to over eight
  minutes over the last few days. The Dockerfile has not changed and the project is
  the same size. The build eventually succeeds, it is just much slower than it used
  to be. I want to know where the time is going before I waste another afternoon waiting.
  {DS}
focal_diagnostic_feature: The build no longer reuses the Docker layer cache; an early
  COPY of a frequently-changing file invalidates every subsequent layer, so all dependency
  layers rebuild each time.
low_diagnostic_proposition: The slowdown began the same week the user changed their
  desktop wallpaper and terminal colour scheme.
oracle_action: ANSWER
oracle_focus: The build is busting the layer cache because an early COPY of a changing
  file invalidates later layers; reorder the Dockerfile so dependencies are copied
  and installed before volatile files, restoring cache reuse.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the wallpaper or terminal theme change
  to build speed. Ask whether the layer cache is being hit and which step rebuilds
  every run.
