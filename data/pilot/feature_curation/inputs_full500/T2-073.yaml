causal_audit:
  steelman: 'The strongest case for the desktop change: perhaps a new terminal emulator
    or shell theme spawns extra processes

    or a heavier rendering path that steals CPU during builds. But xbase specifies
    only a wallpaper and a colour

    scheme — cosmetic display settings — not a new terminal program or shell. Such
    settings change how pixels are

    drawn, not how Docker schedules work or caches layers. There is no mechanism by
    which choosing a different

    background image or palette can quadruple build time. The real cause, an early
    cache-busting COPY, lives entirely

    in the Dockerfile''s layer ordering, independent of any desktop appearance, so
    the coincidence is non-causal.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the coincidence (cosmetic desktop change) has no
    mechanism for build speed; the real cache-busting cause lives only in HH/LH.
