seed_id: T2-075
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Our cloud storage bill for one bucket has roughly tripled over the last month,
  even though the application writing to it has not changed and the amount of new
  data we store is about the same as before. The object count is growing only slowly.
  We use the same region and storage class we always have. I want to find what is
  driving the cost before finance asks me to explain it. {DS}
focal_diagnostic_feature: A new analytics workload runs a full-bucket list-and-scan
  every few minutes, and the bill increase is entirely in per-request and data-retrieval
  charges, not storage.
low_diagnostic_proposition: The cost jump began the same week the office moved the
  team to a new floor.
oracle_action: ANSWER
oracle_focus: The extra cost is request and retrieval charges from a new analytics
  job scanning the whole bucket every few minutes, not storage growth; throttle or
  cache that job and scope its listing so the per-request and egress charges fall.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the office floor move to the storage bill.
  Ask for a breakdown of the charges by type and whether request or retrieval costs,
  not storage, are driving it.
