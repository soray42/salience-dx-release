causal_audit:
  steelman: 'The strongest case for the office move: maybe relocating shifted people
    to a network path with different egress

    routing. But a cloud bucket is billed on storage volume, request counts, and data
    transfer measured in the cloud

    provider''s region — none of which depends on which floor employees sit on. Office
    moves do not change a bucket''s

    request rate or its storage class. There is no mechanism by which a team''s desk
    location can triple object-storage

    charges. The real cause, a new analytics job scanning the bucket continuously,
    is entirely server-side and

    independent of the office, so the coincidence is non-causal.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the coincidence (office floor move) has no mechanism
    for a cloud storage bill; the real request/retrieval driver lives only in HH/LH.
