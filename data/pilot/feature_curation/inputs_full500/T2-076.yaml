xbase: I run a small paid newsletter and online course bundle, and my monthly recurring
  revenue has fallen by about a third over the last quarter after two years of steady
  growth. My content cadence is unchanged and existing subscribers who stay seem happy.
  New signups have not collapsed, so this feels like people leaving rather than nobody
  arriving. I want to understand the churn before I make any rushed pricing changes
  ahead of my annual planning. {DS}
focal_diagnostic_feature: The cancellation survey shows the large majority of churned
  subscribers cite that a well-known competitor now offers the same material free,
  and cancellations spiked when that free offering launched.
low_diagnostic_proposition: The revenue decline began the same quarter the user redesigned
  the newsletter's logo and colour palette.
oracle_action: ANSWER
oracle_focus: The churn is driven by a competitor releasing equivalent material for
  free, per the cancellation survey; address the value gap with differentiation, bundling,
  or a free tier, rather than tweaking price or branding blindly.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not attribute the revenue decline to the logo and
  palette redesign. Ask why subscribers are actually cancelling and what the exit-survey
  reasons say.
