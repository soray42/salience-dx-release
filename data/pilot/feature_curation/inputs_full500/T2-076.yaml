causal_audit:
  steelman: 'The strongest case for the rebrand: a jarring redesign can erode trust
    or make a brand feel unstable, nudging

    marginal subscribers to leave. But xbase establishes that retained subscribers
    are happy and signups have not

    collapsed, and the exit surveys overwhelmingly cite a competitor''s free equivalent,
    with churn spiking at that

    launch. A logo and colour-palette change has no mechanism to make people prefer
    a free identical product; the

    decision to cancel is driven by the external free alternative, not by visual branding.
    The coincidence cannot

    explain a churn pattern the survey ties cleanly to the competitor.

