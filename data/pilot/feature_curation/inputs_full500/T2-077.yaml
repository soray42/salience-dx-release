causal_audit:
  steelman: 'A wireless keyboard adapter could theoretically occupy a USB interrupt
    line

    and add marginal CPU load via HID polling, which in theory competes with

    animation frame scheduling on a heavily loaded main thread. Some Bluetooth

    adapters with poor driver implementations have caused system-wide latency

    spikes on Windows. One could argue this warrants at least a sanity check.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: '"The JavaScript bundle has not changed" rules out any
    code-level change introduced at the time of the keyboard swap, constraining the
    cause to the rendering pipeline rather than application logic.'
