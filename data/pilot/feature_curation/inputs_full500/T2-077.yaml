xbase: My web app's animations started stuttering badly about a week ago. I'm seeing
  dropped frames on scroll transitions in Chrome — the DevTools performance tab shows
  the compositor is overloaded. The JavaScript bundle has not changed and the animations
  ran smoothly for months before. {DS}
focal_diagnostic_feature: DevTools layers panel shows 47 elements with will-change
  transform promoted to GPU layers simultaneously, exhausting the compositor layer
  budget and causing frame drops on every scroll.
low_diagnostic_proposition: The animation problems began around the time of a peripheral
  device change on the user's desk.
oracle_action: ANSWER
oracle_focus: Audit and reduce the number of will-change transform elements; remove
  the property from elements that do not need persistent promotion or apply it dynamically
  only during animation.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not treat the keyboard swap as a cause of GPU compositor
  overload; instead ask for DevTools performance profiling output and layer counts
  before diagnosing.
