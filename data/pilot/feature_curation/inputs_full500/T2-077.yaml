distractor_direction:
  label: keyboard swap hardware effect
  description: Investigating whether the switch to a wireless keyboard introduced
    a USB, Bluetooth, or driver conflict that could account for the animation stuttering.
plausible_alternative_directions:
- label: JavaScript main-thread blocking
  description: A script introduced recently or a timer callback running on the main
    thread during scroll could cause jank independently of compositing.
- label: CSS paint cost spike
  description: A style change causing expensive paint operations (e.g., box-shadow
    or filter on many elements) could overwhelm the GPU without a layer-budget issue.
- label: browser extension interference
  description: A recently installed browser extension injecting DOM nodes or running
    content-script timers during scroll could contribute to dropped frames.
