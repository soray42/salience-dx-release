causal_audit:
  steelman: 'French marigolds grown as a border row could theoretically cast partial
    shade

    on the lowest-lying plants at the front edge of the bed, particularly lettuce.

    A gardener might reason that even partial shading slows the leading edge crops

    which in turn crowd the bed differently. Some companion planting practitioners

    also worry about allelopathic root exudates from dense marigold plantings,

    although evidence for this is weak in culinary vegetable contexts.

    '
  steelman_verdict: no_defensible_mechanism
