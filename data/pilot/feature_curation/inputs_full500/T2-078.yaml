distractor_direction:
  label: marigold border shading
  description: Investigating whether a newly planted row of French marigolds along
    the front edge of the bed is partially shading or otherwise harming the vegetable
    crops.
plausible_alternative_directions:
- label: soil nutrient depletion
  description: Several years of vegetable growing without replenishing compost or
    fertiliser could exhaust soil nutrients enough to reduce yields progressively,
    and no recent amendment is mentioned.
- label: watering volume mismatch
  description: If the same volume of watering is applied to a larger or more established
    root system, the actual moisture reaching each plant could have declined, and
    summer temperatures may have increased evaporation.
- label: variety or seed quality change
  description: Even when using the same named variety, a different seed batch or older
    saved seed could produce weaker germination or lower-vigour plants that yield
    less.
