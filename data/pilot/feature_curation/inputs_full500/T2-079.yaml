distractor_direction:
  label: Error-logging SDK regression
  description: Investigating whether the error-logging dependency update introduced
    JavaScript overhead or background activity that causes the scroll jank and elevated
    GPU memory.
plausible_alternative_directions:
- label: Unvirtualised list rendering
  description: A long unvirtualised DOM list could cause layout thrashing and memory
    growth during scroll, independent of compositor layers.
- label: Memory leak in event listeners
  description: Accumulating detached DOM nodes or unremoved event listeners from the
    page lifecycle could grow memory over time without a CSS cause.
- label: Stale service worker cache
  description: A cached outdated asset bundle could be serving an older build with
    a known rendering regression that predates the current deploy.
