distractor_direction:
  label: Gate installation disturbance
  description: Investigating whether the gate installation that weekend disturbed
    the soil, altered conditions near the seeded area, or otherwise contributed to
    poor germination.
plausible_alternative_directions:
- label: Seed depth error
  description: Grass seed broadcast without light raking-in may have sat exposed on
    the surface and been washed away or dried out before germinating, even on a prepared
    bed.
- label: Dormant weed competition
  description: A soil-surface disturbance can trigger weed seed germination that outcompetes
    newly sown grass, suppressing visible grass emergence while appearing as bare
    soil.
- label: Soil pH or fertility barrier
  description: Strongly acidic or alkaline soil conditions — or residual herbicide
    from a previous treatment — could inhibit germination even in correct weather
    with good seed and watering.
