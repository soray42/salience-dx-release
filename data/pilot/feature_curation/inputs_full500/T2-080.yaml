causal_audit:
  steelman: 'A gate installation involves digging post holes, mixing concrete, and
    heavy foot traffic in the immediate area, which could theoretically compact soil
    or introduce foreign material near the gate. If the gate were adjacent to a seeded
    strip, mechanical disturbance during installation could disrupt seed placement
    or surface moisture. However, xbase gives no indication that the gate installation
    was adjacent to the seeded lawn surface, and the failure is described as near-zero
    germination across the entire overseeded area — not a localised edge effect. No
    constructible mechanism links a standalone gate installation to uniform germination
    failure across a whole lawn.

    '
  steelman_verdict: no_defensible_mechanism
