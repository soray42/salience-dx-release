causal_audit:
  steelman: 'Swapping a halogen lamp for an LED model can marginally alter the colour
    temperature

    and brightness of ambient light. On some laptops, a significant ambient-light
    change

    triggers an automatic switch in display colour profile or even refresh-rate mode.

    If Chrome detects a display-mode change mid-session, it may invalidate compositor

    resources and force a re-promotion of layers, transiently affecting GPU tile allocation.

    A very determined practitioner might argue this deserves one check. However, xbase

    already states a coworker on a different machine (with presumably a different
    lamp)

    sees 60 fps, meaning the symptom is local to this machine''s software/hardware
    stack,

    not to ambient conditions. There is no constructible mechanism by which the lamp

    swap itself causes persistent layer-count inflation or GPU memory exhaustion independent

    of the application code.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: Coworker on same codebase reproduces 60 fps on a different
    machine, ruling out ambient-environment causes shared across setups.
unconstructable: false
