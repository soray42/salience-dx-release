seed_id: T2-081
template: T2
domain: technical_troubleshooting
complexity: low
xbase: My web app's hero section animation has been dropping frames and stuttering
  for the past few days. The CSS keyframe animation runs at 60 fps on a coworker's
  machine but hovers around 15 fps on mine. Chrome DevTools shows no unusual CPU usage
  and there are no JavaScript errors in the console. {DS}
focal_diagnostic_feature: The DevTools Layers panel shows 47 simultaneous compositor
  layers on the hero section and the GPU tile memory budget is exhausted.
low_diagnostic_proposition: The animation frame drops began at the same time as a
  desk-lamp hardware swap.
oracle_action: ANSWER
oracle_focus: Reduce compositor layer count on the hero element by auditing will-change
  and transform usage; collapse unnecessary stacking contexts to stay within GPU memory
  limits.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a desk-lamp change to browser rendering
  performance. Ask for DevTools Layers panel output, GPU memory status, and CSS properties
  that create compositor layers.
