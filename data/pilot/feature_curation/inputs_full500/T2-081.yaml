distractor_direction:
  label: desk-lamp hardware change
  description: Investigating whether replacing a halogen desk lamp with an LED model
    caused the browser animation frame drops, perhaps through monitor calibration
    or display-mode side effects.
plausible_alternative_directions:
- label: CSS animation complexity
  description: The keyframe animation itself may be computationally expensive due
    to animated properties that trigger layout or paint rather than composite-only
    transforms.
- label: Browser hardware-acceleration setting
  description: Hardware acceleration may be disabled or misconfigured in Chrome on
    this specific machine, preventing GPU offloading of the animation.
- label: Display refresh-rate mismatch
  description: The monitor on this machine may be running at a different refresh rate
    than the coworker's, causing the animation to miss vsync windows at 15 fps.
