distractor_direction:
  label: decorative ornament placement
  description: Investigating whether the placement of a ceramic garden ornament beside
    the lavender pot caused or triggered the wilting and leaf drop.
plausible_alternative_directions:
- label: seasonal heat stress
  description: High summer temperatures on a sun-exposed patio can cause lavender
    to wilt temporarily; the weekly watering interval may have become insufficient
    during a heat spell.
- label: fungal root disease
  description: Phytophthora or Pythium root rot can affect lavender in containers
    and produce wilting independently of drainage issues; it would require a fungicide
    treatment rather than simple drainage correction.
- label: vine weevil root damage
  description: Vine weevil larvae eating the roots from inside the pot can cause sudden
    wilting in container lavender, and probing would reveal a different pattern of
    root damage than waterlogging.
