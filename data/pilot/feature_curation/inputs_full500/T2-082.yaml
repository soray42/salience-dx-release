xbase: My potted lavender has been wilting and dropping small leaves for about two
  weeks. I water it weekly in a large terracotta pot on my garden patio, and the same
  schedule worked for a year. I have not changed the soil or moved it to a different
  position. {DS}
focal_diagnostic_feature: The drainage hole at the pot base is blocked by a ceramic
  shard, the lower third of the soil is waterlogged, and probed root tissue is brown
  and soft rather than white and firm.
low_diagnostic_proposition: The wilting began at the same time a decorative garden
  ornament was placed near the pot.
oracle_action: ANSWER
oracle_focus: Remove the ceramic shard blocking the drainage hole, prune any soft
  brown roots, and allow the soil to dry fully before resuming watering; consider
  repotting if root damage is extensive.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not attribute lavender wilting to a nearby decorative
  ornament. Ask about drainage, soil moisture at depth, and the condition of visible
  roots before drawing any conclusion.
