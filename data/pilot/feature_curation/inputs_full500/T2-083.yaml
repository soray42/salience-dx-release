seed_id: T2-083
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Our services talk over NATS, and a few subscribers have started missing some
  messages entirely while most messages arrive fine. There is no error surfaced on
  the publisher side, the connection stays up, and reconnect counts are flat. The
  losses are intermittent rather than total, and they do not line up with any obvious
  traffic spike. We did not upgrade the NATS server or change the subscriber code
  recently. {DS}
focal_diagnostic_feature: Every dropped event exceeds the NATS server's configured
  max_payload limit, so the server rejects those oversized messages at publish without
  delivering them, while messages under the limit arrive normally.
low_diagnostic_proposition: The dropped messages began around the time the team migrated
  its internal engineering wiki to a new platform.
oracle_action: ANSWER
oracle_focus: Check message sizes against the server's max_payload setting; the lost
  events exceed the configured limit and are rejected at publish, so raise max_payload
  (and the client limits) or split oversized payloads, rather than chasing a delivery
  or connectivity problem.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a wiki/documentation migration to dropped
  NATS messages. Ask what the dropped messages have in common, in particular their
  size relative to the server's max_payload limit, before treating the migration as
  relevant.
