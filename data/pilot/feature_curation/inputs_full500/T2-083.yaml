causal_audit:
  steelman: 'One could argue that migrating to a new documentation platform might
    have coincided with an infrastructure change

    — a DNS update, a proxy, a firewall rule — that interfered with the message bus.
    But the migration itself is a

    SaaS/content change with no defined effect on NATS, the connection stays up with
    flat reconnects, and the loss is

    determined purely by message size against max_payload, which a documentation migration
    cannot influence. There is

    no mechanism by which the wiki move selectively drops oversized events.

    '
  steelman_verdict: no_defensible_mechanism
