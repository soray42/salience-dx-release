variants:
  HL:
    distractor: It clicked for me that this whole thing began the same week we migrated
      our internal engineering wiki to a brand-new documentation platform; the whole
      team spent two days re-importing runbooks, and right afterward people started
      complaining about the dropped events.
    diagnosticity: low
