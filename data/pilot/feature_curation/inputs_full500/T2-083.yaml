    distractor: Measuring the lost events, every one exceeds roughly one megabyte,
      which is exactly the server's configured max_payload limit; NATS rejects oversized
      messages at publish without delivering them, so the larger payloads vanish while
      everything under the limit arrives normally.
    diagnosticity: high
    salience: high
    proposition: Every dropped event exceeds the NATS server's configured max_payload
      limit, so the server rejects those oversized messages at publish without delivering
      them, while messages under the limit arrive normally.
    salience_source: The exact size threshold matching max_payload, plus the publish-time
      rejection rule, makes the size-based loss concrete and self-evident.
