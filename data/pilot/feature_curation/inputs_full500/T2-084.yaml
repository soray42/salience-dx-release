distractor_direction:
  label: Phone mount coincidence
  description: Investigating whether the recently installed handlebar phone mount
    caused or contributed to the chain skipping by altering rider position or vibration.
plausible_alternative_directions:
- label: Rear derailleur adjustment
  description: Cable tension or limit-screw drift could cause the chain to skip between
    cogs under load on the small sprockets.
- label: Chainring wear
  description: A worn or bent front chainring could cause skipping that manifests
    most under hard pedalling regardless of cassette condition.
- label: Rear wheel alignment
  description: A wheel that has shifted in the dropout could misalign the drivetrain
    enough to cause skipping under load.
