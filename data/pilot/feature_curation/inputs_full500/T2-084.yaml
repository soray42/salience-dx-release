xbase: My road bike has started skipping under load on the two hardest climbs of my
  usual route. The chain and cassette are both about eighteen months old, and I ride
  around 200 km per week. The skip only happens when I push hard, not when spinning
  easily, and it feels worst in the smallest three rear cogs. {DS}
focal_diagnostic_feature: A chain-wear gauge reads 0.75% stretch at the replacement
  threshold, and the smallest three cassette cogs have visibly sharked teeth with
  hooked, asymmetric profiles, confirming worn drivetrain components as the cause
  of the skipping.
low_diagnostic_proposition: The skipping began around the time a new handlebar phone
  mount was installed.
oracle_action: ANSWER
oracle_focus: Replace the chain and matching cassette; both are at or past service
  limits and the cog wear confirms the skip is drivetrain wear rather than a fit or
  adjustment issue.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a handlebar phone mount to chain skipping
  under load. Ask for chain wear measurement and a visual inspection of the cassette
  cogs before recommending any action.
