distractor_direction:
  label: Facilities work coincidence
  description: Treating the simultaneous office name-plaque installation as a trigger
    for the RabbitMQ consumer failure because the timing of both events is identical.
plausible_alternative_directions:
- label: Consumer configuration error
  description: A misconfigured queue name, binding key, or credentials could prevent
    the consumer from attaching to the correct queue even if it appears to run.
- label: Message format change
  description: A change in the message schema or encoding three days ago could be
    causing the consumer to reject messages before acknowledging them, causing apparent
    non-consumption.
