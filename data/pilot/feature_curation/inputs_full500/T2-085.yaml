causal_audit:
  steelman: 'A facilities team installing wall fixtures might accidentally bump or
    reboot

    network equipment in adjacent areas, causing a brief power event that could

    terminate a running process. However, xbase explicitly states the server room

    and network cabinet were not accessed during the period, eliminating this

    physical-access pathway. Hanging name plaques on office walls has no electrical

    or network effect on application servers. There is no constructible mechanism
    by

    which signage installation affects a RabbitMQ consumer process.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states "the server room and network cabinet were
    not accessed during the period," closing the one plausible steelman path (facilities
    staff accidentally triggering a hardware event).
