seed_id: T2-085
template: T2
domain: technical_troubleshooting
complexity: low
xbase: Our order-confirmation emails have stopped being sent for the last three days.
  The emails are triggered by a RabbitMQ consumer that watches a confirmation queue.
  The queue is filling up steadily, but no messages are being consumed. The broker
  is running and other queues bound to different consumers are draining normally.
  The server room and network cabinet were not accessed during the period. {DS}
focal_diagnostic_feature: The consumer process has no running instance — the PID file
  on disk is three days old and the process is completely absent from the server process
  list, with no supervisor or restart policy configured.
low_diagnostic_proposition: The issue started the same morning the office facilities
  team installed new meeting-room name plaques.
oracle_action: ANSWER
oracle_focus: Restart the consumer process and configure a supervisor or process manager
  to restart it automatically on crash; also investigate why it crashed three days
  ago.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect office signage work to RabbitMQ consumer
  state. Ask whether the consumer process is actually running before investigating
  any other cause.
