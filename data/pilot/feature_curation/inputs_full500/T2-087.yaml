causal_audit:
  steelman: 'A Slack alerting integration might post to a shared alerting library
    that is imported by multiple services including the consumer. If the Slack HTTP
    client added as a transitive dependency had a blocking initialisation or locked
    a shared thread resource, it could theoretically affect the consumer''s executor.
    However, this is a deployment-time side effect that would have affected all partitions
    equally and would have been visible at startup; the fact that only partition 3
    lags while 1 and 2 are fine makes any cross-partition shared-resource explanation
    implausible. A Slack webhook posting to an external URL has no architectural path
    into the Kafka poll loop.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — xbase notes no deployment changed the consumer code
    this week, closing the transitive-dependency route; the Slack integration is a
    pure observability addition on a separate path
