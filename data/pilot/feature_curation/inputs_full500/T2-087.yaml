    salience_source: 'B: exact offset number, named exception type, causal chain stated
      precisely; C: declarative factual findings'
  LH:
    distractor: Partition 3 consumer logs show a deserialization exception looping
      on offset 1,047,822 with no dead-letter routing configured.
    diagnosticity: high
