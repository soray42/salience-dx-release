seed_id: T2-087
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: Our Kafka consumer group for the order-events topic has had a growing lag on
  partition 3 for the past three days. The consumer service is running and healthy,
  but partition 3 lag climbs steadily while partitions 1 and 2 stay near zero. No
  deployment has touched the consumer code this week. {DS}
focal_diagnostic_feature: Consumer logs for partition 3 show a deserialization exception
  looping on the same offset repeatedly, with no dead-letter or skip configuration,
  so the consumer never advances past that record.
low_diagnostic_proposition: The partition lag increase appeared around the time the
  team activated a new Slack alerting integration.
oracle_action: ANSWER
oracle_focus: Configure a dead-letter queue or skip policy for the poison-pill record
  at the stuck offset on partition 3; the consumer is retrying a malformed message
  indefinitely and will not self-recover.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect the Slack integration to Kafka consumer
  lag. Ask for consumer logs on partition 3, the stuck offset, and whether an error
  handler is configured.
