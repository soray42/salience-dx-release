      the consumer pipeline.
    diagnosticity: low
    salience: high
    proposition: The partition lag increase appeared around the time the team activated
      a new Slack alerting integration.
    salience_source: 'B: precise temporal anchor (same afternoon) with professional
      internal team context; C: ''the team is investigating'' frames it as an active
      live hypothesis under examination'
    why_plausible: Ops tooling changes coinciding with system symptoms can reasonably
      prompt investigation; a Slack webhook adding latency to an alerting path could
      superficially suggest side effects.
    why_irrelevant: A Slack alerting webhook operates on a completely separate data
      path from the Kafka consumer group; it has no mechanism to stall partition consumption
      or cause lag on a specific partition.
  LL:
    distractor: The partition lag increase appeared around the time the team activated
