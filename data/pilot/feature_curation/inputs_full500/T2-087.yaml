distractor_direction:
  label: Slack alerting integration interference
  description: Investigating whether the newly activated Slack webhook or alerting
    integration is interfering with the Kafka consumer pipeline and causing partition
    lag.
plausible_alternative_directions:
- label: Partition reassignment imbalance
  description: A consumer group rebalance could leave partition 3 assigned to a slower
    or resource-constrained consumer instance
  causing lag to grow independently on that partition.: null
- label: Downstream write bottleneck
  description: If the consumer writes to a downstream database and that write path
    is slow or erroring for records in partition 3
  processing may stall without an obvious consumer exception in simple health checks.: null
- label: Broker-side partition leadership change
  description: A recent broker leader election for partition 3 could introduce temporary
    fetch latency or uncommitted offsets that appear as growing lag.
