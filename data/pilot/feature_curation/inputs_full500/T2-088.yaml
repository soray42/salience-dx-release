distractor_direction:
  label: Auto-show impulse bias
  description: Investigating whether the buyer's decision-making is distorted by excitement
    from attending an auto show just before finding and pursuing this listing.
plausible_alternative_directions:
- label: Service-history verification
  description: Checking whether the seller's maintenance claims hold up against verifiable
    records, given no documentation has been produced yet.
- label: Market pricing accuracy
  description: Assessing whether the listed price is genuinely below market or merely
    appears so without accounting for regional variation or recent comp sales.
- label: Title and lien status
  description: Confirming the vehicle has a clean title with no outstanding loans
    or salvage history before the inspection findings even become relevant.
