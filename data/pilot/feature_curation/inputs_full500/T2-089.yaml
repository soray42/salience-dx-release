causal_audit:
  steelman: 'To steelman the espresso-machine timing as causal, I would need a path
    from a kitchen appliance to CDN cache

    behaviour or client flag delivery. An espresso machine draws power and makes noise;
    it touches neither the

    origin''s Cache-Control headers, the CDN''s caching of the flag JSON, nor the
    clients'' fetch logic. There is no

    network, configuration, or deployment coupling between installing a kitchen appliance
    and how long a CDN holds a

    cached document. The coincidence is pure temporal correlation with no constructible
    mechanism for the symptom,

    which is governed entirely by the flag JSON''s cache lifetime.

    '
  steelman_verdict: no_defensible_mechanism
