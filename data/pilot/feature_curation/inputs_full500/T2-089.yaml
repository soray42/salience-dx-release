plausible_alternative_directions:
- label: Client-side polling interval
  description: Whether clients only re-fetch the flag document on a long polling interval
  delaying visibility of changes.: null
- label: Stale write replication
  description: Whether the flag store's writes take time to replicate before the new
    value is readable by edge fetches.
