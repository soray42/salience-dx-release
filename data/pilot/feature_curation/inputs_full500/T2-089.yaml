variants:
  HL:
    distractor: I keep coming back to the fact that this whole lag started the same
      week the office finally installed that big new espresso machine in the kitchen;
      the timing is almost too neat.
    diagnosticity: low
    salience: high
    proposition: The delayed flag propagation began the same week the office installed
      a new espresso machine in the kitchen.
    salience_source: B/C — a confident first-person 'almost too neat' framing with
      a vivid kitchen scene makes the coincidence feel like a lead.
    why_plausible: Humans anchor hard on 'it started exactly when X changed', and
      the espresso-machine timing is memorable and specific.
    why_irrelevant: A kitchen espresso machine has no path to how a CDN caches and
      delivers flag JSON to clients; it cannot affect cache TTL or propagation.
  LL:
    distractor: The delayed flag propagation began the same week a new espresso machine
      was installed in the office kitchen.
    diagnosticity: low
    salience: low
    proposition: The delayed flag propagation began the same week the office installed
      a new espresso machine in the kitchen.
    matched_to: HL
  HH:
    distractor: 'Checking the response headers, the origin sends Cache-Control: max-age=86400
      on the flag JSON, so the CDN holds the previous flag document for up to a full
      day before it expires; that exactly matches the most-of-a-day delay before flips
      appear.'
    diagnosticity: high
    salience: high
    proposition: The origin sends Cache-Control max-age=86400 on the flag JSON, so
      the CDN serves the previous flag document from cache for up to a day before
      it expires and refetches.
    salience_source: Quoting the 86400-second max-age and matching it to the day-long
      delay makes the cache cause concrete and decisive.
  LH:
    distractor: The flag JSON carries Cache-Control max-age=86400, so the CDN serves
      the old flag document for up to a day before refetching.
    diagnosticity: high
    salience: low
    proposition: The origin sends Cache-Control max-age=86400 on the flag JSON, so
      the CDN serves the previous flag document from cache for up to a day before
      it expires and refetches.
    matched_to: HH
distractor_direction:
