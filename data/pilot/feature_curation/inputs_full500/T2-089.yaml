seed_id: T2-089
template: T2
domain: technical_troubleshooting
complexity: low
xbase: When I flip a feature flag in our admin panel, most users do not see the change
  for a long time, sometimes most of a day, even though the change is saved correctly
  server-side. Eventually everyone catches up without me doing anything. The flag
  service itself reports the new value immediately when I query it. The flag values
  are delivered to clients as a small JSON document through our CDN. {DS}
focal_diagnostic_feature: The origin sends Cache-Control max-age=86400 on the flag
  JSON, so the CDN serves the previous flag document from cache for up to a day before
  it expires and refetches.
low_diagnostic_proposition: The delayed flag propagation began the same week the office
  installed a new espresso machine in the kitchen.
oracle_action: ANSWER
oracle_focus: Lower the Cache-Control max-age on the flag JSON (or purge/version it
  on change) so the CDN stops serving a day-old cached flag document and clients pick
  up flips promptly.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a kitchen appliance to flag propagation.
  Ask how long the CDN caches the flag JSON and what Cache-Control the origin sends
  on it.
