variants:
  HL:
    distractor: The higher quote landed the very same month I switched our household
      to a new electricity supplier, and the timing lines up uncomfortably well —
      it feels like everything shifted at once when I rearranged those accounts.
    diagnosticity: low
    salience: high
    proposition: The premium increase appeared the same month the user switched their
      household electricity supplier.
    salience_source: B/C — a confident first-person 'the timing lines up uncomfortably
      well' narrative ties the premium to the same month's account change.
    why_plausible: People intuitively group simultaneous bill changes into one story,
      so a same-month supplier switch feels causally linked.
    why_irrelevant: A household electricity-supplier switch shares no data, rating
      input, or channel with car-insurance pricing; it cannot move the car premium.
  LL:
    distractor: The premium increase appeared the same month the user switched their
      household electricity supplier.
    diagnosticity: low
    salience: low
    proposition: The premium increase appeared the same month the user switched their
      household electricity supplier.
    matched_to: HL
  HH:
    distractor: Reading the rating summary on the renewal letter, it says the insurer
      applied a flat base-rate increase this year to every customer in my region,
      stated plainly as a book-wide adjustment that has nothing to do with my individual
      record or claims history.
    diagnosticity: high
    salience: high
    proposition: The renewal letter states the insurer applied a flat across-the-book
      base-rate increase this year for all customers in the user's region, independent
      of any individual driving record.
    salience_source: Quoting the letter's own statement of a region-wide base-rate
      adjustment makes the true driver concrete and decisive.
  LH:
    distractor: The renewal letter states the insurer applied a flat base-rate increase
      this year to all customers in the region, independent of the user's record.
    diagnosticity: high
    salience: low
    proposition: The renewal letter states the insurer applied a flat across-the-book
      base-rate increase this year for all customers in the user's region, independent
      of any individual driving record.
    matched_to: HH
