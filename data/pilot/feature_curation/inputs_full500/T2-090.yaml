seed_id: T2-090
template: T2
domain: open_qa
complexity: medium
xbase: My car insurance renewal quote came in about 40% higher than last year, and
  I want to figure out why before I decide whether to accept it or shop around. I
  have not had any accidents, claims, or tickets this year, and I have not moved or
  changed my car. I am the only driver on the policy and my mileage is about the same.
  The renewal letter itself lists the new premium and a short summary of the rating.
  {DS}
focal_diagnostic_feature: The renewal letter states the insurer applied a flat across-the-book
  base-rate increase this year for all customers in the user's region, independent
  of any individual driving record.
low_diagnostic_proposition: The premium increase appeared the same month the user
  switched their household electricity supplier.
oracle_action: ANSWER
oracle_focus: The increase is a market-wide base-rate rise the insurer applied to
  everyone in the region, not something the user triggered; treat it as a reason to
  compare other insurers' quotes, not to look for a personal mistake to undo.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect an electricity-supplier switch to the
  car premium. Ask what the renewal letter says drove the rating change before attributing
  it to anything the user did.
