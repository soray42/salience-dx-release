  notes: 'xbase rules out the individual-record levers the user can see (no accidents/claims/tickets,
    no move, no car

    change, same mileage) and notes the renewal letter carries a rating summary —
    but never reveals what that

    summary says, so HL/LL cannot resolve the cause; the decisive base-rate statement
    lives only in HH/LH. The

    ''only driver'' detail is context, not the focal feature. HL''s only added material
    is the user''s own supplier

    switch framing; LL keeps the bare same-month coincidence.

    '
causal_audit:
  steelman: 'To steelman the electricity-supplier switch as causal, I would need a
    channel by which changing a household

    energy provider influences car-insurance pricing. Insurance premiums are rated
    on driver, vehicle, location,

    claims history, and the insurer''s base rates; none of these read from a customer''s
    choice of electricity

    supplier, and the two services share no data feed, bureau, or scoring input. There
    is no soft-credit, address,

    or risk-signal coupling that a supplier switch would trip for motor cover. The
    timing is coincidental with no

    constructible mechanism; the true driver is the insurer''s book-wide base-rate
    increase.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states no accidents, claims, tickets, move, car change,
    or mileage change, foreclosing the individual-record pathways; the book-wide base-rate
    increase that explains the rise lives only in HH/LH.
