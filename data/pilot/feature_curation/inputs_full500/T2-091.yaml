seed_id: T2-091
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: A new product image we uploaded keeps showing as a broken image for most visitors,
  even though it has been live on origin for two days. The file is present in origin
  storage and loads correctly when I open its URL with a cache-bypassing query parameter.
  Other images on the same page render fine. We serve all images through our CDN,
  and only this one specific asset is affected. Nothing in the deploy or the storage
  looks wrong now. {DS}
focal_diagnostic_feature: The CDN negatively cached the 404 from the brief window
  before the file finished uploading, and its negative-caching TTL holds that 404
  at the edge so it keeps serving not-found despite the file now existing.
low_diagnostic_proposition: The broken image started appearing the same week the team
  migrated to a new group-chat workspace.
oracle_action: ANSWER
oracle_focus: Purge or invalidate that asset's path at the CDN so the cached 404 is
  evicted; the edge negatively cached the not-found from before the upload completed
  and is still serving it, so a fresh origin fetch will resolve it.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a chat-workspace migration to a broken
  image. Ask whether the CDN negatively cached a 404 for this asset and what its negative-cache
  TTL is.
