causal_audit:
  steelman: 'To steelman the chat-migration timing as causal, I would need a path
    from switching group-chat tools to a single

    image returning 404 through the CDN. A chat workspace migration changes where
    the team communicates; it does not

    touch origin object storage, the asset''s URL, deploy artifacts, or the CDN''s
    edge caches. No webhook, build step,

    or asset-publishing flow in this description is wired through the chat tool. There
    is no constructible mechanism

    by which the migration could cause or inform a stale cached 404 on one asset;
    the cause is the CDN''s negative

    caching of the pre-upload not-found.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase confirms the file is present on origin and loads
    with a cache-bypass parameter, foreclosing the 'file actually missing' pathway;
    the cached-404 negative-caching mechanism still lives only in HH/LH.
