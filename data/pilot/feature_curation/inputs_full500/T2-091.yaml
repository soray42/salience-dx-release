variants:
  HL:
    distractor: This broken image showed up the same week we moved the whole team
      onto a new group-chat workspace; I keep circling back to that week because the
      migration dominated everything we were doing.
    diagnosticity: low
    salience: high
    proposition: The broken image started appearing the same week the team migrated
      to a new group-chat workspace.
    salience_source: B/C — confident first-person 'I keep circling back' framing ties
      the bug to the memorable chat-migration week.
    why_plausible: A disruptive team-tooling change is a salient landmark, so it is
      tempting to pin a same-week glitch on it.
    why_irrelevant: A group-chat workspace migration touches none of the origin storage,
      the asset's URL, or the CDN's edge caching; it cannot make one image 404.
  LL:
    distractor: The broken image started appearing the same week the team migrated
      to a new group-chat workspace.
    diagnosticity: low
    salience: low
    proposition: The broken image started appearing the same week the team migrated
      to a new group-chat workspace.
    matched_to: HL
  HH:
    distractor: 'The edge is returning a cached 404 for this asset: it was requested
      in the brief gap before the upload finished, the CDN negatively cached that
      not-found, and its negative-cache TTL is still holding that 404 at the edge
      even though origin now has the file.'
    diagnosticity: high
    salience: high
    proposition: The CDN negatively cached the 404 from the brief window before the
      file finished uploading, and its negative-caching TTL holds that 404 at the
      edge so it keeps serving not-found despite the file now existing.
    salience_source: Naming the cached 404, the pre-upload request window, and the
      negative-cache TTL makes the stale-not-found mechanism concrete and decisive.
  LH:
    distractor: The CDN negatively cached the 404 from before the upload finished,
      and its negative-cache TTL keeps serving that not-found at the edge.
    diagnosticity: high
    salience: low
    proposition: The CDN negatively cached the 404 from the brief window before the
      file finished uploading, and its negative-caching TTL holds that 404 at the
      edge so it keeps serving not-found despite the file now existing.
    matched_to: HH
distractor_direction:
  label: Chat-migration timing
  description: Treating the same-week migration to a new group-chat workspace as connected
    to the single broken image.
plausible_alternative_directions:
- label: Wrong content-type
  description: Whether the asset is stored or served with an incorrect content-type
    so browsers refuse to render it.
- label: Path or case mismatch
  description: Whether the live URL references a slightly different path or filename
    casing than the stored object.
