seed_id: T2-092
template: T2
domain: open_qa
complexity: high
xbase: My home contents insurer denied most of my claim for a stolen €1,900 laptop,
  paying only a few hundred euros, and I am deciding whether to formally appeal the
  decision as a processing error or just accept it. The theft was reported to police
  and the insurer accepts the laptop was stolen. I filed everything on time with receipts.
  I have the full policy schedule and the wording in front of me but have not gone
  through the limits section yet. {DS}
focal_diagnostic_feature: The policy schedule sets a €400 single-article limit for
  any unspecified item, and the laptop was never added as a specified item, so the
  partial payout is the correct contractual outcome rather than a processing error.
low_diagnostic_proposition: The claim denial arrived right after the user installed
  an update to the insurer's mobile app.
oracle_action: ANSWER
oracle_focus: Do not appeal it as a processing error; the partial payout reflects
  the policy's single-article limit for unspecified items, so the realistic path is
  to confirm that sub-limit and, going forward, schedule high-value items individually.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a mobile-app update to the claim outcome.
  Ask what single-item and unspecified-item limits the policy schedule sets before
  treating the payout as an error.
