variants:
  HL:
    distractor: The denial email landed the very evening I updated the insurer's mobile
      app on my phone — almost to the hour — and I have wondered ever since whether
      the new app version pushed my claim through some broken flow.
    diagnosticity: low
    salience: high
    proposition: The claim denial arrived right after the user installed an update
      to the insurer's mobile app.
    salience_source: B/C — a confident first-person 'almost to the hour' framing ties
      the denial to the app update.
    why_plausible: Software updates do sometimes break flows, so a denial landing
      right after an app update invites a processing-error suspicion.
    why_irrelevant: A consumer app version controls how the user views information,
      not the underwriting decision; it cannot change the policy limit that drove
      the partial payout.
  LL:
    distractor: The claim denial arrived right after the user installed an update
      to the insurer's mobile app.
    diagnosticity: low
    salience: low
    proposition: The claim denial arrived right after the user installed an update
      to the insurer's mobile app.
    matched_to: HL
  HH:
    distractor: Going through the limits section, the schedule caps any single unspecified
      article at €400, and I never added the laptop as a specified item, so the few-hundred-euro
      payout is exactly the policy applying its single-article limit — not a glitch
      or a mistake in how the claim was handled.
    diagnosticity: high
    salience: high
    proposition: The policy schedule sets a €400 single-article limit for any unspecified
      item, and the laptop was never added as a specified item, so the partial payout
      is the correct contractual outcome rather than a processing error.
    salience_source: Pairing the €400 single-article limit with the unscheduled laptop
      makes the correct, non-error payout concrete and decisive.
  LH:
    distractor: The schedule caps any single unspecified article at €400 and the laptop
      was never specified, so the partial payout is correct, not an error.
    diagnosticity: high
    salience: low
    proposition: The policy schedule sets a €400 single-article limit for any unspecified
