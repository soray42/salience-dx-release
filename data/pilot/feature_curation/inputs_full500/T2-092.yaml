causal_audit:
  steelman: 'To steelman the app-update timing as causal, I would need a path from
    updating a consumer-facing insurance app

    to a wrongful claim decision. The app is a viewing-and-submission client; the
    underwriting and claims

    adjudication that set the payout run server-side against the policy schedule,
    not in the phone app''s version. A

    new app build does not rewrite policy limits or re-adjudicate a claim, and nothing
    here ties the update to the

    claims pipeline. The denial amount is fully explained by the €400 single-article
    limit on an unspecified item,

    so the update timing is coincidental with no constructible mechanism for the outcome.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the theft is accepted and filing was timely
    with receipts, foreclosing the 'denied for procedure/proof' pathways as the cause
    of the cap; the single-article limit that explains the partial payout lives only
    in HH/LH.
