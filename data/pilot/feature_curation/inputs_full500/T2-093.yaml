seed_id: T2-093
template: T2
domain: technical_troubleshooting
complexity: low
xbase: Our web app shows users their account balance, and several users report it
  is stuck on an old value for them while the real balance has clearly changed. Closing
  and reopening the tab does not help, but using a private/incognito window shows
  the correct, current balance every time. The backend API returns the right number
  when I call it directly, and the affected users are spread across different browsers
  and devices. {DS}
focal_diagnostic_feature: The app's service worker is registered with a cache-first
  strategy for the balance API route, so it serves the previously cached response
  from local storage and never revalidates against the network.
low_diagnostic_proposition: The stale-balance reports began the same week the company
  rolled out a new desktop wallpaper and logo across employee machines.
oracle_action: ANSWER
oracle_focus: Change the service worker to use network-first (or stale-while-revalidate)
  for the balance API and ship a worker update that clears the stale cached responses,
  so clients fetch the current balance instead of the cached one.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a wallpaper-and-logo rollout to stale
  balances. Ask whether a service worker is caching the balance API response and with
  what strategy.
