    distractor: I cannot shake the feeling that this all kicked off the same week
      IT pushed that new corporate wallpaper and refreshed logo onto everyone's machines;
      the rollout was a whole event, screens changing across the office, and the stale-balance
      complaints seemed to start in that exact stretch.
    diagnosticity: low
    salience: high
    proposition: The stale-balance reports began the same week the company rolled
      out a new desktop wallpaper and logo across employee machines.
    salience_source: B/C — a confident first-person 'cannot shake the feeling' framing
      anchors the bug to the memorable branding rollout week.
    why_plausible: A visible, company-wide machine change is a salient landmark, so
      a same-week bug feels naturally tied to it.
    why_irrelevant: A desktop wallpaper and logo rollout changes the visual shell
      of machines, not browser service-worker caching of an API response; it cannot
      freeze a balance.
  LL:
    distractor: The stale-balance reports began the same week the company rolled out
      a new desktop wallpaper and logo.
    diagnosticity: low
    salience: low
    proposition: The stale-balance reports began the same week the company rolled
      out a new desktop wallpaper and logo across employee machines.
    matched_to: HL
  HH:
    distractor: The app's service worker is registered cache-first for the balance
      API route, so it answers from the locally cached response and never goes back
      to the network; that is why a normal tab stays frozen while an incognito window,
      which has no service worker cache, always shows the live number.
    diagnosticity: high
    salience: high
    proposition: The app's service worker is registered with a cache-first strategy
      for the balance API route, so it serves the previously cached response from
      local storage and never revalidates against the network.
    salience_source: Naming the cache-first service worker and explaining the incognito
      contrast makes the local-cache mechanism concrete and decisive.
  LH:
    distractor: The service worker is cache-first for the balance API, serving the
      cached response without revalidating; incognito, lacking the cache, shows the
      live number.
    diagnosticity: high
    salience: low
    proposition: The app's service worker is registered with a cache-first strategy
      for the balance API route, so it serves the previously cached response from
      local storage and never revalidates against the network.
    matched_to: HH
