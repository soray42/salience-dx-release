causal_audit:
  steelman: 'To steelman the branding rollout as causal, I would need a path from
    pushing new wallpaper and a logo to browser

    service-worker caching of an API response. The rollout changes desktop background
    images and brand assets on

    machines; it does not register, configure, or alter a web app''s service worker,
    its caching strategy, or the

    browser cache storage. There is no deployment coupling between an OS-level wallpaper
    push and the app''s

    client-side caching behaviour. The stale balance is fully explained by the cache-first
    service worker, so the

    rollout timing is coincidental with no constructible mechanism.

    '
