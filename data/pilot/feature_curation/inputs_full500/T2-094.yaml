xbase: My washing machine's motor failed at 13 months old, and the retailer told me
  the one-year manufacturer guarantee has expired, so they will not repair it for
  free. I am deciding whether to just pay for the repair myself or push back on the
  retailer. The machine was used normally in a household of two and has had no abuse
  or DIY tampering. I bought it new from a major retailer and still have the receipt
  and the order confirmation email. {DS}
focal_diagnostic_feature: Statutory consumer-protection law lets the buyer hold the
  seller liable for an inherent fault well beyond the 12-month commercial guarantee,
  so the user has a valid basis to require a free repair from the retailer.
low_diagnostic_proposition: The washing machine failed the same weekend the household
  repainted the utility room where it sits.
oracle_action: ANSWER
oracle_focus: Push back on the retailer citing statutory consumer rights, which make
  the seller liable for an inherent fault beyond the 12-month guarantee; do not pay
  out of pocket on the assumption that the expired guarantee ends your remedies.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect repainting the room to the motor failure.
  Ask what statutory rights against the seller apply beyond the manufacturer's 12-month
  guarantee before deciding to pay.
