  notes: 'LL carries only the started-around-wallpaper-change claim; the wallpaper''s
    image and the first-evening detail

    are HL-only colour about the change itself. xbase reports symptoms (doubling,
    cross-app, survives reboot,

    intermittent) and withholds the per-key localisation and tester result, so HL/LL
