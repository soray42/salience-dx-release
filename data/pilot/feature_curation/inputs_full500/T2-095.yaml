variants:
  HL:
    distractor: I should mention this all began the same day I finally changed my
      desktop wallpaper from the default to a dark photo of a mountain range; the
      very first evening with the new background, the double letters showed up.
    diagnosticity: low
    salience: high
    proposition: The double-typing started around the time the desktop wallpaper was
      changed.
    salience_source: B/C — vivid first-person dated chronology pinning the symptom's
      onset to the wallpaper change.
    why_plausible: Onset coinciding with a deliberate change invites treating that
      change as the trigger, especially since both touch the computer.
    why_irrelevant: A static wallpaper image is purely cosmetic and never reaches
      keystroke processing, so it cannot make a physical switch register twice.
  LL:
    distractor: The double-typing started around the time the desktop wallpaper image
      was changed to a new one.
    diagnosticity: low
    salience: low
    proposition: The double-typing started around the time the desktop wallpaper was
      changed.
    matched_to: HL
  HH:
    distractor: The double-registration is concentrated on my most-used keys, E, the
      spacebar, and the left Shift, and a key-tester utility shows each of those producing
      two rapid press events from one physical keystroke.
    diagnosticity: high
    salience: high
    proposition: The doubling is confined to the most-used keys, which a key tester
      shows emit two press events per single keystroke.
    salience_source: Concrete localisation to the highest-wear keys plus the key-tester
      showing duplicate press events pins it to switch chatter.
  LH:
    distractor: The doubling is confined to the most-used keys, which a key tester
      shows emit two press events per single keystroke.
    diagnosticity: high
    salience: low
    proposition: The doubling is confined to the most-used keys, which a key tester
      shows emit two press events per single keystroke.
    matched_to: HH
distractor_direction:
  label: Wallpaper change
  description: Treating the desktop wallpaper change as the trigger for the double-typing
    because the symptom began around then.
plausible_alternative_directions:
- label: Keyboard firmware or debounce
  description: Whether a firmware/debounce setting or corrupted config is producing
    repeats across all keys.
- label: USB or cable fault
  description: Whether a flaky cable or port is causing spurious repeated input events.
