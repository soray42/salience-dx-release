    The decisive most-used-keys-plus-tester evidence lives only in HH/LH.

    '
causal_audit:
  steelman: 'One could try to argue a wallpaper change implies other concurrent system
    activity, such as a settings sync or

    background process, that might interfere with input. But that stretches far beyond
    the stated event: setting a

    static desktop image is a display-layer cosmetic change that never touches the
    keyboard input path, introduces

    no driver or interrupt behaviour, and cannot cause a single physical key press
    to be registered twice. There is

    no constructible mechanism by which the wallpaper bears on key chatter, and the
    focal evidence localises the

    fault to worn switches on specific high-use keys.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the coincidence has no mechanism to close; xbase
    simply withholds the per-key tester evidence so it lives only in HH/LH.
unconstructable: false
