seed_id: T2-095
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: 'My mechanical keyboard has started double-typing on some keys: I press once
  and get two characters, or a letter repeats on its own mid-word. It is a wired board
  I have used daily for about three years, and it happens across different applications
  and after a reboot. The doubling is intermittent but frequent enough that I am constantly
  going back to fix words. {DS}'
focal_diagnostic_feature: The doubling is confined to the most-used keys, which a
  key tester shows emit two press events per single keystroke.
low_diagnostic_proposition: The double-typing started around the time the desktop
  wallpaper was changed.
oracle_action: ANSWER
oracle_focus: Treat this as switch contact bounce (chatter) on the worn high-use keys;
  the per-key tester result localises it to those switches, so clean, hot-swap, or
  resolder the affected switches rather than chasing software settings.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a wallpaper change to key chatter; it
  has no mechanism. Ask which keys double, whether a key tester shows duplicate press
  events, and how old the switches are.
cell_oracles:
  HL:
    action: ASK
    focus: Do not connect a wallpaper change to key chatter; it has no mechanism.
      Ask which keys double, whether a key tester shows duplicate press events, and
      how old the switches are.
  LL:
