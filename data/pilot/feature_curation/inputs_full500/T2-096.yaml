xbase: My sewing machine has started skipping stitches badly on a quilting project.
  The thread forms loops on the underside and whole runs of stitches simply do not
  catch, no matter how slowly I sew. I have rethreaded it carefully several times,
  checked that the bobbin is seated, and the tension dial is where it always is. It
  worked fine on the same fabric last month. {DS}
