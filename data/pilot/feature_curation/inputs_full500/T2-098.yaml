domain: open_qa
complexity: medium
xbase: My fountain pen, which I use for journaling every evening, has started skipping
  and drying out mid-line. The ink flow stutters, lines come out pale and broken,
  and sometimes it stops writing entirely until I scribble to coax it back. It is
  a pen I have used reliably for two years, the nib looks undamaged, and I clean it
  regularly. The paper is the same notebook I always use. {DS}
focal_diagnostic_feature: The pen was recently filled with a thick, pigment-heavy
  ink known to clog feeds and starve nib flow.
low_diagnostic_proposition: The skipping began around the time the desk lamp was replaced.
oracle_action: ANSWER
oracle_focus: Treat this as an ink-flow problem from the new pigment-heavy ink; flush
  the pen thoroughly and switch to a free-flowing, well-behaved ink, since a thick
  clog-prone ink starves the feed and produces exactly this skipping.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a desk-lamp change to ink flow; it has
  no mechanism. Ask what ink is currently loaded and whether it was recently changed
  before diagnosing the pen.
