  notes: 'LL carries only the started-around-dark-mode-switch claim; the accent-colour
    detail is HL-only colour about the

    appearance change. xbase reports symptoms (minutes to hours, data not grown, machine
    otherwise fast) and

    withholds the destination fullness, so HL/LL cannot reject the coincidence. The
