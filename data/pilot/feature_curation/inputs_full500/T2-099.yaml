seed_id: T2-099
template: T2
domain: technical_troubleshooting
complexity: medium
xbase: My nightly backups on my Mac have slowed from finishing in minutes to taking
  many hours, sometimes still running when I sit down in the morning. It backs up
  to an external drive over USB, the data set has not grown much, and nothing about
  what I back up has changed. The machine is otherwise fast and responsive during
  the day. This has been getting worse for about two weeks. {DS}
focal_diagnostic_feature: The backup volume is 98% full, so each run spends most of
  its time deleting old backups before writing.
low_diagnostic_proposition: The slowdown began around the time the system was switched
  to dark mode.
oracle_action: ANSWER
oracle_focus: Treat this as a nearly full backup destination; free space on or enlarge
  the backup drive, or prune old snapshots, since at 98% full each run thrashes deleting
  old backups to make room instead of writing into free space.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not connect a dark-mode switch to backup duration;
  it has no mechanism. Ask how full the backup destination is and whether each run
  is spending its time pruning before writing.
