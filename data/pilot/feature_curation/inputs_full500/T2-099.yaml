variants:
  HL:
    distractor: I will admit the slowdown seems to line up with when I switched the
      whole system over to dark mode and changed my accent colour, which I did right
      around when the backups started dragging.
    diagnosticity: low
    salience: high
    proposition: The slowdown began around the time the system was switched to dark
      mode.
    salience_source: B/C — confident first-person account aligning the slowdown with
      the deliberate appearance change.
    why_plausible: A recent system-wide setting change coinciding with the slowdown
      invites treating it as a system-level cause.
    why_irrelevant: Dark mode and accent colour are interface-appearance settings;
      they change no I/O behaviour and cannot affect how long a disk backup takes.
  LL:
    distractor: The backup slowdown began around the time the system was switched
