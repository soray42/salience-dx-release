causal_audit:
  steelman: 'One could argue enabling dark mode triggered other settings changes or
    a background refresh that competes for

    disk I/O at backup time. But the stated event is solely switching to dark mode
    and changing the accent colour;

    these are pure interface-appearance settings rendered by the window server, with
    no disk-I/O footprint and no

    scheduled background work, and they cannot lengthen a USB disk backup. There is
    no constructible mechanism from

    a theme change to backup duration, and the focal evidence shows a 98%-full destination
    thrashing on pruning,

    which fully accounts for the slowdown.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the coincidence has no mechanism; xbase withholds
    the destination fullness so the cause lives only in HH/LH.
unconstructable: false
