domain: open_qa
complexity: high
xbase: I am deciding whether to buy a used 50mm prime lens listed by a private seller
  for $280. It is described as fully functional, and the price is $120 below typical
  used market rate. The seller says the slight discount is for cosmetic wear on the
  focus ring. I have inspected the mount and aperture blades, which look normal. {DS}
focal_diagnostic_feature: Holding the lens against bright light and looking through
  both ends reveals a web-like cloudy growth between the rear elements, consistent
  with fungal contamination that degrades contrast and is not remediated by cleaning
  the outer elements.
low_diagnostic_proposition: The listing appeared in the days following the user attending
  a local photography workshop.
oracle_action: ANSWER
oracle_focus: Decline this purchase; the fungal contamination between the rear elements
  is a structural defect that degrades optical performance and cannot be remediated
  externally, making the discounted price misleading.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not anchor on the workshop timing as a reason to distrust
  judgment; inspect the optical elements for haze, fungus, and internal dust before
  making any purchase decision.
