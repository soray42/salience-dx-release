causal_audit:
  steelman: 'A senior photography practitioner might argue: attending a workshop could
    prime the user to overvalue gear acquisition, suppressing the skepticism needed
    to catch defects. The claim is not that the workshop affects the lens — it is
    that it affects the evaluator''s cognitive state, which is a real effect. Therefore,
    the timing IS worth noting as a confound on judgment quality.

    '
