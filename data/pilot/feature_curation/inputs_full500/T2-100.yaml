distractor_direction:
  label: Post-workshop judgment bias
  description: Investigating whether attending a photography workshop shortly before
    the listing appeared has introduced enthusiasm-driven bias that is impairing the
    evaluation of the lens.
plausible_alternative_directions:
- label: Accurate seller discount
  description: The cosmetic focus-ring wear is the genuine reason for the below-market
    price and the lens is optically sound.
- label: Aperture or element delamination
  description: The internal clouding could be delamination of an element coating rather
    than fungus, which has a different remediation and resale picture.
- label: Haze from storage moisture
  description: The clouding might be removable moisture haze rather than biological
    fungal growth, which could be cleared by a competent technician.
