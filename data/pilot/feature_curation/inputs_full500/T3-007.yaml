distractor_direction:
  label: Token library defect
  description: Investigating whether the JWT/token library is defective or unsafe
    and should be replaced.
plausible_alternative_directions:
- label: Load-balancer routing issue
  description: A subset of requests may be routed to a misconfigured or stale service
    instance.
- label: Signing-key rotation bug
  description: Key rotation or cached key state may create inconsistent token validation
    or generation.
- label: Timezone conversion bug
  description: Application code may mishandle UTC/local-time conversion when setting
    expiration claims.
