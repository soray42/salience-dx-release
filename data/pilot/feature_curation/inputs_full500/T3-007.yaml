seed_id: T3-007
template: T3
domain: technical_troubleshooting
complexity: high
xbase: Our auth service occasionally issues JWTs whose `exp` claim is already in the
  past. It happens in under 1% of tokens. The service runs on three replicas behind
  a load balancer. {DS}
focal_diagnostic_feature: All bad tokens come from replica 2, whose system clock is
  exactly 24 hours behind real time.
low_diagnostic_proposition: A principal security engineer says the token library should
  be treated as the main cause and replaced.
oracle_action: ANSWER
oracle_focus: Fix time synchronisation on replica 2, recycle it, and add clock-skew
  monitoring across replicas.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not jump to library migration from authority alone.
  Ask for per-replica token attribution and node time checks.
