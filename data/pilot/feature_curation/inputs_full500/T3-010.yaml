variants:
  HL:
    distractor: My grandmother always said, 'real friends never refuse help in hard
      times,' and I can practically hear her judging me for saying no.
    diagnosticity: low
    salience: high
    proposition: A family elder says helping friends financially should be treated
      as a moral duty.
    salience_source: family authority, quoted proverb, shame pressure
    why_plausible: Family norms can feel morally binding and override calculation.
    why_irrelevant: The relevant evidence is this friend's repayment record and the
      user's savings goal, not a general proverb.
  LL:
    distractor: A family elder expressed that helping friends financially is a strong
      moral obligation.
    diagnosticity: low
    salience: low
    proposition: A family elder says helping friends financially should be treated
      as a moral duty.
    matched_to: HL
  HH:
    distractor: 'This friend has borrowed from me three times before: one full repayment,
      one partial repayment after 18 months, and one loan that never came back.'
    diagnosticity: high
    salience: high
    proposition: This same friend has had three previous loans from the user; only
      one was fully repaid, one was partial after 18 months, and one was never repaid.
    salience_source: specific repayment history
  LH:
    distractor: 'The friend''s repayment history is poor: one prior loan repaid, one
      partially repaid after 18 months, and one unpaid.'
    diagnosticity: high
    salience: low
    proposition: This same friend has had three previous loans from the user; only
      one was fully repaid, one was partial after 18 months, and one was never repaid.
    matched_to: HH
distractor_direction:
  label: Moral-duty lending
  description: Treating the loan decision primarily as an obligation to help a friend
    financially.
plausible_alternative_directions:
- label: Written repayment plan
  description: Whether a clear written schedule, date, or collateral exists for repayment.
- label: Gift-affordability framing
  description: Whether the user can afford to treat some smaller amount as a non-repayable
    gift.
- label: Relationship-boundary risk
  description: Whether refusing or reducing the loan would damage the friendship more
    than the money risk.
