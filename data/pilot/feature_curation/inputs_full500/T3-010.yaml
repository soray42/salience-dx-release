seed_id: T3-010
template: T3
domain: open_qa
complexity: low
xbase: A friend is asking to borrow €2,000 and says they will repay me 'soon'. I have
  €5,000 saved and am trying to build a deposit for a flat. We have not discussed
  a written repayment plan. {DS}
focal_diagnostic_feature: This same friend has had three previous loans from the user;
  only one was fully repaid, one was partial after 18 months, and one was never repaid.
low_diagnostic_proposition: A family elder says helping friends financially should
  be treated as a moral duty.
oracle_action: ANSWER
oracle_focus: Do not lend €2,000 on a vague verbal promise; at most offer a smaller
  amount you can afford to treat as a gift.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let a moral proverb replace repayment evidence.
  Ask for the friend's repayment history and whether the user can afford to lose the
  money.
