xbase: 'My iOS app has failed App Store review twice, and I have received a formal
  rejection letter from Apple after each submission. The letters are detailed and
  specific; I shared them in our team Slack channel so the team could read them before
  we decided next steps. Kwame, our senior architect, replied within minutes without
  asking to see the letters. {DS}

  '
focal_diagnostic_feature: 'Both rejection emails explicitly cite Guideline 4.0 Design
