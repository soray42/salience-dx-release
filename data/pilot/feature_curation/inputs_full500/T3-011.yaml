distractor_direction:
  label: privacy manifest deficiency
  description: 'The App Store rejections are caused by a missing or incomplete PrivacyInfo.xcprivacy
    privacy manifest file, which Apple has required since 2024 and which is a documented
    source of review rejections.

    '
plausible_alternative_directions:
- label: metadata or screenshot mismatch
  description: 'The rejections stem from App Store Connect metadata violations such
    as screenshots depicting features not present in the submitted build (Guideline
    2.3), which is a distinct and common rejection reason.

    '
- label: missing capability declaration
  description: 'A required entitlement or capability (e.g., push notifications, iCloud
    access) is present in the binary but not declared in App Store Connect, triggering
    a policy violation separate from the crash.

    '
- label: third-party SDK policy violation
  description: 'A bundled third-party SDK violates a current App Store policy (e.g.,
    fingerprinting APIs, deprecated private frameworks), causing rejection independently
    of the app''s own code or crash behavior.

    '
