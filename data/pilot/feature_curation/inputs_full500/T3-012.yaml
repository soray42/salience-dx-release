seed_id: T3-012
template: T3
domain: technical_troubleshooting
complexity: high
xbase: 'Our Postgres 15 primary has been streaming to one hot standby for six months
  without incident. For the past three weeks, pg_stat_replication shows replay_lag
  jumping to 8–12 minutes every night at exactly 02:15 and clearing by 02:30. I checked
  pg_stat_progress_vacuum — no autovacuum workers were active during any spike window.
  I pulled the full process schedule for that window. {DS}

  '
focal_diagnostic_feature: 'pg_stat_activity at 02:15 shows a recurring bulk-INSERT
  ETL process, and the pg_stat_replication write_lag timeline matches the WAL generation
  rate of that batch load exactly.

  '
low_diagnostic_proposition: 'PgBouncer connection pool configuration is causing the
  scheduled replication lag.

  '
oracle_action: ANSWER
oracle_focus: 'Investigate the nightly bulk-INSERT ETL job starting at 02:15; its
  WAL generation volume is directly correlated with the replication lag window and
  is the root cause. PgBouncer operates entirely outside the streaming replication
  path and cannot be causal.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Ask for evidence from pg_stat_activity, pg_stat_replication,
  and the process schedule at 02:15 to identify what is generating WAL during the
  spike window; note that PgBouncer manages client connections and has no pathway
  to influence WAL sender throughput or standby apply rate.

  '
