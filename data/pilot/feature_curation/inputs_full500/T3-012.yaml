distractor_direction:
  label: PgBouncer connection pool
  description: 'The hypothesis that PgBouncer connection pool configuration is responsible
    for the nightly replication lag spike. PgBouncer operates in the client-to-primary
    connection layer and has no mechanism to affect streaming replication throughput.

    '
plausible_alternative_directions:
- label: checkpoint write pressure
  description: 'A heavy checkpoint at 02:15 — triggered by accumulated dirty pages
    from earlier write activity — causes I/O saturation on the primary, slowing WAL
    flush to disk and thereby delaying delivery to the standby.

    '
- label: hot standby query conflict
  description: 'Long-running read queries on the hot standby conflict with WAL apply
    at 02:15, causing the standby to pause apply (max_standby_streaming_delay), which
    registers as replay_lag even if the primary is fine.

    '
- label: WAL archiving bottleneck
  description: 'The archive_command is slow or blocked at 02:15 — e.g., a slow NFS
    mount or a competing backup job — causing WAL segments to queue on the primary
    before the standby can receive them.

    '
