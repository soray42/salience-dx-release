domain: technical_troubleshooting
complexity: low
xbase: 'My Bluetooth headphones have been crackling badly with my work laptop. It
  happens across all audio — music, calls, video conferences, everything. I have had
  the headphones for about a year and they work fine with my phone. It started recently
  and I cannot figure out what changed. I mentioned it to our office IT person. {DS}

  '
focal_diagnostic_feature: 'The crackling is strictly location-dependent — it stops
  when the user moves approximately one meter from the laptop — which is inconsistent
  with any software or profile configuration explanation and points to local RF interference
  emitted by the laptop hardware.

  '
low_diagnostic_proposition: 'The Bluetooth audio profile is not configured correctly,
  and this is causing the crackling.

  '
oracle_action: ANSWER
oracle_focus: 'Investigate local RF interference sources from the laptop (USB 3.0
  peripherals, internal WiFi radio, or other hardware emitting in the 2.4 GHz band);
  the strictly proximity-dependent symptom rules out software or profile-level causes
  and points to a hardware RF emission problem within about one meter of the laptop.

  '
low_diagnostic_oracle_action: ANSWER
low_diagnostic_oracle_focus: 'Ask clarifying questions about whether the crackling
  is distance-dependent or constant, and note that audio profile misconfiguration
  would not explain a spatially variable symptom; do not adopt the profile-misconfiguration
  story as the working hypothesis.

  '
