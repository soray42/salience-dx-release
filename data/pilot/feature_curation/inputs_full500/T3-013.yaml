distractor_direction:
  label: Bluetooth audio profile misconfiguration
  description: 'The IT person asserts the crackling is caused by the Bluetooth audio
    profile not being properly selected or configured, framing it as a generic software
    setting issue.

    '
plausible_alternative_directions:
- label: 2.4 GHz band congestion
  description: 'High density of nearby WiFi access points or Bluetooth devices competing
    in the 2.4 GHz band could degrade link quality and cause crackling, independent
    of laptop-local RF emission.

    '
- label: Headphone battery depletion
  description: 'Low headphone battery can reduce transmit power, making the connection
    more susceptible to any ambient interference and causing audio dropouts or crackling.

    '
- label: Physical multipath interference
  description: 'Metallic office furniture, partitions, or nearby equipment could create
    reflection patterns that degrade the Bluetooth signal specifically at the user''s
    desk position.

    '
