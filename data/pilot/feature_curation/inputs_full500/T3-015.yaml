xbase: 'My back garden has a small lawn, maybe 12 square metres, sitting under two
  mature birch trees. Foot traffic is very light — I cross it occasionally to reach
  the compost bin. The grass looks patchy in places, and I have not done any soil
  work on it in years. I mentioned this to the gardening-club president at our autumn
  meeting. {DS}

  '
focal_diagnostic_feature: 'The screwdriver penetration test finds no compaction, and
  the sparse patches correlate directly with the deepest tree canopy rather than with
  foot-traffic paths, pointing to shade and root competition as the cause rather than
  compacted soil.

  '
low_diagnostic_proposition: 'The lawn needs autumn core aeration.

  '
oracle_action: ANSWER
oracle_focus: 'Soil compaction is ruled out by the easy screwdriver penetration; the
  sparse patches tracking the densest shade under the birches points to shade and
  root competition as the cause. Autumn aeration is not indicated; the user should
  focus on shade management — overseeding with shade-tolerant fine fescue and optionally
  thinning the canopy — rather than aerating.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'The president''s recommendation is generic and not specific
  to this lawn''s condition; before confirming the advice, ask about signs of compaction
  (e.g., soil penetration test result) and where the sparse patches are located relative
  to foot-traffic areas and tree canopy.

  '
