distractor_direction:
  label: soil compaction requires aeration
  description: 'The president''s generic verdict frames autumn aeration as the universal
    remedy for any tired-looking lawn, implicitly attributing the thinning to soil
    compaction. This is a pattern-matching heuristic applied without examining the
    actual lawn condition.

    '
plausible_alternative_directions:
- label: nutrient deficiency or pH imbalance
  description: 'Acidic or nutrient-poor soil under a birch canopy could limit grass
    vigour, making feeding or liming a plausible first intervention a practitioner
    might consider.

    '
- label: wrong grass species for conditions
  description: 'The existing grass variety may be poorly matched to a shaded, root-
    competitive environment; a practitioner might recommend replacing it with a shade-tolerant
    cultivar rather than any maintenance treatment.

    '
- label: moss encroachment suppressing grass
  description: 'Damp shaded conditions under trees favour moss establishment; a practitioner
    might suspect moss competition as the proximate cause of grass thinning and recommend
    scarification or moss treatment first.

    '
