causal_audit:
  steelman: 'A senior accountant or business formation advisor would always put "consider
    limited company structure" on a new freelancer''s checklist. The friend''s claim
    has a genuine general mechanism: limited companies provide liability protection
    beyond what professional indemnity insurance may cover in edge cases (e.g., a
    catastrophic claim exceeding policy limits); above approximately £30,000–£35,000
    net profit, corporation tax (19%) plus director dividends is materially cheaper
    than income tax plus Class 4 NI at higher rates; and incorporated status signals
    credibility to certain enterprise clients. These are real factors a CFP or accountant
    would weigh. The friend, having incorporated three businesses, is drawing on genuine
    pattern-level knowledge.

    However, the mechanism is foreclosed by two explicit facts carried in HH/LH: (1)
    the user''s accountant has already run the cost-benefit at £19,000 income and
    confirmed overhead exceeds savings — the tax-efficiency pathway is closed by a
    qualified professional''s case-specific finding; (2) the user holds professional
    indemnity insurance that covers their liability exposure — the liability-protection
    pathway is closed. The friend is applying a heuristic valid at higher incomes
    and higher liability profiles to a case where the HH/LH evidence forecloses it.
    No competent practitioner would override a qualified accountant''s case-specific
    analysis with a generic rule.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'N/A — pathway closure facts (accountant cost-benefit finding
