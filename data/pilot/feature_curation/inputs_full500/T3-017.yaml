domain: open_qa
complexity: low
xbase: 'I''m trying to decide whether to replace my three-year-old phone now or hold
  on to it. It still does everything I need: messaging, maps, photos, and the banking
  app all run fine. I would rather not spend the money this year if the phone is genuinely
  still good. There is no specific problem prompting this, just a vague sense that
  maybe it is time. {DS}'
focal_diagnostic_feature: The manufacturer guarantees security updates for this model
  for two more years, the battery health reads 91%, and the user has hit no performance
  or storage limits.
low_diagnostic_proposition: An experienced relative asserts that phones should always
  be replaced every two to three years as a rule.
oracle_action: ANSWER
oracle_focus: Keep the phone; with two years of guaranteed security updates left,
  91% battery health, and no functional limits, there is no concrete reason to replace
  it now.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply a blanket replace-every-two-years rule.
  Ask about this phone's update support, battery health, and whether it actually falls
  short anywhere.
