causal_audit:
  steelman: 'A senior engineer could reasonably note that GraphQL''s nested resolvers
    are the classic source of hidden N+1

    fan-out, that such fan-out is bursty and intermittent, and that it often hides
    on a lightly loaded database

    because each query is individually cheap — so N+1 is a legitimate first hypothesis
    for intermittent GraphQL latency.

    '
