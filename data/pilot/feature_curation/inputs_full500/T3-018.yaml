      returning the tier.
    diagnosticity: high
    salience: high
    proposition: Traces show the slow time is spent in a single outbound call to a
      third-party loyalty provider's REST API that intermittently takes ~3 seconds;
      the database resolvers complete in single-digit milliseconds.
    salience_source: The trace breakdown — fast DB spans, one ~3-second external HTTP
