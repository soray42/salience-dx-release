variants:
  HL:
    distractor: Our principal engineer barely glanced at it in standup and said this
      is the textbook N+1 problem — that intermittent GraphQL slowness is "always"
      the resolver firing one query per item — and told me to go add DataLoader batching
      and move on.
    diagnosticity: low
    salience: high
    proposition: A senior engineer says intermittent GraphQL slowness is classically
      an N+1 query problem and should be addressed with batching.
    salience_source: A/C — a principal engineer confidently pattern-matching to a
      textbook GraphQL anti-pattern without examining the traces.
    why_plausible: N+1 is the most famous GraphQL performance pitfall, so reaching
      for it on hearing 'slow GraphQL' is a reflex many engineers share.
    why_irrelevant: N+1 is a database-fan-out problem, but the database resolvers
      are fast; the latency lives in an external call, which batching local queries
      would not touch.
  LL:
    distractor: A senior engineer stated that intermittent GraphQL slowness is classically
      an N+1 query problem to fix with batching.
