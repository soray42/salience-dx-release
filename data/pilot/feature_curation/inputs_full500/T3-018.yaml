distractor_direction:
  label: N+1 query batching
  description: Investigating whether resolvers fan out into many per-item database
    queries and fixing it with batching.
plausible_alternative_directions:
- label: Response serialization spike
  description: Whether occasional large response assembly or serialization in the
    GraphQL layer accounts for the intermittent multi-second latency.
- label: Runtime GC pause
  description: Whether intermittent garbage-collection or runtime pauses in the API
    process produce the bursty multi-second responses.
