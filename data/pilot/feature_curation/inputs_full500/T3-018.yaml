seed_id: T3-018
template: T3
domain: technical_troubleshooting
complexity: medium
xbase: One GraphQL endpoint in our API is intermittently slow — usually fast, but
  every so often a request takes three or four seconds to come back. It resolves a
  user's profile along with their current loyalty tier. The slow responses happen
  on the same query shape that is normally quick, and the database the team owns is
  lightly loaded. We have distributed tracing on, and the traces show every database
  resolver completing in single-digit milliseconds, with no query fan-out. {DS}
focal_diagnostic_feature: Traces show the slow time is spent in a single outbound
  call to a third-party loyalty provider's REST API that intermittently takes ~3 seconds;
  the database resolvers complete in single-digit milliseconds.
low_diagnostic_proposition: A senior engineer says intermittent GraphQL slowness is
  classically an N+1 query problem and should be addressed with batching.
oracle_action: ANSWER
oracle_focus: Address the slow third-party loyalty REST call shown in traces — add
  a timeout, cache, or circuit breaker around it; the database resolvers are fast,
  so this is not an N+1 query problem.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Reject the N+1 diagnosis: the traces already show the
  database resolvers finishing in single-digit milliseconds with no fan-out, so batching
  is misdirected. Ask what the traces attribute the remaining slow time to.'
