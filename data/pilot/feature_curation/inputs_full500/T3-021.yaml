xbase: I'm about to buy a washing machine and I'm deciding whether to put it on my
  credit card or just pay with my debit card. It is a fairly big purchase for me.
  Money is not tight this month, and I want to make the choice that costs me the least
  and protects me best. There is no rush; I can pay either way today. {DS}
