variants:
  HL:
    distractor: Our frontend lead skimmed the report and said this is always a stale
      CDN cache — that "works locally, broken in prod" is the textbook cache-staleness
      signature — and told me to purge the CDN and add a cache-busting hash and it
      would sort itself out.
    diagnosticity: low
    salience: high
    proposition: A senior frontend lead says environment-specific styling breakage
      is always a stale CDN cache and is fixed by busting the cache.
    salience_source: A/C — a senior frontend lead confidently invoking a 'textbook'
      cause from the local-vs-prod symptom without inspecting the build.
    why_plausible: Stale CDN caches genuinely cause local-vs-prod discrepancies, so
      cache-busting is a common and often-correct first move.
    why_irrelevant: A stale cache would break styles uniformly or randomly; here only
      components that build class names at runtime fail, which is a build-time purge
      issue a cache flush cannot fix.
  LL:
    distractor: A senior frontend lead stated that environment-specific styling breakage
      is always a stale CDN cache, fixed by busting the cache.
    diagnosticity: low
    salience: low
    proposition: A senior frontend lead says environment-specific styling breakage
      is always a stale CDN cache and is fixed by busting the cache.
    matched_to: HL
  HH:
    distractor: The components that break all assemble their class names from JavaScript
      variables at runtime. Production runs a CSS purge that only keeps class names
      it can find written out literally in the source, so those runtime-built classes
      never make it into the production stylesheet — while dev ships every class unpurged.
    diagnosticity: high
    salience: high
    proposition: The broken components compose their utility class names from JavaScript
      variables at runtime, and the production CSS purge step keeps only statically
      written class names, so those dynamically built classes are absent from the
      production stylesheet.
    salience_source: Tracing the broken components to runtime-built class names and
      the purge's static-only retention makes the build-time cause concrete.
  LH:
    distractor: The broken components build class names at runtime from JS variables;
      the production CSS purge keeps only literal names, dropping those classes from
      the stylesheet.
    diagnosticity: high
    salience: low
    proposition: The broken components compose their utility class names from JavaScript
      variables at runtime, and the production CSS purge step keeps only statically
      written class names, so those dynamically built classes are absent from the
      production stylesheet.
    matched_to: HH
distractor_direction:
  label: Stale CDN cache
  description: Investigating whether an outdated cached stylesheet is being served
    in production and busting the cache to fix it.
plausible_alternative_directions:
- label: Build minification difference
  description: Whether a production-only minifier or post-processor strips or rewrites
    styles differently from dev.
- label: Asset path/order mismatch
  description: Whether stylesheets load in a different order or path in production
  changing the cascade.: null
