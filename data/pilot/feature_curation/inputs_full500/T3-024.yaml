seed_id: T3-024
template: T3
domain: technical_troubleshooting
complexity: high
xbase: Our public REST API started returning 429 Too Many Requests to legitimate clients
  in short bursts, even though overall traffic is well below the limits we published.
  The bursts cluster at the start of each minute and clear within a few seconds. The
  rate-limiting service backed by a shared Redis store has not had its config changed,
  and individual clients swear they are pacing their requests evenly under the documented
  per-minute cap. {DS}
focal_diagnostic_feature: The limiter uses a fixed-window counter that resets on the
  minute boundary, so clients whose evenly-paced requests straddle a boundary briefly
  exceed the per-window count and get 429s; a sliding-window or token-bucket scheme
  would not.
low_diagnostic_proposition: A principal engineer says the 429s are a classic sign
  that Redis is overloaded and the team should add more Redis nodes.
oracle_action: ANSWER
oracle_focus: Replace the fixed-window rate limiter with a sliding-window or token-bucket
  algorithm; clients pacing evenly across the minute boundary briefly exceed the fixed
  window's count and get 429s, which a smoother scheme avoids.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the Redis-overload diagnosis on authority
  alone. Ask what rate-limiting algorithm is in use and whether the 429 bursts align
  with the window-reset boundary.
