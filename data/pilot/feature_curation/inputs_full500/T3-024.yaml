variants:
  HL:
    distractor: Tarsila, a principal engineer two teams over, looked at the dashboard
      for a moment at standup and said with total confidence that bursty 429s like
      this are the classic signature of an overloaded Redis, and that we just need
      to scale the Redis cluster out.
    diagnosticity: low
    salience: high
    proposition: A principal engineer says the 429s are a classic sign that Redis
      is overloaded and the team should add more Redis nodes.
    salience_source: A — a principal engineer giving a confident, status-backed glancing
      diagnosis.
    why_plausible: Redis does back the limiter and overload can cause errors, so 'scale
      Redis' sounds like a credible default for a senior engineer to reach for.
    why_irrelevant: She pattern-matched without checking the algorithm; an overloaded
      Redis would not make the 429s cluster precisely on minute boundaries while overall
      traffic stays under the limit, which the fixed-window mechanism explains.
  LL:
    distractor: A principal engineer says the 429s are a classic sign that Redis is
      overloaded and the team should add more Redis nodes.
    diagnosticity: low
    salience: low
    proposition: A principal engineer says the 429s are a classic sign that Redis
      is overloaded and the team should add more Redis nodes.
    matched_to: HL
  HH:
    distractor: The limiter uses a fixed-window counter that resets exactly on each
      minute boundary, so a client pacing evenly whose requests straddle the reset
      piles two windows' worth into one counted window and trips the cap for a few
      seconds; a sliding-window or token-bucket scheme would smooth this away.
    diagnosticity: high
    salience: high
    proposition: The limiter uses a fixed-window counter that resets on the minute
      boundary, so clients whose evenly-paced requests straddle a boundary briefly
      exceed the per-window count and get 429s; a sliding-window or token-bucket scheme
      would not.
    salience_source: The fixed-window reset boundary and the straddling-burst mechanism
      name the exact cause of the on-the-minute 429s.
  LH:
    distractor: The fixed-window limiter resets on the minute boundary, so evenly-paced
      clients straddling the reset briefly exceed the per-window cap and get 429s;
      a sliding window would not.
    diagnosticity: high
    salience: low
    proposition: The limiter uses a fixed-window counter that resets on the minute
      boundary, so clients whose evenly-paced requests straddle a boundary briefly
      exceed the per-window count and get 429s; a sliding-window or token-bucket scheme
