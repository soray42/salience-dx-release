seed_id: T3-026
template: T3
domain: technical_troubleshooting
complexity: medium
xbase: 'Our service receives webhooks from a payment provider and we are losing a
  small fraction of them: the provider''s dashboard shows it delivered events that
  never resulted in any change on our side. The provider receives an HTTP 200 from
  us for those deliveries, so it never retries. Our endpoint is up, response times
  look fine, and we have not changed the webhook handler''s code recently. {DS}'
focal_diagnostic_feature: The handler returns 200 to the provider immediately on receipt
  and then enqueues the event for asynchronous processing; when the worker crashes
  before finishing, the event is lost, because the 200 was already sent before the
  work was durably committed.
low_diagnostic_proposition: A senior engineer says intermittent webhook loss is almost
  always the provider silently dropping deliveries and that the team should escalate
  to the provider.
oracle_action: ANSWER
oracle_focus: Acknowledge the webhook only after the event is durably persisted (or
  persist before responding 200); the handler currently returns 200 before async processing
  completes, so a worker crash loses the event with no provider retry.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the provider-drops-deliveries diagnosis
  on authority alone. Ask at what point the handler returns 200 relative to durably
  committing the event's work.
