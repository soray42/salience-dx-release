  HH:
    distractor: The handler returns 200 to the provider the instant it receives the
      event, then drops the event onto an internal queue for asynchronous processing;
      when the worker crashes before finishing, the event is simply gone, because
      we already acknowledged it before the work was durably committed.
    diagnosticity: high
    salience: high
    proposition: The handler returns 200 to the provider immediately on receipt and
      then enqueues the event for asynchronous processing; when the worker crashes
      before finishing, the event is lost, because the 200 was already sent before
      the work was durably committed.
    salience_source: The ack-before-durable-commit sequence and the worker-crash loss
