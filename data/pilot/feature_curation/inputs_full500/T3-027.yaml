xbase: I am reviewing my recurring spending and trying to decide what to do about
  a premium video-streaming tier I pay for. I do watch this service regularly, so
  I am not cancelling it; the question is whether to stay on the top tier or drop
  to the cheaper standard tier. I have a clear picture of how and on what devices
  I actually watch each week. {DS}
focal_diagnostic_feature: The user only ever watches on a single laptop with a 1080p
  screen, while the premium tier's only differences from the standard tier are 4K
  resolution and simultaneous streams the user never uses.
low_diagnostic_proposition: A senior coworker says you should always buy the top tier
  of any subscription because the cheaper tiers are deliberately crippled.
oracle_action: ANSWER
oracle_focus: Drop to the standard tier; the user only watches on a single 1080p laptop,
  and the premium tier's only extras are 4K and extra simultaneous streams the user
  never uses, so the higher price buys nothing they benefit from.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the always-buy-the-top-tier rule on authority
  alone. Ask which specific premium-tier features the user actually uses given their
  devices and viewing habits.
