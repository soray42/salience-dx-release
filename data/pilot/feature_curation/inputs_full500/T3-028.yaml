distractor_direction:
  label: TLS certificate trust-chain fault
  description: Investigating whether an incomplete or mis-ordered TLS certificate
    chain causes nginx to drop upstream connections and return 502 to clients.
plausible_alternative_directions:
- label: upstream process crash or restart
  description: The Node.js upstream process is crashing or restarting intermittently,
    causing nginx to receive no response and emit 502 on in-flight requests.
- label: upstream connection pool exhaustion
  description: The Node.js server's connection concurrency limit or keepalive pool
    is being exhausted under load, causing nginx to fail to acquire an upstream connection.
- label: nginx upstream timeout
  description: nginx proxy_read_timeout or proxy_connect_timeout is too short for
    a subset of slow upstream responses, causing premature 502s that look like random
    failures.
