causal_audit:
  steelman: 'A missing or incorrect background-fetch entitlement declaration is a
    real and frequent

    cause of iOS apps failing to run background tasks. A principal iOS engineer who
    has

    diagnosed this pattern repeatedly has genuine expertise, and the symptom — background

    sync producing no output — is exactly what a missing entitlement would cause.
    One could

    argue that the engineer''s pattern-match is the most parsimonious explanation
    given the

    observable symptom. However, a missing entitlement would prevent the sync job
    from

    executing at all on the client, producing no network traffic. The server logs
    in HH/LH

    show the sync job reaching the server and receiving 401 responses, which is impossible

    if the entitlement were the root cause. The server-side 401 evidence structurally

    disqualifies the entitlement diagnosis for this specific case.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states Background App Refresh is enabled at the iOS
    system level, which partially narrows entitlement concerns but does not rule out
    a missing entitlement declaration in the app's own configuration; the server-side
    401 evidence ruling it out lives only in HH/LH.
