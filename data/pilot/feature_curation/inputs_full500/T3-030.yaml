  notes: 'C4 verified: xbase says ''Background App Refresh is enabled at the iOS system
    level'' which

    is the user-facing OS toggle, not the developer-side entitlement declaration.
    An expert

    cannot rule out a missing entitlement from xbase alone because the OS toggle and
