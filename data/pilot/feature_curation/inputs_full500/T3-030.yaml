seed_id: T3-030
template: T3
domain: technical_troubleshooting
complexity: medium
xbase: Our iOS app has stopped syncing user data in the background for a subset of
  accounts. Affected users have not opened the app for at least five days. Background
  App Refresh is enabled at the iOS system level for our app, but the sync job produces
  no visible output for these users. {DS}
focal_diagnostic_feature: Server logs show HTTP 401 responses on OAuth2 refresh-token
  requests for all affected accounts, with token expiry timestamps matching a seven-day
  inactivity TTL; the sync handler catches the error and exits silently.
low_diagnostic_proposition: A senior iOS engineer states that a missing background-fetch
  entitlement is the standard cause of this type of background sync failure.
oracle_action: ANSWER
oracle_focus: Fix the OAuth2 token expiry handling in the sync job; implement silent
  re-authentication or prompt the user to log in again when the refresh token expires
  after seven days of inactivity, and add logging so the 401 is visible rather than
  silently discarded.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the entitlement diagnosis from authority
  alone. Ask for server-side API logs for affected users and check whether the sync
  job returns any HTTP error before concluding the failure is a client-side entitlement
  issue.
