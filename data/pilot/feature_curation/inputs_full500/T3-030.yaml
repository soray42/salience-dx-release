    diagnosticity: low
    salience: high
    proposition: A senior iOS engineer states that a missing background-fetch entitlement
      is the standard cause of this type of background sync failure.
    salience_source: A/C — source credibility (principal iOS engineer) plus confident
      assertion ('always', 'exactly this pattern', 'complete confidence') give the
