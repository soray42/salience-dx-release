distractor_direction:
  label: Missing background-fetch entitlement
  description: Investigating whether the app's Info.plist or entitlements file is
    missing the background-fetch capability declaration, preventing the iOS sync job
    from running.
plausible_alternative_directions:
- label: iOS system background-refresh throttling
  description: Whether iOS is throttling or deprioritising the app's background refresh
    for low-activity accounts due to system heuristics.
- label: Silent sync handler exception
  description: Whether an unhandled exception in the sync job logic other than token
    expiry causes it to exit early without producing output.
- label: Push-notification wakeup missing
  description: Whether the sync relies on a push-notification wakeup that is not being
    sent for inactive accounts
  preventing the sync from starting at all.: null
