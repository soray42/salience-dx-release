distractor_direction:
  label: threading violation on cold resume
  description: Investigating whether Android threading constraints during activity
    resume from a killed background state are raising the exception that crashes the
    app on notification tap.
plausible_alternative_directions:
- label: intent flag misconfiguration
  description: Checking whether the PendingIntent flags on the notification were changed
    in the release, causing the activity stack to be reconstructed incorrectly on
    tap.
- label: deep-link routing regression
  description: Examining whether the navigation component or deep-link handler fails
    to resolve the notification's target URI for a subset of users based on account
    state or app version.
- label: Firebase Messaging library version conflict
  description: Investigating whether a dependency update to the FCM or messaging library
    introduced a compatibility issue with the existing notification handling code.
