causal_audit:
  steelman: 'Threading violations on Android notification-tap launches are a documented
    and

    common failure mode: if the app process was killed, tapping a notification cold-

    starts the activity stack, and improper UI-thread access in the resume path can

    throw exceptions. A senior Android engineer with cross-app experience would have

    strong empirical grounds to rank this as a leading hypothesis given the symptom

    description alone, and many production incidents trace back to exactly this

    pattern. However, xbase explicitly states that the exception class in the

    available crash reports is not a threading type, which directly forecloses the

    cold-resume threading mechanism; a practitioner reading xbase knows the crash

    is not a threading exception and would not pursue that path.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states that the team sampled the available crash
    reports and confirmed the exception class is not a threading type — this directly
    and narrowly forecloses the cold-resume threading mechanism without revealing
    the NullPointerException cause or the payload-parser call site (those remain in
    HH/LH only).
