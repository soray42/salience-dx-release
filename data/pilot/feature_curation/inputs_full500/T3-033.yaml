seed_id: T3-033
template: T3
domain: open_qa
complexity: low
xbase: I graduated six months ago and have been applying widely since. I now have
  two entry-level offers, both in my field and starting within a few weeks of each
  other. I do not have strong ties to either city and have limited savings from a
  part-time job during my final year. I asked a mentor who built his career at large
  corporations which offer I should take. {DS}
focal_diagnostic_feature: Offer A pays 22% more, requires no relocation, and the role
  content matches the candidate's stated goal exactly; Offer B is at a more recognizable
  company name but pays less and requires self-funded relocation.
low_diagnostic_proposition: Brand-name employers should always be prioritised for
  a first role because they set the career trajectory.
oracle_action: ANSWER
oracle_focus: 'Choose Offer A: the pay gap, relocation cost, and role-content alignment
  together outweigh the brand advantage when the candidate has no financial cushion
  for relocation and a clear career direction.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply a blanket brand-name rule. Ask for the compensation
  gap, relocation situation, role content, and the candidate's financial position
  before deciding.
