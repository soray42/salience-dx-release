distractor_direction:
  label: brand-name employer priority
  description: Treating the more recognizable company name on Offer B as the primary
    decision criterion for a first role, based on the mentor's general career heuristic.
plausible_alternative_directions:
- label: team and manager quality
  description: Examining whether the direct manager and team at each company are strong
    learning environments, independent of brand or pay.
- label: growth and promotion pace
  description: Comparing how quickly each company promotes from entry level and whether
    the learning curves differ meaningfully.
