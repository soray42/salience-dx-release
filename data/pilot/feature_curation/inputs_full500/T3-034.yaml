causal_audit:
  steelman: 'The app polls a REST API every 30 minutes while backgrounded, which is
    a well-documented

    Android battery drain pattern: each wakeup triggers radio activity, processor
    scheduling,

    and network I/O. A senior engineer who has seen multiple such regressions after
    polling

    interval changes would reasonably rank background sync high on any checklist for

    post-update battery complaints. The 30-minute interval is relatively aggressive
    for

    an always-on background service, and network wakeups can dwarf the nominal CPU
    cost

    in some radio environments. However, xbase now directly forecloses this pathway:

    backend request logs confirm the polling job fires at its scheduled interval with
    no

    additional wakeup events, removing the mechanism (radio wakeups, extra scheduling

    overhead) by which sync polling would produce anomalous drain. No constructible

    mechanism for the observed symptom survives.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: Backend request logs confirm the polling job is firing
    at its scheduled 30-minute interval with no additional wakeup events — this neutrally
    rules out sync-driven radio wakeups and network I/O as the drain mechanism without
    naming the actual cause.
