distractor_direction:
  label: background data sync drain
  description: Attributing the battery drain to the app's 30-minute REST API polling
    interval creating excessive background wakeups and network activity.
plausible_alternative_directions:
- label: WorkManager or AlarmManager misfire
  description: Investigating whether a background job scheduler introduced in the
    update is firing more frequently than intended, compounding the battery load.
- label: wake lock not released
  description: Checking whether a new code path in the update acquires a wake lock
    during background operations and fails to release it promptly.
- label: push notification listener loop
  description: Assessing whether the app's FCM listener is triggering excessive processing
    cycles in response to delivery receipts or silent push payloads.
