causal_audit:
  steelman: 'A sympathetic reading of Solveig is that consumer espresso machines do
    have finite boiler and pump lifespans, and

    a five-year-old machine pushing weak, slow shots could indeed have a worn pump
    or scaled-shut boiler at end of

    life, so an experienced retailer''s age heuristic is not absurd. But the heuristic
    is exactly that — a population

    rule applied without examining this unit. She did not run a shot, test pressure,
    or descale it. The focal

    evidence settles the case directly: a single descaling run restores fast, hot
    flow, proving the cause was

    removable limescale, not terminal wear. The authority''s generic verdict has no
    mechanism to override a fault that

    a few euros of descaler demonstrably fixed.

    '
  steelman_verdict: no_defensible_mechanism
