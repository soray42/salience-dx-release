seed_id: T3-035
template: T3
domain: open_qa
complexity: medium
xbase: My pump espresso machine has slowed to a trickle — it takes nearly a minute
  to push out a single shot and the coffee comes out lukewarm. It is five years old
  and I have used it daily with hard tap water the whole time. It still powers on,
  the pump runs and sounds normal, and there are no leaks. A descaling kit costs a
  few euros, while a comparable machine is around €230, so I am weighing a cheap fix
  against replacing it. {DS}
focal_diagnostic_feature: After running a descaling solution through it, the flow
  returns to normal and the shot comes out fast and hot, showing the trickle was limescale
  blocking the boiler and group head, not a worn-out pump or boiler.
low_diagnostic_proposition: A senior figure asserts that espresso machines of this
  age always fail terminally and should be replaced rather than repaired.
oracle_action: ANSWER
oracle_focus: Descale the machine first; a slow, lukewarm trickle on a machine run
  for years on hard water is the classic limescale-blockage symptom, which is a cheap
  fix rather than grounds for replacement.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not act on the blanket claim that machines this age
  should be replaced. Ask whether descaling restores flow before concluding the machine
  is finished.
