  notes: 'xbase states the overnight shift, unchanged artifact, and normal counts/nulls,
    but withholds the encoder diff —

    the decisive code-mismatch fact lives only in HH/LH, so HL/LL cannot resolve it.
    The ''model not redeployed /

    counts and nulls normal'' lines neutrally close the model-change and missing-data
