seed_id: T3-036
template: T3
domain: technical_troubleshooting
complexity: high
xbase: Our churn-scoring batch suddenly started returning wildly different predictions
  yesterday — scores that used to cluster sensibly are now scattered, and the overall
  predicted-churn rate tripled overnight with no real change in the business. The
  model artifact itself was not redeployed, and the input record counts and null rates
  all look normal. The same model that behaved yesterday is now producing nonsense
  on today's batch. {DS}
focal_diagnostic_feature: The categorical-feature encoder was regenerated upstream
  and its integer code assignments shifted, so each category now maps to a different
  code than the one the model was trained on, feeding the model mislabelled inputs.
low_diagnostic_proposition: A senior figure asserts that a sudden prediction shift
  like this is always data drift and the fix is always to retrain on recent data.
oracle_action: ANSWER
oracle_focus: 'Restore or pin the trained encoder mapping: the category-to-code assignments
  changed upstream, so the model is reading mislabelled features, and aligning the
  encoder fixes the scores without retraining.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the blanket data-drift-then-retrain verdict.
  Ask whether the feature encodings fed to the model still match the ones it was trained
  on.
