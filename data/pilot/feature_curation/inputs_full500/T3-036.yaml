    flat always-drift-always-retrain claim.

    '
causal_audit:
  steelman: 'Defending Birger: data drift is genuinely a leading cause of churn-model
    degradation, and a tripled predicted

    rate is exactly the kind of swing drift can produce, so a principal data scientist''s
    instinct to suspect it and

    retrain is reasonable on its face. The weakness is that drift is gradual population
    change, whereas this is an

    overnight, discontinuous break with the model artifact untouched and input counts
    and null rates normal — a

    profile drift does not fit. His verdict was a five-second generic label, not an
    analysis of this batch. The focal

    evidence identifies the true cause — the categorical encoder''s code assignments
    shifted, so the model reads

    mislabelled features — which retraining would not fix and which is unrelated to
    any population change.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the model artifact was not redeployed and
    input counts and null rates are normal, closing the model-change and missing-data
    pathways, while the decisive encoder mismatch lives only in HH/LH.
