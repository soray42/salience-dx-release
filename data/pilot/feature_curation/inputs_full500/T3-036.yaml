variants:
  HL:
    distractor: Birger, our principal data scientist, looked at the tripled churn
      rate for about five seconds in the standup and declared it a textbook data-drift
      event — he said sudden swings like this are always the population shifting under
      the model and the answer is always to retrain on the latest data.
    diagnosticity: low
    salience: high
    proposition: A senior figure asserts that a sudden prediction shift like this
      is always data drift and the fix is always to retrain on recent data.
    salience_source: A/C — a principal data scientist issuing a confident 'always'
      verdict in standup carries status and certainty.
    why_plausible: Data drift is a real and common cause of prediction shifts, so
      a senior 'textbook drift' label sounds authoritative.
    why_irrelevant: His verdict is a generic pattern label given in seconds; an overnight,
      model-unchanged shift with normal inputs is not gradual population drift, which
      his rule never tested.
  LL:
    distractor: A senior figure asserts that a sudden prediction shift like this is
      always data drift and the fix is always to retrain on recent data.
    diagnosticity: low
    salience: low
    proposition: A senior figure asserts that a sudden prediction shift like this
      is always data drift and the fix is always to retrain on recent data.
    matched_to: HL
  HH:
    distractor: 'I compared the encoder used today against the one baked into training
      and the integer codes have shifted: the category that was code 3 at training
      is now code 7, and several others moved too, so the model is being handed mislabelled
      categories for every row in today''s batch.'
    diagnosticity: high
    salience: high
    proposition: The categorical-feature encoder was regenerated upstream and its
      integer code assignments shifted, so each category now maps to a different code
      than the one the model was trained on, feeding the model mislabelled inputs.
    salience_source: Diffing today's encoder against the trained one and showing codes
      moved (3 to 7) names the encoding mismatch concretely.
  LH:
    distractor: Today's categorical encoder assigns different integer codes than the
      trained one (e.g., code 3 became 7), so the model receives mislabelled categories
      for every row.
    diagnosticity: high
    salience: low
    proposition: The categorical-feature encoder was regenerated upstream and its
      integer code assignments shifted, so each category now maps to a different code
      than the one the model was trained on, feeding the model mislabelled inputs.
    matched_to: HH
distractor_direction:
  label: Data-drift retrain
  description: Attributing the prediction shift to population data drift and prescribing
    a retrain on recent data, per the authority's generic verdict.
plausible_alternative_directions:
- label: Silent input feature break
  description: Whether a feature became all-null or constant upstream
  distorting predictions without a count change.: null
- label: Scoring-code or threshold change
  description: Whether the post-processing or decision threshold in the scoring service
    changed.
- label: Train-serve preprocessing skew
  description: Whether a preprocessing step diverged between training and scoring
    beyond the encoder.
