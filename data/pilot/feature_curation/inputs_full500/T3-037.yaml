xbase: My fridge-freezer has been making a loud grinding noise for about a week, mostly
  at night. I had it professionally serviced two years ago and it ran quietly since
  then. The freezer still reaches temperature and nothing inside has spoiled or thawed.
  {DS}
focal_diagnostic_feature: After a manual defrost, the grinding noise stopped entirely
  because ice had accumulated around the evaporator fan blades and was causing them
  to catch.
low_diagnostic_proposition: Grinding noise on a unit this age usually indicates compressor
  wear that makes repair uneconomical.
oracle_action: ANSWER
oracle_focus: Defrost the freezer manually and inspect the evaporator fan area for
  ice buildup before condemning the compressor; the symptom is consistent with an
  iced-over fan, not imminent compressor failure.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the compressor-wear diagnosis from authority
  alone. Ask whether the freezer still cools, check for airflow obstructions and ice
  buildup around the evaporator fan before assuming an expensive repair.
