distractor_direction:
  label: Compressor failure
  description: Treating the grinding noise as evidence of a worn or failing compressor
    that makes repair uneconomical and replacement the only practical option.
plausible_alternative_directions:
- label: Defrost-cycle fault
  description: The auto-defrost heater or thermostat has failed, causing frost to
    accumulate beyond normal levels and indicating a separate component repair rather
    than a simple manual defrost.
- label: Fan motor bearing wear
  description: The evaporator fan motor's own bearings are worn independently of any
    ice buildup, producing grinding that would recur even after defrosting.
- label: Condenser fan obstruction
  description: Debris or a failing condenser fan at the rear of the unit is producing
    the noise, unrelated to the evaporator fan compartment.
