  notes: 'xbase confirms both the API contract and warehouse schema are unchanged,
    which

    is the natural pathway-closure for schema drift without naming the real cause.

    The 02:00 UTC timing detail is a symptom in xbase but does not itself reveal

    the timezone mechanism (a competent reader might think ''something happens at

    02 UTC daily'' rather than immediately inferring a CET midnight-crossing).

    Ratios: HL:LL = 1.82, HH:LH = 2.22 — both within 4:1.

    '
causal_audit:
  steelman: 'A senior data engineer could argue: API providers sometimes roll out
    schema

    changes in stages — new optional fields, changed nullability, or silently altered

    enum values — without issuing a formal contract update. The ''API contract unchanged''

    note in xbase reflects the user''s belief, not a verified schema comparison.

    Schema drift remains worth auditing before dismissing.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase explicitly states both the API contract and the
    warehouse schema are unchanged. The HH/LH finding (timezone offset causing partition
    key mismatch) provides the structural exclusion: the rejected records have valid
    fields and types — only their inferred partition key differs.'
