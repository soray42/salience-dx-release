seed_id: T3-038
template: T3
domain: technical_troubleshooting
complexity: medium
xbase: Our daily data ingestion job started failing every morning around 02:00 UTC
  two weeks ago. The job pulls event records from a third-party API and writes them
  to our data warehouse. Error logs show records being rejected at the partition-write
  step. The API contract has not changed and our schema has not been altered. {DS}
focal_diagnostic_feature: Rejected records carry timestamps in CET (UTC+1) while the
  partition writer assumes UTC, placing post-23:00 CET records into the wrong partition
  key and triggering the late-arrival rejection rule.
low_diagnostic_proposition: The failure pattern matches a classic schema drift between
  the source API fields and the warehouse table definitions.
oracle_action: ANSWER
oracle_focus: Normalise incoming timestamps to UTC at ingestion time, or adjust the
  partition-write step to handle CET-offset timestamps; add a timezone assertion to
  the ingestion contract to prevent recurrence.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the schema-drift diagnosis from authority
  alone. Compare accepted versus rejected records for systematic differences — check
  field types, timestamp formats, and timezone offsets — before auditing schema definitions.
