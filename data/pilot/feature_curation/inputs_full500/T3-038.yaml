distractor_direction:
  label: Schema drift
  description: Investigating whether the source API has quietly changed field names,
    types, or structure in a way that no longer matches the warehouse table definitions,
    causing record rejection.
plausible_alternative_directions:
- label: Late-arrival window misconfiguration
  description: The warehouse's late-arrival window setting was recently tightened,
    causing records that previously landed within tolerance to be rejected.
- label: API rate limit or partial delivery
  description: The third-party API is throttling the 02:00 UTC batch pull, delivering
    incomplete record sets that fail partition validation.
- label: Partition pruning regression
  description: A recent warehouse version update changed partition-key resolution
    behaviour, misrouting records that previously wrote cleanly.
leak_audit:
  ll_atomic_claims:
  - A data platform lead made a statement about this failure.
  - The lead characterised the pattern as classic schema drift.
  - The lead recommended auditing source fields against warehouse definitions.
  hh_atomic_claims:
  - Rejected and accepted records were compared.
  - The source API returns timestamps in local time (CET, UTC+1).
  - The partition-write step assumes UTC.
  - Records timestamped after 23:00 CET land in tomorrow's partition key.
  - Those records fail the late-arrival rejection rule.
  hl_salience_dimensions:
    source_credibility: 'A: named lead (Sigrid) with cross-company ingestion experience
      spanning dozens of failures.'
    narrative_coherence: 'B: standup setting with direct speech and action recommendation.'
    confident_assertion: 'C: ''classic schema drift'' — categorical, no hedging.'
