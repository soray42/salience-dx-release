xbase: My gas oven has stopped igniting reliably on the first two or three tries.
  After repeated clicking it eventually catches and lights. The oven is eight years
  old and the behaviour started about a month ago. My stovetop burners still light
  normally on the first click. {DS}
focal_diagnostic_feature: The igniter element fails to glow on the first two or three
  clicks before faintly appearing, identifying the igniter element itself as the faulty
  component at around £25 — not the control board.
low_diagnostic_proposition: Delayed oven ignition on a unit this age almost always
  indicates control board failure, which is seldom economic to repair.
oracle_action: ANSWER
oracle_focus: Replace the oven igniter element, which costs around £25 and is a straightforward
  swap; do not condemn the control board before testing the igniter directly.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the control-board diagnosis from authority
  alone. Ask whether the igniter element glows during a click attempt before assuming
  the more expensive component has failed.
