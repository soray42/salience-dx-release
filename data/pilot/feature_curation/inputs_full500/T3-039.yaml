    regulates

    both the spark frequency and the igniter heating element power; a partially

    failing board might intermittently send insufficient voltage to the igniter,

    causing the delayed glow the user observes. The stovetop working normally is

    not conclusive because stovetop sparkers often run on a separate circuit from

    the oven igniter within the same board.

