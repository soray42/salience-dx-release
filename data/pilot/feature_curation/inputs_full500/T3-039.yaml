distractor_direction:
  label: Control board failure
  description: Treating the delayed ignition as evidence that the oven's electronic
    control board has failed, making repair cost-prohibitive on a unit this age.
plausible_alternative_directions:
- label: Gas valve solenoid fault
  description: The oven burner's gas valve solenoid is opening slowly or intermittently,
    delaying ignition independent of the igniter's electrical function.
- label: Igniter wiring or connector fault
  description: Corroded connectors or a damaged wire between the control board and
    the igniter are causing intermittent signal loss rather than element failure.
- label: Burner port blockage
  description: Accumulated food debris or grease has partially blocked the oven burner
    ports, preventing the gas from reaching the igniter spark on the first attempt.
