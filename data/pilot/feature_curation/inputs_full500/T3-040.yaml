    '
causal_audit:
  steelman: 'A senior practitioner could argue: some credential expiry scenarios produce
    partial failures mid-batch without raising top-level errors, particularly if the
    pipeline swallows exceptions per-row. A quiet credential rotation could hit some
    shards but not others. This is a real failure mode worth checking. However, xbase
    notes a consistent loss rate of 8 to 11 percent across twelve nightly runs with
    a consistent green status — this regularity is structurally inconsistent with
    connection flapping (which produces variable gaps and typically some logged errors)
    and directly consistent with a deterministic filter condition. The focal evidence
    (schema change + NULL filter matching the gap exactly) structurally forecloses
    the credential/connectivity direction.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: Consistent 8-11% loss over twelve nights with green status
    forecloses intermittent-connection explanation without naming the actual cause.
