distractor_direction:
  label: Database connectivity or credential expiry
  description: Investigating whether a flapping connection or quietly expired database
    credential is causing partial row drops in the ETL pipeline.
plausible_alternative_directions:
- label: Upstream deduplication change
  description: The source system began deduplicating records before export
  reducing row count without raising errors.: null
- label: Partitioning boundary misalignment
  description: A time-based partition filter in the pipeline is clipping rows at the
    boundary due to a timezone or offset mismatch.
- label: Destination write idempotency collision
  description: An upsert key collision in the destination is silently overwriting
    rather than inserting new rows.
