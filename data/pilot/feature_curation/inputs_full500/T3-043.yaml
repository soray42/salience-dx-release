distractor_direction:
  label: Premium brand audio superiority
  description: Treating the premium brand's general audio reputation as decisive evidence
    that it will outperform the budget model for daily commute use.
plausible_alternative_directions:
- label: Comfort and fit comparison
  description: Earbuds worn for a long daily commute may differ significantly in ear-tip
    fit, seal quality, and wearing fatigue — a live concern not resolved by spec sheets
    alone.
- label: App and codec support
  description: EQ customisation depth and supported audio codecs (aptX, LDAC) could
    matter for sound quality beyond raw ANC figures, and this has not been investigated.
- label: Microphone call quality
  description: If the user takes calls during commute, microphone performance and
    wind rejection are separate variables that the focal ANC and battery specs do
    not address.
