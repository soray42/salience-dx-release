  - hedging_language
  xbase_word_count: 60
  hl_word_count: 34
  ll_word_count: 19
  hh_word_count: 36
  lh_word_count: 20
  notes: 'High complexity calibrated by requiring understanding of IP fragmentation,
    MTU

    path discovery, and VLAN trunk configuration — not by increased length. The

    authority''s diagnosis (duplex) is a real failure class but structurally incompatible

    with the focal evidence (fragment-specific silent drops). xbase gives the VLAN

    isolation fact (other VLANs on same uplinks unaffected) which is consistent with

    both duplex and MTU hypotheses, preserving C4.

    '
causal_audit:
  steelman: 'Duplex mismatch is a classic and genuinely common cause of intermittent
    TCP

    retransmits and packet loss on managed switches. It would be entirely reasonable

    for a senior practitioner to add it to the checklist. In some switch implementations,

    half-duplex collisions could affect only certain traffic classes or VLAN priorities

    depending on QoS configuration.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase notes that the symptom appears on this VLAN but
    not on other VLANs sharing the same uplinks. This is consistent with an MTU mismatch
    configured per-VLAN but is also consistent with a VLAN-specific QoS or ACL; it
    does not specifically foreclose duplex (which would typically be port-level).
    The focal fragment-capture evidence structurally rules out duplex: duplex mismatch
    produces late-collision errors, not silent per-VLAN IP fragment discards.'
