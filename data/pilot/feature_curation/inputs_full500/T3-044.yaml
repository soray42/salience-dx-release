distractor_direction:
  label: Duplex mismatch on host NICs
  description: Investigating whether half-duplex/full-duplex negotiation mismatch
    on host network interface cards is causing the intermittent packet loss and TCP
    retransmits.
plausible_alternative_directions:
- label: Switch port CRC or hardware error
  description: A degraded SFP module or cable on the trunk could introduce physical-layer
    errors producing intermittent drops, independent of MTU or duplex configuration.
- label: VLAN ACL or QoS policy drop
  description: An access control or QoS policy applied specifically to this VLAN could
    be rate-limiting or dropping frames silently under load.
- label: Spanning-tree topology change
  description: A spanning-tree reconfiguration event on this VLAN's segment could
    cause periodic forwarding interruptions consistent with the observed retransmit
    pattern.
leak_audit:
  ll_atomic_claims:
  - A senior network architect made the claim.
  - Duplex mismatch should be treated as the main cause of packet loss in managed
    networks.
  hh_atomic_claims:
  - Packet capture on the trunk uplink shows IP fragments being silently discarded.
  - The VLAN trunk port is configured at 1500-byte MTU.
  - The underlying physical interface has jumbo frames at 9000 bytes enabled.
  hl_salience_dimensions:
    source_credibility: Senior network architect role, named (Duc)
    narrative_coherence: Clean direct-speech delivery with professional register
    confident_assertion: said confidently, always
    concrete_detail: N/A — no case-specific diagnostic content added
  forbidden_categories_checked_against:
