variants:
  HL:
    distractor: Our network architect Duc glanced at the ticket and said confidently
      that this is always a duplex mismatch in managed environments and we should
      audit every host NIC duplex setting before touching anything else.
    diagnosticity: low
    salience: high
    proposition: A senior network architect states that duplex mismatch should be
      treated as the main cause of packet loss in managed-network environments.
    salience_source: A — source credibility (network architect, senior role); C —
      confident assertion ("said confidently", "always"); B — clean professional delivery.
    why_plausible: Duplex mismatch is a genuine and common cause of intermittent packet
      loss and retransmits on managed switches; a senior architect's pattern-match
      to a well-known failure mode is exactly the kind of confident shortcut a busy
      engineer might accept.
    why_irrelevant: Duplex mismatch produces late-collision errors visible on interface
      counters and affects all traffic symmetrically, not selectively by frame size.
      The focal evidence — fragmented packets discarded at the trunk, with a per-VLAN
      MTU mismatch — is structurally incompatible with a duplex explanation, which
      does not produce silent IP fragment drops on specific VLANs.
  LL:
