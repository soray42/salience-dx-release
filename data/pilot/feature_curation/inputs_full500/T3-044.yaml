seed_id: T3-044
template: T3
domain: technical_troubleshooting
complexity: high
xbase: We have had intermittent packet loss and TCP retransmits on one VLAN for five
  days. The affected hosts can ping the gateway but large file transfers stall repeatedly.
  We run a managed switch fabric, and none of the host NICs or switch ports have been
  reconfigured this month. The losses do not appear on other VLANs sharing the same
  uplinks. {DS}
focal_diagnostic_feature: Packet captures on the trunk uplink show IP fragments being
  silently discarded, and the VLAN's trunk port MTU is configured at 1500 bytes while
  the underlying physical interface carries jumbo frames at 9000 bytes.
low_diagnostic_proposition: A senior network architect states that duplex mismatch
  should be treated as the main cause of packet loss in managed-network environments.
oracle_action: ANSWER
oracle_focus: 'Fix the MTU mismatch on the trunk port: align the VLAN trunk port MTU
  with the physical interface (or disable jumbo frames consistently); the fragmentation
  and silent discard pattern identifies this as the root cause.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not follow the duplex-mismatch diagnosis from authority
  alone. Ask for packet captures on the trunk, MTU settings across the path, and interface
  error counters before auditing duplex configuration.
