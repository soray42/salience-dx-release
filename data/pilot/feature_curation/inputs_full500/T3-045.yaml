distractor_direction:
  label: Capacity-only purchasing rule
  description: Treating rated mAh capacity as the sole relevant factor for choosing
    between the two power banks, ignoring output wattage and port compatibility.
plausible_alternative_directions:
- label: Charging speed for phone
  description: Fast-charging protocol support (e.g., Quick Charge 3.0, PPS) for the
    phone is a separate variable that the laptop-focused wattage comparison does not
    fully resolve.
- label: Weight and size for day trips
  description: A 20,000 mAh power bank can be heavy; physical dimensions and weight
    are live considerations for a day-trip user not addressed by capacity or wattage
    specs.
