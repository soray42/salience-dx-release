causal_audit:
  steelman: 'Rated capacity is genuinely the dominant variable in most power bank
    decisions —

    for phone-only users it often is the only relevant metric. A power electronics

    professional has a reasonable basis for the rule even if it does not generalise

    to laptop charging. One could argue the 18W limit still provides some top-up

    benefit when the laptop is sleeping or at low brightness.

    '
