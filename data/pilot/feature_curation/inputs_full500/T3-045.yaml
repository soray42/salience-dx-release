    why_plausible: Capacity in mAh is the most commonly cited and genuinely important
      spec for a power bank; a hardware professional's confident summary could easily
      anchor a buyer's attention on this single metric.
    why_irrelevant: The authority's generic rule does not engage the specific use
      case of laptop charging, where output wattage — not stored capacity — determines
