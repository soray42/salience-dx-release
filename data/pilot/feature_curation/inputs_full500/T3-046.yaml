seed_id: T3-046
template: T3
domain: technical_troubleshooting
complexity: medium
xbase: Our internal DNS resolver has been timing out for roughly one in five queries
  from my workstation for the past two days. Public DNS resolvers answer instantly
  from the same machine. The company resolver serves both VLAN 10 and VLAN 20 under
  a shared firewall policy, and I have not modified any rules recently. {DS}
focal_diagnostic_feature: Queries from VLAN 20 to the same resolver all succeed; the
  VLAN 10 forwarding zone contains a stale upstream forwarder IP pointing to a decommissioned
  host.
low_diagnostic_proposition: A senior network engineer asserts that DNS timeouts in
  this environment are always caused by a firewall rule blocking port 53.
oracle_action: ASK
oracle_focus: Investigate the resolver's per-VLAN forwarding configuration; fix the
  stale forwarder IP in the VLAN 10 zone and verify that queries from VLAN 10 begin
  resolving.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the firewall-rule diagnosis from authority
  alone. Ask whether other VLANs experience the same drops and inspect the resolver's
  per-VLAN forwarding zone configuration.
