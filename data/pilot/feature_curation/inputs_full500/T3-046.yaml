distractor_direction:
  label: firewall port-53 block
  description: Investigating whether a firewall rule is blocking UDP or TCP port 53
    traffic between the workstation and the internal DNS resolver.
plausible_alternative_directions:
- label: resolver capacity saturation
  description: Checking whether the shared resolver is dropping queries under load,
    which would explain the one-in-five timeout rate.
- label: DHCP-assigned DNS mismatch
  description: Verifying that VLAN 10's DHCP configuration points workstations to
    the correct resolver address and not a stale or secondary IP.
- label: NIC or OS resolver timeout
  description: Investigating whether the workstation's OS resolver is configured with
    an aggressive timeout or retry policy that masks intermittent drops.
