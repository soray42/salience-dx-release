domain: open_qa
complexity: medium
xbase: I'm planning a two-week trip across a few countries and deciding whether to
  book a rail pass or buy individual point-to-point train tickets as I go. I have
  a rough route in mind but the dates of some legs are still flexible. I would rather
  not overpay, and I do not enjoy the stress of locking everything in months ahead.
  I have to decide which way to go before I start booking. {DS}
focal_diagnostic_feature: For the user's specific planned legs, the total of the cheapest
  advance point-to-point fares is well under half the price of the rail pass, even
  before counting the pass's mandatory seat-reservation surcharges.
low_diagnostic_proposition: A senior travel-industry figure asserts that rail passes
  are the obvious choice for any multi-country European rail trip.
oracle_action: ANSWER
oracle_focus: Buy point-to-point tickets for these legs; the advance fares total well
  under half the pass price even before the pass's reservation surcharges, so the
  pass is not worth it for this itinerary.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the blanket 'pass is always best' rule.
  Ask for the actual per-leg advance fares versus the pass price plus its mandatory
  reservation surcharges for this route.
