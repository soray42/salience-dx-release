variants:
  HL:
    distractor: Our principal engineer cut in at the incident review and said, with
      the authority of someone who has run big clusters for years, that this is the
      classic signature of an under-provisioned cluster and we should just add nodes
      — he did not look at the table at all.
    diagnosticity: low
    salience: high
    proposition: A principal engineer asserts that this kind of slowness is a classic
      under-provisioning problem and the cluster needs more nodes.
    salience_source: A/C — a principal engineer with deep cluster experience confidently
      pattern-matches to under-provisioning, lending status weight.
    why_plausible: Slow reads under growth do often mean a cluster needs more capacity,
      so a senior 'classic under-provisioning' call is easy to follow.
    why_irrelevant: The cluster is healthy and balanced with no resource saturation;
      the slowness is confined to one access pattern, which capacity cannot explain
      — adding nodes does not shrink an oversized partition.
  LL:
    distractor: A senior engineer stated that this slowness is a classic under-provisioning
      problem and the cluster needs more nodes.
    diagnosticity: low
    salience: low
    proposition: A principal engineer asserts that this kind of slowness is a classic
      under-provisioning problem and the cluster needs more nodes.
    matched_to: HL
  HH:
    distractor: The activity table's partition key is just user_id, so each user's
      partition grows without bound as their history accumulates; the users who are
      slow have partitions in the hundreds of megabytes, and the read has to scan
      that whole partition to return recent rows.
    diagnosticity: high
    salience: high
    proposition: The activity table uses a partition key of user_id alone, so each
      user's partition grows unbounded over time; the slow users have partitions of
      hundreds of megabytes that the read must scan.
    salience_source: Concrete model flaw (user_id-only key, unbounded partitions,
      hundreds of MB scanned) makes the cause precise.
  LH:
    distractor: The table's partition key is user_id alone, so partitions grow unbounded;
      slow users have hundreds-of-megabyte partitions the read must scan.
    diagnosticity: high
    salience: low
    proposition: The activity table uses a partition key of user_id alone, so each
      user's partition grows unbounded over time; the slow users have partitions of
      hundreds of megabytes that the read must scan.
    matched_to: HH
distractor_direction:
  label: Cluster under-provisioning
  description: Investigating whether the cluster lacks capacity and adding nodes is
    the fix, per a senior engineer's assertion.
plausible_alternative_directions:
- label: Tombstone accumulation
  description: Whether deletes have left tombstones that the slow read must skip over.
- label: Read-repair or consistency cost
  description: Whether the consistency level or read repair is adding latency to that
    path.
