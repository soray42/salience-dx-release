causal_audit:
  steelman: 'A senior engineer would note that growing data and slow reads can genuinely
    mean a cluster is out of headroom,

    and adding nodes is a standard remedy, so the under-provisioning call is not unreasonable
    on its face. But it is

    generic pattern-matching that ignores this case: the cluster is healthy and balanced
    with no saturation, and the

    slowness is confined to a single access pattern. The real cause is a data-model
    flaw — user_id-only partitions

    growing into hundreds of megabytes — and adding nodes does not shrink an oversized
    partition or speed a scan of

    it. Capacity has no mechanism to fix this case.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the cluster is healthy and balanced with no
    dropped messages or compaction backlog, foreclosing the resource-saturation pathway
    the under-provisioning claim relies on; the decisive partition-key flaw lives
    only in HH/LH.
