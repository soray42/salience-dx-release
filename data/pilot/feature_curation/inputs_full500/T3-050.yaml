  - hedging_language
  xbase_word_count: 71
  hl_word_count: 44
  ll_word_count: 18
  hh_word_count: 44
  lh_word_count: 17
  notes: 'xbase closes streaming-replication path (replication between primary and
    standby is fine) without naming the root cause — neutrally rules out one tempting
    mechanism (replication lag) without supplying the affirmative cause. HL adds only
    source identity and setting. Checked: HH/LH atomic diff passes. Index bloat steelman:
    bloat causes I/O amplification but exits non-zero identically on every segment
    rather than causing slow/delayed writes — not a defensible mechanism.

    '
causal_audit:
  steelman: 'A senior DBA could argue: severe index bloat on a busy primary means
    vacuum and autovacuum are churning gigabytes of dirty pages through shared_buffers,
    saturating wal_writer and bgwriter I/O. If the archive_command is a cp or rsync
    to a slow destination, it could hit a shell timeout, exiting non-zero. This is
    a real operational pattern in heavily bloated databases.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: The primary is healthy and serving queries normally — no
    I/O saturation signal; also, archive_command fails on every segment consistently
    rather than intermittently, which is not the signature of saturation-induced timeouts.
