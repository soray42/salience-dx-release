  - The directory permission mode is 755.
  - The postgres OS user has no write permission to the directory.
  - This explains a clean permission-denied exit on every WAL segment.
  hl_salience_dimensions:
    source_credibility: Twelve-year DBA, named (Radovan), professional setting (incident
      review).
    narrative_coherence: Clean incident-review context, past-tense causal account.
    confident_assertion: '''Always traced back'' — unhedged universal.'
    concrete_detail: N/A — no case-content detail added.
  forbidden_categories_checked_against:
  - tunable_value
