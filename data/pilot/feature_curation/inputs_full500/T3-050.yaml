variants:
  HL:
    distractor: Radovan, a DBA with twelve years of PostgreSQL production experience,
      told me at our last incident review that WAL archiving failures at his company
      always traced back to index bloat generating enough dirty I/O to starve the
      archiver process.
    diagnosticity: low
    salience: high
    proposition: WAL archiving failures are caused by index bloat consuming I/O bandwidth
      on the primary.
    salience_source: 'A: source credibility (twelve-year DBA); B: clean chronology
      (incident review setting); C: confident assertion (always traced back).'
    why_plausible: Index bloat causing I/O pressure is a real PostgreSQL operational
      problem, and a veteran DBA linking it to archiver starvation sounds authoritative.
    why_irrelevant: The archive_command itself exits non-zero on every attempt, which
      is a direct write or permission failure; I/O starvation would cause delays and
      timeouts, not clean non-zero exits on every segment. The primary is healthy
      and queries run normally.
  LL:
    distractor: Someone said WAL archiving failures are generally caused by index
      bloat creating I/O pressure on the primary.
    diagnosticity: low
    salience: low
    proposition: WAL archiving failures are caused by index bloat consuming I/O bandwidth
      on the primary.
    matched_to: HL
  HH:
    distractor: I ran ls -la on the archive destination and the directory is owned
      by root:root with mode 755 — the postgres user has no write permission there,
      which would explain a clean permission-denied exit on every WAL segment.
    diagnosticity: high
    salience: high
    proposition: The archive destination directory is owned by root:root with mode
      755, so the postgres OS user cannot write to it.
    salience_source: 'B: precise command output cited; C: direct causal link stated
      (which would explain a clean permission-denied exit).'
  LH:
    distractor: The archive directory is owned by root:root with mode 755, so the
      postgres user lacks write permission.
    diagnosticity: high
    salience: low
    proposition: The archive destination directory is owned by root:root with mode
      755, so the postgres OS user cannot write to it.
    matched_to: HH
distractor_direction:
  label: Index bloat I/O starvation
  description: Investigating whether index bloat on the primary is generating enough
    dirty-page I/O to starve the WAL archiver process, preventing segments from being
    copied.
plausible_alternative_directions:
- label: Archive destination disk full
  description: The archive target filesystem has exhausted free space, causing every
    write attempt to fail.
- label: archive_command path error
  description: The shell command string references a wrong or non-existent binary
    or destination path, producing a non-zero exit.
- label: Network mount unavailable
  description: The archive destination is a remote NFS or CIFS mount that has become
    unreachable, causing write failures.
