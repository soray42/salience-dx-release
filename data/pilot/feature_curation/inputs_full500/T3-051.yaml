domain: open_qa
complexity: medium
xbase: I am planning a week-long island-hopping trip through the Greek islands, arriving
  by ferry between five different stops. I need to book internal ferries between islands
  on specific days because the boat schedule is fixed and some crossings run only
  once daily. I am comparing a flexible open-jaw flight routing versus a rigid return
  ticket to the same hub. {DS}
focal_diagnostic_feature: The open-jaw routing lands the user on the correct starting
  island and departs from the final island, eliminating two extra ferry legs; the
  return-to-hub ticket would require a six-hour backtrack on the penultimate day,
  conflicting with the only same-day ferry to the departure port.
low_diagnostic_proposition: For Mediterranean island trips, a return ticket to the
  same hub is simpler and avoids getting stranded by open-jaw logistics.
oracle_action: ANSWER
oracle_focus: Book the open-jaw routing; the fixed ferry schedule makes the return-to-hub
  ticket logistically unworkable for the planned itinerary, and the open-jaw removes
  the six-hour backtrack.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the return-ticket preference from authority
  alone; ask for the detailed ferry schedule, the backtrack distance and time, and
  whether missing the penultimate ferry is a risk.
