    serving Greek islands have genuinely higher cancellation rates, and if the opening
    leg is cancelled the traveller is stranded on the wrong island with no ferry fallback
    to their planned start. The return-ticket structure keeps at least one end of
    the journey on a more trafficked route.

    '
