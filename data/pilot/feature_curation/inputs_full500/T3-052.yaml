distractor_direction:
  label: Network partition on node addition
  description: Investigating whether adding the third data node triggered a network
    partition or gossip quorum disruption that prevents shard allocation from completing.
plausible_alternative_directions:
- label: Shard replica count mismatch
  description: The index replica count may exceed the number of eligible nodes after
    the new node joins with different attributes, causing the allocator to refuse
    placement.
- label: Allocation filter misconfiguration
  description: Index-level or cluster-level include/exclude allocation filters could
    be blocking placement on certain nodes independently of disk or network state.
- label: Recovery throttle saturation
  description: The shard recovery rate limit may be saturated by concurrent initialisation,
    stalling the remaining shards without producing a true allocation failure.
