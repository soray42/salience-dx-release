causal_audit:
  steelman: 'A wealth coach might defend the rule: over long horizons, buying often
    does beat renting because mortgage

    principal builds equity while rent does not, and a confident senior colleague
    invoking that pattern is not

    obviously wrong in the general case. But the rule is exactly that — general —
    and its validity depends entirely

    on the holding period, which it never examines. The focal fact is a non-renewable
    two-year posting with a

    required return home, fixing the horizon at two years; over that span the round-trip
    transaction costs of buying

    and selling almost certainly exceed any equity built or appreciation captured.
    The blanket maxim engages none of

    the user''s actual situation, so it has no defensible application to this case.

    '
