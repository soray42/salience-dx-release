xbase: I'm deciding whether to rent or buy a home in the city I just moved to for
  a fixed-term contract. Buying is possible because I have a deposit saved, and prices
  here are not unreasonable. Renting is straightforward and flexible. I keep going
  back and forth because both options seem defensible, and I want to make the choice
  that actually fits my situation rather than a general rule. {DS}
