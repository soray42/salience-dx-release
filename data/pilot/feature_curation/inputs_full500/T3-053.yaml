  horizon.
low_diagnostic_proposition: A senior colleague says renting is always throwing money
  away and that buying is the only sensible choice.
oracle_action: ANSWER
oracle_focus: Rent; a fixed, non-renewable two-year horizon with a required return
  home is far too short to recover buying and selling transaction costs, so renting
  fits the user's actual time in the city.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the blanket renting-is-wasted-money rule.
