    why_plausible: State-file corruption is a real failure mode for infrastructure
      tools, so a senior voice naming it sounds credible.
    why_irrelevant: Corruption would fail regardless of who runs the change, but the
      same change succeeds with engineer credentials, isolating the fault to the CI
      account's permissions.
