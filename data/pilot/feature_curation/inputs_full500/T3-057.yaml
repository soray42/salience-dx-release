distractor_direction:
  label: buy-always heuristic
  description: Treating the decision as settled by the general principle that owning
    always beats renting, based on authority from a property professional.
plausible_alternative_directions:
- label: tenure length risk
  description: Three years might be enough to build equity in an appreciating market,
    making purchase viable depending on transaction costs.
- label: mortgage-rate sensitivity
  description: The buy/rent calculus shifts substantially with interest-rate changes;
    current fixed-rate terms deserve scrutiny.
- label: opportunity cost of deposit
  description: The deposit deployed elsewhere could yield returns that change the
    comparison, depending on investment alternatives.
