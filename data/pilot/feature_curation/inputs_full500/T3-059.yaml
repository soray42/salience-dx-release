xbase: I have been making fresh pasta at home and the result is always too thick —
  the sheets do not get thin enough to cook through properly, and the texture is dense
  after boiling. I follow the recipe for timing and dough stiffness, the dough feels
  right to me, and I am using my manual pasta machine. I want to understand why the
  final pasta is dense and too thick. {DS}
