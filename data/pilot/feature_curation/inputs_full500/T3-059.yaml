causal_audit:
  steelman: 'A Bologna-trained instructor is right that hydration ratio affects dough

    stiffness and rollability: too much flour creates a tight gluten network

    that resists extension, and home bakers routinely add more flour than

    needed when the dough feels sticky. A stiff dough at the same machine

    setting would produce thicker sheets than a soft dough, and the expert''s

    pattern-match to the commonest home-pasta error carries real weight. The

    seed is clean, however, because the decisive mechanical fact is that the

    thickness dial never moved beyond position 1. A pasta machine at its

    widest setting produces thick sheets regardless of how soft or supple the

    dough is — the roller gap is a physical constraint, not a dough-chemistry

    variable. Changing the hydration ratio while leaving the dial at position 1

    cannot produce the thin sheets the recipe requires.

    '
