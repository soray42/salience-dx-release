distractor_direction:
  label: Broker partition undercount
  description: Investigating whether the topic's twelve partitions are insufficient
    for the ingestion throughput, causing the broker to drop events under peak load.
plausible_alternative_directions:
- label: Producer batch misconfiguration
  description: Whether the producer is sending batches that exceed partition buffer
    limits, causing the broker to discard events before they are persisted.
- label: Retention policy overflow
  description: Whether the topic's retention size or time limit is being hit under
    peak load, causing older events to be dropped before consumers can read them.
- label: Network congestion on consumer path
  description: Whether the network path between the broker and consumer is congested
    during peak load, slowing delivery without affecting broker-side metrics.
