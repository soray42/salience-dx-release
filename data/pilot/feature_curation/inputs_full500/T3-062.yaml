causal_audit:
  steelman: 'Connection-pool exhaustion causing queued requests is a textbook explanation

    for a service-wide p99 spike with stable load and no code changes: if something

    external reduced pool slots (a config change, GC pause on the pool manager,

    or a leaked connection pattern), every request would wait for a connection and

    all percentiles would rise uniformly. The uniform percentile shift xbase

    describes is consistent with pool queuing. A principal SRE pattern-matching

    from a latency graph is exercising legitimate domain knowledge, not making

    an unfounded claim.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase records that connection pool utilisation remained
    below 40 percent throughout the affected window, directly foreclosing pool exhaustion
    as a mechanism: a pool with substantial headroom cannot produce queuing-driven
    latency spikes regardless of request rate.'
