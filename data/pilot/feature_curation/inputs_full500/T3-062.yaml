distractor_direction:
  label: Connection-pool exhaustion
  description: Investigating whether the payment-processing service's connection pool
    to a database or downstream service is exhausted or undersized, causing requests
    to queue and producing the observed uniform p99 latency increase.
plausible_alternative_directions:
- label: Downstream database slowdown
  description: The primary database serving the payment service degraded around the
    same time, adding latency to every query and raising all percentiles uniformly.
- label: Infrastructure change outside deploy log
  description: A network, load-balancer, or TLS certificate change that bypassed the
    deployment pipeline is adding latency to every outbound call from the service.
- label: GC pressure or JVM heap issue
  description: Increased GC activity or a memory pressure event on the service's JVM
    is pausing request processing across all percentiles simultaneously.
