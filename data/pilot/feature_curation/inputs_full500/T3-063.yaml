xbase: I over-salted a large pot of vegetable soup this afternoon and it tastes unpleasantly
  salty throughout. I have about three hours before guests arrive, and there is still
  room in the pot to add volume. Several common remedies I have seen described online
  contradict each other. {DS}
focal_diagnostic_feature: Food-science sources confirm that raw potatoes do not selectively
  remove dissolved salt from liquid; the only reliable fixes at this salt level are
  diluting with unsalted stock or broth, or adding cream or starch to blunt the perceived
  saltiness.
low_diagnostic_proposition: An experienced cook stated that the standard fix is to
  add raw peeled potatoes to the pot, which draw out excess salt.
oracle_action: ANSWER
oracle_focus: Dilute the soup by adding unsalted vegetable stock or water to the pot
  until the saltiness becomes acceptable, and adjust other seasonings afterward; the
  potato method does not work at the scale of a large pot.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the potato remedy on authority alone; ask
