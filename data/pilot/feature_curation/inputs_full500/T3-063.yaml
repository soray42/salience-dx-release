causal_audit:
  steelman: 'Potatoes are porous starchy vegetables that absorb liquid when cooked.

    Osmosis — net movement of water toward higher solute concentration —

    could in principle draw salt from the surrounding broth into the potato.

    A professional cook with decades of experience who endorses this remedy

    may have observed (or believed they observed) saltiness reduction after

    adding potatoes, which would be consistent with a real effect. The remedy

    is repeated so widely that it may have some empirical basis in anecdotal

    observation even if the mechanism is weak.

