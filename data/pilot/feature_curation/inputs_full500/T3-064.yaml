distractor_direction:
  label: JVM GC pause tuning
  description: Investigating whether stop-the-world garbage-collection pauses in the
    JVM are causing the observed p99 latency spikes and whether GC configuration should
    be the first fix.
plausible_alternative_directions:
- label: Upstream replica saturation
  description: The upstream recommendation index itself may be overloaded or slow
    during bursts, causing connection waits that are unrelated to local pool configuration.
- label: Query fan-out amplification
  description: Each burst request may fan out to many upstream calls, exhausting the
    pool through volume rather than pool misconfiguration.
- label: Load-balancer misconfiguration
  description: The load balancer may be routing an uneven share of burst traffic to
    one replica, creating local pool saturation that appears service-wide.
leak_audit:
  ll_atomic_claims:
  - The latency spike matches a classic JVM GC pause pattern.
  - The garbage collector should be tuned first.
  hh_atomic_claims:
  - During spike windows the connection pool shows zero available slots.
  - Distributed traces confirm requests are stalling at the TCP connect step.
  - The stall occurs before entering the JVM.
  hl_salience_dimensions:
