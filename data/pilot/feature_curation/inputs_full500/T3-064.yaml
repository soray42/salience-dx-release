seed_id: T3-064
template: T3
domain: technical_troubleshooting
complexity: high
xbase: Our Java microservice that handles recommendation queries has had p99 latency
  spike from about 80 ms to over 900 ms during load bursts for the past three days.
  All three replicas are affected equally. The service calls one upstream recommendation
  index through a shared HTTP connection pool. {DS}
focal_diagnostic_feature: During every spike window, the connection pool to the upstream
  index reports zero available slots and all pending requests stall at the TCP connect
  phase.
low_diagnostic_proposition: The latency spike matches a classic JVM garbage-collection
  pause pattern and the garbage collector should be tuned first.
oracle_action: ASK
oracle_focus: 'Investigate the HTTP connection pool to the upstream index: check pool-size
  configuration, pool exhaustion metrics, upstream response time, and connection timeout
  settings during bursts.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the GC-pause diagnosis on authority alone.
  Ask for connection-pool metrics, distributed traces showing where requests stall,
  and JVM GC logs before recommending any GC tuning.
