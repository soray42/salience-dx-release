  notes: 'Removed "Garbage collection logs look clean across all replicas" from xbase
    because

    it let a practitioner reject the GC distractor from xbase alone (C4 violation).

    The GC mechanism is ruled out only by HH/LH (TCP connect stall + healthy collector

    confirmed by traces). Distractor is "classic JVM GC pause" — an entirely different

    mechanism from the real cause (pool exhaustion at TCP layer). Vimalraj''s generic

    pattern-match ("always") and lack of engagement with pool metrics is the T3 signal.

    Em-dash in HL counted as whitespace separator per C9.

    '
causal_audit:
  steelman: 'A senior practitioner could reasonably argue: JVM full-GC events cause
    stop-the-world

    pauses of hundreds of milliseconds; under load this manifests as p99 spikes affecting

    all replicas simultaneously. A 80ms→900ms spike with all three replicas affected

    equally is exactly the signature of a JVM-wide pause, not a per-connection issue.

    Pool exhaustion would typically cause queueing delay, not a clean stop-the-world

    pattern. Tuning GC (generation sizes, collector choice, pause targets) is a

    well-established first step for latency-sensitive Java services.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — GC pathway is not pre-closed in xbase; it is ruled
    out only by the focal evidence in HH/LH (requests stall at TCP connect, before
    JVM processing).
