variants:
  HL:
    distractor: Vimalraj, our principal SRE who came from a large e-commerce platform,
      pulled up the latency graph and told the team this is a classic JVM GC pause
      pattern — he said he has seen it dozens of times and we should tune the garbage
      collector first.
    diagnosticity: low
    salience: high
    proposition: The latency spike matches a classic JVM garbage-collection pause
      pattern and the garbage collector should be tuned first.
    salience_source: 'A — source credibility: principal SRE with named prior company;
      B — narrative coherence: clean chronology of Vimalraj inspecting the graph and
      addressing the team; C — confident assertion: told the team, seen it dozens
      of times.'
    why_plausible: JVM GC pauses are a well-known cause of p99 latency spikes in Java
      services; a principal SRE citing prior experience with the identical symptom
      pattern is exactly the kind of signal a team under pressure might defer to.
    why_irrelevant: GC pauses are stop-the-world events inside the JVM; they cannot
      cause stalls at the TCP connection-establishment step before any application
      code runs. The focal evidence shows requests waiting at TCP connect, which GC
      tuning cannot address.
