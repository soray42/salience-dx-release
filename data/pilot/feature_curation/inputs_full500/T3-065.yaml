  steelman: 'A coach could argue that cardio-first is defensible: a light aerobic
    warm-up raises core temperature and primes

    the cardiovascular system, and many general-fitness programs do sequence conditioning
    before resistance work.

    The prescription is a real coaching position in some contexts. But it does not
    engage THIS user''s situation: the

    user''s explicit priority is maximal strength on the big lifts, and exercise-order
    research and the user''s own log

    agree that pre-lifting cardio blunts working-set output — here by a measured 12%.
    An authority''s blanket rule

    asserted without reference to the strength goal or the user''s data has no mechanism
    to make cardio-first the right

    choice for this person. The rule is generic pattern-matching, not analysis of
    this case.

    '
