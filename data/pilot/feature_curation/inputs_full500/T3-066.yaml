  notes: 'LL carries the expired-pinned-certificate assertion plus the whole-story
    framing already present in HL;

    Petros''s name, role, and standup framing are HL-only and about the source. xbase
    states the symptom

    (app-only TLS failure after renewal, browsers fine, chain valid) but withholds
    what the app pins, so

    HL/LL cannot resolve it. The decisive pin-old-leaf-key fact lives only in HH/LH.
    xbase noting the chain

    is valid is symptom context, not the affirmative cause. LL lengthened from 11
    to 19 words by including

    the expiry-as-complete-explanation clause already present in HL content.

    '
causal_audit:
  steelman: 'A principal engineer could argue an expired pinned certificate is the
    textbook cause: many apps hard-code a

    certificate or its hash, and when that certificate lapses the app refuses every
    connection, exactly the

    all-or-nothing failure seen here. Pinning-and-expiry incidents are real and common.
    But the diagnosis is generic

    pattern-matching, not analysis of this case: xbase states the certificate was
    renewed on schedule, so nothing

    expired, and the focal evidence shows the app pins the old leaf''s key while the
    renewal minted a new one — a

    fresh-key mismatch, not an expiry. The expired-certificate framing has no mechanism
    here because the certificate

    is current; the engineer simply named a familiar pattern without engaging the
    renewal detail.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the new certificate chains correctly to a
    trusted root and the failure followed a routine renewal, foreclosing an expiry
    explanation while leaving the pin target unstated; the decisive pinned-old-key
    fact lives only in HH/LH.
