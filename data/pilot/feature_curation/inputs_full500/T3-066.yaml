  - Last night's renewal issued a new leaf with a new key.
  - The pin no longer matches, so the app rejects the handshake even though the chain
    validates.
  hl_salience_dimensions:
    source_credibility: Principal mobile engineer (Petros) pattern-matching to a class
      of failure.
    narrative_coherence: Coherent appeal to failures he's seen take down apps before.
    confident_assertion: Said with total confidence ... the whole story — confident,
      unhedged.
