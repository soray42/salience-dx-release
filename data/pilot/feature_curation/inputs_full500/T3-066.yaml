variants:
  HL:
    distractor: Petros, our principal mobile engineer, looked at it for a moment in
      standup and said with total confidence that this is the classic expired-pinned-certificate
      problem, the kind he's seen take down apps before, and that we should treat
      the expiry as the whole story.
    diagnosticity: low
    salience: high
    proposition: A senior engineer asserts that this is a classic expired-pinned-certificate
      problem.
    salience_source: A — a principal mobile engineer pattern-matching confidently
      to a class of failure lends status and authority.
    why_plausible: Pinning failures around certificate lifecycle are common, and a
      principal engineer naming a classic pattern sounds authoritative.
    why_irrelevant: The old certificate did not expire; it was renewed, and the renewal
      minted a new key, so the failure is a pin-versus-new-key mismatch, not an expiry.
  LL:
    distractor: A senior engineer asserts that this is a classic expired-pinned-certificate
      problem and that the expiry is the complete explanation.
    diagnosticity: low
    salience: low
    proposition: A senior engineer asserts that this is a classic expired-pinned-certificate
      problem.
    matched_to: HL
  HH:
    distractor: 'I checked what the app actually pins: it''s the public-key hash of
      the previous leaf certificate. Last night''s renewal issued a brand-new leaf
      with a new key, so the pin no longer matches, and the app rejects the handshake
      even though the chain validates to the trusted root.'
    diagnosticity: high
    salience: high
    proposition: The app pins the previous leaf certificate's public-key hash, and
      last night's renewal issued a new leaf with a new key, so the pin no longer
      matches even though the chain is otherwise valid.
    salience_source: Concrete inspection of what the app pins versus the renewed key
      makes the mismatch precise and observable.
  LH:
    distractor: The app pins the old leaf's public-key hash; the renewal issued a
      new key, so the pin no longer matches though the chain validates.
    diagnosticity: high
    salience: low
    proposition: The app pins the previous leaf certificate's public-key hash, and
      last night's renewal issued a new leaf with a new key, so the pin no longer
      matches even though the chain is otherwise valid.
    matched_to: HH
distractor_direction:
  label: Expired pinned certificate
  description: Investigating whether the pinned certificate expired, on the theory
    that an expiry is what broke the app's secure connection.
plausible_alternative_directions:
- label: New cipher or TLS version
  description: Whether the renewal changed negotiated TLS parameters the app cannot
    handle.
- label: Hostname or SAN change
  description: Whether the renewed certificate covers a different name than the app
    expects.
