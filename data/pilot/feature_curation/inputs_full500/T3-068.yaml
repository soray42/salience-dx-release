distractor_direction:
  label: Clock drift / NTP misconfiguration
  description: Treating the TLS certificate verify errors as caused by pod system
    clocks deviating enough to fall outside the certificate's validity window.
plausible_alternative_directions:
- label: Certificate revocation mismatch
  description: Investigating whether the gateway certificate was recently rotated
    and the new certificate's serial is flagged differently in the pod environment.
- label: SNI or hostname mismatch
  description: Checking whether the production pods present a different server name
    indication that does not match the certificate's SAN entries.
- label: Trust store path misconfiguration
  description: Examining whether the pods' TLS library is reading from a different
    trust store path than expected, causing it to miss all CA certificates.
