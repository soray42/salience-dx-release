causal_audit:
  steelman: 'Clock drift is the canonical first explanation for ''certificate verify
    failed'': if the pod''s system clock is ahead or behind by more than the certificate
    validity window, the cert appears expired or not-yet-valid. A head of security
    who has seen dozens of these would reasonably recommend NTP first. The asymmetric
    failure (pod fails, laptop works) could be explained if pods and laptop were on
    different NTP pools with different drift.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: Production pods are synchronized to the same NTP pool as
    the developer laptops, ruling out pod-specific clock drift as the cause of the
    asymmetric failure.
