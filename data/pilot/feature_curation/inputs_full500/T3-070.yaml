seed_id: T3-070
template: T3
domain: technical_troubleshooting
complexity: medium
xbase: Our internal API gateway has been returning 401 Unauthorized on about 20 percent
  of requests for the past three days. The service uses LDAP to authenticate users
  against our company directory. I have not changed the gateway configuration or deployed
  anything new. The errors are spread across different users and endpoints, not concentrated
  on one account or path. The LDAP service is reachable from the gateway and the bind
  attempt returns an application-layer error rather than a connection timeout. {DS}
focal_diagnostic_feature: The LDAP bind service account password expired three days
  ago, and the bind itself fails with an invalid-credentials error before any user
  lookup runs.
low_diagnostic_proposition: LDAP 401 spikes at a gateway are typically caused by a
  firewall ACL change blocking the LDAP port.
oracle_action: ANSWER
oracle_focus: Reset the LDAP bind service account password and update it in the gateway
  credential store; the bind account expiry is the direct cause of authentication
  failures across all users.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a firewall ACL change from the authority's
  pattern alone. Ask for the LDAP bind account status, password expiry, and the specific
  error the bind returns before investigating network access.
