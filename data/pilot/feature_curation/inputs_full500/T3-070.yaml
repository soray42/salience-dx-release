  xbase_word_count: 79
  hl_word_count: 41
  ll_word_count: 19
  hh_word_count: 31
  lh_word_count: 22
  notes: 'HL adds Thanos''s name, role, the "dozen times" source-experience claim,
    and the

    immediate-alert-response setting — all source/setting, no case content. The

    account name svc-apigw-bind in HH is a concrete identifier but the key claims

    (expiry timing, error string, pre-lookup failure) are fully captured in LH.

    The firewall distractor is structurally ruled out by the "invalid credentials"

    error: a port block produces a network-layer error, not an LDAP bind rejection.

    '
causal_audit:
  steelman: 'A principal infrastructure architect with repeated LDAP experience is
    right that

    firewall ACL changes are a common cause of sudden LDAP connectivity failures.

    If the ACL change blocked the port after the connection was already open, or if

    the keep-alive masked a port block briefly, there could be intermittent partial

    failures. The 20% rate (not 100%) could be consistent with a race between cached

    connections and new ones hitting the block.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states "the LDAP service is reachable from the gateway
    and the bind attempt returns an application-layer error rather than a connection
    timeout" — this neutrally forecloses the firewall/port-block mechanism (which
    would produce a network-layer connection error or timeout, not an application-layer
    error) without naming the bind-credential expiry cause.
