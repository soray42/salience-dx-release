    salience_source: B/C — concrete account identifier (svc-apigw-bind), exact timing
      match ("precisely three days ago"), specific error string ("invalid credentials"),
      and mechanism detail ("before any user lookup starts") make this vivid and decisive.
  LH:
    distractor: The LDAP bind service account password expired three days ago; the
