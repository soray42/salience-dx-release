    matched_to: HH
distractor_direction:
  label: firewall ACL blocking LDAP port
  description: Investigating whether a firewall or network ACL change has blocked
    the LDAP port, preventing the gateway from reaching the directory service.
plausible_alternative_directions:
- label: individual user account lockout
  description: A wave of failed login attempts may have locked multiple user accounts
    in the directory, causing 401s for those specific users.
- label: LDAP schema or attribute change
  description: A recent change to directory attributes or schema could cause the gateway
    to fail parsing authentication responses for some users.
- label: gateway certificate or TLS change
  description: If the LDAP connection uses TLS, a certificate issue on the directory
    side could disrupt the bind for the gateway.
leak_audit:
  ll_atomic_claims:
  - LDAP 401 spikes at a gateway are typically caused by a firewall ACL change.
  - A senior colleague stated this as the likely cause.
  hh_atomic_claims:
  - The gateway bind service account is svc-apigw-bind.
  - The account password expired precisely three days ago.
  - Three days ago is the same day the 401s began.
  - The bind fails with an invalid-credentials error.
  - The bind fails before any user lookup starts.
  hl_salience_dimensions:
    source_credibility: Named principal infrastructure architect (Thanos) at the user's
      company.
    narrative_coherence: Clean sequence — architect immediately examines the alert,
      connects it to prior experience, issues confident diagnosis.
    confident_assertion: '''almost always a firewall ACL change'' with a claimed dozen
      prior cases'
    concrete_detail: '''looked at the alert immediately'' — anchors the source''s
      engagement'
