variants:
  HL:
    distractor: Thanos, our principal infrastructure architect, looked at the alert
      immediately and said he has seen this pattern a dozen times — in his experience,
      sudden LDAP 401 spikes at the gateway are almost always a firewall ACL change
      blocking the LDAP port.
    diagnosticity: low
    salience: high
    proposition: LDAP 401 spikes at a gateway are typically caused by a firewall ACL
      change blocking the LDAP port.
    salience_source: A/B/C — named principal infrastructure architect (Thanos), claimed
      repeated pattern-experience ("seen this pattern a dozen times"), immediate response
      to the alert lending narrative coherence, confident assertion ("almost always").
    why_plausible: A firewall rule blocking the LDAP port would indeed prevent authentication
      entirely and is a real, common cause of gateway auth failures that a senior
      architect would legitimately raise.
    why_irrelevant: If LDAP port access were blocked by firewall, the bind attempt
      would time out or be refused at the network layer; the focal evidence shows
      the LDAP server is reachable but returns an invalid-credentials error for the
      bind itself, which is an application-layer failure incompatible with a firewall
      block.
  LL:
    distractor: A senior colleague stated that LDAP 401 spikes at a gateway are typically
