xbase: My son is choosing between two after-school enrichment subscriptions for the
  year. One is a coding club and one is a competitive maths circle, and they cost
  about the same. He is genuinely keen on both in the abstract. We can only afford
  one, and I want him to actually stick with it rather than drop out by November like
  last year. I want to make this choice for the right reasons. {DS}
focal_diagnostic_feature: The maths circle runs as timed competitive ranking each
