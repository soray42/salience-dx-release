    matched_to: HH
distractor_direction:
  label: Global node-memory pressure
  description: Investigating whether the EC2 host nodes are running out of total memory
    and evicting pods as a result of node-level resource exhaustion rather than per-pod
    limit violations.
plausible_alternative_directions:
- label: ResourceQuota limit hit
  description: The namespace ResourceQuota may be capping total memory and causing
    evictions when aggregate consumption approaches the quota ceiling.
- label: Memory leak in dependent service
  description: A sidecar or init container in the deployment could be leaking memory
    and contributing to the OOMKilled exit without appearing in the main container's
    heap profiling.
- label: Horizontal scaling misconfiguration
  description: The deployment's HorizontalPodAutoscaler may be failing to scale out,
    concentrating load on a fixed number of pods that then exhaust their limits.
