seed_id: T3-072
template: T3
domain: technical_troubleshooting
complexity: high
xbase: Our Kubernetes cluster has been evicting pods from one particular deployment
  every few hours. The evictions started three days ago without any code change. The
  namespace has a ResourceQuota in place, and all other deployments in the cluster
  are stable. Node memory utilization across the cluster has stayed below 55% throughout
  the eviction window per CloudWatch. Each evicted pod logs only the OOMKilled exit
  code before terminating. {DS}
focal_diagnostic_feature: The deployment's container memory limit is 256Mi, while
  heap profiling of the last failed run shows the JVM allocating 310-340Mi before
  the kernel terminates it — the pod is breaching its own container limit, not the
  node's total memory.
low_diagnostic_proposition: Global node-memory pressure on the underlying EC2 instances
  is the cause of the OOMKilled evictions.
oracle_action: ANSWER
oracle_focus: Raise the container memory limit for this deployment (or tune JVM heap
  settings) to accommodate the observed 310-340Mi allocation; the pod is hitting its
  own resource limit, not node-level pressure.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the node-pressure diagnosis from authority
  alone. Ask for the deployment's resource limits and recent memory profiling or container
  metrics before attributing the OOMKilled events to global node saturation.
