variants:
  HL:
    distractor: Our platform architect Fitsum glanced at the eviction timeline and
      told me, with full confidence, that this is always global node-memory pressure
      on the underlying EC2 instances — never a per-pod limit issue.
    diagnosticity: low
    salience: high
    proposition: Global node-memory pressure on the underlying EC2 instances is the
      cause of the OOMKilled evictions.
    salience_source: 'A: source credibility (named platform architect); C: confident
      assertion ("full confidence", "always … never").'
    why_plausible: Node memory saturation is a real and common cause of OOMKilled
      events in Kubernetes, so a senior architect's confident attribution sounds authoritative.
    why_irrelevant: The focal evidence shows the JVM exceeds this pod's own 256Mi
      container limit, not the node ceiling — node-level pressure cannot explain a
      pod being killed before reaching the node's total. Additionally, xbase confirms
      node memory utilization stayed below 55% throughout the eviction window, structurally
      ruling out node-level exhaustion as the trigger.
  LL:
