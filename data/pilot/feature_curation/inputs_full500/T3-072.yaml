causal_audit:
  steelman: 'OOMKilled is the exit code for both per-pod container-limit breaches
    and

    node-level memory pressure evictions. A senior architect could reasonably

    hypothesise that other workloads spiked memory on the node, pushing available

    memory below what this deployment needed, causing the kernel to kill it.

    This is a genuine mechanism — node pressure causes OOMKilled events in

    multi-tenant clusters regularly.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase explicitly states that node memory utilization across
    the cluster stayed below 55% throughout the eviction window per CloudWatch. This
    definitively forecloses node-level memory exhaustion as the mechanism: a node
    at 55% utilization is not under pressure sufficient to trigger OOMKill evictions
    of co-located pods. Combined with all other deployments remaining stable, the
    node-pressure pathway is structurally ruled out by xbase alone.'
