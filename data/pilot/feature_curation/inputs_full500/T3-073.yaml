causal_audit:
  steelman: 'A language teacher with professional experience in pedagogy has a well-grounded

    basis for claiming that structured classroom instruction outperforms app-based

    self-study for beginners — interactivity, feedback, error correction, and

    social accountability are all real pedagogical advantages of classrooms.

    This claim could legitimately make the user reconsider app-based study entirely.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the steelman addresses the general classroom-vs-app
    claim, not the choice between App A and App B. The distractor is clean because
