seed_id: T3-073
template: T3
domain: open_qa
complexity: low
xbase: I am choosing between two language-learning apps for Spanish. Both have a mobile
  app I can use during my commute, and both offer a free trial. I have about fifteen
  minutes a day to study, I am a complete beginner, and I want to hold basic conversations
  within six months. {DS}
focal_diagnostic_feature: App A uses spaced-repetition vocabulary games with no grammar
  instruction; App B provides explicit grammar explanations with exercises, and independent
  reviews show beginners reach conversational milestones about twice as fast with
  it.
low_diagnostic_proposition: Structured classroom study is always more effective than
  any language-learning app, so the choice between apps does not matter.
oracle_action: ANSWER
oracle_focus: Choose App B; it includes grammar instruction that App A lacks, and
  independent evidence confirms faster progress for beginners with conversational
  goals.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the classroom-beats-apps claim as a reason
  to treat the two apps as equivalent. Ask about each app's method, grammar coverage,
  and learner outcomes before deciding.
cell_oracles:
  HL:
    action: ASK
    focus: Do not accept the classroom-beats-apps claim as a reason to treat the two
      apps as equivalent. Ask about each app's method, grammar coverage, and learner
      outcomes before deciding.
  LL:
    action: ASK
    focus: Do not accept the classroom-beats-apps claim as a reason to treat the two
      apps as equivalent. Ask about each app's method, grammar coverage, and learner
      outcomes before deciding.
  HH:
    action: ANSWER
    focus: Choose App B; it includes grammar instruction that App A lacks, and independent
