    diagnosticity: high
    salience: high
    proposition: Failed pull attempts log HTTP 429 Too Many Requests from registry-1.docker.io;
      the cluster nodes share a single outbound IP, hitting the unauthenticated Docker
      Hub rate limit of 100 pulls per six hours per IP.
    salience_source: Exact HTTP status (429), specific registry hostname, precise
      rate limit figure (100 pulls/6 hours/IP), concrete shared-IP mechanism.
  LH:
    distractor: Failed pull attempts return HTTP 429 from registry-1.docker.io; the
      cluster nodes share one IP and hit the unauthenticated Docker Hub rate limit.
    diagnosticity: high
    salience: low
    proposition: Failed pull attempts log HTTP 429 Too Many Requests from registry-1.docker.io;
      the cluster nodes share a single outbound IP, hitting the unauthenticated Docker
      Hub rate limit of 100 pulls per six hours per IP.
    matched_to: HH
distractor_direction:
  label: imagePullPolicy misconfiguration
  description: Investigating whether the Kubernetes imagePullPolicy is set incorrectly
    (e.g., to Never) on one or more deployments, preventing the runtime from pulling
    the required images.
plausible_alternative_directions:
- label: Private registry authentication expiry
  description: If any of the base images are mirrored through a private registry,
    an expired image pull secret could produce intermittent 401/403 errors on pods
    that hit the private registry path.
- label: Node-level image cache corruption
  description: A subset of cluster nodes may have a corrupted image cache layer, causing
    pulls to fail on those nodes while succeeding on nodes with valid cache.
- label: Network egress flapping to registry
  description: Intermittent network path issues between the cluster's outbound NAT
    and registry-1.docker.io could produce intermittent failures independent of rate
    limiting.
leak_audit:
  ll_atomic_claims:
  - A senior platform engineer stated this error class is always caused by imagePullPolicy
    misconfiguration.
  hh_atomic_claims:
  - Failed pull attempts log HTTP 429 Too Many Requests.
  - The errors come from registry-1.docker.io.
  - The cluster nodes share a single outbound IP.
  - The unauthenticated Docker Hub rate limit is 100 pulls per six hours per IP.
  hl_salience_dimensions:
    source_credibility: Named head of platform (Biruk) with implied institutional
      authority.
    narrative_coherence: Biruk's on-the-spot review and categorical verdict without
      checking details creates a confident, authoritative framing.
    confident_assertion: '"always", "a dozen times", "nothing else to look at"'
    concrete_detail: N/A
  forbidden_categories_checked_against:
  - tunable_value
  - effort_descriptor
  - severity_claim
  - sensory_distractor_about_setting
  - rambling_marker
  - hedging_language
  xbase_word_count: 49
  hl_word_count: 36
  ll_word_count: 20
  hh_word_count: 36
  lh_word_count: 22
  notes: 'Intermittency in xbase (50% pass on retry) implicitly weakens the

    imagePullPolicy=Never distractor within xbase (Never-policy failures

    are 100% consistent) but does not directly name the cause — C4 compliant.

    The HTTP 429 rate-limit evidence is structural and distinct from any

    policy misconfiguration. Biruk is an Ethiopian name not previously used.

    QC repair: removed tunable_value leak (''probably set to Never'') and

    effort_descriptor leak (''audit every deployment manifest before looking

    anywhere else'') from HL; replaced with generic-experience source framing

    (''seen this pattern a dozen times'') which is allowed under C1. HL word

    count updated from 38 to 36.

    '
causal_audit:
  steelman: 'imagePullPolicy can be set to values other than Never that still cause

    intermittent problems: IfNotPresent on nodes without a warm cache, or

    Always on nodes with network congestion, could produce intermittent pull

    failures. A senior platform engineer might reasonably flag policy review

    as a first step before deeper investigation.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase notes the errors are intermittent (50% pass rate
    on retry), which is inconsistent with a Never-policy misconfiguration that would
    fail 100% consistently. The HTTP 429 focal evidence confirms rate limiting, not
    policy.
unconstructable: false
