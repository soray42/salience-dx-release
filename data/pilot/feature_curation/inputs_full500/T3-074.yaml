variants:
  HL:
    distractor: Our head of platform Biruk glanced at the logs for thirty seconds
      and said he has seen this pattern a dozen times — it is always a misconfigured
      imagePullPolicy and there is nothing else to look at.
    diagnosticity: low
    salience: high
    proposition: This class of image pull error is always caused by a misconfigured
      imagePullPolicy setting, according to a senior platform engineer.
    salience_source: 'A: source credibility (named head of platform Biruk with implied
      team authority); B: narrative coherence (quick confident on-the-spot verdict,
      generic experience framing); C: confident assertion ("always", "a dozen times",
      "nothing else to look at").'
    why_plausible: imagePullPolicy misconfiguration is a real and common Kubernetes
      issue that prevents image pulls, so a senior platform engineer's confident diagnosis
      backed by claimed repeated experience sounds authoritative and practically reasonable.
    why_irrelevant: imagePullPolicy=Never produces consistent failures every time,
      not the intermittent 50% pass rate described; the focal evidence shows HTTP
      429 rate-limiting errors, a completely different failure class from a policy
      misconfiguration.
  LL:
    distractor: A senior platform engineer stated that this type of image pull error
      is always caused by a misconfigured imagePullPolicy setting.
    diagnosticity: low
    salience: low
    proposition: This class of image pull error is always caused by a misconfigured
