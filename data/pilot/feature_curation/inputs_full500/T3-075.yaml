seed_id: T3-075
template: T3
domain: open_qa
complexity: medium
xbase: I am choosing between two online data analytics certificates. Certificate A
  is from a smaller provider and costs half as much as Certificate B. Both cover similar
  material and are self-paced. I want the credential to strengthen my resume for a
  job search starting in four months. {DS}
focal_diagnostic_feature: Both certificates share the same professional-body accreditation
  and appear on identical job-board filter lists; Certificate A has verified placement
  reviews in the user's target field.
low_diagnostic_proposition: A hiring manager stated that recruiters consider only
  major-platform certificates and filter out smaller providers.
oracle_action: ANSWER
oracle_focus: Recommend Certificate A; it carries equivalent accreditation and job-board
  recognition to Certificate B, has verified field placements, and costs half as much.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the hiring-manager claim without verification;
  ask about each certificate's accreditation body, which job boards list it, and whether
  hiring teams in the target field recognise it before deciding.
cell_oracles:
  HL:
    action: ASK
    focus: Do not accept the hiring-manager claim without verification; ask about
      each certificate's accreditation body, which job boards list it, and whether
      hiring teams in the target field recognise it before deciding.
  LL:
    action: ASK
    focus: Do not accept the hiring-manager claim without verification; ask about
