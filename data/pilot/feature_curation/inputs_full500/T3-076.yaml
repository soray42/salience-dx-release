  - hedging_language
  xbase_word_count: 57
  hl_word_count: 33
  ll_word_count: 17
  hh_word_count: 40
  lh_word_count: 22
  notes: 'The SRE''s 4 GB figure is framed as a general throughput rule, not a

    measurement of this service''s heap. The heap profile timeline and eviction

    absence, present only in HH/LH, are what make monotonic growth vs

    steady-state distinguishable. xbase now includes a pathway-closure

    (memory climbs from under 300 MB at startup regardless of traffic level,

    including overnight low-load windows) that forecloses the throughput

    working-set ceiling mechanism without supplying the affirmative cause.

    '
causal_audit:
  steelman: 'A senior Kubernetes operator could argue that at 400 RPS, 2 GB is tight

    for many JVM-based services, and that the OOMKill timing (every 4-6 hours

    at steady traffic) is consistent with hitting a true working-set ceiling

    rather than a leak. The GC might be functioning but unable to keep up with

    allocation rate at this throughput, and raising limits might genuinely

    resolve the kills.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase now states that memory climbs from under 300 MB
    at startup regardless of traffic level, including during overnight low-load windows.
    This forecloses the throughput working-set ceiling mechanism: if the process grows
    even under minimal overnight traffic, a 400-RPS steady-state ceiling cannot explain
    the pattern. The monotonic-vs-ceiling distinction is reinforced by HH/LH heap
    profile detail only.'
