seed_id: T3-076
template: T3
domain: technical_troubleshooting
complexity: high
xbase: Our payment-processing service pods are being OOMKilled on Kubernetes roughly
  every four to six hours. Memory limits are set to 2 GB per pod. The service handles
  about 400 requests per second and memory climbs from under 300 MB at startup regardless
  of traffic level, including during overnight low-load windows. There have been no
  recent infrastructure changes. {DS}
focal_diagnostic_feature: Heap profiling shows monotonic memory growth from startup
  to the 2 GB limit with no GC reclaim, driven by HTTP session objects that are never
  evicted from the application cache.
low_diagnostic_proposition: A senior SRE stated that memory limits are under-provisioned
  and any service at this throughput requires at least 4 GB.
oracle_action: ANSWER
oracle_focus: Fix the application-level memory leak by implementing cache eviction
  for HTTP session objects; raising limits would only delay the OOMKill without resolving
  the unbounded growth.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the limit-sizing claim from authority alone;
  ask for heap profiles and GC logs to determine whether memory is growing monotonically
  or fluctuating near a stable ceiling before deciding on limits.
