causal_audit:
  steelman: 'Watering every three days in a terracotta pot could keep the soil too
    moist,

    especially for seedlings with shallow root systems. Overwatering is the single

    most common cause of seedling failure, and root rot can weaken stems, causing

    them to go soft and collapse. However, the primary mechanism for root rot is

    collapse or pinching at the soil line (damping-off), not uniform thread-thinness

    from base to tip. The xbase now explicitly records that stems are equally thin

    from base to tip with no pinching or collapse at the soil line, which is

    structurally incompatible with root-rot presentation, removing the defensible

    mechanism for overwatering to produce the observed full-length elongation.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'The sentence ''The stems look equally thin from base to
    tip, with no pinching or collapse where they meet the soil'' blocks the root-rot
    mechanism: root rot (damping-off) presents as softening and collapse at the soil
    line, not as uniform thinness throughout the stem. This narrow closure names no
    affirmative cause and does not supply the light-deficit diagnosis (which remains
    exclusively in HH/LH via the phototropic lean).'
