distractor_direction:
  label: overwatering and root rot
  description: Investigating whether watering every three days is too frequent for
    the pot size, causing waterlogged soil and root rot that weakens stem tissue.
plausible_alternative_directions:
- label: nutrient deficiency
  description: Pale, weak seedlings can result from depleted or absent nutrients in
    the potting mix, particularly nitrogen, which is a live hypothesis given no mention
    of fertilising.
- label: damping-off fungal disease
  description: Fungal pathogens causing damping-off can produce collapsing, thin stems
    in seedlings, especially in humid or poorly ventilated conditions.
