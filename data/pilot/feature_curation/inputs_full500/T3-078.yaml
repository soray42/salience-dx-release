distractor_direction:
  label: server TTFB bottleneck
  description: Investigating whether slow server response time or origin-to-edge delivery
    latency is preventing the browser from receiving the HTML quickly enough to begin
    rendering.
plausible_alternative_directions:
- label: large JavaScript bundle parse time
  description: Even after HTML is parsed, a very large main bundle requires substantial
    parse and compile time on a simulated 4G device, which could delay first meaningful
    paint independently of render-blocking.
- label: render-blocking CSS
  description: Stylesheets in the head without media queries block rendering until
    downloaded and parsed; this is a live candidate if the third-party scripts also
    inject style dependencies.
- label: third-party script network latency
  description: Scripts served from slow third-party origins add download time regardless
    of defer/async status; a CDN or self-hosting approach could be the right additional
    fix even after the blocking issue is resolved.
