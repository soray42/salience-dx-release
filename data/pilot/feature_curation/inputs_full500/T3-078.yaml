xbase: 'Our marketing landing page scores poorly on Lighthouse: first meaningful paint
  takes about 3.4 seconds on a simulated 4G connection. The backend API responds in
  under 200ms and our CDN serves the HTML globally. We have not recently changed the
  page structure, but the product team added three new third-party scripts last sprint.
  {DS}'
focal_diagnostic_feature: Chrome DevTools Network waterfall shows TTFB is 180ms, but
  three script tags in the head element lack defer or async, causing the browser to
  pause HTML parsing for 2.8 seconds while downloading and executing them before any
  content renders.
low_diagnostic_proposition: This Lighthouse first-paint pattern is always a server
  TTFB problem where the browser is waiting for the HTML to arrive.
oracle_action: ANSWER
oracle_focus: Add defer or async to the three third-party script tags in the head;
  this unblocks HTML parsing and eliminates the 2.8-second pre-render delay without
  touching server infrastructure.
