plausible_alternative_directions:
- label: Compacted or waterlogged soil
  description: Soil structure degradation over three seasons could reduce drainage
    and root oxygenation, suppressing growth even with adequate nutrients and water.
- label: Soil pH imbalance
  description: Accumulated compost applications could shift soil pH outside the optimal
    range for vegetable crops, locking out nutrient uptake.
- label: Root competition from tree
  description: The neighbouring oak may be drawing water and nutrients from the raised
    bed through lateral root extension into the soil beneath.
