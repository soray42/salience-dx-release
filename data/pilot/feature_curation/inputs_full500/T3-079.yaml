causal_audit:
  steelman: 'Three seasons of cropping can deplete specific soil nutrients faster
    than compost replenishes them — in particular phosphorus, potassium, and calcium,
    which compost provides unevenly. A senior advisor is correct that established
    beds commonly need targeted amendments. Even with adequate light, genuine nutrient
    depletion can suppress yields meaningfully, making nutrient deficiency a plausible
    category-level hypothesis. However, xbase records a soil test in March that returned
    normal NPK levels, which directly and specifically forecloses this mechanism for
    the present case: there is no nutrient shortfall to fix. Additionally, the focal
    feature shows the bed now receives under three hours of direct sunlight, a threshold
    below which most vegetables cannot sustain photosynthesis regardless of soil nutrition
    — no amendment can substitute for missing light.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: A soil test conducted in March returned normal NPK levels,
    directly ruling out nutrient deficiency as an active mechanism for this bed. No
    gap remains for the category-level hypothesis to operate.
