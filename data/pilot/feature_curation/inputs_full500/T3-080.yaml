distractor_direction:
  label: Viewport meta tag misconfiguration
  description: Investigating whether the Safari iOS flash is caused by incorrect or
    missing viewport meta tag settings that produce layout thrashing or scale jitter
    during page transitions.
plausible_alternative_directions:
- label: Component library CSS regression
  description: The library update two weeks ago may have changed base styles — z-index,
    background-color, or position — on the transition wrapper in a way that exposes
    a white background frame during the animation.
- label: iOS WKWebView compositing limit
  description: Safari may be hitting a device-level compositing layer budget on older
    iOS hardware, causing layer eviction and a repaint on every transition at this
    complexity.
- label: CSS animation fill-mode gap
  description: An animation-fill-mode or timing mismatch could leave the container
    in a transparent intermediate state between the end of one route's exit and the
    start of the next route's enter animation.
