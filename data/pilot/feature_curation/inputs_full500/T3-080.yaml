    affect all browsers. The safari-only restriction combined with the Chrome/Firefox
    comparison (in xbase) narrows candidates, and the focal then resolves it.

    '
causal_audit:
  steelman: 'A missing or malformed viewport meta tag can cause Safari to apply automatic
    font boosting and double-tap zoom calculations that trigger full-document style
    recalculation during navigation. In edge cases on older iOS, this style recalculation
    could coincide with a CSS animation and produce a visible artefact. The senior
    engineer''s pattern ("almost always") is plausible because viewport issues are
    genuinely common in cross-browser projects and Safari is more sensitive to them
    than other browsers. However, the viewport meta tag controls initial-scale and
    layout width — it operates before compositing and has no mechanism to suppress
    or trigger compositor layer promotion for individual animated elements. The white
    flash is a main-thread repaint artefact specific to overflow-hidden elements,
    not a viewport geometry issue. The authority''s pattern match does not engage
    the compositor behaviour underlying this specific symptom.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: Chrome and Firefox on the same device do not flash — a
    viewport meta tag misconfiguration would affect all browsers' layout calculations,
    not only Safari. This cross-browser contrast partially closes the viewport pathway
