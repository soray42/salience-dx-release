  notes: 'Surya is an Indonesian/Malay male given name not present in any taken list
    or earlier seed. Xbase notes Chrome/Firefox do not flash — this is a symptom fact
    that raises browser-specific suspicion without identifying the CSS mechanism,
    staying within C4. The focal (overflow: hidden blocking compositor promotion)
