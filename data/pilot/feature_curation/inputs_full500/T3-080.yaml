xbase: Our web app shows a white flash during page transitions in Safari on iOS, lasting
  about 120 milliseconds. Chrome and Firefox on the same device do not flash. The
  transitions have worked for eight months and started misbehaving after we updated
  the component library two weeks ago. {DS}
focal_diagnostic_feature: 'The transitioning container has both an opacity animation
  and overflow: hidden set simultaneously; Safari does not promote overflow-hidden
  elements to compositor layers, forcing a full main-thread repaint that produces
  the white frame on each transition.'
low_diagnostic_proposition: Safari iOS white flashes during transitions are almost
  always caused by viewport meta tag misconfiguration.
oracle_action: ANSWER
oracle_focus: 'Remove overflow: hidden from the transitioning container or isolate
  it into a separate stacking-context wrapper so Safari can promote the animated element
  to a compositor layer and eliminate the repaint flash.'
