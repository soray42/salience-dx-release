causal_audit:
  steelman: 'Overwatering is one of the most common causes of seedling failure, producing
    both yellowing

    and weak stems when roots cannot oxygenate in saturated soil. A community gardener''s

    field experience is real data. However, xbase explicitly states the pots drain
    freely after

    every watering and watering only occurs when the top centimetre of soil is dry
    — both

    hallmarks of appropriate moisture management. Etiolation (pale colour and spindly
    elongation)

    is physiologically driven by the plant stretching toward light; it is not a symptom
    of

    root saturation in freely-draining soil. The overwatering mechanism is ruled out
    by the

    described watering discipline and drainage confirmation, not merely by the focal
    feature.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: Pots drain freely after watering and watering is conditional
    on the top centimetre of soil being dry — both foreclose root saturation as a
    mechanism.
