  on the kitchen windowsill. The stems are thin and falling over despite the pots
  draining freely after every watering. I only water when the top centimetre of soil
  feels dry. {DS}
focal_diagnostic_feature: The windowsill is north-facing and receives under two hours
  of indirect light daily; basil seedlings on a nearby south-facing surface in the
  same room are visibly more compact.
low_diagnostic_proposition: Leggy seedlings are generally caused by overwatering and
  watering should be reduced.
