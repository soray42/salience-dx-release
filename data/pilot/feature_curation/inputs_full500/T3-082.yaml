seed_id: T3-082
template: T3
domain: technical_troubleshooting
complexity: medium
xbase: Our chat application loses its WebSocket connection about every 60 seconds
  and then reconnects immediately. The disconnections affect all users routed through
  our nginx reverse proxy. The TLS certificate is valid and DevTools shows a clean
  handshake on every initial connection with no errors reported. {DS}
focal_diagnostic_feature: WebSocket frame logs show exactly 60 seconds of inactivity
  before each drop, matching nginx's default proxy_read_timeout; adding a 30-second
  ping heartbeat eliminates all disconnections.
low_diagnostic_proposition: This type of WebSocket drop is caused by TLS session-ticket
  problems.
oracle_action: ANSWER
oracle_focus: Set nginx proxy_read_timeout to a value larger than the expected idle
  period and add a WebSocket ping/pong heartbeat to keep the connection active; the
  default 60-second timeout is terminating idle connections.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the TLS session-ticket diagnosis from authority
  alone. Ask for the disconnect timing pattern, nginx proxy timeout settings, and
  whether a heartbeat or keep-alive mechanism is configured.
