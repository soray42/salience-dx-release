distractor_direction:
  label: TLS session-ticket rotation
  description: Investigating whether expiring or misconfigured TLS session tickets
    are causing periodic WebSocket reconnections, and whether rotating session keys
    would resolve the issue.
plausible_alternative_directions:
- label: idle connection eviction by load balancer
  description: An upstream load balancer or NAT device separate from nginx may be
    evicting idle TCP connections on its own timeout, which could coincidentally align
    near 60 seconds on some configurations.
- label: WebSocket ping/pong not negotiated
  description: The client and server may not have agreed on a ping/pong extension
    during the handshake, leaving no mechanism to keep the connection alive during
    quiet periods.
- label: upstream application disconnect
  description: The application server behind nginx may itself be closing idle WebSocket
    connections based on its own session or inactivity logic, independent of proxy
    settings.
