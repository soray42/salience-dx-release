  notes: 'QC repair (2026-06-14): removed "and we need to rotate our session keys"
    from HL

    distractor — that remediation action was absent from LL, constituting a case-level

    content leak. Replaced with generic experience claim ("he has seen it many times

    before") which is source-weight framing only, permitted by C1. Also corrected

    low_diagnostic_proposition and LL proposition to match LL distractor text (no

    rotation action). hl_word_count updated from 32 to 31.

    HL adds only: Fariz''s name, role, confident assertion framing, and generic experience

    claim. No additional case facts, no "after two days", no severity claims.

    TLS session-ticket expiry does not produce a fixed-interval reconnect at the

    application layer — it triggers a re-handshake transparently. The 60-second pattern

    is diagnostic of a proxy timeout, not TLS state.

    xbase says TLS handshake is clean — this forecloses the TLS handshake failure
    direction

    but NOT TLS session-ticket expiry, keeping HL genuinely live from xbase alone.

    HH/LH verified: both assert 60s idle interval, 60s nginx default, and ping-eliminates-drops.

    No HH-only claims.

    '
causal_audit:
  steelman: 'TLS session-ticket expiry causes some WebSocket libraries to initiate
    a full TLS

    renegotiation, which can be mistaken for a connection drop at the application
    layer

    if the re-handshake fails or the library tears down the socket. Session-ticket
    lifetime

    defaults vary but are sometimes set to 300 seconds or lower. If the nginx TLS

    configuration happens to use a very short ticket lifetime (e.g. via ssl_session_timeout),

    one could construct a scenario where ticket expiry correlates with the observed
    interval.

    However, xbase states DevTools shows a clean handshake on every initial connection
    and

    the symptom is a clean reconnect, not a handshake failure or error. TLS session-ticket

    issues do not produce a mechanically precise 60-second idle-based interval; they
    are

    asynchronous events tied to ticket lifetime, not silence duration. The timing
    match

    to proxy_read_timeout is too precise to be explained by TLS mechanisms.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: TLS certificate is valid and every initial handshake shown
    in DevTools is clean — rules out TLS failure at connect time but not session-ticket
    expiry; the 60-second idle precision then structurally rules it out in HH.
