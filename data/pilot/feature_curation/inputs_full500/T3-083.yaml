seed_id: T3-083
template: T3
domain: open_qa
complexity: medium
xbase: I am choosing between two used hatchbacks at similar prices. Car A has 45,000
  kilometres on it and a full service history at the main dealer. Car B has only 22,000
  kilometres and looks nearly new inside. Both have passed the most recent roadworthy
  inspection. {DS}
focal_diagnostic_feature: Car B carries a salvage title from a prior insurance write-off,
  which restricts mainstream financing, reduces insurer willingness to offer full
  coverage, and depresses resale value by 20-30% compared with a clean-title equivalent.
low_diagnostic_proposition: Low mileage is the single most reliable indicator of a
  good used car.
oracle_action: ANSWER
oracle_focus: Choose Car A; the salvage title on Car B creates structural financing,
  insurance, and resale problems that outweigh its lower odometer reading and appearance
  advantage.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let a blanket low-mileage rule decide the choice.
  Ask about title status, service history, insurance acceptability, and financing
  eligibility for both cars before drawing a conclusion.
