distractor_direction:
  label: Low-mileage primacy
  description: Treating Car B's lower odometer reading as the dominant quality signal
    and selecting it on the basis of a general low-mileage rule rather than examining
    title, history, and ownership costs.
plausible_alternative_directions:
- label: Service-history completeness
  description: Car A's full main-dealer history versus Car B's unknown history may
    be the decisive factor if both titles were clean.
- label: Insurance cost comparison
  description: Obtaining actual quotes from insurers for both cars before deciding,
    since salvage-title policies vary by provider.
- label: Independent mechanical inspection
  description: Having an independent mechanic inspect both cars could surface hidden
    damage or deferred maintenance not visible from the listing or test drive.
