seed_id: T3-084
template: T3
domain: technical_troubleshooting
complexity: high
xbase: Our Kafka-backed pipeline drops messages for about 90 seconds whenever we do
  a rolling broker restart. The cluster has three brokers, and all topics share the
  same 24-hour retention configuration. The drops only affect one specific topic;
  all other topics recover cleanly during the same restarts. We run rolling restarts
  weekly for maintenance. {DS}
focal_diagnostic_feature: The affected topic has a replication factor of 1 while all
  other topics on the cluster use factor 3; when its single-broker leader is restarted,
  there is no replica to elect a new leader, leaving producers and consumers blocked
  for the full restart window.
low_diagnostic_proposition: Message loss during rolling restarts is almost always
  caused by log retention being shorter than the restart window.
oracle_action: ANSWER
oracle_focus: Increase the replication factor for the affected topic to at least 3
  and reassign partition replicas across the other brokers; then verify min.insync.replicas
  is set appropriately to prevent silent under-replication in future.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the retention explanation; all topics share
  the same 24-hour retention and only one topic loses messages. Ask for the affected
  topic's replication factor and partition replica assignment before making changes.
