causal_audit:
  steelman: 'Retention shorter than the rolling-restart window is a real failure mode:
    if a

    topic retains messages for less time than it takes for all brokers to cycle through

    a restart, consumers that fell behind could lose access to messages after the
    window.

    An engineer who set up the cluster would know whether the retention defaults were

    set conservatively. However, xbase states all topics share the same 24-hour retention

    configuration, so retention cannot explain why only this one topic experiences
    message

    loss while identical-retention topics recover cleanly. The steelman collapses
    on the

    shared-retention clause in xbase.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states "all topics share the same 24-hour retention
    configuration," closing the retention-window pathway because retention cannot
    differentiate the one affected topic from the others that recover cleanly.
