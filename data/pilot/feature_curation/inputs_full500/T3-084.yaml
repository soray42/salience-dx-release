distractor_direction:
  label: Retention-window mismatch
  description: Investigating whether the affected topic's log retention period is
    shorter than the rolling-restart window, causing messages to expire before consumers
    can re-read them after leader election.
plausible_alternative_directions:
- label: Consumer group rebalance storm
  description: Rolling restarts triggering repeated consumer-group rebalances could
    stall consumption for longer than expected if the group protocol is slow to stabilise.
- label: Producer acks misconfiguration
  description: If the affected topic's producers use acks=1 while the broker is mid-restart,
    messages acknowledged by a non-surviving leader could be lost before replication.
- label: Unclean leader election enabled
  description: With unclean.leader.election.enable=true, an out-of-sync replica could
    be elected leader during the restart window, causing message loss regardless of
    retention.
