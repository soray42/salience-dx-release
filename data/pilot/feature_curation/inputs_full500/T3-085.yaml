causal_audit:
  steelman: 'Vulcanised patches, if applied to a high-stress zone near the tread centre,
    can develop edge lift under repeated flexing, especially if the tube was not fully
    deflated and roughened before patching. It is plausible that the patched area
    separated overnight under residual stress. However, this mechanism would produce
    a deflation at the patch margin and would not explain why the pinhole location
    is the same in a separately placed tube — nor why two distinct flats occurred
    at the identical spot. The spatial coincidence points to a retained object, not
    patch failure mechanics.

    '
