seed_id: T3-086
template: T3
domain: technical_troubleshooting
complexity: medium
xbase: Our event-processing microservice drops roughly one in fifty incoming events
  under peak load. The events simply do not appear in the database; no error is logged
  for them. The topic has eight partitions and the consumer group has eight instances
  running, so partitions and consumer instances are balanced. {DS}
focal_diagnostic_feature: Thread dumps captured during drop windows show the consumer
  executor pool is fully saturated, with all processing threads blocked on downstream
  database writes and the bounded work queue overflowing and silently discarding arriving
  records.
low_diagnostic_proposition: A senior platform engineer asserts that silent event loss
  at scale is always caused by insufficient topic partition count.
oracle_action: ANSWER
oracle_focus: Increase the consumer executor thread pool size or reduce downstream
  write latency so threads are not blocked during spikes; the partition count is not
  the bottleneck.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the partition-count assertion from authority
  alone. Ask for thread-dump output during drop windows and whether the executor queue
  is bounded.
