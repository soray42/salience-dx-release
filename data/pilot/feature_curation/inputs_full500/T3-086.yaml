causal_audit:
  steelman: 'Under-partitioning is a classic Kafka pattern: if you have more consumer
    instances than partitions, some instances sit idle, reducing effective throughput.
    A senior engineer who has fixed throughput problems by increasing partition count
    would reasonably reach for this diagnosis. The symptom (silent loss under load,
    not at low traffic) matches the pattern. However, xbase explicitly states eight
    partitions and eight instances are running in balance, which means every instance
    already owns exactly one partition. Adding more partitions would create idle new
    partitions unless additional instances were also added; the throughput ceiling
    here is not partition assignment but downstream processing capacity per thread.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states eight partitions and eight consumer instances,
    so the authority's generic under-partitioned-topic pattern does not apply to this
    specific case
