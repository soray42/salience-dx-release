distractor_direction:
  label: Insufficient partition count
  description: Investigating whether the topic has too few partitions to support the
    required consumer parallelism, creating a throughput ceiling that causes silent
    event loss.
plausible_alternative_directions:
- label: Database write timeout
  description: If downstream database writes are intermittently timing out and the
    consumer swallows the exception without logging
  events could silently disappear without thread-pool exhaustion.: null
- label: Consumer group rebalance churn
  description: Frequent rebalance cycles triggered by slow poll intervals can cause
    in-flight records to be dropped during the revocation window if offsets are committed
    prematurely.
