causal_audit:
  steelman: 'A senior sports physiotherapist might argue: aggressive road geometry
    (long reach, low stack) does genuinely overload recreational riders'' lumbar extensors,
    and a coach watching live movement could observe a forward-lean posture consistent
    with that. However, the focal fitter''s measurements reveal that the saddle is
    4 cm too high and reach is 3 cm too short — these are correctable setup errors,
    not intrinsic geometry flaws. The coach''s observation provides no measurement
    data and the ''always'' framing is pattern-matching, not an analysis of this rider''s
    setup. The focal feature structurally rules out the frame as the primary cause.

    '
  steelman_verdict: no_defensible_mechanism
