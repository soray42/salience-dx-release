xbase: I bought a road bike six months ago and have been getting lower back pain on
  every ride longer than an hour. A local coach watched me ride for a few minutes
  and gave me an opinion on the cause. I have not adjusted the saddle height or handlebar
  reach since purchase. {DS}
focal_diagnostic_feature: A professional bike fitter measures 4 cm of excess saddle
  height and 3 cm of insufficient handlebar reach, placing the rider in sustained
  lumbar flexion throughout the pedal stroke.
low_diagnostic_proposition: An experienced coach asserts that lower back pain on road
  bikes is almost always caused by an overly aggressive racing frame geometry rather
  than fit adjustments.
oracle_action: ANSWER
oracle_focus: Book a professional bike fit session; the saddle is too high and the
  bars too far, causing the measured lumbar stress — these are correctable without
  changing the frame.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept a blanket geometry diagnosis without measurement
  data. Ask for saddle height, handlebar reach, and a professional fit assessment
