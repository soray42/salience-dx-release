causal_audit:
  steelman: 'A senior messaging systems engineer would immediately and correctly identify
    consumer exception loops as the most frequent root cause of RabbitMQ redelivery
    storms. Consumer code that nacks every message due to an unhandled exception produces
    identical queue oscillation. The principal engineer''s pattern-match is statistically
    well-grounded. However, the focal feature establishes that the cause here is at
    the channel configuration layer, not the consumer logic layer: prefetch_count=1
    forces sequential single-message processing, and nack-with-requeue=true on every
    delivery tag means any consumer timeout (even without an exception) re-enqueues
    the message. Consumer logs show no exceptions, which is consistent with a configuration-layer
    loop and inconsistent with a consumer-bug loop.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase notes consumer logs show no exceptions, which blocks
    the consumer-exception mechanism the distractor relies on — within C4's boundary
    because it names no affirmative cause.
