distractor_direction:
  label: Consumer exception-handling bug
  description: Treating the redelivery storm as caused by unhandled or poorly handled
    exceptions in the consumer application code that trigger repeated nacks.
plausible_alternative_directions:
- label: Dead-letter queue misconfiguration
  description: Checking whether the dead-letter exchange or routing key is absent
    or misconfigured, causing poison messages to re-enqueue instead of routing to
    a DLQ.
- label: Message TTL expiry loop
  description: Assessing whether per-message TTL is expiring messages back into the
    queue before consumers can acknowledge them.
- label: Consumer connection churn
  description: Investigating whether consumers are disconnecting and reconnecting
    rapidly, causing unacked messages to be requeued by the broker on each disconnect.
