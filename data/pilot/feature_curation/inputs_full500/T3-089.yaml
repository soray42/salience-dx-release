xbase: A stone chipped my windscreen on the motorway and left a small crack about
  the size of a coin, low in the corner of the glass. My garage says it can be repaired
  rather than replaced if I act soon. I have a comprehensive car insurance policy
  and I am trying to decide whether to claim for the repair or just pay for it myself
  to protect my no-claims discount. I have the policy documents but have not read
  the glass section. {DS}
focal_diagnostic_feature: The policy states that windscreen and glass repairs are
  settled separately and do not count as a fault claim, so claiming for the chip does
  not reduce the no-claims discount or step up the premium.
low_diagnostic_proposition: A senior relative with insurance experience advises that
  filing any claim always damages the no-claims discount and should be avoided.
oracle_action: ANSWER
oracle_focus: Claim for the windscreen repair; the policy treats glass repairs as
  a separate, no-claims-protected category, so claiming does not touch the no-claims
  discount or the premium and paying out of pocket gives up a free benefit.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the blanket 'never claim' rule. Ask how
