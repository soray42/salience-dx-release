causal_audit:
  steelman: 'A seasoned claims handler''s rule is not baseless: across most claim
    types, filing genuinely does erode the

    no-claims discount and lift premiums, and selection effects make any claim look
    risky, so ''never claim'' is a

    defensible heuristic in general. But the heuristic is about claims as a class;
    it does not engage the specific

    fact that this policy carves out glass repairs as a separate, non-fault settlement.
    The relative offered no

    analysis of this policy''s glass terms, and those terms — not the general rule
    — determine the outcome here. The

    authority''s confidence cannot change what the policy says, so it has no mechanism
    to make self-pay the right

    call for this case.

    '
