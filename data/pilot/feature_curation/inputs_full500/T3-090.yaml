seed_id: T3-090
template: T3
domain: technical_troubleshooting
complexity: medium
xbase: Our read-heavy product catalogue API is spiking to 100% origin CPU for about
  ten seconds every few minutes under moderate traffic. Between spikes the origin
  sits idle and Redis cache hit rates look healthy at roughly 90%. The pattern started
  after we doubled our registered-user base last month. We have not changed the caching
  layer or TTL configuration. {DS}
focal_diagnostic_feature: When a popular catalogue entry's cache key expires, Redis
  shows a burst of hundreds of simultaneous cache misses for that same key before
  any one thread has populated it, causing all those requests to fall through to the
  origin concurrently.
low_diagnostic_proposition: The CPU spikes are caused by an undersized origin instance
  that cannot handle the increased user base.
oracle_action: ANSWER
oracle_focus: 'Implement a cache-stampede lock or probabilistic early revalidation:
  allow only one thread to fetch from the origin on a cache miss for a given key while
  the rest wait or return a slightly stale value; the origin is not undersized but
  overwhelmed by coordinated miss bursts on the same key.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the undersized-instance diagnosis from
  authority. Ask for per-key miss patterns, concurrency on cache misses, and whether
  origin load is spread uniformly or spikes on specific cache-expiry events.
cell_oracles:
  HL:
    action: ASK
    focus: Do not accept the undersized-instance diagnosis from authority. Ask for
      per-key miss patterns, concurrency on cache misses, and whether origin load
      is spread uniformly or spikes on specific cache-expiry events.
  LL:
    action: ASK
    focus: Do not accept the undersized-instance diagnosis from authority. Ask for
