variants:
  HL:
    distractor: Orsolya, our principal SRE and the person who designed our token infrastructure,
      looked at the symptom description and said without hesitation that a steady
      low-rate 401 spread across service pairs is almost always a signing-key rotation
      that did not propagate to all consumers simultaneously.
    diagnosticity: low
    salience: high
    proposition: The 401 errors come from token-signature verification failures caused
      by a key-rotation mismatch between the token issuer and the downstream services.
    salience_source: A — named principal SRE who designed the token infrastructure;
      C — "without hesitation" and "almost always" carry high-confidence authoritative
      pattern-matching.
    why_plausible: Key-rotation propagation failures genuinely cause steady low-rate
      401s across service pairs without time-of-day correlation, making this a credible
      first hypothesis that a senior practitioner would articulate.
    why_irrelevant: The focal feature shows the 401 rejection reason is token expiry,
      not signature failure; the gateway cache TTL exceeds the token lifetime so valid-signature-but-expired
      tokens are served, and the downstream services are correctly rejecting them
      — key-rotation cannot produce expired tokens with valid signatures.
  LL:
    distractor: A principal SRE attributed this 401 pattern to a signing-key rotation
      that did not reach all consuming services.
    diagnosticity: low
    salience: low
    proposition: The 401 errors come from token-signature verification failures caused
      by a key-rotation mismatch between the token issuer and the downstream services.
    matched_to: HL
  HH:
    distractor: The gateway config shows a 900-second token cache TTL; the token issuer
      issues tokens with a 600-second exp claim; the downstream service logs show
      the rejection reason is "token expired", not "invalid signature" — the gateway
      is handing out tokens that are cryptographically intact but have already elapsed.
    diagnosticity: high
    salience: high
    proposition: The gateway's cache TTL for tokens is set to 900 seconds, but the
      token issuer signs tokens with a 600-second expiry; tokens spend up to five
      minutes cached past their expiry before the gateway refreshes them, and the
      downstream services correctly reject those expired tokens.
    salience_source: Three concrete configuration values (900s TTL, 600s exp, rejection
      reason "token expired") form a closed diagnostic chain with no ambiguity.
  LH:
    distractor: Gateway token cache TTL is 900 seconds, token expiry is 600 seconds,
      and downstream logs cite "token expired" as the rejection reason.
    diagnosticity: high
    salience: low
    proposition: The gateway's cache TTL for tokens is set to 900 seconds, but the
      token issuer signs tokens with a 600-second expiry; tokens spend up to five
      minutes cached past their expiry before the gateway refreshes them, and the
      downstream services correctly reject those expired tokens.
    matched_to: HH
distractor_direction:
  label: Signing-key rotation mismatch
  description: Investigating whether a signing key was rotated at the token issuer
    without updating the verification key at downstream services, causing signature-validation
    failures.
plausible_alternative_directions:
- label: Clock skew between services
  description: Significant clock drift between the gateway and the token issuer or
    downstream services could cause tokens to appear expired to one party even when
    they should be valid.
- label: Gateway routing inconsistency
  description: The gateway may be routing some requests through a code path that skips
    token refresh, causing stale tokens to reach downstream services for those requests.
- label: Token issuer partial failure
  description: If the token issuer is occasionally returning tokens with an incorrect
    exp value, a subset of tokens could expire unusually quickly regardless of cache
    configuration.
