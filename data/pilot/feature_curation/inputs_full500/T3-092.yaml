causal_audit:
  steelman: 'A security engineer could argue that signing-key rotation propagation
    failures match this

    exact epidemiology: steady low-rate failures spread across service pairs with
    no time-of-day

    pattern, because services fetch the verification key on startup or at different
    intervals,

    so stale keys cause a constant fraction of calls to fail. This is a well-known
    failure mode

    and a senior SRE who has seen it before would reasonably rank it first. However,
    the focal

    feature closes this path: the downstream service logs cite "token expired" as
    the rejection

    reason, not "invalid signature". Key-rotation failures produce signature-validation
    errors;

    they cannot produce expired tokens. Only a cache-TTL-exceeds-expiry configuration
    can

    produce valid-signature-but-elapsed tokens in a steady, time-independent pattern.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states downstream services are correctly validating
    tokens on arrival and the token issuer is healthy, which rules out a broken validation
    pipeline or issuer failure without identifying the TTL configuration cause.
