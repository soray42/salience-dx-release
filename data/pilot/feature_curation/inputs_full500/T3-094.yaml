domain: technical_troubleshooting
complexity: medium
xbase: Our product listing pages are loading slowly for users in two European cities.
  Average page size on the wire is roughly three times larger than expected, and the
  origin server responds correctly to local curl tests with gzip-encoded bodies. The
  CDN layer is a Cloudflare Worker setup added three months ago. {DS}
focal_diagnostic_feature: 'The Cloudflare Worker strips the `Vary: Accept-Encoding`
  response header before caching, so Cloudflare stores one uncompressed copy and serves
  it to all clients regardless of their encoding preference.'
low_diagnostic_proposition: This symptom is always caused by misconfigured server-side
  compression and is never a CDN-layer issue.
oracle_action: ANSWER
oracle_focus: 'Remove or fix the Worker code that strips `Vary: Accept-Encoding`;
  once the header is preserved, Cloudflare will cache and serve compressed responses
  to clients that request gzip.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the always-server-side-compression rule
  given that the origin already serves gzip correctly. Ask for what the Worker does
  to response headers before caching.
