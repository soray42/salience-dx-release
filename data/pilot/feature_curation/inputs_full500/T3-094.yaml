distractor_direction:
  label: server-side compression misconfiguration
  description: Investigating whether the origin server's gzip or compression module
    is misconfigured, causing inflated page sizes on the wire.
plausible_alternative_directions:
- label: Cloudflare compression setting disabled
  description: Cloudflare's own compression feature may be disabled or overridden
    at the zone level, causing uncompressed delivery independent of the Worker.
- label: geographic routing to distant PoP
  description: Users in those two cities may be routing to a far Cloudflare PoP, adding
    latency rather than inflating page size.
- label: image or asset size regression
  description: A recent asset build may have included unoptimised images or unminified
    scripts that inflate the page size independently of compression.
