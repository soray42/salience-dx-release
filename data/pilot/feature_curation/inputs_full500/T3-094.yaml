causal_audit:
  steelman: 'A senior engineer could argue: curl tests use a simple Accept-Encoding
    header while real browsers send more complex negotiation headers; origin gzip
    may work in curl but silently fail for certain Accept-Encoding variants sent by
    browsers; this could produce inflated body sizes from the origin side rather than
    from CDN stripping. Additionally, the three-times-larger figure could indicate
    the origin is sending pre-compressed data that the CDN is then double-encoding
    or decompressing before re-serving.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the origin 'responds correctly to local curl
    tests with gzip-encoded bodies' — this closes the standard server-side compression
    failure pathway. The steelman's browser-negotiation-variant scenario is speculative
    and is structurally ruled out by the focal feature (Worker explicitly strips Vary
    header, not the origin sending wrong data).
