seed_id: T3-096
template: T3
domain: technical_troubleshooting
complexity: high
xbase: Our file-sync service is dropping change events on the monitored directories.
  Files are being created and modified normally, but the sync daemon misses them and
  the local index falls behind. The issue started two days ago after we expanded the
  number of project directories being watched from 40 to 120. No code was deployed
  to the daemon itself. A clean restart of the daemon did not restore sync. {DS}
focal_diagnostic_feature: The daemon logs show repeated ENOSPC errors when registering
  new inotify watches, and fs.inotify.max_user_watches is set to 8,192, which is well
  below the watch count required for 120 directories and their subdirectory trees.
low_diagnostic_proposition: A principal infrastructure engineer stated that this type
  of sync daemon problem is a process-level bug and recommended periodic service restarts.
oracle_action: ANSWER
oracle_focus: Raise fs.inotify.max_user_watches to an adequate value (e.g., 524288)
  and restart the daemon; the ENOSPC errors on watch registration confirm the kernel
  watch limit is exhausted, not a process bug.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the process-bug diagnosis from authority
  alone; ask for daemon logs, error codes on watch registration, and the current inotify
  kernel parameters before restarting anything.
