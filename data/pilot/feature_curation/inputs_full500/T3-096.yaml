causal_audit:
  steelman: 'A principal engineer could defend the process-bug diagnosis: file-sync
    daemons do accumulate watch-handle leaks and event-queue corruption over time,
    especially when the watched set grows rapidly. Restarting the process clears any
    leaked handles and resets event queues. The symptom (missed events after directory
    expansion) is also consistent with a race condition in the daemon''s watch-registration
    bookkeeping under load.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase now states 'A clean restart of the daemon did not
    restore sync.' — a clean restart flushes any handle leaks and resets event queues,
    so persistent failure after restart rules out accumulated process-level state
    corruption as the cause.
