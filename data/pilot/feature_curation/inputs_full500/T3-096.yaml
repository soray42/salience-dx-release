distractor_direction:
  label: Process-level daemon bug
  description: Investigating whether the sync daemon has accumulated corrupt internal
    state or a memory/handle leak that causes it to drop events over time.
plausible_alternative_directions:
- label: Event queue overflow
  description: The kernel inotify event queue itself may be overflowing if events
    arrive faster than the daemon processes them, causing silent drops.
- label: Directory permission change
  description: Some of the newly added directories may lack read permission for the
    service account, causing those subtrees to be silently ignored.
- label: Daemon thread starvation
  description: The expanded watch set may be saturating the daemon's event-processing
    threads, introducing backpressure that manifests as dropped events under load.
