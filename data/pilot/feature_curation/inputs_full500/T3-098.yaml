distractor_direction:
  label: Firewall long-lived connection timeout
  description: Investigating whether a stateful firewall rule is silently dropping
    the NFS TCP connection after it remains idle during a large write, causing the
    mount to hang.
plausible_alternative_directions:
- label: NFS client rsize/wsize mismatch
  description: A mismatch between client-side rsize/wsize negotiation and actual network
    MTU could cause large write failures while small reads succeed.
- label: Server disk I/O saturation
  description: The server's storage device may be saturating during large sequential
    writes, causing timeouts that the client interprets as a dropped connection.
- label: NFS version or protocol mismatch
  description: A version or protocol negotiation difference between client and server
    may make large stateful operations unstable while small reads complete normally.
