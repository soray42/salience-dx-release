seed_id: T3-098
template: T3
domain: technical_troubleshooting
complexity: medium
xbase: My Linux workstation mounts a shared NFS volume from the office file server.
  Large file transfers to that share work for a while and then the connection drops
  and the mount hangs. Smaller reads complete without issue. I have not changed the
  client or server configuration this week. A packet capture during a hang shows the
  TCP session staying established with no reset or FIN from any network hop. {DS}
focal_diagnostic_feature: Server-side dmesg shows repeated NFS write timeout entries
  triggered by the sync export option, meaning the server stalls on disk commit acknowledgment
  during large writes rather than the TCP connection dropping.
low_diagnostic_proposition: Intermittent NFS drops on this network are always caused
  by a firewall rule silently dropping long-lived connections.
oracle_action: ANSWER
oracle_focus: Change the NFS export option from sync to async or tune the server-side
  write timeout; the fault is server-side disk commit latency, not a firewall or network
  layer issue.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the firewall-rule diagnosis from authority
  alone. Ask for server-side dmesg output and NFS export options before examining
  network rules.
