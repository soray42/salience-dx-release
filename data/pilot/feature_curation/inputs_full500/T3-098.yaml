  notes: 'Authority uses generic pattern-matching ("always caused by") without engaging
    the

    dmesg evidence in HH/LH. The authority''s claim is about network-layer behavior,

    while the focal feature is on the server storage path — mutually exclusive layers.

    Steelman: firewall timeout on long-lived NFS TCP is a classic sysadmin war story,

    and the authority''s seven-year site experience gives it real weight. But dmesg

    write-timeout entries (not RST/conntrack) structurally rule it out.

