causal_audit:
  steelman: 'Stateful firewalls silently dropping long-lived TCP sessions is a well-documented
    NFS

    failure mode. An NFS mount hangs rather than errors cleanly when the TCP layer
    dies

    without RST, and "the connection drops after large transfers" is almost textbook
    for

    a firewall idle-timeout around 60–300 seconds. A senior sysadmin who has seen
    this

    pattern on this network has strong grounds to say it. The authority''s diagnosis
    is

    the correct one in many real cases and a reasonable first hypothesis to rule out.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: packet capture shows the TCP session stays established
    with no RST/FIN, ruling out the firewall idle-timeout mechanism without naming
    the real cause.
