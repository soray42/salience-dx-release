xbase: I do occasional through-hole soldering on simple hobby electronics — LED strips,
  basic sensor boards, nothing surface-mount. I want to buy my first soldering iron
  and am choosing between a basic fixed-temperature pencil iron for around twenty
  dollars and a proper temperature-controlled station for around eighty dollars. {DS}
focal_diagnostic_feature: A basic fixed pencil iron suits through-hole work on simple
  boards reliably, while the temperature-controlled station costs four times more
  for adjustability relevant to surface-mount and heat-sensitive work that does not
  apply to this use case.
low_diagnostic_proposition: A temperature-controlled station is the only sensible
  starting point for any electronics work.
oracle_action: ANSWER
oracle_focus: Buy the fixed pencil iron; it handles through-hole joints on simple
  boards without issue, and the temperature-controlled station's additional cost buys
  features the user's use case does not require.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not accept the universal station recommendation from
  authority alone. Ask about the user's specific work type, component heat sensitivity,
  and budget before recommending a temperature-controlled station.
