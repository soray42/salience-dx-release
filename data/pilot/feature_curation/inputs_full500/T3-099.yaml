distractor_direction:
  label: Temperature-controlled station required
  description: Treating a temperature-controlled soldering station as the mandatory
    starting point for any electronics work, regardless of the specific components
    or board type involved.
plausible_alternative_directions:
- label: Wattage insufficiency
  description: A low-wattage fixed iron may lack the thermal mass to heat larger pads
    quickly, causing cold joints on thicker boards even for through-hole work.
- label: Tip quality and replacability
  description: The specific iron's tip quality and whether tips are replaceable may
    matter more than temperature control for the longevity of the tool.
