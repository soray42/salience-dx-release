distractor_direction:
  label: Failing disk hardware
  description: Investigating whether one or more block devices are failing and returning
    I/O errors that trigger the ext4 errors=remount-ro self-protection mechanism,
    requiring drive replacement.
plausible_alternative_directions:
- label: Storage controller intermittent errors
  description: The HBA or SATA/SAS controller may return transient I/O errors that
    SMART does not capture, causing the kernel to propagate errors into the filesystem
    layer.
- label: Kernel ext4 module regression
  description: A kernel update may have introduced a bug in the ext4 journal commit
    path that causes spurious aborts unrelated to hardware.
- label: Mount option misconfiguration
  description: The errors=remount-ro mount option combined with a reproducible filesystem-level
    trigger (e.g. a specific application write pattern) may be causing premature journal
    aborts.
leak_audit:
  ll_atomic_claims:
  - The ext4 read-only remount is attributed to a failing drive
  - The remedy is to pull and replace the failing drive
  hh_atomic_claims:
