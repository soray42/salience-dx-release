variants:
  HL:
    distractor: The lobby hit me with a musty smell, greenish fluorescent light, and
      carpet that looked like it had survived three reorganisations.
    diagnosticity: low
    salience: high
    proposition: The office lobby used for occasional visits is dim, dated, and smells
      musty.
    salience_source: smell, lighting, worn physical setting
    why_plausible: A workplace's atmosphere can feel like information about culture.
    why_irrelevant: The role is mostly remote and the lobby is only used occasionally;
      it does not determine compensation, role fit, or team reliability.
  LL:
    distractor: The office lobby used for occasional visits is dim, dated, and somewhat
      unpleasant.
    diagnosticity: low
    salience: low
    proposition: The office lobby used for occasional visits is dim, dated, and smells
      musty.
    matched_to: HL
  HH:
    distractor: The salary is 18% higher than mine, the role lines up with the direction
      I want, and two people I trust from past projects are already on the team.
    diagnosticity: high
    salience: high
    proposition: The offer is 18% above current salary, aligns with the user's career
      direction, and includes two trusted former colleagues on the team.
    salience_source: compensation/fit/team evidence
  LH:
    distractor: The offer includes an 18% pay increase, aligned role content, and
      two trusted prior colleagues on the team.
    diagnosticity: high
    salience: low
    proposition: The offer is 18% above current salary, aligns with the user's career
      direction, and includes two trusted former colleagues on the team.
    matched_to: HH
distractor_direction:
  label: Office-environment discomfort
  description: Investigating whether the physical office environment for occasional
    visits should drive acceptance of the mostly remote job.
plausible_alternative_directions:
- label: Manager compatibility
  description: The future manager’s expectations and communication style may determine
    whether the role is a good fit.
- label: Contract probation risk
  description: Probation terms, termination notice, or hidden contractual conditions
    may weaken the offer.
- label: Long-term skill growth
  description: The role may or may not build skills aligned with the user’s career
    direction.
leak_audit:
