seed_id: T5-002
template: T5
domain: open_qa
complexity: low
xbase: I've been offered a permanent mostly-remote job and am trying to decide whether
  to accept. I would only visit the office for onboarding and occasional quarterly
  meetings. The contract terms look ordinary for my industry. {DS}
focal_diagnostic_feature: The offer is 18% above current salary, aligns with the user's
  career direction, and includes two trusted former colleagues on the team.
low_diagnostic_proposition: The office lobby used for occasional visits is dim, dated,
  and smells musty.
oracle_action: ANSWER
oracle_focus: Accept or negotiate from strength; the disclosed compensation, fit,
  and team information are favourable.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not use an occasional-visit lobby as a proxy for job
  quality. Ask about compensation, role fit, manager/team, and contract terms.
