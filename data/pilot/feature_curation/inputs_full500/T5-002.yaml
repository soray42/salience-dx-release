  HL:
    action: ASK
    focus: Do not use an occasional-visit lobby as a proxy for job quality. Ask about
      compensation, role fit, manager/team, and contract terms.
  LL:
    action: ASK
    focus: Do not use an occasional-visit lobby as a proxy for job quality. Ask about
      compensation, role fit, manager/team, and contract terms.
  HH:
    action: ANSWER
    focus: Accept or negotiate from strength; the disclosed compensation, fit, and
