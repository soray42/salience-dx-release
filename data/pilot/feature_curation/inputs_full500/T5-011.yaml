distractor_direction:
  label: aesthetic appearance implies data distrust
  description: 'The dashboard''s visually dated and cluttered UI is offered as evidence
    that the metric values it displays are unreliable, conflating surface aesthetics
    with data pipeline correctness.

    '
plausible_alternative_directions:
- label: dashboard data source misconfiguration
  description: 'The dashboard may be querying a different namespace, environment,
    or time range than intended, causing it to surface inflated error rates unrelated
    to the live payments service.

    '
- label: alert threshold miscalibration
  description: 'The elevated error rate may reflect normal traffic variation hitting
    an overly sensitive threshold rather than a genuine service degradation.

    '
