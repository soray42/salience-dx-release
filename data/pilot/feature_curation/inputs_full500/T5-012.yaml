xbase: 'I''ve been using BackPulse, an open-source backup CLI, to protect our production
  database snapshots. I started worrying the tool might be silently corrupting backup
  data. I ran a full restore to a separate test volume and then used the tool''s built-in
  verify command to check integrity. {DS}

  '
