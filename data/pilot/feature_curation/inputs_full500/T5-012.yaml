distractor_direction:
  label: outdated website signals corruption
  description: 'The tool''s 1990s-era website aesthetic is offered as evidence that
    the project is unreliable and the backup data may be corrupted.

    '
plausible_alternative_directions:
- label: backup configuration incomplete
  description: 'BackPulse may be misconfigured to exclude certain file paths, silently
    omitting data from backups without raising an error.

    '
- label: storage layer corruption
  description: 'The underlying disk or network storage volume could be introducing
    corruption independently of the backup tool itself.

    '
- label: incremental snapshot logic flaw
  description: 'BackPulse''s incremental backup algorithm might include stale or incorrect
    file versions without flagging errors during the backup phase.

    '
