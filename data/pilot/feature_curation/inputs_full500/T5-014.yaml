  - effort_descriptor
  - severity_claim
  - sensory_distractor_about_setting
  - rambling_marker
  - hedging_language
  hl_word_count: 47
  ll_word_count: 17
  notes: 'Repair (revision 2): replaced "looks like it was thrown together by someone

    with no QA process" with "looks like it was thrown together carelessly" to

    remove the severity_claim / case-content leak identified by QC leak-lens p1.

    The original phrase implied a process-deficiency fact about the app''s

    development not present in LL; the replacement stays within the

    aesthetic/visual-impression frame and introduces no new case claims.

    Retained: no tunable values (no dollar amounts or percentages added in HL

    beyond what xbase already establishes), no effort descriptors, no severity

    claims about consequences of a wrong refund, no sensory color about Tariq''s

    environment. The phrase "glanced at a screenshot I sent him" anchors the

    concrete detail to the source interaction rather than the user''s filing

    case. The word "almost" in "almost never" was retained because it is part

    of Tariq''s assertion about general tool quality, not hedging about this

    specific case; it makes the HL sound more realistic without reducing

    salience.

    '
causal_audit:
  steelman: 'Best-faith argument that UI aesthetics could causally inform calculation

    correctness: Poor interface design is often a symptom of constrained

    engineering resources and limited QA investment. A development team that

    cannot allocate effort to a polished UI is likely also cutting corners

    elsewhere, including in testing financial calculation logic against

    edge cases — unusual deductions, partial-year filing situations,

    alternative minimum tax interactions. Tax software bugs are notoriously

    hard to detect because they manifest in uncommon input combinations that

    users rarely hit. An audit professional familiar with small fintech shops

    might legitimately treat "visually abandoned product" as a weak prior for

    "undertested calculation core." This reasoning is how the aesthetic-

    usability heuristic gets inverted into a negative signal: if polish

    correlates with investment, its absence correlates with neglect.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'N/A — the steelman identifies only a weak prior about
    unknown tools, not a causal pathway. The prior is fully resolved by the focal:
    an independent CPA manual computation on the identical inputs produced the exact
    same figure. Once that verification exists, no further investigation is warranted
    and the appearance-based prior carries zero residual weight.

    '
