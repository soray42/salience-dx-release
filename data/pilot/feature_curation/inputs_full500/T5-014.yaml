domain: open_qa
complexity: medium
xbase: 'I filed my taxes this year using a free budget app. The interface is genuinely
  ugly — the layout is cluttered and inconsistent, fonts are mismatched, and navigating
  between sections feels like something from 2008. The app calculated my refund at
  $1,847. I''m second-guessing whether to trust that number before I actually file.
  {DS}

  '
focal_diagnostic_feature: 'An accountant manually computed the same return using the
  same income and deduction figures and arrived at exactly $1,847.

  '
low_diagnostic_proposition: 'The tool''s interface looks sloppy and outdated, which
  raises doubt about whether its calculations can be trusted.

  '
oracle_action: ANSWER
oracle_focus: 'The app''s calculation is correct. An independent manual computation
  by an accountant on the same inputs produced exactly the same result, which constitutes
  direct verification of the output. The interface''s appearance has no bearing on
  the numerical accuracy.

  '
low_diagnostic_oracle_action: ANSWER
low_diagnostic_oracle_focus: 'Aesthetic quality of a UI is not a reliable indicator
  of calculation correctness; the user should verify the output through an independent
  check (such as manual computation or a second tool) rather than relying on interface
  appearance to judge accuracy. The distractor claim should not be adopted.

  '
