distractor_direction:
  label: UI aesthetics signal calculation errors
  description: 'The budget tool''s cluttered, outdated-looking interface is treated
    as evidence that its calculation logic is unreliable or incorrect.

    '
plausible_alternative_directions:
- label: outdated tax tables
  description: 'The app might use stale tax brackets, standard deduction amounts,
    or rate schedules from a prior year, producing a result that differs from current-year
    rules regardless of how polished the interface looks.

    '
- label: data-entry transcription error
  description: 'The user may have entered an income or deduction figure incorrectly
    into the app, causing the calculated refund to differ from what a correct filing
    would show.

    '
