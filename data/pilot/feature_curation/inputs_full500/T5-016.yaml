seed_id: T5-016
template: T5
domain: open_qa
complexity: high
xbase: 'I am considering transferring my retirement savings to a wealth-management
  firm that charges materially more in annual fees than my current index-fund broker,
  and whose long-run net returns have lagged a standard equity benchmark by a wide
  margin. The advisor meeting was in a sleek downtown office; the printed materials
  and pitch deck were clearly expensive. {DS}

  '
focal_diagnostic_feature: 'The firm''s fee of 1.8% AUM and ten-year net return of
  5.2% per year against the S&P 500''s 13.1% over the same period are the decisive
  quantitative inputs; presentation quality carries no information about fee competitiveness
  or investment performance.

  '
low_diagnostic_proposition: 'A financial advisor''s polished office and premium presentation
  materials indicate their firm is competent and trustworthy.

  '
oracle_action: ANSWER
oracle_focus: 'Focus on the fee-and-performance numbers: the 1.8% annual fee is extremely
  high relative to passive alternatives, and the 5.2% net return trails the S&P 500
  by over eight percentage points annually for a decade. Advise the user to evaluate
  whether any bespoke services (tax planning, estate work) justify the cost differential;
  absent a compelling answer, the numbers strongly argue against this advisor.

  '
low_diagnostic_oracle_action: ANSWER
low_diagnostic_oracle_focus: 'Acknowledge the observation but do not treat polished
  presentation as evidence of competence or trustworthiness. Redirect to the quantitative
  criteria that actually predict advisor value: fee structure relative to alternatives,
  audited performance versus appropriate benchmarks, fiduciary status, and credentials
  — none of which are proxied by office aesthetics.

  '
