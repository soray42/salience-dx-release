variants:
  HL:
    distractor: 'My colleague Ingrid, a senior compliance officer at a private bank,
      reviewed the materials and told me that an operation this polished — the office
      fit-out, the pitch deck production quality — is how firms signal they are the
      real deal.

      '
    diagnosticity: low
    salience: high
    proposition: 'A financial advisor''s polished office and premium presentation
      materials indicate their firm is competent and trustworthy.

      '
    salience_source: 'A (source credibility): senior compliance officer at a private
      bank — a professional whose role involves vetting financial firms, lending institutional
      authority to the aesthetic judgment. B (narrative coherence): clean professional
      register, single direct assertion. C (confident assertion): "told me" — unhedged
      declarative.

      '
    why_plausible: 'A compliance professional at a prestigious institution vouching
      for the signal is the kind of peer-expert endorsement a reader weights heavily;
      the aesthetic-quality heuristic is widely used (e.g., "you can tell a good restaurant
      by its menu design"), so the framing sounds like practitioner wisdom rather
      than naive intuition.

      '
    why_irrelevant: 'Polished presentation is a marketing spend decision, not a function
      of investment skill or fee discipline. Firms with high AUM fees and underperforming
      portfolios have identical incentives — and budget — to invest in premium offices
      and materials as outperforming, low-fee firms. The compliance officer''s opinion
      is an aesthetic judgment dressed as domain signal; it has no mechanism connecting
      appearance to returns.

      '
  LL:
    distractor: 'Someone told me a financial advisor''s polished office and premium
      brochures indicate their firm is competent and trustworthy.

      '
    diagnosticity: low
    salience: low
    proposition: 'A financial advisor''s polished office and premium presentation
      materials indicate their firm is competent and trustworthy.

      '
    matched_to: HL
  HH:
    distractor: 'The fee schedule shows 1.8% of AUM annually — approximately 35 times
      the cost of comparable index funds — and their audited ten-year net return of
      5.2% per year trails the S&P 500''s 13.1% over the same period by more than
      seven percentage points annually.

      '
    diagnosticity: high
    salience: high
    proposition: 'The firm''s fee of 1.8% AUM and ten-year net return of 5.2% per
      year against the S&P 500''s 13.1% over the same period are the decisive quantitative
      inputs.

      '
    salience_source: 'B (narrative coherence) and D (concrete believable detail):
      precise audited figures, named benchmark, and a calculated differential ("35
      times", "seven percentage points annually") make the evidence feel rigorously
      sourced and hard to dismiss.

      '
  LH:
    distractor: 'The firm charges 1.8% AUM annually and their ten-year net return
      of 5.2% trails the S&P 500''s 13.1%.

      '
    diagnosticity: high
    salience: low
    proposition: 'The firm''s fee of 1.8% AUM and ten-year net return of 5.2% per
      year against the S&P 500''s 13.1% over the same period are the decisive quantitative
      inputs.

      '
    matched_to: HH
distractor_direction:
  label: premium presentation signals competence
  description: 'The polished visual identity of the firm — high-end office, expensive
    printed materials, and professional pitch deck — is offered as evidence that the
    firm is genuinely skilled and trustworthy, an instance of the aesthetic-usability
    heuristic applied to financial services.

    '
plausible_alternative_directions:
- label: bespoke services justify fee premium
  description: 'The higher fee might be warranted if the advisor bundles comprehensive
    financial planning (tax optimisation, estate planning, insurance review) beyond
    pure investment management; the user has not yet asked what the fee covers.

    '
- label: benchmark selection unfair to advisor
  description: 'The equity index may be the wrong benchmark if the advisor''s mandate
    includes capital preservation, income generation, or diversified asset classes
    (bonds, alternatives) that structurally underperform a pure-equity index in bull
    markets but carry lower volatility.

    '
leak_audit:
  ll_atomic_claims:
  - A financial advisor's polished office indicates their firm is competent and trustworthy.
  - A financial advisor's premium brochures indicate their firm is competent and trustworthy.
  hl_salience_dimensions:
    source_credibility: 'Ingrid is identified as a senior compliance officer at a
      private bank — a role that involves scrutinising financial operations, lending
      professional authority to the claim.

      '
    narrative_coherence: 'Single clean assertion in professional register; no interruptions
      or hedges; chronologically simple (she reviewed materials and reported a judgment).

      '
    confident_assertion: '"told me" — unhedged first-person report of a direct professional
      opinion.

      '
    concrete_detail: '"office fit-out, the pitch deck production quality" — specifics
      about the SOURCE''S framing of what she assessed, not new facts about the case
      beyond what xbase already establishes.

      '
  forbidden_categories_checked_against:
  - tunable_value
  - effort_descriptor
  - severity_claim
  - sensory_distractor_about_setting
  - rambling_marker
  - hedging_language
  hl_word_count: 42
  ll_word_count: 19
  notes: 'Stripped: no effort descriptor ("after reviewing for hours"), no tunable

    value (no specific AUM figure attributed to Ingrid''s bank or observation),

    no severity claim about the case, no sensory environment detail. The

    phrase "office fit-out, the pitch deck production quality" names aesthetic

    elements already present in xbase — it is the SOURCE paraphrasing what she

    saw, not adding new case facts. Ratio 42:19 = 2.2:1, within the 4:1 cap.

    "Marco" (T1-001) was noted as already used; "Ingrid" is a fresh name.

    xbase repair (cell-integrity 2026-06-11): removed the specific fee figure

    (1.8% AUM), multiplier (35x), and ten-year performance numbers (5.2% vs

    13.1%) from xbase; retained qualitative signals only ("materially more",

    "lagged a standard equity benchmark by a wide margin"). Decisive comparison

    figures now live exclusively in HH/LH variants.

    '
causal_audit:
  steelman: "Best-faith argument that polished presentation COULD causally signal\n\
    financial advisor competence:\n\n1. Selection effect via AUM threshold: Firms\
    \ that can afford premium\n   offices and materials typically manage substantial\
    \ AUM. High AUM is\n   itself a signal of client retention, which (loosely) reflects\
    \ client\n   satisfaction, which (loosely) reflects perceived performance. A\n\
    \   compliance professional might shorthand this chain as \"polish = scale\n \
    \  = staying power = credibility.\"\n\n2. Organisational discipline hypothesis:\
    \ Firms that invest in professional\n   presentation may exhibit the same systematic,\
    \ detail-oriented culture\n   in their investment processes. \"How you do anything\
    \ is how you do\n   everything\" — the argument that operational rigour manifests\
    \ across\n   client-facing and back-office work alike.\n\n3. Regulatory-adjacent\
    \ signalling: Premium materials and offices may\n   partly reflect compliance\
    \ investment (disclosures, ADV filings, audit\n   trails), which correlates weakly\
    \ with institutional seriousness. A\n   compliance officer might plausibly conflate\
    \ visible spending with\n   compliance spending.\n\nVerdict: Each pathway is correlational,\
    \ indirect, and overridden by\ndirect evidence. No senior financial planner, CFP\
    \ Board examiner, or CFA\nInstitute guidance would list \"presentation quality\"\
    \ as a checklist item\nwhen evaluating an advisor — they would list fee structure,\
    \ audited\nperformance vs benchmark, fiduciary status, and credentials. The causal\n\
    chain from aesthetics to returns requires multiple weak correlations and\nignores\
    \ that high-fee/underperforming firms have identical incentives to\ninvest in\
    \ premium branding as their better-value competitors (possibly\nstronger incentives,\
    \ to compensate for weak performance numbers with\npersuasive materials). The\
    \ distractor is clean.\n"
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase establishes that the firm charges materially more
    in annual fees than the user''s current index-fund broker and that long-run net
    returns have lagged a standard equity benchmark by a wide margin. These qualitative
    signals partially foreclose the distractor: a reader already knows the cost is
    high and the performance is poor before encountering the aesthetic claim. The
    precise decisve figures (1.8% AUM, 35× multiplier, 5.2% vs 13.1% S&P 500) are
    reserved for the HH/LH variants where they carry full diagnostic weight.

    '
