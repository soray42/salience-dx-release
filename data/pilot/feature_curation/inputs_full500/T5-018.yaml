xbase: 'I''m choosing between two electricians to rewire part of my house. Their quotes
  are within a few percent of each other and both can start the same week. One, Voltarepair,
  has a gorgeous brand: a slick website, a wrapped van, matching uniforms, the works.
  The other operates plainly, just a phone number and a basic email. I want the job
  done safely and well. {DS}'
focal_diagnostic_feature: The plainly presented electrician is licensed, fully insured,
  and has a dozen strong recent references; Voltarepair is unlicensed for this work,
  carries no liability insurance, and could supply only two vague references.
low_diagnostic_proposition: Voltarepair's polished, professional branding indicates
  it is the higher-quality, more reliable electrician.
