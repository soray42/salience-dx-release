variants:
  HL:
    distractor: The project page really does look dead — a stub README, a pixelated
      old logo, a site stuck in 2009 — and my teammate's point is that a library nobody
      bothers to make presentable is exactly the kind of thing that has quietly stopped
      being maintained underneath.
    diagnosticity: low
    salience: high
    proposition: The library's dated, bare-looking project page indicates it is abandoned
      and should be replaced.
    salience_source: B/D — vivid concrete detail of the dated page carrying the bridge
      that a neglected-looking project is an unmaintained one.
    why_plausible: Abandoned projects often do have stale, neglected pages, so a dated
      page is a real and common warning sign.
    why_irrelevant: Page aesthetics are decoupled from maintenance activity; a plain
      page can sit atop an actively developed codebase, which only the repo's activity
      reveals.
  LL:
    distractor: The library's dated, bare-looking project page indicates it is abandoned
      and should be replaced.
    diagnosticity: low
    salience: low
    proposition: The library's dated, bare-looking project page indicates it is abandoned
      and should be replaced.
    matched_to: HL
  HH:
    distractor: Looking at the repository rather than the homepage, there are commits
      from this past week, maintainers are closing issues within a day or two, the
      latest release shows a green CI badge, and several frameworks we already use
      list it as a dependency.
    diagnosticity: high
    salience: high
    proposition: The repository shows commits within the last week, maintainers closing
      issues within days, a green CI badge on the latest release, and it is a declared
      dependency of several widely used frameworks.
    salience_source: Concrete maintenance signals — fresh commits, days-fast issue
      turnaround, passing CI, downstream adoption — make active upkeep undeniable.
  LH:
    distractor: The repository has commits this past week, issues closed within days,
      a passing CI badge on the latest release, and adoption by several major frameworks.
    diagnosticity: high
    salience: low
    proposition: The repository shows commits within the last week, maintainers closing
