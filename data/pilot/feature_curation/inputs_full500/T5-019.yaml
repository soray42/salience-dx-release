seed_id: T5-019
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: We rely on a small open-source library for date parsing, and a teammate wants
  to rip it out because its project page looks abandoned — a bare README, an ancient
  logo, a site straight out of 2009. We have learned that dated look is just the maintainer's
  minimalist style and is never synced with the project, so the page tells us nothing
  about whether the code is maintained. Swapping it would touch a lot of code, and
  I am trying to decide whether the replacement is worth the risk. {DS}
focal_diagnostic_feature: The repository shows commits within the last week, maintainers
  closing issues within days, a green CI badge on the latest release, and it is a
  declared dependency of several widely used frameworks.
low_diagnostic_proposition: The library's dated, bare-looking project page indicates
  it is abandoned and should be replaced.
oracle_action: ANSWER
oracle_focus: Keep the library; recent commits, fast issue turnaround, passing CI,
  and its use by major frameworks show it is actively maintained, so a risky, large
  swap is not justified by its dated page.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer abandonment from the page's look. Ask about
  commit recency, issue response times, CI status, and downstream adoption.
