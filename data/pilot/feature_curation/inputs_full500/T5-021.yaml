domain: technical_troubleshooting
complexity: low
xbase: I use a password-manager browser extension and I'm tempted to switch to a flashier
  commercial one. The one I have works, but its interface looks homemade — a plain
  icon, basic dialog boxes, no animations, nothing slick. The alternative looks gorgeous
  and modern. Since this tool guards every account I have, I want whichever one is
  actually the most secure. {DS}
focal_diagnostic_feature: The plain extension is open-source and has a recent independent
  security audit published with no critical findings, while the flashy alternative
  is closed-source and has never been independently audited.
low_diagnostic_proposition: The polished, modern-looking extension is the more secure
  and trustworthy choice because of how refined it looks.
oracle_action: ANSWER
oracle_focus: Keep the plain extension; an open-source tool with a clean published
  independent audit is the stronger security choice, and the flashy alternative's
  unaudited closed source is what actually matters, not its visual polish.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not equate a refined interface with security. Ask
  whether each extension is open-source and whether it has a published independent
  security audit.
