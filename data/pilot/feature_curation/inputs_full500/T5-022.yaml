xbase: I'm hiring a photographer for an event and I'm down to two. Their prices are
  almost identical and both are free on my date. One has a breathtaking portfolio
  site — elegant typography, immersive full-screen galleries — though a footer credit
  shows a hired web-design studio built it. The other's site is a plain template with
  images dropped into a basic grid. I want whoever will actually nail focus, lighting,
  and on-time delivery on the day. {DS}
focal_diagnostic_feature: Full delivered client galleries and reviews show the plain-site
  photographer consistently nails focus, lighting, and delivers on time, while the
  stunning-site photographer's complete sets are uneven with repeated complaints about
  missed key moments and late delivery.
low_diagnostic_proposition: The photographer with the polished, professional portfolio
  site is the more reliable choice who will deliver better photos.
oracle_action: ANSWER
oracle_focus: Hire the plain-site photographer; their full delivered galleries are
  consistently strong and on time, while the stunning site sits atop uneven complete
  work and repeated missed-moment and late-delivery complaints.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer skill from portfolio-site design. Ask to
  see each photographer's full delivered client galleries and their reviews on consistency
  and delivery.
