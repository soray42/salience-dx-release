causal_audit:
  steelman: 'The strongest argument was aesthetic transfer: a photographer whose own
    portfolio site shows refined visual

    composition and design taste plausibly applies the same eye to framing and editing,
    making site craft a weak

    signal of photographic skill. That mechanism is foreclosed: xbase states a footer
    credit shows the polished site

    was built by a hired web-design studio, so the design eye is not the photographer''s.
    The residual bridge — a

    professional web presence implies a more reliable operator — has no mechanism
    for whether THIS photographer nails

    focus, lighting, and on-time delivery on the day; presentation polish and shoot-day
    execution are independent,

    and the decisive consistency/delivery evidence lives only in HH/LH.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase's footer-credit line (the polished site was built
    by a hired web-design studio) forecloses the aesthetic-transfer mechanism — the
    photographer's own design eye — without supplying any affirmative cause; it does
    not let xbase reject the distractor's conclusion, since the deciding full-gallery
    and review evidence is supplied only in HH/LH.
