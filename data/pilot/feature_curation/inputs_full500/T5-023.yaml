seed_id: T5-023
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Our REST API is returning stale product data to clients even after we update
  the backend records. The backend service itself always returns fresh data when called
  directly. We introduced a CDN layer two months ago and the staleness issue has become
  noticeable and consistent over the past two weeks. {DS}
focal_diagnostic_feature: None of the backend API responses include a Cache-Control
  header, so the CDN applies its default 24-hour TTL and serves cached content until
  that window expires.
low_diagnostic_proposition: The CDN administration console has an outdated appearance,
  suggesting the cache configuration may be poorly maintained.
oracle_action: ANSWER
oracle_focus: Add Cache-Control headers to API responses with an appropriate max-age
  or no-store directive so the CDN stops applying its 24-hour default TTL to mutable
  data.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer cache configuration quality from the console's
  visual design. Ask for the Cache-Control headers present in API responses and the
  CDN's default TTL behaviour when headers are absent.
cell_oracles:
  HL:
    action: ASK
    focus: Do not infer cache configuration quality from the console's visual design.
      Ask for the Cache-Control headers present in API responses and the CDN's default
      TTL behaviour when headers are absent.
  LL:
    action: ASK
    focus: Do not infer cache configuration quality from the console's visual design.
