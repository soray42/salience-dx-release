variants:
  HL:
    distractor: The CDN management console looks genuinely neglected — grey-on-grey
      navigation, a settings menu referencing a product name from 2019, and tooltip
      text that still advertises features the vendor discontinued — and that visual
      decay makes me question whether the caching rules are actually being applied
      correctly.
    diagnosticity: low
    salience: high
    proposition: The CDN administration console has an outdated appearance, suggesting
      the cache configuration may be poorly maintained.
    salience_source: B/C — vivid enumeration of specific visual symptoms in a confident
      first-person register implies direct observation and informed aesthetic judgment.
    why_plausible: Engineers do sometimes infer operational neglect from unmaintained
      tooling; a console frozen in time raises a reasonable suspicion that someone
      stopped actively managing the configuration.
    why_irrelevant: The console's visual design reflects only the vendor's UI investment
      decisions, not the correctness of any caching rules; the absence of Cache-Control
      headers in API responses is a code-level omission entirely independent of how
      the CDN dashboard looks.
  LL:
    distractor: The CDN administration console has an outdated appearance, suggesting
      the cache configuration may be poorly maintained.
    diagnosticity: low
    salience: low
    proposition: The CDN administration console has an outdated appearance, suggesting
      the cache configuration may be poorly maintained.
    matched_to: HL
  HH:
    distractor: Inspecting response headers with curl shows none of the product API
      responses include a Cache-Control header; the CDN vendor's documentation confirms
      the platform defaults to a 24-hour TTL for any cacheable response that arrives
      without an explicit Cache-Control directive.
    diagnosticity: high
    salience: high
    proposition: None of the backend API responses include a Cache-Control header,
      so the CDN applies its default 24-hour TTL and serves cached content until that
      window expires.
    salience_source: B — concrete tool output (curl header inspection) cross-referenced
      with vendor documentation, presenting a complete mechanism from missing header
      to 24-hour stale window.
  LH:
    distractor: API responses carry no Cache-Control header; the CDN defaults to a
      24-hour TTL when absent, causing stale content to be served.
    diagnosticity: high
    salience: low
    proposition: None of the backend API responses include a Cache-Control header,
      so the CDN applies its default 24-hour TTL and serves cached content until that
      window expires.
    matched_to: HH
distractor_direction:
  label: CDN console neglect
  description: Investigating whether the outdated appearance of the CDN management
    console indicates that caching rules are misconfigured or not actively maintained.
plausible_alternative_directions:
- label: CDN purge rule misconfiguration
  description: A specific CDN purge or invalidation rule was set incorrectly, preventing
    cache entries from being cleared when records are updated on the backend.
- label: CDN origin shield caching
  description: An intermediate origin-shield layer within the CDN is caching responses
    that bypass the primary CDN edge cache and ignoring purge signals.
- label: application-layer caching bug
  description: An in-process cache in the backend service layer is serving stale data
    before responses even reach the CDN, making the CDN layer appear responsible.
