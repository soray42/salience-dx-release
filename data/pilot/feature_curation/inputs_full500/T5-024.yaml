causal_audit:
  steelman: 'Investment in UI/UX quality does sometimes signal broader engineering
    discipline within

    a company. An organisation that ships polished animations and thoughtful information

    architecture may also invest heavily in its data pipelines and categorisation
    models.

    Additionally, a well-designed interface can make manual corrections faster and
    less

    painful, which partly compensates for lower automatic accuracy. However, the two-week

    parallel trial provides direct empirical measurement of both connection reliability

    and categorisation accuracy — the exact criteria stated. The UI quality inference

    is a prior that the trial data directly contradicts for this specific pair of
    apps;

    there is no defensible mechanism by which spending-wheel animation quality causes

    better bank-API connection handling.

    '
