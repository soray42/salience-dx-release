distractor_direction:
  label: interface polish as reliability proxy
  description: Inferring that App A's visually sophisticated interface indicates higher
    reliability and accuracy of its underlying categorisation and connection logic.
plausible_alternative_directions:
- label: long-term data export and portability
  description: The ability to export transaction history in a portable format (CSV,
    OFX) may matter more over time than short-term categorisation accuracy alone.
- label: customer support and update frequency
  description: Bank connection integrations break when institutions change their APIs;
    the vendor's update speed and support responsiveness are relevant for a multi-account
    setup over years.
- label: privacy and data-sharing policy
  description: Both apps likely share aggregated or anonymised data with third parties;
    the specific data-sharing terms could outweigh feature differences for some users.
