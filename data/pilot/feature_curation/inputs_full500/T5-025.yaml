causal_audit:
  steelman: 'When a previously working integration breaks without any code change
    on the client

    side, a provider-side API change is the most natural first hypothesis. Outdated

    documentation is a genuine (if imperfect) proxy for operational neglect, and providers

    that do not maintain their docs sometimes also do not notify integrators of breaking

    changes. A 400 Bad Request with no code change on the client could plausibly result

    from the provider adding a required field, changing an enum value, or tightening

    header validation. However, the API error response body provides an explicit,

    machine-readable statement of the exact failure reason. The message ''Content-Type

    must be application/json'' is not ambiguous; it identifies a client-side header

    misconfiguration, not a schema change, and is present regardless of what the

    documentation looks like.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: provider confirmed the API contract is unchanged, ruling
    out the undocumented-provider-change hypothesis without naming the client-side
    Content-Type cause.
