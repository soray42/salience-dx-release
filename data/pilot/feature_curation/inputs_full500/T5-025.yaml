distractor_direction:
  label: undocumented provider API change
  description: Investigating whether the third-party API provider silently changed
    its contract or behaviour, with documentation neglect as evidence of poor change
    communication.
plausible_alternative_directions:
- label: authentication or credential expiry
  description: The API credentials or a signed token may have expired or been revoked
    by the provider, causing the 400 rather than a 401 if the provider conflates validation
    errors.
- label: provider rate-limit or quota enforcement
  description: The provider may have introduced or lowered a request-rate or quota
    limit and is returning 400 instead of 429, causing failures that look like a validation
    error but are actually throughput enforcement.
- label: library or dependency update
  description: A transitive dependency update in the integration stack may have silently
    changed how the HTTP client serialises and sets headers, without the integration
    code itself being modified.
