domain: technical_troubleshooting
complexity: low
xbase: Our integration with a third-party REST API has started returning 400 Bad Request
  on every POST request this week. The same endpoint worked correctly six months ago.
  We have not changed the integration code recently and our API credentials are still
  valid. The provider has confirmed that their published API contract is unchanged.
  {DS}
focal_diagnostic_feature: 'The API error response body states ''Content-Type must
  be application/json''; the client is sending Content-Type: application/x-www-form-urlencoded.'
low_diagnostic_proposition: The provider's API documentation looks outdated, suggesting
  the API may have undocumented breaking changes causing the 400 errors.
oracle_action: ANSWER
oracle_focus: Update the request Content-Type header to application/json and ensure
  the POST body is serialised as JSON rather than form-encoded.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer undocumented breaking changes from documentation
  aesthetics. Ask for the exact error response body and the Content-Type header the
  client is sending.
