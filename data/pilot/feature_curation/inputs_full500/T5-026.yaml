xbase: My monthly food-delivery spending jumped by about €28 last month and I cannot
  explain where the increase came from. I have not added any new restaurants to my
  saved list or started ordering more frequently than before. The service automatically
  applies my usual payment card. {DS}
focal_diagnostic_feature: The account history shows an automatic upgrade to a premium
  membership tier at the start of last month, adding a €28 monthly fee the user did
  not knowingly authorise.
low_diagnostic_proposition: The app has a poorly designed interface, suggesting the
  pricing engine may be unreliable and is probably overcharging.
oracle_action: ANSWER
oracle_focus: Identify the automatic premium membership upgrade as the source of the
  €28 increase; contact the service to dispute or cancel the unauthorised tier change
  and request a refund.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer billing errors from the app's visual quality.
  Ask the user to review their account transaction history and any notification emails
  before drawing conclusions about the cause.
