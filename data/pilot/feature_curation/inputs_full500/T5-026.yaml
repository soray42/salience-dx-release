  steelman: 'A senior payment-systems engineer might argue: poor front-end quality
    often correlates with

    under-resourced teams that also cut corners in billing logic; race conditions
    or incorrect

    subscription-state machines are common in low-investment codebases. Therefore
    the UI appearance

    could be a weak proxy for billing reliability.

    '
