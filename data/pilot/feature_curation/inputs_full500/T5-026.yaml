distractor_direction:
  label: Pricing engine error
  description: Investigating whether the food-delivery service's billing system is
    malfunctioning or applying erroneous charges, indicated by the app's poor visual
    quality.
plausible_alternative_directions:
- label: Delivery fee increase
  description: The platform may have raised its base delivery fees or service charges,
    increasing spend without any change in order frequency.
- label: Promotional discount expiry
  description: A discount code or referral credit applied to earlier orders may have
    expired, causing the effective monthly spend to rise.
- label: Hidden tip or surge charge
  description: Automated or default tipping settings, or dynamic surge pricing on
    specific routes, may account for the unexplained increase.
