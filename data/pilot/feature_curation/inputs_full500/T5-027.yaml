  - There is a queue depth of 47 waiting threads.
  - A single slow analytical query has been running since this morning.
  - The query has held open connections for over 90 minutes.
  - The connections have not been released.
  hl_salience_dimensions:
    source_credibility: N/A
    narrative_coherence: Specific inventory of dashboard defects with a causal backstory
      (unfinished migration) leading to a professional-sounding conclusion about monitoring
      reliability.
    confident_assertion: '"almost certainly means we are not seeing the real failure
      and should assume" — strong epistemic claim with no hedging.'
    concrete_detail: Named defect types (half-configured panels, empty graphs, stale
      titles) and causal context (unfinished migration) — all about the monitoring
      environment, not the service failure.
