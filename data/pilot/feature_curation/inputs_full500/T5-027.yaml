distractor_direction:
  label: Unobservable severe failure
  description: Treating the incomplete monitoring dashboard as evidence that the real
    failure is more severe than it appears and cannot be diagnosed without better
    observability tooling first.
plausible_alternative_directions:
- label: Downstream database overload
  description: The database server itself may be under CPU or I/O pressure from an
    external source, making all connections slow to process regardless of pool size.
- label: Thread or goroutine leak
  description: The application may have a leak in its connection-handling concurrency
    layer, accumulating blocked threads that are not released even after requests
    complete.
- label: Network degradation to database
  description: Transient packet loss or increased latency on the network path to the
    database could cause slow queries and connection-hold times without a query-level
    fault.
