seed_id: T5-027
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Our internal REST endpoint has been returning HTTP 503 intermittently for the
  past two hours. The errors appear across multiple clients and the application logs
  show upstream connection failures. We deployed nothing to this service today, and
  I have checked that DNS resolution and load-balancer health checks look normal.
  {DS}
focal_diagnostic_feature: Database connection-pool utilisation is at 100% with a large
  queue of waiting threads; a single long-running analytical query has held connections
  open for over 90 minutes without releasing them.
low_diagnostic_proposition: The observability dashboard looks incomplete and poorly
  organised, suggesting the monitoring is unreliable and the real failure is probably
  severe.
oracle_action: ANSWER
oracle_focus: Kill or cancel the long-running query holding the connection pool; investigate
  why it was admitted without a query timeout and add a statement timeout to prevent
  recurrence.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume severity from dashboard appearance. Ask
  for connection-pool metrics, active query lists, and application-level error details
  before concluding how serious the failure is.
