  HH:
    distractor: The database connection-pool metrics show 100% utilisation with a
      queue depth of 47 waiting threads; a single slow analytical query running since
      this morning has held open connections for over 90 minutes without releasing
      them.
    diagnosticity: high
    salience: high
    proposition: Database connection-pool utilisation is at 100% with a large queue
      of waiting threads; a single long-running analytical query has held connections
