    focal evidence in HH/LH is what resolves the diagnostic direction.

    '
causal_audit:
  steelman: 'An experienced SRE might argue: if monitoring is genuinely incomplete,
    the team may be treating

    a partial view of metrics as complete information, causing them to miss correlated
    failures (e.g.,

    a memory leak alongside the 503s). Incomplete observability is a real operational
    risk that a

    practitioner would want to resolve before trusting any single data point. Therefore
    the dashboard

    quality is a legitimate concern that could inform the diagnostic process.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — xbase does not close the monitoring-reliability pathway;
    the decisive evidence lives in HH/LH (the specific connection-pool and long-running
    query data).
