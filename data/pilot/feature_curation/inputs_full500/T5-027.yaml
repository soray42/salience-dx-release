variants:
  HL:
    distractor: Our observability dashboard has half-configured panels with empty
      graphs and stale titles from a migration that was never finished. A monitoring
      setup this disorganised almost certainly means we are not seeing the real failure
      and should assume the service itself is broken beyond a simple fix.
    diagnosticity: low
    salience: high
    proposition: The observability dashboard looks incomplete and poorly organised,
      suggesting the monitoring is unreliable and the real failure is probably severe.
    salience_source: B (specific concrete inventory — half-configured panels, empty
      graphs, stale titles, unfinished migration — in professional register), C (confident
      assertion — "almost certainly means")
    why_plausible: A senior SRE who has inherited poorly maintained observability
      stacks might genuinely doubt whether incomplete dashboards are masking a deeper
      systemic failure, and the framing sounds like reasoned engineering caution rather
      than a guess.
    why_irrelevant: Dashboard visual completeness has no constructible mechanism for
      the severity of the underlying service failure; the connection pool being exhausted
      by one slow query is a specific, fixable condition independent of whether the
      dashboard panels are configured.
  LL:
    distractor: The observability dashboard looks incomplete and poorly organised,
      suggesting the monitoring is unreliable and the real failure is probably severe.
    diagnosticity: low
    salience: low
    proposition: The observability dashboard looks incomplete and poorly organised,
