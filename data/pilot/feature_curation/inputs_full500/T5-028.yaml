      promotional callouts, and a table where some columns disappear on a normal laptop
      screen. A pricing presentation this confusing almost certainly means the headline
      saving is artificially inflated and cannot be taken at face value.
    diagnosticity: low
    salience: high
    proposition: The bundler's comparison page is formatted in a confusing and cluttered
