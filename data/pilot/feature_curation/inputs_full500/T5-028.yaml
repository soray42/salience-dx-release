      register), C (confident assertion — "almost certainly means ... cannot be taken
      at face value")
    why_plausible: Experienced consumers and financial advisors know that complex
      pricing pages with asterisked small print often conceal conditions that erode
      advertised savings; the detailed visual inventory makes the observation feel
      like domain-experienced caution rather than mere aesthetics.
    why_irrelevant: The visual design of a comparison webpage has no constructible
