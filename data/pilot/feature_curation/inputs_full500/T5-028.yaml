seed_id: T5-028
template: T5
domain: open_qa
complexity: high
xbase: I am deciding whether to bundle my home contents, roadside cover, and pet insurance
  under one provider at €118 per month or keep my three separate policies that renew
  at different times of year. The bundler is offering a locked rate for 24 months.
  My renewal dates are scattered across the calendar, which makes year-on-year comparison
  harder. {DS}
focal_diagnostic_feature: Adding the three current annual premiums yields €1,608 per
  year; the bundle costs €1,416 per year at the locked rate, a verified saving of
  €192 that holds regardless of how the comparison table is formatted. The 24-month
  rate lock also eliminates the renewal-timing variance.
low_diagnostic_proposition: The bundler's comparison page is formatted in a confusing
  and cluttered way, suggesting the headline saving is probably inflated and unreliable.
oracle_action: ANSWER
oracle_focus: Switch to the bundle; the arithmetic from the user's own premium figures
  confirms a genuine €192 annual saving, and the 24-month rate lock resolves the renewal-timing
  comparison problem. Verify that coverage terms are equivalent before committing.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not dismiss the saving based on the comparison page's
  visual quality. Ask the user to add up their actual current premiums and compare
  them to the bundle price directly before concluding the saving is inflated.
