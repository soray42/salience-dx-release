distractor_direction:
  label: Inflated headline saving
  description: Treating the cluttered, asterisk-heavy comparison page as evidence
    that the bundler's quoted saving is artificially inflated and should not be trusted
    at face value.
plausible_alternative_directions:
- label: Coverage-term reduction
  description: The bundle may offer lower coverage limits or exclude conditions present
    in the separate policies, making the apparent saving misleading on a like-for-like
    basis.
- label: Bundler financial stability risk
  description: Concentrating all three policies with one provider creates a single-point-of-failure
    risk if the bundler changes terms, becomes insolvent, or exits a product line
    at renewal.
- label: Cancellation penalty on current policies
  description: Mid-term cancellation of the existing separate policies may trigger
    exit fees that partially or fully offset the projected annual saving from the
    bundle.
