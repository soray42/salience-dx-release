variants:
  HL:
    distractor: The login screen looks like it was designed in 2013 — pixelated icons,
      mismatched fonts, and a colour palette that belongs on a government intranet;
      an interface this careless is usually a sign the whole app is poorly built.
    diagnosticity: low
    salience: high
    proposition: The login screen's visually outdated appearance indicates the whole
      app is poorly built and likely to crash.
    salience_source: B/C — a vivid personal sensory description followed by a confidently
      stated inference ('usually a sign') makes the aesthetic-as-evidence claim feel
      like an expert read.
    why_plausible: Dated UI patterns do sometimes correlate with unmaintained codebases,
      and visually unkempt apps are occasionally the product of neglected engineering;
      a busy reviewer might treat the look as a prior.
    why_irrelevant: Visual styling is independent of crash behaviour; the crash logcat
      identifies a specific NullPointerException in the OAuth handler caused by the
      storage clear, which cannot be inferred from or prevented by updating the UI
      theme.
  LL:
    distractor: The login screen looks visually outdated, which I take as a sign the
      whole app is poorly built.
    diagnosticity: low
    salience: low
    proposition: The login screen's visually outdated appearance indicates the whole
      app is poorly built and likely to crash.
    matched_to: HL
  HH:
    distractor: The Android crash log shows a NullPointerException in the token refresh
      method — the handler tries to read the stored OAuth token, finds null because
      storage was cleared, and crashes before the login screen even accepts credentials.
    diagnosticity: high
    salience: high
    proposition: The Android crash log shows a NullPointerException in the app's OAuth
      token refresh handler, caused by a null token reference left after storage was
      cleared.
    salience_source: Precise exception class, named method, and step-by-step failure
      sequence (read token → find null → crash before credential entry) give concrete,
      checkable technical detail.
  LH:
    distractor: The crash log shows a NullPointerException in the app's OAuth token
      refresh handler, triggered by a null token after storage was cleared.
    diagnosticity: high
    salience: low
    proposition: The Android crash log shows a NullPointerException in the app's OAuth
      token refresh handler, caused by a null token reference left after storage was
      cleared.
    matched_to: HH
distractor_direction:
  label: Poor UI indicating buggy app
  description: Treating the login screen's outdated visual design as evidence that
    the app is generally poorly built and prone to crashes.
plausible_alternative_directions:
- label: Incomplete storage clear leaving corrupt state
  description: Whether clearing storage left a partially corrupt file or database
    entry that the app cannot parse on re-launch.
- label: Play Store version compatibility issue
  description: Whether the latest Play Store version introduced a regression that
    is unrelated to the storage clear event.
