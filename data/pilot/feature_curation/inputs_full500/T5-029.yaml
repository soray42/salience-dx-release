seed_id: T5-029
template: T5
domain: technical_troubleshooting
complexity: low
xbase: A productivity app on my Android tablet crashes consistently when I try to
  log in. I was previously logged in and the crash started two days ago after I cleared
  the app's storage through system settings. The app is the latest version from the
  Play Store. {DS}
focal_diagnostic_feature: The Android crash log shows a NullPointerException in the
  app's OAuth token refresh handler, caused by a null token reference left after storage
  was cleared.
low_diagnostic_proposition: The login screen's visually outdated appearance indicates
  the whole app is poorly built and likely to crash.
oracle_action: ANSWER
oracle_focus: Clear the app's data again or reinstall it to remove the stale null
  token reference; the crash is in the OAuth refresh handler and is triggered by the
  missing token left after the earlier storage clear.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not treat UI appearance as evidence of code quality
  or crash cause. Ask for the crash log or logcat output before diagnosing the login
  failure.
