causal_audit:
  steelman: 'A practitioner might argue that agencies investing in high-quality proposal
    materials

    tend to work with serious, stable clients who budget properly and honour contracts,

    making the presentation quality a weak but real prior on contract reliability
    and

    payment terms. Furthermore, contract agencies compete for candidates, and polished

    materials signal they value the candidate''s attention. However, pitch-deck quality
    is

    controlled by the agency''s marketing budget, not the end client''s operational
    quality,

    and it says nothing about the net financial comparison once self-employment tax,
    pension,

    health cover, and leave are accounted for. The 14-percent effective advantage
    for the

    permanent role is a factual calculation that the proposal''s appearance cannot
    displace.

    '
