variants:
  HL:
    distractor: The contract agency sent a beautifully designed pitch deck — sharp
      branding, clean data tables, and a cover letter that reads like it was drafted
      by a corporate law firm; a presentation this polished usually means the client
      and opportunity are serious.
    diagnosticity: low
    salience: high
    proposition: The contract proposal materials are professionally polished, which
      is taken as a sign the client and opportunity are serious.
    salience_source: B/C — a vivid, specific sensory description of the pitch deck
      followed by a confidently stated inference ('usually means') frames the aesthetic
      as an expert signal.
    why_plausible: Professional-grade proposal materials do loosely correlate with
      organised, well-resourced clients, and a user anxious about contract risk might
      reasonably treat presentation quality as a credibility signal.
    why_irrelevant: Pitch-deck design is controlled by the agency, not the end client,
      and says nothing about the contract's net financial value, renewal security,
      or career-growth alignment once self-employment tax and benefits are factored
      in.
  LL:
    distractor: The contract proposal materials are professionally polished, which
      I take as a sign the client and opportunity are serious.
    diagnosticity: low
    salience: low
    proposition: The contract proposal materials are professionally polished, which
      is taken as a sign the client and opportunity are serious.
    matched_to: HL
  HH:
    distractor: After accounting for the employer pension, private health cover, and
      25 paid leave days, the permanent role's effective annual value is 14 percent
      above the contract rate after self-employment tax; the permanent role is also
      in my target growth domain while the contract is not.
    diagnosticity: high
    salience: high
    proposition: After accounting for employer pension, private health cover, and
      paid leave, the permanent role's effective annual value exceeds the contract
      net rate by 14 percent, and only the permanent role is in the user's target
      growth domain.
    salience_source: Three named benefit components, a precise 14-percent advantage
      figure adjusted for self-employment tax, and a clear domain-alignment contrast
      make the permanent role's superiority quantified and checkable.
  LH:
    distractor: After benefits, the permanent role's effective value exceeds the contract
      net rate by 14 percent and matches the user's target growth area.
    diagnosticity: high
    salience: low
    proposition: After accounting for employer pension, private health cover, and
      paid leave, the permanent role's effective annual value exceeds the contract
      net rate by 14 percent, and only the permanent role is in the user's target
      growth domain.
    matched_to: HH
distractor_direction:
  label: Polished pitch materials signal quality
  description: Using the contract agency's professionally presented proposal as evidence
    that the contract opportunity is more serious or valuable than the permanent role.
plausible_alternative_directions:
- label: Contract flexibility and autonomy
  description: Whether the renewable contract's flexibility and independence have
    career or lifestyle value that partially offsets the financial and domain disadvantage.
- label: Renewal risk under contract
  description: Whether the six-month renewable nature of the contract introduces income
    uncertainty that further tilts the decision toward the permanent role.
