seed_id: T5-030
template: T5
domain: open_qa
complexity: medium
xbase: I am deciding between a six-month renewable contract role and a permanent position.
  The contract pays a higher day rate, but I would handle my own taxes and receive
  no employer benefits. The two roles differ in scope and focus, and I have a financial
  buffer of about three months of expenses. {DS}
focal_diagnostic_feature: After accounting for employer pension, private health cover,
  and paid leave, the permanent role's effective annual value exceeds the contract
  net rate by 14 percent, and only the permanent role is in the user's target growth
  domain.
low_diagnostic_proposition: The contract proposal materials are professionally polished,
  which is taken as a sign the client and opportunity are serious.
oracle_action: ANSWER
oracle_focus: Choose the permanent role on the disclosed facts; its effective annual
  value exceeds the contract net rate by 14 percent once benefits are counted, and
  it alone aligns with the user's target growth domain, making it superior on both
  financial and career grounds.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not treat proposal presentation quality as evidence
  of opportunity value. Ask for the contract's net effective rate after self-employment
  tax and compare it against the permanent role's total package including benefits
  before deciding.
