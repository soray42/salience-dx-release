seed_id: T5-031
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: My Android app started showing a white flash between screens after I merged
  a UI refresh last week. The transitions worked smoothly before the merge. Other
  animations in the app are running at normal frame rate, and the flash happens on
  every device I have tested, including a brand-new test phone. {DS}
focal_diagnostic_feature: Every activity in the affected transition has its windowBackground
  set to the default white theme color, and the flash duration matches the activity
  creation window before the first frame is drawn.
low_diagnostic_proposition: The app's color palette and icon set look visually outdated
  compared with current Material Design guidelines, which suggests the codebase may
  have technical debt causing the flash.
oracle_action: ANSWER
oracle_focus: Set a custom windowBackground matching the app's background color on
  the affected activities or use a SplashScreen-compatible approach; the flash is
  the system drawing the default white window background before the first rendered
  frame.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer runtime transition behavior from visual
  design style. Ask for the theme's windowBackground value and whether the flash coincides
  with activity creation.
