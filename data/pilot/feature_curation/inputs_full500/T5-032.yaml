seed_id: T5-032
template: T5
domain: open_qa
complexity: high
xbase: I am deciding whether to accept a principal engineer offer at a Series C company
  in my sector. The total compensation is substantially above my current package and
  the scope of the role is larger than anything I have held. I have gone through four
  technical rounds and spoken with the CTO and two staff engineers. I want to make
  sure the engineering culture is genuinely strong before I commit to leaving a stable
  position. {DS}
focal_diagnostic_feature: The company's production systems handle over 200 million
  monthly active users with a measured p99 latency under 120ms, the engineering team
  has shipped three zero-downtime migrations in the past year, and the staff engineers
  who interviewed the candidate hold patents and have top-conference publications
  in the domain.
low_diagnostic_proposition: The company's careers page and public website look visually
  dated and generic, which suggests the engineering culture may be shallow and not
  worth the career risk.
oracle_action: ANSWER
oracle_focus: 'Accept or negotiate from strength: the disclosed production-scale evidence,
  migration track record, and staff engineer credentials are strong positive signals
  that substantially outweigh superficial website aesthetics.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not use website visual design as a proxy for engineering
  culture depth. Ask for production-scale evidence, incident history, engineering
  process, and staff credentials.
