distractor_direction:
  label: dated website aesthetics
  description: Using the company's visually dated and generic careers page and public
    website as evidence that engineering culture is shallow and the offer is a career
    risk.
plausible_alternative_directions:
- label: principal-scope fit
  description: Examining whether the role's actual scope and decision-making authority
    match what the candidate would need to grow into the principal level, beyond the
    title.
- label: equity and compensation structure risk
  description: Evaluating the Series C stage liquidity timeline, dilution risk, and
    whether the total compensation holds up if the equity component does not vest
    on schedule.
- label: CTO leadership stability
  description: Assessing whether the CTO's tenure, vision alignment, and team stability
    are likely to persist long enough for the candidate to have impact at the principal
    level.
