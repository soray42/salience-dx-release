variants:
  HL:
    distractor: When I checked their careers page and main site, the design looked
      visibly dated — generic icons, a template that could be from any mid-2010s SaaS;
      companies proud of their engineers tend to show it, and this aesthetic suggests
      the culture is not deep enough.
    diagnosticity: low
    salience: high
    proposition: The company's careers page and public website look visually dated
      and generic, which suggests the engineering culture may be shallow and not worth
      the career risk.
    salience_source: 'B: vivid first-person investigation narrative with specific
      observation detail (''generic icons'', ''mid-2010s SaaS template''); C: confident
      inferential assertion (''companies proud of their engineers tend to show it'',
      ''this aesthetic suggests'').'
    why_plausible: A busy reader might intuitively associate a polished external presence
      with internal investment; the inference that a company neglecting its own website
      also neglects its engineers has surface appeal as a culture signal.
    why_irrelevant: Website visual design reflects marketing, brand, and design-team
      priorities, not engineering capability; many high-performing engineering organizations
      operate with minimal external branding investment. There is no mechanism by
      which UI aesthetics on a public careers page can inform the technical depth,
      tooling, process rigour, or talent density of an engineering team.
