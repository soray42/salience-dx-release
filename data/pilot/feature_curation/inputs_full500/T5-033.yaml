    extensions:

    teams that have not invested in keeping the widget visually current are often

    the same teams that have not audited the refresh budget logic or updated the

    TimelineProvider implementation for newer OS behaviors. An experienced iOS developer

    seeing a visually unmaintained widget might reasonably flag code quality as a

    contributing concern worth investigating.

    '
