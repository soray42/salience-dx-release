      and may have stale data-fetching logic.
    salience_source: 'B: vivid first-person visual inspection with specific design
      details; C: ''almost certainly a code-quality problem'', confident inferential
      framing.'
    why_plausible: Design debt and code debt often correlate in widget extensions
      maintained by small teams; an engineer looking at a visually neglected widget
      could reasonably suspect the refresh logic received the same neglect.
    why_irrelevant: Visual design age has no mechanism for controlling the WidgetKit
      timeline policy; a beautifully designed widget returns .never just as easily
      as an old-looking one, and vice versa. The policy is a single explicit enum
      value independent of UI assets.
