seed_id: T5-033
template: T5
domain: technical_troubleshooting
complexity: low
xbase: My iOS Home Screen widget stopped refreshing its data. It shows the same stale
  values no matter how long I wait. The host app itself fetches fresh data normally
  when opened. I have not changed device settings or Background App Refresh permissions
  for the widget extension. {DS}
focal_diagnostic_feature: The widget's TimelineProvider returns a Timeline with a
  policy of .never, meaning the WidgetKit framework will not schedule any future refresh;
  this value was hardcoded in a commit three days ago.
low_diagnostic_proposition: The widget's visual design looks old and unpolished compared
  with current iOS design standards, suggesting the widget code has not been maintained
  and may have stale data-fetching logic.
oracle_action: ANSWER
oracle_focus: Change the timeline refresh policy from .never to an appropriate interval
  or after-date policy; the OS will not schedule widget refreshes until the policy
  allows them.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer data-fetch behavior from widget visual style.
  Ask for the TimelineProvider implementation and specifically the timeline refresh
  policy.
