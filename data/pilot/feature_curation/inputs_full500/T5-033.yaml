distractor_direction:
  label: unmaintained widget code quality
  description: Using the widget's visually dated appearance as evidence that the underlying
    data-fetching and refresh logic has also been neglected, causing stale data.
plausible_alternative_directions:
- label: widget extension Background App Refresh budget
  description: Investigating whether the widget extension has exhausted its OS-allocated
    daily refresh budget, causing the OS to defer further refreshes until the next
    day.
- label: App Group data container synchronization
  description: Examining whether the shared App Group container between the host app
    and widget extension is not being written correctly, so the widget displays cached
    data even when the timeline fires.
