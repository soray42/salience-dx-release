seed_id: T5-035
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Our nightly ETL pipeline has been failing on the largest input day of the week
  — Mondays — for the past three weeks. The same pipeline runs cleanly on every other
  day. Airflow shows the task as failed with a database query timeout. We have not
  changed the DAG code recently. {DS}
focal_diagnostic_feature: EXPLAIN ANALYZE reveals a full table scan on 900 million
  rows because the WHERE clause omits the partition column on high-volume days, so
  the query planner bypasses the partition index entirely.
low_diagnostic_proposition: The Airflow DAG graph is visually cluttered and hard to
  follow, suggesting the pipeline code may have maintainability or logic problems.
oracle_action: ANSWER
oracle_focus: Add the partition column to the WHERE clause for Monday's query path
  so the planner uses the partition index instead of a full table scan; validate with
  EXPLAIN ANALYZE before deploying.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer code logic problems from DAG graph appearance.
  Run EXPLAIN ANALYZE on the failing query and check for missing partition predicates
  or plan regressions before reviewing DAG structure.
