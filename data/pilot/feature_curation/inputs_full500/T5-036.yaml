template: T5
domain: open_qa
complexity: high
xbase: I am choosing between two air-source heat pumps for my home. Both models are
  from established manufacturers, both qualify for the same government rebate, and
  both fit our external wall space. I need a system that will be economical over the
  next ten to fifteen years. {DS}
focal_diagnostic_feature: Model B has a SCOP of 4.1 versus Model A's 3.6, a seven-year
  parts-and-labour warranty versus three years, and independent testing projects annual
  running costs approximately £310 lower, recovering Model B's £400 price premium
  in about fifteen months.
low_diagnostic_proposition: Model A's polished visual design and premium finish suggest
  it is the higher-quality and more reliable system.
oracle_action: ANSWER
oracle_focus: Choose Model B; it has superior efficiency, a substantially longer warranty,
  and a payback period under two years on the cost difference — the aesthetic premium
  of Model A has no bearing on long-term running economy.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not use visual finish as a proxy for system quality.
  Ask for SCOP ratings, warranty terms, and projected running costs for both models
  before recommending one.
