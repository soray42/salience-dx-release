- label: Noise level suitability
  description: One unit produces meaningfully less noise at the external condenser,
    which matters for the home's outdoor placement or neighbour proximity.
- label: Smart-home integration
  description: One model integrates with existing home automation in a way that the
    other does not, which could affect practical usability over a fifteen-year horizon.
