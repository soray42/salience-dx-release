causal_audit:
  steelman: 'A practitioner could argue: heavy staining and a cracked door seal on
    a seven-year-old daily-use dryer correlate with hard use that may indicate additional
    wear on bearings, motor brushes, or the drum belt — making a repair less reliable.
    A reputable repair specialist might use cosmetic condition as one input to assess
    overall appliance care. This reasoning has surface plausibility. However, xbase
    provides no independent signal of mechanical degradation beyond the no-heat symptom,
    and the cosmetic observations (staining, seal colour) have no causal mechanism
    for the heating element failure that is being quoted for repair. The economic
    calculation between €95 repair and €380 replacement is the only defensible basis
    for the repair-vs-replace decision in this case; appearance cannot substitute
    for it.

    '
