    matched_to: HH
distractor_direction:
  label: DAG complexity causing model errors
  description: Treating the visual complexity of the dbt dependency graph as evidence
    that the model logic is too convoluted and has become unreliable.
plausible_alternative_directions:
- label: Source table schema change
  description: A column rename or type change in the source table may have altered
    the join key behaviour or silently returned NULL matches.
- label: Incorrect date filter boundary
  description: The model's date filter may have shifted to include additional days
    of data
  inflating period counts.: null
- label: Duplicate rows introduced upstream
  description: An upstream dbt model or ingestion job may have begun producing duplicate
    rows that are passed to this model's source.
