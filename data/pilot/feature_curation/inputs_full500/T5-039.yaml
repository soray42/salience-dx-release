causal_audit:
  steelman: 'A practitioner could argue: a visually complex dbt DAG often reflects
    accumulated technical debt, ad-hoc models, and unmaintained transformations —
    any of which could introduce logic errors including incorrect joins. The correlation
    between DAG complexity and reliability is real in practice. However, correlation
    between complexity and risk is not a causal mechanism for THIS specific symptom
    (row counts inflated 3-5x). DAG visual complexity provides no mechanism for fanout
    row multiplication; a single clean model with a two-table join can produce identical
    fanout if the joined table is not deduplicated. The visual observation cannot
    inform diagnosis of this case.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — xbase does not close any pathway; the decisive cardinality
    evidence lives only in HH/LH.
