seed_id: T5-039
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: A dbt model that aggregates daily transaction counts per customer began producing
  totals three to five times higher than expected about two weeks ago. The underlying
  source tables have not been replaced. Upstream row counts look correct in isolation.
  All dbt run logs show success with no warnings or errors. {DS}
focal_diagnostic_feature: The model joins a transactions table to a customer-segments
  table on customer_id; the segments table has multiple rows per customer, causing
  a fanout that multiplies every transaction row by the number of segment records
  for that customer.
low_diagnostic_proposition: The dbt project's dependency graph looks tangled and visually
  complex, suggesting the model logic is likely broken somewhere inside the DAG.
oracle_action: ANSWER
oracle_focus: Fix the fanout join — either deduplicate the segments table before joining,
  aggregate it into one row per customer, or restructure the join to avoid row multiplication.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer model correctness from DAG visual complexity.
  Ask for the model's SQL join logic and whether the joined table has one row per
  customer.
