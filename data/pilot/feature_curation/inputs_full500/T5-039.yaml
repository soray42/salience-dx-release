    diagnosticity: low
    salience: high
    proposition: The dbt project's dependency graph looks tangled and visually complex,
      suggesting the model logic is likely broken somewhere inside the DAG.
    salience_source: B — vivid sensory description of a specific visual characteristic
      (sprawling tangle, spills off the screen) with a confident inferential frame;
      C — 'I suspect', 'too convoluted to be reliable'.
    why_plausible: A complex dependency graph loosely correlates with model maintainability
      issues, and a non-expert practitioner naturally reads visual complexity as a
      risk signal.
    why_irrelevant: DAG visual complexity has no causal mechanism for row multiplication;
      the fanout is produced by a specific join cardinality issue that would occur
      in a model with a simple linear lineage graph just as readily.
