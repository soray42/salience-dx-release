causal_audit:
  steelman: 'Some older consumer router firmware (e.g., early OpenWrt builds or ancient
    OEM

    releases) genuinely did not support conditional DNS forwarding for custom zones.

    A practitioner could argue that the dated UI signals an old firmware version that

    predates split-zone DNS support. This is a real cause-class — old firmware can

    lack features.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'N/A — xbase notes DNS forwarding is toggled on, but does
    not foreclose the firmware age hypothesis directly. The focal evidence (NXDOMAIN
    for local, success for public) structurally rules it out: if the firmware lacked
    DNS forwarding entirely, public lookups would also fail; the zone-specific failure
    points to a configuration gap, not a firmware capability gap.'
