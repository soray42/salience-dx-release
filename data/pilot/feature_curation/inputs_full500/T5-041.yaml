variants:
  HL:
    distractor: The router admin page uses a washed-out grey layout from around 2009,
      with barely readable tiny text and broken icon fonts, which makes me suspect
      the firmware is simply too outdated to handle modern split-zone DNS forwarding
      at all.
    diagnosticity: low
    salience: high
    proposition: The router admin interface has an older visual design, suggesting
      the firmware may be too outdated to support split-zone DNS forwarding.
    salience_source: B — narrative coherence (specific visual details ground the observation);
      C — confident inferential framing ("makes me suspect").
    why_plausible: Old firmware on consumer routers does sometimes lack advanced DNS
      features; a practitioner skimming the ticket might reasonably flag firmware
      age as a first hypothesis when DNS behaves unexpectedly.
    why_irrelevant: Admin-page visual style reflects only the UI theme, not the DNS
      engine's capabilities. The focal evidence shows public domains resolve correctly
      on the same resolver, which means basic DNS forwarding works; the issue is zone-specific,
      not a general firmware limitation.
  LL:
    distractor: The router admin interface has an older visual design, suggesting
      the firmware may be too outdated to support split-zone DNS.
    diagnosticity: low
    salience: low
    proposition: The router admin interface has an older visual design, suggesting
      the firmware may be too outdated to support split-zone DNS forwarding.
    matched_to: HL
  HH:
    distractor: Running dig from a lab machine returns NXDOMAIN for every hostname
      ending in my local dot-lan suffix, while the same resolver returns correct answers
      for google.com and cloudflare.com within milliseconds.
    diagnosticity: high
    salience: high
    proposition: DNS queries for the local-suffix zone return NXDOMAIN on the home
      resolver while identical queries for public domains succeed immediately, indicating
      the local zone is not being forwarded or served.
    salience_source: B — concrete command and precise contrast (NXDOMAIN for local,
      correct answers for public, within milliseconds).
  LH:
    distractor: DNS queries for the local-suffix zone return NXDOMAIN while public
      domain lookups succeed using the same resolver.
    diagnosticity: high
    salience: low
    proposition: DNS queries for the local-suffix zone return NXDOMAIN on the home
      resolver while identical queries for public domains succeed immediately, indicating
      the local zone is not being forwarded or served.
    matched_to: HH
distractor_direction:
  label: Outdated firmware DNS limitation
  description: Treating the router's old admin-page appearance as evidence that the
    firmware is too outdated to support split-horizon or local-zone DNS forwarding.
plausible_alternative_directions:
- label: Local DNS server misconfiguration
  description: A separate authoritative DNS server for the home lab domain may have
    crashed, lost its zone file, or become unreachable, causing NXDOMAIN for all local
    records.
- label: DNS cache poisoning or stale negative cache
  description: The resolver may have cached a negative (NXDOMAIN) response for the
    local zone from an earlier outage and is serving that cached failure without re-querying.
