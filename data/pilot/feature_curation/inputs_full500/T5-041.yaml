seed_id: T5-041
template: T5
domain: technical_troubleshooting
complexity: low
xbase: My home lab server cannot resolve hostnames under my private local domain suffix,
  even though it has always worked before. Machines on the same subnet reach public
  websites and resolve public domains without any trouble. The router's DNS forwarding
  toggle is enabled in the settings. I have not swapped or reconfigured any network
  hardware this week. {DS}
focal_diagnostic_feature: DNS queries for the local-suffix zone return NXDOMAIN on
  the home resolver while identical queries for public domains succeed immediately,
  indicating the local zone is not being forwarded or served.
low_diagnostic_proposition: The router admin interface has an older visual design,
  suggesting the firmware may be too outdated to support split-zone DNS forwarding.
oracle_action: ASK
oracle_focus: 'Investigate DNS zone configuration: check whether the router has a
  local-zone definition or conditional forwarding entry for the private suffix, and
  verify that the authoritative source for the local domain is reachable and responding.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer firmware capability from admin-page aesthetics.
  Ask for dig output against the home resolver versus a public resolver, and check
  whether a local-zone or conditional-forwarder entry exists for the private suffix.
