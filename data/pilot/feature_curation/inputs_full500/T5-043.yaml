causal_audit:
  steelman: 'Some consumer routers with poor UI quality do have implementation bugs
    in radio

    management, band selection algorithms, or DFS handling — a practitioner could

    argue that the UI''s lack of polish signals overall firmware immaturity that might

    leave band-steering poorly implemented even if nominally present. This is a real

    correlation in the industry for certain budget brands.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'N/A — xbase does not disclose band or band-steering state.
    The focal evidence (all devices on 2.4 GHz, band-steering disabled, 5 GHz empty,
    proximity to router confirmed) provides a complete structural explanation: the
    firmware does support band-steering as a feature; it is simply disabled. UI appearance
    cannot determine whether a configuration toggle is on or off.'
