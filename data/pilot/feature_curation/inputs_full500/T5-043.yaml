variants:
  HL:
    distractor: The router admin interface is crammed with unlabelled sliders, clashing
      pastel buttons, and a layout that breaks on mobile, making it hard to believe
      the firmware manages radio resources competently.
    diagnosticity: low
    salience: high
    proposition: The router admin interface has a confusing and poorly organised visual
      design, suggesting the firmware may not manage radio resources well.
    salience_source: B — specific visual defects (unlabelled sliders, clashing pastel
      buttons, broken mobile layout); C — confident inferential framing ("hard to
      believe").
    why_plausible: Consumer router firmware with poor UI quality sometimes does have
      underlying implementation weaknesses; a practitioner might reasonably treat
      UI chaos as a signal of overall software engineering quality.
    why_irrelevant: Band-steering is a discrete configurable feature, not a symptom
      of general firmware quality. The admin interface's visual design has no constructible
      mechanism for whether band-steering is enabled or whether clients associate
      to 2.4 GHz versus 5 GHz — those are discrete configuration values independent
      of the interface's visual presentation.
  LL:
    distractor: The router admin interface has a confusing and poorly organised visual
      design, suggesting the firmware may not manage radio resources well.
    diagnosticity: low
    salience: low
    proposition: The router admin interface has a confusing and poorly organised visual
      design, suggesting the firmware may not manage radio resources well.
    matched_to: HL
  HH:
    distractor: Every affected device shows it is connected to the 2.4 GHz band at
      20 MHz channel width; the router's band-steering setting is disabled, and the
      5 GHz radio shows no associated clients despite the devices being within two
      metres of the router.
    diagnosticity: high
    salience: high
    proposition: Every affected device is connected to the 2.4 GHz band at 20 MHz
      channel width, band-steering is disabled in the router settings, and the 5 GHz
      radio shows no associated clients despite devices being within two metres of
      the router.
    salience_source: B — specific band and channel width from client association tables
      (2.4 GHz, 20 MHz), named setting (band-steering disabled), and the concrete
      proximity detail (within two metres).
  LH:
    distractor: All affected devices connect to 2.4 GHz at 20 MHz; band-steering is
      off and the 5 GHz radio has no associated clients.
    diagnosticity: high
    salience: low
    proposition: Every affected device is connected to the 2.4 GHz band at 20 MHz
      channel width, band-steering is disabled in the router settings, and the 5 GHz
      radio shows no associated clients despite devices being within two metres of
      the router.
    matched_to: HH
distractor_direction:
  label: Firmware radio-management incompetence
  description: Treating the router admin interface's cluttered visual design as evidence
    that the firmware is too poorly engineered to manage Wi-Fi radios competently.
plausible_alternative_directions:
- label: 2.4 GHz channel congestion
  description: Even on 2.4 GHz, neighbouring networks could be saturating overlapping
    channels, reducing throughput independently of band-steering configuration.
- label: Broadband line contention
  description: Despite 300 Mbps reaching the router, ISP-side contention or a congested
    backhaul segment could degrade real-world throughput during peak hours.
