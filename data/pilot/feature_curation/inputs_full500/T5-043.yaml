seed_id: T5-043
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: My home Wi-Fi speeds have been poor for two weeks. Speed tests on my phone
  show only 8 to 12 Mbps download even though my broadband line delivers over 300
  Mbps to the router. Other household devices have the same problem. The router was
  not changed and no new appliances were added. {DS}
focal_diagnostic_feature: Every affected device is connected to the 2.4 GHz band at
  20 MHz channel width, band-steering is disabled in the router settings, and the
  5 GHz radio shows no associated clients despite devices being within two metres
  of the router.
low_diagnostic_proposition: The router admin interface has a confusing and poorly
  organised visual design, suggesting the firmware may not manage radio resources
  well.
oracle_action: ANSWER
oracle_focus: Enable band-steering in the router settings so nearby devices connect
  to the 5 GHz radio instead of defaulting to the slower 2.4 GHz band.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer radio management quality from the admin
  interface's visual design. Ask which band and channel width each device is using,
  and whether band-steering is configured.
