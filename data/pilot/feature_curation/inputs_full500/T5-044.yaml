    matched_to: HH
distractor_direction:
  label: dated OS interface quality signal
  description: Treating Model A's visually outdated smart TV operating system as evidence
    that its image processing pipeline is also inferior to Model B's.
plausible_alternative_directions:
- label: panel technology difference
  description: Checking whether one model uses OLED and the other LED/LCD, which would
    affect contrast, black levels, and viewing angle independently of calibration
    scores.
- label: input lag comparison
  description: Measuring game mode input lag for each model, which is separately important
    for live sport and would not be captured by colour calibration benchmarks alone.
- label: smart feature ecosystem fit
  description: Considering whether the user's streaming services, smart home platform,
    and remote preferences are better served by one model's OS despite its visual
    appearance.
