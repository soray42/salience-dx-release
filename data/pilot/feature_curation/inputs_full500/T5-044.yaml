variants:
  HL:
    distractor: Model A's menu system looks genuinely ancient — a faded grid of blocky
      tiles that belong in 2015 — and that kind of dated software usually means the
      underlying image processing has not been updated either.
    diagnosticity: low
    salience: high
    proposition: Model A's dated smart OS interface suggests its underlying image
      processing is also outdated and inferior.
    salience_source: B/C — specific vivid description of the UI (faded grid, blocky
      tiles, year reference); confident bridge claim ('usually means') in professional-casual
      register.
    why_plausible: Manufacturers who lag in software UI updates sometimes also lag
      in processing firmware; a reader who has seen this correlation might accept
      the aesthetic as a reasonable proxy.
    why_irrelevant: Smart OS interface age and HDR image-processing pipeline quality
      are independently developed and maintained; UI age has no structural relationship
      to calibration accuracy or brightness ceiling, which are determined by panel
      hardware and ISP firmware.
  LL:
    distractor: Model A's interface looks old-fashioned, which probably means its
      image processing is also outdated.
    diagnosticity: low
