      at delta-E 1.8 versus Model B's 3.4, and Model A's peak HDR brightness measures
      12% higher than Model B's in the same test conditions.
    salience_source: B/C — objective measurement figures (delta-E 1.8 vs 3.4, 12%
      HDR lead); cited independent benchmark source; precise comparative framing.
  LH:
    distractor: Calibration benchmarks score Model A at delta-E 1.8 versus Model B's
