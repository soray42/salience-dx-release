causal_audit:
  steelman: 'Some TV manufacturers treat OS software and image-processing firmware
    as part of the same

    product-development cycle; a brand that has not updated its UI since 2015 might
    similarly

    lag in HDR tonemapping algorithm updates. A well-read consumer electronics reviewer
    could

    reasonably list dated OS as a weak negative signal for processing quality.

    '
  steelman_verdict: no_defensible_mechanism
