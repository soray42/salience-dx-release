  - hedging_language
  xbase_word_count: 50
  hl_word_count: 33
  ll_word_count: 17
  hh_word_count: 37
  lh_word_count: 22
  notes: 'T5 inferential bridge ("dated/messy interface → DNS probably misconfigured")
    appears in both

    HL and LL per C1. xbase establishes new-vs-cached asymmetry, pointing to DNS caching
    as the

    mechanism without revealing which resolver layer is at fault. HL:LL 1.9:1; HH:LH
    1.7:1.

    "unlabelled" spelling kept (British English consistent with xbase context).

    '
causal_audit:
  steelman: 'Router admin page quality is a weak proxy for firmware maintenance quality.
    ISP-provided

    routers with dated interfaces often have stale DNS configurations pointing to
    overloaded

    upstream forwarders. In a home setting with a single ISP box, the router IS the
    DNS layer

    for the user, so suspecting it is the first logical step even before measurement.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the focal evidence (dig confirms <3ms from router
    resolver; browser DoH override at 800ms) directly rules out the router's DNS configuration
    as the problem. The xbase symptom pattern (new pages slow, cached pages fine)
    is consistent with either hypothesis so neither is closed in xbase.
unconstructable: false
