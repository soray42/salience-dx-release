seed_id: T5-045
template: T5
domain: technical_troubleshooting
complexity: low
xbase: My home internet browsing has been noticeably slow for about a week, while
  video streaming works fine. Speed tests show I am getting the full bandwidth I pay
  for. The slowness only shows up when loading new websites, not when reloading pages
  I have visited before. I cannot figure out what changed. {DS}
focal_diagnostic_feature: The router's resolver responds in under 3ms, but the browser
  has overridden the system resolver and is using its own DNS-over-HTTPS provider
  averaging 800ms per uncached lookup.
low_diagnostic_proposition: The router admin interface looks dated and disorganised,
  suggesting DNS settings have probably never been configured correctly.
oracle_action: ANSWER
oracle_focus: Disable the browser's custom DNS-over-HTTPS override and revert to the
  system resolver; verify that new-page load times return to normal.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer DNS misconfiguration from the router admin
  page's visual appearance. Measure actual DNS resolution times at the system and
  browser levels before changing any settings.
cell_oracles:
  HL:
    action: ASK
    focus: Do not infer DNS misconfiguration from the router admin page's visual appearance.
      Measure actual DNS resolution times at the system and browser levels before
      changing any settings.
  LL:
    action: ASK
    focus: Do not infer DNS misconfiguration from the router admin page's visual appearance.
      Measure actual DNS resolution times at the system and browser levels before
      changing any settings.
  HH:
    action: ANSWER
    focus: Disable the browser's custom DNS-over-HTTPS override and revert to the
