variants:
  HL:
    distractor: My router admin page looks like something from 2009 — white background,
      tiny text, settings buried in unlabelled dropdowns — that kind of messy interface
      usually hides DNS settings that nobody has ever touched correctly.
    diagnosticity: low
    salience: high
    proposition: The router admin interface looks dated and disorganised, suggesting
      DNS settings have probably never been configured correctly.
    salience_source: B/C — specific year reference (2009) and concrete visual details
      (white background, tiny text, unlabelled dropdowns); confident bridge claim
      ('usually hides').
    why_plausible: ISP-provided routers with dated admin UIs often ship with default
      or poorly documented DNS settings; a user who has seen such interfaces correlate
      with misconfiguration might treat the appearance as a meaningful signal.
    why_irrelevant: Router admin UI age and DNS resolver performance are independently
      determined; a dated interface does not change what the resolver actually does,
      and the focal measurement shows the router's resolver is performing correctly
      at under 3ms.
  LL:
    distractor: The router admin interface looks dated and disorganised, suggesting
      DNS settings have probably never been configured correctly.
    diagnosticity: low
    salience: low
    proposition: The router admin interface looks dated and disorganised, suggesting
      DNS settings have probably never been configured correctly.
    matched_to: HL
  HH:
    distractor: Running dig shows the router's resolver returns results in under 3ms
      consistently, but the browser's advanced settings reveal it has overridden the
      system resolver and is using its own DNS-over-HTTPS provider, which averages
      800ms per uncached lookup.
    diagnosticity: high
    salience: high
    proposition: The router's resolver responds in under 3ms, but the browser has
      overridden the system resolver and is using its own DNS-over-HTTPS provider
      averaging 800ms per uncached lookup.
    salience_source: B/C — precise measurements (3ms vs 800ms); concrete browser UI
      finding ('advanced settings reveal'); clear contrast structure.
  LH:
    distractor: The router's resolver returns under 3ms; the browser overrides the
      system resolver and uses a DoH provider averaging 800ms per uncached lookup.
    diagnosticity: high
    salience: low
    proposition: The router's resolver responds in under 3ms, but the browser has
      overridden the system resolver and is using its own DNS-over-HTTPS provider
      averaging 800ms per uncached lookup.
    matched_to: HH
distractor_direction:
  label: router DNS misconfiguration
  description: Investigating whether the router's DNS settings are misconfigured or
    using a poor upstream resolver, causing slow name resolution for new domains.
plausible_alternative_directions:
- label: ISP upstream resolver degradation
  description: Checking whether the ISP's DNS infrastructure is experiencing elevated
    latency that only affects uncached domains, consistent with the new-site-only
    symptom pattern.
- label: browser cache or extension interference
  description: Investigating whether a recently installed browser extension or expired
    cache policy is adding latency to initial page loads for new domains.
leak_audit:
  ll_atomic_claims:
  - The router admin interface looks dated and disorganised.
  - This suggests DNS settings have probably never been configured correctly.
  hh_atomic_claims:
  - The router's resolver returns results in under 3ms consistently (measured via
    dig).
  - The browser's advanced settings reveal it has overridden the system resolver.
  - The browser is using its own DNS-over-HTTPS provider.
  - That provider averages 800ms per uncached lookup.
  hl_salience_dimensions:
    source_credibility: N/A — no named source; aesthetic impression is the salience
      vehicle
    narrative_coherence: Specific visual inventory (year, colour, text size, dropdown
      style) followed by a confident general implication gives the claim a coherent
      inference chain.
    confident_assertion: '''usually hides DNS settings that nobody has ever touched
      correctly'' — strong generalisation with confident phrasing.'
    concrete_detail: Detail is about the UI appearance (year 2009, visual elements),
      not case-specific diagnostic data — C6 compliant.
  forbidden_categories_checked_against:
  - tunable_value
  - effort_descriptor
  - severity_claim
  - sensory_distractor_about_setting
