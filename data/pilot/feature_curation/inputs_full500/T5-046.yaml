xbase: I need a portable power bank for travel, mainly to top up a phone and occasionally
  charge a small laptop. I have narrowed it down to two options at the same price.
  Option A has a polished matte aluminium enclosure and clean branding. Option B is
  a plain black plastic case with no visual appeal. Both claim 20,000 mAh capacity.
  {DS}
focal_diagnostic_feature: Option B outputs 65W USB-C against Option A's 18W maximum,
  and independent capacity tests confirm Option B at the full 20,000 mAh while Option
  A measures only 13,000 mAh actual output.
low_diagnostic_proposition: Option A's premium finish suggests its internal charging
  circuitry is also better quality.
oracle_action: ANSWER
oracle_focus: Choose Option B; its 65W output covers the laptop use case and its tested
  capacity of 20,000 mAh versus Option A's actual 13,000 mAh makes it substantially
  more capable at the same price.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not treat enclosure finish as a proxy for charging
  quality. Ask for USB-C PD wattage, independently tested capacity, and warranty terms
  before deciding.
