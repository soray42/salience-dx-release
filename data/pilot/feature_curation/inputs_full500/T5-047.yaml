seed_id: T5-047
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Our MariaDB replica has fallen behind the primary by about four hours and the
  lag is growing. The replica has ample CPU and disk headroom, and network throughput
  between the nodes looks normal. The replication user credentials are valid and the
  replica SQL thread is running without reported errors in the status output. {DS}
focal_diagnostic_feature: The primary's binlog_format is STATEMENT and the replicated
  event log contains UPDATE statements using UUID(), which the replica flags as unsafe
  and applies with serialised single-thread execution.
low_diagnostic_proposition: The replication dashboard's dated and confusing visual
  layout is making the lag metric look worse than the real value.
oracle_action: ANSWER
oracle_focus: Switch binlog_format to ROW or MIXED on the primary so that non-deterministic
  function results are captured as row images rather than re-executed; this will allow
  the replica to apply events in parallel and clear the lag.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not dismiss the lag as a display artefact; ask for
  the actual Seconds_Behind_Master value from SHOW REPLICA STATUS, the binlog format,
  and whether any unsafe-statement warnings appear in the replica logs.
