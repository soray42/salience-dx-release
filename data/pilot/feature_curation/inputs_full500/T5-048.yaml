distractor_direction:
  label: Website aesthetic as trust signal
  description: Treating Policy A's old-fashioned website as evidence that the insurer
    is operationally unreliable or unlikely to pay a complex claim.
plausible_alternative_directions:
- label: Brand solvency and regulatory standing
  description: Policy B's well-known brand may have stronger regulatory capital ratios
    or ombudsman oversight, independent of the claims-paid ratio.
- label: Policy exclusions beyond pre-existing conditions
  description: Other exclusion clauses — activity-based, geographic, or delay-related
    — may differ materially between the two policies and affect value.
- label: Claims process ease
  description: The well-known brand may have a faster or more accessible claims hotline
    for emergencies in Southeast Asia, which matters operationally even if the payout
    rate is lower.
