variants:
  HL:
    distractor: Policy A's site looks like it was built years ago — plain form layout,
      no visible HTTPS padlock, and a PDF schedule instead of an inline viewer. That
      kind of dated and patchy site makes me doubt a complex cardiac claim would get
      paid.
    diagnosticity: low
    salience: high
    proposition: Policy A's old-fashioned website suggests it is a less trustworthy
      or less capable insurer than the modern-branded Policy B.
    salience_source: 'D: concrete detail about the website appearance (form layout,
      HTTPS padlock, PDF viewer); C: the inferential bridge (dated site → claims doubt)
      is stated as a confident personal conclusion.'
    why_plausible: A site without a visible HTTPS padlock genuinely raises security
      concerns, and operational under-investment in a website sometimes correlates
      with under-investment in claims processing — a sophisticated reader might link
      these.
    why_irrelevant: Website aesthetics are diagnostically empty for claims performance;
      the ombudsman's claims-paid ratio is a direct measure of actual payout behaviour,
      which Policy A's 94% vs Policy B's 71% captures definitively regardless of page
      design.
  LL:
    distractor: Policy A's website looks outdated and less polished than Policy B's,
      which suggests it may be a less reliable insurer for a complex claim.
    diagnosticity: low
    salience: low
    proposition: Policy A's old-fashioned website suggests it is a less trustworthy
      or less capable insurer than the modern-branded Policy B.
