seed_id: T5-048
template: T5
domain: open_qa
complexity: high
xbase: I am choosing between two single-trip travel insurance policies for a three-week
  trip to Southeast Asia. Policy A is from a provider I have not heard of before;
  its purchase website looks old-fashioned with outdated fonts and a plain form layout.
  Policy B is from a well-known brand with a polished, modern website. The premium
  difference between them is about €40, with Policy A being cheaper. I have a pre-existing
  heart condition that I disclosed on both applications. {DS}
focal_diagnostic_feature: Policy A covers pre-existing conditions up to €500,000 medical
  evacuation with a claims-paid ratio of 94% reported by the national insurance ombudsman;
  Policy B explicitly excludes pre-existing conditions and has a claims-paid ratio
  of 71%.
low_diagnostic_proposition: Policy A's old-fashioned website suggests it is a less
  trustworthy or less capable insurer than the modern-branded Policy B.
oracle_action: ANSWER
oracle_focus: Choose Policy A; for a traveller with a disclosed pre-existing condition,
  Policy B's exclusion clause makes it functionally useless for the most likely high-cost
  claims, while Policy A covers those claims and has a substantially higher claims-paid
  ratio.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer insurer reliability from website aesthetics;
  ask for pre-existing condition coverage terms, medical evacuation limits, and claims-paid
  ratios for both policies before deciding.
