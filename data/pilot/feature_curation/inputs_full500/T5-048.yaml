causal_audit:
  steelman: 'An expert could argue: a website lacking a visible HTTPS padlock on form
    pages is a genuine security red flag that regulators sometimes use as an indicator
    of technical under-investment; insurers with outdated digital infrastructure may
    also have slower claims processing systems and higher manual error rates. Combined
    with the user''s unfamiliarity with the brand, this creates a real information
    asymmetry.

    '
  steelman_verdict: no_defensible_mechanism
