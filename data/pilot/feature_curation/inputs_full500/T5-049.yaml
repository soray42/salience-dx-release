causal_audit:
  steelman: 'A practitioner could argue: the sqlite3 CLI''s silent dot-backup gives
    no feedback on whether the backup started, whether it captured all pages, or whether
    it completed before the database was modified. In WAL mode, the dot-backup may
    not automatically checkpoint the WAL, leaving committed data out of the copy if
    not handled correctly. Without a progress indicator a failure could look identical
    to success at the shell level.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: PRAGMA integrity_check is a direct structural test of the
    backup file's page consistency and checksums — it reports 'ok' only when all pages
    pass. This result is independent of the CLI's visual output during the copy operation.
