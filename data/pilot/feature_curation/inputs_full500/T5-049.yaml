seed_id: T5-049
template: T5
domain: technical_troubleshooting
complexity: low
xbase: I use the sqlite3 command-line tool's dot-backup command to back up a small
  production SQLite database every night. A colleague is arguing that the backup is
  probably incomplete or corrupt because the sqlite3 CLI looks too primitive to handle
  a live database safely. We have been using this process for three months without
  a reported restore failure. {DS}
focal_diagnostic_feature: Running PRAGMA integrity_check on the backup file returns
  'ok', and the backup page count matches the source database exactly.
low_diagnostic_proposition: The sqlite3 CLI's plain minimalist appearance suggests
  it lacks the sophistication to produce a reliable live-database backup.
oracle_action: ANSWER
oracle_focus: The backup is sound; the dot-backup command uses SQLite's Online Backup
  API, which safely copies a live database without corruption — the integrity check
  result confirms this directly.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer backup reliability from the CLI's visual
  simplicity; ask for the result of PRAGMA integrity_check on the backup file and
  whether any restore test has been performed.
