distractor_direction:
  label: CLI visual simplicity as unreliability signal
  description: Treating the sqlite3 terminal tool's plain, silent interface as evidence
    that the backup it produces is incomplete or unsafe.
plausible_alternative_directions:
- label: Write-ahead log not included
  description: If the database runs in WAL mode, a naive file copy would miss the
    WAL file; confirming whether dot-backup captures the WAL is a live concern.
- label: Backup destination disk space
  description: Running out of space partway through the backup would silently truncate
    the output file, which is worth verifying independently of integrity checks.
- label: Restore process untested
  description: The backup may be structurally valid but the restore procedure itself
    — permissions, target path, version compatibility — has not been tested end-to-end.
