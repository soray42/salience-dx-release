variants:
  HL:
    distractor: The sqlite3 prompt is a bare greater-than symbol — no progress bar,
      no output, nothing during the entire backup run. A tool that gives no feedback
      while copying a live database cannot be trusted to produce a consistent, uncorrupted
      snapshot.
    diagnosticity: low
    salience: high
    proposition: The sqlite3 CLI's plain minimalist appearance suggests it lacks the
      sophistication to produce a reliable live-database backup.
    salience_source: 'B: vivid specific detail about the CLI appearance (bare prompt,
      no progress bar, silent during backup); C: the inferential bridge (no visual
      feedback → cannot be trusted for consistent snapshots) is stated as a confident
      conclusion.'
    why_plausible: A tool that gives no output during a backup operation genuinely
      makes it impossible to verify progress interactively, and silent backup tools
      have historically hidden errors; a busy engineer seeing no feedback might reasonably
      question whether the copy completed.
    why_irrelevant: Visual output and terminal polish are diagnostically empty for
      backup integrity; PRAGMA integrity_check directly tests the page structure and
      checksum validity of the output file, regardless of what the copying tool displayed.
  LL:
    distractor: The sqlite3 CLI's minimalist plain appearance suggests it is too basic
      to produce a reliable backup of a live database.
    diagnosticity: low
