xbase: I'm choosing between two operators for a five-day guided hiking trip in the
  Tatra Mountains next summer. Both offer similar mountain routes, roughly comparable
  pricing, and similar advertised group sizes of around eight to ten people. I want
  a safe, well-organised experience and have budget for either option. {DS}
focal_diagnostic_feature: Operator A's lead guides hold mountain rescue certification,
  their actual group cap is six people despite the advertised ten, and their safety
  record is twelve years without a serious incident; Operator B's guides carry no
  equivalent rescue qualifications.
low_diagnostic_proposition: Operator B's website looks more professional than Operator
  A's, suggesting it is the better-run company.
oracle_action: ANSWER
oracle_focus: Choose Operator A; certified guides, a smaller actual group size, and
  a twelve-year incident-free safety record outweigh website aesthetics by every operationally
  meaningful metric.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not choose based on website design; ask for guide
  certifications, actual group size limits, and documented safety track record before
  deciding.
