seed_id: T5-051
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Our MySQL application has been noticeably slow all week. Read queries that
  used to complete in under 50 milliseconds now take around two seconds during normal
  load. Server CPU sits under 30 percent and memory usage looks normal throughout
  the day. I have not changed any application code or MySQL configuration recently.
  {DS}
focal_diagnostic_feature: SHOW GLOBAL STATUS reveals that innodb_buffer_pool_reads
  is 42 percent of total read requests, and innodb_buffer_pool_size is configured
  at 512 MB on a server with 16 GB of available memory.
low_diagnostic_proposition: The database administration interface looks old and cluttered,
  suggesting the database configuration is poorly maintained.
oracle_action: ANSWER
oracle_focus: Increase innodb_buffer_pool_size to at least 8 GB on this 16 GB server;
  the 42 percent disk-read ratio confirms the working set does not fit in the current
  buffer pool and reads are hitting disk.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer poor configuration from UI appearance; query
  SHOW GLOBAL STATUS for innodb_buffer_pool_reads ratio and innodb_buffer_pool_size
  before drawing any conclusions.
