distractor_direction:
  label: outdated admin UI implies poor configuration
  description: Treating the visually old and cluttered database administration interface
    as a signal that the MySQL configuration has not been properly maintained.
plausible_alternative_directions:
- label: slow query log plan regression
  description: A query plan regression triggered by statistics drift or a recent data
    distribution shift could cause reads to fall back to table scans, degrading response
    time without consuming obvious CPU.
- label: table-level lock contention
  description: A long-running write transaction or ALTER TABLE operation holding metadata
    locks could intermittently block reads even when the server appears idle at the
    OS level.
- label: connection pool exhaustion
  description: Application-side connection pool saturation during load peaks could
    queue queries before they reach MySQL, producing observed latency without database-side
    CPU or memory symptoms.
