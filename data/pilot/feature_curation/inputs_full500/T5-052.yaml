causal_audit:
  steelman: 'A sophisticated traveller might argue: agencies that invest heavily in
    premium print brochures are signalling brand investment and customer-acquisition
    confidence, which often correlates with higher service quality and operational
    professionalism in the luxury travel sector. Premium brochure production also
    requires internal coordination (photography, design, printing procurement) that
    mirrors the coordination required for well-managed tours. This proxy is not unreasonable
    in markets where tour quality is otherwise hard to verify before purchase.

    '
