    proposition: Agency B's brochure has high-quality production values, which suggests
      it is the better-organised agency.
    salience_source: B — confident descriptive register building a coherent aesthetic
      case; C — 'usually signals a well-organised operation' asserts the inferential
      bridge with authority; D — specific concrete details about the brochure (panoramic
      photographs, linen-textured cover, carved typesetting).
    why_plausible: Premium print production requires significant investment and organisational
      effort; a reader could reasonably infer that an agency spending carefully on
      its brochure also manages its tours carefully.
    why_irrelevant: 'Brochure production quality shares no mechanism with tour operational
      quality: confirmed hotel bookings, guide-to-guest ratios, and customer satisfaction
      are determined by procurement and management processes entirely independent
