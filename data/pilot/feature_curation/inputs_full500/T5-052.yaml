distractor_direction:
  label: brochure polish signals organisational quality
  description: Treating Agency B as the better-run tour operator because its printed
    brochure uses premium production values that suggest careful, well-resourced management.
plausible_alternative_directions:
- label: guide language and local expertise
  description: For a Japan itinerary, the fluency and cultural knowledge of guides
    is a decisive factor that neither price nor brochure design reveals, and could
    be the primary differentiator.
- label: cancellation and force-majeure terms
  description: For a significant long-haul expense booked months in advance, each
    agency's cancellation, rescheduling, and insurance terms could outweigh all other
    factors if circumstances change.
- label: included activity and entry-fee scope
  description: Differences in what is included in the tour price — temple entry fees,
    meal allowances, transport upgrades — could shift the effective per-person cost
    comparison substantially.
