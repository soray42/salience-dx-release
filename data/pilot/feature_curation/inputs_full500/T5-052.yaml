seed_id: T5-052
template: T5
domain: open_qa
complexity: high
xbase: I'm choosing between two travel agencies for a two-week guided tour of Japan
  next spring. Both cover Tokyo, Kyoto, and Osaka with roughly equivalent daily schedules.
  I want value for money and a well-managed trip; this is a significant expense for
  me. I have spoken to a representative from each agency and both seemed professional.
  {DS}
focal_diagnostic_feature: Agency A is €420 cheaper per person, has all accommodation
  confirmed rather than provisional, caps groups at 12 against Agency B's 22, and
  has an independently verified customer satisfaction score significantly above Agency
  B's.
low_diagnostic_proposition: Agency B's brochure has high-quality production values,
  which suggests it is the better-organised agency.
oracle_action: ANSWER
oracle_focus: Choose Agency A; it is cheaper per person, has logistically committed
  accommodation, offers a substantially smaller group experience, and outperforms
  Agency B on independently verified customer satisfaction — the brochure quality
  is irrelevant to any of these factors.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not treat brochure quality as operational evidence;
  ask for per-person price, confirmed versus provisional accommodation, group size
  caps, and verified customer satisfaction data before deciding.
