seed_id: T5-053
template: T5
domain: technical_troubleshooting
complexity: low
xbase: Our team's Docker image build in CI takes over twelve minutes on every push,
  even when we only change a comment in a source file. The build machine has adequate
  CPU and memory, and registry pull limits are not being hit. The build log shows
  all layers rebuilding each time. {DS}
focal_diagnostic_feature: The Dockerfile copies the full source tree before the dependency
  install step, invalidating the package-layer cache on every commit and forcing a
  full dependency re-download regardless of whether dependencies changed.
low_diagnostic_proposition: The CI pipeline YAML looks visually disorganised, suggesting
  a misconfiguration is present somewhere.
oracle_action: ANSWER
oracle_focus: Reorder the Dockerfile so that dependency files (requirements.txt or
  package.json) are copied and installed before COPY . ., restoring layer cache reuse.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer build misconfiguration from YAML formatting.
  Ask for Dockerfile layer order and whether a cache step is configured in the workflow.
