variants:
  HL:
    distractor: Our CI pipeline YAML is a sprawling mess of duplicate keys and inconsistent
      indentation — it looks like nobody has ever cleaned it up, and that visual disorder
      probably points to a misconfiguration somewhere.
    diagnosticity: low
    salience: high
    proposition: The CI pipeline YAML looks visually disorganised, suggesting a misconfiguration
      is present somewhere.
    salience_source: B (narrative coherence — vivid descriptive enumeration of formatting
      flaws); C (confident assertion — "probably points to a misconfiguration").
    why_plausible: Disorganised YAML can contain subtle errors like duplicate keys
      that CI parsers silently ignore; a practitioner might reasonably start there.
    why_irrelevant: YAML formatting is a surface property of the pipeline definition
      file; it has no mechanism connecting to Docker layer caching behaviour, which
      is determined entirely by Dockerfile instruction order.
  LL:
    distractor: The CI configuration file is visually disorganised, and that disorder
      suggests a misconfiguration is present.
    diagnosticity: low
    salience: low
    proposition: The CI pipeline YAML looks visually disorganised, suggesting a misconfiguration
      is present somewhere.
    matched_to: HL
  HH:
    distractor: The Dockerfile copies the full source tree with COPY . . at line 4,
      before the pip install step at line 7, so every commit — even a one-line doc
      change — busts the cache and forces all dependencies to re-download.
    diagnosticity: high
    salience: high
    proposition: The Dockerfile copies the full source tree before the dependency
      install step, invalidating the package-layer cache on every commit and forcing
      a full dependency re-download regardless of whether dependencies changed.
    salience_source: B (narrative coherence — specific line numbers, concrete mechanism
      stated end-to-end); C (confident causal framing — "busts the cache").
  LH:
    distractor: The Dockerfile places COPY . . before the dependency install step,
      so every commit invalidates the package cache layer.
    diagnosticity: high
    salience: low
    proposition: The Dockerfile copies the full source tree before the dependency
      install step, invalidating the package-layer cache on every commit and forcing
      a full dependency re-download regardless of whether dependencies changed.
    matched_to: HH
distractor_direction:
  label: CI YAML misconfiguration
  description: Investigating whether messy or malformed CI pipeline YAML contains
    a configuration error that causes the slow Docker builds.
plausible_alternative_directions:
- label: missing build cache mount
  description: The workflow may lack a BuildKit cache mount or registry cache action,
    meaning Docker cannot reuse layers across runs even with correct Dockerfile ordering.
- label: base image pull latency
  description: The base image may not be locally available and could be pulled fresh
    each run from a slow or rate-limited registry mirror.
leak_audit:
  ll_atomic_claims:
  - The CI configuration file is visually disorganised.
  - That visual disorder suggests a misconfiguration is present.
  hh_atomic_claims:
  - The Dockerfile has COPY . . at line 4.
  - The pip install step is at line 7 (after COPY . .).
  - Every commit invalidates the dependency layer cache.
  - Even a one-line doc change triggers a full dependency re-download.
  hl_salience_dimensions:
    source_credibility: N/A — no named source; first-person observation.
    narrative_coherence: Vivid enumeration of formatting flaws (duplicate keys, inconsistent
      indentation) creates a coherent picture of neglect.
    confident_assertion: '"Probably points to a misconfiguration" — inferential bridge
      stated assertively.'
    concrete_detail: N/A — details are about YAML appearance, not the case root cause.
  forbidden_categories_checked_against:
