causal_audit:
  steelman: 'Rental listing quality can serve as a proxy for market organisation:
    in cities

    where professional landlords dominate, listings are polished; where the market

    is thin or disorganised, listings are poor. A practitioner might argue that

    low listing quality signals low rental supply quality, strengthening the case

    for buying. Additionally, a poor rental market may mean higher rents relative

    to purchase price.

    '
