distractor_direction:
  label: poor-quality rental market signal
  description: Treating the visual unprofessionalism of rental listings as evidence
    that the local rental market is inferior and buying is therefore the better choice.
plausible_alternative_directions:
- label: savings-to-purchase-cost fit
  description: €28,000 might suffice for deposit and fees in a lower-priced market
    segment, potentially making purchase viable despite thin margins.
- label: opportunity cost of renting
  description: A year of rent payments in a high-rent market could significantly erode
    the deposit buffer, affecting the long-run buy calculation.
- label: job probation and income stability
  description: Most lenders require evidence of stable income; the employment start
    date and contract type matter independently of the payslip count rule.
