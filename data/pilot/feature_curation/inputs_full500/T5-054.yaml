seed_id: T5-054
template: T5
domain: open_qa
complexity: medium
xbase: I am about to relocate to a new city to start a job and am deciding whether
  to rent for the first year or try to buy straight away. My savings are about €28,000.
  I have not started the job yet and my contract begins next month. {DS}
focal_diagnostic_feature: The available savings cover only the minimum deposit and
  legal fees on any entry-level property with nothing left over, and lenders in this
  market require six continuous months of payslips before considering a mortgage application.
low_diagnostic_proposition: The rental listings look visually unprofessional, suggesting
  the local rental market is poor quality and buying is the smarter choice.
oracle_action: ANSWER
oracle_focus: Rent for at least the first six months; the deposit exhausts all savings
  with no buffer and the lender employment requirement makes an immediate mortgage
  application impossible.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer rental market quality from listing photography.
  Ask for savings relative to deposit and fees, and for lender employment requirements,
  before advising buy or rent.
