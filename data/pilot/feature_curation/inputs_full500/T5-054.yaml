variants:
  HL:
    distractor: The rental listings I've browsed use blurry photos shot in low light,
      with cramped descriptions full of typos — they look like nobody takes the rental
      market seriously here, so buying seems like the smarter path.
    diagnosticity: low
    salience: high
    proposition: The rental listings look visually unprofessional, suggesting the
      local rental market is poor quality and buying is the smarter choice.
    salience_source: B (narrative coherence — multi-detail enumeration of listing
      flaws in first-person browsing account); C (confident inference — "buying seems
      like the smarter path").
    why_plausible: Poor listing quality can correlate with a disorganised, illiquid
      rental market where landlords are unsophisticated; a practitioner might flag
      this as a signal about rental-market depth.
    why_irrelevant: Listing photo quality is a surface property of landlord marketing
      effort, not a measure of rental-market viability or price; it has no mechanism
      that resolves whether the user can obtain a mortgage before income verification
      requirements are met.
