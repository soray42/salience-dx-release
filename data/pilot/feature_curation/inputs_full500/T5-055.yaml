seed_id: T5-055
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Our CD pipeline reports a successful deployment every time, but the staging
  service keeps serving the previous code version. Neither new deployments nor rollbacks
  appear to take effect — the build SHA in the health endpoint has not changed in
  four days despite a dozen deploys. {DS}
focal_diagnostic_feature: The deploy script launches the service restart as a backgrounded
  subprocess without capturing its exit code; `ps aux` on the staging host confirms
  the pre-deploy process binary is still running under its original PID.
low_diagnostic_proposition: The deployment dashboard looks visually outdated and unreliable,
  suggesting its success indicators cannot be trusted.
oracle_action: ANSWER
oracle_focus: Fix the deploy script to run the restart synchronously and capture its
  exit code, then verify the new PID after restart; the backgrounded nohup call is
  why every reported success is false.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer script reliability from dashboard aesthetics.
  Ask for the deploy script's process-management logic and inspect the running process
  on the staging host before attributing the problem to the dashboard.
