causal_audit:
  steelman: 'Internal deployment dashboards are frequently built with fragile webhook

    integrations; a neglected UI may genuinely correspond to a neglected

    maintenance posture where status callbacks are stale or disconnected. If the

    dashboard listens on a webhook that the pipeline no longer posts to correctly,

    it could display success regardless of actual outcome, making the visual

    neglect a correlated indicator of a real integration bug.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase notes that "rollbacks appear to take effect" [sic
    — neither deployments nor rollbacks take effect], and that the build SHA has not
    changed in four days despite a dozen deploys. This points to a persistent server-side
    state problem, not a dashboard display issue — a dashboard bug would not keep
    the service binary from updating. The dashboard's reported success is downstream
    of whatever the script reports, not an independent source of truth.
