variants:
  HL:
    distractor: The deployment dashboard uses pixelated icons, misaligned status columns,
      and colours from what looks like a 2009 admin template — it looks unreliable
      enough that I wouldn't trust its success indicators.
    diagnosticity: low
    salience: high
    proposition: The deployment dashboard looks visually outdated and unreliable,
      suggesting its success indicators cannot be trusted.
    salience_source: B (narrative coherence — three-element enumeration of visual
      defects with a specific era reference); C (confident negative inference — "I
      wouldn't trust its success indicators").
    why_plausible: A visually neglected internal tool can genuinely reflect neglected
      maintenance; a practitioner might reasonably suspect that an outdated dashboard
      could misreport job status due to stale integrations or broken webhook listeners.
    why_irrelevant: Dashboard appearance is a front-end rendering concern; it has
      no mechanism connecting to whether the deploy script correctly starts and verifies
      the service process on the target host. The false success originates in the
      script's process management, not in the dashboard's display layer.
