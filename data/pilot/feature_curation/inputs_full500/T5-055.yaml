distractor_direction:
  label: dashboard misreporting
  description: Attributing the false deployment success indicators to a visually outdated
    dashboard that cannot accurately report pipeline status.
plausible_alternative_directions:
- label: wrong deployment target
  description: The pipeline may be deploying to a different host or environment than
    the one the health endpoint is querying, making it appear that changes never land.
- label: service not configured to restart
  description: The systemd or process-manager unit for the service may be disabled
    or overridden, so the restart command runs but the unit does not reload the binary.
