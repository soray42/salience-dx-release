causal_audit:
  steelman: 'A senior buyer''s agent could argue: professionally staged listings in
    a given

    neighbourhood often concentrate in areas with strong landlord professionalism,

    good maintenance, and rising demand — all of which correlate with price

    appreciation. Buying into a well-maintained building reduces hidden ownership

    costs and may outperform a rough estimate of the payment-to-rent gap. This

    is the strongest version of the aesthetic-as-investment-signal argument.

    However, the inferential chain (photo quality → building quality → market

    return) has no bearing on the payment-to-rent ratio computed from current

    listing prices, nor on the transaction-cost math for a two-year hold period.

    Even a perfectly maintained, appreciating condo cannot overcome a 40% carry

    gap within a two-year horizon using typical closing-cost assumptions. The

    photographic quality provides zero input to the financial model that governs

    this decision.

    '
  steelman_verdict: no_defensible_mechanism
