distractor_direction:
  label: Listing quality as investment signal
  description: Treating the professional quality of listing photography as evidence
    that the condo is well maintained and the neighbourhood is a sound market to buy
    into, making purchase the preferred choice.
plausible_alternative_directions:
- label: Insufficient savings for purchase
  description: Evaluating whether the absence of a downpayment or closing-cost buffer
    alone rules out buying, independently of the payment-to-rent comparison.
- label: Market appreciation potential
  description: Investigating whether expected local price growth over the contract
    period could offset the negative carry and transaction costs.
- label: Lease flexibility vs ownership
  description: Weighing the option value of renting given an uncertain post-contract
    path versus the illiquidity of owning for a short horizon.
