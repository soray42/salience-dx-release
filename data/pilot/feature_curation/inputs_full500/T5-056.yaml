seed_id: T5-056
template: T5
domain: open_qa
complexity: high
xbase: I am relocating for a two-year contract role and deciding whether to rent or
  buy a condo in the new city. Listings in the area I am looking at are plentiful
  on both sides. My employer covers neither purchase closing costs nor any relocation
  allowance. I have a stable income but no existing property to sell. {DS}
focal_diagnostic_feature: Monthly mortgage payments on comparable condos exceed the
  rental rate for identical units in the same buildings by roughly 40%, and a two-year
  sale horizon means closing and transaction costs would consume most or all of any
  plausible price appreciation.
low_diagnostic_proposition: The listing photos are professionally staged; a condo
  that photographs this well in this neighbourhood is likely well maintained and a
  solid long-term investment.
oracle_action: ANSWER
oracle_focus: Rent; the negative carry gap and two-year horizon make purchasing a
  clear financial negative regardless of property quality.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer investment quality or financial soundness
  from listing photography. Ask for the mortgage-to-rent comparison, expected hold
  period, closing costs, and available savings before advising.
