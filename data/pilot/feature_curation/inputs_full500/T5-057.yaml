      and forces a full package reinstall from the network on each build.
    matched_to: HH
distractor_direction:
  label: Dockerfile formatting error
  description: Investigating whether poor Dockerfile formatting or inconsistent style
    is a symptom of configuration mistakes that explain the slow image builds.
plausible_alternative_directions:
- label: Package registry latency
  description: Checking whether slow responses from the package registry or dependency
    mirror are adding minutes to each build independent of caching.
- label: Unnecessary build context size
  description: Evaluating whether a large Docker build context is being transferred
    to the daemon on each run, consuming build time before any layer executes.
