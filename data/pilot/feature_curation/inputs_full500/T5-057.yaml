seed_id: T5-057
template: T5
domain: technical_troubleshooting
complexity: low
xbase: Our CI Docker image builds have been taking around 18 minutes each, which is
  making our deploy cycle painful. The base image has not changed, and I am running
  the same commands locally that the pipeline runs. The total image size is not unusual
  for this project. {DS}
focal_diagnostic_feature: The Dockerfile copies the full source directory before the
  dependency installation step, so every code change invalidates the dependency cache
  layer and forces a full package reinstall from the network on each build.
low_diagnostic_proposition: The Dockerfile is poorly formatted and hard to read, suggesting
  it likely contains configuration mistakes that are making the builds slow.
oracle_action: ANSWER
oracle_focus: Reorder the Dockerfile to copy dependency manifests first, install dependencies,
  then copy source — this restores layer caching and eliminates the full reinstall
  on every code change.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer configuration errors from formatting alone.
  Ask for the Dockerfile layer order and CI step timing to identify what is consuming
  the build time.
