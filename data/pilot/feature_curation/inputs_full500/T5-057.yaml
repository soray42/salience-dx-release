variants:
  HL:
    distractor: The Dockerfile has no comments, inconsistent capitalization on RUN
      directives, and indentation that wanders across four levels; a file this poorly
      maintained almost certainly has configuration mistakes that are making the builds
      slow.
    diagnosticity: low
    salience: high
    proposition: The Dockerfile is poorly formatted and hard to read, suggesting it
      likely contains configuration mistakes that are making the builds slow.
    salience_source: B/C — vivid concrete enumeration of formatting failures followed
      by a confident bridging assertion; the precision of the visual observation makes
      the inference feel reasoned rather than speculative.
    why_plausible: Practitioners frequently blame poor documentation or messy files
      when something is slow or broken; a disorganized Dockerfile does carry higher
      risk of accidental misconfiguration.
    why_irrelevant: Docker ignores whitespace and comment presence entirely; inconsistent
      capitalization of RUN is valid syntax; none of the named formatting issues has
      any runtime effect, and the inferential bridge from aesthetics to configuration
      error is structurally empty for this case.
  LL:
    distractor: The Dockerfile is poorly formatted and hard to read, suggesting it
