domain: open_qa
complexity: medium
xbase: I have just accepted a permanent job in a new city and am deciding whether
  to buy or rent for my first year there. I still carry student debt and am starting
  from close to zero in savings. The local market has a mix of rental and purchase
  options in the areas I have been researching. {DS}
focal_diagnostic_feature: Comparable rentals in the same neighbourhoods cost about
  65% of the estimated monthly mortgage payment on a starter home, and after student
  debt service the user has no downpayment saved and would need to borrow for closing
  costs.
low_diagnostic_proposition: The listing agency's website is professionally designed;
  an agency that presents listings this well is operating in a market worth buying
  into.
oracle_action: ANSWER
oracle_focus: Rent for the first year; the monthly cost gap and absence of a downpayment
  make buying financially untenable before building savings and understanding the
  local market.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not treat website quality as evidence about the market
  or financial readiness to buy. Ask for the rent-to-mortgage comparison, available
  savings, student debt load, and expected tenure before advising.
