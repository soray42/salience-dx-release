causal_audit:
  steelman: 'A buyer''s agent could argue: agencies that invest heavily in professional

    web presence tend to operate in markets with high transaction volumes and

    strong competition, which often correlates with robust price appreciation,

    good liquidity, and buyer confidence. Buying early in such a market,

    even with limited savings, could be justified by rapid equity accumulation

    that exceeds the rental cost gap. A highly polished agency website is not

    random noise — it is a business investment that tracks market activity.

    This is the strongest version: professional listing presence as a demand

    signal that argues for buying. However, website quality is a marketing

    input variable with no mechanistic link to the rent-to-mortgage ratio or

    the buyer''s financial readiness. Even if the market is extremely liquid and

    appreciating, the user currently has no downpayment and would need to borrow

    for closing costs — a financial state that forecloses conventional mortgage

    qualification entirely, independent of market quality. The aesthetic

    observation cannot bridge to a solvency conclusion.

    '
