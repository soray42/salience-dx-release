seed_id: T5-059
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Our Prometheus-based alerting system has been firing false positives on our
  HTTP error-rate alert for three weeks. The alert triggers even when our actual error
  log counts look normal. We have several alert rules sharing a common set of labels,
  and the alertmanager routing has not changed. The team wasted two incident calls
  last week responding to what turned out to be phantom alerts. I am trying to pinpoint
  the rule that is misfiring. We verified all alert threshold expressions match the
  intended values in version control. {DS}
focal_diagnostic_feature: Two alert rules declare a label named the same identifier,
  causing the availability rule's label value to overwrite the error-rate rule's threshold
  metadata at evaluation time.
low_diagnostic_proposition: The alerting configuration page is cluttered, making it
  likely a rule parameter was misconfigured without anyone noticing.
oracle_action: ANSWER
oracle_focus: Rename the colliding label so each rule's threshold metadata is evaluated
  independently; the false positives are caused by label-name collision, not by any
  operator error introduced through a confusing interface.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer a misconfiguration from the interface's
  appearance. Ask for the exact rule definitions and their label declarations before
  diagnosing the source of false alerts.
