variants:
  HL:
    distractor: The alerting configuration page is genuinely difficult to parse —
      overlapping rows, unlabelled columns, and inconsistent indentation throughout
      — and a layout this cluttered makes it very likely a rule parameter was misconfigured
      without anyone noticing.
    diagnosticity: low
    salience: high
    proposition: The alerting configuration page is cluttered, making it likely a
      rule parameter was misconfigured without anyone noticing.
    salience_source: B — a vivid concrete description of the UI problems; C — "very
      likely" as a confident inferential bridge from surface property to cause.
    why_plausible: A genuinely hard-to-read configuration interface does increase
      the probability of operator error, so inferring a mis-set parameter from a cluttered
      UI is a credible-sounding diagnostic step.
    why_irrelevant: The label collision is a structural property of the rule definitions
      themselves, not a presentation artifact; the same collision exists regardless
      of how the configuration page looks, and no UI change can produce or fix a label-name
      clash. Furthermore, xbase confirms all threshold expressions were verified against
      version control, ruling out any mis-set threshold value as the cause.
  LL:
    distractor: The alerting configuration page is cluttered, making it likely a rule
      parameter was misconfigured without anyone noticing.
    diagnosticity: low
    salience: low
    proposition: The alerting configuration page is cluttered, making it likely a
      rule parameter was misconfigured without anyone noticing.
    matched_to: HL
  HH:
    distractor: Two alert rules — the HTTP error-rate rule and the availability rule
      — both declare a label named 'severity'; the availability rule's severity label
      overwrites the error-rate rule's threshold metadata at evaluation time, causing
      the error-rate alert to fire against the wrong threshold entirely.
    diagnosticity: high
    salience: high
    proposition: Two alert rules declare a label named the same identifier, causing
      the availability rule's label value to overwrite the error-rate rule's threshold
      metadata at evaluation time.
    salience_source: Named rules, the specific colliding label, and the precise overwrite
      mechanism make the diagnosis concrete and actionable.
  LH:
    distractor: Two alert rules declare the same label name, causing the availability
      rule's value to overwrite the error-rate rule's threshold.
    diagnosticity: high
    salience: low
    proposition: Two alert rules declare a label named the same identifier, causing
      the availability rule's label value to overwrite the error-rate rule's threshold
      metadata at evaluation time.
    matched_to: HH
distractor_direction:
  label: Operator misconfiguration via UI
  description: Investigating whether the cluttered configuration interface led an
    operator to set a rule parameter incorrectly, causing the false alert firings.
plausible_alternative_directions:
- label: Alertmanager routing mismatch
  description: Whether alertmanager routing rules are sending notifications for a
    different rule than the one that actually fired.
- label: Metric scrape gap
  description: Whether intermittent scrape failures are causing the error-rate metric
    to show missing data that the alerting rule interprets as elevated.
