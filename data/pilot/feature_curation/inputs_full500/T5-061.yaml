  - The trace viewer has an old, hard-to-read layout.
  - The old/hard-to-read layout makes the user doubt the data the tool shows.
  hh_atomic_claims:
  - Filtering spans by the checkout service reveals the pattern.
  - Every request above 500 ms shows the same 580 ms gap.
  - The gap is inside the outbound call to the pricing API.
  - All other downstream calls finish under 30 ms.
  hl_salience_dimensions:
    source_credibility: N/A
    narrative_coherence: Professional technical language, clean grievance sequence
      (visual chaos → doubt about data quality), confident register throughout.
    confident_assertion: '"makes me doubt the data it is showing" — direct confident
      framing of the inferential claim.'
    concrete_detail: '"overlapping spans, no colour coding, waterfall layout so dense
      it is nearly unreadable" — specific visual features of the tool (setting only).'
  forbidden_categories_checked_against:
  - tunable_value
