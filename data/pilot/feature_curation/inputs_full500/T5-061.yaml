seed_id: T5-061
template: T5
domain: technical_troubleshooting
complexity: low
xbase: Our team's distributed-tracing UI looks extremely cluttered on the main service
  view. I cannot easily read individual spans, and our on-call engineer suggested
  the tool might be generating unreliable data. We are investigating why p99 response
  time jumped from 90 ms to nearly 700 ms two days ago and has stayed elevated. {DS}
focal_diagnostic_feature: Distributed traces show the latency is isolated to calls
  from the checkout service to a downstream pricing API, with every slow span showing
  a 580 ms wait inside that single downstream call.
low_diagnostic_proposition: The tracing UI looks old and hard to read, suggesting
  the data it presents cannot be trusted.
oracle_action: ASK
oracle_focus: Investigate the downstream pricing API as the source of latency; check
  its health, error rates, and recent changes, and verify whether the slow span pattern
  holds across a representative sample of traces.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not conclude the tracing data is unreliable based
  on UI appearance; ask for trace samples and span-level timing before dismissing
  the observability layer.
