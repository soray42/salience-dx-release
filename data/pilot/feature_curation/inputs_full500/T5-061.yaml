    matched_to: HL
  HH:
    distractor: Filtering spans by the checkout service, every request above 500 ms
      shows the same 580 ms gap inside the outbound call to the pricing API, while
      all other downstream calls finish under 30 ms.
    diagnosticity: high
    salience: high
    proposition: Distributed traces show the latency is isolated to calls from the
      checkout service to a downstream pricing API, with every slow span showing a
      580 ms wait inside that single downstream call.
    salience_source: 'Vivid precision: exact millisecond values, consistent pattern
      across all slow requests, explicit contrast with sub-30 ms baseline for all
      other calls.'
  LH:
    distractor: Traces isolate the latency to the checkout-to-pricing-API call (~580
      ms each), while all other downstream calls finish under 30 ms.
    diagnosticity: high
    salience: low
    proposition: Distributed traces show the latency is isolated to calls from the
      checkout service to a downstream pricing API, with every slow span showing a
      580 ms wait inside that single downstream call.
    matched_to: HH
distractor_direction:
  label: Tracing data unreliability
  description: Investigating whether the distributed tracing tool is generating inaccurate
    or misleading span data due to a bug, misconfiguration, or instrumentation gap,
    rather than reporting a genuine downstream latency problem.
plausible_alternative_directions:
- label: Checkout connection-pool exhaustion
  description: The checkout service's outbound HTTP connection pool is saturated,
    causing requests to queue before the call to the pricing API even leaves the service,
    making the latency appear in the outbound span but originate client-side.
- label: Network routing change
  description: A network or routing change between the checkout service and the pricing
    API introduced additional round-trip time, explaining the steady 580 ms gap.
- label: Service dependency timeout config
  description: A misconfigured timeout or retry policy on the checkout-to-pricing
    call is causing slow requests to wait unnecessarily before failing over.
leak_audit:
