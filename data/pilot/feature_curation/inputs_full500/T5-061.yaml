variants:
  HL:
    distractor: 'The trace viewer looks like it was built in 2013: overlapping spans,
      no colour coding, and a waterfall layout so dense it is nearly unreadable, which
      makes me doubt the data it is showing.'
    diagnosticity: low
    salience: high
    proposition: The tracing UI looks old and hard to read, suggesting the data it
      presents cannot be trusted.
    salience_source: 'Dimension B (narrative coherence): clean chronology of technical
      grievances stated in confident professional register; dimension D (concrete
      detail about the tool''s visual appearance — overlapping spans, no colour coding,
      dense waterfall — all about the setting, not the recounted case).'
    why_plausible: A practitioner who has encountered misconfigured or buggy tracing
      agents might reasonably distrust data from a visually chaotic UI, particularly
      when latency symptoms are ambiguous.
    why_irrelevant: UI rendering quality is independent of the accuracy of span data;
      the traces may be difficult to read yet still correctly record actual timing.
      Whether spans are rendered badly is not evidence the underlying timing data
      is wrong.
  LL:
    distractor: The trace viewer has an old, hard-to-read layout, which makes me doubt
