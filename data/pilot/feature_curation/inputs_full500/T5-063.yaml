seed_id: T5-063
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Our order-processing service has been running without any triggered alerts
  for three consecutive days. A team member said everything looks fine because the
  main dashboard overview appears clean and green. I have been getting occasional
  customer tickets about delayed order confirmations since Tuesday. {DS}
focal_diagnostic_feature: The job-queue depth panel, on the second dashboard section
  below the fold, shows the queue at 98% of capacity with a growing backlog for three
  days, and no alert threshold is configured on that metric.
low_diagnostic_proposition: The main dashboard overview looks clean and fully green,
  so the service appears to have no serious problem building underneath.
oracle_action: ASK
oracle_focus: Investigate the job-queue depth and backlog trend; configure an alert
  threshold on the queue metric and identify why the queue is filling while order
  confirmations are delayed.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not conclude the service is healthy based on the alert-covered
  dashboard overview alone; ask whether all relevant metrics are covered by alerts
  and whether queue-depth or backlog panels exist outside the main view.
cell_oracles:
  HL:
    action: ASK
    focus: Do not conclude the service is healthy based on the alert-covered dashboard
      overview alone; ask whether all relevant metrics are covered by alerts and whether
      queue-depth or backlog panels exist outside the main view.
  LL:
    action: ASK
    focus: Do not conclude the service is healthy based on the alert-covered dashboard
      overview alone; ask whether all relevant metrics are covered by alerts and whether
      queue-depth or backlog panels exist outside the main view.
  HH:
    action: ASK
    focus: Investigate the job-queue depth and backlog trend; configure an alert threshold
      on the queue metric and identify why the queue is filling while order confirmations
      are delayed.
  LH:
    action: ASK
    focus: Investigate the job-queue depth and backlog trend; configure an alert threshold
