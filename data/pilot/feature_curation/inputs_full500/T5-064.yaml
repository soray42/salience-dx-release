distractor_direction:
  label: Artisan packaging as quality signal
  description: Treating Brand A's elaborate, heritage-mill packaging as evidence that
    it is a higher-quality flour with better baking performance than Brand B.
plausible_alternative_directions:
- label: Wheat origin and variety
  description: One flour may be milled from heritage or high-extraction wheat that
    performs differently from commodity bread wheat, making variety a live diagnostic
    axis independent of protein percentage.
- label: Freshness and milling date
  description: Flour that has sat in storage loses enzymatic activity and some fermentation
    capacity; milling date is a genuine quality variable for a sourdough production
    run regardless of protein content.
- label: Organic certification and additive-free status
  description: Some bakers require additive-free flour for predictable fermentation;
    bleaching agents or dough conditioners in one brand could affect crumb structure
    independently of protein level.
