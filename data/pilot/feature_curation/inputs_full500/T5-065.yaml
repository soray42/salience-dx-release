seed_id: T5-065
template: T5
domain: technical_troubleshooting
complexity: low
xbase: My SSH key-based login to our staging server stopped working this morning.
  Password authentication still works for the same account, and I have not touched
  the key pair or the server config. The key worked without any issue until yesterday,
  and I am the only person who manages that account's configuration. {DS}
focal_diagnostic_feature: The authorized_keys file has permissions 644; the SSH daemon
  logs a bad-ownership warning and refuses to load the file.
low_diagnostic_proposition: The .ssh directory looks disorganised with multiple files,
  suggesting something in it is probably broken.
oracle_action: ANSWER
oracle_focus: Fix the authorized_keys file permissions to 600 and verify SSH reloads
  the key; this is a standard permission-enforcement failure.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer a broken configuration from directory appearance.
  Ask for SSH daemon logs and the permissions on the authorized_keys file.
cell_oracles:
  HL:
    action: ASK
    focus: Do not infer a broken configuration from directory appearance. Ask for
      SSH daemon logs and the permissions on the authorized_keys file.
  LL:
    action: ASK
    focus: Do not infer a broken configuration from directory appearance. Ask for
      SSH daemon logs and the permissions on the authorized_keys file.
  HH:
    action: ANSWER
    focus: Fix the authorized_keys file permissions to 600 and verify SSH reloads
