variants:
  HL:
    distractor: The listing of my .ssh directory looks like a junk drawer — mismatched
      filenames, dated backup copies, and multiple key files piled together — and
      that kind of disorder signals to me that something in there is almost certainly
      broken.
    diagnosticity: low
    salience: high
    proposition: The .ssh directory looks disorganised with multiple files, suggesting
      something in it is probably broken.
    salience_source: B (narrative coherence — vivid concrete description of directory
      contents); C (confident assertion — 'almost certainly broken')
    why_plausible: A cluttered .ssh directory could contain conflicting key files,
      duplicate entries, or misnamed files that confuse the daemon — a busy reader
      would feel this warrants investigation.
    why_irrelevant: Visual appearance of a directory listing has no causal connection
      to file permission bits; the permission value 644 is independently set and cannot
      be inferred from how many files are present.
  LL:
    distractor: The .ssh directory looks disorganised with multiple files, which suggests
      something in it is probably broken.
    diagnosticity: low
    salience: low
    proposition: The .ssh directory looks disorganised with multiple files, suggesting
      something in it is probably broken.
    matched_to: HL
  HH:
    distractor: Running stat on the authorized_keys file shows permissions 644, world-readable;
      the SSH daemon error log contains 'bad ownership or modes for authorized_keys'
      and refuses to load the file entirely.
    diagnosticity: high
    salience: high
    proposition: The authorized_keys file has permissions 644; the SSH daemon logs
      a bad-ownership warning and refuses to load the file.
    salience_source: B (narrative coherence — specific command, specific log message,
      precise permission value linked to failure mechanism)
  LH:
    distractor: The authorized_keys file has permissions 644; SSH logs a bad-modes
      warning and ignores the file.
    diagnosticity: high
    salience: low
    proposition: The authorized_keys file has permissions 644; the SSH daemon logs
      a bad-ownership warning and refuses to load the file.
    matched_to: HH
distractor_direction:
  label: Disorganised .ssh directory
  description: Treating the visual disorder of the .ssh directory as evidence that
    the configuration is broken and responsible for the key authentication failure.
plausible_alternative_directions:
- label: Wrong public key in authorized_keys
  description: Checking whether the correct public key is present and matches the
    private key being offered.
- label: SSH daemon config change
  description: Investigating whether PubkeyAuthentication or AuthorizedKeysFile settings
    were modified on the server.
