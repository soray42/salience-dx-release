seed_id: T5-067
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Our application's LDAP authentication is taking eight to ten seconds per login
  attempt, even for accounts that are definitely in the directory. The same LDAP server
  handles read requests for several other internal services without complaint. No
  changes were made to the server configuration this sprint. {DS}
focal_diagnostic_feature: LDAP profiling shows each uid lookup performs a sequential
  scan of all 50,000 directory entries; no equality index is defined on the uid attribute.
low_diagnostic_proposition: The LDAP admin console looks visually cluttered and disorganised,
  suggesting directory disorganisation is causing the slow query performance.
oracle_action: ANSWER
oracle_focus: Add an equality index on the uid attribute in the LDAP configuration;
  the sequential scan of 50,000 entries is the direct cause of the 8-10 second lookup
  time.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer query performance from admin console appearance.
  Ask for LDAP profiling output and whether an index is configured on the uid attribute.
