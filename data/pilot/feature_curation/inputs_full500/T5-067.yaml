variants:
  HL:
    distractor: The LDAP admin console is packed with collapsed trees, obsolete OUs
      nobody has cleaned up, and labels that overflow their columns — the directory
      looks disorganised enough that slow query performance seems like the natural
      result.
    diagnosticity: low
    salience: high
    proposition: The LDAP admin console looks visually cluttered and disorganised,
      suggesting directory disorganisation is causing the slow query performance.
    salience_source: 'B (narrative coherence — specific visual inventory: collapsed
      trees, obsolete OUs, overflowing labels); C (confident inferential bridge —
      ''seems like the natural result'')'
    why_plausible: A visually cluttered admin console may indicate accumulated directory
      cruft — extra OUs, obsolete entries — which could plausibly increase search
      space and slow queries, making the inference feel technically grounded.
    why_irrelevant: The LDAP console's visual appearance reflects how an admin has
      arranged the tree view, not the indexing configuration; query performance depends
      on attribute indexes, not on how many OUs are visible in the UI.
  LL:
    distractor: The LDAP admin console looks visually cluttered and disorganised,
      suggesting directory disorganisation is causing the slow query performance.
    diagnosticity: low
    salience: low
    proposition: The LDAP admin console looks visually cluttered and disorganised,
      suggesting directory disorganisation is causing the slow query performance.
    matched_to: HL
  HH:
    distractor: Running an ldapsearch with the LDAP profiling overlay shows the uid
      lookup scanning all 50,000 directory entries sequentially and taking 8.4 seconds;
      there is no equality index defined on the uid attribute.
    diagnosticity: high
    salience: high
    proposition: LDAP profiling shows each uid lookup performs a sequential scan of
      all 50,000 directory entries; no equality index is defined on the uid attribute.
    salience_source: B (narrative coherence — specific diagnostic method, precise
      entry count and elapsed time, named missing configuration element)
  LH:
    distractor: LDAP profiling shows a sequential scan of 50,000 entries per uid lookup
      taking 8.4 seconds; no equality index exists on the uid attribute.
    diagnosticity: high
    salience: low
    proposition: LDAP profiling shows each uid lookup performs a sequential scan of
      all 50,000 directory entries; no equality index is defined on the uid attribute.
    matched_to: HH
distractor_direction:
  label: Directory visual disorganisation
  description: Treating the cluttered visual appearance of the LDAP admin console
    as evidence of directory disorganisation that is causing the slow query performance.
plausible_alternative_directions:
- label: Concurrent connection saturation
  description: Investigating whether the LDAP server is hitting a connection or thread
    limit during peak login load from this application.
- label: Network latency to LDAP host
  description: Checking whether the path from the application server to the LDAP host
    has degraded, adding round-trip time to each bind.
- label: Schema or filter complexity
  description: Examining whether the application's search filter is too broad or uses
    attributes the server cannot efficiently match.
