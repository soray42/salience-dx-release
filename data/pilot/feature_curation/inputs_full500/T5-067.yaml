causal_audit:
  steelman: 'A cluttered LDAP directory with many OUs, obsolete entries, and an unorganised
    tree structure could plausibly increase the search space and slow down attribute
    lookups — more objects to traverse even with indexing, or a very large flat OU
    forcing sequential scan behaviour regardless of index hints. An admin seeing a
    messy console might reasonably suspect that accumulated cruft is degrading performance.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — console appearance does not determine whether an
    attribute index exists; the two facts are independent of each other.
