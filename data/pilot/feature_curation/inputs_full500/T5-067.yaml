  HL:
    action: ASK
    focus: Do not infer query performance from admin console appearance. Ask for LDAP
      profiling output and whether an index is configured on the uid attribute.
  LL:
    action: ASK
    focus: Do not infer query performance from admin console appearance. Ask for LDAP
      profiling output and whether an index is configured on the uid attribute.
  HH:
    action: ANSWER
    focus: Add an equality index on the uid attribute in the LDAP configuration; the
