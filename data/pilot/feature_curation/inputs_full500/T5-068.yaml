- label: coaching style compatibility
  description: The trainer's communication style, cuing approach, and personality
    fit with the user may matter as much as credentials for adherence over six months.
- label: client demographic and goal alignment
  description: One trainer may specialise in a user population or goal type (e.g.,
    powerlifting vs general strength) that better matches the user's specific needs.
- label: session structure and programming depth
  description: The quality of the periodised programme each trainer designs — not
    just certifications — may differ in ways worth asking about directly.
