    matched_to: HL
  HH:
    distractor: The provider's developer changelog has an entry from three days ago
      stating that all webhook payloads now use HMAC-SHA256; the handler code still
      calls hmac.new(secret, body, hashlib.sha1) which produces a digest that will
      never match the SHA-256 signature in the header.
    diagnosticity: high
    salience: high
    proposition: The provider's developer changelog shows a migration from HMAC-SHA1
      to HMAC-SHA256 for webhook signatures three days ago; the handler still verifies
      with SHA-1.
    salience_source: B/C — concrete changelog date matching symptom onset, exact code
