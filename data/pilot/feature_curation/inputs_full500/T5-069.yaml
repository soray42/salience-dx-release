      with SHA-1.
    matched_to: HH
distractor_direction:
  label: provider security dashboard misconfiguration
  description: Treating the provider's disorganised security settings interface as
    evidence that the provider has misconfigured their webhook signing on the server
    side.
plausible_alternative_directions:
- label: signing secret rotation
  description: The provider may have rotated the HMAC signing secret, causing the
    handler's stored secret to no longer match and producing false on every verification.
- label: payload encoding or serialisation change
  description: The provider may have changed how the payload body is serialised or
    encoded before signing, so even the correct algorithm applied to the raw body
    would fail.
- label: header name or format change
  description: The provider may have changed the header carrying the signature (name,
    prefix, or casing), causing the handler to read an empty value and verify against
    nothing.
