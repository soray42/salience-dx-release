  HL:
    distractor: The provider's security settings page looks like it has not been touched
      since 2015 — misaligned labels, no search, three different navigation styles
      on one screen; a setup this disorganised probably has misconfigured webhook
      signing somewhere on their end.
    diagnosticity: low
    salience: high
    proposition: The provider's security dashboard looks disorganised; a setup this
      disorganised probably has misconfigured webhook signing on their end.
    salience_source: D/B — three specific UI defects (misaligned labels, no search,
      mixed navigation styles), a concrete date anchor ("since 2015"), clean narrative
      of a visited settings page, plus an explicit inferential bridge presented with
      confidence.
    why_plausible: A disorganised, unmaintained security settings page could suggest
      a team that pays little attention to their security tooling, making misconfiguration
      feel plausible to a hurried engineer.
    why_irrelevant: A provider's frontend dashboard design reflects their UI investment
      priorities and has no bearing on their backend signing logic; whether their
      admin interface looks old has no mechanism for causing HMAC algorithm changes
      or signature errors in this handler.
  LL:
    distractor: The provider's security dashboard looks disorganised; a setup this
      disorganised probably has misconfigured webhook signing on their end.
    diagnosticity: low
    salience: low
    proposition: The provider's security dashboard looks disorganised; a setup this
