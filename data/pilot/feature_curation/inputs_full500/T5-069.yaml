seed_id: T5-069
template: T5
domain: technical_troubleshooting
complexity: low
xbase: Our webhook handler started rejecting all incoming events from our payment
  provider with a 400 Bad Request three days ago. The handler code has not changed,
  and events were being processed correctly until then. The provider's status page
  shows no incidents. My logs show the signature verification step returning false
  for every incoming payload. {DS}
focal_diagnostic_feature: The provider's developer changelog shows a migration from
  HMAC-SHA1 to HMAC-SHA256 for webhook signatures three days ago; the handler still
  verifies with SHA-1.
low_diagnostic_proposition: The provider's security dashboard looks disorganised;
  a setup this disorganised probably has misconfigured webhook signing on their end.
oracle_action: ANSWER
oracle_focus: Update the handler to verify signatures with HMAC-SHA256; the provider
  migrated their signing algorithm three days ago and the handler's SHA-1 check can
  never match the new signatures.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer backend misconfiguration from the dashboard's
  appearance. Ask whether the provider has recently changed their signing algorithm,
  and check the handler's verification algorithm against the provider's current documentation.
