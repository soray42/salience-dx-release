causal_audit:
  steelman: 'A poorly maintained security settings UI could indicate a team that under-invests

    in security infrastructure generally. If the security team is disorganised, they

    might push signing changes without proper documentation or notice, deploy

    misconfigured signing logic, or silently change the expected signature format
    in

    a way that breaks integrations. On this reasoning, the dashboard''s appearance
    is

    a weak proxy for the underlying quality of the security engineering.

    '
