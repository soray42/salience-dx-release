seed_id: T5-071
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Our EKS node group has not added any nodes during traffic spikes for the past
  week, even though pending pods sit unscheduled for several minutes. The cluster
  autoscaler pod is running and its logs show no crash or restart. We added a second
  node group last sprint without touching autoscaler configuration. {DS}
focal_diagnostic_feature: The autoscaler log returns AccessDenied on ec2:DescribeAutoScalingGroups
  for the new node group ARN, indicating the autoscaler IAM role lacks the permission
  to discover and scale that group.
low_diagnostic_proposition: The AWS console's dense, older layout makes configuration
  fields hard to read and its displayed status untrustworthy.
oracle_action: ANSWER
oracle_focus: Add the missing ec2:DescribeAutoScalingGroups permission (and related
  ASG permissions) to the cluster autoscaler's IAM role so it can discover and scale
  the new node group.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not dismiss autoscaler behaviour based on console
  appearance. Ask for the autoscaler pod's actual log output and IAM role permissions
  before concluding the status display is unreliable.
