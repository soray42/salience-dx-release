distractor_direction:
  label: Programme quality via website aesthetics
  description: Inferring that the graduate-certificate programme is of lower quality
    because its website appears dated and poorly maintained.
plausible_alternative_directions:
- label: Study time and format fit
  description: The twelve-month graduate certificate may require a weekly time commitment
    incompatible with the user's schedule, making Option B more realistic regardless
    of outcome data.
- label: Employer recognition by sector
  description: The value of each credential varies by industry sub-sector; the user's
    specific target companies may weight Option A or Option B differently from the
    aggregate posting data.
- label: Cost and ROI relative to current salary
  description: Option A's nine-thousand-dollar cost is a material factor; the user's
    current salary and emergency buffer may make this financially unfeasible even
    if outcomes were equivalent.
