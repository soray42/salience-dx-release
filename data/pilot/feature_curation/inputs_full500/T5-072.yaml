variants:
  HL:
    distractor: 'The graduate-certificate programme website looks like it has not
      been redesigned since around 2014: broken image placeholders, inconsistent font
      sizes, and navigation that goes three clicks deep to find the curriculum, which
      makes me wonder whether the programme itself is equally neglected.'
    diagnosticity: low
    salience: high
    proposition: The graduate-certificate programme website is visually dated and
      suggests the programme itself may be equally neglected.
    salience_source: 'B: vivid concrete detail about the source artefact (broken images,
      font inconsistency, deep navigation); C: confident inferential bridge ("makes
      me wonder whether the programme itself is equally neglected").'
    why_plausible: Organisations that neglect public-facing presentation sometimes
      reflect internal disorganisation; an analyst accustomed to evaluating product
      quality through design signals might treat a dated website as a legitimate proxy
      for programme upkeep.
    why_irrelevant: Website maintenance is funded and staffed separately from academic
      programme design; a neglected web presence tells you nothing about curriculum
      quality, faculty, or career outcomes, which are the decision-relevant variables.
