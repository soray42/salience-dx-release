seed_id: T5-072
template: T5
domain: open_qa
complexity: high
xbase: I am deciding between two credentials to advance from a mid-level data analyst
  role. Option A is a twelve-month graduate certificate from a regional university,
  costing about nine thousand dollars. Option B is a professional certification from
  an industry body. I need something that boosts my hireability for senior roles within
  the next two years and I have limited study time each week. {DS}
focal_diagnostic_feature: Among senior analyst job postings tracked over three years,
  71% list Option B as a preferred qualification versus 11% for Option A; Option B
  holders in the user's network report an 18% salary premium over a two-year horizon.
low_diagnostic_proposition: The graduate-certificate programme website is visually
  dated and suggests the programme itself may be equally neglected.
oracle_action: ANSWER
oracle_focus: Choose Option B; it appears in the majority of senior job postings and
  its holders report a salary premium, directly matching the user's two-year hireability
  goal; Option A's job-market footprint is far smaller.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer programme quality from website aesthetics.
  Ask for job-posting data, salary outcomes, programme curriculum, and study-time
  requirements for each credential before deciding.
