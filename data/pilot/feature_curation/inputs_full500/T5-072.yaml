causal_audit:
  steelman: 'Institutional website upkeep is a proxy some practitioners use for

    organisational investment in quality. A university that cannot maintain a

    functional website may plausibly underinvest in programme infrastructure,

    faculty recruitment, or career services. In competitive job markets,

    signalling and presentation matter, so a programme that cannot present

    itself well online may also struggle to place graduates.

    '
  steelman_verdict: no_defensible_mechanism
