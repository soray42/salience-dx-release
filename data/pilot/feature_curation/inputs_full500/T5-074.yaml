seed_id: T5-074
template: T5
domain: open_qa
complexity: medium
xbase: I am comparing two online tutoring subscription services to help me pass a
  professional licensing exam in six months. Both cover the same exam content. Service
  A costs slightly less per month than Service B, and I can trial either before committing.
  {DS}
focal_diagnostic_feature: Service A has an 81% verified first-attempt pass rate versus
  54% for Service B, and its question bank is three times larger.
low_diagnostic_proposition: Service B has a more polished and well-designed interface
  than Service A, suggesting it was built by people who care more about learning.
oracle_action: ANSWER
oracle_focus: Recommend Service A; its pass-rate evidence and larger question bank
  directly predict exam performance, and it costs less.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not treat interface polish as evidence of learning
  effectiveness; ask for pass-rate data, question bank size, and reviews from people
  who sat the specific exam before deciding.
