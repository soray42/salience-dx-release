causal_audit:
  steelman: 'A learning-science practitioner might argue that UI quality correlates
    with

    overall product investment, which in turn correlates with content quality,

    instructor hiring, and question-bank accuracy. If Service B invested heavily

    in UX, they may have invested similarly in content. Additionally, low

    engagement from a clunky UI could indirectly reduce pass rates, making the

    subjective impression causally relevant via adherence.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the engagement-via-adherence pathway is closed structurally
    in HH/LH by the verified outcome data, not in xbase.
