  HL:
    action: ASK
    focus: Do not treat interface polish as evidence of learning effectiveness; ask
      for pass-rate data, question bank size, and reviews from people who sat the
      specific exam before deciding.
  LL:
    action: ASK
    focus: Do not treat interface polish as evidence of learning effectiveness; ask
