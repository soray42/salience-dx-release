    confident_assertion: '"genuinely looks like a tool built by people who care more
      about learning" delivers the inferential bridge with conviction while sounding
      like honest personal assessment.'
    concrete_detail: Specific interface features (custom practice views, progress
      animations, dashboard) are concrete detail about the product surface, not about
      exam outcomes.
