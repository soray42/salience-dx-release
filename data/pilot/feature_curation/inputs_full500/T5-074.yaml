variants:
  HL:
    distractor: 'Service B has a beautiful interface: custom-designed practice views,
      smooth progress animations, and a dashboard that genuinely looks like a tool
      built by people who care more about learning.'
    diagnosticity: low
    salience: high
    proposition: Service B has a more polished and well-designed interface than Service
      A, suggesting it was built by people who care more about learning.
    salience_source: B/D — vivid concrete sensory detail about the interface (custom
      views, animations, dashboard) framed as evidence of underlying organisational
      care, delivered in a confident first-person register.
    why_plausible: A polished product interface can signal investment in quality,
      and engagement concerns are real for self-paced study; a busy reader may conflate
      UX effort with pedagogical effort.
    why_irrelevant: Interface polish has no causal connection to pass-rate or question-bank
      depth; the inferential bridge (looks cared-about → better for learning) is aesthetically
      grounded and empty of outcome evidence.
  LL:
    distractor: Service B has a more polished and well-designed interface than Service
      A, suggesting it was built by people who care more about learning.
    diagnosticity: low
    salience: low
    proposition: Service B has a more polished and well-designed interface than Service
      A, suggesting it was built by people who care more about learning.
    matched_to: HL
  HH:
    distractor: 'Service A posts verified pass-rate data: 81% of subscribers pass
      on the first attempt versus 54% for Service B, and its exam question bank is
      three times larger.'
    diagnosticity: high
    salience: high
    proposition: Service A has an 81% verified first-attempt pass rate versus 54%
      for Service B, and its question bank is three times larger.
    salience_source: Precise verified percentages (81% vs 54%) and a concrete size
      ratio (three times) create a vivid, unambiguous outcome differential.
  LH:
    distractor: Service A has an 81% verified first-attempt pass rate versus 54% for
      Service B and a three times larger question bank.
    diagnosticity: high
    salience: low
    proposition: Service A has an 81% verified first-attempt pass rate versus 54%
      for Service B, and its question bank is three times larger.
    matched_to: HH
distractor_direction:
  label: interface polish as quality signal
  description: Treating Service B's more polished, animated interface as evidence
    that it was built by people who care more, implying better learning outcomes.
plausible_alternative_directions:
- label: engagement and adherence risk
  description: A less engaging interface might cause the user to study less consistently,
    independently of Service A's higher pass rate.
- label: content currency
  description: The exam content may have been updated recently, and whichever service
    updates its question bank more frequently could matter more than current bank
    size.
