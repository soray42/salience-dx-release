distractor_direction:
  label: outdated console UI as quality signal
  description: Treating the Lambda console's legacy editor view as evidence that the
    function is unmaintained, implying the configuration needs a broader overhaul.
plausible_alternative_directions:
- label: concurrency limit exhaustion
  description: Reserved concurrency set too low could throttle executions during transient
    bursts, causing delays that look like cold starts.
- label: downstream service latency
  description: The Lambda itself may be fast but waiting on a slow downstream call
    (database, payment API) that inflates p99 independently of init time.
