xbase: Our serverless order-confirmation Lambda function has p99 response times above
  8 seconds during low-traffic hours, while warm invocations complete in under 300
  milliseconds. The function handles checkout events and has been running unchanged
  in production for six weeks since its last deployment. {DS}
focal_diagnostic_feature: The deployment package is 58 MB and includes nine unused
  library imports; X-Ray init-phase traces show 7.4-second cold-start durations.
low_diagnostic_proposition: The Lambda console for this function displays the older
  legacy editor view, suggesting the function setup is outdated and unmaintained.
oracle_action: ANSWER
oracle_focus: Reduce the deployment package by removing unused dependencies; the 58
  MB package inflates cold-start init time to 7.4 seconds, which directly produces
  the observed p99 spikes at low traffic.
