      whole setup feels unmaintained.
    diagnosticity: low
    salience: high
    proposition: The Lambda console for this function displays the older legacy editor
      view, suggesting the function setup is outdated and unmaintained.
    salience_source: B/D — vivid concrete interface detail (dark-blue sidebar, cramped
      layout) combined with a confident generalisation ("tend to be the ones nobody
      has touched") delivered in first-person professional register.
    why_plausible: Console UI version can loosely correlate with deployment tool vintage,
      and a busy engineer might treat an old-looking console view as a signal of legacy
      configuration that could hide performance problems.
    why_irrelevant: Lambda console UI presentation is a cosmetic distinction that
      carries no information about package size, cold-start duration, or dependency
      configuration; the inferential bridge (old console → unmaintained → performance
      issues) is aesthetically grounded with no causal path to cold-start latency.
