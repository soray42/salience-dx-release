distractor_direction:
  label: aesthetic quality signal
  description: Treating the site's garish color scheme as evidence of careless implementation
    that likely extends to poor rendering performance choices.
plausible_alternative_directions:
- label: JavaScript scroll handler thrashing
  description: A scroll event listener calling offsetHeight or getBoundingClientRect
    inside the handler could force synchronous layout recalculation independently
    of the table CSS.
- label: excessive DOM size
  description: A very large DOM with thousands of nodes can slow layout globally across
    all elements, not just the table, and would be visible in the flamechart as broader
    layout cost.
- label: unvirtualised row rendering
  description: If many rows in the table are rendered simultaneously without virtualisation,
    both layout cost and paint cost would increase regardless of column-width strategy.
