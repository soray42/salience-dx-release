seed_id: T5-077
template: T5
domain: technical_troubleshooting
complexity: low
xbase: Our product listing page feels sluggish and unresponsive during scroll. Chrome
  DevTools shows repeated purple layout bars consuming most of each frame. The page
  has a wide data table with thirty columns and no explicit column widths set anywhere
  in the CSS or markup. {DS}
focal_diagnostic_feature: DevTools flamechart shows the table layout step consuming
  94% of each frame's layout budget, triggered by the browser recalculating all column
  widths on every scroll event because table-layout fixed is absent.
low_diagnostic_proposition: The site's garish color scheme signals that its front
  end was built without performance consideration and is likely slow.
oracle_action: ANSWER
oracle_focus: Add table-layout fixed to the wide table and declare explicit column
  widths via colgroup or CSS; this forces one-pass layout and eliminates the per-scroll
  full recalculation.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer rendering performance from color-scheme
  aesthetics; ask for DevTools performance flamechart output and per-step frame timing
  before diagnosing.
