variants:
  HL:
    distractor: Every scrollable panel in this site is loud neon green on a charcoal
      background, with clashing orange headers — a color scheme so thoughtless it
      makes me suspect the whole front end was thrown together without any performance
      consideration.
    diagnosticity: low
    salience: high
    proposition: The site's garish color scheme signals that its front end was built
      without performance consideration and is likely slow.
    salience_source: B/C/D — vivid concrete sensory detail about the visual presentation
      (neon green, charcoal, clashing orange) carries the inferential bridge as a
      first-person confident observation about code quality.
    why_plausible: A developer inheriting an unfamiliar codebase might reasonably
      assume that poor aesthetic choices signal rushed or low-quality implementation
      overall, making performance-carelessness feel plausible.
    why_irrelevant: CSS color values are entirely decoupled from layout algorithm
      selection; a site can use garish colors with perfectly optimised table layout,
      and no color choice causes or prevents the browser from performing full-width
      recalculation per scroll.
