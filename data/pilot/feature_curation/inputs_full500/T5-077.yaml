    is a

    weak signal of overall engineering discipline: teams that choose clashing

    colors without a design system may also skip CSS best practices like fixed

    table layout. This is a plausible institutional-quality proxy argument.

    However, this is a generic correlation about teams, not a specific mechanism

    by which any color choice causes layout thrashing in this case.

