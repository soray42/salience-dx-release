domain: open_qa
complexity: medium
xbase: I am restocking my cottage garden border with hardy perennials and have narrowed
  it down to two garden centres. Both stock the same genera I need — salvias, echinaceas,
  and geraniums — at similar prices per pot. I have room in my car for up to twelve
  plants today. {DS}
focal_diagnostic_feature: Squeezing pot bases at Centre B reveals dense white-tipped
  healthy root systems that hold the compost together, while the same check at Centre
  A shows tightly circled brown roots with no fresh growth, indicating severely root-bound
  stock.
low_diagnostic_proposition: Centre A's polished layout and clean labelling suggest
  it maintains higher plant quality standards than Centre B.
oracle_action: ANSWER
oracle_focus: Choose Centre B; the root-ball check shows its plants are actively growing
  with healthy root systems, while Centre A's stock is severely root-bound and unlikely
  to establish well after planting.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer plant quality from display tidiness or label
  presentation; ask for or perform a direct root-ball inspection on pots from each
  centre before deciding.
