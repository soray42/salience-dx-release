distractor_direction:
  label: display presentation as quality proxy
  description: Treating Centre A's polished, well-organised retail presentation as
    evidence of higher plant quality and better horticultural standards than Centre
    B.
plausible_alternative_directions:
- label: plant variety availability
  description: One centre may stock specific cultivars or colour forms of the desired
    genera that better suit the border design, which would be a decisive factor at
    equal quality.
- label: staff horticultural expertise
  description: The ability to get accurate planting advice from knowledgeable staff
    is a live candidate advantage when establishing a mixed perennial border for the
    first time.
- label: return or exchange policy
  description: A guarantee or replacement policy on plants that fail to establish
    is a meaningful differentiator when buying a full border restocking at similar
    prices.
