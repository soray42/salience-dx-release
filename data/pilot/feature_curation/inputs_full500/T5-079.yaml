seed_id: T5-079
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Our React marketing site scores poorly on mobile Lighthouse audits — first
  contentful paint is over five seconds on a simulated 4G connection. The design renders
  correctly once loaded, all API calls resolve, and we haven't changed hosting or
  CDN configuration in the past month. {DS}
focal_diagnostic_feature: The main JavaScript bundle delivered to the browser is 2.3
  MB uncompressed; minification and tree-shaking are disabled in the build configuration.
low_diagnostic_proposition: The loading screen looks dated and suggests performance
  may have been treated as an afterthought.
oracle_action: ANSWER
oracle_focus: Enable minification and tree-shaking in the build configuration immediately;
  then audit for unused imports and consider code-splitting to reduce initial bundle
  size.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer bundle or build quality from loading-screen
  aesthetics. Ask for network tab bundle sizes, build tool configuration, and whether
  minification and tree-shaking are enabled.
cell_oracles:
  HL:
    action: ASK
    focus: Do not infer bundle or build quality from loading-screen aesthetics. Ask
      for network tab bundle sizes, build tool configuration, and whether minification
      and tree-shaking are enabled.
  LL:
    action: ASK
    focus: Do not infer bundle or build quality from loading-screen aesthetics. Ask
