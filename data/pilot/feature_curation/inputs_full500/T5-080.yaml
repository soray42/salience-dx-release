causal_audit:
  steelman: 'Product design quality and manufacturing precision can correlate with
    engineering quality — a company that invests in powder coating and clear user
    documentation may also invest in tight tolerances and robust materials. In composting
    equipment, build quality can affect heat retention, UV resistance, and longevity.
    A market gardener relying on the equipment might reasonably prefer a visually
    professional product as a proxy for durability. However, capacity and cycle time
    are independent of cosmetic finish — a beautifully finished 80-litre tumbler is
    still an 80-litre tumbler, and 8-12 weeks is still 8-12 weeks. No amount of surface
    finish changes the batch volume or processing speed, which are the variables the
    xbase explicitly identifies as decisive.

    '
