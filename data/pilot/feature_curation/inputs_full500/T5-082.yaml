distractor_direction:
  label: font provider service neglect
  description: Investigating whether a poorly maintained or outdated font provider's
    service is causing invisible text by delivering fonts that are incompatible with
    or unsupported in current browser versions.
plausible_alternative_directions:
- label: font preloading missing
  description: The font files may not be preloaded with a link rel=preload hint, causing
    the browser to discover and request them late in the render pipeline and producing
    a longer swap-in delay.
- label: CORS misconfiguration on font origin
  description: Missing or incorrect Cross-Origin headers on the font server could
    cause the browser to silently block font loading on some origins, producing blank
    text that resolves only after a fallback timeout.
