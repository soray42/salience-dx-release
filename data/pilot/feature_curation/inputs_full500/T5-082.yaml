causal_audit:
  steelman: 'A font provider whose documentation is visibly neglected might also be
    running an

    outdated font-serving infrastructure. Some font services inject their own CSS

    (including @font-face rules) rather than having the consumer write them. If this

    provider''s injected stylesheet also omits font-display, then the docs neglect

    and the missing descriptor would share a common cause (organisational neglect).

    A practitioner might thus treat docs quality as weak corroborating evidence and

    recommend switching providers. However, xbase states the fonts load successfully

    per DevTools network logs — the serving infrastructure is functional. The font-display

    descriptor is typically set in the consuming project''s own CSS, not by the provider.

    No constructible mechanism makes doc-site aesthetics causally upstream of the
    @font-face

    rules written in this project''s stylesheet.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: Fonts load successfully per DevTools network logs, ruling
    out server-side delivery failure as the cause of the invisible-text symptom.
