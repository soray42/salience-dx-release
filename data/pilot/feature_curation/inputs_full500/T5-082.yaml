seed_id: T5-082
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Several users have reported seeing invisible text for a few seconds on our
  marketing pages after page load before the text snaps into view. This happens in
  Chrome and Firefox on first visits. The font files themselves load successfully
  according to DevTools network logs. {DS}
focal_diagnostic_feature: Every @font-face rule in the stylesheet omits the font-display
  descriptor, defaulting to block behaviour with a 3-second invisible period that
  matches the reported symptom.
low_diagnostic_proposition: The font provider's documentation site looks outdated,
  suggesting their service is unreliable and behind on browser standards.
oracle_action: ANSWER
oracle_focus: Add font-display:swap (or font-display:fallback) to every @font-face
  rule; the missing descriptor causes the browser to hide text during font load using
  the default block strategy.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer font service reliability from the appearance
  of documentation pages. Ask for the font-display descriptor value in the @font-face
  rules and check which render strategy the browser is using for the font.
