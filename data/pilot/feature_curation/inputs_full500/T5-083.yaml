  notes: 'T5 aesthetic: the inferential bridge (dated/cluttered interface → lag figures

    unreliable) appears in both HL and LL as required by C1/self-check 13. xbase

    closes the "UI could be wrong" pathway by stating the lag was confirmed via CLI,

    so the distractor cannot argue the data is a display artefact. HH/LH carry the

    poison-pill evidence (exact offset, retry loop, zero advance) as the decisive

    focal finding. oracle_action is ASK because even with focal evidence the next

    step is handling the bad record, not a fully answerable closed question.

    Ratios HL:LL=39:14=2.8, HH:LH=27:15=1.8 — both within 4:1.

    '
causal_audit:
  steelman: 'A genuinely buggy monitoring tool could cache stale data or render incorrect

    metrics, making a healthy consumer appear to have a stalled partition. If the
    UI

    were misreporting, no actual problem exists and the investigation should start
    by

    questioning the data source. However, xbase explicitly states the lag was confirmed

    independently via the kafka-consumer-groups CLI, which is a separate tool that
    reads

    directly from Kafka''s coordinator. The CLI output is not mediated by the monitoring

    UI, so no visual design issue can explain the CLI reading. The steelman collapses

    on the CLI-confirmation clause in xbase.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the growing lag on partition 3 was confirmed
    via the kafka-consumer-groups CLI, closing the "monitoring UI could be misrepresenting
    data" pathway that a dated-UI distractor would otherwise leave open.
