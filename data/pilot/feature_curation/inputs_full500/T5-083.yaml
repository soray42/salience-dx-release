variants:
  HL:
    distractor: Our Kafka monitoring tool runs an interface that looks like it was
      designed in 2015 — dull grey tables, overlapping tooltips, and numbers crammed
      into columns too narrow to read — which makes me genuinely distrust the lag
      figures it is reporting.
    diagnosticity: low
    salience: high
    proposition: The consumer-group monitoring interface looks dated and cluttered,
      making the lag figures seem unreliable.
    salience_source: B/C — a vivid first-person aesthetic critique delivered with
      confident distrust framing; the UI description is specific enough to feel credible.
    why_plausible: A genuinely cluttered, hard-to-read monitoring tool could plausibly
      misrender or cache stale data; a busy engineer might dismiss the lag as a display
      artefact.
    why_irrelevant: The lag has already been confirmed by the kafka-consumer-groups
      CLI, which is independent of any monitoring UI; the UI's visual design cannot
      affect CLI output.
  LL:
    distractor: The consumer-group monitoring interface looks dated and cluttered,
      making the lag figures seem unreliable.
    diagnosticity: low
    salience: low
    proposition: The consumer-group monitoring interface looks dated and cluttered,
      making the lag figures seem unreliable.
    matched_to: HL
  HH:
    distractor: Consumer debug logs show a DeserializationException at offset 8,847,219
      on partition 3; the consumer retries that exact offset on a five-second loop
      and never advances past it.
    diagnosticity: high
    salience: high
    proposition: Consumer debug logs record a DeserializationException at a fixed
      offset on partition 3, which the consumer retries on a loop without ever advancing
      past it, indicating a poison-pill message blocking the partition.
    salience_source: The exact offset number, the five-second retry cadence, and the
      zero-advance observation together make the poison-pill stall concrete and unambiguous.
  LH:
    distractor: Consumer logs record a DeserializationException at partition 3, offset
      8,847,219; the offset is never advanced.
    diagnosticity: high
    salience: low
    proposition: Consumer debug logs record a DeserializationException at a fixed
      offset on partition 3, which the consumer retries on a loop without ever advancing
      past it, indicating a poison-pill message blocking the partition.
    matched_to: HH
distractor_direction:
  label: Monitoring UI unreliability
  description: Treating the dated, hard-to-read consumer-group dashboard as a source
    of unreliable or misrendered lag data rather than investigating the underlying
    consumer behaviour.
plausible_alternative_directions:
- label: Schema or message-format change
  description: A producer-side schema update may have changed the message format in
    a way the consumer's deserializer cannot handle, which would also appear as a
    stuck consumer.
- label: Broker partition leader issue
  description: A broker failover or preferred-replica election issue on partition
    3 could stall a consumer waiting for a leader.
- label: Consumer thread deadlock
  description: A deadlock or blocked thread in the consumer's processing logic could
    prevent offset commits and cause growing lag without a visible exception in default
    logs.
