    3.
  - The consumer retries that exact offset on a five-second loop.
  - The consumer never advances past offset 8,847,219.
  hl_salience_dimensions:
    source_credibility: N/A
    narrative_coherence: A coherent first-person account of inspecting the tool and
      forming a reasoned distrust of its output.
    confident_assertion: '"makes me genuinely distrust" — a confident distrust assertion.'
    concrete_detail: Visual specifics (grey tables, overlapping tooltips, narrow columns)
      are about the UI's appearance, not about the Kafka cluster state.
