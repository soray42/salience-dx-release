seed_id: T5-083
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: One of our Kafka consumer groups has stopped processing for the last two days.
  The group shows a growing lag on a single partition — confirmed via the kafka-consumer-groups
  CLI — but messages continue arriving on all other partitions and all other consumer
  groups stay healthy. The main application logs show no unhandled exception. {DS}
focal_diagnostic_feature: Consumer debug logs record a DeserializationException at
  a fixed offset on partition 3, which the consumer retries on a loop without ever
  advancing past it, indicating a poison-pill message blocking the partition.
low_diagnostic_proposition: The consumer-group monitoring interface looks dated and
  cluttered, making the lag figures seem unreliable.
oracle_action: ASK
oracle_focus: Investigate the stuck offset on partition 3 — skip or handle the poison-pill
  message using a DeserializationExceptionHandler or by manually resetting the consumer
  group offset past the bad record; then add dead-letter routing to prevent future
  stalls.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not discount the lag figures on the basis of UI appearance;
  the CLI has already confirmed the lag is real. Ask for debug-level consumer logs
  and what is happening at the stuck offset before diagnosing.
