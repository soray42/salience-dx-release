xbase: I am choosing between two second-hand road bikes at similar asking prices from
  private sellers. Bike A has visible frame scratches and surface rust on one bolt
  but was serviced six months ago. Bike B looks almost new, with a flawless gloss
  finish and matching bar tape. Both are the same frame size, and I did a short test
  ride on each without finding obvious handling issues. {DS}
focal_diagnostic_feature: A torch held inside Bike B's top tube reveals a 3 cm inward
  dent with locally thicker surrounding paint, indicating a respray over impact damage
  that the pristine exterior conceals; the seller confirmed a prior crash when asked.
low_diagnostic_proposition: Bike B's near-new appearance suggests it received better
  care and is the higher-quality choice.
