oracle_focus: Avoid Bike B; the frame dent under the respray is a structural safety
  concern that the pristine appearance conceals. Bike A's cosmetic wear is surface-level
  and does not indicate mechanical problems.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer ownership quality or structural condition
  from cosmetic finish alone. Ask for crash history from both sellers and physically
  inspect both frames before deciding.
