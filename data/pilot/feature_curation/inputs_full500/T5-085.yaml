causal_audit:
  steelman: 'In rare RabbitMQ upgrades, misaligned management plugin versions can
    display stale or incomplete binding data in the UI, making a correctly configured
    broker appear unbounded. A cluttered or partially broken UI could theoretically
    mask real bindings or display phantom missing bindings. However, this would not
    explain why the consumer service logs show zero received-message entries — a UI
    rendering error does not alter actual message routing. The symptom is functional,
    not cosmetic, and the empty binding tab reflects the actual broker state when
    validated through the API.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the distractor concerns UI appearance; UI cosmetics
    have no mechanism for altering AMQP routing or message delivery
