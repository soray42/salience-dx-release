distractor_direction:
  label: Management console misconfiguration signal
  description: Investigating whether the disorganised, cluttered appearance of the
    RabbitMQ management UI indicates an underlying broker configuration error causing
    the message processing failure.
plausible_alternative_directions:
- label: Consumer prefetch limit
  description: A prefetch count of zero or one can cause a consumer to stall if the
    acknowledgement cycle is blocked
  halting apparent message processing.: null
- label: Consumer connection closed
  description: A silently dropped AMQP connection would stop message delivery without
    a deployment change
  appearing as no received-message log entries.: null
