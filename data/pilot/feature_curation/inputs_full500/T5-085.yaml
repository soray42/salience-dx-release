seed_id: T5-085
template: T5
domain: technical_troubleshooting
complexity: low
xbase: Our RabbitMQ consumer service has stopped processing any messages. Messages
  are being published without error by the producer, but the consumer log shows no
  received-message entries for the past hour. The queue was working normally yesterday
  and no code was deployed since then. {DS}
focal_diagnostic_feature: The queue's binding tab in the management UI shows no exchange
  binding, so published messages route to the default exchange and accumulate there
  rather than reaching the queue.
low_diagnostic_proposition: The RabbitMQ management console looks cluttered and visually
  disorganised, suggesting the broker configuration may be unreliable.
oracle_action: ANSWER
oracle_focus: Add the missing exchange-to-queue binding; published messages are accumulating
  in the default exchange and never delivered to the consumer queue.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer broker misconfiguration from UI appearance.
  Ask for queue bindings, exchange routing, and where published messages are accumulating.
