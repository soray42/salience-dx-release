causal_audit:
  steelman: 'Sellers who take high-quality, well-lit photos of a bicycle frame may
    genuinely be more careful owners who maintained the frame better. A meticulous
    presentation can correlate with attentive ownership. However, a hairline crack
    in carbon fibre near a high-stress point like the dropout is not visible in standard
    listing photographs regardless of photo quality; it requires in-person tactile
    and visual inspection. Photo quality tells you nothing about the presence or absence
    of structural damage, and the inference from gloss finish to structural soundness
    has no causal mechanism.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the user has not yet seen either frame in
    person, so photo presentation is the only available information before inspection
    — this correctly stages the question as one requiring in-person verification
