    '
causal_audit:
  steelman: 'A senior SRE might argue: dashboards that aggregate lag across partitions
    can mask per-partition detail, and a confusing colour scheme might have caused
    the team to misread which partition or topic is affected, leading to incorrect
    remediation attempts. But this is an argument that the dashboard impedes diagnosis,
    not that it causes the lag. The focal feature is obtained from the authoritative
    kafka-consumer-groups.sh output, bypassing the dashboard entirely; it shows the
    partition is genuinely unassigned, not merely displayed incorrectly. Dashboard
    aesthetics cannot change broker-side partition assignment state.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the focal feature in HH/LH uses a CLI tool that is
    independent of the dashboard.
