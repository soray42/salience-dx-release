variants:
  HL:
    distractor: The consumer group dashboard we use renders lag bars as overlapping
      columns with labels that clip below the graph baseline, making the number look
      inflated and the colour-coded severity bands nearly indistinguishable from one
      another.
    diagnosticity: low
    salience: high
    proposition: The consumer group monitoring dashboard uses a cluttered, hard-to-parse
      visual layout that makes lag look worse than it is.
    salience_source: B/C — precise visual description (overlapping columns, clipped
      labels, indistinguishable severity bands) delivered with confident specificity
      creates a vivid and credible-sounding readability complaint.
    why_plausible: A practitioner who has seen misleading dashboard aggregations before
      might suspect that poor rendering is overstating the actual lag metric before
      digging into partition-level detail.
    why_irrelevant: Dashboard rendering quality cannot change the partition assignment
      state in the Kafka broker; the lag is real and caused by an unassigned partition,
      which the focal feature establishes directly from broker metadata, not from
      the dashboard display.
  LL:
    distractor: The consumer group monitoring dashboard has a cluttered layout that
      makes the lag metric look worse than it is.
    diagnosticity: low
    salience: low
    proposition: The consumer group monitoring dashboard uses a cluttered, hard-to-parse
      visual layout that makes lag look worse than it is.
    matched_to: HL
  HH:
    distractor: Running kafka-consumer-groups.sh --describe shows partition 3 listed
      with no CONSUMER-ID and no HOST entry while partitions 0, 1, and 2 each show
      an active member — that partition's offset has not moved in 47 hours.
    diagnosticity: high
    salience: high
    proposition: Kafka consumer group metadata shows one partition has no assigned
      consumer — the group coordinator lists it as unassigned — while all other partitions
      have active members consuming normally.
    salience_source: B/C — exact command name, specific partition number, concrete
      absence pattern (no CONSUMER-ID, no HOST), and a precise stall duration make
      the evidence vivid and actionable.
  LH:
    distractor: Consumer group metadata shows partition 3 has no assigned consumer
      while partitions 0 through 2 have active members.
    diagnosticity: high
    salience: low
    proposition: Kafka consumer group metadata shows one partition has no assigned
      consumer — the group coordinator lists it as unassigned — while all other partitions
      have active members consuming normally.
    matched_to: HH
distractor_direction:
  label: Dashboard display distortion
  description: Investigating whether the monitoring dashboard's visual rendering is
    misrepresenting the actual lag magnitude rather than reflecting a genuine consumption
    problem.
plausible_alternative_directions:
- label: Consumer throughput bottleneck
  description: Checking whether consumers are assigned to all partitions but processing
    messages too slowly to keep up with the producer rate.
- label: Partition leader election lag
  description: Assessing whether a broker leader election left the partition temporarily
    unavailable and the consumer stalled awaiting reconnection.
