seed_id: T5-087
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Our Kafka consumer group has been accumulating lag on one topic for the past
  two days. The consumer application is running, shows no exceptions in the logs,
  and reports a healthy connection to the broker. We have not deployed any consumer
  changes this week. {DS}
focal_diagnostic_feature: Kafka consumer group metadata shows one partition has no
  assigned consumer — the group coordinator lists it as unassigned — while all other
  partitions have active members consuming normally.
low_diagnostic_proposition: The consumer group monitoring dashboard uses a cluttered,
  hard-to-parse visual layout that makes lag look worse than it is.
oracle_action: ANSWER
oracle_focus: 'Investigate why partition assignment is missing: check for a consumer
  count below the partition count, a crashed member that failed to rejoin, or a stuck
  group rebalance; reassigning or restarting consumers should close the lag.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer actual consumer assignment state from dashboard
  appearance. Ask for the raw consumer group description output and per-partition
  assignment data before adjusting anything.
cell_oracles:
  HL:
    action: ASK
    focus: Do not infer actual consumer assignment state from dashboard appearance.
      Ask for the raw consumer group description output and per-partition assignment
      data before adjusting anything.
  LL:
    action: ASK
    focus: Do not infer actual consumer assignment state from dashboard appearance.
      Ask for the raw consumer group description output and per-partition assignment
      data before adjusting anything.
  HH:
    action: ANSWER
    focus: 'Investigate why partition assignment is missing: check for a consumer
