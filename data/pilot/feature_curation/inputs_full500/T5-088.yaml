distractor_direction:
  label: Cosmetic condition as maintenance proxy
  description: Using Bike B's near-new visual appearance and recent respray as evidence
    that it has been better maintained and is therefore the safer choice.
plausible_alternative_directions:
- label: Age and model-year reliability
  description: Assessing whether the two-year newer model year on Bike B represents
    meaningful reliability improvements that outweigh the mechanical findings.
- label: Lower mileage advantage
  description: Considering whether Bike B's lower odometer reading (18,000 vs 34,000
    km) is sufficiently favourable to offset the compression and records concerns.
- label: Respray concealment risk
  description: Investigating whether the respray specifically indicates prior damage,
    corrosion repair, or an accident that the seller has not disclosed.
