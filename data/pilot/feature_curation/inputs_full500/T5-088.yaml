xbase: I am choosing between two used motorcycles in the same price range. Bike A
  is a 2018 model with 34,000 km that looks dull and has a slightly faded tank. Bike
  B is a 2020 model with 18,000 km that has a recent respray and looks almost new.
  Both sellers claim regular servicing. I can get a pre-purchase inspection done on
  the one I choose. {DS}
focal_diagnostic_feature: Bike A has a complete stamped service book with dealer records
  every 6,000 km and a compression test yielding 165/167 psi on both cylinders; Bike
  B has no service records and a compression test showing 148/112 psi, indicating
  significant cylinder asymmetry.
low_diagnostic_proposition: Bike B's near-new appearance and recent respray suggest
  it has been better looked after than the visually duller Bike A.
oracle_action: ANSWER
oracle_focus: Choose Bike A; the compression asymmetry and absent service history
  on Bike B represent serious mechanical and provenance risk that the cosmetic respray
  does not address.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not use cosmetic condition as a proxy for mechanical
  health. Ask for service records, compression test results, and inspection findings
  for both bikes before deciding.
