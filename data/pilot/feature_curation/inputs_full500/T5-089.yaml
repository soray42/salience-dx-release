variants:
  HL:
    distractor: The provider dashboard has faded gray panels, menu labels that do
      not quite align, and a deployment log section that looks like it predates modern
      CSS — the kind of interface I would not trust to be running cache invalidations
      correctly.
    diagnosticity: low
    salience: high
    proposition: The CDN provider's dashboard interface looks outdated and suggests
      the service may be unreliable or poorly maintained.
    salience_source: B — vivid first-person description of dashboard quirks with a
      coherent inference chain from appearance to reliability; C — confident concluding
      judgment about trustworthiness.
    why_plausible: Neglected tooling can genuinely correlate with neglected infrastructure,
      so a practitioner might wonder whether a poorly maintained dashboard reflects
      a poorly maintained CDN service.
    why_irrelevant: Dashboard visual design cannot determine whether cache invalidation
      runs correctly; the decisive issue is a Cache-Control TTL that is too long combined
      with no purge step, which is a client-side configuration problem unrelated to
      provider reliability.
  LL:
    distractor: The CDN provider's dashboard interface looks outdated and suggests
      the service may be poorly maintained.
    diagnosticity: low
    salience: low
    proposition: The CDN provider's dashboard interface looks outdated and suggests
      the service may be unreliable or poorly maintained.
    matched_to: HL
  HH:
    distractor: 'Checking the response headers from the CDN edge with curl shows Cache-Control:
      max-age=86400 and an Age value of around 50,000 — the CDN is holding content
      for up to a full day, and the deployment script has no purge or invalidation
      command anywhere in it.'
    diagnosticity: high
    salience: high
    proposition: The CDN configuration sets Cache-Control max-age to 86400 seconds
      with no cache invalidation step in the deployment pipeline, so edge nodes hold
      each version for up to 24 hours regardless of origin updates.
    salience_source: Exact header values and Age counter from a direct curl call,
      paired with the concrete absence of any purge step in the pipeline, make the
      TTL problem immediately verifiable.
  LH:
    distractor: Edge responses carry max-age=86400 with an Age of around 50,000 seconds,
      and the deployment pipeline contains no cache purge or invalidation step.
    diagnosticity: high
    salience: low
    proposition: The CDN configuration sets Cache-Control max-age to 86400 seconds
      with no cache invalidation step in the deployment pipeline, so edge nodes hold
      each version for up to 24 hours regardless of origin updates.
    matched_to: HH
distractor_direction:
  label: CDN provider unreliability
  description: Investigating whether the CDN service itself is running incorrectly
    or failing to propagate cache invalidations due to poor maintenance.
plausible_alternative_directions:
- label: Origin headers not propagated
  description: The origin may be setting correct short-lived Cache-Control headers
    that the CDN strips or ignores, causing the edge to apply its own default TTL.
- label: CDN edge geographic inconsistency
  description: Some CDN edge PoPs may have received a prior invalidation while others
    have not, causing region-dependent stale responses rather than a uniform TTL expiry
    problem.
