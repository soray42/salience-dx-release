seed_id: T5-089
template: T5
domain: technical_troubleshooting
complexity: low
xbase: My static site is served through a CDN, and visitors keep reporting they see
  outdated page content even after I push updates to the origin. When I hit the origin
  directly, I always get the latest version. The CDN provider is the one I have used
  for two years without issues. I have not changed the CDN configuration in the past
  month. {DS}
focal_diagnostic_feature: The CDN configuration sets Cache-Control max-age to 86400
  seconds with no cache invalidation step in the deployment pipeline, so edge nodes
  hold each version for up to 24 hours regardless of origin updates.
low_diagnostic_proposition: The CDN provider's dashboard interface looks outdated
  and suggests the service may be unreliable or poorly maintained.
oracle_action: ANSWER
oracle_focus: Add a cache invalidation or purge step to the deployment pipeline, or
  reduce max-age with stale-while-revalidate; the CDN is working correctly but is
  configured to hold content for 24 hours, so visitors will see stale versions until
  that TTL expires or cache is purged.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer CDN reliability from dashboard appearance.
  Ask for the Cache-Control headers served at the edge and whether the deployment
  pipeline includes a cache invalidation or purge step.
