causal_audit:
  steelman: 'A sysadmin could reasonably argue that a CDN provider with a neglected
    dashboard might

    also be running outdated edge software, which could in principle have bugs in
    cache

    invalidation propagation. However, xbase states this provider has been used without
    issues

    for two years and that no configuration was changed in the past month — eliminating
    a

    recent provider-side change. More decisively, the focal feature shows the max-age
    header

    is set to 86400 with no purge step in the deploy pipeline, which is a client-side

    configuration choice; even a perfectly maintained CDN would hold content for 24
    hours

    under those settings. Provider quality has no mechanism to explain this case''s
    behaviour.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase notes two years of trouble-free use and no configuration
    change in the past month, removing recent provider degradation as an explanation
    without naming the TTL cause.
