variants:
  HL:
    distractor: The claims portal has a wall of dense dropdown menus, a submit button
      that takes fifteen seconds to respond, and a reference number field that rejects
      valid-looking codes — the kind of friction that makes me think this insurer
      is designed to exhaust claimants before they succeed.
    diagnosticity: low
    salience: high
    proposition: The insurance portal looks complicated and slow, which suggests the
      insurer handles claims poorly and may reject valid claims on a technicality.
    salience_source: B — detailed first-person description of each friction point
      building to a coherent processing-quality inference; C — concluding confident
      judgment about the insurer's intent toward claimants.
    why_plausible: Deliberately obstructive claims interfaces are a documented tactic
      of some insurers, and a practitioner could reasonably treat portal friction
      as a signal of bad-faith claims handling.
    why_irrelevant: Portal usability has no bearing on whether a specific activity
      is listed in the covered itinerary; the coverage gap is a policy-schedule issue
      that exists independently of how the portal behaves.
  LL:
    distractor: The insurer's claims portal is complicated and slow, suggesting the
      company handles claims poorly.
    diagnosticity: low
    salience: low
    proposition: The insurance portal looks complicated and slow, which suggests the
      insurer handles claims poorly and may reject valid claims on a technicality.
    matched_to: HL
  HH:
    distractor: Comparing the policy schedule against my booking records shows the
      policy was issued in spring when only the core package was confirmed; the glacier
      trek was booked separately two months later and appears nowhere on the covered-itinerary
      list attached to the policy document.
    diagnosticity: high
    salience: high
    proposition: The travel insurance policy covers cancellations only for the core
      package components listed at booking; the glacier trek was added as a separate
      optional activity after the policy was issued and is not listed in the covered
      itinerary.
    salience_source: Direct comparison of the policy schedule against booking records,
      with a concrete timeline (spring vs two months later) and the specific absence
      of the trek from the covered-itinerary list.
  LH:
    distractor: The policy was issued before the trek was booked and the trek does
      not appear on the covered-itinerary schedule.
    diagnosticity: high
    salience: low
    proposition: The travel insurance policy covers cancellations only for the core
      package components listed at booking; the glacier trek was added as a separate
      optional activity after the policy was issued and is not listed in the covered
      itinerary.
    matched_to: HH
distractor_direction:
  label: Insurer bad-faith portal friction
  description: Treating the slow and complex claims portal as evidence that the insurer
    handles claims in bad faith or rejects valid claims on technicalities.
plausible_alternative_directions:
- label: Operator cancellation refund path
  description: The trek operator cancelled the activity, so the user may have a direct
    refund right from the operator under consumer protection rules before involving
    insurance at all.
- label: Package organiser liability
  description: If the trek was sold as part of a package by the tour operator, package
    travel regulations may require the organiser to refund it regardless of the insurance
    schedule.
