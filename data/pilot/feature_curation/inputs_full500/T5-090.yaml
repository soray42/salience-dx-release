causal_audit:
  steelman: 'A consumer advocate could argue that insurers with poor portal UX often
    also have under-

    resourced claims departments that apply exclusions liberally and deny borderline
    claims;

    so portal friction could correlate with, if not cause, technical rejections. This
    is a

    real correlation in some markets. However, the focal feature reveals the trek
    is not

    listed in the covered itinerary because it was booked after policy issuance —
    a structural

    coverage gap that is independent of claims-handling quality. Even an insurer with
    perfect

    claims handling would apply the same exclusion. Portal friction has no mechanism
    to change

    whether an activity appears on a policy schedule.

    '
