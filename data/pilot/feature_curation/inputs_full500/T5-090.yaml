seed_id: T5-090
template: T5
domain: open_qa
complexity: medium
xbase: I booked a package holiday last spring that includes flights, hotel, and a
  guided glacier trek I paid extra for. A week before departure the trek operator
  cancelled the trek due to poor conditions and I am now deciding whether my travel
  insurance will reimburse the trek fee. The insurer's claims form looks complicated
  and the portal feels slow to navigate. {DS}
focal_diagnostic_feature: The travel insurance policy covers cancellations only for
  the core package components listed at booking; the glacier trek was added as a separate
  optional activity after the policy was issued and is not listed in the covered itinerary.
low_diagnostic_proposition: The insurance portal looks complicated and slow, which
  suggests the insurer handles claims poorly and may reject valid claims on a technicality.
oracle_action: ANSWER
oracle_focus: The trek is almost certainly not covered because it was added after
  the policy was issued and is not listed in the covered itinerary; the user should
  pursue the refund directly from the trek operator or through the payment card's
  purchase protection rather than expecting the travel insurer to cover it.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer claims handling quality from portal appearance.
  Ask for the specific policy schedule, what activities and components are listed
  as covered, and whether the trek booking predates or postdates the policy.
