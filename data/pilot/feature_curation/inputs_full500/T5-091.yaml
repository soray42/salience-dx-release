seed_id: T5-091
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: Our CDN-fronted image API has had slow first-byte times for three weeks — p95
  TTFB is up from 90 ms to about 1.4 seconds at busy periods. Origin CPU and memory
  look healthy, and the asset count has not changed significantly. Our CDN vendor
  is the same one we have used for two years. {DS}
focal_diagnostic_feature: Origin shield is disabled in the CDN configuration, so every
  edge PoP fetches independently from the origin server instead of sharing a single
  aggregated request path.
low_diagnostic_proposition: The CDN control panel's dated visual style suggests the
  platform is managing routes incorrectly.
oracle_action: ANSWER
oracle_focus: Diagnose origin shield being disabled; re-enable origin shield so edge
  PoPs aggregate requests through a single shield node rather than hammering origin
  in parallel.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer CDN routing quality from control-panel appearance.
  Ask for CDN configuration details, origin shield settings, and cache-hit ratio before
  diagnosing the cause.
