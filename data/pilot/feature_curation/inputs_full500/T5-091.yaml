    distractor: 'The CDN control panel looks like a project someone abandoned mid-refresh:
      misaligned columns, four different button styles, and a colour scheme I would
      have called vintage in 2013. That dated look makes me genuinely doubt the platform
      is managing our routes correctly.'
    diagnosticity: low
    salience: high
    proposition: The CDN control panel's dated visual style suggests the platform
