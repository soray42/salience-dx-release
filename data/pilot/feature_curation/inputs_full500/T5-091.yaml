    salience_source: Dimension B (narrative coherence) — vivid specific visual detail
      about the interface; dimension C (confident assertion) — direct expression of
      doubt framed as a reasoned inference.
    why_plausible: A busy engineer might reasonably infer that a neglected, poorly-maintained
      UI reflects broader technical neglect in the platform's routing and configuration
      layers.
    why_irrelevant: UI aesthetics have no causal path to CDN routing behaviour or
      origin shield configuration; the panel's appearance tells nothing about whether
      origin shield is enabled.
  LL:
    distractor: The CDN control panel has a dated visual style that makes me doubt
