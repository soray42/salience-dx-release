    matched_to: HH
distractor_direction:
  label: CDN platform routing neglect
  description: Investigating whether the CDN vendor's poorly-maintained interface
    reflects underlying routing or configuration defects that are causing high TTFB.
plausible_alternative_directions:
- label: origin-side bottleneck
  description: The origin service has a hidden resource constraint or slow path not
    reflected in aggregate CPU/memory metrics.
- label: CDN cache-miss spike
  description: A shift in request patterns or a cache invalidation event is generating
    a burst of cache misses that overwhelm origin.
- label: geographic routing misconfiguration
  description: Requests are being routed to a distant CDN PoP rather than the nearest
    one, adding network round-trip latency.
