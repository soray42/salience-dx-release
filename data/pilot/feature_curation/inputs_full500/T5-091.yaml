causal_audit:
  steelman: 'A senior CDN engineer might argue: neglected vendor tooling correlates
    with poor operational discipline, which could manifest as stale routing tables,
    unchecked configuration drift, or unreviewed edge settings. A vendor whose UI
    team has deprioritised maintenance might also deprioritise platform reliability.
    This could, in principle, raise the probability of a misconfiguration like disabled
    origin shield.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the UI appearance has no direct causal path to origin-shield
    state; the steelman shows only a loose correlational argument, not a mechanism,
    and the CDN vendor has been in use for two years without prior issues.
