distractor_direction:
  label: brochure-quality coverage signal
  description: Treating the extended warranty brochure's polished, professional visual
    design as evidence that the plan provides genuinely comprehensive and valuable
    coverage.
plausible_alternative_directions:
- label: post-manufacturer-warranty risk period
  description: Assessing whether the car's reliability profile after month 60 justifies
    a warranty that kicks in after the manufacturer coverage expires.
- label: dealership-margin add-on pressure
  description: Evaluating whether the £480 price reflects genuine actuarial coverage
    cost or primarily dealership margin at point of sale.
- label: statutory consumer rights coverage
  description: Determining whether relevant consumer protection law independently
    provides implied warranty rights beyond the manufacturer term.
