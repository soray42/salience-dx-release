    why_plausible: High-production-value documentation is often associated with well-resourced,
      reliable products; a busy buyer at the point of sale may reasonably treat brochure
      quality as a credibility signal for a complex financial product.
    why_irrelevant: Brochure design quality has no causal relationship to the actual
      coverage scope; the manufacturer warranty's remaining term and component overlap
      determine whether the add-on fills any gap, regardless of how the brochure looks.
