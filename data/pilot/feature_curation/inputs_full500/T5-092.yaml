seed_id: T5-092
template: T5
domain: open_qa
complexity: high
xbase: I just bought a used car from an authorised dealership. During the finance
  sign-off, I was offered a third-party extended warranty for £480. The car is three
  and a half years old, from a major manufacturer with a known track record. I am
  trying to decide whether the add-on is worth paying for. {DS}
focal_diagnostic_feature: The manufacturer's original 5-year comprehensive warranty
  has 18 months remaining and covers the same drivetrain, electrical, and ancillary
  components the extended plan lists, so the third-party plan provides no additional
  coverage during its overlap period.
low_diagnostic_proposition: The warranty brochure's polished professional design suggests
  the extended plan delivers comprehensive coverage worth purchasing.
oracle_action: ANSWER
oracle_focus: Do not buy the extended warranty; the manufacturer's remaining 18-month
  coverage is coextensive with the add-on's scope, making the £480 plan redundant
  for that period.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not use brochure quality as a proxy for coverage value.
  Ask for the remaining manufacturer warranty duration and component scope before
  evaluating the add-on.
