causal_audit:
  steelman: 'A senior consumer-protection advisor might argue: insurers who invest
    heavily in professional documentation tend to have more rigorous claims processes,
    more clearly defined coverage terms, and more reliable payout histories. A polished
    brochure can therefore serve as a weak positive signal for product quality and
    claims reliability. Additionally, the brochure''s professional component diagrams
    might reveal coverage that is genuinely broader than the manufacturer warranty.

    '
