seed_id: T5-093
template: T5
domain: technical_troubleshooting
complexity: low
xbase: Our mobile app's REST endpoint is slow — every call takes about 900 ms regardless
  of payload size. The endpoint sits behind an API gateway with a CDN in front. Other
  endpoints on the same stack respond in under 80 ms. The slow one is a product detail
  fetch that returns about 2 KB of JSON. {DS}
focal_diagnostic_feature: 'Every response from the product-detail endpoint carries
  `Cache-Control: no-store`, preventing any CDN caching and forcing every request
  to traverse the full path to origin.'
low_diagnostic_proposition: The API gateway console's disorganised appearance suggests
  its routing configuration is wrong.
oracle_action: ANSWER
oracle_focus: 'Remove or replace the `Cache-Control: no-store` directive on product-detail
  responses so the CDN can cache them; requests will then be served from the edge
  rather than reaching origin on every call.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer routing misconfiguration from console appearance.
  Ask for the response headers on the slow endpoint, particularly Cache-Control, and
  compare cache-hit ratio with the fast endpoints.
