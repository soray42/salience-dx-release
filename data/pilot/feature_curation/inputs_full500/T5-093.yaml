distractor_direction:
  label: API gateway routing misconfiguration
  description: Investigating whether a misconfigured routing rule in the API gateway
    is directing product-detail requests inefficiently and causing the latency gap.
plausible_alternative_directions:
- label: origin query or database bottleneck
  description: The product-detail endpoint may trigger a slow database lookup or external
    service call that the other fast endpoints avoid.
- label: missing connection keep-alive
  description: The slow endpoint may not reuse connections, adding TCP handshake overhead
    on every request unlike the faster endpoints.
