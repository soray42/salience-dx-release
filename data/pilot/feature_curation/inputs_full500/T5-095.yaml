    to LH to close the C10 leak.

    '
causal_audit:
  steelman: 'A storage engineer might argue: flash memory does have a finite write-endurance
    cycle, and many drives implement firmware-level read-only enforcement when wear-leveling
    tables are exhausted. A visually degraded drive could plausibly have been in heavy
    use long enough to approach that limit. The appearance could be a signal worth
    investigating.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — xbase does not mention a write-protect switch, keeping
    the focal feature exclusively in HH/LH. The steelman's mechanism (firmware wear)
    is real in the abstract but label condition provides zero evidence of it.
