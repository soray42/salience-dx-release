variants:
  HL:
    distractor: The label on the drive is faded and peeling, which makes me wonder
      whether the flash cells are wearing out and the firmware has flipped it to read-only
      protection mode.
    diagnosticity: low
    salience: high
    proposition: The drive label is visibly faded and peeling, suggesting the drive
      may have degraded to a firmware-enforced read-only protection state.
    salience_source: B/C — vivid physical description ('barely visible'), confident
      inferential bridge presented as the speaker's own concern ('makes me wonder
      whether'), narrative coherence of wear-to-protection logic.
    why_plausible: Flash firmware does implement write-protection on worn media; a
      physically degraded-looking drive could genuinely have depleted write cycles,
      and the inference is technically plausible in the abstract.
    why_irrelevant: Label condition is purely cosmetic and carries no information
      about flash cell wear or firmware state; the physical write-protect slider —
      not firmware — is what sets the ro mount flag in this case.
  LL:
    distractor: The drive label is visibly faded and peeling, suggesting the drive
      may have degraded to a firmware-enforced read-only protection state.
    diagnosticity: low
    salience: low
    proposition: The drive label is visibly faded and peeling, suggesting the drive
      may have degraded to a firmware-enforced read-only protection state.
    matched_to: HL
  HH:
    distractor: Running mount shows the device is mounted with the ro flag; a physical
      write-protect slider on the side of the drive is in the locked position, sitting
      right against the edge of the housing where it is easy to move accidentally.
    diagnosticity: high
    salience: high
    proposition: The mount output shows the drive is mounted with the ro flag, and
      the drive has a physical write-protect slider currently in the locked position.
    salience_source: B/C — specific command output cited ('mount shows'), concrete
      physical detail ('sitting right against the edge of the housing'), casual observation
      of how the slider got there ('easy to move accidentally').
  LH:
    distractor: The mount output shows the ro flag; the drive's write-protect slider
      is locked, right against the housing edge, and easy to move accidentally.
    diagnosticity: high
    salience: low
    proposition: The mount output shows the drive is mounted with the ro flag, and
      the drive has a physical write-protect slider currently in the locked position.
    matched_to: HH
distractor_direction:
  label: Firmware wear-protection enforcement
  description: Investigating whether the flash controller has detected cell exhaustion
    and automatically enforced read-only mode to prevent further writes.
plausible_alternative_directions:
- label: Filesystem corruption
  description: The filesystem metadata may be corrupted, causing the kernel to mount
    read-only automatically as a safety measure.
- label: Mount options mismatch
  description: A udev rule or fstab entry may be specifying ro mount options for this
    device class on this machine.
