seed_id: T5-095
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: My USB flash drive mounts on my Linux laptop but everything I try to write
  to it fails with a read-only filesystem error. The drive shows up in lsblk and I
  can browse files that are already on it. I have not reformatted the drive recently.
  I use it across three machines without issue until this week. {DS}
focal_diagnostic_feature: The mount output shows the drive is mounted with the ro
  flag, and the drive has a physical write-protect slider currently in the locked
  position.
low_diagnostic_proposition: The drive label is visibly faded and peeling, suggesting
  the drive may have degraded to a firmware-enforced read-only protection state.
oracle_action: ANSWER
oracle_focus: Slide the write-protect tab to the unlocked position and remount; the
  ro flag in the mount output confirms hardware write-protection is engaged, not filesystem
  corruption or firmware wear.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer firmware wear-protection from label cosmetics;
  check for a physical write-protect switch on the drive body and inspect the mount
  flags before diagnosing further.
