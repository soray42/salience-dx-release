  notes: 'T5 bridge (''faded label → firmware wear-protection'') appears in both HL
    and LL as required by C1. The inferential bridge is explicitly stated in LL as
    a flat clause. Steelman checked: firmware read-only IS a real mechanism for worn
    drives, but label condition has zero diagnostic value for flash cell state. HH/LH
    diff (post-repair): LH now carries all five HH atomic claims — ro flag, physical
    write-protect slider, locked position, positioned right against the housing edge,
    and easy to move accidentally — stated flatly without the HH vivid framing. QC
