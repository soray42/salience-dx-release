variants:
  HL:
    distractor: The error panel is showing raw hex fragments and truncated paths that
      look nothing like a normal OS message — output that garbled almost always means
      the kernel driver has lost track of the device state entirely.
    diagnosticity: low
    salience: high
    proposition: The garbled error output in the disk utility suggests a kernel driver
      problem.
    salience_source: B — clean confident causal inference with confident assertion
      ('almost always means'); C — assertive present-tense claim about device state.
    why_plausible: Garbled error output genuinely can indicate driver-layer trouble;
      a practitioner who hasn't tried fsck first might plausibly investigate the driver
      stack.
    why_irrelevant: The dirty-bit result from fsck is a complete, structural account
      of the mount failure; a driver fault would not produce a clean fsck pass and
      successful mount afterward.
  LL:
    distractor: The error output in the disk utility looks corrupted, which might
      indicate a driver problem.
    diagnosticity: low
    salience: low
    proposition: The garbled error output in the disk utility suggests a kernel driver
      problem.
    matched_to: HL
  HH:
    distractor: Running fsck on the device shows only a dirty bit set from the unclean
      unmount; no bad sectors, no structure damage — the filesystem is otherwise intact
      and mounts cleanly after the check completes.
    diagnosticity: high
    salience: high
    proposition: fsck on the drive finds only a dirty bit from the unclean unmount
      and no other filesystem damage, and the drive mounts cleanly after the check
      completes.
    salience_source: B — precise technical sequence (dirty bit → clean fsck → successful
      mount) with a clear causal chain; concrete observed outcome.
  LH:
    distractor: fsck finds only a dirty bit from the unclean unmount; no other damage
      is found and the drive mounts cleanly.
    diagnosticity: high
    salience: low
    proposition: fsck on the drive finds only a dirty bit from the unclean unmount
      and no other filesystem damage, and the drive mounts cleanly after the check
      completes.
    matched_to: HH
distractor_direction:
  label: Kernel driver fault
  description: Investigating whether the USB kernel driver or OS device layer has
    lost track of the device state, producing garbled error output and preventing
    the mount.
plausible_alternative_directions:
- label: Physical media damage
  description: The drive sustained hardware damage during the hot-unplug, causing
    bad sectors or controller failure rather than just filesystem state.
- label: Partition table corruption
  description: The unclean unmount may have corrupted the partition table or MBR/GPT,
    preventing the OS from enumerating volumes regardless of filesystem state.
- label: USB controller or port fault
  description: A fault in the host USB controller or the specific port could prevent
    stable enumeration and explain the mount failure independently of the filesystem.
