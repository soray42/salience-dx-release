seed_id: T5-097
template: T5
domain: technical_troubleshooting
complexity: low
xbase: My USB flash drive will not mount after I unplugged it mid-transfer yesterday.
  The drive shows up in the disk utility but every attempt to access it fails. The
  error output in the utility panel looks like scrambled hex codes mixed with partial
  path strings, nothing readable. The same failure occurs when I try the drive on
  a second computer. {DS}
focal_diagnostic_feature: fsck on the drive finds only a dirty bit from the unclean
  unmount and no other filesystem damage, and the drive mounts cleanly after the check
  completes.
low_diagnostic_proposition: The garbled error output in the disk utility suggests
  a kernel driver problem.
oracle_action: ANSWER
oracle_focus: Run fsck on the drive to clear the dirty bit from the unclean unmount;
  the filesystem is intact and will mount cleanly once the check completes.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not infer a kernel driver fault from garbled error
  display. Ask whether fsck has been run and whether the drive was ejected cleanly
  before diagnosing deeper.
