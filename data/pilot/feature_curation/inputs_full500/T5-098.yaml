distractor_direction:
  label: Colorway as marketing signal
  description: Treating Model A's loud neon-orange colorway as evidence that it is
    a fashion-oriented shoe rather than a performance one, and therefore not suited
    to technical wet terrain.
plausible_alternative_directions:
- label: Stack height and cushioning mismatch
  description: Neither model's stack height or cushioning level is known; either could
    be poorly matched to the technical terrain regardless of lug depth.
- label: Sole compound durability
  description: Lug depth may not capture compound hardness differences; a softer compound
    on Model B might provide better wet-rock friction than Model A's deeper lugs in
    a harder compound.
- label: Fit and toe box width
  description: For technical descents, an ill-fitting shoe creates instability independent
    of lug depth, making fit the deciding factor if one model fits poorly.
