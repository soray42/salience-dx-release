causal_audit:
  steelman: 'Copied-and-pasted fstab entries from forum posts sometimes contain non-breaking

    spaces, Unicode dashes, or tab/space mixtures that cause some fstab parsers to

    misidentify field boundaries, resulting in the mount option field being ignored
    or

    misread. A practitioner who has debugged such issues would be justified in suspecting

    the formatting first, particularly when the entry "looks messy." It is a reasonable

    first diagnostic step before examining option fields.

    '
  steelman_verdict: no_defensible_mechanism
