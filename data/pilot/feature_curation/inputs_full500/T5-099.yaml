variants:
  HL:
    distractor: That kind of irregular whitespace and mixed tabs in fstab is exactly
      the sort of thing the parser stumbles on — inconsistent formatting in fstab
      has caused silent mount failures on my systems before, and it looks unreliable
      enough to suspect here.
    diagnosticity: low
    salience: high
    proposition: The irregular whitespace and mixed tabs in the fstab entry look like
      formatting that could cause a mount parsing failure.
    salience_source: B — confident first-person rule stated from personal experience;
      C — 'exactly the sort of thing' and 'has caused' as strong assertive framing.
    why_plausible: fstab entries with truly malformed whitespace can confuse some
      older parsing implementations; a practitioner who has seen this might consider
      it a reasonable first hypothesis when the entry looks untidy.
    why_irrelevant: Linux fstab parsing is whitespace-flexible — tabs and extra spaces
      between fields are treated equivalently; the mount failure occurs before the
      network is available, which the _netdev omission explains completely and formatting
      cannot.
  LL:
    distractor: The irregular whitespace and mixed tabs in the fstab entry look like
      formatting that could cause a parsing failure.
    diagnosticity: low
    salience: low
    proposition: The irregular whitespace and mixed tabs in the fstab entry look like
      formatting that could cause a mount parsing failure.
    matched_to: HL
  HH:
    distractor: The fstab entry is missing the _netdev mount option; without it the
      OS attempts to mount the network share during the pre-network boot stage, before
      the interface is up, and silently gives up — the manual mount after login works
      because the network is ready by then.
    diagnosticity: high
    salience: high
    proposition: The fstab entry omits the _netdev mount option, causing the OS to
      attempt the network mount before the network interface is ready at boot.
    salience_source: B — specific option name (_netdev) with mechanistic explanation
      (pre-network boot stage) and explicit account of why the manual mount works,
      forming a complete causal chain.
  LH:
    distractor: The fstab entry omits _netdev, so the OS mounts before the network
      is up; post-login manual mounting works because the network is ready.
    diagnosticity: high
    salience: low
    proposition: The fstab entry omits the _netdev mount option, causing the OS to
      attempt the network mount before the network interface is ready at boot.
    matched_to: HH
distractor_direction:
  label: fstab whitespace parsing failure
  description: Investigating whether the irregular whitespace and mixed tabs in the
    fstab entry are causing the mount to fail silently at boot due to a field-parsing
    error.
plausible_alternative_directions:
- label: Network share credential or auth failure
  description: The share may require credentials that are not available until after
    user login, making the boot-time mount fail regardless of timing options.
- label: Share hostname not resolvable at boot
  description: If the network share is referenced by hostname, DNS resolution may
    not be available early enough in the boot sequence even with _netdev present.
- label: Filesystem type driver not loaded early
  description: If the share uses a filesystem type (e.g., cifs, nfs) whose kernel
    module loads late, the mount attempt may fail regardless of whitespace or _netdev
    status.
