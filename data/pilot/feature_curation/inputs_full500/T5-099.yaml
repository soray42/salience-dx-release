    HL and LL per C1 T5 rule.

    HL adds personal history ("has caused on my systems before") which is source-weight

    framing, not a new claim about the current case. Allowed per C1.

    The key distractor-ruling evidence (HH/LH) is the _netdev omission — a configuraton

    fact, not a whitespace fact. fstab whitespace parsing is flexible in Linux; this
    is

    widely documented but not assumed by all practitioners.

    Steelman: there are real cases where copy-pasted fstab entries with Unicode spaces

    or non-standard characters cause parse failures. The concern is not unreasonable

    on sight, but the focal feature (_netdev omission + boot-order timing) explains

    the failure completely and specifically.

