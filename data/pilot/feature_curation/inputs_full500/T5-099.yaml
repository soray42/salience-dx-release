seed_id: T5-099
template: T5
domain: technical_troubleshooting
complexity: medium
xbase: A network share I added to my workstation is not mounting automatically at
  boot. I added it to fstab last week. If I mount it manually after login the share
  works fine. The fstab entry looks messy — I copied it from an old forum post and
  the whitespace is irregular with a mix of tabs and spaces. {DS}
focal_diagnostic_feature: The fstab entry omits the _netdev mount option, causing
  the OS to attempt the network mount before the network interface is ready at boot.
low_diagnostic_proposition: The irregular whitespace and mixed tabs in the fstab entry
  look like formatting that could cause a mount parsing failure.
oracle_action: ANSWER
oracle_focus: Add the _netdev option to the fstab entry so the OS defers the mount
  until the network is up; the whitespace formatting is not the cause.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not diagnose the mount failure from fstab appearance.
  Ask whether the entry includes _netdev and whether boot logs show the mount being
  attempted before the network is ready.
