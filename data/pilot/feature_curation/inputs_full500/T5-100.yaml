causal_audit:
  steelman: 'Cosmetic damage and owner carefulness do correlate in aggregate. A camera
    owner who scratches

    the casing significantly may also have dropped the body (risking AF motor misalignment
    or

    sensor mount damage), used it in dusty or wet environments without protection
    (sensor/shutter

    contamination risk), or applied excessive force to lens mounts. An experienced
    buyer making a

    quick decision could rationally use cosmetic condition as a prior over owner care,
    in the

    absence of objective usage data. The inferential bridge is not absurd — it is
    just dominated

    by the objective data in the focal feature.

    '
  steelman_verdict: no_defensible_mechanism
