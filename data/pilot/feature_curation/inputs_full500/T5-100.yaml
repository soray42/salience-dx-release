seed_id: T5-100
template: T5
domain: open_qa
complexity: high
xbase: I'm choosing between two used mirrorless cameras for a new photography hobby.
  Both are the same model and both are priced similarly. The seller of Body A describes
  heavy use and admits the casing has scratches. Body B looks barely touched in its
  listing photos and the seller says it was lightly used. I have contacted both sellers
  and each will let me test before paying. A camera technician inspected Body A and
  found no impact damage to the shutter mechanism or sensor mount. {DS}
focal_diagnostic_feature: Body A has 4,200 documented shutter actuations with verifiable
  purchase documentation, while Body B has no shutter history and sensor dust spots
  visible in test shots.
low_diagnostic_proposition: Body A's cosmetic scratches indicate careless handling
  that likely caused hidden internal damage.
oracle_action: ANSWER
oracle_focus: 'Choose Body A: its low shutter count, verified provenance, and clean
  sensor outweigh cosmetic scratches; Body B has unverifiable history and confirmed
  sensor contamination.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not reject Body A on cosmetic grounds alone; ask for
  shutter count, purchase documentation, and sensor test shots for both bodies before
  deciding.
