distractor_direction:
  label: Cosmetic wear as internal damage signal
  description: Treating Body A's scratched and worn casing as evidence of careless
    handling that likely caused hidden mechanical or optical damage, making it the
    inferior choice.
plausible_alternative_directions:
- label: Resale value impact
  description: Cosmetic condition affects future resale price regardless of functional
    performance, so Body A's scratches may matter for a buyer who plans to upgrade.
- label: Model-specific fault history
  description: This camera model may have known failure modes (e.g. shutter mechanism,
    sensor corrosion) that should be investigated before purchase regardless of listed
    condition.
- label: Seller reliability
  description: The willingness of each seller to allow pre-purchase testing and the
    terms of any return window differ and could affect the purchase risk.
