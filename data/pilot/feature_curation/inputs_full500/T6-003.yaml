variants:
  HL:
    distractor: Whenever my printer has acted up before, it was low ink, so I am tempted
      to order cartridges and ignore the horrible grinding noise.
    diagnosticity: low
    salience: high
    proposition: The user's previous printer problems were generally caused by low
      ink.
    salience_source: availability cue, familiar household fix, vivid sound
    why_plausible: Low ink is a common and familiar printer explanation.
    why_irrelevant: Grinding is mechanical evidence; ink level does not explain worsening
      mechanical noise.
  LL:
    distractor: Past printer issues for the user were generally attributed to low
      ink.
    diagnosticity: low
    salience: low
    proposition: The user's previous printer problems were generally caused by low
      ink.
    matched_to: HL
  HH:
    distractor: The printer makes a harsh grinding noise on every job, and it gets
      louder as the paper moves through.
    diagnosticity: high
    salience: high
    proposition: The printer makes a loud grinding sound that grows louder as the
      job progresses.
    salience_source: mechanical noise pattern
  LH:
    distractor: Printing is accompanied by a progressive grinding noise during each
      job.
    diagnosticity: high
    salience: low
    proposition: The printer makes a loud grinding sound that grows louder as the
      job progresses.
    matched_to: HH
distractor_direction:
  label: Low ink or toner
  description: Investigating whether depleted ink or toner explains the gaps in printed
    pages.
plausible_alternative_directions:
- label: Clogged printhead
  description: Dried ink or a blocked nozzle may create vertical gaps in output.
- label: Paper-feed alignment
  description: The paper path or alignment may be causing repeated print gaps.
- label: Driver setting issue
  description: Print quality or media settings may be configured incorrectly.
