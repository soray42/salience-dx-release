seed_id: T6-003
template: T6
domain: technical_troubleshooting
complexity: low
xbase: My printer's output has become unreliable during every print job. The pages
  have long vertical gaps where ink or toner does not appear. I have not changed cartridges
  recently. {DS}
focal_diagnostic_feature: The printer makes a loud grinding sound that grows louder
  as the job progresses.
low_diagnostic_proposition: The user's previous printer problems were generally caused
  by low ink.
oracle_action: ASK
oracle_focus: 'Treat this as likely mechanical: inspect the paper path, carriage rail,
  rollers/gears, and obstruction before replacing ink.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to low ink from memory. Ask whether there
  are mechanical noises, jams, or progressive movement symptoms.
