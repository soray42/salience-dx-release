seed_id: T6-009
template: T6
domain: technical_troubleshooting
complexity: low
xbase: My wireless mouse has started lagging and skipping during use over the past
  few days. The cursor stutters and clicks sometimes do not register. {DS}
focal_diagnostic_feature: The mouse battery indicator shows one bar remaining.
low_diagnostic_proposition: The user's previous mouse problems were generally caused
  by dirt on the optical sensor.
oracle_action: ANSWER
oracle_focus: Replace or recharge the battery before taking the mouse apart.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to sensor-cleaning from memory. Ask for
  battery level first.
