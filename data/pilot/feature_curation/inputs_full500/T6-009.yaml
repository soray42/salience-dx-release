variants:
  HL:
    distractor: Every mouse problem I've had before was dust under the optical sensor,
      so I'm already looking for a tiny screwdriver to take this one apart.
    diagnosticity: low
    salience: high
    proposition: The user's previous mouse problems were generally caused by dirt
      on the optical sensor.
    salience_source: familiar past fix, active disassembly impulse, vivid wording
    why_plausible: Sensor dirt is a common and memorable mouse issue.
    why_irrelevant: A one-bar battery directly explains wireless stutter and dropped
      clicks better than an old sensor story.
  LL:
    distractor: Previous mouse issues for the user were generally attributed to optical
      sensor cleanliness.
    diagnosticity: low
    salience: low
    proposition: The user's previous mouse problems were generally caused by dirt
      on the optical sensor.
    matched_to: HL
  HH:
    distractor: The battery indicator is down to one lonely bar, and the skipping/click
      drops started as it reached that level.
    diagnosticity: high
    salience: high
    proposition: The mouse battery indicator shows one bar remaining.
    salience_source: battery-level indicator
  LH:
    distractor: The mouse battery indicator reads one bar remaining.
    diagnosticity: high
    salience: low
    proposition: The mouse battery indicator shows one bar remaining.
    matched_to: HH
distractor_direction:
  label: Dirty optical sensor
  description: Investigating whether dust or debris on the optical sensor is causing
    mouse lag and skipped movement.
plausible_alternative_directions:
- label: Wireless interference
  description: Other wireless devices or USB placement may be interfering with the
    mouse signal.
- label: Surface tracking problem
  description: The desk or mousepad surface may not track reliably with this optical
    sensor.
- label: USB receiver fault
  description: The receiver or port may be loose or failing.
