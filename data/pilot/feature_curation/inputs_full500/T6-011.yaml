distractor_direction:
  label: home router restart fixes it
  description: 'The user''s personal history of resolving robotic video-call audio
    by restarting the home router suggests the current episode is also caused by router
    state or home network congestion.

    '
plausible_alternative_directions:
- label: CPU thermal throttling
  description: 'The laptop CPU accumulates heat during the day and by evening throttles
    its clock speed, degrading the audio codec''s real-time processing and producing
    robotic distortion in local audio capture.

    '
- label: audio driver or software fault
  description: 'A driver bug, a recently changed audio configuration, or a conflicting
    background audio process causes the microphone input pipeline to malfunction,
    with symptoms appearing only after extended system uptime.

    '
- label: power management profile change
  description: 'An automatic switch to a battery-saver or low-power profile in the
    evening reduces CPU and audio-subsystem priority, causing the audio capture pipeline
    to drop samples and produce robotic artefacts.

    '
