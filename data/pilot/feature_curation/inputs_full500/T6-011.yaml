xbase: Every single evening around 8 PM my video calls turn robotic to the other participants
  — my voice cuts out and sounds heavily processed. During the day everything is fine.
  I have rebooted the laptop and quit background apps with no effect. {DS}
focal_diagnostic_feature: 'An offline voice recording captured locally on the same
  laptop at the same hour also sounds robotic, establishing that the distortion exists
  in local audio capture or processing before any data reaches the network.

  '
low_diagnostic_proposition: 'The user''s home router has in the past caused robotic
  video-call audio that was resolved by restarting it.

  '
oracle_action: ANSWER
oracle_focus: 'Investigate local audio processing as the source: check for CPU thermal
  throttling in the evenings (sustained load raising core temperature and triggering
  clock-speed reduction), an audio driver fault or power-management profile change
  that degrades microphone processing, or a hardware issue with the microphone or
  audio interface that worsens under extended use — all of which can cause distortion
  irrespective of network state.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Acknowledge the past router-restart experience but do
  not adopt it as the current explanation; note that it does not account for the offline
  recording evidence already in the scenario; ask diagnostic questions to locate whether
  the distortion is in local audio capture (offline test, alternative microphone)
  or elsewhere.

  '
