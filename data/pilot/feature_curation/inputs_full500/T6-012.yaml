distractor_direction:
  label: TV software state recurrence
  description: 'The hypothesis that the TV''s internal software or app state has degraded
    again, as it did in the past, and a factory reset will clear it — the same fix
    that worked before will work now.

    '
plausible_alternative_directions:
- label: ISP peak-hour throttling
  description: 'The ISP reduces available bandwidth during evening peak-use windows,
    causing buffering regardless of local device or TV state.

    '
- label: Wi-Fi signal degradation
  description: 'The TV''s Wi-Fi connection has weakened due to interference or distance,
    causing insufficient throughput to the streaming app specifically during high-demand
    periods.

    '
- label: TV firmware or app outdated
  description: 'The streaming app or TV OS has a known bug in the current version
    that causes playback stalls, fixable with an update rather than a full factory
    reset.

    '
