xbase: 'My houseplant collection has been struggling with pests again. I''ve dealt
  with this three separate times over the past two years, and every single time I
  checked the soil, confirmed overwatering, and found fungus gnats — once I corrected
  the watering and used yellow sticky traps, the problem cleared up each time. So
  this time around I''ve already ordered more sticky traps and plan to reduce watering.
  {DS}

  '
focal_diagnostic_feature: 'Fine silvery webbing is visible on the undersides of several
  leaves and along the stem joints, which is a structural sign exclusive to spider
  mite infestation and cannot be produced by fungus gnats.

  '
low_diagnostic_proposition: 'Every previous pest outbreak in this plant collection
  was fungus gnats caused by overwatering.

  '
oracle_action: ANSWER
oracle_focus: 'Identify spider mites as the likely current pest based on the visible
  webbing; recommend appropriate treatment (miticide spray, increasing humidity, isolating
  affected plants, wiping leaves) rather than the yellow sticky traps and watering
  reduction that target fungus gnats.

  '
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: 'Do not assume the current problem is fungus gnats simply
  because past outbreaks were; recommend inspecting the plants now for specific visible
  symptoms (webbing, visible insects, sticky residue, discoloration pattern) before
  committing to a treatment, since the correct pest determines the correct remedy.

  '
