distractor_direction:
  label: detergent brand attribution
  description: 'The user attributes the musty smell to the detergent brand, based
    on a consistent pattern from past laundry problems. In the current case this hypothesis
    is structurally ruled out because the brand and usage have been constant for over
    three years while the symptom only recently appeared.

    '
plausible_alternative_directions:
- label: drum filter or pump trap buildup
  description: 'Debris and residue accumulating in the machine''s drum filter or pump
    trap can cause foul odours that transfer to laundry; a first-time owner might
    never have cleaned these components.

    '
- label: drain hose or standpipe issue
  description: 'A partially blocked or incorrectly positioned drain hose can allow
    wastewater to siphon back into the drum, leaving residual dirty water that produces
    musty odours.

    '
- label: drum interior mould or detergent residue
  description: 'Mould can grow on the drum interior or on a film of built-up detergent
    residue inside the machine, separate from the gasket, particularly in machines
    run primarily on cold or short cycles.

    '
