xbase: I'm buying a new laptop and the shop is pushing a three-year extended warranty
  for a meaningful chunk of the price. I keep hesitating at the counter because I
  have a strong feeling I will regret skipping it. There is no specific fault I am
  worried about; it is more a gut sense that something always goes wrong once the
  basic cover runs out. {DS}
focal_diagnostic_feature: This laptop's brand and model rank at the top of independent
  reliability surveys, the card paying for it automatically doubles the manufacturer
  warranty for free, and the extended plan costs about 25% of the laptop with a high
  per-claim deductible.
low_diagnostic_proposition: Every laptop the user has owned failed soon after its
  standard warranty ended, so this one probably will too.
oracle_action: ANSWER
oracle_focus: Skip the extended warranty; this model is highly reliable, the paying
  card already doubles the manufacturer cover for free, and the plan's ~25% cost with
  a high deductible makes it poor value.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not buy on the strength of past laptops failing. Ask
  about this model's reliability, any warranty the card adds, and the plan's cost
  and deductible.
