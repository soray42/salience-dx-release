seed_id: T6-018
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: One endpoint in our service returns 504 Gateway Timeout, but only the bulk
  CSV export — every other endpoint is fine. It is not constant; it fails on the larger
  exports and succeeds on small ones. We have not changed the export code recently,
  and the application logs show the handler still running, not erroring, when the
  504 comes back to the client. A query-level trace shows every individual database
  query the export runs completes in well under a second, even on the largest datasets.
  {DS}
focal_diagnostic_feature: The 504 fires at exactly 60 seconds, matching the load balancer's
  idle timeout, while the large export legitimately needs about 75 seconds end to
  end.
low_diagnostic_proposition: Every past 504 the user has dealt with came from a slow
  database query, so this one is probably a slow query too.
oracle_action: ANSWER
oracle_focus: Raise the load balancer's idle/response timeout for this endpoint (or
  paginate the export); the 504 fires at the LB's 60-second cutoff while a valid ~75-second
  export is still running.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a slow query from past 504s. Ask at what
  elapsed time the 504 fires and whether it matches a proxy or load-balancer timeout.
