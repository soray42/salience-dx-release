seed_id: T6-020
template: T6
domain: technical_troubleshooting
complexity: high
xbase: Our API's p99 latency has been spiking badly several times a day for the past
  week, and my first move is to roll back our most recent deploy. The spikes are brief
  but severe, then latency returns to normal on its own. Traffic is flat during the
  spikes and error rates stay low. We ship multiple deploys a day, but checking the
  spike times against our deploy log, several spikes landed in hours when we shipped
  nothing at all, so they are not tied to any deploy. {DS}
focal_diagnostic_feature: The spikes occur at exactly the top of every hour regardless
  of deploy timing — including hours with no deploy at all — and align precisely with
  an hourly materialized-view refresh that takes a heavy lock and saturates database
  IOPS.
low_diagnostic_proposition: Every latency regression the user has handled before was
  caused by a bad deploy, so this one is probably a bad deploy too.
oracle_action: ANSWER
oracle_focus: Do not roll back; the spikes hit exactly on the hour independent of
  deploys and match an hourly materialized-view refresh that locks and saturates DB
  IOPS, so reschedule, incrementalise, or throttle that job.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a bad deploy from past regressions. Ask
  whether the spikes line up with deploy times or instead recur on a fixed schedule
  independent of deploys.
