xbase: My bathroom sink is draining slowly and I'm about to grab the drain snake and
  clear it myself like I always do. It is not fully blocked yet, just sluggish. The
  house is older but I have not had plumbing trouble here before. I would rather not
  pay for a plumber over something I can handle in ten minutes at the weekend. {DS}
focal_diagnostic_feature: Water backs up out of the toilet and the bathtub at the
  same time the sink is used, and gurgling comes from multiple fixtures — signs the
  blockage is in the shared main sewer line, not a single fixture's trap.
low_diagnostic_proposition: Every drain clog the user has cleared before was a simple
  hair or debris clog in the trap, so this one is probably the same.
oracle_action: ANSWER
oracle_focus: Call a professional for the main line; backups and gurgling across the
  toilet, tub, and sink together point to a shared sewer-line blockage that a fixture
  drain snake cannot reach, not a local trap clog.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a simple trap clog from past experience.
  Ask whether other fixtures back up or gurgle when this drain is used.
