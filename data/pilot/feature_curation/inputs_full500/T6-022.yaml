seed_id: T6-022
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: Since our latest Android release, some users report the app crashing instantly
  on launch, and my first thought is to have them clear the app cache and reinstall.
  Most users are completely fine and never see it. The crash happens right at startup
  before any screen appears. I already had a few affected users clear all app data
  and reinstall, and the app still crashes for them on the very next launch. {DS}
focal_diagnostic_feature: Every crash report comes from devices on older Android versions,
  and the stack trace is a NoSuchMethodError for a platform API that only exists on
  newer OS versions, called unconditionally during startup.
low_diagnostic_proposition: Every launch crash the user has fixed before came from
  a corrupted local cache, so this one is probably a cache problem too.
oracle_action: ANSWER
oracle_focus: Guard the newer-OS platform API behind a version check or raise minSdk;
  the crashes are a NoSuchMethodError on older Android versions for an API that does
  not exist there, not a corrupted cache.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a cache problem from past crashes. Ask
  what the stack trace says and whether the affected devices share an OS version.
