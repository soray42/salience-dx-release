distractor_direction:
  label: Corrupted local cache
  description: Treating the launch crash as corrupted local app data, fixed by clearing
    cache and reinstalling.
plausible_alternative_directions:
- label: Migration on stored data
  description: Whether a failed data/schema migration of existing user data crashes
    startup.
- label: Bad release artifact
  description: Whether a corrupt or mis-signed build is reaching a subset of users.
