causal_audit:
  steelman: 'Bank account transitions involve operational risk regardless of institution:
    IT systems

    may create a brief transition state during downgrade processing, some banks issue
    a

    new account number even for tier changes, and direct-deposit routing can temporarily

    fail if the bank''s internal account migration runs mid-cycle. A user who has
    been

    burned by transfer disruptions before is applying genuine domain knowledge about

    bank operational processes. The past cause (transfer disruption during bank switch)

    is structurally adjacent to the present case, and the exact process for this specific

    bank is unknown from xbase alone. However, the focal feature establishes that
    this

    particular bank preserves account numbers on downgrade, which eliminates the disruption

    mechanism entirely. The distractor relies on a structurally different operation

    (cross-institution switch) not applicable here.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — xbase does not disclose whether the downgrade is
    intra-bank or cross-bank; that structural distinction is the focal content in
    HH/LH and must not appear in xbase to preserve C4.
