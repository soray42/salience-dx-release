seed_id: T6-023
template: T6
domain: open_qa
complexity: medium
xbase: I'm deciding whether to downgrade my premium bank account to the free basic
  tier. The premium account costs $25 a month and I have held it for about two years.
  Both tiers provide the same core banking functions I rely on for direct deposits
  and regular bill payments. {DS}
focal_diagnostic_feature: Both the premium and free tiers are products of the same
  bank, so the account number, routing number, and all linked payment arrangements
  carry over unchanged on downgrade; the user has not used any premium-exclusive feature
  in two years.
low_diagnostic_proposition: Past bank account switches by this user caused transfer
  disruptions and returned-payment fees, suggesting a similar disruption might happen
  now.
oracle_action: ANSWER
oracle_focus: Downgrade to the free tier; the account number and payment links are
  unchanged by an intra-bank tier change, and the user has paid $600 for premium features
  they have never used.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply past bank-switching friction to an intra-bank
  tier downgrade. Ask whether the downgrade keeps the same account number and whether
  any premium features are actually used before deciding.
