variants:
  HL:
    distractor: Every bank switch I have made before left direct deposits in limbo
      mid-month and hit me with returned-payment fees, so I expect the same disruption
      if I move away from this account and keep dragging my feet on making the change.
    diagnosticity: low
    salience: high
    proposition: Past bank account switches by this user caused transfer disruptions
      and returned-payment fees, suggesting a similar disruption might happen now.
    salience_source: B/C — vivid first-person narrative of a concrete past harm (deposits
      in limbo, returned-payment fees) with a confident forward inference ('I expect
      the same disruption').
    why_plausible: Bank account transitions do carry real coordination risk; a user
      burned before by mid-month transfer failures has genuine reason for caution
      that a busy reader would respect.
    why_irrelevant: A tier downgrade within the same bank preserves the account number
      and routing number; direct deposits and bill-payment links are unaffected because
      no new account is opened. The past disruptions occurred when switching between
      different institutions, a structurally distinct operation.
