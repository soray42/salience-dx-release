distractor_direction:
  label: bank-switch transfer disruption
  description: Treating the risk of direct-deposit limbo and returned-payment fees
    from past bank switches as a reason to avoid the downgrade.
plausible_alternative_directions:
- label: premium feature value reassessment
  description: The premium account's travel insurance, lounge access, or concierge
    line may become relevant soon — for example, if the user has upcoming travel —
    making retention worthwhile.
- label: promotional retention offer
  description: Contacting the bank before downgrading may yield a fee waiver or reduced-rate
    retention offer that changes the cost-benefit calculation.
- label: free-tier hidden restriction
  description: The free tier may have transaction limits, withdrawal fees, or reduced
    overdraft protection that the user relies on without realising.
