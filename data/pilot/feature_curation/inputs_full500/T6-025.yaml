      register.
    confident_assertion: '''I worry the same thing will happen here'' — unhedged forward
      projection.'
    concrete_detail: Gym, meal-kit, language-app are setting details about past subscriptions
      that are not claims about this app's usage; the four-month abandonment timeline
      is about the distractor pattern, not a new case claim.
