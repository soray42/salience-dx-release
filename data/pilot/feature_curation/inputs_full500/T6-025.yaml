variants:
  HL:
    distractor: Every annual subscription I have committed to before — a gym membership,
      a meal-kit service, a language learning app — I abandoned within four months
      and felt trapped paying for something I no longer opened, so I worry the same
      thing will happen here if I pay upfront.
    diagnosticity: low
    salience: high
    proposition: Past annual subscriptions by this user were abandoned before the
      year ended, suggesting the same early-cancellation pattern may repeat here.
    salience_source: B/C — three specific named examples of past sunk costs in a reflective
      first-person voice, with a concrete abandonment timeline ('four months') and
      a confident forward worry ('I worry the same thing will happen here').
    why_plausible: Paying a year upfront for something unused is a real and common
      loss; three concrete past examples make the pattern feel empirically grounded
      and a busy adviser would take the concern seriously.
    why_irrelevant: The three past subscriptions are fitness, food, and language services,
      all of which carry high habitual-change risk. The project management tool is
      already embedded in daily professional workflow; the prior abandonment pattern
      is structurally irrelevant because the nature of the tool and the demonstrated
      usage differ fundamentally.
  LL:
    distractor: Past annual subscriptions by this user were abandoned before the year
      ended, suggesting the same early-cancellation pattern may repeat here.
    diagnosticity: low
    salience: low
    proposition: Past annual subscriptions by this user were abandoned before the
      year ended, suggesting the same early-cancellation pattern may repeat here.
    matched_to: HL
  HH:
    distractor: My in-app activity log shows I opened this app on every working day
      for the past eleven months, averaging 3.5 hours of active use each day, with
      not a single week where I skipped it entirely.
    diagnosticity: high
    salience: high
    proposition: The user's in-app activity log shows they opened the app every working
      day for the past 11 consecutive months, averaging 3.5 hours of active use per
      day, with no week where the app was skipped.
    salience_source: B/C — first-person account-log data with three precise metrics
      (daily opens, 3.5-hour average, zero missed weeks) over an 11-month window,
      presented as direct evidence rather than recall.
  LH:
    distractor: Activity logs show daily use every working day for 11 months, averaging
      3.5 hours per day with no weeks missed.
    diagnosticity: high
    salience: low
    proposition: The user's in-app activity log shows they opened the app every working
      day for the past 11 consecutive months, averaging 3.5 hours of active use per
      day, with no week where the app was skipped.
    matched_to: HH
distractor_direction:
  label: habitual abandonment of annual plans
  description: Treating the user's history of abandoning earlier annual subscriptions
    before renewal as evidence that paying annually for this tool is also likely to
    result in waste.
plausible_alternative_directions:
- label: provider longevity and lock-in risk
  description: Paying a full year upfront creates an exposure if the provider raises
    prices, changes terms, or discontinues the product within the annual period.
- label: workflow change or tool replacement
  description: A planned team or technology change in the next year might make the
    user switch tools regardless of usage, making annual commitment premature.
- label: cashflow and upfront cost
  description: Even if the annual plan is cheaper overall, the upfront lump payment
    may strain current monthly cashflow in a way the monthly plan does not.
