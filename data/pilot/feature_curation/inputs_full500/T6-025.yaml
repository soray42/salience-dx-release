  hh_atomic_claims:
  - The in-app activity log shows the app was opened every working day for 11 consecutive
    months.
  - Average active use is 3.5 hours per day.
  - There is no week in the 11-month period where the app was skipped.
  hl_salience_dimensions:
    source_credibility: N/A
    narrative_coherence: Three named subscription examples with a concrete timeline
