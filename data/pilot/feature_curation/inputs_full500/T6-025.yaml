  notes: 'T6 availability inference check: HL includes ''I worry the same thing will
    happen here

    if I pay upfront.'' LL includes ''suggesting the same early-cancellation pattern
    may

    repeat here.'' Both carry the application-to-present inference per C1. The forward

    worry (HL) vs hedged suggestion (LL) is a salience dimension C difference only.

    HH/LH diff: LH covers all three HH claims (daily opens for 11 months, 3.5-hour

    average, no missed weeks) at lower resolution. Clean.

    '
causal_audit:
  steelman: 'Habitual subscription abandonment is a well-documented behavioural pattern.
    A user who

    has abandoned three consecutive annual subscriptions across different categories

    may have a lifestyle tendency toward high initial enthusiasm followed by declining

    engagement, regardless of subscription type. Project management needs can also
    shift:

    if the user changes jobs, goes freelance, or joins a team using a different tool,
    the

    app becomes redundant despite prior heavy use. A practitioner applying behavioural

    finance thinking would take three concrete data points seriously. However, the
    focal

    evidence presents 11 months of logged daily use at 3.5 hours per day — this is
    not

    recall but measurable in-app telemetry. The three past subscriptions (gym, meal
    kit,

    language app) are lifestyle services with consumption patterns that do not transfer

    to a daily professional workflow tool. The usage profile is structurally different,

    and the 11-month empirical record directly contradicts the abandonment hypothesis

    for this specific app.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — xbase does not disclose usage history; that is the
    focal content in HH/LH. The xbase neutrally establishes the decision context without
    foreclosing the distractor.
