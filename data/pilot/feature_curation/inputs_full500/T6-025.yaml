seed_id: T6-025
template: T6
domain: open_qa
complexity: low
xbase: I'm deciding whether to pay for my project management app annually or continue
  on the month-to-month plan. The annual option is 35% cheaper per month if paid upfront.
  The provider has been operating for eight years with no signs of instability and
  the tool covers all the features I need. {DS}
focal_diagnostic_feature: The user's in-app activity log shows they opened the app
  every working day for the past 11 consecutive months, averaging 3.5 hours of active
  use per day, with no week where the app was skipped.
low_diagnostic_proposition: Past annual subscriptions by this user were abandoned
  before the year ended, suggesting the same early-cancellation pattern may repeat
  here.
oracle_action: ANSWER
oracle_focus: Pay annually; eleven months of unbroken daily heavy use with no missed
  weeks makes early abandonment implausible, and the 35% saving is material.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not generalise from past subscriptions of different
  types to this tool. Ask for actual usage history for this app before assuming the
  abandonment pattern applies.
