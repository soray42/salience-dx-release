seed_id: T6-026
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: My integration with a third-party REST API has been failing since yesterday
  afternoon. The service has been stable for the past eight months and I have not
  changed my authentication credentials or modified the client code recently. The
  API calls work fine in short manual tests but fail under normal load. {DS}
focal_diagnostic_feature: Failed responses carry HTTP 429 Too Many Requests with X-RateLimit-Remaining
  at zero and a Retry-After header; the client sends requests in tight bursts with
  no backoff or retry delay.
low_diagnostic_proposition: Past API integration failures for the user were generally
  attributed to expired or rotated access tokens, so the same cause probably applies
  now.
oracle_action: ANSWER
oracle_focus: Implement exponential backoff and honour the Retry-After header in the
  client; the API is rate-limiting burst requests and the fix requires client-side
  request pacing, not credential rotation.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the expired-token explanation based on past
  experience alone. Ask for the actual HTTP status codes and response headers from
  the failing requests before diagnosing the cause.
