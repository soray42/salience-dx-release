causal_audit:
  steelman: 'A senior API engineer might argue: some OAuth implementations silently
    refresh tokens on short

    test sequences but fail when a burst of requests exhausts concurrent session slots,
    returning

    a 429-like status from an internal session-limit guard rather than the standard
    rate limiter.

    Token rotation could also trigger a brief authentication-state inconsistency that
    manifests only

    under load. Therefore expired or rotated tokens cannot be fully excluded from
    the hypothesis set.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: '"I have not changed my authentication credentials" combined
    with "work fine in short manual tests" establishes that tokens are currently valid
    and accepted; this closes the expired-token pathway without naming the actual
    cause (rate limiting).'
