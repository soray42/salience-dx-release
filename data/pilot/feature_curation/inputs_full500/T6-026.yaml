variants:
  HL:
    distractor: Every API integration failure I have dealt with before eventually
      traced back to an expired or rotated access token, so I am already pulling up
      the credential management console even though the manual tests pass fine.
    diagnosticity: low
    salience: high
    proposition: Past API integration failures for the user were generally attributed
      to expired or rotated access tokens, so the same cause probably applies now.
    salience_source: B (vivid personal history — "every ... before eventually traced
      back"), C (confident first-instinct framing — "I am already pulling up the credential
      management console")
    why_plausible: Token expiry is a genuinely common cause of REST API failures,
      and a developer who has debugged this pattern repeatedly will default to it;
      the framing sounds like domain expertise rather than a guess.
    why_irrelevant: Manual tests pass, which means the token is valid and accepted;
      expired or rotated tokens produce 401 Unauthorized, not load-dependent 429 responses,
      so the past token-expiry pattern is structurally inapplicable to this case.
