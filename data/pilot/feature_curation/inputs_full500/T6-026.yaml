distractor_direction:
  label: Expired or rotated access token
  description: Investigating whether the integration is failing because an API access
    token has expired or been rotated, based on the user's pattern of past API failures
    having that cause.
plausible_alternative_directions:
- label: API endpoint deprecation
  description: The third-party API may have deprecated or version-gated the specific
    endpoint being called, causing failures that appear intermittently during transition.
- label: TLS certificate or hostname change
  description: The upstream service may have rotated its TLS certificate or changed
    the hostname, causing connection failures that manifest only under certain load
    conditions.
- label: Client-side connection pool exhaustion
  description: The HTTP client may be exhausting its connection pool under load, queuing
    requests until they time out rather than receiving explicit error responses.
