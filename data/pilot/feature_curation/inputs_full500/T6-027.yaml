distractor_direction:
  label: Cancellation regret pattern
  description: Treating the user's consistent past experience of regretting subscription
    cancellations as evidence that cancelling this meal-kit service will follow the
    same pattern.
plausible_alternative_directions:
- label: Subscription pause or reduce option
  description: The service might allow the user to pause deliveries or switch to a
    lower frequency, reducing cost without requiring full cancellation.
- label: Meal planning habit change
  description: The user's low kit usage might reflect a temporary change in schedule
    or cooking habits that could reverse, making cancellation premature.
- label: Comparative grocery cost analysis
  description: The meal-kit cost per serving may still compare favourably to equivalent
    convenience alternatives, making the subscription worth keeping at a lower frequency.
