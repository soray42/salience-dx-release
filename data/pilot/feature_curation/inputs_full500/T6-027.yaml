causal_audit:
  steelman: 'A behavioural economist would argue that cancellation regret is a well-documented
    pattern even

    for underused services: the user may value the option of having the service available
    (option

    value) even when they rarely use it, and this psychological value is not visible
    in usage data.

    Therefore the past cancellation regret pattern could genuinely predict future
    regret for this

    service even with low utilisation, making the availability inference partially
    applicable.

    '
