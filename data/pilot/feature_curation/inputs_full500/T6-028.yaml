distractor_direction:
  label: Firewall blocking inbound port
  description: Investigating whether a firewall or security group rule is blocking
    the inbound port used by the webhook receiver, based on the user's consistent
    past experience of webhook failures having that cause.
plausible_alternative_directions:
- label: Webhook payload schema mismatch
  description: The payment processor may have changed its event payload structure,
    causing the application's deserialization step to fail silently before any business
    logic runs.
- label: Event idempotency key collision
  description: The receiver may be discarding events as duplicates if the idempotency
    or deduplication layer is malfunctioning, returning 200 without processing.
- label: Silent exception in event handler
  description: An unhandled exception in the event-processing logic may be swallowed
    by a bare except block, causing events to be acknowledged but never acted upon.
