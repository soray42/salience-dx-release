      key rotation — all concrete and verifiable)
  LH:
    distractor: HMAC verification fails on every event because WEBHOOK_SECRET holds
      the pre-rotation signing key; the receiver silently discards unverified events
      instead of returning 4xx.
    diagnosticity: high
    salience: low
    proposition: Debug logs show HMAC signature verification fails on every incoming
      event; the application is configured to silently discard events that fail verification
      rather than return 4xx; and the WEBHOOK_SECRET environment variable still holds
      the pre-rotation value from before the payment processor rotated its signing
