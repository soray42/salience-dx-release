seed_id: T6-028
template: T6
domain: technical_troubleshooting
complexity: high
xbase: Our webhook receiver has been silently dropping incoming events from our payment
  processor for three days. The processor reports HTTP 200 responses from our endpoint,
  so it considers delivery successful. Our application has not processed a single
  event in that window, and nothing in the deployment history touches the webhook
  handler. {DS}
focal_diagnostic_feature: Debug logs show HMAC signature verification fails on every
  incoming event; the application is configured to silently discard events that fail
  verification rather than return 4xx; and the WEBHOOK_SECRET environment variable
  still holds the pre-rotation value from before the payment processor rotated its
  signing key three days ago.
low_diagnostic_proposition: Previous webhook delivery failures were caused by firewall
  rules blocking the inbound port, so this is probably another network access issue.
oracle_action: ANSWER
oracle_focus: Update WEBHOOK_SECRET to the current signing key; add a non-silent failure
  path (return 400 or alert) for HMAC verification failures so future key rotations
  are immediately observable rather than silently dropped.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply the firewall-block explanation from past
  experience. The 200 responses confirm the inbound port is reachable; ask for application-level
  logs around event processing and HMAC verification before diagnosing a network cause.
