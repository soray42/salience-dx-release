seed_id: T6-029
template: T6
domain: open_qa
complexity: low
xbase: I have a competing offer that pays 18 percent more than my current role. My
  performance reviews have been strong and I like my team. I am wondering whether
  to use the competing offer to negotiate a raise rather than accepting it outright.
  {DS}
focal_diagnostic_feature: The current employer has a published no-counter-offer policy
  and has announced a headcount budget freeze through the end of Q2.
low_diagnostic_proposition: Every time the user has used a competing offer as leverage
  before, the current employer matched it, so the same outcome is expected now.
oracle_action: ANSWER
oracle_focus: Do not use the offer purely as leverage; the current employer's no-counter-offer
  policy and active budget freeze mean a counter is structurally unavailable, so the
  user should evaluate the competing offer on its own merits and decide whether to
  accept or decline it.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume this employer will respond as past employers
  did. Ask whether the current employer has counter-offer policies, budget constraints,
  or a history of matching competing offers before treating the negotiation as a reliable
  strategy.
cell_oracles:
  HL:
    action: ASK
    focus: Do not assume this employer will respond as past employers did. Ask whether
      the current employer has counter-offer policies, budget constraints, or a history
      of matching competing offers before treating the negotiation as a reliable strategy.
  LL:
    action: ASK
    focus: Do not assume this employer will respond as past employers did. Ask whether
