  HH:
    action: ANSWER
    focus: Do not use the offer purely as leverage; the current employer's no-counter-offer
      policy and active budget freeze mean a counter is structurally unavailable,
      so the user should evaluate the competing offer on its own merits and decide
      whether to accept or decline it.
  LH:
    action: ANSWER
    focus: Do not use the offer purely as leverage; the current employer's no-counter-offer
      policy and active budget freeze mean a counter is structurally unavailable,
      so the user should evaluate the competing offer on its own merits and decide
      whether to accept or decline it.
variants:
  HL:
    distractor: Every time I have used a competing offer as leverage at a previous
      employer, my manager matched it within a week; the pattern is so reliable that
      I mentally treat it as a guaranteed negotiation step.
    diagnosticity: low
    salience: high
    proposition: Every time the user has used a competing offer as leverage before,
      the current employer matched it, so the same outcome is expected now.
    salience_source: B/C — confident first-person recollection framed as a pattern
      so reliable it functions as a rule, with 'mentally treat it as guaranteed' driving
      strong first-instinct pull.
    why_plausible: Competing offers that have worked repeatedly do form a real prior,
      and users understandably extrapolate from their own negotiation history when
      facing the same tactical choice.
    why_irrelevant: Past employers who matched competing offers were different organisations
      with different policies and budgets; whether this specific employer can or will
      counter depends on its own policy and current budget constraints, which are
      structurally different from any past employer.
  LL:
    distractor: Every time the user has used a competing offer as leverage before,
      the employer matched it, so the same outcome is expected now.
    diagnosticity: low
    salience: low
    proposition: Every time the user has used a competing offer as leverage before,
      the current employer matched it, so the same outcome is expected now.
    matched_to: HL
  HH:
    distractor: My current employer posted a company-wide policy last quarter stating
      it does not match outside offers under any circumstances, and our department
      head announced a full headcount budget freeze through the end of Q2.
    diagnosticity: high
    salience: high
    proposition: The current employer has a published no-counter-offer policy and
      has announced a headcount budget freeze through the end of Q2.
    salience_source: Two concrete, independent structural barriers — a published company-wide
      policy and a named budget freeze with a deadline — together make a counter-offer
      mechanically impossible, not merely unlikely.
  LH:
    distractor: The current employer has an explicit no-counter-offer policy and a
      headcount budget freeze through Q2.
    diagnosticity: high
    salience: low
    proposition: The current employer has a published no-counter-offer policy and
      has announced a headcount budget freeze through the end of Q2.
    matched_to: HH
distractor_direction:
  label: Past leverage pattern repeating
  description: Assuming that the current employer will match the competing offer because
    previous employers always did so when the same tactic was used.
plausible_alternative_directions:
- label: Manager discretion override
  description: Whether the user's manager has individual authority to make an exception
    to any policy given strong review history.
- label: Accepting the competing offer
  description: Whether the 18-percent raise at the new employer is attractive enough
    to justify leaving outright rather than treating it as a negotiating tool.
