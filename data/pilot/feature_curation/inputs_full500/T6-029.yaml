    the present case as required by C1 for T6. The past timing detail (''within a
    week'') in HL

    is about the prior employers'' behaviour, not the current employer, and does not
    appear in

    LL — it is source detail (describing the historical experience), not a new claim
    about this

    case. HH/LH atomic-claim diff: LH carries all three HH claims (company-wide policy,

    no-match-under-any-circumstances content, Q2 budget freeze) in condensed form.

    '
causal_audit:
  steelman: 'A user''s own negotiation history is genuine empirical evidence about
    how employers respond

    to competing offers. If the pattern has held across multiple employers, a practitioner
    might

    argue it is informative about the general population of employers, including this
    one.

    Strong performance reviews further suggest the employer would want to retain the
    user.

    However, the T6 steelman must address whether ''the past cause operates in the
    present

    case'': this employer is structurally different because it has a published no-counter-offer

    policy and an active budget freeze. Past employers who matched offers did not
    have these

    constraints. The structural differences make the past pattern inapplicable to
    this specific

    case regardless of how reliable it has been elsewhere; the focal feature exposes
    exactly

    this structural break.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — xbase does not reveal the current employer's counter-offer
    policy or budget status; those decisive facts live only in HH/LH.
