    matched_to: HH
distractor_direction:
  label: JavaScript bundle loading failure
  description: Investigating whether the React Native JavaScript bundle is failing
    to load due to a hash mismatch, OTA push error, or build artefact issue.
plausible_alternative_directions:
- label: Specific Android API level regression
  description: Whether a particular Android API level introduced a change in how React
    Native renders the initial view
  causing the blank screen on that OS version.: null
- label: Splash screen transition timing issue
  description: Whether the splash screen dismissal fires before the React Native bridge
    initialises
  leaving a white screen before the first render completes.: null
- label: Native module initialisation crash
  description: Whether a native module required by the root component throws an unhandled
    native exception before JavaScript execution begins
  bypassing crash reports.: null
