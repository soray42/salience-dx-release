variants:
  HL:
    distractor: Every time I have seen a React Native blank screen on Android before,
      the culprit was the JavaScript bundle failing to load — Metro bundle hash mismatch
      or a bad OTA push — and fixing the bundle fixed the screen, so that is where
      my mind goes first.
    diagnosticity: low
    salience: high
    proposition: Every previous blank-screen symptom in React Native that the user
      has seen was caused by a JavaScript bundle failing to load, so the same cause
      is expected now.
    salience_source: B/C — confident personal-history framing ('every time') with
      specific technical detail (Metro hash mismatch, OTA push) and an explicit current
      inference ('that is where my mind goes first') gives the availability pull maximum
      weight.
    why_plausible: JavaScript bundle failures are the most common cause of blank screens
      in React Native, and a developer who has only encountered them as the cause
      would naturally pattern-match to it; the technical specificity sounds authoritative.
    why_irrelevant: Past bundle failures produced no rendered content but would not
      be locale-specific; the current symptom is RTL-locale-exclusive and caused by
      a native layout collapse, a structurally different mechanism that the bundle
      itself is irrelevant to.
  LL:
    distractor: Every React Native blank screen I have seen before was a failing JavaScript
      bundle, so I expect the same now.
    diagnosticity: low
    salience: low
    proposition: Every previous blank-screen symptom in React Native that the user
      has seen was caused by a JavaScript bundle failing to load, so the same cause
