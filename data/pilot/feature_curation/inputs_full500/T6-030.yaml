causal_audit:
  steelman: 'JavaScript bundle failures are the single most common cause of blank
    screens in React

    Native across both Android and iOS. A developer who has consistently seen this
    pattern

    has strong empirical grounds for treating it as the leading hypothesis. Furthermore,

    the symptom description (blank screen after splash) is exactly what a bundle load
    failure

    produces. One might also argue that the clean build and no-JS-exception report
    are

    insufficient to rule out all bundle failure modes, such as a synchronous error
    caught by

    a top-level boundary that prevents rendering without surfacing as an uncaught
    exception.

    However, a JavaScript bundle failure is not locale-specific; the same bundle is
    served to

    all devices regardless of locale. The 100-percent correlation with Arabic and
    Hebrew

    locales in HH/LH is structurally incompatible with a bundle failure cause, because
    a

    bundle load issue would affect all locales equally, not exclusively RTL ones.
    This makes

    the past experience pattern inapplicable to the present case.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the bundle compiles cleanly and crash reports
    show no uncaught JS exceptions, which narrows but does not conclusively rule out
    all bundle failure modes; the locale correlation ruling it out structurally lives
    only in HH/LH.
