seed_id: T6-030
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: Our React Native Android app has been showing a blank white screen for some
  users right after the splash screen disappears. The JavaScript bundle compiles cleanly
  and is the correct version. Automated crash reports capture no uncaught JavaScript
  exceptions for the affected sessions. {DS}
focal_diagnostic_feature: Filtering session reports by device locale shows all blank-screen
  occurrences on Arabic or Hebrew devices; all other locales render normally; the
  root container has a hardcoded paddingLeft value that disables RTL layout mirroring
  and collapses the content area.
low_diagnostic_proposition: Every previous blank-screen symptom in React Native that
  the user has seen was caused by a JavaScript bundle failing to load, so the same
  cause is expected now.
oracle_action: ANSWER
oracle_focus: Remove the hardcoded paddingLeft from the root container and replace
  it with a paddingStart equivalent that supports RTL mirroring; verify the fix on
  an Arabic or Hebrew locale device; the blank screen is a layout collapse on RTL
  devices, not a bundle loading failure.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a bundle loading failure from prior experience.
  Ask for session data filtered by device locale, operating system version, or device
  model to identify whether the blank screen is isolated to a specific configuration.
