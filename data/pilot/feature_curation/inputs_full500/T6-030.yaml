    matched_to: HL
  HH:
    distractor: Filtering affected sessions by device locale shows every blank-screen
      occurrence on devices set to Arabic or Hebrew; all other locales render normally,
      and the root container has a hardcoded paddingLeft value that disables RTL layout
      mirroring and collapses the visible content area to zero height.
    diagnosticity: high
    salience: high
    proposition: Filtering session reports by device locale shows all blank-screen
      occurrences on Arabic or Hebrew devices; all other locales render normally;
      the root container has a hardcoded paddingLeft value that disables RTL layout
      mirroring and collapses the content area.
    salience_source: 100-percent locale correlation, explicit zero-height collapse
      mechanism, and named root-container property together make the RTL layout bug
      concrete, reproducible, and distinct from any bundle failure.
  LH:
    distractor: All blank-screen sessions have Arabic or Hebrew locale; other locales
      are unaffected; the root container has a hardcoded paddingLeft that collapses
      RTL layout.
    diagnosticity: high
    salience: low
    proposition: Filtering session reports by device locale shows all blank-screen
      occurrences on Arabic or Hebrew devices; all other locales render normally;
      the root container has a hardcoded paddingLeft value that disables RTL layout
