seed_id: T6-031
template: T6
domain: open_qa
complexity: medium
xbase: I am trying to decide whether to accept a counteroffer from my current employer.
  My current manager made the case strongly when I told her I was considering leaving,
  and the raise she is proposing would close most of the gap with the outside offer.
  I have been in this role for four years and have a lot of context here. {DS}
focal_diagnostic_feature: The outside offer includes a senior title the candidate
  has been promised but denied at the current employer for two consecutive review
  cycles, while the counteroffer retains the same title and no written promotion commitment.
low_diagnostic_proposition: Counteroffers from a current employer tend to be short-term
  retention moves that rarely result in lasting improvement, so it is probably the
  same situation again.
oracle_action: ANSWER
oracle_focus: 'Decline the counteroffer: the title and promotion commitment that motivated
  the job search are absent from the counteroffer, while the outside offer provides
  them; the raise alone does not resolve the underlying issue.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply a general counteroffer-skepticism pattern
  without examining this case. Ask whether the counteroffer addresses the specific
  reasons the candidate was considering leaving.
