causal_audit:
  steelman: 'The general counteroffer-skepticism pattern has strong empirical backing:
    HR

    and career research consistently documents that the majority of employees who

    accept counteroffers leave within twelve to eighteen months, because the underlying

    reasons for job-searching (culture, growth, recognition) are typically not resolved

    by a pay adjustment alone. A thoughtful observer would be right to flag this

    pattern as a real risk in many counteroffer situations.

