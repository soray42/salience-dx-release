distractor_direction:
  label: general counteroffer-skepticism pattern
  description: Applying a broad pattern — that counteroffers are short-term retention
    moves that rarely resolve underlying issues — as the primary reason to decline,
    based on the candidate's observations of other people's situations.
plausible_alternative_directions:
- label: manager relationship sustainability
  description: Examining whether the manager's strong retention push signals a genuine
    shift in how she values the candidate, or whether the relationship will become
    uncomfortable once she knows the candidate seriously considered leaving.
- label: compensation long-term trajectory
  description: Evaluating whether accepting the counteroffer raise resets the candidate's
    market leverage or creates a new compensation ceiling at the current employer.
- label: institutional knowledge cost
  description: Assessing whether four years of accumulated context creates switching
    costs and productivity dip that should factor into the timing of a move.
