    salience_source: 'B: vivid personal pattern with specific timeline detail (''eighteen
      months'', ''buys quiet for a review cycle''); C: confident first-instinct framing
      (''my gut says this is the same story'').'
    why_plausible: The general counteroffer-skepticism pattern is well-supported by
      career literature and recruiter experience; many professionals have observed
      exactly this dynamic.
    why_irrelevant: The availability inference is based on general employer behavior,
      not on whether this specific counteroffer resolves the actual reason the candidate
      was job-searching; the focal evidence shows the title and promotion commitment
      are still absent, which is structurally different from cases where the root
