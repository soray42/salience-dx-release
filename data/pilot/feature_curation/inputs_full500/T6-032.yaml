causal_audit:
  steelman: 'Low Power Mode suppressing iOS background fetch is extremely well-documented

    and is one of the first things experienced iOS engineers check: the OS explicitly

    suspends discretionary background activity when Low Power Mode is enabled, and

    a new OS version could have altered how aggressively it applies or defaults this

    mode. A developer with a track record of finding Low Power Mode as the culprit

    has genuine empirical grounds for that first instinct.

    '
