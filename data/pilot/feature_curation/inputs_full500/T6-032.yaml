domain: technical_troubleshooting
complexity: high
xbase: Our iOS app's background fetch has stopped firing completely on devices running
  the latest OS version we rolled out support for last week. The fetch was reliable
  before the update. Affected devices receive the remote config push that should trigger
  it, and the behaviour is consistent across multiple test handsets regardless of
  battery level or power mode. {DS}
focal_diagnostic_feature: The app's UIBackgroundModes entitlement array in the compiled
  entitlements no longer includes fetch; the entitlement was dropped during an Xcode
  project file migration two weeks ago and has not been present in any build since.
low_diagnostic_proposition: My previous background-fetch outages on iOS were always
  caused by Low Power Mode suppressing background activity, so this is probably the
  same thing again.
oracle_action: ANSWER
oracle_focus: Restore the fetch value inside UIBackgroundModes in the app's entitlements
  and capabilities configuration; the missing entitlement is preventing the OS from
  scheduling background fetch regardless of device state.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply the Low Power Mode explanation automatically.
  Ask for entitlements configuration, background capability settings, and whether
  the issue persists across multiple devices in different power states.
