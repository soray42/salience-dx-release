distractor_direction:
  label: past-pattern job-hop optimism
  description: Inferring that this job change will work out well because previous
    quick moves consistently led to better outcomes, and this situation feels similar.
plausible_alternative_directions:
- label: new-role career trajectory
  description: Evaluating whether the better stated growth prospects at the new company
    justify moving now, independent of any vesting consideration.
- label: notice period and transition logistics
  description: Assessing whether the user's notice-period obligations or the new employer's
    start-date flexibility create timing constraints.
- label: team and manager fit at new company
  description: Investigating whether the user has enough information about the new
    team and reporting line to judge cultural and managerial fit.
