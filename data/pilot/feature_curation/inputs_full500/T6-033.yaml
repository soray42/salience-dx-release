xbase: I have been offered a new position at a company I'm excited about, and my instinct
  is to resign within the next few weeks. My current employer has been good to me
  and I have no complaints about the team. The new role seems to offer better growth.
  {DS}
focal_diagnostic_feature: The current employer's equity vesting schedule shows a 4-year
  cliff that lands in 7 weeks, and resignation before that date forfeits the full
  $28,000 grant.
low_diagnostic_proposition: The user's past quick job changes have generally led to
  better outcomes, suggesting this move will likely work out too.
oracle_action: ANSWER
oracle_focus: Wait the 7 weeks for the equity cliff to vest, then resign or negotiate
  a delayed start date with the new employer; the $28,000 grant forfeiture is a concrete,
  recoverable cost that the past-pattern heuristic cannot weigh.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not rely on past job-hop outcomes as the decision
  rule; ask about equity vesting schedules, notice period obligations, and whether
  a delayed start can be negotiated before advising on timing.
