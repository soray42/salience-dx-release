causal_audit:
  steelman: 'Device notification permission toggles are the single most frequent cause
    of push

    notification delivery failures that a developer investigates. iOS can silently
    revoke

    or reset permission states during OS updates, app reinstallation, or low-storage

    situations. A developer with a personal history of this being the root cause would

    be acting rationally to check it first — it is fast to verify and historically

    reliable. The steelman applied to the present case: even though the user checked

    test devices, production users on different iOS versions or after a recent OS
    update

    might have had permissions reset in a way the test devices did not replicate.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: Xbase states notification permissions are enabled on all
    test devices already checked — this forecloses the device-permission mechanism
    without revealing the cause, satisfying C4's narrow-closure boundary.
