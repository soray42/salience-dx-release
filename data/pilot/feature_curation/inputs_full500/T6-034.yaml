distractor_direction:
  label: device notification permission toggle
  description: Investigating whether users have inadvertently disabled notification
    permissions for the app in iOS Settings, based on this being the user's most common
    past cause for push failures.
plausible_alternative_directions:
- label: APNs device token staleness
  description: Checking whether device tokens registered in the backend have been
    invalidated by iOS and need re-registration from active app sessions.
- label: FCM or push provider configuration change
  description: Assessing whether a backend dependency, SDK version bump, or push provider
    credential was changed alongside or before the notification stoppage.
- label: app background mode entitlement
  description: Investigating whether a recent app binary change removed or misconfigured
    the remote-notification background mode entitlement in the iOS capability settings.
