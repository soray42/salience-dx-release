seed_id: T6-034
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: Push notifications from my iOS app stopped reaching users three days ago. The
  app sends them from a Node.js backend using our usual APNs connection. Device-side
  notification permissions look enabled for all test devices I've checked. I am getting
  no error responses logged from our server. {DS}
focal_diagnostic_feature: The Apple Developer portal shows the production APNs certificate
  status as Expired as of three days ago, and the backend APNs library silently discards
  the connection on certificate rejection rather than surfacing a per-message error.
low_diagnostic_proposition: This user's previous push notification failures were caused
  by device notification permission toggles, suggesting that is likely the cause here.
oracle_action: ANSWER
oracle_focus: Renew the expired production APNs certificate, redeploy the backend
  with the new credentials, and add certificate-expiry monitoring with advance alerts
  to prevent recurrence.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to device notification permission toggles
  from past experience; device permissions are already confirmed enabled on test devices;
  ask for APNs certificate validity in the Apple Developer portal and review server-side
  connection-error logs before diagnosing further.
