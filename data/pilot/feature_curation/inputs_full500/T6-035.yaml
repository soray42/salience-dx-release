seed_id: T6-035
template: T6
domain: open_qa
complexity: medium
xbase: My washing machine vibrates violently and makes a loud rumbling during the
  spin cycle. I tried redistributing the laundry load and running a small test cycle
  with just one item, but the shaking is the same. The machine is six years old and
  the vibration started about ten days ago. {DS}
focal_diagnostic_feature: The violent vibration and rumbling occur at identical intensity
  on a completely empty drum spin, ruling out any load-balance explanation and pointing
  to a mechanical bearing failure.
low_diagnostic_proposition: Past washing-machine vibration for this user was consistently
  resolved by redistributing an unbalanced load, so that is likely the cause again.
oracle_action: ANSWER
oracle_focus: Stop using the machine and arrange a technician inspection for drum
  bearing or spider-arm failure; the symptom on an empty spin confirms the fault is
  structural, not load-related.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not rely on past unbalanced-load experience to explain
  the current symptom. Ask whether vibration occurs on an empty drum and whether there
  are any new mechanical sounds before advising load redistribution.
