distractor_direction:
  label: Unbalanced laundry load
  description: Attributing the violent spin vibration to laundry distributed unevenly
    inside the drum, which would normally be corrected by redistributing or reducing
    the load.
plausible_alternative_directions:
- label: Machine not level on floor
  description: The appliance feet have settled unevenly over time, causing resonance
    that worsens during high-speed spin independent of load.
- label: Drum spider arm fracture
  description: The spider arm connecting the drum to the shaft has cracked, which
    also produces violent vibration on an empty spin and requires drum replacement.
- label: Transit bolt left installed
  description: A transit bolt or shipping rod was inadvertently left in after a recent
    move, restricting drum movement and causing the shaking.
