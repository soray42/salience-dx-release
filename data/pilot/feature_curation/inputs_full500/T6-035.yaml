causal_audit:
  steelman: 'A senior appliance technician could argue: even redistributing the load
    or running

    a single-item cycle may not fully eliminate an imbalance if the remaining item

    shifts to one side at high spin speeds; a heavy single item can create significant

    eccentric loading. The vibration pattern the user describes could therefore still

    be a load-distribution issue, especially if they ran the single-item test at

    a lower spin speed.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states the user tried both load redistribution and
    a single-item test cycle with the same result, closing the load-imbalance pathway.
    The HH/LH empty-drum finding provides the structural exclusion.
