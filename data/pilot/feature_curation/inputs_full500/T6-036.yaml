variants:
  HL:
    distractor: Every time I have seen wrong aggregation numbers in dbt before, it
      was a fan-out join somewhere in the lineage — a one-to-many relationship quietly
      turning rows into duplicates — and my gut says that is what is happening here
      again.
    diagnosticity: low
    salience: high
    proposition: Past dbt aggregation over-counting for this user was consistently
      caused by fan-out joins in the lineage duplicating rows, so that is likely the
      cause again.
    salience_source: 'B: vivid personal pattern with a specific technical mechanism
      (fan-out join, one-to-many); C: ''every time'' — strong certainty about past
      experience applied to the present case.'
    why_plausible: Fan-out joins are among the most common causes of aggregation over-counting
      in dbt pipelines, and a consistent personal track record of identifying them
      there is a credible prior.
    why_irrelevant: The duplication is in the source staging table itself (upstream
      of any join), not in the join logic; the fan-out join mechanism cannot operate
      when the rows are already duplicated before they reach a join node.
  LL:
    distractor: The user reports that past dbt aggregation errors were consistently
      caused by fan-out joins duplicating rows.
    diagnosticity: low
    salience: low
    proposition: Past dbt aggregation over-counting for this user was consistently
      caused by fan-out joins in the lineage duplicating rows, so that is likely the
      cause again.
    matched_to: HL
  HH:
    distractor: Querying the raw staging table for the new subscription-events source
      shows each event appears an average of 2.1 times; the vendor delivers append-only
      change records and our staging model passes them through without any ROW_NUMBER
      or DISTINCT deduplication step.
    diagnosticity: high
    salience: high
    proposition: The new subscription-events staging table contains an average of
      2.1 records per event because the vendor delivers append-only change records
      and the staging model lacks a ROW_NUMBER or DISTINCT deduplication step.
    salience_source: 'B: precise numeric finding (2.1 records per event) with the
      specific mechanism named (append-only change records, missing dedup step); D:
      concrete staging-table query result.'
  LH:
    distractor: The new subscription-events staging table averages 2.1 records per
      event; the staging model applies no deduplication.
    diagnosticity: high
    salience: low
    proposition: The new subscription-events staging table contains an average of
      2.1 records per event because the vendor delivers append-only change records
      and the staging model lacks a ROW_NUMBER or DISTINCT deduplication step.
    matched_to: HH
distractor_direction:
  label: Fan-out join in lineage
  description: Investigating whether a one-to-many join relationship in the dbt model
    lineage is causing rows to multiply and inflate the revenue aggregation totals.
plausible_alternative_directions:
- label: Double-counting across source systems
  description: The new subscription-events source and an existing source overlap on
    some revenue events, leading to the same revenue being counted twice from two
    different tables.
- label: Aggregation grain mismatch
  description: The revenue aggregation model's grain definition was not updated to
    account for the new source's event structure, causing group-by keys to merge rows
    that should remain distinct.
- label: Incremental model full-refresh issue
  description: The incremental dbt model processed the new source in a full-refresh
    run that re-inserted historical records already present, inflating totals.
