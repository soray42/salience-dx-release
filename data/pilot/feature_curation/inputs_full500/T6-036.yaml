causal_audit:
  steelman: 'A senior dbt engineer could argue: a new source introduced three weeks
    before

    the problem appeared could have created a fan-out join if the new source''s

    keys match existing model join columns at an unexpected grain — particularly

    if the staging model was automatically included in a join that assumed one

    record per event. The 12% discrepancy could reflect a partial fan-out affecting

    only the subscription segment, which would look like 2.1x records per event

    when averaged across all rows but is actually a join multiplier for a subset.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states no existing dbt model logic was modified,
    which means the join graph is unchanged. The only new element is the staging model
    for the new source, making source-level duplication the first place to check rather
    than join structure.
