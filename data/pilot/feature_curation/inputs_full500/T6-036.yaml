seed_id: T6-036
template: T6
domain: technical_troubleshooting
complexity: high
xbase: Our dbt revenue aggregation model started over-counting totals last week. The
  discrepancy sits at about 12% above the source system and affects every region.
  We added a new upstream data source — third-party subscription events — three weeks
  ago. No existing dbt model logic was modified. {DS}
focal_diagnostic_feature: The new subscription-events staging table contains an average
  of 2.1 records per event because the vendor delivers append-only change records
  and the staging model lacks a ROW_NUMBER or DISTINCT deduplication step.
low_diagnostic_proposition: Past dbt aggregation over-counting for this user was consistently
  caused by fan-out joins in the lineage duplicating rows, so that is likely the cause
  again.
oracle_action: ANSWER
oracle_focus: Add a deduplication step to the subscription-events staging model —
  keep only the latest change record per event ID using ROW_NUMBER or DISTINCT ON
  — then rerun the aggregation and verify the 12% gap closes.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a fan-out join from past experience. Profile
  row counts at each node in the lineage, starting with the new source's staging table,
  to find where the duplication is introduced before reviewing join logic.
