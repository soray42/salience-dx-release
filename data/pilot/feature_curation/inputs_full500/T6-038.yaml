causal_audit:
  steelman: 'A practitioner could argue: executor slot contention can manifest as
    gradual slowdowns without complete failures if concurrency is capped just below
    the critical level, causing tasks to wait in queue rather than fail. If max_active_runs
    was recently increased by another team member, this would be worth checking. This
    is a plausible first investigation step. However, xbase states no executor version
    change and individual tasks still succeed without errors — if contention were
    causing 2-3x slowdown, we would expect queue depth metrics to reflect this and
    some SLA events to have fired. The focal evidence (XCom serialisation at 180 MB
    consuming 60% of task time) is a precise, timing-consistent explanation that slot
    contention cannot explain.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: Tasks still succeed individually and no SLA alerts have
    fired — forecloses the slot-contention pathway without naming XCom as the cause.
