seed_id: T6-038
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: Our Apache Airflow DAG that orchestrates a multi-step ML feature pipeline has
  been running two to three times slower than it used to, starting about ten days
  ago. Individual tasks still succeed and no SLA alerts have fired. We have not changed
  the Airflow executor version. {DS}
focal_diagnostic_feature: Task logs show that XCom push and pull operations now account
  for over 60% of each task's wall time, and the XCom payloads being passed between
  tasks grew from a few kilobytes to around 180 MB after a recent feature-set expansion.
low_diagnostic_proposition: The user's previous Airflow slowdowns were generally caused
  by executor resource contention from too many concurrently scheduled DAG runs.
oracle_action: ANSWER
oracle_focus: Move the large intermediate data out of XCom — use a shared object store
  or database — and pass only a reference key through XCom; the serialisation overhead
  at 180 MB per task transition is the bottleneck.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply the prior executor-contention diagnosis.
  Ask for per-task wall-time breakdowns and whether XCom payload sizes have changed
  recently.
