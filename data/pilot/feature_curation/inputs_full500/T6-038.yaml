distractor_direction:
  label: Executor slot contention
  description: Investigating whether too many concurrent DAG runs are competing for
    executor worker slots and causing the pipeline slowdown.
plausible_alternative_directions:
- label: Database metadata store saturation
  description: The Airflow metadata database may be experiencing slow queries as DAG
    run history grows
  adding overhead to task scheduling.: null
- label: Worker node resource pressure
  description: Memory or CPU pressure on Airflow worker nodes from an unrelated workload
    co-located on the same machines.
- label: Upstream data volume growth
  description: The source dataset processed by the pipeline may have grown
  causing individual computation tasks to take longer.: null
