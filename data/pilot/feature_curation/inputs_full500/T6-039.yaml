causal_audit:
  steelman: 'A practitioner could argue: some compressor failures produce intermittent
    noise before complete failure, and a fridge can continue to cool adequately in
    early failure stages. The 30-60 second episodic duration loosely fits a compressor
    cycling anomaly. Personal experience with compressor failure on a similar model
    would be a legitimate reason to check this. However, xbase explicitly states food
    is staying cold normally and the temperature display reads correctly — a compressor
    that is generating audible failure noise consistently over ten days would typically
    show some cooling degradation by this point. The focal evidence (frost-encrusted
    evaporator fan confirmed by manual rotation test) is a structurally different
    mechanism that explains both the intermittency and the preserved cooling function.

    '
