variants:
  HL:
    distractor: Every feature staleness problem I have dealt with before came down
      to cache eviction failing silently — values stuck in the in-memory layer past
      their TTL — so that is where I instinctively start looking every time this happens.
    diagnosticity: low
    salience: high
    proposition: The user's previous feature store staleness issues were generally
      caused by cache eviction failures leaving old values in memory.
    salience_source: B — clear chronological pattern of repeated past occurrences
      with a specific mechanism ('cache eviction failing silently', 'past their TTL');
      C — 'every time', 'instinctively start looking' — strong confident first-instinct
      framing.
    why_plausible: Cache eviction failures are a genuine and common source of feature
      staleness in online feature stores; the confident pattern from personal operational
      experience is highly credible.
    why_irrelevant: The staleness is non-uniform across features and tied to a specific
      feature group — a cache-layer failure would typically produce more uniform staleness
      or errors, not a group-bounded pattern; the focal evidence shows the cause is
      a schema parameter (time-travel window) not a cache mechanism.
  LL:
    distractor: Previous feature store staleness issues for this user were generally
      caused by cache eviction failures leaving old values in memory.
    diagnosticity: low
    salience: low
    proposition: The user's previous feature store staleness issues were generally
      caused by cache eviction failures leaving old values in memory.
