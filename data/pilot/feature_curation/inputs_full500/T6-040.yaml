    HL:LL = 44:17 = 2.59 ≤ 4. HH:LH = 77:30 = 2.57 ≤ 4.

    '
causal_audit:
  steelman: 'A practitioner could argue: cache eviction failures in feature stores
    are a genuine and common problem — values can get stuck in Redis or similar in-memory
    stores past their configured TTL due to maxmemory-policy misconfiguration, eviction
    race conditions, or connection pool issues. This is a high-priority hypothesis
    in any feature staleness investigation and the operational experience pattern
    is credible. However, the staleness in this case is explicitly non-uniform — some
    features refresh correctly while others lag — and the lagging ones form a specific
    group. A cache eviction failure at the layer level would affect features more
    uniformly; a group-bounded pattern points to a group-specific configuration issue
    rather than a cache mechanism. The focal evidence (time-travel window narrowed
    to 2h on a group queried with timestamps outside that window) is a structurally
    different mechanism that explains the group-bounded non-uniformity that cache
    eviction cannot.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: Non-uniform staleness with some features refreshing correctly
    forecloses a cache-layer explanation (which would be more uniform) without naming
    the time-travel window cause.
