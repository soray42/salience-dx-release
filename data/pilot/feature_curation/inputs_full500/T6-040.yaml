seed_id: T6-040
template: T6
domain: technical_troubleshooting
complexity: high
xbase: Our online feature store has been serving stale feature values to our model
  inference service for about eight days. The feature pipeline runs on schedule and
  logs show successful writes. The staleness is not uniform across features — some
  refresh correctly while others lag by twelve to thirty-six hours. {DS}
focal_diagnostic_feature: The lagging features all belong to a single feature group
  whose time-travel window parameter was changed from 48h to 2h during a schema migration
  eleven days ago; the inference service queries that group with a point-in-time timestamp
  that now frequently falls outside the 2h window, returning the previous materialization
  instead of the latest.
low_diagnostic_proposition: The user's previous feature store staleness issues were
  generally caused by cache eviction failures leaving old values in memory.
oracle_action: ANSWER
oracle_focus: Restore the time-travel window for the affected feature group to a value
  that encompasses the inference timestamp, or adjust the query timestamp; then audit
  other feature groups for similar window misconfiguration from the same migration.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply the prior cache-eviction diagnosis. Ask
  which features are stale, whether they share a feature group, and whether any schema
  parameters changed around the onset of the issue.
