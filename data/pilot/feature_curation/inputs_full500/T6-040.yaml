      that now frequently falls outside the 2h window, returning the previous materialization
      instead of the latest.
    matched_to: HH
distractor_direction:
  label: Cache eviction failure
  description: Investigating whether an in-memory cache layer is failing to evict
    expired feature values, causing stale data to be served past TTL.
plausible_alternative_directions:
- label: Pipeline write latency
  description: The feature pipeline may be completing successfully but writing so
    late in the window that inference queries arrive before the new values are committed.
- label: Feature group registry inconsistency
  description: The feature store registry may have a version mismatch between the
    pipeline's write schema and the inference service's read schema
  causing the store to fall back to older snapshots.: null
- label: Point-in-time query clock skew
  description: A clock offset between the inference service and feature store could
    cause point-in-time queries to request timestamps slightly in the future
  systematically missing the latest materialisation.: null
