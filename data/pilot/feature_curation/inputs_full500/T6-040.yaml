      changelog shows its time-travel window was narrowed from 48h to 2h eleven days
      ago, one day before staleness appeared. The inference service queries that group
      with a point-in-time lookup that now regularly falls outside the 2h window,
      so the store returns the prior materialisation rather than the latest write.
    diagnosticity: high
    salience: high
    proposition: The lagging features all belong to a single feature group whose time-travel
      window parameter was changed from 48h to 2h during a schema migration eleven
