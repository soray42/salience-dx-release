      outside the window), and group-bounded scope confirming the hypothesis.
  LH:
    distractor: The stale features share a single feature group whose time-travel
      window was narrowed from 48h to 2h eleven days ago; inference queries with a
      point-in-time timestamp now fall outside that window and retrieve the prior
