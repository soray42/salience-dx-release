  notes: 'T6 availability inference ("so the key setup is probably the issue again")

    appears in both HL and LL. The key-auth hypothesis is structurally ruled out by

    xbase noting authentication succeeds instantly — this is a narrow C4-permissible

    pathway-closure that rules out one mechanism of the distractor (auth-time failure)

    without supplying the affirmative cause. The past SSH cases are structurally

    different: they failed at auth time, while this case succeeds at auth and drops

    only during idle periods.

    '
causal_audit:
  steelman: 'SSH key or permission errors occasionally manifest in unusual ways —
    for instance,

    a forced-command mismatch in authorized_keys can allow initial connection but

    restrict subsequent channel opens in some configurations. A cautious practitioner

    might argue that a partial key misconfiguration is worth ruling out before chasing

    firewall policy.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase states authentication succeeds instantly and commands
    work under active use. This closes the auth-time failure pathway: key and permission
    errors manifest during the connection handshake, not after it. The idle-only drop
    pattern cannot be explained by key misconfiguration.'
