  HH:
    distractor: The server firewall drops TCP connections idle for more than 600 seconds,
      and neither the client nor server SSH configs have TCPKeepAlive or ServerAliveInterval
      set, so idle sessions time out silently without either side sending a probe.
    diagnosticity: high
    salience: high
    proposition: The server firewall drops TCP connections idle beyond 600 seconds,
      and neither the client nor server SSH configuration sets TCPKeepAlive or ServerAliveInterval.
    salience_source: B — precise idle-timeout threshold (600 seconds), named SSH config
      options (TCPKeepAlive, ServerAliveInterval), and mechanistic explanation of
      silent drop.
  LH:
    distractor: No TCP keepalive is configured on either side and the server firewall
      drops connections idle beyond 600 seconds.
    diagnosticity: high
    salience: low
    proposition: The server firewall drops TCP connections idle beyond 600 seconds,
      and neither the client nor server SSH configuration sets TCPKeepAlive or ServerAliveInterval.
    matched_to: HH
distractor_direction:
  label: SSH key or permission misconfiguration
  description: Investigating whether authorized_keys file corruption or incorrect
    dot-ssh directory permission bits are causing the SSH session drops.
plausible_alternative_directions:
- label: Network path NAT timeout
  description: An intermediate NAT device or cloud security group rather than the
    server's own firewall may be expiring idle connection state, which would require
    a different remediation than server-side firewall configuration.
- label: Server SSH daemon resource limit
  description: The sshd MaxSessions or ClientAliveCountMax settings may be terminating
    idle sessions independently of the firewall timeout policy.
