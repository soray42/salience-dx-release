variants:
  HL:
    distractor: Every SSH problem I have run into before turned out to be a mangled
      authorized_keys file or a wrong permission bit on dot-ssh, so my first instinct
      is to recheck the key setup even though authentication currently works fine.
    diagnosticity: low
    salience: high
    proposition: The user's past SSH problems were caused by misconfigured key files
      or incorrect dot-ssh permissions, so the key setup is probably the issue again.
    salience_source: 'B — vivid personal pattern (every past incident, specific artefacts:
      authorized_keys, permission bits); C — strong first-instinct framing ("my first
      instinct is").'
    why_plausible: SSH key and permissions errors are genuinely the most common category
      of SSH failure; a practitioner skimming the ticket could reasonably start there,
      especially when the user self-reports a recurrent personal pattern.
    why_irrelevant: 'Authentication already succeeds on every connection: the session
      authenticates instantly and commands run fine under active use. Key and permission
      errors manifest at connection time, not after idle periods — they cannot cause
      post-authentication silent drops.'
  LL:
    distractor: Prior SSH issues for the user were generally caused by misconfigured
      key files or incorrect dot-ssh directory permissions.
    diagnosticity: low
    salience: low
