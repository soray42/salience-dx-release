seed_id: T6-042
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: My SSH sessions to a remote development server start dropping silently after
  sitting idle for about ten minutes. The initial connection authenticates instantly
  and interactive commands run fine while I am actively typing. I changed nothing
  in my SSH config recently, and the server is reachable by ping the entire time the
  session is inactive. {DS}
focal_diagnostic_feature: The server firewall drops TCP connections idle beyond 600
  seconds, and neither the client nor server SSH configuration sets TCPKeepAlive or
  ServerAliveInterval.
low_diagnostic_proposition: The user's past SSH problems were caused by misconfigured
  key files or incorrect dot-ssh permissions, so the key setup is probably the issue
  again.
oracle_action: ANSWER
oracle_focus: Configure TCPKeepAlive and ServerAliveInterval on the client or server
  SSH config to prevent the firewall from silently dropping idle connections.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not re-apply the key-auth diagnosis from past incidents.
  Ask whether keepalive settings are configured and whether the server has a firewall
  idle-timeout policy.
