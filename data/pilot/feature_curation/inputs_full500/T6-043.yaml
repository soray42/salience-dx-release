xbase: I am shopping for a new wireless Bluetooth speaker for use at my desk. Every
  wireless speaker I have owned over the past few years dropped the connection regularly,
  often mid-song, which made me unreliable as the person controlling audio. My previous
  three speakers were all different brands but had the same dropout problem. Now I
  am looking at a specific model that reviewers recommend, and I am unsure whether
  to trust wireless again or just get a wired option. {DS}
focal_diagnostic_feature: The model ranks first in its price tier in an independent
  Bluetooth connectivity benchmark, and 340 verified reviews across the retailer and
  three audio forums report zero connectivity dropout incidents.
low_diagnostic_proposition: All of the user's previous wireless speakers had repeated
  dropout problems, so this model will likely drop out too.
