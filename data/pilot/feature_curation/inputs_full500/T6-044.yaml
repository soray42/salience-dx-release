seed_id: T6-044
template: T6
domain: technical_troubleshooting
complexity: high
xbase: Our backend service started failing to reach an external payment API about
  four hours ago. The service logs show connection errors at the HTTPS layer, and
  the gateway hostname resolves to the expected IP. Nothing was deployed today, and
  other external API calls from the same service are completing normally. An early
  TLS trace shows the server hello completes before the error occurs. {DS}
focal_diagnostic_feature: 'curl with verbose TLS output shows the gateway accepts
  the TLS handshake and returns HTTP 403 with an X-Block-Reason: IP-ACL header; the
  provider''s status page confirms our egress subnet was added to their abuse blocklist
  six hours ago.'
low_diagnostic_proposition: Past payment API outages for this team were attributed
  to expired client certificates, suggesting cert rotation should be checked first
  in this case.
oracle_action: ASK
oracle_focus: Contact the payment provider to request egress subnet removal from their
  abuse blocklist; consider switching to a dedicated egress IP or range to avoid shared-subnet
  incidents.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to certificate rotation from past incidents.
  Ask for verbose TLS output, the specific HTTP error code, and any provider status-page
  entries before diagnosing.
