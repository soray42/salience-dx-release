variants:
  HL:
    distractor: Every payment API outage I've dealt with before has come down to an
      expired client certificate — that pattern has never failed me, so my first move
      would be checking our cert store right now.
    diagnosticity: low
    salience: high
    proposition: Past payment API outages for this team were attributed to expired
      client certificates, suggesting cert rotation should be checked first in this
      case.
    salience_source: B/C — multi-incident personal history ('never failed me'); confident
      first-instinct framing and specific action ('checking our cert store right now').
    why_plausible: Client certificate expiry is a common payment API failure mode;
      an engineer who has consistently resolved past outages this way would naturally
      apply the same diagnosis.
    why_irrelevant: The gateway is completing the TLS handshake successfully; certificate
      errors occur during TLS negotiation before any HTTP response is sent, so a cert
      expiry cannot produce an HTTP 403 with a WAF header.
