seed_id: T6-046
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: All the devices on my home Wi-Fi have been dropping the network connection
  for a few seconds several times a day for the past four days. The drops are brief,
  around three to five seconds, and affect every device simultaneously. My cable modem
  and router are combined into one ISP-provided unit. I have restarted it twice and
  the drops continue. {DS}
focal_diagnostic_feature: The modem reads 41°C, within its normal operating range;
  every recorded drop coincides with the kitchen microwave running, and the router
  is operating exclusively on the 2.4 GHz band.
low_diagnostic_proposition: The user's previous network drops were always resolved
  by improving modem ventilation, suggesting overheating is the likely cause here.
oracle_action: ANSWER
oracle_focus: Switch the router to the 5 GHz band or a 2.4 GHz channel away from microwave
  interference range; the drops are caused by RF interference from the microwave,
  not overheating.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to overheating from past incidents. Measure
  modem temperature and check whether drop timing correlates with any household appliance
  or activity before assuming ventilation is the cause.
