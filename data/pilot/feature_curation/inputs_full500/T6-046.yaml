distractor_direction:
  label: modem thermal overheating
  description: Investigating whether the combined modem-router unit is overheating
    and throttling or resetting its connection as a result of insufficient ventilation.
plausible_alternative_directions:
- label: ISP line signal degradation
  description: Checking whether the coaxial or DSL line signal quality has degraded,
    causing the modem to lose sync intermittently regardless of household activity.
- label: firmware or DHCP lease issue
  description: Investigating whether the ISP unit's firmware is performing scheduled
    background tasks or DHCP lease renewals that cause brief connectivity interruptions
    for all devices.
