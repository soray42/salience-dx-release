    why_plausible: Connection pool exhaustion under write pressure is a genuine MongoDB
      failure mode that causes replica nodes to lose heartbeat and be marked unreachable;
      the symptom of periodic loss followed by resync is consistent with both patterns.
    why_irrelevant: Connection pool exhaustion shows up as heartbeat timeouts and
      network-layer errors; the focal feature reveals that the secondary's oplog window
