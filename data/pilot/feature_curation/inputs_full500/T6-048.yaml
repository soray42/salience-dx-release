    matched_to: HH
distractor_direction:
  label: Connection pool exhaustion
  description: Investigating whether the connection pool between the secondary and
    primary saturates under write pressure, causing heartbeat timeouts and replica
    ejection.
plausible_alternative_directions:
- label: Secondary disk I/O bottleneck
  description: Even with normal average throughput, burst write patterns could saturate
    the secondary's journal write path, causing it to fall behind before recovering.
- label: Chunk migration interference
  description: If the deployment is sharded, chunk migrations could generate write
    bursts that temporarily spike oplog consumption beyond normal throughput estimates.
- label: Network packet loss on replication link
  description: Intermittent packet loss between primary and secondary could cause
    periodic lag spikes that exhaust the oplog window even if average throughput seems
    fine.
