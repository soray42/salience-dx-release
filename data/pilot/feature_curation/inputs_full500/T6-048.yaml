causal_audit:
  steelman: 'Connection pool exhaustion is a known MongoDB secondary failure mode:
    under high write throughput the secondary''s incoming connections spike, the pool
    hits maxIncomingConnections, heartbeat messages queue behind data messages, the
    primary marks the secondary as unreachable after the heartbeat timeout, and a
    resync is triggered. The cycle of failure-and-resync every few days is consistent
    with this pattern too, and the write-heavy workload mentioned in xbase is a genuine
    risk factor.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: The secondary's CPU, memory, and network throughput are
    explicitly normal — there is no saturation signal consistent with connection pool
    exhaustion. The focal feature (oplog window shorter than lag) is a categorical
    different failure mode.
