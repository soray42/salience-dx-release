seed_id: T6-048
template: T6
domain: technical_troubleshooting
complexity: high
xbase: 'Our MongoDB replica set has a secondary that falls out of sync every few days
  and requires a full resync to rejoin. The secondary''s hardware is healthy: CPU,
  memory, and network throughput look normal. There have been no explicit replica-set
  configuration changes. The primary handles a write-heavy workload with many small
  document updates per second. {DS}'
focal_diagnostic_feature: The oplog on the primary is configured at 512 MB, but the
  write rate is generating approximately 8 GB of oplog data per hour; when the secondary
  lags more than a few minutes it falls behind the oplog window and cannot roll forward,
  triggering the resync.
low_diagnostic_proposition: The secondary keeps losing sync because the connection
  pool between the secondary and primary is becoming exhausted under write pressure,
  which is what caused similar replica failures the user has encountered before.
oracle_action: ANSWER
oracle_focus: Increase the oplog size on the primary substantially (to at least several
  hours of write volume at current throughput); the resync cycle is driven by the
  secondary falling outside the oplog window, not by connection pool exhaustion.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply the connection-pool explanation from past
  failures; ask for the oplog size, the write throughput in GB/hour, and whether the
  secondary's replication lag is exceeding the oplog window before each resync.
