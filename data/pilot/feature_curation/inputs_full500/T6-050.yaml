    matched_to: HL
  HH:
    distractor: During one of the slowdown windows, pg_locks shows a long-running
      transaction holding an exclusive row-level lock on the orders table for over
      eight minutes, and every other query touching that table is queued behind it
      waiting to acquire their own lock.
    diagnosticity: high
    salience: high
    proposition: During the slowdown windows, pg_locks shows a long-running transaction
      holding an exclusive row-level lock on the orders table for over eight minutes,
      blocking every concurrent query that touches that table.
    salience_source: Precise lock type (exclusive row-level), named table (orders),
      specific duration (eight minutes), and the vivid image of a queue building behind
      the blocker make the evidence immediately actionable.
  LH:
    distractor: pg_locks shows a long-running transaction holding an exclusive lock
      on the orders table for over eight minutes, with concurrent queries queued behind
      it.
    diagnosticity: high
    salience: low
    proposition: During the slowdown windows, pg_locks shows a long-running transaction
      holding an exclusive row-level lock on the orders table for over eight minutes,
      blocking every concurrent query that touches that table.
    matched_to: HH
distractor_direction:
  label: missing index on queried column
  description: Treating the slowdowns as caused by absent or unused indexes, forcing
    the planner to do sequential scans on large tables.
plausible_alternative_directions:
- label: autovacuum bloat accumulation
  description: Autovacuum failing to keep up with dead-tuple accumulation could inflate
    table size and degrade planner choices, a live possibility in a busy OLTP system.
- label: checkpoint I/O spikes
  description: Aggressive checkpoint activity during business hours can produce I/O
    bursts that temporarily stall query execution even when CPU and memory appear
    normal.
- label: connection pool exhaustion
  description: Intermittent slowdowns correlated with business-hour load could reflect
    application-side pool saturation causing queries to queue before they reach the
    database.
