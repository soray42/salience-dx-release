causal_audit:
  steelman: 'Missing indexes are the canonical cause of slow Postgres queries and
    a DBA''s first diagnostic move is always to check EXPLAIN ANALYZE and pg_stat_user_indexes.
    Fifteen-to-twenty second latency with normal CPU could theoretically fit a low-cardinality
    index miss where the planner picks a sequential scan that happens to be mostly
    memory-resident. The developer''s consistent past experience makes the prior strong.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: Normal CPU and memory during spikes (xbase) is consistent
    with lock-wait behaviour and somewhat inconsistent with heavy sequential scans,
    narrowing — but not conclusively closing — the missing-index pathway before the
    focal evidence appears.
