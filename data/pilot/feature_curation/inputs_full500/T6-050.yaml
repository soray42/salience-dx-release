seed_id: T6-050
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: Our PostgreSQL application is experiencing intermittent query slowdowns during
  business hours. Queries that normally complete in under 100 milliseconds are taking
  fifteen to twenty seconds at peak times. The database server shows normal CPU and
  memory utilisation during the spikes. No schema changes were made recently. {DS}
focal_diagnostic_feature: During the slowdown windows, pg_locks shows a long-running
  transaction holding an exclusive row-level lock on the orders table for over eight
  minutes, blocking every concurrent query that touches that table.
low_diagnostic_proposition: Past PostgreSQL slowdowns for this developer were consistently
  caused by missing indexes; this one is probably the same.
oracle_action: ASK
oracle_focus: 'Investigate lock contention: use pg_locks joined with pg_stat_activity
  to identify the blocking transaction, find its origin process, and either terminate
  it or fix the upstream code that holds it open so long.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a missing index from past experience; run
  pg_locks and pg_stat_activity to check for blocking transactions before examining
  index coverage.
