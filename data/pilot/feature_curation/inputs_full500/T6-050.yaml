variants:
  HL:
    distractor: Every query slowdown I've debugged in Postgres before turned out to
      be a missing index — the planner just gave up and scanned the whole table —
      so I keep pulling up pg_stat_user_indexes and half-expecting to find the same
      culprit again.
    diagnosticity: low
    salience: high
    proposition: Past PostgreSQL slowdowns for this developer were consistently caused
      by missing indexes; this one is probably the same.
    salience_source: B — vivid first-person debugging narrative with confident register;
      C — 'keep pulling up... half-expecting' conveys strong availability-driven conviction.
    why_plausible: Missing indexes are genuinely the most common cause of slow Postgres
      queries, making pattern-matching to past experience feel rational and technically
      grounded.
    why_irrelevant: The focal feature identifies lock contention as the mechanism
      — a blocking transaction, not a planner choice — and queries blocked on locks
      show high latency without the sequential-scan CPU signature that missing indexes
      produce.
  LL:
    distractor: Past PostgreSQL slowdowns for this developer were consistently caused
      by missing indexes; this one is probably the same.
    diagnosticity: low
    salience: low
    proposition: Past PostgreSQL slowdowns for this developer were consistently caused
