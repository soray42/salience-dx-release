distractor_direction:
  label: local agency reliability stereotype
  description: Treating the small local agency as likely to have hidden fees or vehicle
    quality problems because past local agencies the user rented from consistently
    did.
plausible_alternative_directions:
- label: international chain service recovery
  description: The chain's global network and standardised processes could be more
    useful specifically during a remote roadside failure on a 1,800-kilometre route
    through rural southern Portugal.
- label: fuel policy comparison
  description: Differences in fuel-return policy (full-to-full versus pre-purchased
    or full-to-empty) could materially affect total trip cost and need to be confirmed
    before booking.
- label: vehicle class suitability
  description: The specific car model offered by each agency could differ in reliability
    or comfort in ways relevant to a long-distance drive that the price comparison
    alone does not capture.
