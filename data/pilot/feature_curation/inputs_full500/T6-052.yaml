causal_audit:
  steelman: 'A senior DBA would immediately consider disk as a candidate: the same
    CPU and memory specs do not guarantee the same disk throughput — different physical
    drives, RAID configurations, or cloud storage tiers could make one machine''s
    disk meaningfully slower. Replication lag that appears gradually over two days
    is consistent with disk I/O accumulating behind demand rather than a sudden configuration
    failure. The user''s past experience with disk-driven lag gives this hypothesis
    a strong Bayesian prior.

    '
  steelman_verdict: no_defensible_mechanism
