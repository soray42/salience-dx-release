seed_id: T6-052
template: T6
domain: technical_troubleshooting
complexity: high
xbase: Our MySQL read replica has been falling progressively further behind the primary
  for the past two days. The seconds_behind_master counter was under 5 minutes a week
  ago and is now over 40 minutes and growing. The replica server has the same CPU
  and memory specifications as the primary, and no unusual queries are running directly
  against it. {DS}
focal_diagnostic_feature: SHOW SLAVE STATUS shows replica_parallel_workers is 1; the
  primary's binlog generates roughly 3 write events per millisecond while the single
  apply thread sustains only about 1, and lag grows at approximately 15 seconds for
  every real second elapsed.
low_diagnostic_proposition: Past MySQL replication lag for this user was consistently
  caused by the replica having slower disk throughput; this instance is probably the
  same.
oracle_action: ASK
oracle_focus: Increase replica_parallel_workers to match the write parallelism (8-16
  workers), set slave_preserve_commit_order=1 if GTID-based, verify the apply rate
  recovers, and instrument the binlog throughput to confirm the bottleneck is eliminated.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume slower disk throughput from past experience;
  run SHOW SLAVE STATUS and check replica_parallel_workers configuration and binlog
  apply rate before investigating hardware.
