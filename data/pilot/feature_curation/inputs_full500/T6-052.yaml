distractor_direction:
  label: replica disk throughput bottleneck
  description: Treating the replication lag as caused by the replica's disk being
    slower than the primary's, so it cannot apply incoming write events at the required
    rate.
plausible_alternative_directions:
- label: primary write-load spike
  description: A sudden increase in write transaction volume on the primary — such
    as a new batch job or schema migration — could have increased binlog output beyond
    the replica's baseline capacity.
- label: network bandwidth saturation
  description: The binlog transfer channel between primary and replica could be saturated,
    causing the I/O thread to stall before events even reach the apply thread.
- label: InnoDB redo-log I/O contention on replica
  description: Even with adequate parallelism settings, InnoDB redo-log or tablespace
    write contention on the replica's storage could impose a secondary throughput
    ceiling distinct from the parallel-worker configuration.
