    why_plausible: Hedonic adaptation to new locations is a real and well-documented
      phenomenon; two successful prior moves constitutes non-trivial personal evidence.
    why_irrelevant: The prior moves were structurally different — they did not involve
      the loss of metro access with no driving alternative; adaptation cannot reduce
      an 80-minute daily commute to a manageable level.
