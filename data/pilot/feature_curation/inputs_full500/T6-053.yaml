distractor_direction:
  label: neighbourhood-adaptation optimism
  description: Relying on the user's personal track record of adapting to and preferring
    new neighbourhoods as evidence this move will succeed.
plausible_alternative_directions:
- label: affordability and equity upside
  description: The lower price point may allow the user to build equity while the
    metro network expands, if planned infrastructure reaches the area.
- label: remote-work feasibility
  description: If the role allows significant remote working, the commute time may
    matter less than the stated figures imply.
- label: total cost of ownership
  description: Buying outside the ring road may still lose money relative to renting
    inside if service charges, maintenance, and opportunity cost are factored in.
