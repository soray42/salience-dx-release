domain: open_qa
complexity: low
xbase: I am deciding whether to buy a flat in a neighbourhood outside the city centre.
  The price is below anything I could afford inside the ring road, and the flat itself
  has everything I need. I currently rent and take the metro to work in under twenty
  minutes. {DS}
focal_diagnostic_feature: The new neighbourhood has no metro access within 4 km; the
  only transit route requires two buses and a transfer, adding 80 minutes each way,
  and the user has no driving licence.
low_diagnostic_proposition: Past moves to new neighbourhoods worked out well after
  an adjustment period, so this move will probably also work out.
oracle_action: ANSWER
oracle_focus: Do not buy; the 80-minute one-way commute with no driving alternative
  is a structural daily cost that past neighbourhood-adaptation experience cannot
  resolve.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not generalise from past neighbourhood moves. Ask
  about commute time, transit options, driving ability, and whether the new location
  is workably connected before advising.
