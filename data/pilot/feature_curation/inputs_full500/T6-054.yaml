    '
causal_audit:
  steelman: 'npm cache corruption is a real and common cause of opaque build failures
    on

    shared self-hosted runners, particularly when multiple jobs write concurrently.

    The vague error message and per-job variability are consistent with a partially

    corrupted cache directory. An experienced CI maintainer with exactly this prior

    experience would reasonably try clearing the npm cache first.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: 'xbase states that builds pass on the cloud runner for
    the same repository. A corrupted npm cache on the self-hosted machine would not
    explain why cloud runs succeed — cloud runners use independent workspace directories.
    This foreecloses the npm-cache hypothesis without naming the true cause (C4 pathway-closure
    boundary respected: symptom asymmetry is stated, root cause is not).'
