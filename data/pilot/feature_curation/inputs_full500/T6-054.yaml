seed_id: T6-054
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: Our self-hosted CI runner started failing builds three days ago with a vague
  'unexpected error during build' message. The failure is not on a specific step —
  different jobs exit differently. Builds pass without issue on the cloud runner for
  the same repository. {DS}
focal_diagnostic_feature: The self-hosted runner's disk is at 97% capacity; `docker
  images` lists 23 untagged image layers totalling 18 GB accumulated since the last
  system restart, leaving no space for build artefacts or temp files.
low_diagnostic_proposition: Past runner failures on this machine were caused by a
  corrupted npm cache, so that is probably the cause this time too.
oracle_action: ANSWER
oracle_focus: Prune dangling Docker layers with `docker image prune` and add a scheduled
  prune to prevent recurrence; the disk-full condition explains why the cloud runner
  passes and the self-hosted runner fails.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply the npm-cache explanation automatically.
  Ask for disk usage and error logs on the self-hosted runner before assuming cache
  corruption.
