distractor_direction:
  label: npm cache corruption
  description: Diagnosing the self-hosted runner failures as caused by a corrupted
    or poisoned npm cache directory based on past experience with this machine.
plausible_alternative_directions:
- label: runner software version drift
  description: The self-hosted runner agent may be on an older version than the cloud
    runner, causing incompatibility with a recently updated workflow step.
- label: network or registry access
  description: The self-hosted machine may have lost connectivity to a private registry
    or internal dependency mirror that the cloud runner can still reach.
