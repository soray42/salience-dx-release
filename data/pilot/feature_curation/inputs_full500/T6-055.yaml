causal_audit:
  steelman: 'The user has direct positive evidence from an identical commitment type
    (a

    three-year lease in a new city) and reports adapting well. A practitioner

    might argue this self-knowledge is relevant: someone who handled one long

    lease successfully has demonstrated the psychological and logistical capacity

    to handle another, and that the past success partially predicts future

    adaptability even through a job change.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — xbase mentions a restructuring but does not reveal
    the contract expiry date or penalty terms. The prior lease was signed under different
    employment conditions that xbase does not characterise; the structural difference
    that invalidates the analogy lives entirely in the focal feature.
