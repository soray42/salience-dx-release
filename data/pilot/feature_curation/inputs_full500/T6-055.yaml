  notes: 'T6 availability inference (prior lease success → this lease will succeed)

    appears in both HL and LL. HL adds only the prior lease''s duration, the

    superlative evaluation, and the emotional arc; no facts about the current

    contract or penalty added. HH/LH diff: both assert the seven-month expiry,

    no renewal, four-month penalty, and no alternative role at this location —

    all four hh_atomic_claims are now carried by LH. xbase mentions the company

    restructuring — this is a live context signal that makes the distractor

