distractor_direction:
  label: Stale build cache recompilation
  description: Investigating whether a stale or corrupted CI build cache is producing
    inconsistent partial recompilation artifacts that cause intermittent test hangs.
plausible_alternative_directions:
- label: Flaky external test dependency
  description: Investigating whether an integration test is making network calls to
    an external service that intermittently times out, producing the 1-in-5 failure
    rate.
- label: Runner resource contention
  description: Checking whether CI runner CPU or memory pressure during peak build
    hours starves goroutines and causes non-deterministic timeouts.
- label: Go race detector event
  description: Considering whether the Go race detector, if enabled, is triggering
    on concurrent access and causing the test process to hang before output.
