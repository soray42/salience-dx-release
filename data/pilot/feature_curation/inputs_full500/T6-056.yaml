xbase: Our Go microservice CI pipeline has been producing intermittent test failures
  for about two weeks. The failures hit roughly one in five runs with no pattern in
  which test suite is affected. The job log shows the tests hang and then are killed
  by the timeout. I have not changed the pipeline configuration or added any new dependencies.
  {DS}
focal_diagnostic_feature: Test runner output includes goroutine stack traces showing
  two goroutines blocked waiting on the same uninitialized channel inside an integration
  test fixture that was added three weeks ago, and the hang occurs before any binary
  execution step.
low_diagnostic_proposition: Past CI hangs on this service were generally caused by
  stale build cache producing partial recompilation, so clearing the cache is probably
  the fix.
oracle_action: ASK
oracle_focus: Investigate the integration test fixture added three weeks ago for a
  race condition or deadlock in goroutine synchronization; the hang is pre-execution
  and rooted in test setup, not in the build or application logic.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to clearing the build cache from past
  experience. Ask for the full job log including any goroutine stack traces or runtime
  panic output before assuming a cache cause.
