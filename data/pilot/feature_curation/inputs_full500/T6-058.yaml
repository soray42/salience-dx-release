variants:
  HL:
    distractor: Every pipeline failure I have ever debugged before turned out to be
      a missing or expired secret in the CI environment, so my instinct is to audit
      the credentials and rotate the registry token before anything else.
    diagnosticity: low
    salience: high
    proposition: Past pipeline failures for this user were generally caused by missing
      or expired secrets in the CI environment, making a credential audit the likely
      first step.
    salience_source: B/C — confident first-person 'every... before' pattern followed
      by a concrete prescribed action; the directness of the recommendation carries
      experienced authority.
    why_plausible: Credential issues are among the most common CI failure modes; expired
      or misconfigured registry tokens are a frequent cause of image pull failures
      that a practitioner would reasonably audit first.
    why_irrelevant: An expired or missing credential would return HTTP 401 Unauthorized
      and would also fail on local pulls; the xbase establishes that local pulls succeed,
      which closes the invalid-credential mechanism before the focal evidence even
      appears.
  LL:
    distractor: Past pipeline failures for this user were generally attributed to
