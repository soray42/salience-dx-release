    narrative_coherence: '''Every... before... so my instinct is to'' constructs a
      clean personal diagnostic history leading to a confident prescribed action.'
    confident_assertion: '''every pipeline failure... turned out to be'', ''my instinct
      is to audit the credentials... before anything else'' — strong first-person
      certainty.'
