distractor_direction:
  label: Expired or missing CI credentials
  description: Investigating whether a missing, expired, or misconfigured registry
    secret in the CI environment is causing the image pull failures.
plausible_alternative_directions:
- label: Runner network egress block
  description: Checking whether the CI runners' outbound network to the registry is
    being throttled or blocked at the network layer during peak hours.
- label: Registry service degradation
  description: Evaluating whether the image registry itself is experiencing intermittent
    service issues independent of client credentials or concurrency.
- label: Registry authentication tier downgrade
  description: Checking whether CI pull requests are authenticated under a lower-quota
    registry tier than local developer pulls, causing the CI account to hit a tighter
    rate ceiling that local credentials do not reach.
leak_audit:
  ll_atomic_claims:
  - Past pipeline failures were generally attributed to missing or expired secrets.
  - The CI environment is the suspected location of the missing or expired secret.
  - A credential audit is the likely first step.
  hh_atomic_claims:
  - Failed job logs each end with HTTP 429 Too Many Requests from the registry.
  - The failures cluster in the 9 a.m. to noon window.
  - Twelve or more pipeline jobs run in parallel during that window.
  - The parallel jobs all target the same registry endpoint.
  hl_salience_dimensions:
