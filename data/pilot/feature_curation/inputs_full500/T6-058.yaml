  lh_word_count: 16
  notes: 'The availability inference (''making a credential audit the likely first
    step'')

    appears in both HL and LL (T6 C1 requirement satisfied).

    xbase closes the invalid-credential mechanism via ''local pulls work'' — this

    is a narrow pathway closure that rules out broken credentials without naming

    the HTTP 429 root cause, within C4''s boundary.

    HH gives four distinct claims about the 429 error; LH compresses to two

    (status code + concurrency correlation) but preserves both decisive facts.

    Ratio HL:LL = 1.61; HH:LH = 2.50; both within 4:1.

    '
causal_audit:
  steelman: 'A senior DevOps engineer could argue: CI pipelines sometimes carry

    service-account credentials scoped differently from a developer''s local

    Docker context; a misconfigured or short-lived CI token might fail at the

    start of a job while local developer credentials (potentially cached or

    broader-scoped) succeed. The failure-only-during-business-hours pattern

    could be explained by token refresh cycles that expire during peak working

    hours. This is the strongest mechanism: scope or expiry difference between

    CI and local credentials. However, the xbase explicitly states no pipeline

    secrets were rotated recently, closing the rotation-event trigger. More

    decisively, an expired or narrowly scoped CI token would produce HTTP 401,

    not HTTP 429 — different error codes indicate different server-side

    rejection reasons. The HH/LH HTTP 429 status is definitionally the

    registry''s rate-limit response, not an authentication failure response.

    The credential explanation cannot produce 429 errors under any mechanism.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: '''I can pull the same images from the same registry on
    my local machine with no errors'' closes the invalid-credential mechanism — broken
    registry credentials would also fail locally. This leaves scope mismatch as a
    residual possibility, which the 429 status code in HH/LH definitively rules out.'
