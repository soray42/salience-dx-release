seed_id: T6-058
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: Our CI pipelines have been failing sporadically for the past ten days. The
  failures happen on the image pull step at the start of the job, but only during
  business hours when multiple branches build simultaneously. No pipeline secrets
  have been rotated recently. I can pull the same images from the same registry on
  my local machine with no errors. {DS}
focal_diagnostic_feature: Failed job logs each terminate with an HTTP 429 Too Many
  Requests error from the registry, and the failures cluster in the morning peak window
  when twelve or more pipeline jobs run in parallel against the same registry endpoint.
low_diagnostic_proposition: Past pipeline failures for this user were generally caused
  by missing or expired secrets in the CI environment, making a credential audit the
  likely first step.
oracle_action: ANSWER
oracle_focus: 'Investigate registry rate-limiting: check the registry plan''s pull-rate
  quota, reduce parallel job concurrency or add pull-through caching, and confirm
  the HTTP 429 pattern correlates with job concurrency peaks.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to a credential audit from past experience.
  Ask for the full failed job log output, particularly the error code and message
  from the registry, before assuming a secrets cause.
