xbase: My sourdough bread has been coming out with a dense, gummy crumb for the past
  month. I have been baking sourdough for about two years and this is frustrating
  because I was happy with my results before. I shape, score, and bake in a covered
  Dutch oven the same way as before. The loaves look fine from outside but cut open
  they are underdeveloped inside. {DS}
focal_diagnostic_feature: The starter is visibly active and passes the float test,
  while bulk fermentation is being cut to two hours in a 19°C kitchen, which is insufficient
  time for dough development at that temperature.
low_diagnostic_proposition: Past dense sourdough results were traced to a sluggish
  starter, so the starter is probably inactive again.
oracle_action: ANSWER
oracle_focus: Extend bulk fermentation substantially at 19°C; the active starter rules
  out starter weakness, and two hours is far too short for full dough development
  at that temperature.
