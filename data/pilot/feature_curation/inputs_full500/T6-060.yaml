domain: technical_troubleshooting
complexity: high
xbase: Our service A has been showing P99 latency around 900 ms on its primary endpoint,
  up from its usual 120 ms, since we pushed a configuration change three days ago.
  I started investigating but I am having difficulty pinpointing whether the regression
  is genuine or a measurement artifact. The configuration change adjusted how trace
  sampling is applied across several services. Other aggregate metrics have not flagged
  anything obvious. {DS}
focal_diagnostic_feature: Sampling is configured at 100% in the updated config, and
  RED metrics from an independent instrumentation layer confirm the same elevated
  P99; span data shows a downstream RPC to service B spiking to 800 ms on cold-start
  requests.
low_diagnostic_proposition: Past P99 spikes after sampling changes were sampling artifacts,
  and that is probably what is happening here.
oracle_action: ANSWER
oracle_focus: Investigate service B's cold-start RPC latency; the 100% sampling rate
  and independent RED metric confirmation rule out a sampling artifact, making the
  800 ms cold-start spike in service B the real source of the P99 regression.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply the past sampling-artifact explanation automatically.
  Ask for the current sampling rate and whether independent non-tracing metrics confirm
  the elevated latency before diagnosing the cause.
