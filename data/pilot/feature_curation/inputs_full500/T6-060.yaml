distractor_direction:
  label: Sampling-artifact inflation
  description: Investigating whether the updated sampling configuration is causing
    a biased trace pool that inflates the observed P99 without reflecting real latency.
plausible_alternative_directions:
- label: Config change side effect on service A
  description: Whether the sampling configuration change itself altered request routing
    or middleware behaviour in service A, directly introducing latency.
- label: Deployment concurrency issue
  description: Whether service A or service B was partially deployed during the configuration
    push, leaving some instances on the old version and causing inconsistent request
    handling.
- label: Clock skew across services
  description: Whether a clock-skew difference between service A and service B is
    causing span timestamps to misrepresent actual RPC duration in trace data.
