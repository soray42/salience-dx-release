causal_audit:
  steelman: 'A practitioner who has seen P99 inflation from tail-biased sampling after

    config changes is applying a genuinely valid technical pattern: if a sampling

    configuration accidentally routes only high-latency requests to the trace

    store, the computed P99 from those traces is inflated relative to true

    service latency, and the inflation would appear right after a sampling

    config change. This is a real and well-documented observability failure mode.

    The seed is clean because the current configuration sets sampling to 100%,

    meaning all requests are traced and no biased pool can exist. Additionally,

    RED metrics from a separate instrumentation layer — independent of the trace

    sampling path — confirm the same 900 ms P99, providing a second measurement

    that a sampling artifact cannot affect. Both lines of evidence structurally

    rule out an artifact for this case; the past cases were structurally

    different in that they involved sampling rates that could produce a biased

    pool.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — sampling rate, RED metrics, and service B span data
    live only in HH/LH.
