causal_audit:
  steelman: 'A defender might argue that evening baking correlates with lower kitchen

    temperatures (kitchens cool as the day progresses), or that baker fatigue in

    the evening leads to subtly different technique — slightly off shaping or an

    abbreviated bulk ferment. However, neither pathway is a direct mechanism from

    time-of-day itself: any temperature effect would operate through ambient

    temperature (a separate, testable variable) and any technique effect would

    operate through fermentation timing or shaping (also separate, testable

    variables). Time of day per se has no constructible direct mechanism for

    sourdough density; it is at best a proxy for other variables, none of which

    xbase independently elevates for this case.

    '
