distractor_direction:
  label: Time-of-day baking schedule
  description: Investigating whether baking in the evening rather than the morning
    is responsible for the flat, dense loaves, based on a recalled personal pattern.
plausible_alternative_directions:
- label: Cold kitchen temperature
  description: The ambient kitchen temperature may be too low to sustain adequate
    fermentation, causing the dough to under-rise — a live candidate because xbase
    contains no temperature reading.
- label: Shaping or gluten development fault
  description: The dough may have been degassed or improperly shaped during final
    handling, causing structure collapse and a dense bake despite apparently adequate
    bulk ferment.
- label: Insufficient or interrupted bulk fermentation
  description: The bulk fermentation period may have been too short or was cut off
    early, leaving insufficient CO2 development — live because xbase mentions only
    that the dough felt smooth, not that timing was correct.
