seed_id: T6-062
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: Our inventory microservice pods have been OOM-crashing every few hours for
  the past two weeks. They have run at 512 MB memory limits for six months with no
  changes to traffic volume or memory configuration. Heap dumps and container metrics
  are available. {DS}
focal_diagnostic_feature: Heap dumps show HTTP client connection objects growing monotonically
  from under 20 MB to over 480 MB across a two-hour run, and a code change three weeks
  ago disabled connection-pool eviction by setting the eviction interval to zero.
low_diagnostic_proposition: Past OOM crashes I debugged were always from a memory
  limit set too low, so 512 MB is probably insufficient now.
oracle_action: ANSWER
oracle_focus: Restore the connection-pool eviction interval to a non-zero value in
  the HTTP client configuration; the leak is in unbounded connection accumulation,
  not in the memory limit.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not raise the memory limit without evidence the limit
  is the cause; ask for heap dump analysis and any recent code changes before concluding
  the limit is insufficient.
