causal_audit:
  steelman: 'Memory limit too low is the correct first hypothesis for Kubernetes OOM
    kills:

    if the application''s working set has grown beyond 512 MB for any reason,

    the kernel will OOM-kill the container regardless of code correctness. Even

    with flat traffic and no explicit config change, a JVM application''s working

    set can grow over time due to caching, class loading, or retained objects.

    An experienced K8s engineer who has debugged this pattern repeatedly has

    strong inductive grounds to check the limit before investing in heap analysis.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: '"No changes to traffic volume or memory configuration"
    partially closes the most tempting mechanism (workload grew beyond the limit)
    without naming the actual cause. The heap dump evidence showing monotonic object
    growth from a specific code change lives only in HH/LH.'
