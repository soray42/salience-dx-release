distractor_direction:
  label: Memory limit undersized
  description: Investigating whether the 512 MB Kubernetes memory limit is now insufficient
    for the pod's working set, requiring an increase to stop the OOM kills.
plausible_alternative_directions:
- label: Traffic or data volume growth
  description: Even without a configuration change, gradual growth in request payload
    size or concurrent connections could push the pod beyond its memory limit.
- label: JVM heap or GC misconfiguration
  description: The JVM's heap settings may have drifted out of proportion to the container
    limit, causing GC overhead to spike and eventually exhaust container memory.
- label: Third-party library update
  description: A transitive dependency update three weeks ago introduced a regression
    that increases per-request object retention, gradually inflating heap usage.
