    diagnosticity: low
    salience: high
    proposition: Past OOM crashes I debugged were always from a memory limit set too
      low, so 512 MB is probably insufficient now.
    salience_source: 'Dimension B (narrative coherence): confident engineer''s voice
      recounting a clear personal diagnostic pattern; dimension C (confident assertion):
      "every OOM kill," "just not enough anymore," "raise the limit and move on" —
      categorical, dismissive confidence.'
    why_plausible: Memory limit misconfiguration is the most common first-pass explanation
      for Kubernetes OOM kills, and an engineer who has consistently found this to
      be the root cause would have strong reason to check it first.
    why_irrelevant: The pods ran stably for six months at 512 MB with unchanged traffic,
      so the limit has not become "too low" due to load growth. The heap dump shows
