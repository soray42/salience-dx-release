causal_audit:
  steelman: 'Early oven-door opening is a textbook cause of sunken sponge cakes: cold
    air

    rushes in, dropping the internal temperature at the moment the structure is

    most fragile, and the partially set centre collapses under its own weight.

    A baker who has reliably reproduced this failure in the past has strong

    inductive grounds to suspect the same mechanism. Moreover, "not opening the

    oven" is easy to do automatically or accidentally, so the baker''s stated

    intention not to open it does not definitively prove the door was never opened.

    '
  steelman_verdict: no_defensible_mechanism
