distractor_direction:
  label: Oven door opened too early
  description: Investigating whether the baker opened the oven door during baking,
    allowing cold air to enter and collapse the cake's structure before it had fully
    set.
plausible_alternative_directions:
- label: Under-beaten or over-beaten egg structure
  description: The egg-and-sugar mixture was not beaten to the correct ribbon stage,
    or was over-worked and deflated before baking, leading to insufficient lift.
- label: Leavening agent failure
  description: The baking powder has expired or was measured incorrectly, providing
    insufficient rise for the sponge structure to hold during baking.
- label: Pan size mismatch
  description: The tin is larger than the recipe specifies, spreading the batter too
    thin so the edges set and the centre sinks before heat can penetrate.
