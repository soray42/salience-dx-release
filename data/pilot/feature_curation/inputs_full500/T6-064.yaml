      the collector process itself shows 40% memory utilization and healthy throughput
      metrics.
    matched_to: HH
distractor_direction:
  label: Collector OOM-kill
  description: Investigating whether the OpenTelemetry collector process is being
    killed by the kernel due to out-of-memory pressure, causing spans to be dropped
    before they are exported.
plausible_alternative_directions:
- label: Incorrect exporter endpoint
  description: The SDK exporter may be sending to a wrong or unreachable collector
    address, causing silent connection failures and drops that look like queue overflow.
- label: Network packet loss between SDK and collector
  description: Packet loss on the network path between instrumented services and the
    collector could cause retries that fill the export queue without OOM being involved.
- label: Collector batch-processor back-pressure
  description: The collector's batch processor may be unable to forward spans to the
    backend fast enough, creating back-pressure that causes SDK-side queue growth
    independent of collector memory limits.
