seed_id: T6-064
template: T6
domain: technical_troubleshooting
complexity: high
xbase: Our distributed tracing setup has been dropping roughly thirty percent of spans
  across all services for the past four days. The sampling rate was raised from 1%
  to 100% last week when we started a production debugging session. I have not restarted
  the OpenTelemetry collector process during this period. {DS}
focal_diagnostic_feature: The SDK's drop counter shows spans being discarded at the
  export queue before reaching the collector, with the queue pegged at maximum capacity;
  the collector process itself shows 40% memory utilization and healthy throughput
  metrics.
low_diagnostic_proposition: Past span drops in this tracing pipeline were caused by
  the collector being OOM-killed, so the collector is likely responsible again.
oracle_action: ANSWER
oracle_focus: The SDK export queue is overflowing because the 100x sampling-rate increase
  saturates it faster than the exporter can drain; increase the export queue size
  or batch-send concurrency in the SDK configuration, or lower the sampling rate.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume the collector is OOM-killed based on past
  experience. Ask for SDK-side drop counters, collector memory metrics, and export
  queue utilization before diagnosing the collector process.
