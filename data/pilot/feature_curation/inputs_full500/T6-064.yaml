variants:
  HL:
    distractor: Every time I have seen spans go missing in this stack before, it turned
      out the collector was running out of memory and getting OOM-killed by the kernel,
      so my first instinct is that the collector is doing it again.
    diagnosticity: low
    salience: high
    proposition: Past span drops in this tracing pipeline were caused by the collector
      being OOM-killed, so the collector is likely responsible again.
    salience_source: B — vivid personal history with a clean causal narrative (OOM
      → kernel kill → span loss) and confident first-instinct framing; C — assertive
      certainty (turned out, my first instinct is).
    why_plausible: An OOM-killed collector is one of the most common causes of span
      drops in production tracing; a practitioner who has seen it multiple times in
      this exact stack has a strong empirical prior that is hard to dismiss.
    why_irrelevant: An OOM-killed collector would exhaust memory and be terminated;
      it cannot account for the SDK-side export queue overflowing while the collector
      runs at 40% memory with healthy throughput. The drop is happening before spans
      reach the collector at all.
  LL:
    distractor: Prior span drops in this tracing stack were caused by the collector
      being OOM-killed, so the collector is probably responsible again.
    diagnosticity: low
    salience: low
    proposition: Past span drops in this tracing pipeline were caused by the collector
