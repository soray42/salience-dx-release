distractor_direction:
  label: Redirect URI mismatch
  description: Investigating whether the OAuth 400 Bad Request errors stem from a
    redirect URI configured in the application not matching the registered value in
    the identity provider.
plausible_alternative_directions:
- label: Refresh token expiry policy
  description: Checking whether the identity provider reduced the refresh token lifetime,
    causing tokens to expire before the hourly refresh cycle.
- label: Scope or grant type change
  description: Investigating whether the IdP configuration for this client application
    had its allowed scopes or grant types modified.
- label: Clock skew at token validation
  description: Examining whether a timing offset between the app server and the IdP
    is causing issued tokens to appear expired immediately.
