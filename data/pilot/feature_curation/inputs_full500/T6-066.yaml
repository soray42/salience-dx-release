seed_id: T6-066
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: Our web application's OAuth 2.0 token refresh is failing in production. Users
  get logged out every hour when the refresh token call returns a 400 Bad Request.
  The same flow worked fine for several months, and the redirect URI registered in
  the IdP is confirmed unchanged. {DS}
focal_diagnostic_feature: The identity provider audit log shows the OAuth client secret
  was rotated two days ago; the application's CLIENT_SECRET environment variable still
  holds the previous value.
low_diagnostic_proposition: Past OAuth problems for the user were consistently caused
  by redirect URI mismatches in the identity provider, suggesting that is the likely
  current cause.
oracle_action: ANSWER
oracle_focus: Update the CLIENT_SECRET environment variable with the newly rotated
  secret value and redeploy; the 400 errors are caused by credential mismatch after
  the IdP rotation.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the redirect URI explanation from past experience.
  Ask for the IdP audit log, any recent credential rotations, and compare the application's
  stored secret against the current IdP value.
