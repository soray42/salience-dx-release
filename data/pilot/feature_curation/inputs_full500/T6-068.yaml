  - The error appears immediately after loading certificate metadata.
  - The rotated key is RSA-4096.
  - The pinned signing tool supports only RSA-2048.
  - The key path is never reached by the tool.
  hl_salience_dimensions:
    source_credibility: N/A — first-person speaker, no named external source
    narrative_coherence: Coherent track record of three prior path-fix incidents,
      confident first-instinct framing, clean sequence from past pattern to current
