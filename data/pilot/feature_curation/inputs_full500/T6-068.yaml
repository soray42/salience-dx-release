variants:
  HL:
    distractor: Every time signing has broken in this pipeline before, it came down
      to the key file path being wrong in the signing.conf — I have fixed that exact
      same mistake three times and it is where my head goes first every single time.
    diagnosticity: low
    salience: high
    proposition: Past code signing failures here were caused by an incorrect key file
      path; the path is probably wrong again.
    salience_source: B/C — vivid personal history of three prior identical fixes,
      confident first-person instinct framing ("it is where my head goes first every
      single time"), and a coherent track record of the same-path mistake.
    why_plausible: Key file path errors are the most common issue when rotating credentials
      into an existing config; a practitioner who has fixed this three times would
      naturally check it first.
    why_irrelevant: The xbase explicitly confirms the key file path resolves correctly
      to the new key, eliminating path as the cause; the focal evidence shows the
      tool fails on key algorithm before it even opens the file.
  LL:
