  notes: 'The key file path is explicitly closed in xbase ("confirmed the key file
    path

    in the config still resolves correctly to the new key''s location"), ruling out

    the distractor pathway per C2/C4. This is a narrow closure that names no positive

    cause. The distractor remains psychologically salient because path errors are
    the

    most common rotation failure mode. High complexity reflects the need to understand

    signing-tool version pinning and RSA key-length constraints.

    '
causal_audit:
  steelman: 'After a credential rotation, the new key is placed at a new path or with
    a new

    name, and the signing.conf must be updated to point to it. Even with a nominal

    path check, symlinks, environment variable interpolation, or Docker volume mounts

    could cause the config to resolve correctly in a shell check but point elsewhere

    during pipeline execution. Three prior incidents of this exact failure give strong

    prior probability that path issues remain the most likely root cause.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: '"I have confirmed the key file path in the config still
    resolves correctly to the new key''s location" — this closes the incorrect-path
    mechanism without naming the actual cause.'
unconstructable: false
