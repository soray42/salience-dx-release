    matched_to: HH
distractor_direction:
  label: incorrect key file path
  description: Investigating whether the signing configuration points to a wrong or
    inaccessible file path for the newly rotated private key.
plausible_alternative_directions:
- label: key file permission error
  description: The rotated key file may have been written with permissions that the
    signing tool's runtime user cannot read, producing an access-denied failure.
- label: key format or encoding mismatch
  description: The new key may be in a different encoding or wrapping format (e.g.
    PKCS#8 vs PKCS#1) that the signing tool does not accept.
- label: signing certificate chain mismatch
  description: If the signing operation requires a matched certificate, the certificate
    stored in the config may no longer correspond to the new private key.
