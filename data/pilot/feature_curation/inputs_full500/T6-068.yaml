seed_id: T6-068
template: T6
domain: technical_troubleshooting
complexity: high
xbase: Our release pipeline's code signing step has failed for every build since we
  rotated our signing credentials last Tuesday. The signing tool and its configuration
  file have not changed, and I have confirmed the key file path in the config still
  resolves correctly to the new key's location. The build steps before signing all
  complete without error. {DS}
focal_diagnostic_feature: The rotated private key is RSA-4096, but the pinned signing
  tool version supports only RSA-2048; the tool logs an unsupported-key-length error
  before it reads the key path.
low_diagnostic_proposition: Past code signing failures here were caused by an incorrect
  key file path; the path is probably wrong again.
oracle_action: ANSWER
oracle_focus: Upgrade the signing tool to a version that supports RSA-4096, or regenerate
  the signing key as RSA-2048 to match the tool's capability; the key-length mismatch
  is the direct cause and the path is confirmed correct.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to checking the key file path — it has
  already been confirmed correct. Ask what error the signing tool logs and what key
  algorithm and length the rotated credential uses.
