xbase: My weekly running mileage has dropped significantly over the last four weeks
  and I am not sure why. I do not feel particularly fatigued and I am not nursing
  any soreness. I changed jobs about a month ago, but the role is similar and the
  hours are roughly the same. I have not changed my diet or sleep schedule. {DS}
focal_diagnostic_feature: The previous job required a 3 km run each way to the station
