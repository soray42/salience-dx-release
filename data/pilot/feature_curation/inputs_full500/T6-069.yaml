  of running per week.
low_diagnostic_proposition: Past mileage drops for this user were caused by overtraining;
  needing a rest period is probably the issue now too.
oracle_action: ANSWER
oracle_focus: The mileage drop is accounted for by the elimination of commute running;
  to restore total mileage, add explicit training runs to replace the lost 30 km per
  week rather than rest further.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume overtraining from past experience. Ask
