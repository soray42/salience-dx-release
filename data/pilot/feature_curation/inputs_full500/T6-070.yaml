seed_id: T6-070
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: Our integration with a third-party data export API has been failing with 403
  Forbidden since we rotated the API key last week as part of a scheduled credential
  refresh. The new key was generated and added to our config without other changes,
  and our server's IP address has not changed. The endpoint and request format are
  the same as before. {DS}
focal_diagnostic_feature: The new API key was generated with only the default read
  scope; the data export endpoint requires write scope, which the previous key held
  but was not re-selected during regeneration.
low_diagnostic_proposition: Past 403 errors from this API were caused by the server
  IP not being allowlisted; an allowlist issue is the likely cause now.
oracle_action: ANSWER
oracle_focus: Regenerate the API key with the write scope enabled, or add write scope
  to the existing key through the provider's key management interface; the scope omission
  during key creation is the direct cause of the 403 responses.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume an IP allowlist issue — the server IP has
  not changed. Ask what scopes the new key was generated with and what permissions
  the target endpoint requires.
