distractor_direction:
  label: Phone distraction and focus deficit
  description: Investigating whether the user's slow course progress stems from phone
    use and poor focus during study sessions rather than a content comprehension problem.
plausible_alternative_directions:
- label: Insufficient study time per week
  description: The user's available study time may be genuinely too low for the course's
    pace, regardless of focus quality or content difficulty.
- label: Course pacing and structure mismatch
  description: The course's lesson format or structure may not suit self-directed
    study by working professionals, creating friction independent of prerequisites.
- label: Motivation decline after initial enrolment
  description: Interest may have peaked at sign-up and the user may need accountability
    structures or a cohort to sustain engagement over weeks.
