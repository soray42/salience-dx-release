    distractor: 'The error traces to the aws_s3_bucket resource block: version 5 removed
      the deprecated acl argument that is still set in our config, and the provider
      changelog lists it as a breaking removal requiring a config migration before
      apply will succeed.'
    diagnosticity: high
    salience: high
    proposition: The error traces to an aws_s3_bucket resource block using the acl
      argument, which the AWS provider v5 changelog documents as a breaking removal
