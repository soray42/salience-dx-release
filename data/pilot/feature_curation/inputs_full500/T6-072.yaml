seed_id: T6-072
template: T6
domain: technical_troubleshooting
complexity: high
xbase: Our production Terraform apply has been failing for two days with a provider
  schema mismatch error after we upgraded the AWS provider from 4.x to 5.x. Every
  other infrastructure change landed cleanly this sprint. Running terraform init clears
  no errors, and the state lock table shows nothing held — the failure is consistent
  on every apply regardless of which engineer runs it. {DS}
focal_diagnostic_feature: The error traces to an aws_s3_bucket resource block using
  the acl argument, which the AWS provider v5 changelog documents as a breaking removal
  requiring an explicit config migration before apply will succeed.
low_diagnostic_proposition: The Terraform failure is probably caused by a stale state
  lock, as past failures for this user were generally due to interrupted applies leaving
  a lock unreleased.
oracle_action: ANSWER
oracle_focus: 'Migrate the aws_s3_bucket resource blocks: move the acl argument to
  the separate aws_s3_bucket_acl resource as documented in the AWS provider v5 migration
  guide, then re-run apply.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply the stale-lock explanation automatically.
  The error type (provider schema mismatch) is structurally distinct from a lock error;
  check the provider changelog and inspect the specific failing resource argument
  before reaching for force-unlock.
