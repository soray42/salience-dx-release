    salience_source: Specific resource type (aws_s3_bucket), specific argument (acl),
      precise version context (v5 breaking removal), actionable remediation path.
  LH:
    distractor: The error originates in an aws_s3_bucket block using the acl argument
      removed as a breaking change in the AWS provider v5 upgrade.
    diagnosticity: high
    salience: low
    proposition: The error traces to an aws_s3_bucket resource block using the acl
      argument, which the AWS provider v5 changelog documents as a breaking removal
      requiring an explicit config migration before apply will succeed.
    matched_to: HH
distractor_direction:
  label: Stale Terraform state lock
  description: Investigating whether an unreleased state lock from a previous interrupted
    apply is blocking the current Terraform operation.
plausible_alternative_directions:
- label: Backend state corruption
  description: The remote state file may have been corrupted during the provider upgrade,
    causing plan/apply divergence that manifests as a schema error.
- label: Provider version pin conflict
  description: A module or dependency may be constraining the provider version in
    a way that conflicts with the upgraded AWS provider, producing schema inconsistency.
- label: Resource config drift from v5 defaults
  description: Other arguments deprecated or defaulted differently in v5 may be producing
    the mismatch beyond just the acl field, requiring a broader migration audit.
leak_audit:
  ll_atomic_claims:
  - Past Terraform failures for this user were generally attributed to stale state
    locks.
  - The stale locks came from interrupted applies leaving a lock unreleased.
  hh_atomic_claims:
  - The error traces to an aws_s3_bucket resource block.
  - The failing argument is acl.
  - AWS provider version 5 removed the acl argument as a breaking change.
  - The provider changelog documents this removal explicitly.
  - A config migration is required before apply will succeed.
  hl_salience_dimensions:
    source_credibility: N/A — first-person availability narrative, no named source.
    narrative_coherence: Personal pattern of repeated past lock failures drives first-instinct
      action, even with present contradicting evidence (lock table shows nothing held).
