    current-case observations (C1 compliant). LL unchanged — states past

    failures attributed to stale locks, propositionally equivalent to HL.

    '
causal_audit:
  steelman: 'Stale state locks produce apply failures in team Terraform environments

    regularly, and the specific symptom (consistent failure across engineers)

    could match a lock held at the backend level that is not visible in the

    standard lock table UI. A thorough practitioner might argue that

    backend-level locks sometimes appear only in cloud-storage metadata,

    not in the Terraform Cloud lock UI.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states "the state lock table shows nothing held,"
    closing the stale-lock pathway without identifying the actual cause. Additionally
    the error type (provider schema mismatch) is structurally distinct from a lock
    error.
