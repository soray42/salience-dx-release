variants:
  HL:
    distractor: Every time Terraform has blown up on me before, it was a stale state
      lock left by someone who killed a terminal mid-apply, so my first instinct is
      to try terraform force-unlock and see if that clears it.
    diagnosticity: low
    salience: high
    proposition: The Terraform failure is probably caused by a stale state lock, as
      past failures for this user were generally due to interrupted applies leaving
      a lock unreleased.
    salience_source: 'B: vivid personal history with a clear recurring pattern; C:
      confident first-instinct framing ("I keep reaching for terraform force-unlock").'
    why_plausible: State lock contention is a genuine and common Terraform failure
      mode in team environments; a user who has encountered it repeatedly will have
      a strong availability heuristic pulling them toward that diagnosis.
    why_irrelevant: The error is a provider schema mismatch, not a lock error — these
      produce different error messages and different remediation paths; the lock table
      itself shows nothing held, structurally ruling out an unreleased lock.
  LL:
