seed_id: T6-074
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: Our Kubernetes deployment has been intermittently failing to start new pods
  for the past two days. The pods enter ImagePullBackOff for several minutes before
  eventually succeeding or timing out. We are using a private Amazon ECR registry
  and our CI/CD pipeline pushes images successfully. {DS}
focal_diagnostic_feature: The affected deployment has imagePullPolicy set to Always;
  node scale-up events trigger forty concurrent ECR pulls that the kubelet serialises,
  causing the observed backoff windows.
low_diagnostic_proposition: Previous image pull failures for the user were generally
  attributed to Docker Hub anonymous pull rate limits.
oracle_action: ANSWER
oracle_focus: Change imagePullPolicy to IfNotPresent where appropriate, or stagger
  pod start-up; the root cause is serialised concurrent ECR pulls during scale-up,
  not a registry access problem.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply the Docker Hub rate-limit diagnosis; the
  registry is private ECR, so ask about imagePullPolicy setting, pull concurrency,
  and timing correlation with node scale-up events before diagnosing.
