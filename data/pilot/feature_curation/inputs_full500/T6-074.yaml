variants:
  HL:
    distractor: Every image pull failure I have run into before was Docker Hub rate
      limiting our anonymous pulls, so my first thought is to check whether something
      started hitting Hub accidentally.
    diagnosticity: low
    salience: high
    proposition: Previous image pull failures for the user were generally attributed
      to Docker Hub anonymous pull rate limits.
    salience_source: B/C — vivid first-person pattern assertion with confident first-instinct
      framing ("every time", "my first thought").
    why_plausible: Docker Hub rate limiting has been a widely experienced Kubernetes
      problem and "something hitting Hub accidentally" is a plausible regression a
      busy practitioner might check first.
    why_irrelevant: The registry is explicitly private ECR, which has separate authentication
      and throttling mechanics; the Docker Hub rate-limit mechanism cannot apply to
      ECR pulls in this cluster.
  LL:
    distractor: Previous image pull failures for the user were generally attributed
      to Docker Hub anonymous pull rate limits.
    diagnosticity: low
    salience: low
    proposition: Previous image pull failures for the user were generally attributed
      to Docker Hub anonymous pull rate limits.
    matched_to: HL
  HH:
    distractor: The failing pods all reference the same deployment, which has imagePullPolicy
      set to Always; during a node scale-up event, forty pods attempt to pull simultaneously
      from ECR and the node kubelet serialises the requests.
    diagnosticity: high
    salience: high
    proposition: The affected deployment has imagePullPolicy set to Always; node scale-up
      events trigger forty concurrent ECR pulls that the kubelet serialises, causing
      the observed backoff windows.
    salience_source: Concrete policy name (Always), precise count (forty pods), and
      the serialisation mechanism create an unambiguous causal chain.
  LH:
    distractor: The affected deployment has imagePullPolicy set to Always; concurrent
      pulls during a node scale-up event overwhelm the kubelet pull queue.
    diagnosticity: high
    salience: low
    proposition: The affected deployment has imagePullPolicy set to Always; node scale-up
      events trigger forty concurrent ECR pulls that the kubelet serialises, causing
      the observed backoff windows.
    matched_to: HH
distractor_direction:
  label: Docker Hub rate limiting
  description: Investigating whether the cluster is inadvertently pulling from Docker
    Hub and hitting anonymous-pull rate limits, causing the ImagePullBackOff errors.
plausible_alternative_directions:
- label: ECR authentication expiry
  description: ECR tokens expire every 12 hours; a credential rotation failure could
    cause intermittent pull authentication errors that look like backoff.
- label: image tag mutability race
  description: If the image tag is being overwritten by concurrent CI pushes while
    pods are starting, a digest mismatch could cause transient pull failures.
