  notes: 'xbase mentions studying "on and off for two years" — consistent with the

    availability narrative. A pathway-closure sentence ("This is the first time

    I have structured an attempt around external commitments from the start.")

    forecloses the behavioral-consistency mechanism without revealing what those

    commitments are; that decisive detail lives only in HH/LH (partner, slot,

    exam penalty). HL repair: removed "yearly charge on my statement" (was

    annual-plan-specific leak absent from LL) and replaced with "look back

    months later with regret" — preserving temporal-regret tone without

    specifying plan format.

    '
causal_audit:
  steelman: 'A behavioural psychologist would note that past abandonment in the same

    modality (apps) is a strong predictor of future abandonment, and that people

    routinely overestimate the salience of new accountability structures. However,

    xbase itself closes this pathway by establishing that this is the first

    attempt the user has structured around external commitments — making the

    past cases structurally non-comparable. A practitioner reading xbase cannot

    apply the base-rate without asking what those commitments are, so the

    mechanism is foreclosed before the focal evidence is introduced.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: '"This is the first time I have structured an attempt around
    external commitments from the start" — neutrally establishes structural differentiation
    from past abandonment episodes without revealing what the commitments are (those
    details live in HH/LH), thereby blocking the behavioral-consistency mechanism
    from applying to this case.'
