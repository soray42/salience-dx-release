seed_id: T6-075
template: T6
domain: open_qa
complexity: medium
xbase: I am deciding whether to renew my language learning app subscription for another
  year to prepare for a B2 proficiency exam in eight months. The annual plan costs
  less than a single month of a private tutor. I have been studying the language on
  and off for two years. This is the first time I have structured an attempt around
  external commitments from the start. {DS}
focal_diagnostic_feature: The user has an active accountability partner meeting weekly,
  an eleven-week unbroken practice slot, and a paid and registered exam date that
  carries a cancellation penalty.
low_diagnostic_proposition: The user has a history of subscribing to language apps
  and abandoning them within weeks.
oracle_action: ANSWER
oracle_focus: Renew the subscription; the established accountability structure, eleven-week
  track record, and registered exam date distinguish this attempt from past abandonment
  patterns, and the cost advantage over tutoring is clear.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not treat past app abandonment as decisive for this
  attempt; ask what accountability structures, practice consistency, and exam commitments
  are in place before advising.
