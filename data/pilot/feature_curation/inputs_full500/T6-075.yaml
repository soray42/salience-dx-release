variants:
  HL:
    distractor: Every language app subscription I have ever paid for has lasted about
      six weeks before I ghost it. I pay, feel motivated, fall off in week five, and
      look back months later with regret.
    diagnosticity: low
    salience: high
    proposition: The user has a history of subscribing to language apps and abandoning
      them within weeks.
    salience_source: B/C — vivid first-person chronology of a recurring failure cycle
      (pay, motivate, fall off, regret) with confident assertion ("every language
      app subscription").
    why_plausible: Past behaviour is a strong predictor of future behaviour in habit
      formation; the recurring pattern described is highly specific and emotionally
      credible, raising the prior that this attempt will repeat.
    why_irrelevant: Xbase establishes that this attempt is the first structured around
      external commitments, closing the same-modality mechanism; the focal evidence
      then reveals what those commitments are, showing this attempt is structurally
      distinct from the past abandonment pattern.
  LL:
    distractor: The user has a history of subscribing to language apps and abandoning
      them within weeks.
    diagnosticity: low
    salience: low
    proposition: The user has a history of subscribing to language apps and abandoning
      them within weeks.
    matched_to: HL
  HH:
    distractor: This time I have a study partner who checks in with me every Tuesday,
      a fixed 40-minute morning slot that has held for eleven weeks, and a registered
      exam date that costs 180 euros to reschedule.
    diagnosticity: high
    salience: high
    proposition: The user has an active accountability partner meeting weekly, an
      eleven-week unbroken practice slot, and a paid and registered exam date that
      carries a cancellation penalty.
    salience_source: Concrete specifics (Tuesday check-in, 40 minutes, eleven weeks,
      180 euro penalty) make the structural difference from past attempts vivid and
      countable.
  LH:
    distractor: The user has an accountability partner, an eleven-week-old daily practice
      slot, and a paid exam registration creating schedule commitment.
    diagnosticity: high
    salience: low
    proposition: The user has an active accountability partner meeting weekly, an
      eleven-week unbroken practice slot, and a paid and registered exam date that
      carries a cancellation penalty.
    matched_to: HH
distractor_direction:
  label: past app abandonment pattern
  description: Treating the user's history of abandoning language app subscriptions
    within weeks as the dominant predictor for this renewal decision.
plausible_alternative_directions:
- label: app content adequacy for B2
  description: The app may not cover B2-level grammar and listening comprehension
    deeply enough; exam-specific suitability is independent of adherence history.
- label: tutor supplementation need
  description: Eight months before a B2 exam, a tutor providing targeted feedback
    on speaking and writing errors could be more effective than app practice alone,
    regardless of cost.
