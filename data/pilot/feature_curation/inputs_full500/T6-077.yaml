    from bees or other pollinators, which is a live candidate for blossom-but-no-fruit
    symptoms in the absence of heat evidence.
- label: calcium or nutrient deficiency
  description: Low calcium or inconsistent watering causing blossom-end rot precursors
    can disrupt fruit development, a plausible candidate when plants appear otherwise
    healthy.
