variants:
  HL:
    distractor: Every time I have dealt with blurry icons in a web app before, it
      turned out to be a viewport meta tag either missing entirely or specifying the
      wrong initial-scale — so that is where my head goes first with this one too.
    diagnosticity: low
    salience: high
    proposition: Past blurry-icon problems were always caused by a missing or misconfigured
      viewport meta tag, so that is likely the cause again.
    salience_source: B/C — vivid personal history pattern ("every time") with confident
      first-instinct framing ("where my head goes first") applies past experience
      authoritatively to the present case.
    why_plausible: Viewport meta tag misconfiguration is a real and commonly encountered
      cause of blurry graphics on mobile web apps, and a developer who has fixed this
      before would confidently prioritise it as the first check in a new blurry-icon
      situation.
    why_irrelevant: Viewport meta tag affects how mobile browsers scale the layout
      viewport and does not determine whether a CDN serves a PNG or SVG file for a
      given URL; the blurring on desktop retina displays — where viewport meta has
      no effect — rules out this mechanism, and the root cause is server-side asset
      delivery, not client-side scaling configuration.
