xbase: The icon set on our web application looks blurry on any monitor with a pixel
  ratio above 1.0, including standard desktop retina displays. The icons are referenced
  in HTML as .svg files and I can see the .svg extensions in the markup. The blurring
  started after we migrated our static assets to a new CDN configuration last month.
  {DS}
focal_diagnostic_feature: The browser Network tab shows each icon URL returns Content-Type
  image/png with a 48x48 pixel raster body; the CDN is serving a legacy PNG fallback
  instead of the SVG source for every .svg request.
low_diagnostic_proposition: Past blurry-icon problems were always caused by a missing
  or misconfigured viewport meta tag, so that is likely the cause again.
oracle_action: ANSWER
oracle_focus: Fix the CDN MIME type mapping so .svg URLs return image/svg+xml with
  the correct SVG source files; verify the SVG assets were correctly uploaded during
  migration and that no legacy PNG fallback rule is still active in the CDN configuration.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to viewport meta tag from past experience;
  check the actual Content-Type and file format returned by icon URLs in the Network
  tab before assuming a client-side scaling configuration issue.
