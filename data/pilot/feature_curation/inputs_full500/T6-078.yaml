distractor_direction:
  label: viewport meta tag misconfiguration
  description: Investigating whether a missing or incorrect viewport meta tag is causing
    the browser to apply incorrect scaling that makes icons appear blurry on high-DPI
    displays.
plausible_alternative_directions:
- label: SVG viewBox or sizing attribute error
  description: SVG files without a viewBox or with mismatched width/height attributes
    can render at unexpected sizes and appear blurry when scaled by the browser, independently
    of CDN delivery.
- label: CSS pixel sizing on SVG elements
  description: Setting fixed pixel dimensions on inline or img-embedded SVGs without
    allowing them to scale with device-pixel-ratio can produce apparent blurring on
    retina displays even when the SVG source is correctly delivered.
- label: incorrect asset upload during CDN migration
  description: If the SVG source files were not included in the migration bundle,
    the CDN might fall back to cached or default assets — a related but distinct failure
    from a MIME-type misconfiguration routing all .svg requests to a fallback.
