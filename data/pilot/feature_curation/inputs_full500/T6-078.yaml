causal_audit:
  steelman: 'A developer might argue that even on desktop Chrome, missing or malformed

    viewport meta can interact with DevTools device emulation settings left

    active, or with certain browser flags that affect pixel-ratio reporting,

    causing unexpected scaling of raster graphics. Some PWA configurations also

    reference viewport meta for display handling in ways that could theoretically

    affect icon rendering. These are weak but not completely absurd pathways to

    investigate in a thorough audit.

    '
