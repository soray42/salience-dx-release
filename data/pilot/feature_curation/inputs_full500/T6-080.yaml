domain: technical_troubleshooting
complexity: high
xbase: Our Next.js app has a Time to Interactive above 7 seconds on initial page load
  for authenticated users. The bundle sizes look normal in webpack-bundle-analyzer,
  and static pages on the same domain load fine. The problem only appears after login
  and only on the main dashboard route. {DS}
focal_diagnostic_feature: The getServerSideProps function on the dashboard route executes
  four database queries sequentially rather than in parallel; each takes 600-800 ms,
  adding approximately 2.8 seconds of server-side latency before any HTML is delivered
  to the client.
low_diagnostic_proposition: Past high TTI cases for this user were consistently caused
  by oversized vendor bundles requiring code-splitting, suggesting the same cause
  here.
oracle_action: ANSWER
oracle_focus: Parallelise the four database queries in getServerSideProps using Promise.all;
  instrument server-side request timing to confirm the 2.8-second reduction, then
  consider caching where the data is stable enough.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to code-splitting when the bundle analyser
  shows normal sizes. Ask for server-side request traces or timing logs on the dashboard
  route's getServerSideProps to check for sequential data fetching.
