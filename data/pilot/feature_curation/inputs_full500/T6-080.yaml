distractor_direction:
  label: Oversized vendor bundle
  description: Investigating whether the main JavaScript bundle size exceeds optimal
    limits and requires code-splitting or lazy loading to reduce Time to Interactive.
plausible_alternative_directions:
- label: Auth middleware latency
  description: The authentication middleware validating the session token on each
    dashboard request could be making a slow external call, adding latency only for
    logged-in users.
- label: Client-side hydration cost
  description: A large server-rendered HTML payload with many interactive components
    could produce a heavy React hydration phase on the client, raising TTI after HTML
    arrives.
- label: Missing CDN edge caching for SSR
  description: If the dashboard route is not cached at the CDN edge and requires a
    cold origin fetch on each request, round-trip time to the origin server could
    inflate TTFB for authenticated users.
