  notes: 'T6 availability inference verified in both HL and LL: HL says "my instinct
    here is still code-splitting"; LL says "suggesting the same cause here." Both
    carry the application-to-now inference per C1/T6. Xbase notes "bundle sizes look
    normal in webpack-bundle-analyzer" and "static pages on the same domain load fine"
    — these close the bundle-size mechanism without naming the actual cause (both
    are observations about symptoms, not root cause identification). The "static pages
    load fine" observation is decisive because static pages use the same bundle but
    bypass getServerSideProps; this narrows candidates to SSR-specific latency without
    identifying the sequential queries (which live only in HH/LH). C4 boundary: the
    xbase narrowing is a symptom fact, not a root-cause disclosure.

    '
causal_audit:
  steelman: 'The webpack-bundle-analyzer may display gzipped or compressed sizes,
    masking a large uncompressed bundle. If the analyser is misconfigured to show
    only the compressed figure, a 2.3 MB uncompressed bundle could look normal at
    600 KB compressed. Additionally, authenticated routes often load more feature-specific
    code (account widgets, permission-gated components) that could be handled by dynamic
    imports. This is the strongest steelman available. However, xbase notes that static
    pages on the same domain load fine — static pages share the same vendor bundle
    chunks as the dashboard route. If the vendor bundle size caused the TTI issue,
    static pages using the same chunks would also exhibit elevated TTI. This rules
    out the bundle size as the differentiating cause. The focal then confirms the
    differentiator is server-side sequential data fetching, which affects only the
    SSR route.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: Static pages on the same domain load fine — these share
    the same bundle but skip getServerSideProps; this observation rules out bundle
    size as the route-specific cause without naming the actual culprit.
