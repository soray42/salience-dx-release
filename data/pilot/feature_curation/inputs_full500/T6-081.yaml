distractor_direction:
  label: wrong image export format
  description: Investigating whether the canvas blurring is caused by using the wrong
    image export format when exporting canvas content, as in the user's prior experience.
plausible_alternative_directions:
- label: CSS scaling mismatch
  description: A CSS width or height rule might be stretching the canvas element beyond
    its natural bitmap size, causing interpolation-based blurring unrelated to devicePixelRatio.
- label: anti-aliasing configuration
  description: The browser's canvas anti-aliasing or image-smoothing setting might
    be active on the high-DPI machine and absent on the standard monitor, causing
    perceptible blurring of drawn shapes.
