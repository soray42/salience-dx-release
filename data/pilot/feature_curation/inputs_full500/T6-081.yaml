domain: technical_troubleshooting
complexity: low
xbase: My HTML canvas element is rendering text and shapes that look blurry on my
  high-DPI screen. The canvas works fine on a standard monitor. I have not changed
  the drawing code this week and the same browser version is on both machines. {DS}
focal_diagnostic_feature: The canvas width and height attributes match the CSS pixel
  dimensions without being multiplied by window.devicePixelRatio, so the bitmap is
  rendered at half the physical resolution on the high-DPI display.
low_diagnostic_proposition: Past canvas rendering issues for this user were generally
  caused by using the wrong image export format, so the same cause probably applies
  now.
oracle_action: ANSWER
oracle_focus: Multiply the canvas width and height attributes by window.devicePixelRatio,
  then scale the context down by the same factor using ctx.scale(); this aligns the
  bitmap to physical pixels and eliminates blurring on high-DPI screens.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to the image-format explanation from past
  experience. Ask about canvas sizing relative to devicePixelRatio and whether the
  bitmap dimensions account for pixel density on the high-DPI machine.
