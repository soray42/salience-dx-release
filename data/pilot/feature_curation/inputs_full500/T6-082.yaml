  description: Investigating whether the tomato plants are failing to set fruit because
    the soil is too dry during hot weather, repeating a pattern the user has experienced
    in past seasons.
plausible_alternative_directions:
- label: pollinator absence
  description: Insufficient bee or insect activity could prevent tomato flowers from
    being pollinated, causing consistent blossom drop even when the plant and conditions
    appear healthy.
- label: excessive nitrogen
  description: High nitrogen levels in the raised bed soil can push vegetative growth
    at the expense of fruiting, causing healthy-looking plants that flower but do
    not set fruit.
- label: variety not suited to conditions
  description: Some tomato varieties require specific temperature ranges or daylength
    cues for reliable fruit set; the planted variety may be ill-matched to the current
    climate conditions.
