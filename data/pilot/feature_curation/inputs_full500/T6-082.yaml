causal_audit:
  steelman: 'Drought stress during heat waves is one of the most common reasons tomato
    plants fail

    to set fruit, and a grower who has witnessed this multiple times has legitimate
    empirical

    grounds to suspect it again. Soil that looks adequate on the surface can be dry
    at root

    depth in hot weather, especially in raised beds that drain quickly. A practitioner
    would

    reasonably ask about watering frequency and soil moisture before concluding the
    problem

    is heat-induced pollen failure. However, xbase explicitly states the leaves are
    healthy

    green with no wilting — both are reliable visual indicators of adequate soil moisture.

    Drought-stressed tomatoes show clear wilting and leaf curl well before flower
    drop.

    The absence of any such visual stress indicator structurally deprioritises underwatering

    as the leading hypothesis in this case, and the focal feature (night temperatures
    above

    the pollen-viability threshold for three weeks) provides a complete and independent

    explanation for persistent blossom drop.

    '
  steelman_verdict: no_defensible_mechanism
