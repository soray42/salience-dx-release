distractor_direction:
  label: Defective replacement tubes
  description: Treating the recurring flats as bad luck with a series of defective
    or fragile inner tubes rather than investigating the tire casing for a persistent
    embedded cause.
plausible_alternative_directions:
- label: Pinch flat from low tyre pressure
  description: Consistently riding with under-inflated tyres can cause pinch flats
    that feel like spontaneous tube failures, especially on road bikes.
- label: Rim tape failure
  description: A gap or tear in the rim tape exposing a spoke hole could puncture
    tubes at a consistent location even though the tape looks intact from the outside.
- label: Valve stem failure
  description: A valve core that unseats or a stem that cracks near the rim hole can
    cause repeated slow deflation that mimics puncture behaviour.
