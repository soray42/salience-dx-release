xbase: My rear tire has flatted three times in the past two weeks on the same road
  bike. Each time I replace the inner tube and the tire holds air for one or two rides,
  then goes flat again. The bike lives indoors, the wheel rim looks fine, and I have
  checked the rim tape each time. {DS}
focal_diagnostic_feature: Careful fingertip inspection of the inside of the tire casing
  reveals a 4 mm glass shard embedded in the rubber and pointing inward, which pierces
  each replacement tube after one or two rides.
low_diagnostic_proposition: All prior flats for this user were simple tube punctures,
  so this recurrence is probably another defective or unlucky tube.
