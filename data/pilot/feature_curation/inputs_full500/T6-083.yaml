oracle_focus: Remove the embedded glass shard from the tire casing — or replace the
  tire if the shard has left a through-hole — before fitting another tube; tube replacement
  alone will not fix a recurring casing-embedded cause.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to a defective or unlucky tube from prior
  experience. Ask whether the tire casing itself has been checked for embedded debris
