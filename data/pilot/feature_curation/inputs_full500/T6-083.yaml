causal_audit:
  steelman: 'Three consecutive tube failures in two weeks is unusual enough that defective

    tubes from the same batch are a plausible explanation. If a batch of inner tubes

    has a manufacturing defect — thin walls, faulty valve crimping — multiple units

    from the same pack could fail in quick succession. Past experience of tube punctures

    is entirely consistent with this scenario. However, the past experience provides
    no

    information about whether THIS tire casing contains debris, and the rim tape having

    been checked each time rules out the easiest alternative. The embedded-shard focal

    evidence is the only finding that explains why each individual new tube fails
    at

    roughly the same usage point. Defective batch is a prior but is defeated by the

    specific physical finding.

    '
