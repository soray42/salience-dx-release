seed_id: T6-084
template: T6
domain: technical_troubleshooting
complexity: high
xbase: Our Redis Streams consumer group has been reporting growing lag for three days.
  The consumer service is running — its health check returns 200 — and the stream
  has data in it. A restart of the consumer service two days ago did not resolve the
  issue. {DS}
focal_diagnostic_feature: XPENDING on the consumer group shows hundreds of thousands
  of unacknowledged entries accumulating in the pending list, and the consumer code
  calls XREAD to fetch messages but contains no XACK call anywhere, leaving every
  fetched message pending indefinitely.
low_diagnostic_proposition: Past Redis consumer failures for this user were always
  a password-change config mismatch, so this growing lag is probably the same issue.
oracle_action: ANSWER
oracle_focus: Add XACK calls to the consumer code after successfully processing each
  message; also define a redelivery and dead-letter strategy for messages that fail
  processing, to prevent indefinite PEL growth on bad records.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply the past password-mismatch pattern automatically.
  Ask what XPENDING shows for this consumer group and whether the consumer code contains
  XACK calls before investigating authentication.
