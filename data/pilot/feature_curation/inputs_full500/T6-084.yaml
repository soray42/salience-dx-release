distractor_direction:
  label: Redis AUTH config mismatch
  description: Investigating whether a Redis password change that the consumer's configuration
    has not picked up is preventing authentication and causing the consumer to fail
    silently while appearing healthy.
plausible_alternative_directions:
- label: Consumer group offset regression
  description: A misconfigured or reset consumer group offset could cause the consumer
    to attempt to replay a huge backlog from an earlier position, making lag appear
    to grow even if processing is occurring.
- label: Stream retention deletion
  description: If the stream's MAXLEN trim is set too aggressively, messages could
    be deleted before the consumer reads them, manifesting as growing apparent lag
    without actual pending entries.
- label: Network partition to Redis
  description: Intermittent connectivity between the consumer service and the Redis
    instance could cause the consumer to stall without surfacing obvious errors at
    the health endpoint level.
