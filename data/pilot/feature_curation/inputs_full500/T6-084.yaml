causal_audit:
  steelman: 'A Redis password change that the consumer''s configuration has not been
    updated

    to reflect would cause authentication failures on every XREAD attempt. If the

    health check endpoint does not test Redis connectivity, the service would still

    return 200 while silently failing to read the stream. This is a plausible

    scenario where apparent "running" status masks a real connectivity failure —

    a common operational gap. The seed is clean because the focal evidence (XPENDING

    showing 280,000 entries) is incompatible with AUTH failure: XPENDING entries are

    messages that have been READ via XREAD and entered the pending state — if AUTH

    were failing, XREAD would error and no entries would accumulate in the PEL.

    The 280,000 pending entries prove XREAD is succeeding, which defeats the AUTH

    steelman at the focal-evidence stage rather than at xbase.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — xbase does not close the AUTH pathway (health check
    200 is ambiguous); the AUTH hypothesis remains live from xbase and is defeated
    only by the XPENDING focal evidence in HH/LH.
