causal_audit:
  steelman: 'If the user has previously owned a hydraulic brake bike and that bike''s
    brake sponginess was fixed by bleeding, the pattern-match to ''spongy brakes''
    is understandable. Air in a hydraulic line is a real and common cause of spongy
    feel. However, the HL text itself already notes these are cable-actuated rim brakes,
    not hydraulics, which means there is no hydraulic fluid to bleed. A cable brake
    has no bleed port and no fluid circuit; sponginess from worn pads is a fundamentally
    different mechanism with no overlap with hydraulic air ingress.

    '
  steelman_verdict: no_defensible_mechanism
