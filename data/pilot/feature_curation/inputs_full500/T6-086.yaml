seed_id: T6-086
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: Our Google Cloud Pub/Sub push subscription is delivering messages to our subscriber
  webhook, but about five percent of deliveries return HTTP 502 and the messages are
  retried indefinitely. The subscriber service shows healthy CPU and memory during
  the failures. No infrastructure changes were made this week. NAT gateway logs show
  zero dropped sessions during the entire failure window. {DS}
focal_diagnostic_feature: All failing deliveries carry payloads above 900 kilobytes,
  and the web framework enforces a 1 MB request body limit that returns HTTP 502 when
  that limit is exceeded.
low_diagnostic_proposition: Prior Pub/Sub 502 errors at this organisation were caused
  by NAT gateway misconfiguration, so the current 502s are probably the same problem
  again.
oracle_action: ANSWER
oracle_focus: Raise the framework request body limit above the maximum message size
  or configure the publisher to split large messages; the 502s are caused by the body-size
  limit being exceeded, not NAT routing.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume NAT misconfiguration from past incidents.
  Ask for payload size distribution on the failing deliveries and the subscriber framework's
  request body limit configuration.
