causal_audit:
  steelman: 'A NAT gateway misconfiguration that imposes a packet-level MTU or connection-level
    restriction could plausibly cause intermittent 502s on Pub/Sub push deliveries
    if the NAT was randomly dropping sessions. Past incidents attributed to NAT at
    this organisation make it a live hypothesis based on institutional experience.
    However, if NAT were the cause, the failure rate would be stochastic across all
    deliveries or correlated with connection age, not with payload size; a NAT rule
    does not inspect HTTP request body bytes. The correlation of all failures with
    payloads above 900 KB is inconsistent with any NAT-layer mechanism, which operates
    at the network transport layer below HTTP body parsing.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — payload-size correlation is the decisive discriminator
    and lives only in HH/LH; xbase correctly says no infrastructure changed, which
    makes NAT regression unlikely but does not by itself rule it out
