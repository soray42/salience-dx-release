distractor_direction:
  label: NAT gateway misconfiguration
  description: Investigating whether a misconfigured NAT gateway is dropping outbound
    Pub/Sub delivery traffic, causing HTTP 502 errors as it did in previous incidents.
plausible_alternative_directions:
- label: Subscriber endpoint timeout
  description: If the subscriber takes longer than the Pub/Sub acknowledgement deadline
    to process messages
  Pub/Sub will treat the delivery as failed and retry: null
  appearing as a recurring 502 pattern.: null
- label: TLS certificate mismatch
  description: An expired or hostname-mismatched TLS certificate on the subscriber
    endpoint can cause Pub/Sub delivery to fail with a connection error reported as
    502 by the push transport layer.
- label: Pub/Sub push quota limit
  description: Per-region push delivery quota exhaustion can cause a fraction of deliveries
    to be rejected with a non-200 response that looks like a subscriber-side 502.
