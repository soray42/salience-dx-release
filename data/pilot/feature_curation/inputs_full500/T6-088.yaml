seed_id: T6-088
template: T6
domain: technical_troubleshooting
complexity: high
xbase: Our Kinesis data stream has one shard receiving nearly all the traffic while
  the other five shards sit almost idle. Producer throughput is within the provisioned
  limit across all shards combined. We added two new producer services last week but
  have not changed the stream's shard count. {DS}
focal_diagnostic_feature: All new producer services are sending records with a partition
  key of the string literal "default", resulting in a single shard receiving every
  record from those producers while the existing hashed keys distribute normally.
low_diagnostic_proposition: The user's previous Kinesis hot-shard problems were always
  caused by Lambda consumer throttling feeding back into producer retries, so this
  pattern is likely the same issue.
oracle_action: ANSWER
oracle_focus: 'Fix the partition key in the two new producer services: replace the
  static ''default'' key with a high-cardinality value such as a record ID or timestamp
  component so records distribute across all shards.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply the previous Lambda-throttling explanation
  to this case. Ask for the partition keys used by each producer and whether the hot
  shard load correlates with traffic from the new services before investigating consumer-side
  throttling.
