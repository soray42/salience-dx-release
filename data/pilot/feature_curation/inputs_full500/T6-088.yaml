causal_audit:
  steelman: 'A senior Kinesis engineer would legitimately rank Lambda consumer throttling
    as a top hypothesis: it is a documented cause of hot shards, and the timing (new
    services added last week) could equally explain a new consumer misconfiguration.
    The user''s past experience is statistically relevant. However, the focal feature
    establishes the cause at the producer key layer: both new producers use a static
    ''default'' partition key, which deterministically routes all their records to
    one shard. This is a separate mechanism from consumer throttling — it would produce
    the same hot-shard symptom even with zero Lambda consumers. The structural difference
    (producer key vs consumer throttle) means the past incidents do not predict the
    present cause.

    '
