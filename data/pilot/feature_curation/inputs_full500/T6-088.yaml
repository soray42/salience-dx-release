distractor_direction:
  label: Lambda consumer throttling feedback
  description: Investigating whether Lambda consumer throttling is causing producer
    retry accumulation that concentrates traffic on one shard.
plausible_alternative_directions:
- label: Shard-level write limit breach
  description: Checking whether the hot shard is simply exceeding its 1 MB/s or 1,000
    records/s write limit and whether resharding is needed independently of the key
    distribution.
- label: Kinesis Enhanced Fan-Out contention
  description: Assessing whether multiple consumers using Enhanced Fan-Out on the
    same shard are competing for read throughput, creating apparent imbalance in monitoring
    metrics.
- label: Producer batching skew
  description: Investigating whether one of the existing producers recently changed
    its batching strategy in a way that concentrates records toward a narrower key
    space.
