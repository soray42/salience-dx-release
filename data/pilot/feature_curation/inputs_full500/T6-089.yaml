causal_audit:
  steelman: 'An experienced insurance broker might point out that home policies vary
    widely; some do

    exclude indoor electronics or place low sub-limits on office equipment, so the
    user''s

    recalled pattern could be directionally correct for policies with weak contents
    coverage.

    However, the focal feature reveals that the controlling exclusion here is pre-existing

    structural damage — a categorically different policy provision from a contents
    sub-limit.

    Even if the contents were fully covered, the pre-existing crack documented in
    the

    inspection report is the mechanism by which the insurer would deny the claim,
    because the

    storm caused the skylight failure only by acting on an already-cracked structure.
    The

    contents-exclusion pattern cannot predict or explain that specific exclusion.

