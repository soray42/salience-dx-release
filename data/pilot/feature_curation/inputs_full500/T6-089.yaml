domain: open_qa
complexity: low
xbase: A storm caused a tree branch to fall and crack the skylight in my home office.
  Water came in and damaged the desk and two monitors. I have a home insurance policy
  that I renewed three months ago. I have not filed any claim before. I am trying
  to figure out whether to file a claim or pay for repairs myself. {DS}
focal_diagnostic_feature: The skylight had a documented pre-existing crack noted in
  the renewal inspection report, and the policy excludes losses arising from pre-existing
  damage to the structure.
low_diagnostic_proposition: The claim is likely to be denied because home insurance
  policies typically do not cover storm damage to contents inside the property.
oracle_action: ANSWER
oracle_focus: The pre-existing structural damage exclusion is the controlling issue;
  the claim is at high risk of denial on that basis regardless of storm coverage for
  contents, so the user should review the inspection report and exclusion clause before
  filing and consider whether the repair cost justifies the attempt.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply a blanket contents-exclusion rule. Ask for
  the specific policy coverages, the storm damage scope, and whether the damaged items
  and structure are within the covered categories.
