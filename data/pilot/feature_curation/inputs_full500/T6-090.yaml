causal_audit:
  steelman: 'An experienced CDN engineer might argue that edge-node memory pressure
    eviction is plausible

    because the fraction of bypassed requests is small and intermittent, matching
    what eviction

    patterns look like during transient traffic spikes on nodes with limited cache
    capacity.

    However, xbase now states that edge-node memory metrics from the CDN provider
    console are

    all nominal, which directly removes the memory-pressure precondition for eviction.
    Without

    elevated memory usage on the edge nodes, there is no mechanism by which cache
    objects would

    be evicted. The focal feature additionally shows that bypassed requests carry
    a specific

    session cookie absent from the strip list — a configuration issue that concentrates
    misses

    on cookie-bearing traffic rather than spreading them across all request types
    as eviction

    would. Both the xbase closure and the focal feature independently refute the eviction

    hypothesis.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states "Edge-node memory metrics from the CDN provider
    console are all nominal," directly ruling out memory pressure as a precondition
    for eviction. This forecloses the distractor's sole constructible mechanism without
    naming the session-cookie cause.
