variants:
  HL:
    distractor: Every time I have seen intermittent CDN hit-rate degradation like
      this, it traced back to edge nodes evicting cached objects under memory pressure
      and sending those requests to origin as misses, so that is my first instinct
      here.
    diagnosticity: low
    salience: high
    proposition: Cache misses happen because CDN edge nodes lose their cached objects
      during memory pressure and must re-fetch from origin, which I have seen cause
      the same hit-rate pattern before.
    salience_source: B — coherent recurring personal pattern with causal narrative
      (memory pressure → eviction → miss); C — "every time" and "first instinct" carry
      first-person confidence.
    why_plausible: Cache eviction under memory pressure is a real CDN failure mode
      that genuinely produces intermittent misses with no BYPASS label, so a practitioner
      who has seen it before would naturally reach for it first.
    why_irrelevant: xbase confirms edge-node memory metrics are all nominal, ruling
      out memory pressure as a driver; the decisive feature then shows the bypassed
      requests carry a session cookie absent from the CDN strip list — a configuration
      gap that produces selective misses regardless of edge-node memory state.
  LL:
    distractor: CDN edge-node memory pressure causing cache evictions has produced
      the same hit-rate pattern in my experience before.
    diagnosticity: low
    salience: low
    proposition: Cache misses happen because CDN edge nodes lose their cached objects
      during memory pressure and must re-fetch from origin, which I have seen cause
      the same hit-rate pattern before.
    matched_to: HL
  HH:
    distractor: Origin logs show every bypassed request carries a Set-Session cookie
      and cache-hits carry none; the CDN strip list was frozen eight months ago, the
      session cookie shipped six months ago and was never added to it, so requests
      bearing that cookie now bypass the cache entirely.
    diagnosticity: high
    salience: high
    proposition: Requests carrying a session cookie are being forwarded to the origin
      without cache lookup because the CDN strips cache-eligible cookies for most
      users but the session cookie was added after the CDN forward-cookie list was
      last updated, so it now passes through unfiltered and forces a cache bypass.
    salience_source: First-person origin log analysis isolates the cookie correlation,
      and the concrete timeline (eight months vs six months) makes the configuration
      gap traceable.
  LH:
    distractor: Bypassed requests carry a session cookie absent from the CDN strip
      list, introduced after that configuration was last updated.
    diagnosticity: high
    salience: low
    proposition: Requests carrying a session cookie are being forwarded to the origin
      without cache lookup because the CDN strips cache-eligible cookies for most
      users but the session cookie was added after the CDN forward-cookie list was
      last updated, so it now passes through unfiltered and forces a cache bypass.
    matched_to: HH
distractor_direction:
  label: Edge-node cache eviction under memory pressure
  description: Investigating whether CDN edge nodes are evicting cached objects during
    memory pressure events, forcing those requests to the origin and showing as misses
    rather than bypasses.
plausible_alternative_directions:
- label: Vary header mismatch
  description: An upstream Vary header may be causing the CDN to create too many cache
    variants per URL, effectively making many requests miss because their exact variant
    combination has not been cached.
- label: Origin cache-control header inconsistency
  description: Some origin responses may intermittently set no-store or no-cache,
    preventing the CDN from caching those specific responses.
leak_audit:
  ll_atomic_claims:
  - CDN edge-node memory pressure has caused cache evictions in the user's past experience.
  - Those evictions produced the same hit-rate degradation pattern the user now observes.
  hh_atomic_claims:
  - Capturing request headers on the origin for bypassed requests shows they all carry
    a session cookie.
  - Non-bypassed requests do not carry that cookie.
  - The CDN forwarding configuration was last updated eight months ago.
  - The session cookie was introduced six months ago.
  - The session cookie was therefore never added to the strip list.
  - Its presence now triggers a cache bypass on every request that carries it.
