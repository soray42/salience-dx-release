seed_id: T6-090
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: Our CDN-fronted marketing site intermittently serves requests from the origin
  instead of the edge cache, driving unexpected origin costs and occasionally leaking
  personalisation logic. It happens only on a small fraction of requests, and our
  CDN hit-rate dashboard shows the bypassed requests as cache-MISS, not BYPASS. Edge-node
  memory metrics from the CDN provider console are all nominal. We changed nothing
  in the CDN rules recently. {DS}
focal_diagnostic_feature: Requests carrying a session cookie are being forwarded to
  the origin without cache lookup because the CDN strips cache-eligible cookies for
  most users but the session cookie was added after the CDN forward-cookie list was
  last updated, so it now passes through unfiltered and forces a cache bypass.
low_diagnostic_proposition: Cache misses happen because CDN edge nodes lose their
  cached objects during memory pressure and must re-fetch from origin, which I have
  seen cause the same hit-rate pattern before.
oracle_action: ASK
oracle_focus: 'Audit the CDN''s cookie forwarding configuration: check whether the
  session cookie is being forwarded to the origin on the affected requests and add
  it to the strip or ignore list so cache lookups proceed normally for requests that
  should not vary by session.'
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply the past edge-node memory-pressure explanation.
  Ask for the request headers on bypassed requests, specifically which cookies are
  forwarded, and how the CDN cookie-forwarding rules are currently configured.
