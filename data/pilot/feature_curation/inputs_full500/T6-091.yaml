xbase: I noticed discoloration on the bedroom ceiling a few months ago and assumed
  it would sort itself out. The staining has since spread, and there is now visible
  damp in one corner. I want to file a home contents insurance claim for the damaged
  mattress and flooring. {DS}
focal_diagnostic_feature: The policy explicitly excludes damage caused by gradual
  or repeated water ingress, and the slow ceiling leak that developed over several
  months falls squarely within that exclusion, so the claim will be rejected.
low_diagnostic_proposition: Past home insurance claims were all settled successfully,
  so this one will be approved too.
oracle_action: ANSWER
oracle_focus: Do not file the contents claim; the gradual-water-ingress exclusion
  will defeat it. Instead address the source of the leak and consult the insurer about
  what repair-related coverage, if any, applies.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume approval based on past claim history. Ask
  for the policy's exclusions section, particularly gradual-damage and water-ingress
  clauses, before advising on the claim.
