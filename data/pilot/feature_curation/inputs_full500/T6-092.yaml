causal_audit:
  steelman: 'A senior CDN engineer might argue: CloudFront console displays may not
    immediately reflect infrastructure-level TTL overrides from edge or Lambda@Edge
    functions; a hidden programmatic TTL override in a Cloudflare Worker or Lambda@Edge
    response could be setting a shorter effective TTL that bypasses the behavior setting.
    On this theory, a TTL reset is genuinely worth ruling out even with the console
    showing 300 seconds.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: xbase states 'I already confirmed it is set to 300 seconds'
    — this closes the simple console-lag pathway. The steelman's Lambda@Edge/hidden-override
    scenario would also not explain incorrect results for different search queries,
    which is explained only by the cache-key misconfiguration (focal feature).
