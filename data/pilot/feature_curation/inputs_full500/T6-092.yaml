seed_id: T6-092
template: T6
domain: technical_troubleshooting
complexity: high
xbase: Our search API, served through CloudFront, has been returning stale or incorrect
  results to some users for five days. The cache TTL looks fine — I already confirmed
  it is set to 300 seconds. Request volume has not changed significantly, and there
  have been no deploys to the origin service this week. {DS}
focal_diagnostic_feature: The CloudFront cache behavior forwards all query strings
  to origin but includes none of them in the cache key, so requests for different
  search terms share one cached response until it expires.
low_diagnostic_proposition: Past CloudFront issues were all caused by TTL being too
  short, so a hidden TTL reset is probably responsible here too.
oracle_action: ANSWER
oracle_focus: Fix the cache behavior to include search query strings in the cache
  key, ensuring each distinct query gets its own cached response rather than sharing
  a single stale entry.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a TTL reset from past experience when the
  console confirms 300 seconds. Ask for the cache behavior's query-string forwarding
  and cache-key configuration before diagnosing.
