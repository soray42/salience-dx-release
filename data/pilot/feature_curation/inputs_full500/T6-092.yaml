variants:
  HL:
    distractor: Every CloudFront issue I have ever debugged came down to a TTL that
      was set too low — pages expiring before they got any meaningful cache hits.
      My first instinct is that something reset the TTL shorter again, even though
      the console shows 300 seconds.
    diagnosticity: low
    salience: high
    proposition: Past CloudFront issues were all caused by TTL being too short, so
      a hidden TTL reset is probably responsible here too.
    salience_source: Dimension B (narrative coherence) — vivid characterisation of
      past failure mode with specific mechanism detail; dimension C (confident assertion)
      — 'every CloudFront issue I have ever debugged' frames the pattern as universal
      personal experience.
    why_plausible: TTL misconfiguration is a common real cause of stale CDN responses;
      a practitioner who has seen it repeatedly will legitimately suspect it first,
      and the hedged acknowledgement of the console reading adds apparent self-awareness.
    why_irrelevant: The xbase explicitly confirms TTL is 300 seconds; returning incorrect
      results for different queries is not explained by a short TTL but by a missing
      query-string dimension in the cache key — a structurally different problem.
  LL:
    distractor: My past CloudFront issues were all caused by TTL being too short;
      I suspect the same here despite the 300-second reading.
    diagnosticity: low
    salience: low
    proposition: Past CloudFront issues were all caused by TTL being too short, so
      a hidden TTL reset is probably responsible here too.
    matched_to: HL
  HH:
    distractor: The CloudFront cache behavior is configured to forward all query strings
      to origin but includes none of them in the cache key — so a search for 'laptops'
      and a search for 'headphones' both return the same cached response until it
      expires.
    diagnosticity: high
    salience: high
    proposition: The CloudFront cache behavior forwards all query strings to origin
      but includes none of them in the cache key, so requests for different search
      terms share one cached response until it expires.
    salience_source: Dimension B (narrative coherence) — concrete worked example (two
      named search terms) makes the misconfiguration's effect immediately tangible;
      dimension C (confident assertion) — the configuration state is described precisely
      and definitively.
  LH:
    distractor: Query strings are forwarded to origin but excluded from the cache
      key, so all search requests share one cached response.
    diagnosticity: high
    salience: low
    proposition: The CloudFront cache behavior forwards all query strings to origin
      but includes none of them in the cache key, so requests for different search
      terms share one cached response until it expires.
    matched_to: HH
distractor_direction:
  label: hidden TTL reset
  description: Investigating whether an undisclosed configuration change reset the
    CloudFront TTL to a shorter value despite the console displaying 300 seconds.
plausible_alternative_directions:
- label: origin data staleness
  description: The origin service is returning stale or cached data from its own internal
    layer regardless of CDN configuration.
- label: cache invalidation failure
  description: A recent content update was not propagated via an invalidation request,
    leaving old cache entries across edge nodes.
- label: geo-routing misconfiguration
  description: Certain user populations are routing to edge PoPs with older cache
    state due to a routing policy misconfiguration.
