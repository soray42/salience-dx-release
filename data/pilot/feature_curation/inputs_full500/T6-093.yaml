seed_id: T6-093
template: T6
domain: open_qa
complexity: low
xbase: My smartphone was stolen from my coat pocket four days ago. I have a standalone
  mobile insurance policy that I pay for monthly. I did not report it to the police
  until yesterday because I was away from home. Now I want to know whether I should
  file an insurance claim for the phone. {DS}
focal_diagnostic_feature: The policy's claims conditions require the loss or theft
  to be reported to the insurer within 24 hours of discovery; the phone was taken
  four days ago, so the claim is time-barred.
low_diagnostic_proposition: Past phone insurance claims were always handled quickly
  and paid without difficulty, so this one will be approved too.
oracle_action: ANSWER
oracle_focus: Do not file the claim expecting a payout; the 24-hour reporting window
  has passed and the claim will almost certainly be rejected on procedural grounds.
  Contact the insurer to confirm and ask whether any appeal or exceptional circumstance
  process exists.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume approval from past claim history. Ask for
  the policy's reporting-window requirement and when the theft was discovered before
  advising on the claim.
