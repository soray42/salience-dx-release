variants:
  HL:
    distractor: Every time I have needed to claim on phone insurance — a cracked screen
      two years ago, a water-damage incident last year — the process was quick and
      they paid without any trouble. I am expecting the same experience here.
    diagnosticity: low
    salience: high
    proposition: Past phone insurance claims were always handled quickly and paid
      without difficulty, so this one will be approved too.
    salience_source: Dimension B (narrative coherence) — two specific named incidents
      (cracked screen, water damage) with time anchors give the pattern vivid personal
      texture; dimension C (confident assertion) — 'I am expecting the same experience
      here' stated without hedging.
    why_plausible: A consistent track record of smooth, paid claims with the same
      insurer is a reasonable basis for optimism; insurers with cooperative reputations
      do tend to approve clear, evidenced claims.
    why_irrelevant: The past claims were presumably reported promptly; a 24-hour reporting
      window is a contractual condition precedent, and missing it voids the claim
      regardless of the insurer's goodwill or the user's payment history.
  LL:
    distractor: My past phone insurance claims were always handled quickly and paid
      without difficulty, so I expect this one will be too.
    diagnosticity: low
    salience: low
    proposition: Past phone insurance claims were always handled quickly and paid
      without difficulty, so this one will be approved too.
    matched_to: HL
  HH:
    distractor: The policy's claims conditions require the loss or theft to be reported
      to the insurer within 24 hours of the customer discovering it; the phone was
      taken four days ago, so the window closed on the first evening.
    diagnosticity: high
    salience: high
    proposition: The policy's claims conditions require the loss or theft to be reported
      to the insurer within 24 hours of discovery; the phone was taken four days ago,
      so the claim is time-barred.
    salience_source: Dimension B (narrative coherence) — policy condition stated precisely
      with the causal implication drawn explicitly; dimension C (confident assertion)
      — 'the window closed on the first evening' delivers the consequence without
      qualification.
  LH:
    distractor: The policy requires insurer notification within 24 hours of discovery;
      the theft occurred four days ago, so the claim is time-barred.
    diagnosticity: high
    salience: low
    proposition: The policy's claims conditions require the loss or theft to be reported
      to the insurer within 24 hours of discovery; the phone was taken four days ago,
      so the claim is time-barred.
    matched_to: HH
distractor_direction:
  label: prior-claim approval track record
  description: Treating the user's history of successfully paid phone insurance claims
    as a reliable predictor that the current theft claim will also be approved.
plausible_alternative_directions:
- label: police report adequacy
  description: The insurer may require the crime reference number from a timely police
    report; the delayed report may itself be a grounds for rejection independent of
    the insurer notification window.
- label: proof of ownership requirement
  description: The insurer may require purchase receipts or IMEI documentation that
    the user may not have readily available, affecting claim eligibility.
