seed_id: T6-094
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: Our CDN has been serving stale product images to customers for two days. When
  we upload replacement files directly to the origin, the new versions appear there
  immediately. Cache-Control headers on all origin image responses are set to max-age=86400.
  Our deployment script calls the CDN purge API after each upload. {DS}
focal_diagnostic_feature: Every purge API call from the deployment script returns
  HTTP 403 because the API token lacks the Cache Purge permission scope, so invalidation
  requests are silently rejected after each upload.
low_diagnostic_proposition: The user's past stale-CDN incidents were caused by missing
  or misconfigured Cache-Control headers on the origin, and this is probably the same
  issue.
oracle_action: ANSWER
oracle_focus: Grant the Cache Purge permission scope to the API token used by the
  deployment script, or rotate to a token that already holds it, then verify purge
  calls return 200 and confirm edge nodes serve fresh images.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not apply the past Cache-Control explanation to a
  case where headers are already set; ask for the HTTP response codes returned by
  the CDN purge API calls and review the token's permission scopes before touching
  header configuration.
