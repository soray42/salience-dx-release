distractor_direction:
  label: Cache-Control header misconfiguration
  description: Investigating whether missing or incorrectly set Cache-Control headers
    on the origin are causing the CDN to serve stale images, based on the user's prior
    experience with identical symptoms.
plausible_alternative_directions:
- label: CDN origin-pull configuration
  description: The CDN may not be configured to respect Cache-Control headers from
    this origin, or the origin-pull settings may be overriding them with a different
    TTL policy.
- label: Partial edge propagation
  description: Purge commands may succeed for some edge nodes but not propagate to
    all PoPs, leaving certain geographic regions serving stale content.
- label: Upload path mismatch
  description: Replacement files may be written to a different path or bucket prefix
    than the one the CDN origin pull is configured to serve, so the origin appears
    updated but the CDN fetches from the old location.
