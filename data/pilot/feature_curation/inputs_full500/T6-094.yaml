  hh_word_count: 38
  lh_word_count: 19
  notes: 'T6 availability inference ("this is probably the same issue") is propositional
    content

    under C1 and appears in both HL and LL as required. xbase explicitly states

    Cache-Control headers are set to max-age=86400, which narrows but does not fully

    close the distractor pathway (the value could still be considered a misconfiguration

    by some practitioners, keeping C4 clean). Decisive focal content lives only in
    HH/LH.

    HH atomic claims 3 and 4 (invalidation request triggered, silently rejected) are

    mechanistic elaborations of claims 1+2 that LH captures implicitly through the

    causal structure; they are not independently testable claims beyond the 403+scope

    combination. Steelman verdict confirmed as no_defensible_mechanism: xbase confirms

    headers are present and the deployment script already calls the purge API, so
    the

    Cache-Control hypothesis has no remaining explanatory gap to fill for this case.

    '
causal_audit:
  steelman: 'A senior CDN engineer might argue: setting Cache-Control to max-age=86400
    does not

    guarantee the CDN respects that header — some CDN configurations override origin

    headers with their own TTL rules, and "misconfigured" could include a CDN-side

    override rather than a missing origin header. Under this reading, the past Cache-Control

    pattern remains a live hypothesis even when the origin header value appears correct.

    Additionally, a new image path might carry a different Vary or Cache-Control value

    that behaves differently at edge nodes.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: The deployment script is already calling the CDN purge
    API after every upload, which means the team is actively performing invalidation
    — a CDN-side TTL override would still yield fresh content once a purge succeeded.
    The relevant question is why purges are not working, not why headers are set as
    they are. xbase thus forecloses the Cache-Control mechanism as the explanatory
    gap.
