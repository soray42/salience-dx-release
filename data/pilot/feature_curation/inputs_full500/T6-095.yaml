variants:
  HL:
    distractor: Every time I have quit a gym before, I have regretted it by February,
      when the cold hits and I end up doing nothing for weeks, so my instinct is to
      keep paying rather than go through that again.
    diagnosticity: low
    salience: high
    proposition: The user reports regretting past gym cancellations during winter
      months when cold weather reduced outdoor motivation.
    salience_source: B/C — specific month named ('by February'), vivid consequence
      framing ('doing nothing for weeks'), confident first-instinct conclusion ('keep
      paying rather than go through that again').
    why_plausible: For most people, outdoor exercise does drop in winter, and prior
      experience of that failure is directly relevant — a decision-maker could reasonably
      treat this as predictive.
    why_irrelevant: The past winters that drove regret are structurally different
      from the current user's situation; the focal feature shows an unbroken outdoor
      habit through both recent winters, meaning the prior failure pattern does not
      apply.
  LL:
    distractor: The user reports regretting past gym cancellations during winter months
      when cold weather reduced outdoor motivation, leaving them inactive for weeks.
    diagnosticity: low
    salience: low
    proposition: The user reports regretting past gym cancellations during winter
      months when cold weather reduced outdoor motivation.
    matched_to: HL
  HH:
    distractor: My training log shows four or more outdoor sessions every week for
      the past 18 months, including through both recent winters, with no gap longer
      than five days even in the coldest stretches.
    diagnosticity: high
    salience: high
    proposition: The user's training log shows four or more outdoor sessions every
      week for the past 18 months without any gap longer than five days, including
      through both recent winters.
    salience_source: B/C — quantified log data ('four or more sessions'), precise
      timespan ('18 months'), specific max-gap claim ('five days'), and explicit winter
      coverage stated.
  LH:
    distractor: The training log shows four-plus outdoor sessions per week over 18
      months including both winters, with no gap longer than five days.
    diagnosticity: high
    salience: low
    proposition: The user's training log shows four or more outdoor sessions every
      week for the past 18 months without any gap longer than five days, including
      through both recent winters.
    matched_to: HH
distractor_direction:
  label: Winter-regret recurrence
  description: Anticipating that cancelling the gym will lead to the same winter motivation
    collapse experienced after previous cancellations.
plausible_alternative_directions:
- label: Infrequent-use correction
  description: Reducing membership to a cheaper pay-as-you-go plan rather than cancelling
    entirely in case specific equipment becomes needed.
- label: Seasonal weather disruption
  description: Upcoming unusual weather patterns or a change in schedule might disrupt
    the outdoor routine in ways not captured by historic data.
