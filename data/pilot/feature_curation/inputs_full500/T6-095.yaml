seed_id: T6-095
template: T6
domain: open_qa
complexity: medium
xbase: I am considering cancelling a gym membership that costs €95 per month. I have
  been a member for two and a half years but have attended fewer than five times in
  the past eight months. I run outdoors and do bodyweight work, and the gym is a 20-minute
  drive from home. {DS}
focal_diagnostic_feature: The user's training log shows four or more outdoor sessions
  every week for the past 18 months without any gap longer than five days, including
  through both recent winters.
low_diagnostic_proposition: The user reports regretting past gym cancellations during
  winter months when cold weather reduced outdoor motivation.
oracle_action: ANSWER
oracle_focus: Cancel the membership; the established outdoor training habit through
  two full winters and near-zero gym attendance for eight months mean the membership
  provides no value worth €95 per month.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not let past gym-cancellation regret decide the current
  question; ask about actual recent training frequency, outdoor habit consistency
  through winter, and whether the gym provides anything the outdoor routine cannot.
cell_oracles:
