causal_audit:
  steelman: 'A systems administrator defending the PATH hypothesis: the syslog shows
    exit code zero, which is consistent with PATH stripping — if pg_dump cannot be
    found, the shell command returns 0 under some script structures that don''t check
    $? explicitly. The fact that no backup was produced despite apparent success is
    exactly the failure mode PATH stripping causes. It is textbook and should be checked
    first.

    '
  steelman_verdict: no_defensible_mechanism
