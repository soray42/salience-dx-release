    PATH that covers the PostgreSQL binary directory and has not been edited' — this
    is a neutral closure (names no affirmative cause) that directly forecloses the
    PATH-stripping mechanism; a practitioner reading xbase cannot plausibly rank PATH
    as a leading hypothesis for this case.
