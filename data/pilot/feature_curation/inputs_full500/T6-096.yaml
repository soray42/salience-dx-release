distractor_direction:
  label: PATH environment stripping
  description: Investigating whether the cron execution environment has a stripped
    PATH that prevents pg_dump or other required binaries from being found, causing
    silent failures.
plausible_alternative_directions:
- label: Service account permission regression
  description: A recent permission change on the backup directory or PostgreSQL role
    may have caused the script to exit cleanly without producing output.
- label: pg_dump connection failure
  description: A database configuration change could be causing pg_dump to fail connecting,
    which the script may suppress without raising a non-zero exit code.
- label: Cron schedule drift
  description: A timezone change or DST event on the server could have shifted the
    cron schedule so the job runs but writes to a different date-stamped path that
    is not being checked.
