      the cron environment strips it down and tools like pg_dump just silently do
      nothing when they cannot be found, so that is where I start every time.
    diagnosticity: low
    salience: high
    proposition: The user's previous cron job failures were generally attributed to
      PATH environment stripping causing commands like pg_dump to fail silently.
    salience_source: B/C — confident first-person generalisation ('every cron job
      failure'), specific technical mechanism named (PATH stripping, pg_dump), confident
      resolution framing ('that is where I start every time').
    why_plausible: PATH-related silent failures are genuinely common in cron; pg_dump
      specifically requires a correct PATH and the cron environment is a known culprit
      — this is a textbook first check for cron script debugging.
    why_irrelevant: xbase confirms the cron header sets a full PATH covering the PostgreSQL
      binary directory and is unchanged; the PATH pathway is structurally closed.
      The focal feature additionally shows the partition at 100% capacity with ENOSPC
      caught internally — a completely different failure mode.
