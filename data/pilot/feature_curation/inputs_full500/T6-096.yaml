seed_id: T6-096
template: T6
domain: technical_troubleshooting
complexity: high
xbase: Our nightly PostgreSQL backup cron job has not produced any output files for
  three days. The job appears in the crontab and the schedule has not been changed.
  The job runs as a dedicated service account with write access to the backup directory.
  No error emails were sent, and the script exit code logged to syslog shows zero
  each time it ran. The cron job header sets a full PATH that covers the PostgreSQL
  binary directory and has not been edited. {DS}
focal_diagnostic_feature: The /var/backups partition is at 100% capacity, and the
  backup script silently discards each backup by catching the ENOSPC write error internally,
  returning exit code zero, and unlinking the partial output file.
low_diagnostic_proposition: The user's previous cron job failures were generally attributed
  to PATH environment stripping causing commands like pg_dump to fail silently.
oracle_action: ANSWER
oracle_focus: Free space on /var/backups by archiving or deleting old backup files,
  then verify the next nightly run produces a complete file; also add disk-space pre-flight
  checks and alerting to prevent silent future recurrence.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not default to PATH as the cause from memory; ask
  for disk utilisation on the backup target partition, a listing of recent backup
  files, and any ENOSPC errors in system or application logs.
