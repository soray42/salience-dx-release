causal_audit:
  steelman: 'File permission errors on the destination are a real and recurring rsync
    problem,

    especially when migrating between drives with different owner UIDs or when the

    destination is mounted with restrictive umask settings. A user who has hit this

    pattern repeatedly is right to treat it as a first hypothesis. If the symlinks

    appeared to copy but then fail to resolve, a permission on the symlink target

    directory could plausibly explain it for someone who hasn''t yet inspected file
    types.

    '
  steelman_verdict: no_defensible_mechanism
  pathway_closed_in_xbase: N/A — the permissions hypothesis is not foreclosed by xbase;
    the focal evidence (destination entries are plain files, not symlinks) lives in
    HH/LH, preserving C4.
