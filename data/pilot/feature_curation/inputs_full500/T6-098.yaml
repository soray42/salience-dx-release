seed_id: T6-098
template: T6
domain: technical_troubleshooting
complexity: medium
xbase: I migrated my home server project directory from one drive to another using
  rsync last night. After the migration, several application configs that used symbolic
  links now point to missing targets or the wrong locations. The files themselves
  copied over fine. I have used rsync for drive migrations a few times before. {DS}
focal_diagnostic_feature: The rsync command was run without the --links flag, causing
  symlinks to be copied as regular files rather than preserved as symbolic links.
low_diagnostic_proposition: Past rsync migration problems for this user have generally
  been caused by incorrect file permissions on the destination, so this is probably
  a permissions issue.
oracle_action: ANSWER
oracle_focus: Re-run the rsync with --links (or -l) to migrate symlinks correctly;
  remove the plain files created in place of symlinks and replace them with proper
  symbolic links pointing to the intended targets.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not assume a permissions fault from prior migration
  history. Ask whether the rsync command included --links and whether the destination
  entries are plain files or actual symlinks.
