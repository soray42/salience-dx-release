distractor_direction:
  label: Destination permissions fault
  description: Investigating whether incorrect ownership or permission bits on the
    destination drive are preventing symlinks from resolving or being accessed correctly.
plausible_alternative_directions:
- label: Absolute symlink path breakage
  description: Even if symlinks were copied correctly, symlinks with absolute paths
    pointing to the old drive location would be broken on the new drive regardless
    of the copy mode used.
- label: Destination filesystem symlink support
  description: If the destination drive uses a filesystem that does not support symbolic
    links (e.g., FAT32 or exFAT), symlinks cannot be preserved regardless of rsync
    flags.
- label: Partial transfer or rsync error
  description: An interrupted rsync run may have left some symlink targets absent
    from the destination, producing broken links even if the copy mode was correct.
