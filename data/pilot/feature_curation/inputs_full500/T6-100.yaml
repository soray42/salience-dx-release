seed_id: T6-100
template: T6
domain: technical_troubleshooting
complexity: high
xbase: My six-drive ZFS RAIDZ2 pool on a home NAS has shown a degraded state for three
  days, with no drive showing as offline in `zpool status`. The pool is still serving
  data but read-back checksums are occasionally failing according to the scrub log.
  I replaced the HBA about eight months ago but have not touched the drives since
  the original build two years ago. {DS}
focal_diagnostic_feature: zpool status -v shows checksum errors concentrated on a
  single HBA port rather than on any individual drive, all drive SMART self-tests
  pass clean, and dmesg logs PCIe correctable errors from the HBA.
low_diagnostic_proposition: The ZFS pool degradation is caused by a dying drive, as
  has happened before with this pool.
oracle_action: ANSWER
oracle_focus: Replace or reseat the HBA; the PCIe correctable errors and port-concentrated
  checksum pattern point to a faulty controller, not any drive.
low_diagnostic_oracle_action: ASK
low_diagnostic_oracle_focus: Do not adopt the drive-failure diagnosis from past experience
  alone; ask for per-drive SMART results, zpool status -v checksum error distribution,
  and dmesg HBA/controller messages.
