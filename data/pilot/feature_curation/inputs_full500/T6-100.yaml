  notes: 'T6 availability inference ("so it is probably the same thing again") is
    propositional content

    per the instrument: it appears in HL ("another one doing the same thing") and
    in LL

    ("this is probably another drive failure"). C1 satisfied.

    xbase mentions HBA replacement (8 months ago) as context, not as a conclusion
    — this makes

    controller a live alternative from xbase without foreclosing the drive-failure
    direction.

    "quietly dying" in HL is vivid narrative color (salience dimension B) not a new
