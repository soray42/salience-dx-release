distractor_direction:
  label: Dying drive hardware failure
  description: Investigating whether one of the six pool drives is beginning to fail
    and producing the checksum errors that put the RAIDZ2 pool into a degraded state,
    as occurred in the user's two prior pool degradation events.
plausible_alternative_directions:
- label: RAM ECC error corruption
  description: Uncorrected memory errors in the NAS can corrupt in-flight data and
    be reported by ZFS as checksum errors on otherwise healthy drives and controller
    paths.
- label: ZFS pool metadata corruption
  description: The pool's on-disk metadata or labels may have been partially corrupted
    by a prior unclean shutdown, causing intermittent read-back failures independent
    of drive or controller health.
- label: Thermal throttling on HBA
  description: The HBA may be overheating in an undersized NAS enclosure, causing
    intermittent data errors that manifest as ZFS checksum failures without producing
    hard PCIe faults visible in SMART.
